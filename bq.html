 dégradé). À revoir lors d'une session dédiée à partir des documents officiels (KNF Cho Han Kyu, JADAM Cho Youngsang, LiFoFer guide-lff-2018).\n", "type": "doctrine", "crit": true}]}, "session": {"nom": "Gestion de session", "entries": [{"id": 70, "titre": "Git — toujours travailler sur main", "contenu": "**Règle** : travailler directement sur `main`. Pas de branches.\n\nLe projet est géré par un seul utilisateur + Claude Code. Les branches ajoutent de la complexité inutile (merge, stash, divergence) sans bénéfice.\n\n- `git commit` sur main\n- `git push origin main`\n- Pas de `git checkout -b`, pas de PR, pas de merge\n- Si l'environnement force une branche (Claude Code web), merger dans main dès que possible\n", "type": "contrainte", "crit": true}, {"id": 64, "titre": "maintenance_sessions — journal de bord", "contenu": "Journal de bord des sessions Claude Code.\n\n**Depuis Session C (2026-05-05) : filesystem natif** dans `jmj/rapports/session/<slug>.md`. La table `maintenance_sessions` a été droppée. Les champs sont regroupés dans le bloc `session:` du frontmatter YAML (cf. BQ #119 pour le format complet).\n\n**Procédure :**\n1. **Fin de session** : `session_end.py` lit `jmj/.pending_session_recap.md`, valide les champs, écrit dans `jmj/rapports/session/<slug>.md` avec frontmatter (champs racine + bloc `session:`)\n2. **Pas de rapport intermédiaire** — un seul fichier en fin de session\n3. Si plusieurs sessions dans la journée → 1 fichier par session (slug unique requis)\n\n**Champs obligatoires** (validés par `session_end.write_session_recap_to_fs`) :\n`slug`, `titre`, `date_session`, `ts_start`, `objectif`, `actions`, body markdown non vide.\n\n**Champs optionnels (bloc `session:`)** : `ts_end`, `declencheur`, `etat_avant`, `etat_apres`, `decisions`, `scripts_touches`, `tables_touchees`, `reste_a_faire`, `alertes`, `commit_refs`, `cout_estime`.\n\n**Consultation programmatique :**\n```python\nfrom reports_inventory import list_reports\nfor r in list_reports(categorie='session_recap'):\n    fm = r['frontmatter']\n    print(fm.get('ts_start'), fm.get('titre'))\n```\n\n**Recherche par grep** (filesystem = grep direct, plus de SQL nécessaire) :\n```bash\ngrep -l \"thesaurus\" jmj/rapports/session/*.md\n```\n\n**Historique** : 104 maintenance_sessions migrées en Session C vers `jmj/rapports/session/`. Les 25 entrées orphelines (sans `audit_reports.session_recap` matching, pre-BQ #119) ont été reconstruites avec slug forgé `session_<date>_<objectif_short>_legacy_<id>`.\n", "type": "instruction", "crit": true}, {"id": 78, "titre": "Nouveau script — checklist d'enregistrement", "contenu": "Après création d'un nouveau script Python dans `tools/` :\n\n1. Ajouter les imports partagés :\n   ```python\n   sys.path.insert(0, str(Path(__file__).resolve().parent.parent / 'lib'))\n   from db import get_connection\n   from cli import add_db_arg, check_db\n   ```\n2. Utiliser `add_db_arg(parser)` au lieu de `parser.add_argument('--db', ...)`\n3. Utiliser `check_db(args.db)` pour valider l'existence de la DB\n4. Utiliser `get_connection(args.db)` au lieu de `sqlite3.connect()` + `get_connection (inclut row_factory)`\n5. `git add tools/<folder>/<nom>.py` puis commit\n6. Verifier : `from scripts_inventory import list_scripts` puis filtrer par nom\n7. Si le script génère des fichiers → l'ajouter dans `regen_all.py`\n\n**Pour les scripts `batch/` et `batch/` (archivé)** (qui importent via `from lib.xxx`) :\n```python\nsys.path.insert(0, str(Path(__file__).resolve().parent.parent))\nfrom lib.db import get_connection\nfrom lib.cli import add_db_arg, check_db\n```\n", "type": "instruction", "crit": false}, {"id": 119, "titre": "Rituel de clôture de session — session_end.py", "contenu": "## Rituel session_end.py\n\n```bash\npython3 tools/admin/session_end.py --db sol_vivant.db\n```\n\n**Séquence obligatoire** :\n1. Vérif working tree propre + branche courante\n2. Régénération des pages (via `regen_all.py` — 15 générateurs)\n3. `check_integrity.py` (validation DB)\n4. **Écriture rapport de session en filesystem** (Session C, 2026-05-05) :\n   - `jmj/rapports/session/<slug>.md` avec frontmatter YAML\n   - Champs racine (slug, titre, categorie, date_session, ts_start/end, tags, stats_summary)\n   - Bloc `session:` (objectif, declencheur, actions, decisions, etat_avant/apres, scripts_touches, tables_touchees, reste_a_faire, alertes, commit_refs)\n   - Body markdown = ancien content_md\n5. `git add` étendu : sol_vivant.db, Publications/, MANIFEST.md, README.md, tools/, jmj/analyses/reports/, audit_reports/, jmj/rapports/\n6. Commit avec message structuré\n7. `git push origin claude/<branche-session>`\n8. `git checkout main && git merge --ff-only` + push\n9. Alignement origin/claude/<branche> sur main + suppression branche locale\n\n### Workflow session_recap (étape 4)\n\n**Avant** de lancer `session_end.py`, Claude écrit le narratif dans :\n\n```\njmj/.pending_session_recap.md\n```\n\nFormat = YAML frontmatter + body markdown. Le body markdown est conservé tel quel après le bloc frontmatter.\n\n```yaml", "type": "commande", "crit": true}, {"id": 128, "titre": "Session Claude Code — démarrage + clôture", "contenu": "## Workflow Session — démarrage + clôture\n\n### Démarrage (toujours, en premier)\n\n```bash\npython3 tools/admin/session_start.py --db sol_vivant.db\n```\n\nCe script fait tout :\n1. **Sync git** — fetch origin/main, checkout main, rebase si besoin. Les commits fantômes d'une ancienne session sont écrasés (par design, cf. CLAUDE.md)\n2. **Backup DB** — snapshot horodaté de `sol_vivant.db` dans `jmj/session/`\n3. **Dashboard** — chiffres vitaux : termes, fiches, chaînes, concept cards, dettes, commits récents\n4. **Intégrité** — check rapide (0 criticité attendue)\n5. **Règles actives** — affichage des BQ critiques (depuis `config.claude_rules`)\n\n**Après le démarrage** : la plateforme Claude Code web impose une branche `claude/<nom-session>`. Claude travaille sur cette branche puis propage vers main en clôture.\n\n### Pendant la session (flux standard)\n\n```\n1. Lire le dashboard\n2. Comprendre la demande JMJ\n3. Chercher dans BQ si pattern applicable :    bq_query.py --search <mot>\n4. Faire (éditer DB / scripts / Publications/)\n5. Régénérer : python3 tools/regen_all.py --db sol_vivant.db (si outputs touchés)\n6. check_integrity.py --db sol_vivant.db\n7. Commit + push (sur la branche claude/ imposée)\n```\n\n### Clôture de session (obligatoire avant de rendre la main)\n\nLe workflow est **mono-utilisateur** avec DB **binaire non mergeable**. Laisser du travail sur une branche feature → collision garantie (JMJ merge manuellement dans GitKraken).\n\n**Séquence fast-forward uniquement** :\n\n```bash\n# 1. Working tree propre\ngit status   # rien à committer\n\n# 2. Push de la branche courante\ngit push -u origin claude/<branche-session>\n\n# 3. Propagation vers main\ngit checkout main\ngit pull origin main\ngit merge --ff-only claude/<branche-session>\ngit push origin main\n```\n\n**Si le FF échoue** (ne devrait jamais arriver en mono-session) → STOP, demander à JMJ.\n\n**Rester sur `main`** à la fin + annoncer explicitement à JMJ que la session est close.\n\n### Clôture prématurée (test en cours de session)\n\nSi JMJ demande à tester un fichier (script, HTML, export), Claude exécute la même séquence immédiatement, reste dispo sur `main` pour le test, puis reprend les modifs suivantes sur la branche `claude/…` imposée par la plateforme.\n\n### Scripts annexes\n\n| Script | Usage |\n|---|---|\n| `tools/admin/bq_query.py --domaine fiches` | Relire ce module |\n| `tools/admin/check_integrity.py` | Valider l'état DB à tout moment |\n| `tools/admin/session_end.py` | (optionnel) rituel de clôture formel avec résumé |\n\n### BQ liées\n\n- Règles absolues → #1 (carte), #70 (git main), #73 (DB source de vérité)\n- Maintenance détail → module `maintenance` (scripts, journal, check)\n\n\n### Path de sortie — config\n\nLe rapport de cloture va dans `jmj/rapports/session/<slug>.md` (filesystem natif depuis Session C, frontmatter YAML + body markdown)\n(= `jmj/rapports/session/`). Utiliser `get_path(conn, 'rapports_session',\nensure_exists=True)`. Fichier nomme `rapport_YYYY-MM-DD.md`.\n\nVoir BQ #134 pour la structure jmj/ complete.\n", "type": "workflow", "crit": true}, {"id": 90, "titre": "Environnement — pas de binaire sqlite3, utiliser python3", "contenu": "Le binaire `sqlite3` **n'est pas installé** dans l'environnement Claude Code (erreur `sqlite3: command not found`).\n\n**Toujours utiliser le module Python** pour interroger la DB :\n\n```bash\npython3 -c \"\ncon = get_connection('sol_vivant.db')\nfor r in con.execute(\"SELECT ... FROM ...\"):\n    print(dict(r))\n\"\n```\n\n**Note** : dans les scripts, toujours utiliser `get_connection()` de `lib/db.py` (inclut `row_factory=Row`). L'import direct `sqlite3.connect` n'est utilisé que dans les one-liners CLI.\n\n**Ne jamais tenter** `sqlite3 sol_vivant.db \"...\"` — ça échoue systématiquement.\n", "type": "contrainte", "crit": true}]}, "sources-autoritaires": {"nom": "Sources autoritaires externes", "entries": [{"id": 114, "titre": "Doctrine alignement INRAE — corpus = référence, INRAE = préférence", "contenu": "## Doctrine d'alignement INRAE — préférence, pas autorité\n\n**Règle** : le corpus *Le Sol Vivant cet Holobionte* est la **référence**.\nLe thésaurus INRAE (v2.6, ~16 500 concepts) est une **préférence d'alignement**\nquand c'est pertinent, pas une autorité qui primerait sur le corpus.\n\n### Justification\n\nLe corpus est alimenté exclusivement par :\n- Jenni AI avec sources académiques uniquement (pas de vulgarisation non sourcée)\n- Analyses croisées Claude sur les fiches intégrées\n- Validation JMJ (cohérence doctrinale)\n\nIl est **spécialisé** (agriculture régénératrice, biologie des sols fine,\nfermentations KNF/JADAM, holobionte, continuum sol-plante-humain) alors que\nINRAE est généraliste (toute l'agriculture + environnement).\n\nStatistiquement : au 2026-04-13, sur 900 termes corpus, **81% sont hors INRAE**.\nCe n'est pas une dette à combler, c'est une **spécificité assumée**.\n\n### Usage d'INRAE (ce qu'on fait)\n\n1. **Enrichissement synonymes** (`sync_syn_inrae.py`) : pour les 138 matchs\n   parfaits, on ajoute les altLabel INRAE comme synonymes (syn_fr, syn_en).\n   Non-destructif : on n'écrase jamais une valeur corpus.\n\n2. **Signal de divergence** : quand FR est identique mais EN diverge, on\n   génère un docx d'arbitrage (`export_mismatches_inrae.py`). JMJ arbitre\n   cas par cas (conserver corpus / adopter INRAE / fusion en synonyme).\n\n3. **Benchmark audit** : la section BENCHMARK INRAE dans `audit_opus.py`\n   sert à positionner le corpus (part de spécificité vs alignement), pas\n   à détecter des erreurs.\n\n### Usage d'INRAE (ce qu'on ne fait pas)\n\n- ❌ Corriger automatiquement les EN du corpus sur INRAE\n- ❌ Supprimer les termes corpus qui n'ont pas d'équivalent INRAE\n- ❌ Considérer un mismatch EN comme une erreur à corriger d'office\n\n### Cas concrets (2026-04-13)\n\n**Mismatches où le corpus est plus précis ou plus actuel** :\n- `Rhizophagus irregularis` (corpus) vs `Rhizophagus` (INRAE) → corpus gardé\n- `systemic acquired resistance (SAR)` (corpus) vs `systemic acquired\n  resistance` simple (INRAE sans acronyme) → corpus gardé\n\n**Mismatches où INRAE propose une version plus récente** :\n- `Proteobacteria` (corpus) vs `Pseudomonadota` (INRAE, dénomination récente\n  GTDB) → à arbitrer\n\n**Mismatches cosmétiques** :\n- `externalités` pluriel (corpus) vs `externalité` singulier (INRAE) →\n  décidé au cas par cas par JMJ\n\n### Référence\n\nCe document formalise la position exprimée par JMJ le 2026-04-13 après\nl'intégration d'INRAE comme référentiel auxiliaire.\n", "type": "regle", "crit": true}, {"id": 131, "titre": "Doctrine Shift Project — source autoritaire transition FR", "contenu": "## Doctrine — The Shift Project comme source autoritaire pour la transition FR\n\nLe Shift Project (fondé par Jean-Marc Jancovici) est la référence de fait pour\ntoute analyse chiffrée de la transition énergie-climat en France. Scientifiquement\nsolide, consensus d'experts, revue par pairs interne, méthodologie transparente.\n**Les données Shift ne nécessitent pas de re-vérification** — elles sont intégrées\ntelles quelles dans le corpus, avec attribution claire.\n\n### Sources Shift disponibles dans la DB\n\n- **`jenni_sources` #1667** — The Shift Project (organisation, 2026)\n- **`jenni_sources` #1668** — Carbone 4 (cabinet conseil Jancovici, paire)\n- **`jenni_sources` #1669** — **Rapport final PREF 2026** — « Réussir la transition\n  dans l'incertitude : la méthode Shift en 20 chantiers » (340 pages, avril 2026)\n  → `jmj/pdf/Reussir-dans-lincertitude-SHIFT-PROJECT-avril-2026.pdf`\n- **`jenni_sources` #1670** — Synthèse PREF 2026 (28 pages)\n  → `jmj/pdf/PREF_Shift-Project_Transition-robuste_14-avril-2026.pdf`\n\n### Tables dérivées du PREF 2026\n\n- **`refs` (kind=esclave_energ)** — sections `france_*` (88 params validés)\n  - `france_macro` — 8 params (émissions FR, conso énergie/élec, cibles 2050)\n  - `france_energie` — 5 params (fossiles, exposition, objectifs PTEF)\n  - `france_secteurs` — 3 params (transport, industrie, bâtiment)\n  - `france_scenarios_2050` — 13 params (trajectoires H/I/B)\n  - `france_agriculture` — 14 params (azote, Haber-Bosch, légumineuses)\n  - `france_elevage` — 15 params (bovins, revenus, CH4, ETP)\n  - `france_puits_c` — 15 params (prairies, couverts, haies, agroforesterie)\n  - `france_foret` — 10 params (mortalité, essences, scolytes, sols)\n  - `france_historique` — 1 param (COVID)\n\n- **`refs` (kind=shift_chantier)** — les 20 chantiers avec variantes H/I/B\n  - Cœur de corpus (4) : ch.14 Azote, ch.15 Élevage, ch.18 Bioénergies partiel, ch.19 Puits C\n  - Hors scope (16) : transports, bâtiment, numérique, industrie, production électrique\n\n### Règle de priorité\n\n1. **Pour une donnée France agri/énergie/climat** : chercher d'abord dans\n   `refs` (kind=esclave_energ) sections `france_*` ou `refs` (kind=shift_chantier).\n   Si présente → source unique Shift PREF 2026.\n2. **Conflit Shift vs autre** : priorité Shift (sauf si autre source est\n   primaire physique — Smil, Even, Fuller — pour les constantes physiques).\n3. **Chiffres cités dans fiches / validations / calculateurs** : format\n   `(Shift Project, 2026, p.X)` + lien source jenni_sources.\n4. **Ne jamais re-calculer Jancovici** — c'était l'erreur de la session\n   précédente. Les références physiques (PCI, rendements, puissance humaine)\n   restent Smil 2017 / Fuller 1938 ; le cadre transition FR reste Shift.\n\n### Contrepartie\n\n- Sources académiques individuelles (Jenni) → vérification systématique\n- Livres primaires (Fuller, Smil, Jancovici grand public) → vérification allégée\n- **Rapports institutionnels autoritaires (Shift, Carbone 4, ADEME, HCC, CITEPA)\n  → acceptés sans re-vérification**\n", "type": "doctrine", "crit": true}]}}, "corpus": {"chaines": {"nom": "Chaînes causales", "entries": [{"id": 144, "titre": "Chaînes causales — concept, structure, workflow", "contenu": "## Chaînes causales — concept, structure, workflow\n\nLes **chaînes causales** (`chains_causales`) sont les démonstrations narratives transverses du corpus Sol Vivant. Elles relient des mécanismes scientifiques étape par étape à travers les strates (F→S→V→P→H), rendant visible l'enchaînement causal d'un phénomène depuis sa racine jusqu'à ses conséquences globales.\n\n### Ce qu'une chaîne EST\n\n- Un **outil pédagogique transverse** : une chaîne traverse plusieurs docs et plusieurs strates, alors qu'une fiche zoome sur un point précis.\n- Un **argumentaire pour les prompts** : `prompts.contexte_sci` peut invoquer une chaîne pour illustrer une causalité de bout en bout.\n- Une **démonstration scientifique** : chaque étape doit être étayée par le thésaurus (`terms`) et la littérature interne (`jenni_sources`).\n\n### Ce qu'une chaîne N'EST PAS\n\n- Ce n'est pas une fiche (zoom ponctuel).\n- Ce n'est pas un schéma libre : chaque étape doit pointer vers un terme canonique du thésaurus.\n- Ce n'est pas un texte rédigé par Jenni : les chaînes sont rédigées par Claude/JMJ en direct (workflow spécifique, pas de cycle prompt Jenni).\n\n### Structure DB\n\n```sql\n-- Table des chaînes\nCREATE TABLE chains_causales (\n  id TEXT PRIMARY KEY,              -- C1, C2, ..., C16 (format \"C<N>\", préfixe C obligatoire)\n  titre TEXT NOT NULL,              -- \"A → B\" (flèche unicode comme séparateur)\n  docs_traverses TEXT,              -- \"P2/S4/S2/...\" (slash-joined, ordre des strates visitées)\n  valeur_ajoutee TEXT,              -- argumentaire pour les décideurs / enseignants\n  created_at TEXT\n);\n\n-- Étapes d'une chaîne (1-N)\nCREATE TABLE chain_etapes (\n  id INTEGER PRIMARY KEY AUTOINCREMENT,\n  chain_id TEXT REFERENCES chains_causales(id),\n  position INTEGER NOT NULL,        -- 1, 2, 3, ... (ordre narratif)\n  term_id INTEGER REFERENCES terms(id),  -- OBLIGATOIRE : terme pivot canonique\n  term_fr_text TEXT,                -- miroir lisible du terme (DOIT correspondre à terms.fr)\n  strate_etape TEXT,                -- F | S | V | P | H (strate de l'étape, peut différer du doc_code)\n  role_dans_chaine TEXT             -- rédaction 1-3 phrases qui LIE explicitement à la position précédente\n);\n```\n\n### Conventions (incidents 2026-04-11 → règles)\n\n1. **Numérotation** : `C<N>` uniquement (C1, C2, ..., C16). Pas de 0-padding, pas de préfixe doc.\n2. **Pas de placeholders `[XX]`** : les étapes créées en mars 2026 avaient `term_fr_text = '[P2]'` — incident résolu par la session 22 qui a rédigé C1-C6 à partir de zéro (cf. audit_reports #32).\n3. **term_id obligatoire** : une étape sans `term_id` est un bug. Le terme doit exister dans `terms` avant insertion de l'étape.\n4. **Cohérence term_fr_text ↔ term_id.fr** : `term_fr_text` est un miroir lisible. Si un terme est renommé dans `terms.fr`, re-synchroniser les étapes concernées.\n5. **Pas de préfixes parasites dans role_dans_chaine** : la session 2026-04-11 (audit #34) a retiré 13 préfixes `[P2]`, `[S4]` ajoutés par erreur lors de la rédaction automatique.\n6. **Lien narratif explicite** : chaque `role_dans_chaine` (sauf position 1) doit relier l'étape à la précédente par un verbe de liaison causale (\"→ alimente\", \"→ favorise\", \"→ transfère\").\n\n### Workflow création (pattern validé session 22)\n\nPattern `agent_runner` pour une chaîne complète (N étapes → 1 agent dédié) :\n\n1. **Préparer le contexte** (JSON par chaîne) :\n   - `titre` + `valeur_ajoutee`\n   - liste ordonnée des positions avec `doc_code` + titre du doc correspondant\n   - thésaurus filtré : pour chaque position, tous les termes dont `doc_code` contient le code doc cible (~80 candidats par position)\n2. **Lancer 1 agent par chaîne** (général-purpose, parallèle massif) avec mission :\n   - Choisir 1 terme pivot par position parmi les candidats\n   - Rédiger `role_dans_chaine` (1-3 phrases, liaison explicite à la position précédente)\n   - Maintenir cohérence narrative avec `titre` + `valeur_ajoutee`\n   - Sortir JSON strict : `{chain_id, etapes: [{position, doc_code, term_id, term_fr_text, role_dans_chaine, justification_choix}]}`\n3. **Consolider** : valider `term_id` existe, `strate_etape` cohérente, INSERT chain_etapes.\n4. **Référence de style** : pointer les agents vers les chaînes déjà rédigées (C7, C8, C9 après avril 2026, puis toutes les 16 après la session 22).\n\n### Workflow édition\n\n- **Changer un terme pivot** : UPDATE `term_id` + resynchroniser `term_fr_text` + réécrire `role_dans_chaine` si la connexion narrative change.\n- **Réordonner** : UPDATE `position`. Attention à la liaison narrative (1→2, 2→3...) qui dépend de l'ordre.\n- **Ajouter une étape** : shift des positions suivantes, puis INSERT avec le term_id canonique.\n- **Supprimer une étape** : vérifier qu'aucune `role_dans_chaine` suivante ne fait référence explicite à ce terme.\n\n### Articulation avec le corpus\n\n| Table amont/aval | Rôle | Obligatoire |\n|---|---|---|\n| `terms` | Terme pivot de chaque étape (`chain_etapes.term_id`) | Oui |\n| `documents` | Strates traversées (`chains_causales.docs_traverses`) | Oui |\n| `jenni_sources` | Étayage scientifique dans `role_dans_chaine` (via référence textuelle) | Recommandé |\n| `concept_cards` | Concept(s) renforcés par la chaîne (via `card_chain_links`) | Optionnel |\n| `fiches` | Certaines fiches transversales invoquent des chaînes | Optionnel |\n| `prompts.contexte_sci` | Les chaînes peuvent être citées comme argumentaire | Optionnel |\n\n### Requêtes utiles\n\n```sql\n-- Inventaire des chaînes\nSELECT id, titre, docs_traverses FROM chains_causales ORDER BY CAST(substr(id,2) AS INTEGER);\n\n-- Chaîne détaillée\nSELECT position, strate_etape, term_fr_text, role_dans_chaine\nFROM chain_etapes WHERE chain_id='C1' ORDER BY position;\n\n-- Audit : étapes sans term_id (bug)\nSELECT chain_id, position, term_fr_text FROM chain_etapes WHERE term_id IS NULL;\n\n-- Audit : placeholders résiduels\nSELECT chain_id, position, term_fr_text FROM chain_etapes\nWHERE term_fr_text LIKE '[%' OR role_dans_chaine LIKE '%[%]%';\n\n-- Audit : term_fr_text désynchronisé de terms.fr\nSELECT ce.chain_id, ce.position, ce.term_fr_text, t.fr\nFROM chain_etapes ce JOIN terms t ON t.id=ce.term_id\nWHERE ce.term_fr_text != t.fr;\n```\n\n### Historique et sessions de référence\n\n- **2026-03-20** : création initiale C1-C9 avec placeholders `[XX]` (jamais rédigé).\n- **2026-04-11 Session 22** :\n  - `audit_reports #32` — rédaction C1-C6 (43 étapes, 6 agents parallèles)\n  - `audit_reports #33` — création C10-C16 (7 chaînes, 56 étapes)\n  - `audit_reports #34` — harmonisation C7-C9 + retrait 13 préfixes parasites\n- **État actuel** : 16 chaînes, 121 étapes, aucun placeholder, toutes les étapes liées à un `term_id`.\n\n### Scripts consommateurs\n\n- `tools/admin/check_integrity.py` (audit placeholders + FK term_id)\n- `tools/admin/audit_opus.py` (inventaire des chaînes)\n- `tools/docs/gen_web.py` + `gen_dashboard.py` (rendu cartographie onglet \"Chaînes\")\n- `tools/docs/gen_concept_cards.py` (liens `card_chain_links`)\n- `tools/docs/gen_explorer.py` (exploration via interface web)\n\n\n### Audit\n\nPour l'audit régulier des chaînes (étapes nourries, étapes orphelines, nouvelles chaînes implicites), voir BQ `audit_corpus` (#156) §C1-C3.\n", "type": "reference", "crit": true}]}, "concept-cards": {"nom": "Cartes de concept", "entries": [{"id": 153, "titre": "LiFoFer — position pédagogique du corpus sur le repiquage (pas une règle universelle)", "contenu": "**Préambule** : il n'y a pas de règle universelle sur la réactivation/repiquage en LiFoFer. Chaque praticien adapte selon son échelle, son matériel et ses contraintes. La position ci-dessous est celle **retenue pour le corpus** (cohérence pédagogique), elle n'arbitre pas les pratiques.\n", "type": "doctrine", "crit": false}, {"id": 151, "titre": "pedago_links — table générique entité ↦ concept_card (passerelle pédagogique)", "contenu": "## pedago_links — table générique de liens « entité ↦ concept_card »\n\n**Mécanisme** : table normalisée, FK vers `concept_cards`, qui permet de\nproposer pédagogiquement à l'utilisateur, à côté de toute entité du corpus\n(fiche, doc de strate, règle C/N, terme, matière), les concept cards\nles plus pertinentes pour aller plus loin.\n\n### Schéma\n\n```sql\nCREATE TABLE pedago_links (\n    id          INTEGER PRIMARY KEY AUTOINCREMENT,\n    entity_type TEXT NOT NULL CHECK(entity_type IN ('fiche', 'doc', 'regle', 'terme', 'matiere')),\n    entity_id   INTEGER NOT NULL,\n    card_id     INTEGER NOT NULL REFERENCES concept_cards(id) ON DELETE CASCADE,\n    role        TEXT NOT NULL DEFAULT 'reference' CHECK(role IN ('primaire', 'reference', 'passerelle')),\n    ordre       INTEGER NOT NULL DEFAULT 0,\n    motif       TEXT,\n    created_at  TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    UNIQUE(entity_type, entity_id, card_id)\n);\nCREATE INDEX idx_pedago_links_entity ON pedago_links(entity_type, entity_id);\nCREATE INDEX idx_pedago_links_card   ON pedago_links(card_id);\n```\n\n**entity_id** :\n- pour `fiche` → `fiches.id`\n- pour `doc`   → `documents.ROWID` (car PK = `code` TEXT, on stocke le ROWID INTEGER stable)\n- pour `regle` → `refs.legacy_id` (cn_regle ; même convention que mo_calc)\n- pour `terme` → `terms.id`\n- pour `matiere` → `refs.id`\n\n### Pourquoi une table et pas un JSON dans la colonne data\n\n- **FK = updates propagés** : si une card est désactivée/renommée, la jointure\n  active reste cohérente (on filtre `status='active'`). Un JSON figé pointerait\n  vers un ID qui n'existe plus.\n- **Vues inverses** : `SELECT entity_type, entity_id FROM pedago_links WHERE card_id=N`\n  donne instantanément « qui pointe vers cette card », utile pour l'audit.\n- **Évolution** : ajouter un nouvel entity_type est une simple modif du CHECK,\n  rien à migrer dans 50 colonnes JSON.\n\n### Workflow d'alimentation\n\n```\n1. tools/admin/pedago_links_suggest.py --entity fiche|doc\n   → audit_reports/pedago_links_proposed_<entity>_<date>.{md,json}\n   Score Overlap pondéré IDF + bonus titre :\n     - 70% recall(card_title, fiche_title)\n     - 30% recall(card_title, fiche_full)\n   Tokenizer : split sur '/' '-', stem singulier/pluriel, seuil 3 chars\n   (acronymes CEP/NPK/AMG indispensables).\n\n2. (Validation JMJ — édition manuelle du JSON si besoin)\n\n3. tools/admin/pedago_links_apply.py --json <rapport.json> --entity-type fiche|doc\n   → INSERT en bloc, role='primaire' pour top1 si score >= --primary-min,\n     role='reference' pour suivants si score >= --reference-min,\n     max --max-per-entity liens par entité.\n   --dry-run pour preview, --replace pour repartir de zéro.\n\n4. python3 tools/regen_all.py --db sol_vivant.db\n   → cahier.html, index.html (docs strates), pages outils via build_comprendre_data\n     affichent automatiquement le bloc « Pour aller plus loin — Concept Cards (N) »\n     juste avant Sources, sous chaque entité.\n```\n\n### Rendu côté front\n\nBloc `SvCollapse title='Pour aller plus loin — Concept Cards (N)' icon='🧭'`\ncontenant une liste verticale de liens vers `concept_cards.html#card-N` avec :\n- badge **#N** colorié selon `role` (info pour primaire, gris pour reference)\n- titre de la card\n\nPrésent actuellement dans :\n- **cahier.html** (sous chaque fiche déployée, via `gen_cahier.py`)\n- **index.html** (sous chaque doc strate, via `gen_web.py`)\n- **mo_calculateur.html** (sous chaque règle C/N via `cards_pedago` dans\n  `refs.cn_regle.data` — pré-existant, pattern complémentaire à pedago_links)\n- pages outils via `build_comprendre_data` (sections `fiche` enrichies)\n\n### Cas d'usage futurs\n\n- **Étendre** à `entity_type='regle'` (déjà fait dans cards_pedago via JSON,\n  à migrer vers pedago_links pour homogénéité)\n- **Étendre** à `entity_type='terme'` (un mot-clé ↦ cards qui le détaillent)\n- **Étendre** à `entity_type='matiere'` (matière MO ↦ cards minéralisation/immo)\n- **Audit hub** : `SELECT card_id, COUNT(*) FROM pedago_links GROUP BY card_id`\n  → cards qui sont les nœuds pédagogiques majeurs du corpus\n- **Cards orphelines** : `SELECT id FROM concept_cards WHERE id NOT IN\n  (SELECT card_id FROM pedago_links)` → cards jamais référencées comme\n  passerelle pédagogique, candidates à archivage ou enrichissement\n\n### Premier passage (2026-04-23)\n\n- 85 liens fiches (23 primaires + 62 références sur 34 fiches `integre*`)\n- 26 liens docs (8 primaires + 18 références sur 18 docs)\n- TOTAL : 111 liens\n- Cards-hubs émergentes : #55 Cycle eau (8), #68 M-genes (7),\n  #69 Mémoire transgénérationnelle (7), #31 Cycle N (5), #53 Cycle P (5)\n\n### Règle absolue\n\nToujours **passer par `pedago_links_suggest.py` puis `apply.py`** plutôt que\nd'éditer les liens à la main : le scoring est tracé via `motif`, et la\nreproductibilité (ré-exécuter sur un corpus enrichi) est garantie. Les\nexclusions manuelles s'éditent dans le JSON proposé avant `apply`.\n\n\n## Contexte\n\nDoctrine ajoutée 2026-04-23 lors de la généralisation du pattern « cards pédagogiques liées » apparu sur le calculateur MO (cards_pedago dans refs.cn_regle.data) puis étendu aux fiches et docs.\n", "type": "doctrine", "crit": true}, {"id": 106, "titre": "Concept cards — filtre de rigueur (« une affirmation bancale ne passe pas »)", "contenu": "## Concept cards — système de filtre de rigueur\n\n> **« Une affirmation bancale ne passe pas dans le corpus. »** (règle absolue JMJ)\n\nLes `concept_cards` sont l''**outil de filtre** qui garantit la qualité scientifique du corpus *Le Sol Vivant cet Holobionte*. Toute hypothèse captée — qu''elle vienne d''une note de vulgarisation, d''une intuition de lecture, d''un audit ou d''une fiche en construction — doit passer la confrontation aux dimensions conceptuelles et aux tests terrain avant d''être intégrée.\n\n### Position dans le workflow\n\n```\nCaptation (notes, lectures, intuitions)\n   ↓\nHypothèse formulée\n   ↓\n┌─────────────────────────────────────────────┐\n│ FILTRE concept_cards :                      │\n│   - Création/affinement de la carte         │\n│   - Positionnement dimension                │\n│   - Confrontation autres dimensions         │\n│   - Confrontation concept_card_tests        │\n│   - Cohérence corpus                        │\n└─────────────────────────────────────────────┘\n   ↓                            ↓\n✗ bancale                    ✓ solide\n   ↓                            ↓\narchive (mémoire de rejet)   active\n                                ↓\n                         Alimentation possible :\n                          - terms (nouveau terme canonique)\n                          - fiches (zoom proactif)\n                          - validations (confirmation/comblement)\n                          - prompts.contexte_sci/.enrichissement\n```\n\n### Architecture (tables existantes)\n\n#### `concept_dimensions` (12 axes)\n\n| ID | Dimension | Description |\n|---|---|---|\n| 1 | Cadre — Eau | Eau facteur limitant, modes d''application |\n| 2 | Cadre — Redox | Gradients redox, microzones, redox ladder |\n| 3 | Cadre — Économique | Coûts réels, énergie, filières |\n| 4 | Cadre — Socio-économique | Travail, filières, risques |\n| 5 | Cadre — Évolutif | Temporalité, évolution anaérobie→aérobie |\n| 6 | Types de sols | Comportements différenciés par texture |\n| 7 | Histoire | Histoire des sols : désastres et réussites |\n| 9 | Symptôme — MO/Hydrique | Stress MO, redox, stratégies adaptatives |\n| 10 | Symptôme — Structure | Compaction, asphyxie, diagnostic |\n| 11 | Pratique | ACS, diagnostic terrain, interventions |\n| 12 | Cycle | Cycles biogéochimiques (N, P, C, S...) |\n| 13 | Continuum | Continuum sol-plante-humain, résistome |\n\n#### `concept_cards`\n\n```sql\nCREATE TABLE concept_cards (\n    id           INTEGER PRIMARY KEY,\n    dimension_id INTEGER REFERENCES concept_dimensions(id),\n    title        TEXT,\n    description  TEXT,\n    scope_type   TEXT,\n    scope_ref    TEXT,\n    status       TEXT DEFAULT ''archive'',  -- active | archive\n    docs_codes   TEXT,    -- JSON [doc_code, ...]\n    sections     TEXT,    -- JSON [section, ...]\n    adapted      INTEGER, -- 0=archive brut, 1=adapté cartographie v2\n    source       TEXT,\n    category     TEXT,\n    notes        TEXT,\n    created_at   TEXT\n);\n```\n\n#### `concept_card_tests`\n\n```sql\nCREATE TABLE concept_card_tests (\n    card_id   INTEGER REFERENCES concept_cards(id),\n    test_id   INTEGER REFERENCES terrain_tests(id),\n    relevance REAL,\n    usage     TEXT,\n    PRIMARY KEY (card_id, test_id)\n);\n```\n\n→ Liens **carte ↔ test terrain** pour validation empirique. C''est l''ancrage qui empêche l''abstraction pure.\n\n### Cycle de vie\n\n```\n[création]\n  - Nouvelle hypothèse à tester (souvent issue d''une note vulga ou d''une lecture)\n  - Création d''une carte avec dimension, scope, description\n  - statut = ''archive'' par défaut\n   ↓\n[confrontation]\n  - Recherche de tests terrain pertinents → ajout dans concept_card_tests\n  - Vérification cohérence avec autres cartes de la même dimension\n  - Vérification cohérence avec corpus existant (docs_codes, sections)\n   ↓\n[verdict]\n  - ✓ Solide → status = ''active'' + adapted = 1 (cartographie v2) → utilisable\n  - ✗ Bancale → reste en archive (mémoire de rejet)\n   ↓\n[exploitation aval]\n  - Cartes ''active'' alimentent : terms, fiches, validations, prompts\n```\n\n### État actuel (2026-04-10)\n\n| Statut | Cartes | Notes |\n|---|---|---|\n| `active` | 4 | Toutes en dimension Cadre — Eau |\n| `archive` | 48 | Hypothèses non passées ou non encore confrontées |\n| Adaptées cartographie v2 | 4 | Sur 52 (8%) |\n\n**Observation** : le système concept_cards a été mis en place mais s''est mis en sommeil. Lourde réserve de matière à reprendre, mais ce n''est **pas urgent** — décision reportée à une phase ultérieure. Tant que la table existe et reste cohérente avec ce document, on peut la rebrancher quand on voudra.\n\n### Règles d''usage (à respecter)\n\n1. **Toute pépite captée dans une note volante** (BQ #102) doit créer ou affiner une concept_card avant d''être intégrée au corpus. Pas de raccourci.\n\n2. **Toute fiche nouvelle** doit s''appuyer sur au moins une concept_card cohérente. Si aucune carte existante ne couvre le sujet → en créer une et la confronter avant de produire la fiche.\n\n3. **Une carte en `archive` n''est pas ressuscitée à la légère** : elle représente une affirmation qui n''a pas passé le filtre. Pour la passer en `active`, il faut une **nouvelle preuve** ou un nouveau test terrain qui change la donne.\n\n4. **Les concept_card_tests** sont obligatoires : une carte sans aucun test terrain associé est considérée comme une **hypothèse abstraite non vérifiée** — elle ne peut pas alimenter le corpus tant qu''elle n''est pas reliée à au moins un test.\n\n5. **Si Claude utilise les concept_cards dans une analyse**, il doit le mentionner explicitement dans ses recommandations (« basé sur la carte #X dimension Y, status active, tests Z »). Pas d''affirmation orpheline sans ancrage.\n\n### Lien avec les notes volantes (BQ #102)\n\nLa règle des pépites de BQ #102 (« ne pas écarter la vulgarisation trop vite ») est complétée par cette règle des concept_cards :\n\n> **Trouver une pépite ne suffit pas. La pépite doit passer le filtre concept_card avant d''entrer dans le corpus.**\n\nC''est ce double processus (largeur de captation × rigueur de filtrage) qui garantit que le corpus s''enrichit sans se polluer.\n", "type": "reference", "crit": true}, {"id": 112, "titre": "Concept cards — contradictions explicites uniquement (pas d'heuristique texte)", "contenu": "## Concept cards — contradictions explicites uniquement\n\n**Règle** : les contradictions entre concept cards doivent être **tissées\nexplicitement** via `concept_card_links.link_type='contradicts'`. Pas de\ndétection par heuristique texte (trop de faux positifs — cf session\n2026-04-12 où 10 faux positifs `surface/incorpor` ont été détectés dans la\ndimension Pratique alors que c'était précisément son objet).\n\n### Source de vérité\n\n```sql\nSELECT ccl.from_id, ccl.to_id, c1.title, c2.title, ccl.notes\nFROM concept_card_links ccl\nJOIN concept_cards c1 ON c1.id = ccl.from_id\nJOIN concept_cards c2 ON c2.id = ccl.to_id\nWHERE ccl.link_type = 'contradicts'\n  AND c1.status = 'active' AND c2.status = 'active';\n```\n\n### Cycle de vie d'une contradiction\n\n```\n[détection]\n  - Claude ou JMJ identifie une opposition de fond entre deux cartes actives\n    (pas un simple antonyme de vocabulaire — un désaccord doctrinal)\n   ↓\n[tissage]\n  - INSERT dans concept_card_links avec link_type='contradicts'\n  - notes = justification brève de l'opposition\n   ↓\n[arbitrage]\n  - Relecture des deux cartes + corpus + tests terrain\n  - Trois issues possibles :\n    (a) une carte est affinée/reformulée → le conflit disparaît\n    (b) une carte passe en archive → l'autre survit\n    (c) les deux restent avec un link_type='completes' + note pour expliquer\n        le contexte où chacune s'applique (fausse opposition contextuelle)\n   ↓\n[résolution]\n  - Le lien 'contradicts' est supprimé (a et b) ou remplacé par 'completes' (c)\n  - check_integrity retombe à 0 sur ce check\n```\n\n### Pourquoi pas d'heuristique texte\n\nL'heuristique testée (co-occurrence d'antonymes dans les descriptions) a\nproduit 10/10 faux positifs sur `surface`/`incorpor` dans la dim Pratique.\nRaisons :\n- la dimension Pratique traite précisément du débat surface vs incorporation\n- les cartes citent les deux termes pour distinguer les contextes, pas pour\n  s'opposer\n- le texte ne dit pas qui pose la thèse et qui l'antithèse\n\nUne contradiction réelle demande une analyse sémantique que seule la lecture\n(Claude + JMJ) peut produire. Le texte libre n'est pas une source de vérité\npour les contradictions — le tissage explicite l'est.\n\n### État au 2026-04-12\n\n- 0 lien `contradicts` en DB → check vert\n- 4 `link_type` actuellement utilisés dans `concept_card_links` : related_to\n  (101), completes (23), prerequisite (3), derives_from (2)\n- Les autres types mentionnés dans le schéma (`contradicts`, `supersedes`,\n  `example_of`) sont disponibles à l'usage\n\n\n### Voir aussi\n\n- BQ `audit_corpus` (#156) §K3 — passe d'audit dédiée aux contradictions actives\n", "type": "regle", "crit": true}]}}, "pipeline": {"docs": {"nom": "Pipeline docs strate", "entries": [{"id": 2, "titre": "18 documents — état de production", "contenu": "Requête de démarrage :\n```sql\nSELECT d.code, d.titre, d.strate,\n       jdv.version, CASE jdv.is_frozen WHEN 1 THEN '🔒' ELSE '✏️' END as etat,\n       jds.statut_redaction, jds.priorite\nFROM documents d\nLEFT JOIN jenni_doc_versions jdv ON jdv.doc_code=d.code\nLEFT JOIN jenni_doc_specs jds ON jds.doc_code=d.code\nORDER BY jds.priorite;\n```\n\n## Contexte\n\nÉtat d'avancement global des documents\n\n## Commande\n\n```\nSELECT d.code, d.titre, d.strate,\n       jdv.version, CASE jdv.is_frozen WHEN 1 THEN 'Frozen' ELSE 'Editable' END as etat,\n       jds.statut_redaction, jds.priorite\nFROM documents d\nLEFT JOIN jenni_doc_versions jdv ON jdv.doc_code=d.code\nLEFT JOIN jenni_doc_specs jds ON jds.doc_code=d.code\nORDER BY jds.priorite;\n```\n", "type": "commande", "crit": false}, {"id": 4, "titre": "Ordre de rédaction des 18 documents", "contenu": "Phase 1 — Fondations Sol (tout le corpus y renvoie) : F1 > F2 > S0 > S1 > S2 > S3 > S4\nPhase 2 — Vivant : V1 > V2 > V3\nPhase 3 — Pratiques : P1 > P2 > P3 > P4 > P5\nPhase 4 — Humain (EN DERNIER) : H3 > H2 > H1\n\nH1 est toujours le dernier document — synthèse de tout le corpus.\n\n## Contexte\n\nPlanification de la rédaction\n", "type": "reference", "crit": false}, {"id": 43, "titre": "Commande de génération", "contenu": "python3 export_jenni_doc.py --db sol_vivant.db --doc S2\n\nOu toute une strate :\nfor doc in S0 S1 S2 S3 S4; do python3 export_jenni_doc.py --db sol_vivant.db --doc $doc; done\n\nOu tous les documents :\npython3 export_jenni_doc.py --db sol_vivant.db --all\n\nLe fichier produit (prompts_jenni_S2.txt) contient tous les prompts séparés par `---`. Copier-coller un par un.\n", "type": "commande", "crit": false}, {"id": 148, "titre": "Documents de strate — définition et taxonomie", "contenu": "## Documents de strate — définition et taxonomie\n\n### Définition canonique\n\n> **Un document de strate est une partie structurante du corpus, rédigée autour d'un axe thématique précis, couvrant un périmètre défini par sa place dans la carte F/S/V/P/H.**\n\nLes 18 documents composent l'ossature éditoriale du corpus. Chaque document est unique, fixé dès la conception du projet, et couvre un angle qui ne se recoupe que partiellement avec les autres. À la différence des fiches (zoom d'un point précis), un document de strate est une **synthèse organisée** qui couvre son sujet en profondeur sur plusieurs chapitres et sections.\n\n### Les 18 documents du corpus\n\n| Strate | Code | Titre | Position plan |\n|---|---|---|---|\n| F (Fondements) | F1 | Le Temps Long | P1 |\n| F (Fondements) | F2 | L'Économie du Vivant | P2 |\n| S (Sol) | S0 | L'Eau dans le Sol Vivant | P5 |\n| S (Sol) | S1 | Architecture du Sol | P6 |\n| S (Sol) | S2 | Le Microbiome du Sol | P7 |\n| S (Sol) | S3 | Le Microbiome Fongique et Mycorhizien | P8 |\n| S (Sol) | S4 | Le Carbone et les Grands Cycles | P9 |\n| V (Vivant) | V1 | La Faune du Sol | P10 |\n| V (Vivant) | V2 | L'Holobionte Plante-Microbiome | P11 |\n| V (Vivant) | V3 | Les Fermentations Microbiennes | P12 |\n| P (Pratiques) | P1 | Diagnostic du Sol Vivant | P13 |\n| P (Pratiques) | P2 | Agriculture de Conservation | P14 |\n| P (Pratiques) | P3 | Biostimulants et Fermentations Appliquées | P15 |\n| P (Pratiques) | P4 | Agroforesterie et Systèmes Pérennes | P16 |\n| P (Pratiques) | P5 | La Transition | P17 |\n| H (Humain) | H1 | Sol, Alimentation et Santé Humaine | P19 |\n| H (Humain) | H2 | Le Microbiome Intestinal | P18 |\n| H (Humain) | H3 | La Résistance Antimicrobienne | P20 |\n\n### Ce qu'un document EST\n\n- Une synthèse structurée en chapitres et sections sur un axe thématique précis\n- Un texte long (15-40 k mots rédigés) construit pour servir de socle éditorial\n- Un élément fixe de l'ossature du corpus (les 18 docs sont définis, pas créés à la demande)\n- Un cadre nourri par les fiches transversales et zooms intégrés au fil du temps\n\n### Ce qu'un document N'EST PAS\n\n- Une fiche (zoom court d'un point précis) — voir BQ `fiche_definition`\n- Une validation d'affirmation ou de chaîne — voir BQ validations\n- Un document créé à la demande — les 18 docs sont fixés dès la conception\n\n### Tables du modèle\n\n- **`documents`** : métadonnées (code, titre, sous_titre, strate, resume, statut)\n- **`prompts`** : sections du plan (une ligne par section avec type `intro`/`section`/`conclusion`), champs `chapitre`, `section`, `titre_h1`, `titre_h2`, `titre_h3`, `contexte_sci`, `instructions`, `enrichissement`, `style`, `tableau`, `ordre`, `statut`\n- **`doc_contenus`** : contenu rédigé INTÉGRÉ (blob markdown du retour Jenni, une ligne par doc avec `contenu_integre`, `refs` JSON, versionné). **Source canonique du texte final.**\n- **`jenni_doc_specs`** : métadonnées amont du prompt de document (titre_jenni, angle_entree, public, priorite, style global)\n- **`source_usages`** : FK vers `jenni_sources` quand le doc cite des refs déjà en DB\n\n### Vues utiles\n\n- `v_prompts_actifs` — prompts de sections en cours\n- `v_prompts_incomplets` — sections sans contexte_sci ou instructions\n- `v_avancement` — état du cycle de production par doc\n- `v_sante` — dashboard santé globale du corpus\n\n### Champs et tables dépréciés (**ne pas utiliser**)\n\n- `jenni_doc_versions` : **legacy** — versions historiques prompts/ébauches. Non lue par la carto (`gen_web.py`). Conservée pour archive uniquement.\n- `prompt_contenus` : legacy remplacé par `prompts.enrichissement`. Ne plus écrire.\n\n### Cycle de vie (`documents.statut`)\n\n```\na_faire          → prompts pas encore rédigés pour toutes les sections\nen_cours         → prompts rédigés en DB, pas encore exportés à Jenni\npret_a_rediger   → prompts complets, export possible, envoi Jenni\nenvoye           → .docx généré et remis à Jenni\nrecu             → .docx retour Jenni récupéré dans docx/\nintegre          → contenu Jenni intégré via integrate_doc_docx.py, version ≥ 1 dans doc_contenus\ncloture          → doc considéré finalisé éditorialement (JMJ validation finale)\n```\n\n### Lien avec le reste du corpus\n\n- Les **fiches** intégrées enrichissent les `prompts.contexte_sci`/`enrichissement` des sections pertinentes via la propagation (phase 4 des fiches, étape --propagate).\n- Les **termes canoniques** du thésaurus sont automatiquement injectés dans chaque prompt selon `terms.doc_code`.\n- Les **chaînes causales** qui traversent un document peuvent être citées dans les amorces de section.\n- Les **concept cards** pertinentes au doc sont référencées dans `enrichissement`.\n\n### Principe éditorial\n\nLe document est écrit **une seule fois dans sa version finale** (le prompt envoyé à Jenni doit déjà être le brouillon mûr, pas un squelette). La stratégie cercle vertueux F → S → V → P → H garantit que chaque strate rédigée enrichit la DB pour les suivantes (voir `wf_doc_production` §cercle_vertueux).\n\n### BQ complémentaires\n\n- `wf_doc_production` — workflow de production d'un doc (prompts → export → envoi Jenni)\n- `wf_doc_integration` — intégration consciente du retour Jenni + propagation\n- `redaction_documents_jenni` (BQ #146) — règles unifiées de rédaction pour tout document Jenni\n- `bq_clean_discipline` (BQ #120) — discipline BQ-clean sur les prompts\n", "type": "reference", "crit": true}, {"id": 150, "titre": "Intégration consciente du retour Jenni — document de strate", "contenu": "## Intégration consciente du retour Jenni — document de strate\n\nRefonte avril 2026 : les 18 documents suivent le même pattern d'intégration consciente que les fiches, avec des spécificités liées à la structure chapitrée et au volume (15-40 k mots par doc).\n\n### Règle d'or\n\n**Aucun docx Jenni ne rentre tel quel en DB.** L'intégration passe par analyse consciente via `integrate_doc_docx.py`, structurée par section, avec vérification de cohérence et propagation aux autres éléments du corpus.\n\n### Chaîne complète\n\n```\n[DB prompts]         export_jenni_doc.py                 → recherches/docs/<code>_prompts_<date>.docx\n      │\n      ▼\n[Rédaction Jenni]    .docx enrichi retour              (outil Jenni, opaque côté corpus)\n      │\n      ▼\n[Analyse Claude]     lecture intégrale + extraction refs, termes, cohérence doctrine\n      │\n      ▼\n[Pipeline]           tools/admin/integrate_doc_docx.py --doc-code <X> --docx <path> --apply\n      │                → parse (OMML, sections, refs JenniRefBody)\n      │                → diff avec version précédente si existante\n      │                → INSERT/UPSERT doc_contenus (contenu_integre + refs JSON, version++)\n      │                → source_usages pour refs déjà en DB\n      │                → UPDATE documents.statut = 'integre'\n      │                → archive docx → docx/archives/\n      │                → audit_log systématique\n      ▼\n[Phase 4bis]         propagation aux fiches, cards, autres docs impactés\n      │\n      ▼\n[Rendu carto]        onglet Documents : bandeau « Document intégré »\n                     SvRichText + SvSourceList depuis doc_contenus\n```\n\n### Règle absolue : intégration par section, jamais en blob\n\nLe `.docx` retour Jenni est structuré par chapitres et sections. L'intégration respecte cette structure :\n\n- **Parseur par section** (hérité du parseur fiches) : lit le plan DB (`prompts` ordonnés par `ordre`) et extrait le texte section par section du docx.\n- **Nettoyage une seule fois** par section : OMML → Unicode (formules), LaTeX → Unicode, `**gras**` et backticks rendus propres, `(nd)` autoréférences supprimées, refs inline normalisées FR → EN (`auteurs` → `authors`, `annee` → `year`) + DOI → url.\n- **Refs inline** `(Auteur, année)` repérées et croisées avec `jenni_sources` (source_usages créés pour les existantes, nouvelles signalées à part).\n\nRésultat en DB : `doc_contenus.contenu_integre` contient le markdown structuré par sections (H1 chapitres + H2 sections) prêt à afficher, reconstruit à chaque intégration. La table `doc_contenus` est versionnée (une ligne par intégration successive).\n\n### Pipeline à 7 étapes\n\n1. **Parse** — OMML math-aware, sections alignées au plan DB, refs JenniRefBody (20-100 par doc), citations inline.\n2. **Match** — doc identifié explicitement par `--doc-code` (pas d'autodétection).\n3. **Diff** — comparaison avec la version précédente si `doc_contenus` existe déjà. Passages disparus, refs perdues signalées pour revue.\n4. **Refs** — croisement avec `jenni_sources` par DOI normalisé + auteurs/année. Les nouvelles refs sont notées à intégrer séparément (chantier Crossref DOI + `jenni_sources`).\n5. **Termes candidats** — extraction de candidats termes depuis les refs et le contenu ; filtrage automatique des artefacts (acronymes isolés HAL, fragments latins/anglais de titres de refs, méta-vocab) ; **proposition seulement**, jamais d'INSERT automatique dans `terms`.\n6. **Cards** — scan des concept_cards dont les docs_codes recoupent le doc intégré, avec scoring sur tokens du titre présents dans le contenu.\n7. **Gate** — violations (parens vides, autoréférences, méta-vocab) bloquent ; warnings (refs sans DOI, sections vides) autorisent `--apply --partial`.\n\nApply au green-light du gate :\n\n```\n✓ UPSERT doc_contenus (contenu_integre + refs JSON, version incrementée)\n✓ DELETE source_usages anciens pour le doc\n✓ INSERT N source_usages (refs déjà en DB)\n✓ UPDATE documents : statut = 'integre', updated_at\n✓ audit_log (operation = INTEGRATE)\n✓ COMMIT\n```\n\n### Phase 4bis — Effet d'entraînement documentaire (règle absolue)\n\nHérité de la doctrine fiche (voir BQ `wf_fiche_integration` §Phase 4bis). **S'applique avec la même rigueur aux docs de strate.**\n\nPourquoi c'est critique pour les docs :\n\n- Un doc intégré peut redéfinir un cadre conceptuel (paradigme MAOM, loi de trophobiose, controverse CMN Karst 2023) qui sera cité dans d'autres docs à venir ou qui impacte les fiches déjà rédigées.\n- La stratégie cercle vertueux (F → S → V → P → H) suppose que chaque strate intégrée enrichit la DB pour les suivantes. Sans propagation consciente, les strates aval héritent d'un contexte incomplet.\n\nProcédure post-apply :\n\n**1. Scan des impacts potentiels** — pour chaque fiche `en_cours`, `a_faire` ou `integre_extrait`, chaque doc avec `statut != integre`, et chaque prompt de section pas encore envoyé : mesurer le recoupement (docs partagés, termes-clés communs, chaînes traversées en commun).\n\n**2. Renforcement des cards prioritaires** — cards avec score ≥ 5 reçoivent une note `[Apport doc <code> v<N> (<date>)]` dans `concept_cards.notes`, synthétisant ce que le doc apporte à la card.\n\n**3. Décision éditoriale par élément impacté** :\n\n- **Mise à jour automatique** : ajout d'une ref de la source dans la biblio, ajustement de `contexte_sci` dans les prompts.\n- **Mise à jour manuelle avant envoi Jenni** : reformulation d'une affirmation contradictoire, intégration d'un nouveau paradigme dans les prompts aval.\n- **Simple alerte** : note dans `fiches.notes` ou `documents.notes` pour que JMJ en tienne compte plus tard.\n\n**4. Ne jamais envoyer à Jenni un prompt de doc aval** qui cite explicitement un paradigme maintenant consolidé dans un doc plus récent sans avoir propagé l'apport.\n\n**5. Audit log systématique** — chaque élément impacté met à jour ses `notes` avec une entrée `[Propagation doc <code> v<N> (<date>)]`.\n\n**Règle d'ordre** : intégrer d'abord la strate amont complète (F/S en priorité), puis V, puis P, puis H. Cette règle est structurellement la règle cercle vertueux — elle garantit que chaque intégration aval s'appuie sur un contexte amont stabilisé.\n\n### Rapport d'audit croisé\n\nPour chaque intégration significative, produire `audit_reports/audit_croise_doc<code>_<date>.md` avec les mêmes 7 volets que pour les fiches :\n\n- A. Cards concernées (scores overlap)\n- B. Chaînes causales traversées\n- C. Termes thésaurus mobilisés (par strate)\n- D. Fiches du corpus en recouvrement\n- E. Contradictions potentielles (vérification manuelle)\n- F. Bibliographie (refs liées vs nouvelles)\n- G. Actions recommandées par priorité\n\n### Archivage automatique\n\nRègle absolue (CLAUDE.md) : dès qu'un doc passe `integre`, déplacer les fichiers sources dans `archives/` :\n\n```\ndocx/<code>_<date>.docx                     → docx/archives/<code>_<date>.docx\nrecherches/docs/<code>_prompts_<date>.docx  → recherches/docs/archives/<...>\n```\n\nImplémenté dans `tools/admin/integrate_doc_docx.py` (équivalent `archive_fiche_files` pour les docs). Idempotent, journalisé `audit_log(operation='ARCHIVE', table='files')`.\n\n### Intégration par section vs retouche ciblée\n\nDeux cas d'usage :\n\n**Cas 1 — Première intégration** (doc_contenus inexistant)\n- `--apply` pose la version 1. Tout le contenu est nouveau.\n\n**Cas 2 — Reprise / retouche** (doc déjà `integre`, nouveau retour Jenni sur quelques sections)\n- Le parseur lit toutes les sections du docx retour. Le pipeline crée la version N+1 de `doc_contenus`.\n- Diff avec la version précédente : signaler les passages disparus, les refs perdues, pour revue consciente avant apply.\n- Si la retouche porte sur un nombre limité de sections, l'option `--sections <list>` (à implémenter) permettrait une intégration ciblée. Pour l'instant, la version entière est remplacée et l'historique conservé par le champ `version` incrémenté.\n\n### Rendu carto (index onglet Documents)\n\nQuand un doc a `doc_contenus.contenu_integre` non vide, la carto (`gen_web.py`) affiche :\n\n- **Bandeau « Document intégré »** avec version et date\n- **Contenu rendu** via `SvRichText` (markdown → HTML côté client)\n- **Bibliographie** via `SvSourceList` à partir des `source_usages` + refs JSON\n\nQuand un doc est `en_cours` ou `pret_a_rediger`, la carto affiche :\n\n- **Bandeau « En cours de rédaction »**\n- **Sections cliquables** qui montrent l'état de préparation (`contexte_sci` / `instructions` / `enrichissement` par section)\n\n### Scripts actifs\n\n| Script | Rôle |\n|---|---|\n| `tools/admin/integrate_doc_docx.py` | Pipeline d'intégration complet (dry-run puis --apply) |\n| `tools/admin/integrate_doc_docx.py::archive_doc_files()` | Archivage automatique post-intégration |\n| `tools/jenni/export_jenni_doc.py` | Génération .docx prompt depuis DB |\n| `tools/docs/gen_web.py` | Rendu carto onglet Documents |\n\n### Anti-patterns confirmés\n\n- **Pas d'intégration en blob** : toujours par sections alignées au plan DB.\n- **Pas d'apply sans gate vert** : dry-run obligatoire, vérifier absence de violations.\n- **Pas d'oubli de la phase 4bis** : chaque intégration doc impacte fiches, cards, prompts aval. Absence de propagation = construction silencieuse d'incohérences.\n- **Pas d'écriture directe dans `doc_contenus` hors du pipeline** : le script est la seule voie d'écriture légitime (audit_log + version + source_usages cohérents).\n- **Pas de propagation automatique aux prompts sans validation Claude/JMJ** : l'enrichissement automatique des `contexte_sci`/`instructions` peut dégrader un prompt finement ajusté ; systématiquement en mode propose-puis-valide.\n", "type": "workflow", "crit": true}, {"id": 149, "titre": "Production d'un document de strate — prompts et envoi Jenni", "contenu": "## Production d'un document de strate — des prompts à l'envoi Jenni\n\nWorkflow éprouvé sur les documents F, S, V déjà rédigés et intégrés (sessions 2025-2026). Le document est un élément fixe de l'ossature du corpus ; la production consiste à préparer les prompts de ses sections pour qu'un brouillon complet et structuré parte à Jenni.\n\n### Règle d'or : le prompt est le brouillon\n\nUn document de strate n'a pas de « brouillon Claude » intermédiaire ni de phase manuelle de rédaction pré-Jenni. Le prompt en DB (tables `prompts` + `jenni_doc_specs`) est, une fois mûr, le brouillon lui-même. Il est envoyé tel quel à Jenni via le `.docx` généré, qui sert de document de travail.\n\nCette règle distingue les docs des fiches : pour une fiche, Claude rédige un brouillon en prose continue (voir BQ `wf_fiche_production`) ; pour un doc, Claude construit un prompt section par section qui sert directement de base à Jenni.\n\n### Étape 1 — État des prompts en DB\n\nInventaire :\n\n```bash\n# Dashboard\npython3 tools/admin/session_start.py --db sol_vivant.db\n\n# Prompts incomplets d'un doc\nSELECT chapitre, section, titre_h1, titre_h2,\n       CASE WHEN contexte_sci IS NULL OR contexte_sci='' THEN '✗' ELSE '✓' END AS ctx,\n       CASE WHEN instructions IS NULL OR instructions='' THEN '✗' ELSE '✓' END AS ins\nFROM prompts WHERE doc_code='S2' ORDER BY ordre;\n```\n\n**Cible** : chaque section (type `section`) a au minimum `contexte_sci` non vide et `instructions` non vide. Les sections `intro` ont en plus un champ `enrichissement` (cadre conceptuel).\n\n### Étape 2 — Enrichissement des prompts\n\nQuand des fiches transversales ou des zooms sont intégrés, leurs apports peuvent enrichir les prompts du document. Trois voies :\n\n1. **Propagation automatique depuis une fiche** : `tools/jenni/integrate_fiche.py --propagate --fiche-id N` ajoute l'apport dans `prompts.enrichissement` des sections concernées (flag à valider avant application).\n\n2. **Édition directe en DB** (pour un ajustement ciblé) :\n```sql\nUPDATE prompts SET contexte_sci = 'Nouveau contexte'\nWHERE doc_code = 'S0' AND chapitre = 2 AND section = 1;\n\nUPDATE prompts SET instructions = 'Nouvelles instructions'\nWHERE doc_code = 'S0' AND chapitre = 3 AND section = 1;\n\nUPDATE prompts SET tableau = 1\nWHERE doc_code = 'S0' AND chapitre = 3 AND section = 1;\n```\nNe jamais éditer le script d'export ni le fichier de sortie. La source de vérité **éditoriale** est la table `prompts` (les prompts sont des **données**, pas du code — voir BQ #73).\n\n3. **Utilisation d'une concept_card** comme cadre éditorial : copier la description dans `enrichissement` avec une phrase d'ancrage (« Ce cadre s'applique dans le présent document à la section X »).\n\n### Étape 3 — Architecture des prompts (masque v3.0)\n\nLes prompts sont générés mécaniquement par `tools/jenni/export_jenni_doc.py` depuis la DB. Architecture fixe :\n\n```\n[Header/titre_jenni + plan du document]", "type": "workflow", "crit": true}]}, "fiches": {"nom": "Pipeline fiches", "entries": [{"id": 69, "titre": "Fiches — définition et taxonomie", "contenu": "## Fiches — définition et taxonomie\n\n### Définition canonique\n\n**Une fiche est un document à part entière au service du corpus, qui exerce simultanément deux fonctions :**\n\n1. **Zoom** — approfondissement ciblé sur une partie clef du corpus (un mécanisme, un concept, une controverse, une pratique).\n2. **Service au corpus** — son contenu vient répondre à un besoin précis identifié dans le corpus :\n   - Combler une **lacune** documentée (sujet absent, paradigme manquant)\n   - **Valider** une affirmation existante avec sources et données récentes\n   - **Contredire** ou nuancer un consensus daté\n   - **Articuler** plusieurs strates autour d'un mécanisme transversal\n   - **Arbitrer** une controverse scientifique active\n\nChaque fiche doit être briefée comme un cas particulier — il n'y a pas de fiche standard. Le besoin précis qu'elle vient servir est documenté dans `fiches.notes` au moment de sa création (cf. BQ `wf_fiche_production`).\n\n### Sous-types (`fiches.type`)\n\n| Type | Usage | Structure |\n|---|---|---|\n| `transversale` | Articule plusieurs strates autour d'un mécanisme, d'une controverse ou d'une cascade | Title + Intro + 6-7 H1 body + Résumé + Références (auto Jenni) |\n| `zoom` | Approfondissement ciblé sur un point précis (ex : Kirkby/AMG, Drilosphère) | Même structure, généralement 5-6 H1 body |\n| `technique` | Protocole DIY, méthode de mesure, préparation biologique | Charte dédiée 5 H2 immuables — voir BQ `charte_fiches_techniques_diy` |\n\n### Cycle de vie (`fiches.statut`)\n\n```\na_faire        → fiche créée, brief éditorial documenté, graines en attente\nen_cours       → graines synthétiques rédigées, docx prompt généré, prêt à envoyer\nenvoye         → docx uploadé à Jenni, en cycle de co-rédaction\nintegre        → retour Jenni intégré + analyse intégrative effectuée\nintegre_extrait → intégration partielle (ancien format pré-2026-04)\narchive        → fiche obsolète (refonte, fusion, périmètre absorbé ailleurs)\n```\n\n### Tables du modèle\n\n- **`fiches`** — métadonnées (slug, titre, type, strates, docs_cibles, statut, version, dates) + `notes` = brief éditorial + propagation des intégrations passées\n- **`fiche_sections`** — plan structurel et matière par section (`ordre`, `type`, `titre`, `contexte_sci` = graine synthétique de Claude, `contenu` = retour intégré post-Jenni)\n- **`fiche_contenus`** — une ligne par fiche (UNIQUE) : `contenu_integre` (markdown intégré), `refs` (JSON cache d'affichage des refs), `notes_claude`\n- **`source_usages`** — source de vérité pour les liens fiche ↔ jenni_sources\n\n### Champs dépréciés (ne pas utiliser)\n\n- `fiches.prompt_jenni`, `fiches.sources_dois`, `fiches.notes_editoriales_h2` : supprimés en 2026-04\n- `fiche_section_h2_notes` : table dépréciée (workflow granulaire H2 remplacé par `fiche_sections.type='body_h2'`)\n- `fiche_contenus.contenu_brut`, `fiche_contenus.version` : supprimés en 2026-04\n\n### Workflow en 3 phases\n\n```\nPhase 1 — Production (BQ wf_fiche_production)\n   Identifier le besoin → brief éditorial → graines synthétiques → docx léger → envoi Jenni\n\nPhase 2 — Co-rédaction Jenni (hors champ Claude)\n   JMJ pilote section par section dans le chat Jenni → docx retour enrichi (×5-10)\n\nPhase 3 — Intégration consciente (BQ wf_fiche_integration) — moment crucial\n   Contrôles techniques + analyse intégrative + apply + intégration refs + audit croisé + propagation\n```\n\n### Anti-patterns (relégués ailleurs)\n\n- Pas d'agents Task pour rédiger : BQ `pas_agent_redacteur` #136\n- Pas de méta-vocab dans le brief Jenni : BQ `redaction_documents_jenni` #146\n- Pas de sujets interdits : BQ `sujets_interdits_corpus` #154\n- Pas de batch INSERT thésaurus depuis le retour : BQ `wf_fiche_integration` #147\n\n### Voir aussi\n\n- BQ `wf_fiche_production` (#130) — comment produire une fiche\n- BQ `wf_fiche_integration` (#147) — comment intégrer le retour Jenni\n- BQ `redaction_documents_jenni` (#146) — règles de rédaction transversales\n- BQ `charte_fiches_techniques_diy` (#121) — structure spécifique fiches techniques\n", "type": "reference", "crit": true}, {"id": 130, "titre": "Production d'une fiche — de l'identification à l'envoi Jenni", "contenu": "## Production d'une fiche — du besoin au docx prompt\n\nWorkflow en 5 étapes pour produire une fiche, depuis l'identification du besoin corpus jusqu'au docx envoyable à Jenni. Chaque fiche est un cas particulier — pas de standardisation rigide.\n\n### Principe directeur\n\n**Le docx prompt envoyé à Jenni est une graine synthétique, pas une rédaction finie.** Jenni enrichit ×5 à ×10 le volume initial avec sources académiques, données récentes et structuration approfondie. Si Claude rédige déjà tout, Jenni n'a qu'à reformater — l'apport scientifique de la co-rédaction est perdu.\n\nVolume cible du docx prompt : **5-8 k chars** (graine + brief éditorial), pas 12-15 k.\n", "type": "workflow", "crit": true}, {"id": 121, "titre": "Charte fiches techniques DIY — structure spécifique", "contenu": "## Charte fiches techniques DIY — structure spécifique\n\nCharte spécifique aux fiches `type='technique'` — protocoles DIY, préparations biologiques, méthodes de mesure à la ferme. Source initiale : `docx/charte_de_travail___fiches_techniques.docx` rédigée par Jenni en 2026-04.\n\n**S'applique à** : `chelation-aminoacide-diy`, `knf-jadam-preparations`, `ipmo-jakoba-natural-farming`, `rhodopseudomonas-palustris`, `diagnostic-seve-ph-ec` et toute nouvelle fiche technique à venir.\n\n### Structure générale (héritée des fiches transversales)\n\nIdentique aux fiches transversales pour l'ossature :\n\n```\n[Title court sans accent ≤ 5 mots]\n\n[H1] Introduction\n[H1] 1. [Titre section 1]  (avec 5 H2 — voir détail ci-dessous)\n[H1] 2. [Titre section 2]  (avec 5 H2)\n...\n[H1] Résumé\n[H1] Termes canoniques en fin (Jenni §1.C)\n[H1] Références\n```\n\n### Spécificité : 5 sous-blocs H2 immuables par section numérotée\n\nChaque section body H1 numérotée contient **5 H2 au même niveau** (structure plate, pas de H3 pour éviter les ambiguïtés d'interprétation Word) :\n\n```\n[H1] 1. Préparation du LiFoFer\n  [H2] Contexte scientifique\n  [H2] Protocole\n  [H2] Indicateurs de qualité\n  [H2] Précautions & Stockage\n  [H2] Applications & Dosages\n\n[H1] 2. [Autre préparation]\n  [H2] Contexte scientifique\n  [H2] Protocole\n  [H2] Indicateurs de qualité\n  [H2] Précautions & Stockage\n  [H2] Applications & Dosages\n```\n\n### Détail des 5 H2\n\n#### H2 — Contexte scientifique\n\nPourquoi ce protocole fonctionne. Mécanismes biologiques, chimiques, écologiques mobilisés. Références scientifiques. **Rédigé par Claude + enrichi par Jenni**.\n\n#### H2 — Protocole\n\nStructure à sous-paragraphes en **préfixe gras** (pas de H3) :\n\n```\n**Ingrédients —** liste des matériels et matières consommables avec quantités précises, sources d'approvisionnement, alternatives de substitution.\n\n**Équipement nécessaire —** ustensiles, capacités volumiques, conditions (obscurité, température, aération). Inclure les EPI (gants, lunettes, masque filtrant si applicable).\n\n**Procédure —** suite d'étapes chronologiques numérotées ou en listes, avec durées, températures, signes sensoriels à vérifier à chaque étape (changement de couleur, odeur attendue, consistance).\n```\n\n**Règle doctrine** : la rédaction du Protocole est du **volet pratique** confié à JMJ (qui teste, ajuste, documente) et à Jenni (qui recherche sources praticiens : Carandang, Cho Han-kyu, Tao Orion, Gil Carandang, Higa EM-1, retours aquaculture asiatique, etc.). Claude rédige **uniquement le Contexte scientifique** et la partie théorique — pas d'invention de protocole par Claude seul.\n\n#### H2 — Indicateurs de qualité\n\nComment savoir que la préparation est réussie. Paramètres mesurables (pH, couleur, odeur, température, densité), valeurs de référence, signaux de dérive (mouillage, odeurs putrides, changement de teinte anormale), durée de maturation typique.\n\n#### H2 — Précautions & Stockage\n\nRisques chimiques et biologiques, incompatibilités, conditions de stockage (température, lumière, durée de conservation), signes d'altération justifiant le rejet, gestion des résidus et déchets.\n\n#### H2 — Applications & Dosages\n\nCultures ou contextes où la préparation est utile, doses recommandées (par litre, par hectare, par plant), fréquences d'application, modalités (trempage de semences, pulvérisation foliaire, incorporation sol, dilution irrigation), compatibilités / incompatibilités avec d'autres pratiques concurrentes.\n\n### Document amorce, pas template vide\n\nLe docx produit est un document de travail **amorce/partiellement rédigé**, pas un template avec `[à compléter]`. Les sous-blocs H2 contiennent une description éditoriale concise (5-15 lignes) qui pose le cadre de ce qui est attendu, plutôt qu'un placeholder vide.\n\n### Recommandations protocoles DIY (sources Jenni)\n\nLes sources praticiennes reconnues que Jenni mobilise pour les protocoles :\n\n- **Carandang, Gil** — Natural Farming Philippines, IMO, FAA, FPJ, FFJ\n- **Cho Han-kyu** — Korean Natural Farming (KNF), IMO1-4, JADAM\n- **Tao Orion** — permaculture thérapeutique, intégrations\n- **Higa, Teruo** — Effective Microorganisms (EM-1)\n- **Aquaculture asiatique** — usage combinés en riziculture-pisciculture\n\n**Règle** : les doses et protocoles issus de ces sources sont contextuels. Toute adaptation locale doit être testée en pilote avant généralisation.\n\n### Gestion des termes canoniques\n\nComme pour les fiches transversales (cf. BQ `wf_fiche_production`) :\n- Termes canoniques **intégrés dans les phrases** (orthographe exacte `terms.fr`).\n- Pas de liste séparée en fin de document.\n- Première mention avec EN entre parenthèses : `« micro-organismes efficaces (Effective Microorganisms, EM) »`.\n\n### Contraintes de rendu (rappel)\n\nIdentiques aux fiches transversales :\n- Title ≤ 5 mots sans accent\n- Hiérarchie Word native (Title + H1-H3 max, pas de H4)\n- Pas d'ASCII décoratif\n- Structure plate sous un H1 technique (5 H2 sans H3 dans l'un d'eux)\n- Zéro méta-vocab\n\n### Principe du cadrage éditorial\n\nLes 5 H2 sont **immuables** pour garantir la cohérence inter-fiches techniques : un lecteur qui ouvre plusieurs fiches techniques retrouve toujours la même architecture et sait où chercher chaque type d'information. Cette standardisation vaut contrainte : si une fiche technique n'a rien à dire dans un H2 (ex : pas de Précautions spécifiques à documenter pour une préparation particulièrement bénigne), le H2 est conservé avec une mention concise, pas supprimé.\n\n### BQ complémentaires\n\n- `fiche_definition` — définition, taxonomie, cycle de vie des fiches\n- `wf_fiche_production` — workflow de production (s'applique aussi aux techniques)\n- `wf_fiche_integration` — intégration consciente du retour Jenni\n- `redaction_documents_jenni` (#146) — règles unifiées de rédaction Jenni\n", "type": "reference", "crit": true}, {"id": 147, "titre": "Intégration consciente du retour Jenni — workflow canonique", "contenu": "## Intégration consciente du retour Jenni — workflow canonique\n\n### Principe directeur\n\n**L'intégration du retour Jenni est le moment crucial où Claude mobilise toutes ses capacités d'analyse intégrative.** Ce n'est pas un lancement de script suivi d'un commit. C'est l'analyse consciente d'un document scientifique enrichi à co-rédiger avec le reste du corpus existant.\n\nJMJ a co-rédigé avec Jenni mais n'a plus le bandwidth pour relier transversalement, contrôler la cohérence inter-pièces, repérer les évolutions de paradigme et les manques exposés. **C'est la responsabilité de Claude à l'intégration.**\n\nUne intégration sans analyse intégrative produit du contenu juxtaposé sans cohérence — exactement le piège du corpus mal géré.\n\n### Règle d'or\n\n**Aucun docx Jenni ne rentre tel quel en DB.** Toute intégration passe par le pipeline `integrate_fiche.py` + analyse intégrative consciente + intégration des refs biblio + audit croisé documenté + propagation aux autres pièces du corpus.\n\n### Pipeline complet en 7 étapes\n\n```bash\n# Étape 1-3 : dry-run + contrôles\npython3 tools/jenni/integrate_fiche.py --db sol_vivant.db --fiche-id <N> --docx docx/<slug>.docx\n# Étapes 4-7 : analyse + apply + intégration refs + audit + archivage\npython3 tools/jenni/integrate_fiche.py --db sol_vivant.db --fiche-id <N> --docx docx/<slug>.docx --apply\npython3 tools/jenni/integrate_fiche_refs.py --fiche-id <N> --docx docx/<slug>.docx --apply\n# (audit croisé manuel — voir étape 6)\n```\n", "type": "workflow", "crit": true}]}, "thesaurus": {"nom": "Pipeline thesaurus", "entries": [{"id": 138, "titre": "Ne pas modifier le libelle fr canonique d'un terme existant", "contenu": "## Règle absolue — le `fr` canonique d'un terme ne se modifie JAMAIS automatiquement\n\n**Le champ `terms.fr` est la CLÉ ÉDITORIALE qui fait l'aller-retour avec Jenni.**\n\nWorkflow Jenni :\n1. On exporte une liste de termes vers Jenni (via `export_thesaurus_incomplets.py` ou `gen_prompt_thesaurus.py`)\n2. Jenni reçoit le libellé EXACT de la DB → elle le recopie verbatim dans son docx de retour\n3. On réimporte via `import_termes_jenni.py --replace` → le TERME du docx remplace/matche le terme en DB\n\n**Conséquence** : si on modifie automatiquement le `fr` en DB (casse, ponctuation, espaces, apostrophes, tirets), on crée un cycle vicieux :\n- Export : Jenni reçoit la version modifiée\n- Retour Jenni : le docx a la version modifiée (Jenni ne rétablit pas)\n- Réimport : DB reste avec la version modifiée\n- Perte définitive de la casse/ponctuation d'origine\n\n**Incident de référence — 2026-04-20** : le Chantier A (normalisation casse initiale via agents Task, commit 5970137) avait baissé la Majuscule initiale de **216 termes** (Antifragilité → antifragilité, Biofilms → biofilms, Bioturbation → bioturbation, etc.) selon une règle typographique française stricte (noms communs en min). Or Jenni écrit ces termes en Majuscule initiale (convention standard de thésaurus). Après le Chantier A :\n- Les exports envoyaient à Jenni \"antifragilité\" → Jenni retournait \"antifragilité\"\n- Le cycle a failli être définitif\n\nCorrection (commit 86408df) : restauration de la casse Jenni pour les 216 termes + migration des term_relations associées.\n\n**Interdictions absolues** :\n- ❌ Lancer un script qui modifie automatiquement la casse initiale de tous les termes\n- ❌ Normaliser les apostrophes, tirets, espaces dans le `fr` sans audit préalable de la casse Jenni\n- ❌ Appliquer une règle typographique abstraite (française, ISO 25964, etc.) au `fr` existant\n- ❌ Baser un fix sur une décision agent Task automatisée sans validation JMJ\n\n**Règles autorisées** :\n- ✅ Modifier le `fr` d'UN terme spécifique après validation explicite JMJ\n- ✅ Les agents Task peuvent CLASSIFIER / ANALYSER / COMPTER mais pas DÉCIDER d'un changement de libellé\n- ✅ Normalisations typographiques dans les champs `definition`, `syn_fr`, `syn_en`, `bt`, `rt` (qui ne font pas l'aller-retour direct avec Jenni comme clé)\n\n**Conséquence sur les scripts existants** :\n- `import_termes_jenni.py` : en mode `--replace` match par `fr` normalisé (casse/apostrophes ignorées) — OK\n- Chantier A doit être considéré comme une erreur qui ne doit JAMAIS être reproduite sur le `fr` canonique\n- Si une décision éditoriale veut changer la casse/ponctuation d'un terme : passer par JMJ + export Jenni coordonné\n\n**Pour les champs secondaires** (definition, syn_fr, syn_en, bt, rt) : les modifications (normalisation apostrophes, cleanup URLs, ajout formules OMML via parser math-aware) sont OK car ces champs ne font pas clé avec Jenni.\n", "type": "regle_absolue", "crit": true}, {"id": 53, "titre": "Maintenance thésaurus", "contenu": "Ajouter un terme concept :\n```sql\nINSERT INTO terms (section_key, strate, fr, en, definition, doc_code, type, statut)\nVALUES ('S2', 'S', 'terme fr', 'english term', 'Définition complète.', 'S2', 'concept', '◆');\n```\n\nAjouter un terme glossaire (support, définition courte) :\n```sql\nINSERT INTO terms (section_key, strate, fr, en, definition, doc_code, type, statut)\nVALUES ('S2', 'S', 'terme fr', 'english term', 'Définition courte.', 'S2', 'glossaire', '~');\n```\n\n**Deux types de termes :**\n- `concept` (défaut) — terme structurant du corpus avec définition complète, synonymes, INRAE, relations\n- `glossaire` — terme support apparaissant dans les relations (rt), définition courte, pas de synonymes requis\n\nRéassigner un terme :\n```sql\nUPDATE terms SET doc_code = 'S1', section_key = 'S1' WHERE id = 237;\n```\n\nFusionner un doublon :\n```sql\nDELETE FROM terms WHERE id = 238;  -- garder le plus complet\n```\n", "type": "commande", "crit": false}, {"id": 71, "titre": "Pseudoscience — flag et définitions factuelles", "contenu": "**Règle** : le corpus ne fait pas de publicité pour la pseudoscience.\n\n**Terme concerné** : `Agriculture Biodynamique` (ID 160, strate F, doc F1/F2)\n- Définition réécrite : factuelle, sourcée (Chalker-Scott 2013, Rienth 2024, FiBL 21 ans, MIVILUDES 2024)\n- `flag_pseudoscience = 1` dans la table `terms`\n\n**Mécanisme** :\n- La colonne `flag_pseudoscience` (INTEGER, défaut 0) permet de marquer tout terme relevant de la pseudoscience\n- Les scripts d'export (Jenni, prompts) doivent filtrer ou signaler les termes marqués\n- La définition contient un avertissement visible : ⚠ Pseudoscience\n\n**Principe** : le corpus traite d'agriculture régénératrice fondée sur la science. Les pratiques sans validation scientifique (biodynamie, électroculture, basalte magnétique) sont documentées factuellement mais jamais valorisées.\n\n**Dossier source** : `jmj/biodynamie.docx` — analyse critique complète (Steiner, préparations, MIVILUDES, infiltration INRAE, marché commercial).\n\n**Requête de contrôle** :\n```sql\nSELECT id, fr, definition FROM terms WHERE flag_pseudoscience = 1;\n```\n", "type": "regle", "crit": true}, {"id": 115, "titre": "Listes de termes triées alphabétiquement (règle absolue workflow Jenni)", "contenu": "## Thésaurus — listes de termes triées alphabétiquement obligatoire\n\n**Règle** : toute liste de termes envoyée à Jenni (workflow thésaurus : bloc\nde 10, complétion, redéfinition) **doit être triée alphabétiquement** sur le\nlibellé FR.\n\n### Justification\n\nObservé en conditions de production : une liste non triée (par ordre\nd'ajout, par id, ou par strate) perturbe le traitement Jenni — elle se\nperd dans la « position » dans la liste (`Dernier terme traité : X`),\nrate des termes, ou mélange les blocs de 10.\n\nAvec un tri alphabétique strict :\n- Jenni retrouve immédiatement où reprendre (« après Z comes AA »)\n- Les blocs de 10 sont prédictibles\n- Pas de dérive dans la séquence\n\n### Application côté production\n\nLes scripts qui génèrent des listes pour Jenni appliquent déjà ce tri :\n\n- `tools/jenni/export_thesaurus_incomplets.py` : `ORDER BY lower(fr)`\n- Tout nouveau script de génération de listes de termes doit suivre la\n  même convention\n\nVérif SQL standard :\n```sql\nSELECT fr FROM terms WHERE strate='S' ORDER BY lower(fr);\n```\n\nLe `lower()` garantit que la casse ne casse pas le tri (« mulch » et\n« Mulch » classés ensemble).\n\n### Format du docx de sortie\n\nListe à puces verticale, un terme par ligne, sans indication de champs\nmanquants ni formatage de consigne (cf règle « docx minimal » et charte\nde travail JMJ). Jenni applique son propre format de sortie via son prompt.\n\n### Référence\n\nRègle formalisée par JMJ le 2026-04-14 suite à observation répétée de\nconfusions Jenni sur listes non triées.\n", "type": "regle", "crit": true}, {"id": 116, "titre": "Workflow thésaurus — import, complétion, déduplication", "contenu": "## Workflow thésaurus Jenni — scripts et doctrine\n\n**Chaîne de traitement complète** d'un docx Jenni de thésaurus (format TERME/EN/DEF/SYN_FR/SYN_EN/BT/RT) :\n\n### 1. Export demande de complétion\n\nLes termes incomplets **repassent dans le workflow thésaurus standard** :\nlistes à puces en docx qui fait le round-trip avec Jenni, pas de prompt\ntexte spécifique.\n\n```bash\n# Export docx listes à puces (triées alphabétiquement, pour Jenni workflow bloc de 10)\npython3 tools/jenni/export_thesaurus_incomplets.py --db sol_vivant.db --strates F,S,V,P,H\n```\n\nSortie : `recherches/thesaurus/thesaurus_incomplets_strate_<X>_<date>.docx`\n\n**Filtre doctrine** : `flag_pseudoscience=1` exclu (les définitions des\ntermes tagués pseudoscience — Agriculture Biodynamique — sont figées et\nne doivent pas être redéfinies par Jenni).\n\nLe retour Jenni arrive en `recherches/thesaurus/thesaurus___strate_X.docx`\n(même format que les imports initiaux), ce qui permet le réimport via\n`import_termes_jenni.py --replace` (étape 2).\n\n⚠ **Déprécié** : `gen_prompt_completion.py` générait des prompts texte\n`complete_{strate}_{date}.txt`. Redondant avec le workflow docx ci-dessus.\nLes fichiers générés sont archivés dans `recherches/archives/completion/`.\n\n### 1ter. Hyperonymes structurels (BT-hubs avec définition stub)\n\n**Cas d'usage** : les termes hyperonymes (`type='class'` en DB) sont\nexclus du workflow standard car considérés comme classes structurelles\nnon-éditoriales. Mais leurs définitions sont parfois des stubs auto\n(« Hyperonyme regroupant N termes : X1, X2... ») qui n'expliquent pas\nle concept en lui-même. JMJ navigue le thésaurus, voit ces stubs comme\ndéfinitions vides ; il faut les compléter par Jenni.\n\n**Doctrine BQ #136 + #146** : aucune définition Claude depuis sa\nmémoire générale. Les hyperonymes structurels passent par cycle Jenni\ncomme tout autre terme, format minimal :\n\n```bash\n# Inclut les hyperonymes structurels avec définition courte (<150c)\npython3 tools/jenni/export_thesaurus_incomplets.py --db sol_vivant.db \\\n    --single-txt --include-class\n```\n\nSortie : `recherches/thesaurus/thesaurus_a_definir_<date>.txt`\n- Format : un terme par ligne, sans tiret, sans préfixe, sans titre\n- Tri alphabétique global (`normalize` NFKD + lower)\n- Inclut termes incomplets standards + hyperonymes `type='class'` avec\n  def
