LIE le delete\n# → working tree pollué après le commit, hook stop-git-check refuse\nmv docx/thesaurus_<date>.docx docx/archives/   # ⚠ à éviter\ngit add docx/archives/thesaurus_<date>.docx    # ⚠ delete non staged\n```\n\n**Pourquoi `git mv`** : git détecte automatiquement le rename, garde\nl'historique du fichier, et évite le pattern « delete unstagé après commit »\nqui a causé 2 commits chore correctifs cette session (lots 3 et 20260508).\n\nSi le `mv` est déjà fait (oubli) : `git add -A docx/` capture le delete et\nl'add en une fois, alternative acceptable.\n\n### 5. Audit\n\nScript inline dans sessions : vérifier 11 axes (distribution, complétude,\nleaks méta-vocab, doublons, acronymes orphelins, pseudoscience, statut,\norphelins relations, couverture INRAE, isolation).\n\n### ⚠ Qualité éditoriale des listes — pas la taille (constat 2026-04-14)\n\nJMJ : *\"Non ça passe jusqu'à 150 tranquille, si la liste est bonne. Même\nune petite liste peut dérailler\"*.\n\nLa taille n'est PAS le facteur principal de dérive de Jenni. Elle tient\njusqu'à ~150 termes en un envoi si la liste est propre. À l'inverse, une\npetite liste mal cadrée peut aussi la faire dériver.\n\nCauses réelles de dérive (à diagnostiquer en pré-envoi) :\n\n1. **Tri erratique** — case-sensitive ASCII (COV avant Candida) cassait\n   la perception d'ordre. Corrigé par `lower(fr)` partout (commit 2026-04-14).\n2. **Termes `fr == en` (anglais déguisé)** — 140 cas dans la DB au\n   constat. Demander à Jenni de \"définir Soil Continuum Model\" en français\n   alors que le terme est en anglais la fait dériver vers une définition\n   anglaise ou une improvisation. Audit + correction au cas par cas\n   (taxons et noms propres restent identiques, vrais termes EN à traduire).\n3. **Doublons / sub-concepts mélangés** — ex : avoir \"polysaccharides\"\n   et \"EPS\" tous deux dans la liste sans hiérarchie crée de l'ambiguïté\n   (Jenni redéfinit l'un en référence à l'autre, génère des conflits).\n4. **Termes mal cadrés** — entrées historiques imprécises ou avec\n   méta-vocab résiduel.\n\n**Solution prioritaire** : qualité de la liste avant envoi, pas\nfragmentation forcée.\n\nLe script `export_thesaurus_incomplets.py` accepte `--max-per-batch=N`\nen option (défaut 0 = pas de fragmentation) — à utiliser uniquement en\ncas de dérive avérée comme palliatif.\n\n### Tri alphabétique strict (constat 2026-04-14)\n\nTous les exports `ORDER BY fr` sont passés à `ORDER BY lower(fr)` pour\néviter le tri ASCII case-sensitive (qui mettait majuscules d'abord puis\nminuscules — ex : COV, CUE, Candida au lieu de Candida, COV, CUE).\n\n\n### Voir aussi (audit)\n\n- BQ `audit_thesaurus` (#155) — doctrine d'audit thésaurus avec passes T1/T2/B1/A1/M1\n- BQ `audit_integrite_db` (#74) — sanity check FK et doublons schema\n", "type": "commande", "crit": false}, {"id": 154, "titre": "Sujets interdits dans le corpus — biodynamie, Steiner, anthroposophie", "contenu": "## Sujets interdits dans le corpus Sol Vivant\n\n### Règle absolue\n\nLe corpus \"Le Sol Vivant cet Holobionte\" est un corpus **scientifique**. Certains courants ou doctrines **pseudoscientifiques** ne doivent pas y apparaître comme références constructives (définitions qui s'appuient dessus, relations qui les valorisent, citations qui les adoptent).\n\n### Liste noire (à date)\n\n- **Biodynamie** (Rudolf Steiner, 1924)\n- **Anthroposophie** (doctrine source de la biodynamie)\n- **Préparations biodynamiques** (BD 500-507 : bouse en corne, achillée en vessie, etc.)\n- **Calendrier lunaire biodynamique**\n- Par extension, toute doctrine ésotérique présentée comme technique agricole validée\n\n### Ce qui est autorisé\n\n- **Contre-exemple pédagogique** : mentionner la biodynamie comme illustration d'une dérive pseudoscientifique, dans une section **dédiée et explicitement critique** (ex. un encadré \"pièges épistémiques\"). Doit rester exceptionnel et marqué.\n- **Flag `flag_pseudoscience=1`** sur un terme isolé (mais pas utilisé comme hyperonyme/rt pour des termes scientifiques).\n\n### Ce qui est interdit\n\n- Définition d'un terme scientifique qui **attribue son origine** ou **donne comme référence principale** la biodynamie / Steiner.\n- Relations `BT`/`RT` entre un terme scientifique et un terme pseudoscientifique (ex : Capital biologique --RT--> Agriculture Biodynamique).\n- Citations bibliographiques sur préparations biodynamiques utilisées dans une fiche scientifique.\n- Tout doublon d'un concept scientifique avec une version pseudoscientifique (ex : \"L'Organisme-Ferme\" thermodynamique **vs** \"l'Organisme-Ferme\" steinerien).\n\n### Process de vigilance\n\nÀ lancer avant tout import massif (export Jenni, analyse corpus, création fiche) :\n\n```sql\n-- Termes\nSELECT id, fr, doc_code, definition, flag_pseudoscience\nFROM terms\nWHERE lower(fr) LIKE '%biodynam%'\n   OR lower(definition) LIKE '%biodynam%'\n   OR lower(definition) LIKE '%steiner%'\n   OR lower(definition) LIKE '%anthroposoph%';\n\n-- Relations\nSELECT id, from_term_id, rel_type, to_term_id, to_term_text\nFROM term_relations\nWHERE lower(to_term_text) LIKE '%biodynam%'\n   OR lower(to_term_text) LIKE '%steiner%'\n   OR lower(to_term_text) LIKE '%anthroposoph%';\n\n-- Sources Jenni\nSELECT id, doi, auteurs, annee, titre_court\nFROM jenni_sources\nWHERE lower(titre_court) LIKE '%biodynam%'\n   OR lower(titre_complet) LIKE '%biodynam%'\n   OR lower(auteurs) LIKE '%steiner%';\n\n-- Sections (prompts), concept_cards, fiches : mêmes recherches textuelles\n```\n\nLe terme `flag_pseudoscience=1` dans le thésaurus reste la trace technique, mais cette BQ est la **doctrine visible** au démarrage de session via `session_start.py --db sol_vivant.db`.\n\n### Incident de référence — 2026-04-23\n\nAudit corpus complet (`analyse_corpus.py --type complet`). La passe T2 détecte un doublon `L'Organisme-Ferme` :\n- **#1158 (F)** — définition thermodynamique scientifique (Ikerd, Tello et al.) — **propre**\n- **#214 (F2)** — définition steinerienne (\"concept central de l'agriculture biodynamique, formulé par Rudolf Steiner en 1924\") — **contaminée**\n\nContamination associée :\n- Terme **#160 \"Agriculture Biodynamique\"** (F1/F2), flag_pseudoscience=1, déf détaillant les préparations BD 500-507\n- Relation **#168 Capital biologique --RT--> #160** (valorisation croisée)\n- Relations depuis #214 vers \"Rudolf Steiner\", \"Autosuffisance\" (concepts anthroposophiques)\n- Source **jenni_sources #404 Pettinelli 2023** \"Is there any influence of biodynamic preparation 501...\"\n\nCorrectif appliqué (2026-04-23) :\n- `DELETE FROM terms WHERE id IN (160, 214)` → 2 termes supprimés\n- `DELETE FROM term_relations WHERE from_term_id IN (160, 214) OR to_term_id IN (160, 214)` → ~11 relations supprimées\n- #1158 \"L'Organisme-Ferme\" (F) conservé comme source unique\n\nSource js#404 et citation dans fiche #33 : arbitrage séparé JMJ (référence bibliographique utilisée par §3.11 d'une fiche intégrée).\n\n### Corollaire — contrôle de nouveaux imports\n\nTout nouvel import (Jenni, enrichissement thésaurus, nouvelle source) qui ramène biodynamie/Steiner sans marqueur critique explicite doit être **rejeté à l'import** ou **flaggé** pour validation manuelle JMJ.\n\n### Faux positifs à ne pas traiter\n\nLes requêtes SQL de vigilance ci-dessus remontent des occurrences légitimes qui ne sont **pas** des contaminations :\n\n- **Steinernema** — genre de nématodes entomopathogènes (*Steinernema carpocapsae*, *S. feltiae*). Utilisé en protection biologique. Cf. card #91 IPMO.\n- **Auteurs nommés Steiner** — nom de famille scientifique courant (ex. Steiner 2019 agronomie soja brésilien, Steiner dans études basalt / enhanced weathering). Ne rien faire si le contexte est bibliographique strict.\n- **Système de Steiner** en mathématiques / autres contextes non-agricoles.\n\nRègle : ne purger que si le contexte est **agricole + doctrinal** (préparations biodynamiques, anthroposophie, calendrier lunaire, \"organisme-ferme\" steinerien, etc.). Avant toute suppression, lire le contexte et confirmer.\n", "type": "doctrine", "crit": true}]}, "validations": {"nom": "Pipeline validations", "entries": [{"id": 105, "titre": "Validations — workflow et structure (table dédiée)", "contenu": "## Validations — workflow et structure\n\n**Différence avec une fiche** : la fiche est un **zoom proactif** sur un sujet intéressant en soi ; la validation est un **comblement réactif** d''une dette identifiée dans le corpus (chaîne non validée, concept non étayé, lacune détectée par audit).\n\nLes deux contribuent au même objectif : **clôturer les prompts des docs de strate**. Cf. BQ « Modèle conceptuel — production du corpus ».\n\n### Tables\n\n```sql\nCREATE TABLE validations (\n  id              INTEGER PRIMARY KEY AUTOINCREMENT,\n  slug            TEXT UNIQUE NOT NULL,\n  titre           TEXT NOT NULL,\n  mode            TEXT NOT NULL,    -- 'validation' | 'renforcement' | 'comblement'\n\n  -- Objet à valider/combler\n  objet_type      TEXT,             -- 'chaine_causale' | 'concept' | 'lacune' | 'affirmation' | 'transversal'\n  objet_ref       TEXT,             -- ex: 'C7', id_term, 'S2.ch3.s2', texte libre\n\n  -- Cibles : ce qui sera clôturé par cette validation\n  docs_cibles     TEXT,             -- JSON ['F2','S2','P2','P5']\n  prompts_cibles  TEXT,             -- JSON [prompt_id,...] optionnel si granularité fine\n\n  -- Demande\n  question        TEXT,             -- formulation claire de ce qu'on cherche / ce qu'on valide\n\n  -- Cycle de vie\n  statut          TEXT DEFAULT 'a_faire',\n                                    -- a_faire | en_cours | envoye | recu | integre | archive\n  verdict         TEXT,             -- pour mode='validation' : 'confirme'|'infirme'|'nuance'|'reserves'\n\n  date_creation   TEXT DEFAULT (datetime('now')),\n  date_envoi      TEXT,\n  date_retour     TEXT,\n  date_integration TEXT,\n\n  notes           TEXT,             -- notes libres Claude (pas pour Jenni)\n  updated_at      TEXT DEFAULT (datetime('now'))\n);\n\nCREATE TABLE validation_sections (\n  id              INTEGER PRIMARY KEY AUTOINCREMENT,\n  validation_id   INTEGER NOT NULL REFERENCES validations(id),\n  ordre           INTEGER NOT NULL,\n  type            TEXT NOT NULL DEFAULT 'section',  -- intro | section | verdict\n  titre           TEXT,\n  contexte_sci    TEXT,             -- ce que le corpus dit déjà\n  instructions    TEXT,              -- questions/demandes précises à Jenni\n  enrichissement  TEXT,             -- contexte additionnel pour Jenni (rare)\n  UNIQUE(validation_id, ordre)\n);\n\nCREATE TABLE validation_contenus (\n  id              INTEGER PRIMARY KEY AUTOINCREMENT,\n  validation_id   INTEGER NOT NULL REFERENCES validations(id),\n  version         INTEGER DEFAULT 1,\n  contenu_brut    TEXT,             -- contenu .docx Jenni brut\n  contenu_integre TEXT,             -- contenu nettoyé/intégré\n  refs            TEXT,             -- JSON [doi,...] récupérés post-Jenni → intégrés dans `jenni_sources`\n  notes_claude    TEXT,             -- notes d'analyse Claude\n  date_import     TEXT DEFAULT (datetime('now')),\n  UNIQUE(validation_id, version)\n);\n```\n\n### Modes\n\n| Mode | Quand l''utiliser | Objet typique |\n|---|---|---|\n| `validation` | Vérifier une affirmation existante du corpus, valider une chaîne causale | `chaine_causale` (C1-C9), `affirmation` |\n| `renforcement` | Renforcer un sujet sous-couvert dans le corpus | `transversal` (par strate ou thématique) |\n| `comblement` | Combler une lacune précise identifiée par audit | `lacune` (section/chapitre précis) |\n\nLa frontière entre les 3 modes peut être floue — c''est intentionnel. Ce qui compte est l''objet (`objet_type`/`objet_ref`) et les docs cibles. Le mode est informatif.\n\n### Cycle de vie (`validations.statut`)\n\n```\na_faire   → créée en DB (objet, mode, docs_cibles, sections)\nen_cours  → Claude prépare/affine le prompt Jenni\nenvoye    → fichier .txt généré et copié dans Jenni\nrecu      → .docx Jenni récupéré\nintegre   → contenu intégré dans prompts.contexte_sci/.enr des docs cibles\n            + termes extraits vers terms\n            + contenu brut/intégré stocké dans validation_contenus\n            + verdict renseigné si mode='validation'\narchive   → terminé, sort de la vue active\n```\n\n### Workflow\n\n1. **Identifier une dette** : audit révèle une lacune, une chaîne causale non validée, un concept faible\n2. **Créer la validation** : `INSERT INTO validations` avec mode + objet + docs_cibles\n3. **Renseigner les sections** : `validation_sections` (intro, sections de question, verdict si validation)\n4. **Générer le prompt** : `export_validation.py --slug <slug>` → `recherches/prompts_validation_{slug}.txt`\n5. **Envoyer à Jenni**, récupérer le .docx\n6. **Intégrer** : Claude analyse le .docx → `validation_contenus` + `prompts.contexte_sci/.enr` des docs cibles + verdict si validation\n7. **Marquer `integre`**, puis `archive` quand terminé\n\n### Charte applicable\n\nLes prompts de validation suivent la **charte Jenni générique** (BQ #40, #41, #101) :\n- Pas de codes docs (S0, V2…)\n- Pas de méta-vocabulaire (corpus, thésaurus…)\n- Citations format `[N]`\n- Blocs séparés par `---`\n\n**Pas de structure standardisée 8 sous-blocs** (qui est spécifique aux fiches techniques). Une validation a une structure libre adaptée à la question posée.\n\n### Distinction des champs (règle stricte)\n\n- `validation_sections.contexte_sci` = ce que le corpus/la science dit déjà sur l''objet\n- `validation_sections.instructions` = questions précises à Jenni pour valider/combler\n- `validation_sections.enrichissement` = contexte additionnel pour Jenni si nécessaire (rare)\n- `validation_contenus.contenu_integre` = ce que Jenni a renvoyé, intégré\n\n**Jamais** mélanger contenu reçu et instructions de production — chacun dans sa table.\n\n### Lien avec la production du corpus\n\nUne validation `integre` alimente les `prompts` des docs cibles, contribuant à leur clôture. Tant qu''une validation pertinente reste à produire, le doc cible n''est pas en `pret_a_rediger`.\n\n### Exemples actuels (à migrer en Phase 2)\n\n| Slug actuel | Source | Migration |\n|---|---|---|\n| `validation-c7-performance-robustesse` (table fiches) | `revue_critique` de la chaîne C7 | mode=`validation`, objet=`chaine_causale:C7` |\n| `thermotolerance-microbiome-sol` (table fiches) | `revue_critique` | mode=`validation`, objet=`transversal:thermotolerance` |\n| `prompt_validation_notes_2026-04-08.txt` (orphelin) | Affirmations issues de notes Jenni | mode=`validation`, objet=`affirmation` (multi) |\n| `renforce_sections_manquantes_*.txt` (orphelin) | Audit | mode=`comblement`, objet=`lacune` (multi) |\n| `renforce_modules_faibles_*.txt` (orphelin) | Audit | mode=`renforcement` |\n| `renforce_pratiques_fermentations_economie_*.txt` | Audit P | mode=`renforcement`, objet=`transversal:fermentations_economie` |\n| `renforce_sol_carbone_redox_methodes_*.txt` | Audit S | mode=`renforcement` |\n| `renforce_vegetal_holobionte_nutrition_*.txt` | Audit V | mode=`renforcement` |\n\n### ⚠ Etat actuel (avril 2026)\n\n`validation_sections` et `validation_contenus` existent en DB avec des donnees historiques (81 et 16 rows respectivement) mais **aucun script actif ne les alimente**. La logique des validations est en pause (cf. BQ #127). Les BQ qui decrivent leur workflow sont conservees comme reference, mais les scripts `export_validation.py` / `import_validation.py` ne sont pas operationnels aujourd'hui.\n\n\n## Contexte\n\nworkflow validations\n", "type": "reference", "crit": false}, {"id": 159, "titre": "Question de sourçage — docx épuré (comblement réactif léger d'une dette)", "contenu": "## Question de sourçage — la lane légère du comblement réactif\n\n### Trois lanes pour alimenter le corpus via Jenni\n\n| Lane | Nature | Outil | Sortie |\n|---|---|---|---|\n| **Fiche** | zoom proactif sur un sujet | `gen_fiche_docx.py` | docx → `recherches/fiches/` |\n| **Validation lourde** | comblement réactif structuré multi-sections | `export_validation.py` | .txt → `recherches/questions/` |\n| **Question de sourçage** | comblement réactif **léger** (une question ciblée) | rédaction directe Claude | docx → `recherches/questions/` |\n\nFiche et validation sont décrites dans BQ #105 (fiche = zoom proactif ;\nvalidation = comblement réactif d'une dette). La **question de sourçage** est la\nforme la plus légère du comblement réactif : une question scientifique autonome\nposée à Jenni pour faire **sourcer ou vérifier des affirmations existantes** du\ncorpus, ou lever une divergence interne.\n\n### Quand l'utiliser\n\n- Sourcer un lot d'affirmations d'un document (ex : faune du sol — vers de terre,\n  mésofaune, nématodes, réseau trophique).\n- Lever une divergence chiffrée interne (ex : part microbienne du carbone stable,\n  65 % vs 80 %).\n- Combler réactivement une petite dette identifiée par audit, **sans** assemblage\n  structuré multi-sections.\n\n**Si le besoin est un assemblage lourd** (plusieurs sections avec graines, plan\nimposé, grille de verdict A/B/C/D) → c'est une **validation** (table `validations`\n+ `export_validation.py`), pas une question. Ne pas surcharger une question de\nsourçage avec un dump de termes canoniques ou une grille de modes : c'est l'erreur\nde la faune (session 2026-06-02).\n\n### Forme du livrable\n\n- **docx Word-natif** chargeable dans Jenni (pas `.md`, pas `.txt`) →\n  `recherches/questions/` (`config paths.recherches_questions`).\n- **Title + intro + H1** (H2 si besoin), **prose continue**.\n- **Termes canoniques tissés dans le texte** — jamais en liste séparée (#146 règle 6).\n- Demande explicite : **sources académiques open-access avec DOI**, format APA.\n- **ZÉRO méta-vocab** (#146 règle 4 + #120) : pas de code doc, ni `corpus`,\n  `strate`, `fiche`/`card`/`chaîne`. Scan FORBIDDEN obligatoire avant commit\n  (hook `check_forbidden_jenni`).\n- **Traçabilité hors du docx** : date / origine / « au retour de Jenni » vivent\n  dans un `.md` compagnon ou les notes — **jamais** dans le docx envoyé.\n\n### Production — par Claude, en direct, depuis la doctrine\n\nLa question est rédigée **par Claude en direct depuis #146**, jamais par un\ngénérateur ni un agent. Un assemblage templated (concaténation de sections +\ndump de termes + grille) reproduit exactement le `.txt` robotique rejeté lors de\nla faune. Cf. règle absolue « pas d'agents rédacteurs » + « pas de batch\néditorial ». En pratique : `python-docx`, une poignée de paragraphes.\n\n### Masques canoniques\n\n- `recherches/questions/question_faune_du_sol_2026-06-02.docx` — Title + 4 H1,\n  prose, demande DOI, zéro violation (**modèle docx**).\n- `recherches/questions/question_carbone_origine_microbienne_2026-05-30.md` —\n  en-tête de traçabilité + section « Prompt à envoyer à Jenni » (modèle du\n  **découplage** traçabilité / contenu envoyé).\n\nUn masque sert de gabarit de forme, pas de source de doctrine : produire DEPUIS\n#146, jamais en rétro-concevant le format depuis un output (#146 ACTIVATION).\n\n### Au retour de Jenni\n\nIntégrer les sources via le pipeline sources (`jenni_sources`), puis harmoniser\nles affirmations / valeurs divergentes sur ce que Jenni a établi.\n\n### Pourquoi cette entrée (session 2026-06-02)\n\nPour sourcer la faune du sol, Claude a enchaîné 3 formats faux (md ad hoc plein\nde méta-vocab → `.txt` validation surchargé → copie d'un output) avant d'arriver\nau docx épuré. Cause racine double, corrigée :\n\n1. **Doctrine #146 non activée** au moment de produire → déclencheur ajouté dans\n   `claude_rules.redaction_documents_jenni` (lire+appliquer #146 AVANT tout doc Jenni).\n2. **Lane « question » non formalisée** → cette entrée.\n\nEn complément : `recherches/questions/` existait mais était absent de\n`config[paths]` (ajouté : `recherches_questions`) ; `export_validation.py`\npointait en dur sur `Publications/recherches/` (recâblé sur la config).\n", "type": "doctrine", "crit": false}, {"id": 160, "titre": "Intégration d'une réponse de sourçage — refs Jenni → corpus (pendant de l'intégration fiche)", "contenu": "## Intégration d'une réponse de sourçage — refs Jenni → corpus\n\n> **Quand consulter cette BQ** — Jenni renvoie un docx **en réponse à une\n> question / validation de sourçage** (BQ #159, #105) : prose sourcée +\n> bibliographie. Mots-clés de déclenchement : *retour sourçage, réponse Jenni\n> question, intégrer QS, integrate_validation_refs, refs validation*.\n\n### Le maillon qui manquait\n\nLe corpus avait deux pipelines de retour Jenni :\n- **Fiche** → `integrate_fiche.py` + `integrate_fiche_refs.py` (contenu + refs).\n- **Source biblio unique** (rapport JMJ) → `integrate_source.py` (une source à la fois).\n\nMais **rien** pour la réponse à une **question de sourçage** : un docx Jenni de\nprose + biblio dont le but n'est pas de créer une fiche, mais de **sourcer des\naffirmations déjà présentes** dans un doc de strate. C'est le pendant de\nl'intégration fiche, **cible = une `validation`** (et ses `prompts_cibles`), pas\nune fiche. Outil : `tools/jenni/integrate_validation_refs.py`.\n\n### Invariant du format Jenni (confirmé JMJ 2026-06-02)\n\nJenni exporte en mode **« Citations avec hyperlien »** (recommandé Google Docs) :\n- **Bibliographie TOUJOURS en fin de document** (style `JenniRefBody`), APA avec DOI.\n- Citations inline **`(Auteur, Année)` cliquables** (hyperliens `dummy-citation.com`\n  à nettoyer — artefact interne Jenni, **non résoluble** en DOI).\n\n`tools/lib/parse_jenni_docx.py` (`parse_docx`) gère déjà les deux : il lit le bloc\nbiblio final et nettoie les URLs dummy. **Ne jamais** tenter de décoder un blob\ndummy-citation : la vraie ref est dans la biblio de fin, appariée par\n`(surname, année)`.\n\n### Partie MÉCANIQUE (scriptée) — `integrate_validation_refs.py`\n\n```bash\n# 1. dry-run : extraction + dédup + aperçu rattachement\npython3 tools/jenni/integrate_validation_refs.py --db sol_vivant.db \\\n    --validation <slug> --docx docx/<reponse>.docx\n# 2. après revue → apply\npython3 tools/jenni/integrate_validation_refs.py --db sol_vivant.db \\\n    --validation <slug> --docx docx/<reponse>.docx --apply\n```\n\nLe script enchaîne :\n1. **parse** — sections + refs (`parse_docx`).\n2. **dedup** — DOI / titre / `surname+année` contre `jenni_sources` (réutilise les\n   helpers de `integrate_fiche_refs`).\n3. **map** — chaque ref → section(s) du doc via sa citation inline. Mapping\n   **H2 du docx → chapitre → `prompts_cibles`** : les N sections de niveau 2 du\n   docx sont appariées, dans l'ordre, aux N chapitres distincts des\n   `prompts_cibles`. Une ref citée sous un H2 se rattache à toutes les sections\n   `prompts` de ce chapitre.\n4. **apply** — INSERT `jenni_sources` (nouvelles) + `source_usages`\n   (`entity_type='prompt'`, sinon `'doc'` en fallback biblio-seule) + **capte la\n   PROSE-réponse** dans `validation_contenus.contenu_brut` + clôture la\n   validation (`statut=integre`, `date_retour`, `date_integration`, `verdict`).\n4bis. **capture de prose (volet H, depuis 2026-06-02)** — le docx de sourçage\n   décrit des **mécanismes** (pas que des refs) ; le pipeline les archive désormais\n   en DB (`validation_contenus`, requêtable) au lieu de les laisser uniquement dans\n   le docx archivé. Demande JMJ : « des mécanismes y sont décrits, dommage de perdre\n   cette matière ». Cette prose alimente le **volet H** des méta-analyses de fiches\n   (croisement des réponses de sourçage — BQ `wf_fiche_integration`).\n5. **archivage** (factorisé `lib/doc_archive.py::archive_integrated_docx`) — déplace\n   le docx réponse → `docx/archives/` ET son **pendant** question →\n   `recherches/questions/archives/` (pendant deviné par convention de nommage depuis\n   le slug : `sourcage-faune-du-sol` → `question_faune_du_sol_*.docx`, ou forcé via\n   `--question-docx`). Idempotent, non bloquant, après le commit. Même principe que\n   les lanes fiche et thésaurus — voir réflexe `archivage_fiches`.\n\nGranularité de rattachement assumée : **chapitre** (pas H3). Le mapping H3 docx →\nH2 corpus serait fuzzy et fragile ; le niveau chapitre est robuste et honnête\n(« cette source étaye le chapitre vers-de-terre de V1 »).\n\n### Partie CONSCIENTE (à la main, Claude) — l'analyse intégrative\n\nLe script ne fait QUE la plomberie. Conformément à la doctrine « Intégration\nconsciente du retour Jenni », Claude assure ensuite :\n\n- **Harmonisation des valeurs** — *uniquement si le doc cible a déjà du contenu\n  rédigé* (`prompt_contenus`/`doc_contenus`). Comparer les « valeurs\n  consensuelles » de Jenni aux affirmations du corpus ; signaler à JMJ toute\n  divergence chiffrée (ne **pas** réécrire le contenu scientifique — éditorial =\n  JMJ/Jenni).\n- **Cas pré-sourçage** — si le doc est encore au stade **graines**\n  (`contexte_sci`, pas de contenu rédigé), il n'y a **rien à harmoniser** : la\n  question de sourçage **pré-équipe** les sections en sources, prêtes pour quand\n  Jenni rédigera le doc. C'est un usage légitime (cf. faune V1, ci-dessous).\n- **Propagation transversale** — au jugement : les sources peuvent aussi étayer\n  des `concept_cards` ou des chaînes du même sujet. Lien optionnel, pas\n  systématique.\n\n### Masque canonique — faune du sol (2026-06-02)\n\n- Validation **#15** `sourcage-faune-du-sol` (`objet_ref=V1`,\n  `prompts_cibles=[162…170]`), docx réponse `docx/QS-faune_du_sol.docx`.\n- 47 refs (46 DOI) → **33 nouvelles** sources, 1 enrichie, 13 déjà en DB ;\n  **111 `source_usages`** rattachés aux 9 sections V1 (11-15 sources/section).\n- V1 était au stade graines (0 contenu) → **pré-sourçage**, aucune harmonisation.\n- Validation #15 close (`integre`). Dette audit #3 (« V1 faune : 0 source »)\n  résolue.\n\n### Différences avec les pipelines voisins\n\n| Pipeline | Cible | Crée du contenu ? | Refs |\n|---|---|---|---|\n| `integrate_fiche_refs.py` | fiche | oui (la fiche) | refs → `entity_type='fiche'` |\n| `integrate_source.py` | — | non | **une** source biblio (rapport JMJ) |\n| `integrate_validation_refs.py` | **validation** | non | refs → `prompt`/`doc` du strate ciblé |\n\n### Pourquoi cette entrée (2026-06-02)\n\nPour clore la dette #3 (faune), JMJ a envoyé une question de sourçage à Jenni puis\na poussé la réponse (`docx/QS-faune_du_sol.docx`). À l'intégration, le maillon\nmanquait : `integrate_source.py` n'avale qu'une source à la fois (format\n`Champ : valeur`), pas un docx de 47 refs ; `integrate_fiche_refs.py` est\ncloué à une fiche. D'où ce script + cette doctrine. Réflexe actif :\n`claude_rules.integration_reponse_sourcage`.\n", "type": "workflow", "crit": true}]}}, "web": {"web": {"nom": "Pages web (toutes)", "entries": [{"id": 152, "titre": "Doctrine UI — blocs ≤ 2 lignes max, idéalement 1", "contenu": "## Doctrine UI — densité des blocs\n\n**Règle absolue** : tout bloc visuel répété (carte de catégorie, item de liste,\nbadge cliquable, accordéon) doit tenir sur **2 lignes maximum**, et\n**idéalement sur une seule** quand le contenu le permet.\n\n### Pourquoi\n\n- **Densité** : sur les pages corpus (Cahier, Cartographie, Concept Cards…) il\n  y a souvent 30+ items à parcourir. Chaque ligne supplémentaire par bloc =\n  2/3 d'écran perdus.\n- **Lecture** : 2 lignes max permet un balayage vertical rapide sans saccades.\n- **Reproductibilité** : règle simple, vérifiable visuellement, applicable\n  partout pareil.\n\n### Implémentation\n\n**SvExpandableCard** (composant partagé, `tools/lib`/`html_templates#16`) :\n- mode horizontal par défaut : badge à gauche + titre/subtitle/progress à droite\n  (≤ 3 lignes en pratique car badge prend la hauteur)\n- mode `compact` (prop boolean) : layout vertical à 2 lignes maxi\n  - ligne 1 : badge + titre + chevron\n  - ligne 2 : subtitle + barre de progression + %\n  - **si ni subtitle ni progress → ligne 2 supprimée → 1 seule ligne**\n\nC'est cette dernière règle qui est la doctrine : ne pas rendre la 2e ligne\nsi elle est vide. Évite de créer une zone vide qui occupe verticalement.\n\n### Vérification\n\nÀ chaque ajout d'un bloc visuel :\n1. Compter les lignes en mode normal et en mode rempli\n2. Si ≥ 3 lignes → activer le mode compact ou retirer du contenu\n3. Si subtitle/progress optionnels et souvent vides → vérifier que le\n   composant gère `null/undefined` sans afficher de zone vide\n\n### Cas d'application au 2026-04-23\n\n- ✓ Grille strates Cartographie : `compact` activé, badge+titre+chevron+barre = 2 lignes\n- ✓ Liste fiches accordéon Cahier : `compact` + subtitle null sauf intégration\n  partielle → 1 ligne (2 si subtitle apparaît)\n- ✓ Bloc « Pour aller plus loin » : `compact` + subtitle « card primaire/référence »\n  → 2 lignes\n- ✓ Catégories fiches Cahier (Transversales/Techniques/...) : mode horizontal,\n  badge cercle + (titre / subtitle « N fiches ») → 2 lignes effectives\n\n### Anti-patterns à éviter\n\n- Sous-titre redondant qui répète une info visible ailleurs\n  (ex. « 5 sections » sous une fiche dont les sections s'affichent en cliquant)\n- Description longue dans une carte de liste (déplacer vers tooltip ou panneau\n  détaillé en clic)\n- Plusieurs lignes de métadonnées (date + auteur + tags + statut) — n'en\n  garder qu'une, mettre le reste sur la vue détaillée\n\n### Règle absolue\n\nAvant de fusionner une modif UI qui ajoute un bloc liste : compter les lignes,\nsi > 2 → revoir le design. Pas d'exception sans discussion.\n\n\n## Contexte\n\nDoctrine ajoutée 2026-04-23 après réorganisation grille strates + accordéon fiches Cahier. JMJ : \"Dans la mesure du possible les blocs sur 2 lignes maxi idéalement sur une seule\".\n", "type": "regle", "crit": false}, {"id": 33, "titre": "12 illustrations produites", "contenu": "Tous les prompts sont en DB :\n```sql\nSELECT concept, docs_codes, statut FROM illustration_prompts ORDER BY concept;\n```\n\n**Lot 1 :** Rhizophagie · Colonne de Winogradsky\n**Lot 2 :** Priming effect · Micro-agrégats · Nécromasse\n**Lot 3 :** CMN · ISR/SAR · Y-A-S · Fe/P shuttle · Agrégat microsites · C/N · Chaîne C1\n\nRécupérer un prompt FigureLabs :\n```sql\nSELECT figurelabs FROM illustration_prompts WHERE concept='Stratégies Y-A-S';\nSELECT mermaid FROM illustration_prompts WHERE concept='Cycle de la Rhizophagie';\n```\n\n## Contexte\n\nRécupérer ou utiliser un prompt illustration\n", "type": "reference", "crit": false}, {"id": 84, "titre": "Architecture pages web", "contenu": "## Architecture des pages HTML\n\nChaque page web interactive suit le même pattern en 4 couches :\n\n1. **`web_pages`** — Métadonnées (slug, title, subtitle, description, og_image, script_path, status, icon, ordre)\n2. **`html_templates`** — Templates par page (head, page_css, page_js) identifiés par `page_slug`\n3. **Script Python** `gen_*.py` — Extrait les données de la DB, charge les templates, appelle `render_page()`\n4. **`web_template.py`** — Module partagé : charte CSS, header SV, OG tags, favicon, structure HTML, pré-compilation JSX\n\n### Pages actives (état avril 2026)\n\n**Pages publiques** (visibles dans la nav bar) :\n\n| Slug | Script | Status | Icône | Description |\n|------|--------|--------|-------|-------------|\n| `index` | `gen_web.py` | publie | 🗺️ | Cartographie interactive du corpus |\n| `mo_calculateur` | `gen_mo_calc.py` | publie | 🧪 | Calculateur C/N et matière organique |\n| `lifofer` | `gen_lifofer.py` | active | 🌿 | Calculateur LiFoFer |\n| `triangle_textures` | `gen_triangle_textures.py` | publie | 🔺 | Triangle GEPPA interactif |\n| `concept_cards` | `gen_concept_cards.py` | active | 📋 | Atomes conceptuels du corpus (grille) |\n| `cahier` | `gen_cahier.py` | publie | 📚 | Cahier de Science — livre pédagogique multi-onglets (chapitres existants + fiches intégrées regroupées par thème). Charge `config.cahier.chapitres`, `config.cahier.onglets` et `fiche_contenus.contenu_integre`. |\n\n**Pages internes** (hors nav — outils de pilotage JMJ/Claude) :\n\n| Slug | Script | Status | Icône | Description |\n|------|--------|--------|-------|-------------|\n| `dashboard` | `gen_dashboard.py` | interne | 📊 | Tableau de bord (vision rapide corpus pour Claude) |\n| `ebauches` | `gen_ebauches_web.py` | interne | 📝 | Lecture web des ébauches Jenni (mammoth) |\n| `explorer` | `gen_explorer.py` | interne | 🔍 | Explorer DB — inspection tables et dashboard maintenance |\n| `technique` | `gen_technique.py` | interne | 📖 | Guide technique (architecture, sessions, git) |\n\nLe statut `interne` exclut la page de la barre de navigation inter-pages (filtre `status != 'interne'` dans `load_nav_pages()`). La page est toujours régénérée par `regen_all.py` et accessible par URL directe.\n\n### Cahier de Science — spécificités\n\n- **Structure des onglets** : `config.cahier.onglets` (JSON). Par défaut 2 onglets : `Pédagogie` (type=`all_chapitres`, rend tous les chapitres de `config.cahier.chapitres`) et `Fiches` (type=`all_fiches`, rend toutes les fiches intégrées en accordéon, groupées par type). Un onglet peut aussi référencer un `chapitre_id` ou une liste explicite `fiche_ids` si besoin.\n- **Rendu des fiches** : pour chaque `fiche_id`, `gen_cahier.py` lit `fiche_contenus.contenu_integre` et `fiche_contenus.refs` (liste JSON) et les passe à `SvRichText` + `SvSourceList`. Les refs sont normalisées depuis les clés FR (`auteurs`, `annee`) vers les clés attendues par `SvSourceList` (`authors`, `year`).\n- **Format des fiches** : les `contenu_integre` suivent la charte Jenni (Introduction + sections `## 1. Titre` + sous-sections `#### Titre`). `SvRichText` rend directement ces headings Markdown.\n- **Deep-link** : `cahier.html#tab-<id_onglet>` ouvre directement l'onglet choisi.\n- **Navigation** : `SvTabs` sticky en haut (charte `.sv-tabs` top:0 z-index:10). Pas de sidebar.\n\n### Workflow de création d'une nouvelle page\n\n1. Créer l'entrée `web_pages` (slug, title, subtitle, status, icon, ordre)\n2. Créer les 3 `html_templates` : head (CDN React/Babel), page_css, page_js (React JSX)\n3. Créer le script `gen_*.py` dans `tools/docs/` (auto-détecté par `tools/lib/scripts_inventory.py`)\n4. Ajouter le script dans la liste `GENERATORS` de `tools/regen_all.py`\n5. `git add tools/docs/gen_<page>.py` puis commit\n6. Tester : `python3 tools/docs/gen_<page>.py --db sol_vivant.db`\n7. Les données sont toujours dans `config` ou dans les tables de référence — **jamais hardcodées dans le template JS**\n", "type": "reference", "crit": false}, {"id": 34, "titre": "Structure d'un prompt FigureLabs", "contenu": "```\n⚠️ IMPORTANT: All text labels, titles, annotations and captions must be written in FRENCH.\n\n[Description générale et titre français]\n\n[Zones/étapes numérotées avec couleurs exactes]\n[Morphologie exacte des microbes si présents]\n[Éléments latéraux et annotations]\n[Style journal cible]\n[Labels obligatoires en français]\n```\n⚠️ L'instruction FRENCH doit être en première ligne — FigureLabs la respecte mieux en position 1.\n\n## Contexte\n\nCréer un nouveau prompt FigureLabs\n", "type": "reference", "crit": false}, {"id": 85, "titre": "Charte graphique Sol Vivant", "contenu": "## Charte graphique Sol Vivant\n\nStockée en DB `html_templates(slug='sv-charter-css', page_slug=NULL, type='page_css')` — chargée lazy par `tools/lib/web_template.py::get_charter_css(conn)` au 1er `load_templates()` (migration 2026-04). Editer la charte = UPDATE DB, pas besoin de toucher au code Python. Toutes les pages DOIVENT utiliser ces variables et classes.\n\n### Variables CSS (26)\n\n```\n--bg: #f4f6f8          --card-bg: #ffffff\n--text: #1e293b         --text-secondary: #64748b\n--accent: #2563EB       --accent-dark: #1d4ed8    --accent-light: #DBEAFE\n--border: #e2e8f0       --border-hover: #cbd5e1\n--radius: 10px          --shadow / --shadow-hover\n--success: #059669      --success-light: #D1FAE5\n--warning: #D97706      --warning-light: #FEF3C7\n--danger: #DC2626       --danger-light: #FEE2E2\n--info: #2563EB         --info-light: #DBEAFE\n--header-from: #0f172a  --header-to: #1e3a5f\n```\n\n### Classes communes\n\n| Classe | Usage |\n|--------|-------|\n| `.sv-header` | Bandeau bleu gradient (auto via `render_page`) |\n| `.sv-container` | Wrapper centré max-width 1400px |\n| `.sv-card` | Carte blanche avec ombre et border |\n| `.sv-tag` / `.sv-tag-*` | Badges colorés (doc, term, info, risk, test) |\n| `.sv-callout` / `.sv-callout-*` | Encarts warning/success/danger |\n| `.sv-btn` | Bouton accent |\n| `.sv-input` | Champ de saisie |\n| `.sv-nav` | Fil d'Ariane |\n| `.sv-footer` | Pied de page |\n\n### Inline emphasis (refonte avril 2026)\n\n| Classe | Usage |\n|--------|-------|\n| `.sv-mark` | Surlignage inline léger (fond `--accent-light`, texte `--accent-dark`). Pour les termes-clés, concepts pivot, ou fragments à mettre en valeur dans un paragraphe. |\n| `.sv-emphasis` | Gras inline (équivalent sémantique de `<strong>`), couleur `--text`. |\n\n### Bloc de section unifié (refonte avril 2026)\n\n| Classe | Usage |\n|--------|-------|\n| `.sv-section-block` | Conteneur d'une section de page (marge verticale unifiée) |\n| `.sv-section-title` | Titre de section. Modificateurs : `.sv-section-title-h2` et `.sv-section-title-h3` |\n| `.sv-section-icon` | Préfixe emoji optionnel dans le titre |\n\nUtiliser via le composant React `SvSection` plutôt qu'en JSX brut (cf. BQ #99).\n\n### Bloc texte riche (refonte avril 2026)\n\n| Classe | Usage |\n|--------|-------|\n| `.sv-richtext` | Wrapper autour du rendu `SvRichText` : line-height unifié, spacing des `<p>` et `<ul>` internes |\n\n### Règle : pas de couleurs hardcodées\n\nDans le CSS spécifique à la page (html_templates type=page_css), toujours utiliser `var(--*)` plutôt que des hex. Exemple : `color: var(--success)` et non `color: #059669`.\n\nDans le JSX React (page_js), idem : utiliser `style={{color:'var(--success)'}}`. Les classes Tailwind ne sont plus autorisées depuis la refonte vers la charte sv-* unifiée (avril 2026). Toute classe de style (`bg-*`, `text-*`, `rounded-*`…) doit être soit une classe `sv-*` soit un style inline avec les variables CSS.\n\n### Legacy en cours de migration\n\n- `.sv-accordion*` (CSS dans CHARTER_CSS) est **legacy** — remplacé par `SvCollapse` + `.sv-collapse*`. Encore utilisé par `mo-calc-js` et `index-js` (migration progressive). Toute nouvelle page doit utiliser `SvCollapse` uniquement.\n- `vendor/tailwind.min.css` et `vendor/tailwind.js` sont obsolètes (plus référencés depuis la refonte sv-*). À supprimer dans une passe de nettoyage dédiée.\n\n### Échelle typographique pilotée par --font-scale (avril 2026)\n\nL'échelle font-* dérive d'une variable `--font-scale` (defaut `1`) :\n```\n--font-scale: 1;\n--font-2xs: calc(0.68rem * var(--font-scale));\n--font-xs:  calc(0.75rem * var(--font-scale));\n--font-sm:  calc(0.82rem * var(--font-scale));\n--font-base:calc(0.9rem  * var(--font-scale));\n--font-md:  calc(1rem    * var(--font-scale));\n--font-lg:  calc(1.15rem * var(--font-scale));\n--font-xl:  calc(1.5rem  * var(--font-scale));\n--font-2xl: calc(1.8rem  * var(--font-scale));\n--font-1-4: calc(1.4rem  * var(--font-scale));\n```\n\nLe bouton zoom typo `A−/A/A+` (toolbar flottante) modifie `--font-scale` en runtime → toutes les `--font-*` suivent. Persistance `localStorage('sv-font-scale')`.\n\n**Règle absolue** : ne jamais hardcoder de `font-size: <rem>` dans un page_css ou un style inline JSX. Toujours `var(--font-*)`. Sinon le zoom typo ne suit pas.\n\n### Échelle d'espacement\n\n```\n--space-2xs: 0.25rem\n--space-xs:  0.5rem\n--space-sm:  0.75rem\n--space-md:  1rem\n--space-lg:  1.25rem\n--space-xl:  1.5rem\n--space-2xl: 2rem\n```\n\nÀ utiliser pour padding/margin plutôt que des valeurs `rem` arbitraires.\n\n### Mode sombre — variables theme-aware\n\nVariables CSS dupliquées dans `[data-theme=\"dark\"]` ET `@media (prefers-color-scheme: dark)`. Toggle via le bouton `☾/☀` de la toolbar.\n\n**Règles** :\n- TOUJOURS définir `color` explicite quand on définit `background`. Sans ça, le texte hérité peut devenir illisible quand le fond change en dark.\n- Les `--*-light` (success/warning/danger/info) deviennent **très foncés** en dark (#064e3b, #451a03, etc.). Les classes `.sv-callout-*` doivent forcer leur `color` via `var(--color-*-text)`.\n- Pour les fonds papier crème (`.sv-cahier`, `.sv-science-note`), utiliser `var(--paper-bg)` / `--paper-bg-2` / `--paper-border` (theme-aware).\n- Pour fonds secondaires (accordéon, callout neutre), utiliser `var(--color-bg-subtle)` jamais `#f8fafc` en dur.\n\n### Navigation captive (sticky)\n\n`.sv-nav-pages` est `position: sticky; top: 0; z-index: 20` ; reste sur **1 ligne** (`overflow-x: auto` si débordement). Le bandeau `.sv-header` peut donc s'effacer au scroll.\n\n`.sv-tabs` est `sticky; top: 2.1rem` (2.5rem mobile) — collé juste sous la nav-pages. Profite de l'espace libéré pour mettre une intro accordéon (`SvTabIntro`) au-dessus du contenu.\n\n### Onglets — 2 niveaux distincts\n\n| Composant | Usage | Look |\n|-----------|-------|------|\n| `SvTabs` | Niveau 1 (Pratique / Comprendre, Données / Analyse, etc.) | Vrais onglets : coin arrondi haut + fond carte sur active |\n| `SvSubTabs` | Niveau 2 (sous-onglets dans un onglet niveau 1) | Pills compactes inline, fond vert sur active |\n\n**Règle** : ne jamais utiliser deux `SvTabs` imbriqués (confusion hiérarchique). Si un onglet niveau 1 a des sous-vues, utiliser `SvSubTabs`.\n\n`SvSubTabs` doit être accompagné d'un `useEffect(() => setStateLocal(null), [subtab])` pour réinitialiser les states locaux (accordéons ouverts, etc.) au changement de sous-onglet.\n\n\n### Bandeau `.sv-header` — hiérarchie refondue (avril 2026)\n\n**Principe** : le seul élément qui change d'une page à l'autre est le **titre de la page**. Le nom du corpus (identique partout) est relégué en lien discret au-dessus.\n\n```html\n<header class=\"sv-header\">\n  <a class=\"sv-corpus-link\" href=\"index.html\">Le Sol Vivant cet Holobionte<\/a>  <!-- petit, opacity 0.6 -->\n  <h1>Calculateur Matière Organique<\/h1>                                       <!-- titre de la page -->\n  <div class=\"sv-subtitle\">C/N, humification, mélanges interactifs<\/div>       <!-- description -->\n  <div class=\"sv-meta\">Jean-Michel Juzan — Généré le ... — CC BY-NC-SA<\/div>   <!-- meta -->\n<\/header>\n```\n\n**Règles strictes** :\n- Chaque ligne du bandeau est contrainte sur **une ligne stricte** (`white-space: nowrap; overflow: hidden; text-overflow: ellipsis`). Garantit une hauteur de bandeau identique sur toutes les pages.\n- Police via variables charte uniquement :\n  - `.sv-corpus-link` : `var(--font-xs)` + opacity 0.6\n  - `.sv-header h1` : `var(--font-xl)` (1.5rem × --font-scale)\n  - `.sv-subtitle` : `var(--font-sm)` + opacity 0.7\n  - `.sv-meta` : `var(--font-xs)` + opacity 0.45\n- Responsive `@media (max-width: 900px)` : h1 passe à `var(--font-lg)`.\n- **Aucun page_css ne doit overrider** `.sv-header*`. Le bandeau est strictement identique sur toutes les pages.\n\n### Sync cross-tab zoom typo + thème (avril 2026)\n\nQuand l'utilisateur change `A−/A/A+` ou `☾/☀` dans un onglet, tous les autres onglets ouverts se mettent à jour sans reload, via l'event `window.addEventListener('storage', ...)`.\n\nMécanisme :\n- Écriture : `svSetFontScale(scale)` et `svToggleTheme()` écrivent dans `localStorage('sv-font-scale'|'sv-theme')`.\n- Réception : chaque onglet écoute `storage`, lit `e.newValue`, applique à `:root` et rafraîchit l'état actif des boutons.\n- Au chargement initial, `localStorage('sv-font-scale')` est relu directement (pas via `getComputedStyle`) pour déterminer le bouton actif — évite un flicker où `--font-scale` est encore à 1 quand le DOM est parsé.\n\n### Colonne de lecture — `.sv-text-column` (avril 2026)\n\n**Règle** — tout contenu textuel destiné à la lecture (fiches, documents,\nchapitres, accordéons d'explication) DOIT être enveloppé dans un wrapper\n`<div className=\"sv-text-column\">` (max-width: 900px par défaut, pilotée\npar `--text-column-max`).\n\n**Pourquoi** — sur écran large (>1200px), une colonne pleine largeur\noblige le balayage horizontal et casse le rythme de lecture (longueur\nde ligne optimale ≈ 60-80 caractères). 900px maintient cette longueur\ntout en restant responsive : sous cette taille, le wrapper s'adapte\nau container parent.\n\n**Pages obligatoires** :\n- Cahier de Science : les 2 onglets (Pédagogie, Fiches) sont wrappés\n  au niveau App.\n- Index (cartographie) : `DocumentsTab` est wrappé.\n- `SvComprendre` : utilise `.sv-text-column` (anciennement style inline\n  `maxWidth:'900px'`).\n\n**Hors-scope** :\n- Dashboards, tables larges, grilles de données (Explorer, Dashboard,\n  ConceptCards quand affichées en grille pleine largeur). Pour ces\n  vues, l'utilisateur veut tirer parti de la largeur disponible.\n- Calculateurs avec sidebar (MO, LiFoFer, Triangle) : la colonne\n  contenu est déjà gérée par leur layout `sv-sidebar-layout`.\n\n**Variable** : `--text-column-max: 900px;` dans `:root`. Pour ajuster\nglobalement la largeur de lecture, modifier cette variable.\n", "type": "regle", "crit": false}, {"id": 86, "titre": "web_template.py — API", "contenu": "## web_template.py — Module partagé\n\nModule `tools/lib/web_template.py` — génère le HTML final avec la charte.\n\n### Fonctions\n\n| Fonction | Signature | Rôle |\n|----------|-----------|------|\n| `load_page_meta(conn, slug)` | → dict | Charge titre, subtitle, description, og_image depuis `web_pages` |\n| `load_templates(conn, page_slug)` | → dict {css, js, head} | Charge les 3 templates depuis `html_templates` |\n| `load_nav_pages(conn)` | → list[dict] | Charge les pages web pour la navigation inter-pages (exclut `status='interne'`) |\n| `render_page(meta, body, ...)` | → str HTML | Assemble le HTML final avec charte, OG tags, favicon, nav bar, puis pré-compile le JSX |\n| `update_last_generated(conn, slug)` | — | Met à jour `web_pages.last_generated` |\n| `_compile_jsx_in_html(html)` | → str HTML | Pré-compile les blocs `<script type=\"text/babel\">` via Node `tools/lib/compile_jsx.js` (fallback : conserve le bloc original pour Babel in-browser) |\n\n### load_nav_pages\n\nRetourne une liste de dicts `{slug, title, icon, url}` pour toutes les pages sauf celles en `status='interne'` (ex : `explorer`). Utilisée par chaque `gen_*.py` pour construire la barre de navigation inter-pages.\n\n### _build_nav_bar(nav_pages, current_slug)\n\nFonction interne appelée par `render_page()`. Génère le HTML `<nav class=\"sv-nav-pages\">` avec la page courante en gras (`sv-nav-current`) et les autres en liens cliquables, séparés par `·`.\n\n### render_page — paramètres\n\n```python\nrender_page(meta, body,\n    css_extra='',        # CSS de la page (depuis tpl['css'])\n    scripts_extra='',    # JS de la page (DATA + React JSX)\n    head_extra='',       # CDN React + Babel (depuis tpl['head']) — pas de Tailwind\n    data_json=None,      # Alternative : inject DATA directement\n    show_header=True,    # False si la page a son propre header React\n    nav_pages=None,      # list[dict] depuis load_nav_pages() — active la nav bar\n    current_slug=None    # slug de la page courante (gras dans la nav)\n)\n```\n\n**Note** : `head_extra` vient intégralement de la DB (`html_templates.contenu`). Plus de strip automatique des CDN depuis avril 2026 — chaque page déclare ses dépendances dans son `*-head` template en DB. Le `<script src=\"vendor/babel.min.js\">` est automatiquement retiré du HTML final quand tous les blocs JSX ont été pré-compilés avec succès (cf. `_compile_jsx_in_html`).\n\n### Pattern standard d'un gen_*.py\n\n```python\ndef build_html(conn, data):\n    meta = load_page_meta(conn, 'mon_slug')\n    tpl = load_templates(conn, 'mon_slug')  # tpl['js'] enveloppé <script type=\"text/babel\">\n    nav_pages = load_nav_pages(conn)\n    # render_page injecte `const DATA` (json.dumps + default=str + échappement <\/script>)\n    # via react_page.html, puis scripts_extra. AUCUN strip/rewrap manuel.\n    return render_page(meta, '', css_extra=tpl['css'],\n                       scripts_extra=tpl['js'], head_extra=tpl['head'],\n                       data_json=data,\n                       nav_pages=nav_pages, current_slug='mon_slug')\n```\n\n**Migration 2026-06** : le va-et-vient `tpl['js'].replace('<script type=\"text/babel\">','')` + re-wrap manuel `const DATA` a été supprimé des 7 gens standards (mo_calc, lifofer, concept_cards, dashboard, cahier, scripts, tests_terrain) au profit de `data_json=`. Le `body='<div id=\"root\">'` est **mort** (react_page.html le hardcode l.12). Cas ATYPIQUES qui gardent un assemblage manuel : `gen_web` (`%%STRATE_CSS%%` + const `HAS_TECHNIQUE`), `gen_triangle_textures` (`%%POLYGONS%%`), `gen_explorer` (échappement `<\/script>` + `default=str` propres), `gen_bq_page` (`<script type=\"application/json\">`).\n\nChaque part page_js (partagé + spécifique) forme **un bloc `<script type=\"text/babel\">` distinct** ; ils sont pré-compilés en `<script>` (`React.createElement()`) via `_compile_jsx_in_html` → Node + Babel (cf. BQ #100). En `<script>` classiques, les `const`/`function` top-level restent **partagées** entre blocs (le modèle `gen_transition_robuste` le fait depuis toujours). Si la pré-compilation échoue, le bloc reste JSX brut (pas de Babel in-browser par défaut).\n", "type": "reference", "crit": false}, {"id": 87, "titre": "html_templates — Convention + workflow (DB uniquement)", "contenu": "## html_templates — Convention\n\nTable `html_templates` stocke le CSS et JS de chaque page.\n\n### Structure\n\n| Colonne | Rôle |\n|---------|------|\n| `slug` | Identifiant unique (ex: `lifofer-js`) |\n| `page_slug` | Lien vers `web_pages.slug` (ex: `lifofer`) |\n| `type` | `head` (CDN), `page_css`, `page_js` |\n| `label` | Description lisible |\n| `contenu` | Le code CSS ou JS complet |\n| `ordre` | 0=head, 1=css, 2=js |\n| `is_active` | 1=inclus dans la génération |\n\n### Règles\n\n1. **3 templates par page** : head (CDN React+Babel), page_css, page_js\n2. **Le JS est du JSX React**, pré-compilé à la génération via Node (`tools/lib/compile_jsx.js` + `@babel/core` + `@babel/preset-react`). Fallback : Babel in-browser si la pré-compilation échoue.\n3. **Les données sont dans `DATA`** (injecté par le script Python, pas hardcodé dans le template)\n4. **Le CSS utilise les variables charte** (`var(--*)`) — **pas de classes Tailwind** (cf. BQ #85 refactor sv-*)\n5. **Pas de `<script>` ou `<style>` dans le contenu** — le script Python les ajoute\n6. **Lire depuis la DB** : `SELECT contenu FROM html_templates WHERE id=X` (pas Read fichier — risque de troncature)\n\n### (fusionné depuis #91 : Workflow modification templates — DB uniquement)\n\n**Règle** : pour modifier le CSS ou le JS d'une page web, on met à jour **uniquement** la table `html_templates` en DB. Jamais de fichier `.js` ou `.css` standalone dans le dépôt.\n\n### Workflow correct\n\n```python\nimport sqlite3\ncon = get_connection('sol_vivant.db')\n\n# Lire le template actuel\njs = con.execute(\"SELECT contenu FROM html_templates WHERE slug='lifofer-js'\").fetchone()[0]\n\n# Modifier\njs = js.replace('ancien', 'nouveau')\n\n# Injecter\ncon.execute(\"UPDATE html_templates SET contenu=?, updated_at=datetime('now') WHERE slug='lifofer-js'\", (js,))\ncon.commit()\n```\n\nPuis regénérer la page :\n\n```bash\npython3 tools/docs/gen_<page>.py --db sol_vivant.db\n```\n\n### Pourquoi\n\n- La DB est la source de vérité **pour les templates** (HTML/CSS/JS pages web)\n- Les scripts `gen_*.py` lisent les templates depuis la DB et assemblent le HTML final via `web_template.render_page()`\n- Écrire un `.js` local court-circuite ce pipeline → divergence entre code versionné et rendu\n- Le champ `updated_at` trace les modifications\n\n### Pour construire un gros template from scratch\n\nAcceptable : écrire le JS dans `/tmp/` pour travailler confortablement, puis **injecter en DB** en fin de tâche. Ne jamais commit un fichier `.js` de page dans le dépôt.\n", "type": "regle", "crit": false}, {"id": 88, "titre": "Données dynamiques — Règle zéro statique", "contenu": "## Données dynamiques — Règle zéro statique\n\n**Aucune donnée du corpus ne doit être hardcodée dans le template JS.**\n\n### Où stocker les données\n\n| Type de donnée | Table DB | Exemple |\n|----------------|----------|---------|\n| Données de référence | `refs` (kind=matiere, texture, ...) via `tools/lib/refs.py::load_refs(con, kind)` | matieres, textures, esclaves_energ, shift_chantier, cn_regle |\n| Configuration UI (couleurs, labels) | `config(categorie, cle)` | mo_calc/cat_colors |\n| Textes didactiques | `config(categorie, cle)` | triangle/sections_didactiques |\n| Métadonnées page | `web_pages` | title, subtitle, description |\n| Nom/auteur du projet | `config(corpus/*)` | corpus/nom, corpus/auteur |\n\n### Le script Python injecte tout via DATA\n\n```python\ndata['meta'] = {'nom_projet': get(conn, 'corpus', 'nom'), ...}\ndata['cat_colors'] = get_json(conn, 'mo_calc', 'cat_colors')\n```\n\n### Ce qui est acceptable dans le template JS\n\n- Labels d'UI courts (« Rechercher... », « Tout afficher »)\n- Noms de classes CSS `sv-*` (charte unifiée — cf. BQ #85, #99)\n- Styles inline avec variables CSS : `style={{color:'var(--success)'}}`\n- Logique de rendu (conditions, boucles, calculs)\n- Palettes de couleurs **en fallback** (`DATA.colors || [default]`)\n\n### Ce qui ne l'est PAS\n\n- Compteurs (`\"N documents\"`, `\"N termes\"`)\n- Noms de catégories (`\"Végétale\"`, `\"Fumier/compost\"`)\n- Textes descriptifs (introductions d'onglets)\n- Titre, sous-titre, auteur\n- Listes de valeurs qui viennent de la DB (statuts, importances, etc.)\n- **Classes Tailwind** (`bg-blue-500`, `text-xs`, `flex`…) — interdit depuis le refactor sv-* (avril 2026). À remplacer par `sv-*` ou `style={{}}` avec variables CSS.\n", "type": "regle", "crit": true}, {"id": 99, "titre": "Charte pédagogique unifiée — Cahier de Science", "contenu": "## Charte pédagogique unifiée — Cahier de Science\n\n### Composants CSS partagés (CHARTER_CSS)\n\nClasses `sv-*` dans `web_template.py` pour la présentation pédagogique :\n\n| Classe | Usage |\n|--------|-------|\n| `sv-sidebar-layout` / `sv-sidebar` / `sv-main` | Layout 2 colonnes unifié |\n| `sv-cahier` | Fond papier crème pour sections Comprendre |\n| `sv-tab-content` | Wrapper pleine page pour contenu d'onglet |\n| `sv-prose` | Texte didactique courant |\n| `sv-collapse` / `sv-collapse-header` / `sv-collapse-body` | Section compactable/décompactable |\n| `sv-science-note` | Encart cahier de labo |\n| `sv-formula` / `sv-formula-highlight` | Formule scientifique (fond violet) |\n| `sv-rule` | Règle pratique \"à retenir\" (fond vert) |\n| `sv-kpi-grid` / `sv-kpi` | Indicateurs clés (grille auto-fit) |\n| `sv-timeline` / `sv-timeline-item` | Frise chronologique verticale |\n| `sv-phase-card` | Étape/phase colorée (succession, process) |\n| `sv-alert` + variantes | Alertes danger/warning/success/info |\n| `sv-diag-grid` / `sv-diag-ok` / `sv-diag-ko` | Diagnostic binaire OK/KO |\n| `sv-compare` / `sv-compare-good` / `sv-compare-bad` | Comparaison côte-à-côte |\n| `sv-term` | Terme glossaire |\n| `sv-source` | Source bibliographique |\n| `sv-ref-box` / `sv-ref-grid` | Encart référence chiffrée |\n| `sv-data-table` | Table de données stylisée |\n| `sv-highlight-box` | Conclusion / point clé |\n| `sv-bullet-list` / `sv-bullet-list-dense` | Liste pédagogique avec chevrons ▸ verts (CSS) |\n| `sv-section-label` | Titre de section uppercase |\n| `sv-section-block` / `sv-section-title` | Bloc de section unifié (utiliser via `SvSection`) |\n| `sv-richtext` | Wrapper pour le rendu `SvRichText` |\n| `sv-mark` / `sv-emphasis` | Highlight et gras inline (cf. BQ #85) |\n\n### Composants React partagés (DB `html_templates` slug=`sv-shared-components`, page_slug NULL)\n\nTemplate chargé automatiquement dans toutes les pages React.\n\n| Composant | Props | Usage |\n|-----------|-------|-------|\n| `SvCollapse` | title, icon, defaultOpen, children, id | Section compactable |\n| `SvFormula` | children, source | Formule scientifique |\n| `SvRule` | children, title | Règle pratique |\n| `SvScienceNote` | children, title, icon | Encart cahier de labo |\n| `SvKPI` / `SvKPIGrid` | value, unit, label, color, detail / cols | KPIs |\n| `SvTabs` | tabs, active, onChange | Navigation onglets unifiée |\n| `SvTimeline` | items (date, place, text, tags) | Frise chronologique |\n| `SvPhaseCard` | title, color, label, stats, tags, children | Phase/étape |\n| `SvCompare` | good, bad | Comparaison bon/mauvais |\n| `SvDiagnostic` | ok, ko | Diagnostic OK/KO |\n| `SvTermList` | terms | Liste de termes |\n| `SvSourceList` | sources | Liste de sources |\n| `SvNoteAccordion` | text, label | Mini-note inline |\n| `SvRefBox` | title, items, note, children | Référence chiffrée |\n| `SvHighlightBox` | title, children, color | Point clé |\n| `SvDataTable` | headers, rows / children | Table de données |\n| **`SvBulletList`** | items, dense | **Liste à puces unifiée** (remplace `<ul className=\"sv-bullet-list\">` manuel). `items` accepte string ou `{text, emphasis, strong}` |\n| **`SvSection`** | title, label, level, icon, id, children | **Titre de section uniforme** (remplace `<h2>` / `<h3>` bruts). `level`=2 ou 3. |\n| **`SvTabIntro`** | resume, detail | **Ligne accordéon de présentation** sous les tabs. Résumé court en ligne, lien \"▸ en savoir plus\" qui déploie le détail. Sert aussi de repère d'alignement horizontal sous le bandeau. |\n| **`SvExpandableCard`** | badge, color, title, subtitle, progress, open, onClick, children | **Carte expansible du pattern cartographie**. Badge coloré à gauche, titre, sous-titre (ex: \"2 docs · 84 termes\"), barre de progression facultative 0-100, chevron ▸/▾. État ouvert contrôlé (prop `open`). |\n| **`SvTagButton`** | code, label, stat, color, active, onClick | **Pill pour sous-item**. Code gras à gauche (ex: \"F1\", \"#11\"), label tronqué, stat à droite (ex: \"49t\"). Utilisé pour lister les sous-items d'un `SvExpandableCard` ouvert. |\n| **`SvRichText`** | text, onCardRef, skipPrefixes | **Rendu pédagogique de texte semi-structuré**. Split `\\n\\n` → `<p>`, `• ` ou `- ` → `SvBulletList`, MAJUSCULES: → `sv-section-label`, `## titre` → `<h2 class=sv-section-title>`, `### / #### titre` → `<h3 class=sv-section-title>`, `Card #N` → liens, `` `terme` `` → `.sv-mark`, `**gras**` → `.sv-emphasis`. Filtre les lignes `[2026-...` par défaut. Le rendu accepte le markdown produit par Jenni dans `fiche_contenus.contenu_integre`. |\n\n### Règle : zéro texte hardcodé\n\nTous les composants sont pilotés par props. Les textes viennent de `DATA` (injecté par le script Python depuis la DB), jamais du template JS.\n\n### Règle : zéro liste brute\n\nUtiliser `SvBulletList` (listes à puces pédagogiques) ou `SvCompare`/`SvDiagnostic` (listes structurées). Pas de `<ul>` / `<ol>` bruts, sauf cas très spécifiques (listes plates sans puces volontaires, sémantique native `<nav>` ou `<menu>`).\n\n### Règle : zéro titre brut\n\nUtiliser `SvSection` pour les titres pédagogiques (h2/h3). Les `<h2>` / `<h3>` bruts disséminés dans les templates sont en cours de migration — toute nouvelle page doit utiliser `SvSection`.\n\n### Règle : le nettoyage se fait à l'import, pas au rendu (avril 2026)\n\n`SvRichText` **n'a plus vocation à parser du markdown**. Le texte en DB (`fiche_sections.contenu`, futur `doc_sections.contenu`) est déjà propre et découpé par section, écrit une fois par le parser d'import (cf. BQ `wf_fiche_integration` §4.2 et `trios_parallels`).\n\nLe composant de rendu se contente de :\n- lire le plan DB (liste de sections ordonnées : titre + type + contenu)\n- afficher chaque section avec `<SvSection>` + paragraphes\n- afficher les refs via `<SvSourceList>`\n\nTout parser côté JS qui tolère des variantes Jenni (`# Titre`, `## `, MAJUSCULES:, bullets, `**gras**`, `Card #N`, backticks) est un contournement historique. Le fix définitif va dans l'import docx. `SvRichText` sera simplifié en rendu plat paragraphe + bullets au fur et à mesure que les sources (fiches, concept_cards, config) sont re-nettoyées à l'entrée.\n\n### Navigation unifiée\n\nToutes les pages utilisent `SvTabs` pour les onglets. Patterns actuels :\n- **Outils** (MO, LiFoFer, Triangle) : Pratique / Comprendre\n- **Index** : onglets métier (Documents, Thésaurus, etc.)\n- **Cahier de Science** : 1 onglet par rubrique thématique (Intro, MO, Textures, Cycles, Microbiome, Holobionte, Santé, Pratiques, Fermentations, Méthodologie), piloté par `config.cahier.onglets`. Chaque onglet rend le chapitre pédagogique et/ou un groupe de fiches intégrées.\n\nChaque onglet a un `sv-tab-content` comme wrapper pleine page uniforme. `.sv-tabs` est déjà sticky (top:0, z-index:10) — ne pas ré-envelopper dans un wrapper custom.\n\n### Pattern standard d'une page multi-onglets\n\n```jsx\nreturn <div className=\"sv-page\">\n  <SvTabs tabs={tabs} active={active} onChange={setActive} />\n  <div className=\"sv-tab-content\">\n    <SvTabIntro resume={desc.resume} detail={desc.detail} />\n    {/* contenu spécifique de l'onglet actif */}\n  <\/div>\n<\/div>;\n```\n\n`SvTabIntro` sert de **point de référence d'alignement** : son conteneur hérite du padding de `.sv-page` (1.25rem gauche/droite), et toute la suite (cards, sections, tables) s'aligne dessus. Ne pas ajouter de wrapper custom entre.\n\n### Composants React ajoutés (avril 2026)\n\n| Composant | Props | Usage |\n|-----------|-------|-------|\n| `SvCallout` | variant, title, icon, children | Encart sémantique unifié — remplace les `<div className=\"sv-callout sv-callout-*\">` |\n| `SvAlert` | variant, title, children | Alerte compacte |\n| `SvImageCard` | src, alt, caption, maxHeight, maxWidth | Image illustrative + légende standardisée |\n| `SvProcedureSteps` | title, steps, materiel, duree | Procédure pas-à-pas numérotée |\n| `SvTestCard` | test={...} | Carte standardisée pour un `terrain_test` |\n| `SvSubTabs` | tabs, active, onChange | Sous-onglets niveau 2 (pills compactes) |\n\n### Anti-pattern : SvTabs imbriqués\n\nNe **jamais** utiliser deux `SvTabs` l'un dans l'autre. Si un onglet de premier niveau contient des sous-vues, utiliser `SvSubTabs` pour le niveau 2 (pills compactes, visuellement distinct).\n\nToujours accompagner `SvSubTabs` d'un `useEffect(() => setStateLocal(null), [subtab])` pour réinitialiser les states locaux (accordéons ouverts) au changement de sous-onglet.\n\n\n### SvRichText — tolérance H1 (avril 2026)\n\nLe parser accepte désormais `# Titre` (H1) **en plus** de `## ` / `### ` / `#### `. Les H1 sont rendus comme H2 (convention corpus : pas de H1 au niveau des sections, réservé au titre du doc via `meta.title`).\n\nRaison : Jenni produit parfois des fiches avec `# Introduction` / `# 1. Section` (template ancien). Sans cette tolérance, ces titres étaient affichés bruts en paragraphe. Le parser tolérant sert de filet de sécurité ; les fiches existantes ont aussi été normalisées en DB (H1 → H2).\n\n### Doctrine formatage `fiche_contenus.contenu_integre`\n\nConventions impératives pour que `SvRichText` rende correctement :\n1. **Titres** : `## X` à `### X`. Les `# X` sont tolérés mais non recommandés.\n2. **Paragraphes** : séparés par `\\n\\n` (ligne vide). Les `\\n` simples sont fusionnés dans un même paragraphe.\n3. **Pas de tags Jenni résiduels** en début (ex: `[Fiche zoom #X v1: ... 2026-XX-XX]`) — filtrés au parser mais à retirer en DB.\n4. **Refs consécutives** : séparer par espace `) (Ref2)` et non `)(Ref2)`.\n5. **Apostrophes** typographiques `'` recommandées (droites `'` tolérées, cosmétique).\n\nAudit et normalisation automatique via script ad hoc (voir audit_log 2026-04-19 : 27 H1 corrigés, 22 tags retirés, 70 refs espacées sur 28 fiches).\n", "type": "reference", "crit": false}, {"id": 81, "titre": "html_templates — carte des composants web", "contenu": "Table `html_templates` : CSS, JS et HEAD pour les pages web.\n\n| ID | page_slug | type | Contenu |\n|---|---|---|---|\n| 1 | (global) | head | CDN React 18 + Babel |\n| 2 | (global) | head | CDN Tailwind CSS |\n| 3 | (global) | head | CDN Tailwind CSS (version fixe) |\n| 4 | triangle_textures | page_css | CSS Triangle |\n| 5 | triangle_textures | page_js | JS React Triangle (17k) |\n| 6 | mo_calculateur | page_css | CSS Calculateur MO (3.7k) |\n| 7 | mo_calculateur | page_js | JS React Calculateur MO (22k) |\n| 8 | index | page_css | CSS Cartographie |\n| 9 | index | page_js | JS React Cartographie (46k) |\n| 10 | mo_calculateur | head | CDN Calculateur MO |\n| 11 | index | head | CDN Cartographie |\n| 12 | triangle_textures | head | CDN Triangle |\n\n**Modifier un composant React :**\n```python\ncon = get_connection('sol_vivant.db')\njs = con.execute(\"SELECT contenu FROM html_templates WHERE id=7\").fetchone()[0]\n# ... modifier js ...\ncon.execute(\"UPDATE html_templates SET contenu=?, updated_at=datetime('now') WHERE id=7\", (js,))\ncon.commit()\n```\nPuis regénérer : `python3 tools/docs/gen_mo_calc.py --db sol_vivant.db`\n", "type": "reference", "crit": false}, {"id": 100, "titre": "Mode hors-ligne et déploiement", "contenu": "## Mode hors-ligne et déploiement\n\n### Architecture des dépôts\n\n```\n/Tools/                          ← Sol-Vivant/Tools (scripts + DB)\n  Publications/web/              ← Pages générées\n    index.html, *.html\n    vendor/                      ← Dépendances JS/CSS locales\n    img/                         ← Images OG et previews\n\n        │ rsync -av Publications/web/ → /Publications/\n        ▼\n\n/Publications/                   ← Sol-Vivant/Publications (GitHub Pages)\n  index.html, *.html\n  vendor/, img/\n```\n\n### Vendor local (Publications/web/vendor/)\n\nToutes les dépendances JS sont téléchargées localement pour le mode hors-ligne :\n\n| Fichier | Taille | Statut | Utilisé par |\n|---------|--------|--------|-------------|\n| `react.production.min.js` | 11 Ko | actif | toutes les pages React |\n| `react-dom.production.min.js` | 129 Ko | actif | toutes les pages React |\n| `babel.min.js` | 3.0 Mo | fallback | non chargé dans le HTML final (JSX pré-compilé via Node). Conservé comme fallback au cas où la pré-compilation échoue |\n| `marked.min.js` | 35 Ko | actif | `explorer.html` (rendu markdown des rapports) |\n| `tailwind.min.css` | 2.8 Mo | obsolète | plus référencé (refactor sv-* avril 2026) — conservé pour compatibilité rétroactive, à supprimer dans une passe de nettoyage |\n| `tailwind.js` | 398 Ko | obsolète | idem |\n\nLes URLs sont définies dans les templates `head` en DB (`html_templates` type=head).\n\n### Pré-compilation JSX\n\nDepuis avril 2026, le JSX est **pré-compilé à la génération** via Node (`tools/lib/compile_jsx.js` qui utilise `@babel/core` + `@babel/preset-react`). Les blocs `<script type=\"text/babel\">` sont remplacés par `<script>` contenant du `React.createElement()` pur.\n\nInstallation des dépendances Node :\n```bash\nnpm install   # installe @babel/core et @babel/preset-react dans node_modules/\n```\n\nLe `node_modules/` est gitignoré. Si la pré-compilation échoue (Node absent, dépendances manquantes), le bloc JSX est conservé tel quel et Babel in-browser peut prendre le relais — à condition que le vendor Babel soit présent dans le HTML, ce qui n'est **plus** le cas par défaut.\n\n### gen_archive.py\n\nGénère un ZIP 100% autonome :\n\n```bash\npython3 tools/docs/gen_archive.py --db sol_vivant.db              # archive seule\npython3 tools/docs/gen_archive.py --db sol_vivant.db --regenerate  # regénère + archive\n```\n\nSortie : `Publications/sol-vivant-web.zip` (~16 Mo avec images)\n\nUsage : `unzip sol-vivant-web.zip -d sol-vivant && open sol-vivant/index.html`\n\n### Fonctionnement hors-ligne\n\nLes pages fonctionnent dans tous les contextes :\n- **GitHub Pages** : chemins relatifs `vendor/...` résolus par le serveur\n- **file://** : ouverture directe dans le navigateur\n- **Archive ZIP** : décompresser et ouvrir index.html\n- **Serveur local** : `python -m http.server` dans le dossier web/\n", "type": "reference", "crit": false}, {"id": 93, "titre": "Régénération pipeline — regen_all.py + gen_*.py", "contenu": "## Régénération complète depuis la DB\n\nPrincipe : **DB = source de vérité données ; filesystem = source de vérité code (scripts Python).** Après toute modification de données ou de code, régénérer les outputs.\n\n### Commande unique\n\n```bash\npython3 tools/regen_all.py --db sol_vivant.db\n```\n\nRégénère séquentiellement les 16 générateurs (gen_web, gen_mo_calc, gen_triangle_textures, gen_lifofer, gen_concept_cards, gen_cahier, gen_dashboard, gen_explorer, gen_technique, gen_esclaves_calc, gen_tests_terrain, gen_transition_robuste, gen_bq_page, gen_readme, gen_workflows, gen_illustration_prompts).\n\n### Régénération sélective\n\n```bash\npython3 tools/regen_all.py --only gen_lifofer.py\n```\n\n### Quand l'utiliser\n\n- Après modification d'une table (terms, refs, lifofer_*, etc.)\n- Après modification de config\n- Après modification d'un template html_templates\n\n### Ne jamais faire\n\n- Ne JAMAIS éditer directement les HTML/README générés (écrasés)\n- Ne JAMAIS hardcoder des valeurs dans les générateurs\n\n### (fusionné depuis #80 : Pipeline de génération : script → tables DB → fichier)\n\nChaque fichier dans `Publications/` est généré par un script qui lit des tables DB.\n\n| Script | Tables sources | Fichier généré |\n|---|---|---|\n| `gen_mo_calc.py` | refs (kind=matiere, cn_regle), ref_cn_incorporation, ref_kirkby, html_templates | `Publications/web/mo_calculateur.html` |\n| `gen_triangle_textures.py` | refs (kind=texture), html_templates | `Publications/web/triangle_textures.html` |\n| `gen_web.py` | documents, prompts, terms, chains_causales, concept_cards, html_templates (id=8,9,11) | `Publications/web/index.html` |\n| `gen_web.py` | documents, prompts, terms, chains_causales, concept_cards | `Publications/cartographie/solvivant_docs.html` |\n| `export_jenni_doc.py` | prompts, terms, jenni_doc_specs | `Publications/prompts/prompts_jenni_*.txt` |\n| `gen_fiche_docx.py` (canonique fiche) | fiches, graines, fiche_sections, source_usages | `recherches/fiches/fiche_<id>.docx` |\n| `gen_readme.py` | scripts_inventory (FS), bq_inventory (FS `tools/bq/*.md`) | `tools/*/README.md` |\n| `gen_workflows.py` | scripts_inventory (FS), config, bq_inventory (FS `tools/bq/*.md`) | `Publications/workflows/*.md` |\n\n**Pour modifier un fichier généré** : modifier la table source → regénérer avec le script.\n", "type": "workflow", "crit": true}, {"id": 75, "titre": "Templates React/Babel — encoding et pièges", "contenu": "Les pages web (calculateur MO, triangle textures, cartographie) utilisent **Babel standalone** pour transpiler le JSX.\n\n**Pièges connus :**\n- `\\u{1F331}` (ES6 unicode avec accolades) → **CRASH Babel**. Utiliser le caractère UTF-8 direct : 🌱\n- `\\u25BE`, `\\u2014` etc. → préférer les caractères directs (▾, —) dans le JSX\n- Doublons de composants : si on injecte 2 fois dans `html_templates`, les 2 coexistent → erreur silencieuse\n- `className` avec Tailwind : les classes comme `space-y-1.5` marchent avec le CDN, pas besoin de purge\n\n**Vérification après modification html_templates :**\n```python\njs = con.execute(\"SELECT contenu FROM html_templates WHERE id=7\").fetchone()[0]\nassert js.count('function MonComposant') == 1, \"Doublon de composant !\"\nassert '\\\\u{' not in js, \"ES6 unicode escape interdit !\"\n```\n\n**Historique** : composant EncartIncorporation en doublon + unicode crash (session 03/04).\n\n### Pièges CSS : escapes unicode dans content: (ajout session 2026-04-12)\n\n**Règle : JAMAIS d'escapes CSS unicode dans `content:` des `::before`/`::after`.**\n\nExemples de bugs rencontrés :\n- `content: '\\2713 '` → affiché `¹3` (le navigateur lit `\\271` + `3`)\n- `content: '\\2022 '` → affiché `²` ou `•2`\n- `content: '\\203A'` → affiché `A` (le navigateur lit `\\203` + `A`)\n\n**Fix : toujours utiliser le caractère UTF-8 direct :**\n```css\n/* ❌ INTERDIT */\ncontent: '\\2713 ';\ncontent: '\\203A';\n\n/* ✓ CORRECT */\ncontent: '✓ ';\ncontent: '▸';\ncontent: '• ';\n```\n\n**Pourquoi :** les escapes CSS `\\XXXX` nécessitent un espace terminal pour délimiter le code. Si le code fait 4 chiffres et que l'espace est oublié ou que le caractère suivant est un chiffre/lettre hex, le navigateur lit un code plus long que prévu. UTF-8 direct élimine ce risque.\n\n**Vérification :** `grep -n \"content.*'\\\\\\\\\" tools/lib/web_template.py` → doit retourner 0 résultats.\n\n### Emojis dans les templates React (complément session 2026-04-12)\n\n**Règle : toujours le caractère UTF-8 direct, jamais d'escape.**\n- ❌ `icon=\"\\ud83d\\udd2c\"` → affiché en texte brut `\\ud83d\\udd2c`\n- ✓ `icon=\"🔬\"` → affiché correctement\n\n**Bibliothèque d'icônes :** `config.web.icon_library` — source de vérité pour la cohérence visuelle.\n- Navigation/onglets : emojis autorisés (repères fixes)\n- Accordéons SvCollapse : UN seul emoji (`🔬`) pour tous\n- Règle JMJ : « beaucoup de créativité tue la créativité »\n\n### Checklist avant modification html_templates (mise à jour)\n\n```python\njs = con.execute(\"SELECT contenu FROM html_templates WHERE id=?\", (tid,)).fetchone()[0]\n\n# 1. Pas de doublon de composant\nimport re\nfuncs = re.findall(r'function\\s+(\\w+)\\s*\\(', js)\nfrom collections import Counter\ndupes = {k:v for k,v in Counter(funcs).items() if v > 1}\nassert not dupes, f\"Doublon: {dupes}\"\n\n# 2. Pas d'unicode escape JS\nassert '\\\\u{' not in js, \"ES6 unicode escape interdit\"\nassert '\\\\ud8' not in js, \"Surrogate pair interdit\"\n\n# 3. Pas d'emoji corrompu\nassert '\\\\ud83d' not in js, \"Emoji en escape au lieu de UTF-8 direct\"\n\n# 4. Test pre-compilation Babel\nimport subprocess\nwith open('/tmp/test.jsx', 'w') as f: f.write(js)\nresult = subprocess.run(['node', '-e', '''\n  const babel = require(\"@babel/core\");\n  const fs = require(\"fs\");\n  try { babel.transformSync(fs.readFileSync(\"/tmp/test.jsx\",\"utf8\"), {presets:[\"@babel/preset-react\"]}); console.log(\"OK\"); }\n  catch(e) { console.log(\"FAIL: \" + e.message.substring(0,200)); process.exit(1); }\n'''], capture_output=True, text=True)\nassert result.returncode == 0, f\"Babel: {result.stdout}\"\n```\n", "type": "conseil", "crit": false}, {"id": 135, "titre": "Mode sombre + Zoom typo + Toolbar utilisateur", "contenu": "## Mode sombre + Zoom typo + Toolbar utilisateur\n\nToutes les pages web Sol Vivant intègrent une **toolbar flottante** (`.sv-toolbar` en haut à droite) avec :\n\n| Bouton | Effet | Persistance |\n|--------|-------|-------------|\n| `A−` | Réduit le texte (×0.85) | `localStorage('sv-font-scale')` |\n| `A`  | Texte normal (×1) | idem |\n| `A+` | Agrandit le texte (×1.15) | idem |\n| `☾/☀` | Bascule clair/sombre | `localStorage('sv-theme')` |\n\n### Mécanisme — Mode sombre\n\n- Variables CSS définies dans `:root` (light) et `:root[data-theme=\"dark\"]` (dark) + `@media (prefers-color-scheme: dark) :root:not([data-theme=\"light\"])` pour le défaut système\n- Toggle JS : `data-theme=\"dark\"|\"light\"` sur `<html>`\n- Init : restaure `localStorage('sv-theme')` si présent, sinon suit le système\n- Variables : `--bg`, `--card-bg`, `--text`, `--border`, `--shadow`, `--paper-bg/2/border`, `--success/-light`, `--warning/-light`, `--danger/-light`, `--info/-light`, `--accent*`, `--header-from/to`, `--zone-*`\n\n### Mécanisme — Zoom typo\n\n- Une variable `--font-scale` (défaut `1`) sur `:root`\n- Toutes les `--font-*` sont en `calc(<rem> * var(--font-scale))`\n- Le bouton modifie `--font-scale` via `document.documentElement.style.setProperty(...)` → tout le DOM suit\n- 4 niveaux : 0.85, 1.0, 1.15, 1.3 (le bouton 3-niveaux UI expose 0.85/1.0/1.15)\n\n### Implications pour les page_css et page_js\n\n1. **Aucun `font-size: <rem>` hardcodé** → utiliser `var(--font-*)`. Idem pour `style={{fontSize:'…'}}` en JSX.\n2. **Couleurs sémantiques** via `var(--color-*-text)` quand on a un fond `--*-light` (callouts, alertes, encarts).\n3. **Fonds blancs hardcodés `#fff/#f8fafc/#fdfbf7`** interdits → utiliser `var(--card-bg)`, `var(--color-bg-subtle)`, `var(--paper-bg)`.\n4. **Couleurs texte foncées** `#1e293b/#000` interdites → utiliser `var(--text)`.\n\n### Composants React unifiés (avril 2026)\n\n| Composant | Props | Usage |\n|-----------|-------|-------|\n| `SvCallout` | variant, title, icon, children | Encart sémantique (warning/success/danger/info). Remplace les `<div className=\"sv-callout sv-callout-warning\">` JSX bruts. |\n| `SvAlert` | variant, title, children | Alerte compacte (variantes idem) |\n| `SvImageCard` | src, alt, caption, maxHeight, maxWidth | Image illustrative + légende, styles standardisés (résout bug \"double style\") |\n| `SvProcedureSteps` | title, steps, materiel, duree | Procédure pas-à-pas numérotée (compteur visuel pastille). Réutilisable test bocal/recettes/mode opératoire. |\n| `SvTestCard` | test={code,title,description,dimension_label,procedure,materiel,duree,interpretation,image_url,source} | Carte standardisée pour un `terrain_test`. Prête pour la future page `tests_terrain` autonome. |\n| `SvSubTabs` | tabs, active, onChange | Sous-onglets niveau 2 (pills compactes). À utiliser quand un onglet `SvTabs` contient lui-même plusieurs vues. |\n| `SvTabIntro` | resume, detail | Intro accordéon sous les onglets. Profite de la nav captive pour ne pas être direct·e dès l'arrivée sur un onglet. |\n\n### Convention SvTabIntro\n\nChaque page multi-onglets doit lire ses intros depuis `config.<page>.tab_intros` (JSON) :\n```json\n{\"pratique\": {\"resume\": \"...\", \"detail\": \"...\"}, \"comprendre\": {\"resume\": \"...\", \"detail\": \"...\"}}\n```\nLe `resume` est affiché en ligne sous les tabs ; le `detail` se déplie via \"▸ en savoir plus\".\n", "type": "reference", "crit": false}, {"id": 110, "titre": "Bibliothèque d'icônes unifiée — règles visuelles", "contenu": "## Bibliothèque d'icônes unifiée Sol Vivant\n\nSource de vérité : `config.web.icon_library`\n\n### Règles\n\n1. **Navigation et onglets** : emojis autorisés (repères fixes, rares)\n2. **Accordéons SvCollapse** : UN seul emoji (🔬) pour toutes les pages\n3. **Listes à puces** : chevron ▸ (sv-bullet-list) ou bullet • (signaux), JAMAIS d'emoji\n4. **Cohérence** : le même emoji = le même concept, partout\n5. **Sobriété** : « beaucoup de créativité tue la créativité » (JMJ)\n\n### Catégories\n\n| Catégorie | Usage |\n|-----------|-------|\n| `navigation` | Barre nav inter-pages (🗺️ 🔺 🧪 🌿 🔍) |\n| `onglets` | Tabs internes (📚 🧪 🔬 📊) |\n| `thematiques` | Concepts du corpus (💧 🌱 🧱 ⚡ 🍄) |\n| `strates` | F=📜 S=🧱 V=🌱 P=🧪 H=🔬 |\n| `accordeons` | Pas d'emoji. Chevron ▸/▾ uniquement |\n\n### Accès depuis Python\n\n```python\nfrom config import get_json\nicons = get_json(conn, 'web', 'icon_library')\nicon_nav = icons['navigation']['calculateur']  # 🧪\n```\n\n### Accès depuis React/JSX\n\n```jsx\n// Les icônes sont injectées dans DATA par le gen_*.py\n// Ou utilisées directement en UTF-8 dans le template\n<SvCollapse title=\"Ma section\" icon=\"🔬\">\n```\n\n### Interdit\n\n- Escapes unicode (`\\ud83d\\udd2c`) → toujours le caractère direct\n- Emojis variés dans les SvCollapse (un seul pour tous)\n- Couleurs de fond sur les titres de sections (gradient, etc.)\n", "type": "reference", "crit": false}, {"id": 118, "titre": "Dashboard — outils de pilotage inter-sessions", "contenu": "## Pages de pilotage\n\n### Dashboard\n\n```bash\npython3 tools/docs/gen_dashboard.py --db sol_vivant.db\n# Output : Publications/web/dashboard.html\n```\n\nKPIs projet, dettes en cours, avancement par doc/strate, audit_log et\ngit log récents, checks intégrité, doctrine BQ.\n", "type": "commande", "crit": false}, {"id": 141, "titre": "Pattern Comprendre unifié — SvComprendre", "contenu": "## Pattern Comprendre unifié — SvComprendre + config.<page>.comprendre\n\nRefonte avril 2026 : les onglets « Comprendre » des calculateurs (MO, LiFoFer, Triangle)\nsont désormais pilotés par DB via le composant `SvComprendre`, élimi
