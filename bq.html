<script id="bq-data" type="application/json">{"technique": {"analyse": {"nom": "Analyse corpus", "entries": [{"id": 55, "titre": "Faux positifs Opus récurrents", "contenu": "Claude Code est lui-même Opus — ces erreurs récurrentes doivent être détectées chez lui-même avant d'agir :\n\n1. **« Mentions problématiques dans prompts »** → SQLite LIKE est case-insensitive. `sol vivant` (scientifique) matche `Le Sol Vivant cet Holobionte` (projet). Vérifier en Python avec un match exact avant d'agir.\n\n2. **Tables droppées** → `prompt_contenus` et `term_connections` ont été remplacées. Ne pas les recréer.\n\n3. **Cross-refs `doc_source/doc_cible`** → ces colonnes contiennent des descripteurs longs, pas un bug. Les colonnes normalisées sont `doc_code_source`/`doc_code_cible`.\n\n4. **« Doublons » surestimés (passes T2 termes / K2 cards)** → un audit SURESTIME systématiquement les doublons. Avant d'inscrire une fusion comme action (au temps 2 de supervision), EXAMINER le contenu de chaque paire (`audit_cards_first`) et écarter les FAUX POSITIFS récurrents :\n   - **homonymes** — même libellé, concepts distincts (« k2 » minéralisation de l'humus vs « k2 » cinétique enzymatique ; battance *processus* vs croûte de battance *résultat* ; bien-être animal vs bientraitance) ;\n   - **card-hub vs card-contenu** — une passerelle de navigation n'est pas un doublon du contenu qu'elle relie (#31 vs #52) ;\n   - **parcours vs cadre théorique** — #54 cycle du carbone vs #98 Soil Continuum Model ;\n   - **axes d'opposition distincts** — #152 origine du consortium vs #153 KNF vs JADAM.\n   Constat 2026-06-06 : sur les « doublons » du rapport d'audit, **3/7 termes et 3/3 cards** étaient des faux positifs. Fusionner à l'aveugle aurait appauvri le corpus.\n\n**Règle** : ne pas agir sur un signalement sans vérification indépendante — même si c'est moi (Claude) qui ai signalé le point.\n", "type": "conseil", "crit": false}, {"id": 102, "titre": "Workflow — traitement des notes volantes (jmj/notes*.txt)", "contenu": "## Workflow — traitement des notes volantes\n\n**Fichiers concernés** : `jmj/notes*.txt`, `jmj/transcriptions/*.txt` et tout matériel brut que JMJ capture \"au pied levé\" (posts LinkedIn, abstracts, fragments de lecture).\n\n### Contexte\n\nLes notes volantes sont des captures rapides d'informations scientifiques croisées au gré des recherches de JMJ. **Elles ne sont pas sourcées de manière académique** — l'objectif de JMJ est la collecte rapide d'informations, pas leur traçabilité bibliographique. Les sources académiques viendront plus tard, **apportées par Jenni** lors de la rédaction des fiches/documents.\n\n### Règle sur les DOIs dans les notes\n\nLes DOIs qui apparaissent parfois dans les notes sont **accessoires et optionnels** :\n\n- ✅ **Utilisables** comme porte d'entrée pour une recherche web de clarification conceptuelle si Claude en a besoin pour comprendre un mécanisme cité\n- ❌ **Ne pas stocker systématiquement** dans `fiches.sources_dois` ou ailleurs\n- ❌ **Ne pas chercher à extraire tous les DOIs** d'une note pour les tracer\n- ✅ **Bibliographie de référence = `jenni_sources`**, alimentée via le pipeline Jenni → analyse .docx → attribution\n\n### Pipeline d'intégration\n\n**Étape 1 — Analyse**\nClaude lit la note, identifie les concepts scientifiques, mécanismes, taxa, molécules.\n\n**Étape 2 — Tri**\nClasser chaque note (ou segment) en :\n- 🟢 **Retenue** : apporte un mécanisme, un taxon, un concept, une hypothèse ou une donnée pertinente\n- 🟡 **Enrichissement** : complète une fiche/section existante plutôt qu'une nouveauté\n- 🔴 **Écartée** : doublon, fragment trop court sans contexte, ou vraiment sans aucun apport (rare)\n\n⚠ **Règle des pépites — ne pas confondre niveau de vulgarisation et absence d'intérêt**\n\nJMJ prend volontairement des notes de **vulgarisation** parce qu'il y a parfois des **pépites dans des hypothèses** apparemment basiques. Plusieurs concepts du corpus actuel ont été identifiés ainsi (zoom apparemment trivial qui masque une hypothèse féconde).\n\n**Le critère d'écartement n'est PAS** :\n- ❌ « niveau cours de lycée »\n- ❌ « vulgarisation grand public »\n- ❌ « pas de DOI »\n- ❌ « format LinkedIn »\n\n**Le bon critère d'écartement est** :\n- ✅ Aucune hypothèse, aucun mécanisme, aucune connexion conceptuelle, aucune donnée chiffrée nouvelle\n- ✅ Strict recopiage d'une définition académique standard sans angle particulier\n- ✅ Doublon littéral d'une note précédente\n\n**Avant d'écarter une note dite \"vulgarisation\", chercher activement** :\n- Une hypothèse formulée même implicitement\n- Un mécanisme expliqué d'un angle inhabituel\n- Une donnée chiffrée inattendue\n- Une connexion entre deux domaines (ex: gut-brain × sol)\n- Un terme/concept émergent absent du thésaurus\n\nSi **rien** de tout cela → écarter. Sinon → la note mérite d'être lue avec soin et probablement intégrée comme zoom ou enrichissement.\n\n**Étape 3 — Regroupement (clustering)**\nRapprocher les notes qui traitent d'un même thème cohérent. Une note peut nourrir plusieurs clusters si elle contient plusieurs mécanismes distincts.\n\n**Étape 4 — Synthèse**\nPour chaque cluster retenu, décider :\n- **Nouvelle fiche** si le sujet n'est pas couvert par une fiche existante\n- **Enrichissement d'une fiche existante** si scope aligné\n- **Enrichissement de `prompts.enrichissement`** d'une section si le contenu relève d'un seul document de strate\n\n**Étape 5 — Proposition utilisateur**\nPrésenter à JMJ le clustering + la proposition d'action avant toute écriture DB. JMJ valide/ajuste. Pas d'écriture sans validation.\n\n**Étape 6 — Écriture DB**\nAprès validation :\n- Créer/enrichir les fiches dans `fiches` + `fiche_sections`\n- Extraire les termes candidats → lot enrichissement thésaurus (`gen_prompt_enrichissement.py`, charte Jenni « Bloc de 10 »)\n- Éventuellement UPDATE `prompts.enrichissement` pour les sections ciblées\n\n### Ce qu'on NE fait PAS\n\n- ❌ Pas d'extraction automatique de DOIs depuis les notes (intégration consciente dans `jenni_sources` uniquement)\n- ❌ Pas d'écriture directe en DB avant validation JMJ sur le plan\n- ❌ Pas de création d'entrées terms avec définitions forgées depuis les notes — les définitions viennent de Jenni\n- ❌ Pas d'intégration de notes \"trop basiques\" (niveau cours de lycée) au corpus scientifique, même si les termes sont canoniques\n\n### Où archiver les notes déjà traitées\n\nAprès intégration complète et validation, déplacer la note vers `jmj/archives/notes_traitees/` avec un préfixe date et référence aux fiches créées, afin de tracer l'origine sans polluer le répertoire `jmj/` actif.\n\n## Contexte\n\ntraitement notes volantes JMJ\n", "type": "regle", "crit": false}, {"id": 132, "titre": "Stratégie agents Task — quand, comment, résilience", "contenu": "## Stratégie — quand et comment utiliser des agents Task\n\nTrois patterns d'usage des **agents** dans le corpus Sol Vivant. Chaque pattern\na son domaine, ses pièges, ses règles de résilience.\n\n### 1. Pattern `agent_runner` — prepare → batches → Task → consolidate\n\n**Quand :** tâche LLM répétitive sur N items indépendants (attribution sources\nsur 100 refs, audit_opus sur 50 fiches, validation RIS sur 200 entrées).\nGain : parallélisation massive + reprise sur échec partiel (batches isolés).\n\n**Comment :** utiliser `tools/lib/agent_runner.py`\n- Phase 1 : script `--prepare` écrit les batches JSON dans\n  `audit_runs/<script>/batches/` (**WORK_DIR persistant obligatoire**,\n  jamais `tmp/<script>/` — purgé entre sessions par `session_start.py`)\n- Phase 2 : **Claude Code lance les agents Task** lisant les batches, écrivant\n  dans `audit_runs/<script>/responses/`\n- Phase 3 : script `--consolidate` recharge les responses et produit l'artefact\n\n**Exemples existants :** `audit_opus.py`, `attribution.py`, `analyse_corpus.py`,\n`validate_ris.py` (tous via `lib/agent_runner.py`).\n\n**Pièges :**\n- Ne jamais appeler l'API Anthropic externe — Claude Code EST Opus (règle\n  CLAUDE.md absolue #4). L'agent Task s'exécute dans la session courante.\n- Batches trop gros → timeout. Viser < 60 s d'exécution agent par batch.\n- State.json partagé — ne pas re-préparer sans purger (cf. docstring).\n- **Plafond `max_concurrent ≤ 5`** — au-delà, le rate-limit Anthropic frappe.\n  Valeur centralisée dans `config` (catégorie `agent_runner`, clé\n  `max_concurrent`, défaut 5). Pas de valeur en dur dans les scripts.\n- **WORK_DIR permanent obligatoire** — `audit_runs/<script>/` (versionné\n  hors git via `.gitignore` ciblé). Toute écriture dans `tmp/` est\n  volatilisée entre sessions et oblige à relancer un run de plusieurs\n  heures.\n- Avant tout lancement : **13 garde-fous** (6 pré-vol + 3 en vol + 4\n  post-vol) — cf. BQ `agent_runner_garde_fous`. Implémentés dans\n  `tools/lib/agent_guards.py` et câblés via `assert_pre_flight` dans\n  `analyse_fiches`, `analyse_corpus`, `audit_opus`, `audit_focus`.\n\n### 2. Pattern agents Task in-session (exploration/extraction)\n\n**Quand :** recherche ouverte dans le code (`Explore`), extraction structurée\nd'un long document, résumé d'un corpus — tâches où je n'ai pas besoin du\nrésultat immédiat en contexte ou quand ça va saturer mon contexte.\n\n**Comment :** `Agent(subagent_type='Explore'|'general-purpose', prompt=...,\nrun_in_background=True)` si je peux continuer d'autres tâches pendant.\n\n**Pièges observés 2026-04-18 :**\n- **Timeout stream idle** après ~130 s. Un agent qui démarre gros plante\n  avant d'écrire son résultat. Leçon : **écriture progressive obligatoire**\n  dans le prompt (« écris tes trouvailles au fil de l'extraction dans\n  /tmp/<file>, ne pas attendre la fin »).\n- **Pas de reprise automatique.** Si l'agent plante, tout son travail est\n  perdu sauf si le prompt l'a forcé à écrire en streaming.\n- **Limite de taille des prompts.** Plus de 1000 lignes d'instructions →\n  l'agent rate la consigne. Viser < 500 lignes.\n\n**Recette anti-timeout :**\n```\n- Briefer l'agent avec un plan en N étapes (N ≤ 6)\n- Exiger une écriture partielle (append) à la fin de CHAQUE étape\n- Demander un résumé final ≤ 300 mots (pas de restitution complète)\n- run_in_background=True quand les tâches ne sont pas bloquantes\n```\n\n### 3. Pattern lecture directe (tool use inline)\n\n**Quand :** analyse qui nécessite d'intégrer le contenu dans mon contexte\npour rédaction, synthèse, articulation avec le reste du corpus. Un agent\nTask me ferait perdre cette capacité (son résultat ne serait qu'un résumé).\n\n**Exemples :** lire un chapitre PDF, rédiger une fiche transversale à partir\nde plusieurs sources, croiser des BQ pour produire un plan.\n\n**Règle :** si je dois produire ensuite un artefact cohérent qui croise ce\nque je lis avec d'autres informations → lecture directe + Write pour\nsauvegarder au fur et à mesure (pour récupération si la session plante).\n\n### Arbitrage — quel pattern ?\n\n| Situation | Pattern |\n|---|---|\n| 50 items LLM indépendants (attribution, audit) | 1 — agent_runner |\n| Extraction structurée d'un long doc (>50 p), résultat en artefact | 2 — Task in-session (avec writes progressifs) |\n| Exploration ouverte du code, recherche ouverte | 2 — Task Explore |\n| Rédaction qui nécessite intégration contextuelle | 3 — lecture directe |\n| Tâche parallélisable où je peux faire autre chose | 2 — Task en background |\n| Artefact unique long (fiche, synthèse) | 3 — lecture + Write progressif |\n\n### Principes transverses\n\n1. **Sauvegarder tôt, sauvegarder souvent.** Tout travail long doit laisser\n   une trace persistante (fichier `/tmp/<work>.md`, ou commit git) au plus\n   tard à mi-parcours. Le timeout Anthropic peut survenir à tout moment.\n\n2. **Ne pas déléguer la compréhension.** Un agent Task ne doit pas recevoir\n   de prompt du type « analyse X puis fais Y » — je dois faire la synthèse\n   moi-même. L'agent extrait, classe, compte. Moi je conclus.\n\n3. **Pas de chaîne d'agents profonde.** Un agent ne devrait pas lancer un\n   autre agent (risque de timeout cascade). Je suis le chef d'orchestre.\n\n4. **Contexte vs parallélisme.** Chaque agent Task a un contexte frais —\n   brief complet dans le prompt, pas de référence à « ce qu'on a dit tout à\n   l'heure ». C'est une feature, pas un bug.\n\n5. **Post-mortem après crash.** Quand un agent plante (timeout, erreur) :\n   - Vérifier ce qui a été écrit sur /tmp/\n   - Raccourcir le périmètre si nécessaire\n   - Relancer avec writes plus fréquents\n\n### Anti-pattern : agents un-a-un au lieu d'agent_runner (incident 2026-04-20)\n\nSession 2026-04-20 : lancement de 27 agents Task individuels pour analyse\nde fiches, au lieu d utiliser `tools/lib/agent_runner.py`. Consequences :\n\n- 27 messages separes, chaque agent pollue le contexte avec son prompt\n  (resume puis resultat) alors que le pattern agent_runner garde les\n  responses hors contexte (`responses/<cid>.json`).\n- Pas de reprise possible si un agent plante a mi-parcours.\n- Parallelisation artisanale (4 a la fois) au lieu de parallele massif\n  dans un seul message.\n- Trois formats de JSON differents produits par les agents (strict, wrap\n  `{sections: ...}`, liste), forcant un normalisateur cote consolidation\n  qui aurait ete evite par un prompt centralise.\n\nCorrection : creation de `tools/admin/analyse_fiches.py` (prepare +\nconsolidate) pour basculer les fiches restantes sur le bon pattern.\n\n**Declencheur mental** : des que j'identifie une tache avec > 5 items LLM\nindependants, avant de lancer le premier agent, penser 'agent_runner'.\nCf. claude_rules.agent_runner_reflexe (affichee a chaque session_start).\n", "type": "doctrine", "crit": false}, {"id": 140, "titre": "Workflows d analyse — pattern unifie agent_runner", "contenu": "## Workflows d'analyse — pattern unifie agent_runner\n\nToute tache d'analyse repetitive sur N items (fiches, sources, sections,\ndocs, termes) suit le **meme pattern en 3 phases**. Centralisation de\ntoutes les recettes et composants reutilisables.\n\n### Principe\n\n```\n[donnees DB] -> --prepare -> batches/<cid>.json\n               |                  |\n               |          agents Task paralleles (Claude Code, un seul message)\n               |                  |\n               |                  v\n               |           responses/<cid>.json\n               |                  |\n               -> --consolidate -> [DB enrichie / artefact final]\n```\n\n**Ne JAMAIS** lancer les agents un par un via plusieurs messages successifs\n(cf. anti-pattern BQ #132 section finale).\n\n### Scripts partages\n\n| Module | Role |\n|--------|------|\n| `tools/lib/agent_runner.py` | `prepare_batches()` + `load_responses()` |\n| `tools/lib/repair_json.py` | Robustesse parsing JSON d'agents |\n\n### Exemples en production\n\n| Script | Domaine | Format entree | Format sortie |\n|--------|---------|---------------|---------------|\n| `tools/batch/analyse_corpus.py` | Audit modulaire corpus (T1-T2, S1-S2, C1-C2, K1-K2, B1) | 1 batch par passe | JSON rapport par passe |\n| `tools/batch/audit_opus.py` | Audit structure fiches (~50) | 1 batch par fiche | JSON per-fiche |\n| `(module archivé)` | Attribution `jenni_sources` ~100 refs | 1 batch par ref | JSON attribution |\n| `(module archivé)` | Validation RIS ~200 entrees | 1 batch par entree | JSON validation |\n| `tools/admin/analyse_fiches.py` | Extraction consciente fiches (formules, chiffres, cards, termes candidats) | 1 batch par fiche | JSON par section `{<ordre>: {chiffres_cles, formules, termes_candidats, cards_liees, fiches_liees}}` |\n\n### Recette prompt type pour extraction\n\nLe prompt d'un agent d'analyse DOIT contenir :\n\n1. **Cible explicite** (fiche_id, source_id, ou autre)\n2. **Doctrine rappelee** : \"extraction uniquement, zero redaction\"\n   (reference CLAUDE.md BQ #136 pas_agent_redacteur)\n3. **Format de sortie strict** (JSON avec schema documente) — toujours le\n   MEME format pour que `--consolidate` puisse parser sans normaliseur.\n4. **Commandes SQL pretes a copier-coller** pour l'exploration\n5. **Un modele reference en DB** (\"la fiche #23 a son analyse_claude, consulte-la\")\n6. **Regles concretes** : motifs concrets pas generiques, verifier absence\n   thesaurus avant proposer candidat, etc.\n7. **Output attendu exact** : chemin fichier + resume max 5 lignes\n\n### Anti-patterns frequents\n\n- **Wrapper JSON** : l'agent produit `{\"fiche_id\": X, \"sections\": [...]}`\n  au lieu du schema strict `{\"<ordre>\": {...}}`. Prevention : exemple\n  literal dans le prompt + instruction \"PAS DE WRAPPER\".\n- **Liste au lieu de dict** : l'agent produit `[{ordre:0,...}, ...]`.\n  Prevention : instruction \"cles = ordre (str)\".\n- **Redaction subreptice** : motifs des cards_liees deviennent des resumes\n  rediges. Prevention : \"motif = ce que la section APPORTE, verbe au\n  present indicatif, ≤ 15 mots\".\n- **Cards 'archive' melangees avec 'active'** : rappeler `status='active' UNIQUEMENT`.\n\n### Declencheurs mentaux (pour moi, Claude)\n\n- \"J'ai N fiches / sources / termes a traiter\" avec N > 5\n  → reflexe agent_runner\n- \"Je vais lancer un Agent() pour chaque item\"\n  → STOP, utilise agent_runner (prepare + parallel + consolidate)\n- \"Chaque agent doit retourner du JSON structure\"\n  → agent_runner garde responses hors du contexte principal\n\n### Stockage des resultats d'analyse\n\n| Artefact | Destination |\n|----------|-------------|\n| Extraction par fiche/section | `fiche_sections.analyse_claude` (JSON) |\n| Extraction par source | `jenni_sources.notes_claude` ou table dediee |\n| Rapports d'audit corpus | `audit_reports/<theme>_<date>.md` |\n| Rapport de session | `jmj/rapports/session/rapport_YYYY-MM-DD.md` |\n\n### Voir aussi\n\n- BQ #132 \"Strategie agents Task — quand/comment/resilience\" (doctrine generale)\n- BQ #136 \"Pas d'agents redacteurs\" (regle absolue sur les limites)\n- `claude_rules.agent_runner_reflexe` (affichee a chaque session_start)\n\n### Recette anti-timeout `analyse_corpus.py` (session 2026-04-21)\n\nConstat : run complet (9 passes) sur le corpus entier avec `max_ctx_analyse_corpus=55000` :\n\n| Passe | Contexte brut | Contexte livré agent | Résultat |\n|---|---|---|---|\n| T1 | thes + secs = 532 k chars | 110 k (truncate) | **stream idle timeout** × 2, même avec progressive writes |\n| K1 | cascade + secs | 88 k | OK mais 22 min |\n| S1 / C1 | secs / chains | 56-74 k | **timeout** 1er tour, OK après relance progressive |\n| T2, S2, C2, K2, B1 | variable | 55-110 k | OK 1er tour mais **corpus amputé** |\n\n**Cause racine** : `truncate(text, max_chars=55000)` coupe au milieu du payload. Avec `max_ctx_analyse_corpus=55000` :\n- Thésaurus complet = ~450 k chars (def + syn + BT/RT) → agents voient **12 %**\n- Sections complètes (18 docs) = 81 k chars → agents voient 12 docs sur 18 (6 docs absents : P3 P4 P5 S0 S1 S2)\n\n**Patch appliqué** (T1 uniquement, session 2026-04-21) :\n\n1. **Index thésaurus condensé** : au lieu de passer le thésaurus complet avec définitions/BT/RT, construire un index `id + [strate] + fr / syn_en` (70 k chars pour 1071 termes). Suffit pour vérifier présence/absence d'un terme.\n2. **Sections complètes** : appeler `extract_sections(con)` en direct pour avoir les 18 docs entiers (81 k chars).\n3. **Split par groupes de docs** : T1 éclaté en T1a (F+H, 5 docs, 90 k) / T1b (P, 5 docs, 92 k) / T1c (S, 5 docs, 98 k) / T1d (V, 3 docs, 85 k). Chaque sous-batch sous la limite de timeout (≈ 5-7 min agent).\n4. **Fusion responses T1a-d → T1_completude.json** avant `--consolidate`.\n\n**Généralisation recommandée** (non encore appliquée au script, à faire) :\n- Passer `max_ctx_analyse_corpus` à 90 000 pour éviter la troncature des sections (81 k suffisent).\n- Pour T1/T2/B1 qui consomment le thésaurus : basculer sur un mode `index` (id+fr+syn_en) avec définitions disponibles via un second helper si l'agent veut creuser. Économise 90 % du contexte thésaurus sans perte de capacité de détection.\n- Pour T1 : ajouter un flag `--split-by-strate` qui produit 4 batches au lieu d'1 (F+H / P / S / V). Sortie : 4 responses à fusionner dans le consolidate.\n- Pour S1 / S2 / K1 qui utilisent beaucoup les sections : même pattern de split par strate en cas de timeout (pas obligatoire, selon volume DB).\n\n**Écriture progressive pour ces passes** : dans le prompt agent, exiger `Write tmp/analyse_corpus/responses/<cid>.json après chaque doc traité` avec JSON partiel cumulatif. Garantit un résultat partiel même si timeout à mi-parcours. Pattern appliqué avec succès sur C1 (2 min → 9 min 17 min) et T1a-d.\n\n**Règle** : dès qu'un batch dépasse 80 k chars utiles **ET** fait de l'analyse cross-section (pas juste extraction d'un item), prévoir le split ou l'écriture progressive. 80 k chars utiles ≈ limite où un agent tient en 5-10 min.\n", "type": "workflow", "crit": false}, {"id": "wf_solde_audit", "titre": "Solder un audit corpus — traitement conscient des actions priorisées", "contenu": "## Solder un audit corpus — en conscience, pas un `--apply` mécanique\n\n> **Quand consulter** : après un audit (`audit_conscient` / `audit_corpus`) qui\n> produit un rapport d'**actions priorisées** (« top 12 »…). Ce workflow régit\n> leur **traitement**, pas leur production.\n\n> **Principe cardinal** (parallèle de `wf_fiche_integration` : « l'intégration\n> n'est pas un `--apply` ») : **solder un audit est un travail EN CONSCIENCE,\n> jamais un automatisme.** Chaque action est ré-examinée en DB, tranchée par le\n> contenu, réversible et documentée. Le rapport d'audit est une **hypothèse de\n> travail**, pas un ordre d'exécution — il se trompe (cf. étape 2).\n\n### Étape 0 — Re-vérifier l'état réel (le rapport peut être périmé)\n\nAvant toute action, **requêter la DB** : certaines actions sont **déjà faites**\n(sessions précédentes), d'autres ont changé. Ne jamais agir sur la seule foi du\nrapport. Documenter « #X déjà fait (vérifié) » est un résultat valide.\n\n### Étape 1 — Trier les actions par NATURE (détermine QUI tranche)\n\n| nature | qui tranche | exemples |\n|---|---|---|\n| **Technique / structurelle** | Claude, par le contenu | re-tags `strate_etape`, ré-affectation `doc_code`, fusion de doublons **nets**, liens cascade (`cascade_prerequis.card_ids` + `cascade_level_links` cohérents), nettoyage intégrité (self-loops) |\n| **Éditoriale scientifique** | JMJ + Claude **en direct** (`pas_agent_redacteur`) | création de chaîne / card, harmonisation d'une contradiction, réorganisation de prose. Toujours **propose → JMJ valide → applique** |\n| **Éditoriale thésaurus** | **cycle Jenni** uniquement | reformuler `syn_fr`, désambiguïser un `fr` (#138), compléter des termes → liste `recherches/thesaurus/` ; **jamais** d'écriture directe (gardes `def-jenni-ok`) |\n\n### Étape 2 — LEÇON CLEF : vérifier AVANT de fusionner\n\n**Un rapport d'audit surestime systématiquement les doublons.** Avant toute\nfusion (termes *ou* cards), **examiner le contenu de chaque paire**\n(`audit_cards_first`) pour distinguer vrai doublon et **faux positif** :\nconcepts distincts, **homonymes**, **hub de navigation** vs contenu, **parcours**\nvs **cadre théorique**.\n\n- *Session 2026-06-06* : action 11 (termes) → **3 faux positifs sur 7**\n  (k2 minéralisation-humus vs k2 cinétique-enzymatique = homonymes ; battance\n  *processus* vs croûte *résultat* ; bien-être animal vs bientraitance).\n  Action 12b (cards) → **3/3 faux positifs** (#31 *hub* vs #52 *contenu* ; #152\n  *origine du consortium* vs #153 *KNF/JADAM* ; #54 *parcours du C* vs #98\n  *paradigme SCM*).\n- → **Ne jamais exécuter une fusion qui appauvrirait le corpus.** Le bon service\n  de l'audit est, souvent, de **ne pas fusionner** et de le justifier.\n\n### Étape 3 — Les garde-fous priment, même quand JMJ délègue\n\n« Règle les arbitrages » / « tu tranches » ne lève **aucun** garde-fou :\n\n- champ éditorial thésaurus (`definition`/`syn_*`/`fr`/`en`) → **Jenni**\n  (`guard-term-definitions`), jamais en dur ; le `fr` canonique ne bouge pas (#138) ;\n- `DELETE` / `MERGE` / opération structurelle → sentinel `# bq-ok` **après** BQ\n  consultée (`guard-bq-search`) ; les `UPDATE` purement structurels (`doc_code`,\n  `strate`, `statut`) passent sans sentinel ;\n- une **chaîne causale affirme** un mécanisme : ne pas en créer une sur un\n  mécanisme **contesté** → préférer une **card de controverse** ; en cas de doute\n  scientifique, recourir à l'**arbitrage Jenni** (ci-dessous).\n\n### Recours — arbitrage Jenni « en ligne » (trancher une controverse scientifique)\n\nQuand une action bute sur une **question scientifique contestée** (mécanisme\ndébattu, valeurs divergentes entre sources) qu'on ne peut trancher **ni par le\ncontenu du corpus ni par jugement** : demander un **arbitrage à Jenni**, sans\nattendre un cycle docx complet.\n\n- **Format « en ligne »** : Claude rédige un **prompt d'arbitrage autonome**\n  (directement dans le chat, **hors workflow docx**) ; JMJ le colle à Jenni et\n  ramène la réponse aussitôt après — boucle courte, pas de fichier intermédiaire.\n- **Pure question scientifique** : **aucun méta-vocab corpus** (pas de codes docs,\n  `chaîne`, `card`, `corpus`, `strate`) — le prompt tient debout seul, comme un\n  docx Jenni (`bq_clean_discipline`).\n- **Demander** : un **verdict tranché**, la distinction *démontré / plausible /\n  surinterprété*, les **biais méthodologiques** relevés, et des **sources évaluées\n  par les pairs** (DOIs, priorité récente) ; exiger une **réponse synthétique**,\n  pas une dissertation (Jenni enrichit ×5-10 par défaut).\n- **Au retour** : analyser, puis **décider** — chaîne **nuancée**, **card de\n  controverse**, ou **abandon** ; reprendre telle quelle la **formulation prudente**\n  proposée par Jenni, et router les **sources clés** vers la biblio (volet B1).\n- *Ex. 2026-06-06* : CMN « réseau d'alerte » inter-plantes → verdict Jenni\n  « **plausible mais non démontré** » (Karst 2023, Robinson 2023) → enrichissement\n  de la card #132 + formulation prudente, **aucune chaîne créée**. L'arbitrage a\n  ainsi **confirmé** la position du corpus tout en l'étayant.\n\n### Volet thésaurus — termes manquants / problématiques : rassembler pour Jenni, jamais créer en dur\n\nUn audit signale des termes à traiter : **manquants** (lacunes mobilisées par le\ncorpus), **problématiques** (`statut a_revoir`, `approx`, `syn_fr` ambigu),\n**incomplets** (def < 50 c / sans EN / sans `inrae`), **homonymes**, **doublons**.\n\n> **Règle absolue** : Claude ne **crée** ni ne **complète** un terme en dur — tout\n> passe par le **cycle Jenni** (`guard-term-definitions` / `def-jenni-ok`, #138).\n> Le solde produit une **liste à définir**, pas des `INSERT terms`.\n\nRecette (session 2026-06-06) :\n\n1. **Base auto** — `export_thesaurus_incomplets.py --single-txt` → maintient la\n   liste plate §0 (critère def<50c / sans EN / sans inrae) dans le **fichier unique**\n   `recherches/thesaurus/termes_a_definir.txt` ; l'outil signale aussi les\n   **near-dups** à arbitrer avant envoi.\n2. **Compléter** ce que l'outil ne capte pas (def présente mais à revoir) : les\n   `statut='a_revoir'` + `'approx'`, les cas pointés par l'audit (syn ambigu),\n   et les **lacunes** — termes absents mais mobilisés (ex. guildes nématodes\n   bactérivores/fongivores/omnivores).\n3. **Nettoyer** : tri alpha (#115), dédup `norm()`, **écarter** les doublons déjà\n   fusionnés dans la session **et** les variantes lexicales d'un terme existant\n   (« voie Wood-Ljungdahl » vs « voie de Wood-Ljungdahl ») — sinon Jenni **recrée\n   un doublon** à l'import.\n4. **Note d'arbitrage SÉPARÉE** (near-dups ambigus, homonymes à désambiguïser type\n   k2) → **`jmj/rapports/audit/`**, **JAMAIS** `recherches/thesaurus/` : les renvois\n   `#N` y déclenchent le scan méta-vocab (`check_forbidden_jenni`, hook pre-commit).\n   La liste envoyée à Jenni reste **plate et propre** — des libellés `fr` seuls.\n5. **Retour Jenni** — `import_termes_jenni.py --replace` + **analyse consciente**\n   (`wf_source_integration`, BQ thésaurus #116) : ré-attribution strate/`doc_code`\n   par la **provenance** (terme → fiche source), jamais devinée ; `fr` canonique\n   stable (#138), l'acronyme va en `syn_fr`/`syn_en`.\n\n> **Créer un terme manquant = ajouter son libellé à la liste Jenni**, pas un\n> `INSERT terms`. Définition, synonymes, anglais, relations BT/RT viennent de\n> Jenni — la rédaction éditoriale du thésaurus n'est jamais de la mémoire Claude.\n\n### Étape 4 — Exécution : par action, traçable, réversible\n\n- **Un commit par action** (message = action + raisonnement + réversibilité).\n- Après édition DB : **regen ciblé** (le bon `gen_*`, pas `regen_all` si une seule\n  page est concernée) → **WAL checkpoint** avant `git add sol_vivant.db` →\n  `check_integrity` (0 criticité attendu).\n- Tracer dans **`audit_log`** (`detail` = action + arbitrage retenu).\n\n### Étape 5 — Solder ≠ tout faire en une session\n\nLes actions de **création** (cards manquantes, refonte de prose, nouvelles\nchaînes) sont des chantiers d'autorat dédiés, lourds. Solder = **traiter ce qui\nest tranchable proprement**, **router** le reste (liste Jenni, sessions JMJ en\ndirect) et **documenter l'état final** : X/N actions soldées, ce qui reste, et\n**pourquoi** (nature éditoriale, garde-fou, controverse non levée).\n\n---\n\n**Anti-pattern principal** : enchaîner les actions du rapport en `--apply`\nmécaniques sans ré-examen DB ni tri par nature — produit des fusions destructrices\n(faux positifs), des écritures éditoriales hors Jenni, et des chaînes qui affirment\ndes mécanismes non soutenus. Le rapport propose ; la conscience dispose.\n", "type": "workflow", "crit": false}, {"id": "audit_conscient", "titre": "Audit conscient vs audit scripté — doctrine et priorité", "contenu": "## Audit conscient vs audit scripté\n\nLe corpus est éprouvé par **deux familles d'audit**, de natures et de\npriorités différentes. Les confondre conduit à se rassurer à tort.\n\n### Audit conscient — PRIORITAIRE\n\nJugement éditorial sur la **doctrine** : *ce que le corpus affirme tient-il\ndebout ?* Requiert lecture, croisements et arbitrage. C'est la valeur réelle\n(cohérence narrative et scientifique). Deux chantiers :\n\n- **`audit_corpus`** — chaînes causales, concept cards, fiches\n- **`audit_thesaurus`** — ossature lexicale\n\nCadence : toutes les 3-5 sessions, ou avant un consolidé éditorial majeur.\n\n### Audit scripté — SANTÉ\n\nAssertions automatiques et mécaniques : monitoring de la **santé technique**.\nTournent à chaque `session_start` (dashboard ÉTAT DES AUDITS, status\n`ok`/`degraded`/`failed`) :\n\n- `check_integrity` (FK, doublons, schéma) · `check_forbidden_jenni`\n  (méta-vocab) · `audit_anglicismes` · `audit_fiches` ·\n  `audit_sources_orphelines` · `enrich_thesaurus_audit`\n\nInstrumental, jamais une fin en soi.\n\n### Pourquoi cette hiérarchie\n\nL'audit scripté garde la maison propre (intégrité, méta-vocab, anglicismes),\nmais ne dit **rien** de la justesse scientifique ni de la cohérence\ndoctrinale. Un corpus peut être « vert » sur tous les audits scriptés et\nporter des contradictions de fond, des chaînes mal étayées, des cards\norphelines, des intros copiées-collées hors-sujet. **Seul l'audit conscient\nles révèle.** → la priorité va au conscient ; le scripté est l'hygiène de\nfond qui tourne en tâche de fond.\n\n### Conduite de l'audit conscient — méta puis fin\n\nL'audit conscient combine la **couverture** des agents et le **jugement** de\nClaude. Quatre temps :\n\n1. **Méta-analyse (agents)** — `analyse_corpus.py --prepare` → agents Task en\n   parallèle (pattern `agent_runner`, BQ `strategie_agents`) → `responses/` →\n   `--consolidate`. Donne une couverture large, chiffrée, passe par passe.\n2. **Supervision (Claude)** — **juger** chaque réponse d'agent (exhaustivité,\n   justesse, hors-sujet), **affiner / relancer** les passes faibles. Ne\n   jamais consolider aveuglément : une réponse d'agent est une proposition,\n   pas une vérité.\n3. **Analyse fine en direct (Claude)** — approfondir, en chargeant le corpus,\n   les points saillants révélés par la méta (en particulier les\n   **convergences inter-passes** : un même défaut pointé par 3 passes\n   indépendantes est un vrai problème). C'est là que se fait l'arbitrage\n   doctrinal. Pour un arbitrage de fond (création/refonte de cards, chaînes,\n   cascades, design DB), l'instruire par le **Conseil** — 3 lentilles + double\n   contradicteur → verdict vérifié pour JMJ, cf. BQ `conseil_modele`.\n4. **Rapport** — `jmj/rapports/audit/audit_corpus_<date>.md` : synthèse par\n   axe + section « actions priorisées (top 10) ».\n\n### Leçons opérationnelles (2026-05-26)\n\n- **Pérenniser les réponses d'agents.** Le work-dir `agent_runner` vit sous\n  `audit_runs/` (versionné), jamais `tmp/` (gitignoré + container web\n  éphémère = perte garantie au reset). `responses/` + `state.json` trackés ;\n  `batches/`, `prompts/` et sorties de consolidation (`resultats_v4.json`,\n  `rapport_analyse_v4.md`) régénérables → ignorés. Cf. `audit_runs/README.md`.\n- **Committer au fil de l'eau.** Un audit LLM complet consomme beaucoup de\n  tokens (méta-analyse 9 passes ≈ 1,5 M tokens). Committer **et pousser**\n  après chaque étape (responses, fix, rapport) pour ne rien perdre si la\n  session déborde sa limite avant la clôture `session_end.py`.\n- **Lancer sur une session vierge.** L'audit conscient complet (9 passes de\n  méta-analyse + supervision + analyse fine en direct) consomme une session\n  entière. Le démarrer en **début de session dédiée**, jamais sur une session\n  déjà entamée à 50 % par un autre chantier (fiches, intégrations) : le risque\n  est de déborder la limite avant la clôture (constat 2026-05-25/26).\n- **Se méfier d'un audit scripté faussé.** La passe T1 (complétude) est passée\n  d'un score 0,27 à 0,91 après correction d'une **troncature de l'index\n  thésaurus** : l'outil de mesure était cassé, pas le corpus. Toujours lire le\n  rapport JSON (`audit_reports/json/<script>_latest.json`), pas seulement le\n  score agrégé (cf. doctrine anti-rassurisme, `claude_rules`).\n", "type": "doctrine", "crit": false}, {"id": 155, "titre": "Audit du thésaurus — doctrine et workflow", "contenu": "## Audit du thésaurus — doctrine et workflow\n\nL'audit du thésaurus est un **chantier conscient** qui s'appuie sur un ensemble fini d'objectifs et de contrôles, exécutés à intervalles réguliers ou avant un cycle d'envoi Jenni majeur. Le thésaurus étant l'ossature lexicale du corpus (BQ `redaction_documents_jenni` #146 §H), une dérive lexicale ou des relations cassées se propagent dans tous les prompts produits. Cet audit n'est pas un simple `check_integrity` : il requiert lecture, croisements et arbitrage éditorial.\n\n### Objectifs canoniques\n\n| Axe | Objectif | Sortie attendue |\n|---|---|---|\n| **A. Nouveaux termes candidats** | Extraire les concepts mobilisés dans les fiches intégrées récentes / les retours Jenni mais absents du thésaurus | Liste triée par strate, prête pour un cycle d'enrichissement (workflow BQ `thesaurus_workflow` #116) |\n| **B. Termes incomplets** | Identifier les termes en DB sans définition (ou DEF < 150 c) ou sans BT — et les classer par priorité. **L'absence de synonyme n'est PAS un critère d'incomplétude** (voir règle d'arbitrage 5) | Liste docx « bloc de 10 » à passer par Jenni via `export_thesaurus_incomplets.py` |\n| **C. Relations cassées** | Vérifier la cohérence des BT/NT/RT : orphelines, doublons latents, polysémie, casses incohérentes | Rapport markdown d'arbitrages éditoriaux (à valider JMJ) |\n| **D. Doublons latents** | Détecter les `fr` qui sont des synonymes d'un autre terme, les variantes orthographiques, les acronymes qui collisionnent (`MO` vs `Mo`) | Liste de fusions candidates avec scoring qualité |\n| **E. Méta-vocab dans définitions** | Scanner les `terms.definition` à la recherche de fuites (`corpus`, `strate`, `card #N`, codes doc) | 0 toléré — UPDATE direct |\n| **F. Pseudoscience** | Vigilance BQ `sujets_interdits_corpus` #154 : termes biodynamie/Steiner non flaggés, relations valorisantes | Suppression ou flag (cf. incident 2026-04-23) |\n| **G. Anglicismes en strate FR** | Détecter `terms.fr` qui sont des termes anglais déguisés (140 cas constatés 2026-04-14) — nuisent au cycle Jenni | Audit + correction au cas par cas (taxons exclus) |\n| **H. Couverture par strate** | S'assurer que chaque strate F/S/V/P/H a une couverture lexicale équilibrée vs les sections de prompts | Rapport quantitatif (n termes par strate, ratio terms/section) |\n\n### Matching d'existence — 4 axes minimum (RÈGLE, fix 2026-06-03)\n\nLa détection « candidat absent » (row A) — et **tout agent/audit qui propose des termes**\n(audit corpus, audit thésaurus, audit Opus) — **doit croiser le candidat (fr ET en) contre\n`fr / en / syn_fr / syn_en` existants**, en `norm()` (casse, accents, apostrophes, pluriels),\n**pas `lower(fr)` seul**. Sinon un terme déjà présent sous un autre libellé (acronyme,\nsynonyme, singulier/pluriel) ressort comme « faux neuf » → doublon.\n\n- **Gap corrigé** : `export_termes_candidats.py::thesaurus_contains()` était fr-only (exact +\n  fuzzy 8 chars) → **29/100 doublons latents** ont passé au lot 1 du 2026-06-03\n  (cf. `audit_reports/analyse_termes_thesaurus_2026-06-03.md`). Réécrit en 4-axes (index\n  `norm()` de fr/en/syn_fr/syn_en).\n- **5ᵉ axe à l'import** : `import_termes_jenni.py` vérifie en plus **syn-candidat ↔ fr-existant**\n  (doublons croisés — 6 cas attrapés au lot 1) ; ces cas restent « arbitrage JMJ ».\n\n### Cards comme outil d'audit du thésaurus\n\nLes **concept cards** (BQ `concept_cards_filtre` #106 — rôle 5 « audit / stress-test ») servent de filtre amont : un terme candidat issu d'une fiche doit être confronté aux cards de la dimension correspondante avant d'être proposé pour enrichissement. Si aucune card existante ne contient le concept ou si une card en `archive` (mémoire de rejet) le contredit, le candidat est mis en attente jusqu'à arbitrage.\n\n```sql\n-- Cards 'active' qui mentionnent un concept (recherche large)\nSELECT id, title, dimension_id, status FROM concept_cards\nWHERE status='active' AND (lower(title) LIKE '%<concept>%' OR lower(description) LIKE '%<concept>%');\n\n-- Cards 'archive' qui rejettent un concept proche (mémoire de rejet)\nSELECT id, title, notes FROM concept_cards\nWHERE status='archive' AND lower(description) LIKE '%<concept>%';\n```\n\n### Pipeline d'audit en 5 passes (pattern `agent_runner`)\n\nL'audit thésaurus est éclaté en passes modulaires alignées avec `tools/batch/analyse_corpus.py` (BQ `wf_analyse` #140), pour permettre la parallélisation et la reprise après timeout.\n\n| Passe | Code | Objectifs | Contexte agent | Risque timeout |\n|---|---|---|---|---|\n| **T1** | Complétude | Termes vs sections : termes incomplets (B), nouveaux candidats (A), couverture (H) | Sections complètes (~81 k) + index thésaurus condensé (~70 k) | **Élevé** — split obligatoire par strate |\n| **T2** | Doublons | Doublons latents (D), relations (C), pseudoscience (F) | Thésaurus complet par strate + relations | Modéré |\n| **B1** | Biblio | Couverture refs par terme (jenni_sources / source_usages) | Thésaurus + biblio | Modéré |\n| **A1** | Anglicismes | Anglicismes en strate FR (G) — `audit_anglicismes.py` | Thésaurus FR seul | Faible |\n| **M1** | Méta-vocab | Leaks méta-vocab dans définitions (E) — scan regex inline | Thésaurus.definition seul | Très faible (scan local) |\n\n### Anti-timeout — règles opérationnelles\n\nCf. BQ `wf_analyse` #140 §recette anti-timeout. Spécifique au thésaurus :\n\n1. **Index condensé** : ne JAMAIS passer le thésaurus complet (def + BT + RT = ~450 k chars). Construire un index `id + [strate] + fr / syn_en / type` (~70 k chars pour 1071 termes). Définitions à la demande seulement, via second helper.\n2. **Split par strate** pour T1 : éclater en T1a (F+H) / T1b (P) / T1c (S) / T1d (V). 4 batches → fusion responses → consolidate.\n3. **Écriture progressive obligatoire** dans tous les prompts agent : `Write tmp/audit_thesaurus/responses/<cid>.json après chaque sous-batch traité`. Garantit un résultat partiel même si timeout à mi-parcours.\n4. **Limite dure** : 80 k chars utiles par agent → au-delà, split obligatoire.\n\n### Scripts dédiés\n\n| Script | Rôle | Pattern |\n|---|---|---|\n| `tools/admin/audit_thesaurus.py` | **Rapport consolidé A→H** (passes directes ; réutilise `audit_thesaurus`/`find_pairs`/`scan_thesaurus`) | Direct |\n| `tools/admin/check_integrity.py` | Sanity check rapide (FK, doublons schema) | Direct (pas d'agent) |\n| `tools/admin/audit_anglicismes.py` | Passe A1 (anglicismes en strate FR) | Direct |\n| `tools/admin/check_forbidden_jenni.py` | Passe M1 (méta-vocab dans définitions + tout contenu Jenni) | Direct |\n| `tools/admin/audit_sources_orphelines.py` | Sources sans DOI/URL (B1 partiel) | Direct |\n| `tools/batch/analyse_corpus.py --type thesaurus` | Passes T1 + T2 (passes lourdes) | `agent_runner` parallèle |\n| `tools/jenni/export_thesaurus_incomplets.py` | Sortie axes B (incomplets) → docx Jenni | Direct |\n| `tools/admin/dedupe_thesaurus.py` | Axe D (déduplication) | Direct + scoring |\n\n### Cadence et déclencheurs\n\n- **Cadence régulière** : audit complet toutes les **3-5 sessions**, ou systématiquement avant une consolidation thésaurus (envoi de listes Jenni > 50 termes).\n- **Déclencheurs immédiats** :\n  - Après un import massif (lot de termes Jenni > 30 entrées) → re-passe T2 + axes C/D\n  - Après une fusion ou suppression de termes → re-passe relations (C)\n  - Après une fiche intégrée → extraire termes mobilisés, comparer aux candidats (A)\n  - Après une session Jenni qui a touché à des relations BT/RT → axe C\n- **Avant tout commit `--apply`** d'un import thésaurus : passes M1 (méta-vocab) + F (pseudoscience) obligatoires.\n\n### Sortie consolidée\n\nRapport unique `jmj/rapports/audit/audit_thesaurus_<date>.md` avec une section par axe (A→H) + section synthétique « actions priorisées ». Format aligné sur `audit_corpus_<date>.md` (BQ `audit_corpus`). **Généré par `tools/admin/audit_thesaurus.py --db sol_vivant.db`** (passes directes ; les passes lourdes T1/T2 et l'extraction de candidats A restent déléguées à `analyse_corpus.py` / `export_termes_candidats.py`).\n\n```\n# Audit thésaurus — <date>\n## A. Nouveaux termes candidats (N)\n## B. Termes incomplets (N) — par priorité\n## C. Relations cassées (N orphelines, N doublons, N polysémie)\n## D. Doublons latents (N candidats fusion)\n## E. Méta-vocab leaks (N occurrences) — UPDATE direct\n## F. Pseudoscience (N occurrences flag/suppression)\n## G. Anglicismes en strate FR (N termes à corriger)\n## H. Couverture par strate (tableau quantitatif)\n## Synthèse — actions priorisées (top 10)\n```\n\n### Règles d'arbitrage\n\n1. **Pas d'INSERT direct** des termes candidats issus d'extractions (cf. BQ #147 anti-pattern). Les axes A et B alimentent le **workflow Jenni standard** (`export_thesaurus_incomplets.py` ou `gen_prompt_thesaurus.py`), Jenni rédige les définitions, retour via `import_termes_jenni.py`.\n2. **Pas de modification automatique de `terms.fr`** (BQ #146 §H.4 et `claude_rules.pas_modif_fr_canonique`). Toute correction casse/ponctuation sur `fr` passe par validation JMJ explicite.\n3. **Cards confrontées avant proposition** (BQ #106 + `claude_rules.audit_cards_first`) : un nouveau terme candidat doit avoir au moins une card `active` qui le justifie ou le contextualise. Sans card, c'est une affirmation orpheline.\n4. **Audit log systématique** : chaque action correctrice (UPDATE, DELETE, INSERT) trace dans `audit_log` avec `operation`, `table_name`, `record_ref`, `detail`.\n5. **L'absence de synonyme n'est PAS une incomplétude** (décision 2026-06-01). Beaucoup de termes canoniques — taxons (`Aeschynomene`, `Gluconobacter`), composés chimiques précis (`brushite`, `acétate de calcium`), enzymes nommées (`calpaïne`) — n'ont **légitimement aucun synonyme**. Jenni répond alors `SYN_FR: -` / `SYN_EN: -` (réponse valide, cf. BQ `charte_jenni` §3). Conséquences **codées** : (a) `thesaurus_completion.audit_thesaurus(axis='all')` ne combine que **BT + DEF** — l'axe `syn` est exclu du déclencheur (mais reste interrogeable explicitement pour une passe synonymes dédiée) ; (b) l'indicateur `check_integrity.check_terms_syn_en` (« Termes EN sans syn_en ») a été **retiré**. Sans ces garde-fous, chaque import de termes sans synonyme gonflait un faux signal d'audit et renvoyait ces termes en boucle à Jenni via `export_thesaurus_incomplets`.\n\n### Anti-patterns confirmés\n\n- **Pas d'agent Task pour rédiger les définitions** des termes candidats (BQ #136). Extraction → liste → Jenni rédige.\n- **Pas de scan régex « tout-en-un »** sur le thésaurus complet — séparer les axes (A/B/C/D/E/F/G/H) pour traçabilité et reprise partielle.\n- **Pas de re-passe complète après chaque correction mineure** — batch les corrections puis re-audit ciblé.\n- **Pas d'oubli des orphelines BT/RT** après import — re-résolution périodique obligatoire (gain 5-10 % par passe, BQ #146 §H.2).\n\n### Voir aussi\n\n- BQ `audit_corpus` (#156) — pendant côté corpus (chaînes, cards, fiches)\n- BQ `wf_analyse` (#140) — pattern agent_runner unifié\n- BQ `strategie_agents` (#132) — anti-timeout, écriture progressive\n- BQ `thesaurus_workflow` (#116) — workflow import/export complet\n- BQ `redaction_documents_jenni` (#146) — règles de rédaction + §H thésaurus\n- BQ `concept_cards_filtre` (#106) — cards comme filtre + outil d'audit\n- BQ `sujets_interdits_corpus` (#154) — biodynamie/Steiner exclus\n- BQ `pas_agent_redacteur` (#136) — règle absolue rédaction\n- BQ `audit_integrite_db` (#74) — sanity check DB technique\n", "type": "workflow", "crit": false}, {"id": 156, "titre": "Audit du corpus — chaînes causales, concept cards, fiches", "contenu": "## Audit du corpus — chaînes causales, concept cards, fiches\n\nL'audit du corpus est le **chantier conscient** qui éprouve la cohérence narrative et scientifique des artefacts éditoriaux : chaînes causales, concept cards, fiches. Distinct de l'audit thésaurus (BQ `audit_thesaurus`) qui éprouve l'ossature lexicale, et de l'audit d'intégrité (BQ #74) qui éprouve les FK et schémas, cet audit éprouve la **doctrine** : ce que le corpus affirme tient-il debout ?\n\n### Objectifs canoniques\n\n| Axe | Objectif | Sortie attendue |\n|---|---|---|\n| **C1. Chaînes causales — étapes nourries** | Vérifier que chaque étape (`chain_etapes`) a son `term_id`, son `role_dans_chaine` rédigé, sans placeholder résiduel `[XX]` | Rapport par chaîne (Cn → étapes complètes vs trous) |\n| **C2. Chaînes causales — étapes orphelines / à enrichir** | Identifier les étapes peu nourries par le corpus (fiches/cards qui ne renvoient pas à la chaîne), proposer enrichissement | Liste des étapes à étoffer + cards/fiches candidates |\n| **C3. Chaînes causales — nouvelles chaînes implicites** | Détecter les enchaînements causaux mentionnés dans plusieurs fiches sans qu'une chaîne formalisée les capture | Propositions de nouvelles chaînes Cn+1, Cn+2, … |\n| **K1. Concept cards — santé de la collection** | Inventaire actives vs archives, cohérence dimension, links manquants, cards orphelines (sans terrain_test, sans link, sans pedago_link) | Tableau santé par dimension |\n| **K2. Concept cards — confronter aux fiches récentes** | Pour chaque fiche `integre*` récente, vérifier que les cards de score ≥ 5 ont reçu `[Apport fiche #N]` dans `notes` (cf. BQ #147 phase 4bis) | Liste des renforcements omis |\n| **K3. Concept cards — contradictions doctrinales** | Vérifier explicitement les `concept_card_links.link_type='contradicts'` (BQ `cards_contradictions` #112) — pas d'heuristique texte | Rapport des contradictions actives à arbitrer |\n| **K4. Cards comme filtre amont** | Vérifier qu'aucune fiche `integre*` ne porte une affirmation contredite par une card `archive` (mémoire de rejet) | Alertes éditoriales pour relecture JMJ |\n| **F1. Fiches — intégrité contenu** | `fiche_contenus.contenu_integre` rempli pour les `integre*`, `refs` cache cohérent avec `source_usages` | Liste des fiches avec dette technique |\n| **F2. Fiches — articulation entre fiches** | Détecter les fiches qui se recouvrent sans articulation explicite dans `fiches.notes` (`[Articulation fiche #N]`) | Propositions de cross-références |\n| **F3. Fiches — propagation vers prompts docs cibles** | Pour chaque fiche `integre*`, vérifier que `prompts.contexte_sci` ou `.enrichissement` des `docs_cibles` mentionne le sujet | Liste des propagations omises |\n| **F4. Fiches — anglicismes résiduels** | Scan `audit_anglicismes.py` sur graines + contenu intégré | 0 anglicisme non glosé |\n\n### Concept cards comme outil d'audit (rôle 5 — BQ #106)\n\nLes concept cards sont **un instrument d'audit double** :\n\n1. **Filtre amont** (production) : `claude_rules.audit_cards_first` — avant toute création de fiche, terme, validation, Claude lance `SELECT FROM concept_cards WHERE …` sur les keywords du domaine. Si une card `active` couvre le sujet → enrichir cette voie. Si une card `archive` rejette une affirmation proche → renoncer ou justifier la rupture.\n\n2. **Stress-test aval** (audit) : confronter chaque artefact éditorial du corpus aux cards correspondantes. Cette confrontation produit :\n   - Des **alertes éditoriales** (axe K4) quand une affirmation dans une fiche entre en tension avec une card de la même dimension.\n   - Des **propositions de renforcement** (axe K2) quand une fiche apporte de la matière à une card existante (synthèse 3-5 lignes dans `concept_cards.notes`).\n   - Des **propositions de nouvelles cards** quand une fiche mobilise un mécanisme/concept récurrent que le réseau actuel ne capture pas.\n   - Des **liens `concept_card_links`** à tisser explicitement (`completes`, `contradicts`, `prerequisite`, `derives_from`, `related_to`, `supersedes`, `example_of`).\n\nL'audit doit produire un récap des cards-hubs (cards les plus citées via `pedago_links`, BQ #151) et des cards-orphelines (jamais référencées) pour décision : enrichir, articuler, ou archiver.\n\n### Chaînes causales comme outil d'audit\n\nLes chaînes (BQ `chaines_doctrine` #144) sont **les démonstrations transverses** du corpus. L'audit éprouve :\n\n- Chaque chaîne a-t-elle ses étapes complètement rédigées (pas de placeholder, term_id obligatoire) ?\n- Les fiches récemment intégrées **nourrissent-elles** des étapes existantes (mention « voir fiche #N » dans `chain_etapes.role_dans_chaine`) ?\n- Y a-t-il des **chaînes implicites** dans le corpus que la collection actuelle ne formalise pas (axe C3) ?\n- Les cards de chaque dimension sont-elles connectées à au moins une chaîne via `card_chain_links` ?\n\n```sql\n-- Audit étapes incomplètes — VRAIS placeholders de dette uniquement.\n-- ATTENTION : les renvois éditoriaux « [voir fiche #N … pour développement] »\n-- dans role_dans_chaine sont LÉGITIMES (annotations de croisement, ~126 étapes),\n-- PAS des placeholders → exclus, sinon faux positif massif (constat 2026-05-26).\nSELECT chain_id, position, term_fr_text FROM chain_etapes\nWHERE term_id IS NULL\n   OR term_fr_text LIKE '[%'\n   OR (role_dans_chaine LIKE '%[%]%' AND role_dans_chaine NOT LIKE '%[voir %');\n\n-- Audit term_fr_text désynchronisé de terms.fr\nSELECT ce.chain_id, ce.position, ce.term_fr_text, t.fr\nFROM chain_etapes ce JOIN terms t ON t.id=ce.term_id\nWHERE ce.term_fr_text != t.fr;\n\n-- Cards d'une dimension sans aucune chain_etapes liée\nSELECT cc.id, cc.title FROM concept_cards cc\nLEFT JOIN card_chain_links ccl ON ccl.card_id=cc.id\nWHERE cc.status='active' AND cc.dimension_id=<N> AND ccl.card_id IS NULL;\n```\n\n### Pipeline d'audit en 7 passes (pattern `agent_runner`)\n\nL'audit corpus est éclaté en passes modulaires alignées avec `tools/batch/analyse_corpus.py` (BQ `wf_analyse` #140).\n\n| Passe | Code | Objectifs | Contexte agent | Risque timeout |\n|---|---|---|---|---|\n| **S1** | Sections/contradictions | Cohérence inter-sections (contradictions de fond entre fiches) | Sections + fiches `integre*` | **Élevé** — split par strate |\n| **S2** | Source unique | Concept défini une seule fois (pas de doublon thésaurus/section) | Sections + thésaurus condensé | Modéré |\n| **C1** | Chaînes documentées | Étapes vs sections : maillons effectivement étayés | Chaînes + sections | Modéré |\n| **C2** | Nouvelles chaînes | Détection chaînes implicites depuis sections | Sections + cards | Modéré |\n| **K1** | Cascade N0-N5 | Couverture cascade biophysique / coûts cachés / autres méta-cascades | Cascades + sections | Modéré |\n| **K2** | Mapping cards | Mapping concept_cards ↔ sections (cards orphelines, sections sans card) | Cards + sections | Modéré |\n| **B1** | Couverture refs | Couverture refs par section (via tags db_meta) | Sections + jenni_sources | Modéré |\n\nPour chaque fiche intégrée, l'audit ajoute un **mini-pipeline « phase 4bis »** (BQ `wf_fiche_integration` #147) :\n- Cards à renforcer (K2 ciblé)\n- Fiches en cours impactées (alerte JMJ)\n- Prompts docs cibles (F3)\n\n### Anti-timeout — règles opérationnelles\n\nCf. BQ `wf_analyse` #140 §recette anti-timeout. Spécifique au corpus :\n\n1. **Index sections condensé** : pour les passes K1/K2 qui croisent cards × sections, passer un index `{section_key, doc_code, titre, contexte_sci, enrichissement, mots-clés extraits}` (~50 k chars) au lieu des sections complètes.\n2. **Cards condensées** : pour les passes qui croisent fiches × cards, passer un index `{id, dimension_id, status, title, description (300 chars max), notes (last 500 chars)}` (~30 k chars pour 56 cards).\n3. **Split par strate ou par dimension** pour S1/K2 : éclater par strate F/S/V/P/H ou par dimension de cards.\n4. **Écriture progressive obligatoire** : `Write tmp/audit_corpus/responses/<cid>.json après chaque sous-batch traité`.\n5. **Limite dure** : 80 k chars utiles par agent → au-delà, split obligatoire.\n\n### Scripts dédiés\n\n| Script | Rôle | Pattern |\n|---|---|---|\n| `tools/admin/audit_fiches.py` | Audit fiches `integre*` (axes F1-F2) | Direct |\n| `tools/admin/audit_anglicismes.py` | Axe F4 (anglicismes graines + contenu) | Direct |\n| `tools/admin/check_integrity.py` | Sanity check FK chaînes/cards | Direct |\n| `tools/admin/check_forbidden_jenni.py` | Méta-vocab dans contenus destinés à Jenni | Direct |\n| `tools/admin/analyse_fiches.py` | Extraction consciente par fiche (formules, chiffres, cards, candidats) | `agent_runner` |\n| `tools/batch/analyse_corpus.py --type sections|chaines|cascade|biblio` | Passes S1/S2/C1/C2/K1/K2/B1 | `agent_runner` parallèle |\n\n### Cadence et déclencheurs\n\n- **Cadence régulière** : audit complet toutes les **3-5 sessions**, ou systématiquement avant un consolidé éditorial majeur (publication, revue de corpus).\n- **Déclencheurs immédiats** :\n  - Après une intégration de fiche → mini-audit phase 4bis (cf. BQ #147)\n  - Après création/refonte d'une chaîne → passes C1 + C2 + K2\n  - Après une revue JMJ qui touche aux paradigmes → relecture des cards de la dimension concernée + axe K4\n  - Avant un envoi Jenni d'une fiche dont le sujet a déjà des cards `archive` → axe K4 obligatoire (sinon risque d'envoyer un sujet déjà rejeté)\n\n### Sortie consolidée\n\nRapport unique `jmj/rapports/audit/audit_corpus_<date>.md` avec une section par axe + section synthétique « actions priorisées ». Format aligné sur `audit_thesaurus_<date>.md`.\n\n```\n# Audit corpus — <date>\n## C1. Chaînes — étapes nourries (N chaînes complètes / N total)\n## C2. Chaînes — étapes à enrichir (top 10 par priorité)\n## C3. Chaînes — nouvelles chaînes implicites (N propositions)\n## K1. Cards — santé de la collection (par dimension)\n## K2. Cards — renforcements omis post-fiche (N alertes)\n## K3. Cards — contradictions actives (N à arbitrer)\n## K4. Cards — alertes éditoriales (fiches vs archives)\n## F1. Fiches — intégrité contenu (N en dette technique)\n## F2. Fiches — articulation manquante (N propositions)\n## F3. Fiches — propagation prompts docs cibles (N omises)\n## F4. Fiches — anglicismes résiduels (N occurrences)\n## Synthèse — actions priorisées (top 10)\n```\n\n### Règles d'arbitrage\n\n1. **Cards comme dernière instance** (BQ #106) : si l'audit produit une alerte éditoriale (axe K4), Claude propose une note d'arbitrage mais **ne modifie ni la fiche ni la card** sans validation JMJ explicite. Une affirmation bancale n'est pas corrigée à l'aveugle.\n2. **Pas de fusion automatique de chaînes** — toute fusion ou suppression d'une chaîne passe par JMJ. Les axes C2/C3 produisent des **propositions**, pas des actions.\n3. **Pas de tissage automatique de `concept_card_links.contradicts`** (BQ #112) — analyse sémantique humaine requise. Les contradictions détectées par l'audit sont signalées comme alertes K3 avec justification, JMJ tisse explicitement.\n4. **Audit log systématique** : chaque modification (UPDATE notes card, INSERT link, UPDATE chaîne) trace dans `audit_log`.\n5. **Phase 4bis obligatoire post-intégration** (BQ #147) : un audit corpus ne remplace pas la phase 4bis qui doit être faite à chaque intégration de fiche, et qui produit elle-même un audit croisé fiche.\n\n### Anti-patterns confirmés\n\n- **Pas d'agent Task pour rédiger les rôles de chaînes ou les notes de cards** (BQ #136). L'agent extrait, classe, propose ; Claude+JMJ rédige.\n- **Pas d'heuristique texte pour les contradictions de cards** (BQ #112) — uniquement liens explicites `contradicts`.\n- **Pas d'audit en bloc des 50 fiches dans un seul agent** — split par lot ou par strate (BQ #140 §recette anti-timeout).\n- **Pas de batch INSERT de cards depuis le retour Jenni** — les cards sont créées par Claude/JMJ après filtre conscient, jamais par Jenni.\n- **Pas d'oubli de la phase 4bis** d'une intégration récente — un audit corpus régulier détecte les omissions (axe K2, F3).\n\n### Voir aussi\n\n- BQ `audit_thesaurus` (#155) — pendant côté thésaurus\n- BQ `audit_integrite_db` (#74) — sanity check DB technique\n- BQ `concept_cards_filtre` (#106) — cards filtre + outil d'audit (rôle 5)\n- BQ `cards_contradictions` (#112) — règle contradictions explicites uniquement\n- BQ `chaines_doctrine` (#144) — concept, structure, workflow chaînes\n- BQ `wf_analyse` (#140) — pattern agent_runner unifié\n- BQ `strategie_agents` (#132) — anti-timeout, écriture progressive\n- BQ `wf_fiche_integration` (#147) — phase 4bis post-intégration fiche\n- BQ `pedago_links` (#151) — passerelles pédagogiques entité ↔ card\n- BQ `pas_agent_redacteur` (#136) — règle absolue rédaction\n", "type": "workflow", "crit": false}, {"id": "agent_runner_garde_fous", "titre": "Agent runner — garde-fous pré-vol, en vol, post-vol", "contenu": "## Agent runner — garde-fous pré-vol, en vol, post-vol\n\nTout script suivant le pattern `agent_runner` (`--prepare` → batches JSON →\nagents Task → `--consolidate`) doit valider **13 checks** répartis sur 3\nphases. Les omissions répétées (session 2026-04 à 05) ont coûté ~250 k\ntokens en rate-limit, 7 agents lancés sur fiches hors-périmètre, et une\ncorruption de rédigé partagée par 10 fiches.\n\n**Source** : `jmj/rapports/audit/audit_gestion_agents_plan_2026-05-28.md`.\n\n### Pré-vol (avant `--prepare` ou avant tout lancement)\n\n**Idéalement matérialisés dans `tools/lib/agent_guards.py` appelé en début\nde `cmd_prepare` de chaque audit.**\n\n1. **WORK_DIR persistant** : assert WORK_DIR ∈ `audit_runs/<script>/`\n   (jamais `tmp/`). Refus + message si `tmp/` détecté. `tmp/` est purgé\n   entre sessions par `session_start.py` ; un run de plusieurs heures y\n   est volatilisé.\n\n2. **Filtre origine actif** : si la cible est un audit (extraction sur\n   fiches), assert que la requête `cmd_prepare` contient\n   `origine='jenni'`, ou commentaire explicite « volontairement Claude\n   inclus ». Les fiches Claude (#41, #95-104, futures DIY) ne doivent\n   jamais être traitées par les agents d'audit (cf. BQ\n   `pratiques_typees_hors_jenni`).\n\n3. **Reprenabilité activée** : assert que la requête skippe les items\n   déjà couverts (`NOT EXISTS analyse_claude` ou équivalent par script).\n   Une reprise non filtrée ré-extrait tout et écrase des résultats valides.\n\n4. **Modèle de format non vide** : si le prompt référence une entité\n   « modèle » (ex. fiche #24 pour `analyse_claude`), assert qu'elle existe\n   et a du contenu. Un modèle vide → JSON malformé en cascade.\n\n5. **Intégrité données source** :\n   - Pour les fiches : md5 distinct de `fiche_retour_sections.contenu`.\n     Alerte si N fiches partagent un md5 (indicateur de corruption type\n     #95-104).\n   - Ordres uniques par `(fiche_id, ordre)`. Alerte si doublon (indicateur\n     de versions multiples non consolidées type #83/#84).\n\n6. **Plafond concurrence** : assert que les batches sont chunkés en lots\n   ≤ N (config `agent_runner.max_concurrent`, défaut 5). Au-delà, le\n   rate-limit Anthropic frappe.\n\n### En vol (pendant le run)\n\n7. **Status board minimal** : un fichier `state.json` mis à jour à chaque\n   écriture de réponse, ou un script `audit_agent_run.py --status` qui\n   agrège l'état en temps réel (cids attendus / en attente / en cours /\n   réussis / échoués). Sans cette visibilité, le diagnostic d'un échec\n   partiel demande du forensic.\n\n8. **Détection précoce des échecs rate-limit** : si une réponse contient\n   « session limit » ou est anormalement courte (< seuil tokens/sections),\n   la marquer `failed` et la mettre en file de relance plutôt que de la\n   traiter comme réussie. Un agent rate-limité écrit souvent une réponse\n   tronquée parseable mais vide de fond.\n\n9. **Plafond dur** : compteur de pids/agents lancés sur la fenêtre\n   courante ; refus si > plafond. Garde-fou même si l'orchestration\n   amont dérape.\n\n### Post-vol (après `--consolidate`)\n\n10. **Validation par cid** : pour chaque cid attendu, vérifier réponse\n    présente + JSON parsable + structure conforme (clés ordre, 5\n    catégories, listes). Tout cid absent ou non conforme bloque le\n    consolidate avec rapport.\n\n11. **Auto-validation refs** : cards `status='active'`, fiches\n    `integree`, termes vérifiés absents — déjà fait par\n    les agents (à conserver et codifier dans les prompts via\n    `AGENT_INSTRUCTIONS.md`). C'est ce qui a évité les contaminations DB\n    malgré F8 (confusion id) et F6 (corruption rédigé) en 2026-04-05.\n\n12. **Invalidation idempotente** : si le filtre amont change (ex. ajout\n    `origine='jenni'`), un `--clean-orphans` supprime les réponses\n    désormais hors-périmètre (cleanup auto). Sans ça, le consolidate\n    propage les vieilles réponses non couvertes par le nouveau périmètre.\n\n13. **Métadonnées du run** : `state.json` finalisé avec timings, tokens\n    estimés (depuis `usage` si dispo), taux de réussite, items\n    rate-limited. Permet le bilan rétroactif et le tuning des plafonds.\n\n### Pattern doctrinal salvateur (à conserver)\n\nLa **validation rigoureuse intégrée aux prompts** (cards actives, fiches\nintégrées, termes vérifiés absents) a évité des contaminations en DB\nmalgré les frictions observées. À codifier dans\n`AGENT_INSTRUCTIONS.md` partagé entre tous les scripts d'audit.\n\n### Articulation\n\n- **`strategie_agents`** (#132) — quand utiliser `agent_runner` vs\n  agents Task directs vs lecture inline. Ce module définit le **comment\n  les sécuriser**.\n- **`pratiques_typees_hors_jenni`** — règle origine='jenni' pour les\n  agents d'audit (check 2 ci-dessus).\n- **CLAUDE.md règle absolue #4** — workflow 3 phases obligatoire\n  (`--prepare` → Task → `--consolidate`), pas d'API externe.\n", "type": "doctrine", "crit": false}]}, "archivage": {"nom": "Archivage post-intégration", "entries": [{"id": 125, "titre": "Structure `recherches/` — rangement canonique", "contenu": "## Structure des dossiers de travail `recherches/`\n\n**Source unique** pour tout ce qui est \"document de travail en cours ou\nhistorique\" lié au corpus. Publications/recherches n'existe plus (éliminé\nle 2026-04-14 pour cause de doublon).\n\n### Biblio PDF JMJ : `jmj/pdf/`\n\nBiblio PDF personnelle de JMJ (poussée sur le repo). Contient les publications académiques, rapports et ressources de référence en PDF que JMJ a rassemblés. Exemples : Shift Project PREF, Kirkby et al. 2016, rapports Triple Performance (Arvalis), guides techniques (Maraîchage Sol Vivant, bilan humique AMG), etc.\n\nUtilisation par Claude : **lecture directe via l'outil Read** (fonction PDF native, avec `pages` pour PDF > 10 pages). Extraire les valeurs chiffrées, paramètres, tableaux pour enrichir `ref_*` tables + `jenni_sources`. Ne jamais copier-coller le contenu dans des fichiers — extraction ciblée et ancrage en DB (comme pour `refs (kind=esclave_energ)` depuis `jmj/pdf/PREF_Shift-Project_Transition-robuste_14-avril-2026.pdf`).\n\n### Arborescence canonique\n\n```\njmj/\n├── pdf/                 # Biblio PDF JMJ (publications académiques, rapports, guides)\n├── archives/            # Documents de travail JMJ (docx, notes, drafts)\n├── session/             # Snapshots DB inter-sessions\n├── analyses/            # Rapports d'audit générés\n└── journaux/            # Journaux de session\n\nrecherches/\n├── fiches/              # Prompts docx fiches en cours (graine redigee / envoyee)\n├── thesaurus/           # Enrichissement thesaurus (Jenni) :\n│                         #   - thesaurus___strate_*.docx (retours Jenni avec nouveaux termes)\n│                         #   - thesaurus_incomplets_strate_*.docx (listes à compléter)\n│                         #   - enrich_thesaurus_<axe>_<strate>_YYYY-MM-DD.docx (lots export par gen enrich_thesaurus.py)\n└── archives/\n    ├── fiches/          # Fiches traitées (statut integree ou archive)\n    ├── thesaurus/       # Thesaurus traités (à venir)\n    └── prompts_validation/  # Anciens prompts validation archivés\n```\n\n### Règle de rangement\n\n| Ce qu'on produit | Où le ranger |\n|---|---|\n| Prompt docx d'une fiche technique/transversale | `recherches/fiches/` |\n| Retour Jenni thesaurus strate X | `recherches/thesaurus/thesaurus___strate_X.docx` |\n| Docx d'une strate à compléter | `recherches/thesaurus/thesaurus_incomplets_strate_X_<date>.docx` |\n| Audit / sources orphelines / termes candidats / rapport de session | `jmj/rapports/audit/` |\n| Une fois traité (fiche intégrée, thesaurus digéré) | `recherches/archives/<catégorie>/` |\n\n### Scripts conformes\n\n- `gen_fiche_docx.py` / `export_fiche.py` → `recherches/fiches/`\n- `gen_prompt_thesaurus.py` / `export_thesaurus_incomplets.py` → `recherches/thesaurus/`\n- `export_validation.py` / `export_mismatches_inrae.py` / `export_termes_candidats.py` / `audit_sources_orphelines.py` → `jmj/rapports/audit/`\n- `gen_prompt_completion.py` / `gen_prompt_enrichissement.py` → **dépréciés** (workflow `completion/` abandonné, cf. note ci-dessous)\n\n### Anti-pattern à éviter\n\n- ❌ Créer un `Publications/recherches/` bis (doublonnage historique)\n- ❌ Mettre des audits ou rapports dans `recherches/thesaurus/` (fourre-tout)\n- ❌ Scripts avec chemins hardcodés dans `Publications/` pour du travail\n  intermédiaire (`Publications/` = outputs publiables uniquement)\n\n\n### Note 2026-04-14 — `completion/` déprécié\n\nLe dossier `recherches/completion/` a été supprimé : les termes incomplets\ndu thésaurus repassent désormais dans le workflow initial (docx d'import).\nWorkflow unique :\n- Listes d'incomplets générées en docx dans `recherches/thesaurus/thesaurus_incomplets_strate_X_<date>.docx`\n- Retours Jenni dans `recherches/thesaurus/thesaurus___strate_X.docx`\n- Réimport via `import_termes_jenni.py --replace`\n\nLes anciens `complete_*.txt` sont archivés dans\n`recherches/archives/completion/`. Le script `gen_prompt_completion.py`\nest marqué déprécié.\n\n\n---\n\n### Rapports et audits : voir BQ #134\n\nLes **rapports de session** et **rapports d'audit** ne sont PAS dans\n`recherches/` mais dans `jmj/rapports/` (session / audit) — voir BQ\n#134 pour la structure complete et les paths config. Le dossier\n`recherches/audits/` a ete supprime en avril 2026 (migration vers\n`jmj/rapports/audit/`).\n\n---\n\n### Préfixe de priorité sur les fichiers docx fiches (2026-04-23)\n\n**Convention** : les docx de `recherches/fiches/` portent un préfixe\nnumérique à 2 chiffres qui reflète leur **priorité de lecture/traitement**\n(ordre dans lequel Jenni ou le lecteur doit les prendre). Pattern :\n\n```\nNN_fiche_<slug>_<YYYY-MM-DD>.docx\n```\n\nExemples :\n```\n01_fiche_cascade-temporelle-t0-t5_2026-04-22.docx\n06_fiche_drilosphere-maom-bioreacteur-carbone_2026-04-22.docx\n07_fiche_carences-minerales-silencieuses_2026-04-22.docx\n07_fiche_lombriciens-ecologie-pilotage_2026-04-23.docx  ← même niveau 07 accepté\n```\n\n### Règle : niveau d'index partagé autorisé\n\n**Quand une nouvelle fiche est aussi prioritaire qu'une fiche existante, elle\npeut porter le même préfixe.** Plusieurs fiches au même niveau d'index\ncoexistent sans conflit — le système de fichiers les classe simplement\ndans l'ordre alphabétique du slug, ce qui est acceptable (deux fiches\nco-prioritaires sont lues l'une après l'autre, l'ordre entre elles\nn'a pas d'importance éditoriale).\n\nConséquences :\n- **Pas de décalage forcé** de toutes les fiches suivantes quand une\n  fiche prioritaire s'insère (évite les renommages en cascade).\n- **Pas de numéro isolé** (ex. `19_`) pour une fiche qui est en réalité\n  co-prioritaire avec un niveau antérieur — le `19_` suggère « après\n  les 18 précédentes » alors que la fiche est prioritaire.\n- Le préfixe reste un **indicateur de priorité**, pas un identifiant\n  unique. L'identifiant unique d'une fiche c'est son `slug` (+ `id` DB).\n\n### Anti-pattern à éviter\n\n- ❌ Créer un préfixe tout neuf (ex. `19_`) juste pour éviter un doublon\n  de préfixe, si la fiche mérite éditorialement le niveau 07.\n- ❌ Renuméroter toutes les fiches suivantes (`07` → `08`, `08` → `09`…)\n  pour insérer une nouvelle fiche en `07` — les docx archivés garderaient\n  leurs anciens noms, les historiques git ne matchent plus.\n- ❌ Considérer le préfixe comme un identifiant : deux fiches `07_` ≠\n  collision — elles partagent un *niveau de priorité*, pas une identité.\n", "type": "reference", "crit": false}]}, "bq": {"nom": "BQ elle-même", "entries": [{"id": 136, "titre": "Pas d'agents rédacteurs — la rédaction c'est JMJ + Claude + Jenni, jamais un sous-agent", "contenu": "## Règle absolue — pas d'agents rédacteurs\n\n**La rédaction de contenu éditorial du corpus est STRICTEMENT limitée à :**\n- **Jenni** (via le workflow docx : prompt → Jenni rédige → retour docx → import contrôlé)\n- **JMJ** (directement, ou en demandant à Claude de rédiger spécifiquement)\n- **Claude** (moi) SEULEMENT quand JMJ me le demande explicitement en direct\n\n**Sont interdits** :\n- Lancer un agent Task (`Agent` tool) pour rédiger **définitions**, **synonymes**, **contenus de fiches**, **contenus de prompts**, **descriptions de concept_cards**, **contenus BQ** ou tout autre contenu éditorial du corpus\n- Demander à un agent de \"produire des définitions courtes\", \"rédiger une synthèse\", \"écrire une amorce\", \"compléter une description\"\n- Inventer des définitions ou contenus sans base docx/prompt Jenni ou indication explicite de JMJ\n\n**Sont autorisés pour les agents Task** :\n- Classification, extraction, analyse (ex: normaliser la casse, détecter des orphelins, trier des termes)\n- Recherche dans le code ou la DB\n- Parsing/formatage de données existantes\n- Audit/comparaison\n\n**Workflow correct pour créer un nouveau terme** :\n1. Identifier le besoin (ex: hyperonyme manquant)\n2. Écrire le nom du terme dans une liste à faire passer par Jenni\n3. Exporter via `export_thesaurus_incomplets.py` ou `gen_prompt_thesaurus.py`\n4. Jenni rédige la définition\n5. Réimport via `import_termes_jenni.py --replace`\n\n**Justification** : JMJ passe des heures à faire rédiger Jenni avec soin. Toute définition Claude-made sabote ce travail et pollue le thésaurus avec du contenu non validé. Violation détectée 2026-04-20 (14 termes créés avec def Claude en commit af35413 — supprimés et à refaire via Jenni).\n\n**Exception limitée** : les définitions que JMJ demande à Claude de rédiger EN DIRECT (dans la conversation) sont OK car c'est explicite et JMJ valide immédiatement.\n\n## Extension — pas de batch automatisé pour la rédaction (constat 2026-04-25)\n\nAu-delà de l'interdiction des agents Task pour la rédaction (règle ci-dessus), un **constat opérationnel récurrent** s'impose :\n\n**Le batch automatisé pour la rédaction éditoriale (refonte de fiches, extraction-condensation de contenu, génération de graines en lot) ne donne pas la qualité requise.**\n\n### Pourquoi le batch échoue (cas observés)\n\n- **Vague 3 batch automatisé Option A 2026-04-25** : tentative de traiter 23 fiches `integre_extrait` via un parser markdown + condense automatique. Résultat sur les 3 fiches passées avant blocage (#4, #10, #12) : titres tronqués (« Efficacité mesurée : La source indique que l'alignem… »), phrases entières comme titres, numérotation cassée (`s1=2.`, `s4=4.3.1.`), sections manquantes (4-5 au lieu de 8). Process bloqué sur #13 (regex/contenu trop long). Rollback nécessaire.\n- **Sessions antérieures** : pattern récurrent de batch qui « marche techniquement » mais produit des contenus à corriger massivement après coup, annulant le bénéfice de l'automatisation.\n\n### Causes structurelles\n\n1. **Hétérogénéité du contenu source** : les fiches existantes utilisent des structures hybrides (## mélangé avec ####, numérotations variables, citations APA dans titres) qui défient le parsing automatique propre.\n2. **Pas de jugement éditorial** : un script ne peut pas distinguer un titre court d'une phrase descriptive, ni hiérarchiser quelles sources préserver dans une condensation.\n3. **Méta-vocab résiduel** : les contenus existants citent souvent « cf. fiche #N » ou « card #N » qu'il faut systématiquement nettoyer — un batch les laisse passer.\n4. **Articulations transverses** : la rédaction d'un brief éditorial structuré (besoin corpus, paradigmes, articulation, doctrine) requiert une compréhension contextuelle que seul Claude possède en lecture directe.\n\n### Règle opérationnelle\n\nPour toute opération de **refonte/requalification de fiches** (Option A typiquement), procéder **fiche par fiche manuellement** :\n\n1. Lecture intro + conclusion du contenu existant\n2. Identification consciente des sources clés et de la structure (8 sections cible : intro + 6 body + résumé)\n3. Rédaction du brief éditorial structuré (besoin corpus / sources autoritaires / données chiffrées / paradigmes / articulation / doctrine)\n4. Rédaction de 6-8 graines ~1000-1200 chars chacune (cible BQ #130 ; le « ~600 » historique était périmé, cf. note 2026-06-10). **Pas de citations APA inline forcées dans la graine** — la graine est un état conceptuel pur (angle + 2-3 mécanismes + termes canoniques + périmètre). C'est Jenni qui apporte les références sourcées au cycle de co-rédaction. Si une référence est mentionnée dans la graine, elle doit être effectivement rattachée au texte qu'elle supporte (pas de bibliographie générique pré-posée).\n5. Audit méta-vocab regex post-génération + nettoyage\n6. Régénération du docx via `gen_fiche_docx.py`\n\n**Volume estimé** : 30-60 min par fiche selon volume contenu source. Pour 20+ fiches, prévoir plusieurs sessions étalées.\n\n### Modèles de référence\n\nLe modèle canonique est la fiche #37 `agroforesterie-temperee-fonctions-sol` (cf. BQ #130) : graines ~1000-1200 chars/section, angle conceptuel pur, termes canoniques intégrés, sans citations APA inline, sans bloc Références pré-posé.\n\n**Note 2026-04-30** : la doctrine antérieure (graines ~1k chars avec 11-19 cit. APA inline, biblio pré-posée — fiches #11, #24, #35, #26, #33 traitées 2026-04-25) est **dépréciée**. Constat JMJ : la \"graine c'est tout\", inutile de poser des refs qui ne sont pas effectivement rattachées au texte. Jenni est la source bibliographique au retour. Les fiches v3 doivent s'aligner sur le modèle #37, pas sur celles de la vague 2026-04-25.\n\n### Anti-pattern « ça marchera mieux la prochaine fois »\n\nLe batch automatisé pour la rédaction est tenté de manière récurrente avec l'espoir d'un gain de productivité. **À chaque tentative, le résultat est insatisfaisant** — soit qualité dégradée nécessitant correction manuelle (qui annule le gain), soit échec technique pur. Cette BQ explicite l'observation : **ne plus retenter**. Réserver le batch automatisé aux opérations de transformation déterministes (parsing structuré, dédup, normalisation FK, audit régex) — pas à la rédaction éditoriale.\n", "type": "regle_absolue", "crit": true}, {"id": 57, "titre": "Architecture DB — tables, vues, colonnes clés", "contenu": "**Comptages à jour** (générés dynamiquement par `session_start.py`) :\n```sql\nSELECT\n  (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name != 'sqlite_sequence') as tables,\n  (SELECT COUNT(*) FROM sqlite_master WHERE type='view') as vues;\n```\n\nNe pas mettre de chiffres en dur ici — utiliser la requête ci-dessus ou `session_start.py`.\n\n**Noyau documentaire** : documents, prompts, prompt_contenus, doc_contenus, jenni_doc_specs, jenni_doc_versions, jenni_sources\n**Thésaurus** : terms, term_relations\n**Chaînes** : chains_causales, chain_etapes, card_chain_links\n**Cascade / cartes** : cascade_prerequis, cascade_level_links, concept_cards, concept_card_links, concept_card_tests, concept_dimensions, terrain_tests, diagnostic_rules, diagnostic_rule_terms\n**Config** : config, db_meta, audit_log\n**Fiches / graines** : fiches, graines, fiche_sections, fiche_retour_sections, fiche_contenus, fiche_articulations, source_usages (+ fiche_section_h2_notes dépréciée)\n**Validations** : validations, validation_sections, validation_contenus\n\n### (fusionné depuis #58 : Tables actives vs legacy)\n\n**Tables actives (utilisées quotidiennement) :**\ndocuments, prompts, terms, term_relations, jenni_doc_specs, jenni_doc_versions, chains_causales, chain_etapes, db_meta, audit_log, config, fiches, graines, fiche_sections, fiche_retour_sections, fiche_contenus, source_usages, concept_cards, validations\n\n**Tables de référence (calculateurs, données scientifiques) :**\nrefs (unifiee 2026-04, kind=matiere|texture|esclave_energ|shift_chantier|cn_regle) + ref_cn_incorporation, ref_kirkby, ref_analyses, ref_links (structures specifiques)\n\n**Tables web (templates, pages) :**\nhtml_templates, web_pages\n\n**Tables cascade & diagnostic :**\ncascade_prerequis, cascade_level_links, concept_cards, concept_card_links, concept_card_tests, terrain_tests, diagnostic_rules, diagnostic_rule_terms\n\n**Tables legacy (présentes) :**\nprompt_contenus (remplacé par prompts.enrichissement, encore présent), fiche_section_h2_notes (dépréciée → fiche_sections.type='body_h2')\n\n**Tables DROPPÉES (ne plus référencer)** : doc_cross_refs (2026-05-06), term_connections, jenni_section_specs, requetes_utiles (→ catalogue SQL filesystem `tools/sql/`), ref_melanges_predefinies, scripts (→ `scripts_inventory.py`), bq_entries/domaines_techniques/domaine_bq (→ `tools/bq/*.md`), maintenance_sessions/audit_reports (→ filesystem `jmj/rapports/`), sources.\n\nCompter les tables :\n```sql\nSELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name != 'sqlite_sequence';\n```\n\n### (fusionné depuis #82 : Colonnes clés par table — aide-mémoire)\n\nColonnes les plus utilisées (évite les PRAGMA table_info à répétition) :\n\n**terms** : id, section_key, strate, fr, en, definition, syn_fr, syn_en, inrae, doc_code, statut, type, flag_pseudoscience\n**prompts** : id, doc_code, type (intro/section/conclusion), chapitre, section, titre_h1, titre_h2, contexte_sci, instructions, enrichissement, style, tableau, ordre\n**documents** : code, titre, strate, mots_cible_min, mots_cible_max, statut, doc_maitre, note\n**config** : categorie, cle, val
