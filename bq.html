udit_corpus_relations.py` créé. Premier run :\n- **108 lacunes** détectées (3 termes multi-docs sans card, 28 chaînes sans\n  fiche zoom, 77 cards sans pedago_link)\n- **83 émergences** (62 sources convergentes ≥3 fiches, 21 chaînes haute\n  connectivité ≥3 strates)\n- **92 fiches à créer** (59 cards transverses sans zoom, 13 termes\n  transverses sans fiche, 20 sources haut impact)\n\nPremier rapport : `jmj/rapports/audit/lacunes_emergences_2026-05-06.md`.\nRégénération à la demande, sans agent_runner pour le V1 (analyse\nstatistique pure sur la DB).\n\n## Historique\n\n- **2026-03-20** : audit Opus initial génère doc_cross_refs (118) + term_connections (81)\n- **2026-04 → 2026-05** : corpus enrichi (Sessions B/C/D/E/F + intégrations fiches v4 +\n  thésaurus +193 termes + sources +659). Les 199 lignes deviennent obsolètes.\n- **2026-05-06 (Session F+1)** : drop tables, snapshot, doctrine cette BQ.\n- **2026-05-06 (Session H)** : `audit_corpus_relations.py` créé, premier rapport\n  généré (283 entrées : lacunes/émergences/fiches à créer).\n", "type": "doctrine", "crit": false}]}, "jenni-workflow": {"nom": "Workflow Jenni", "entries": [{"id": 137, "titre": "Parser docx Jenni — extraction des formules chimiques OMML obligatoire", "contenu": "## Parseur docx : inclure les formules Office Math ML (OMML)\n\nLes docx produits par Jenni contiennent **TOUTES les formules chimiques, mathématiques, indices et exposants** sous forme d'équations Office Math ML (`<m:oMath>` dans le XML Word). Ex : `NH₃`, `CO₂`, `Fe²⁺`, `NO₃⁻`, `k₁`, `k₂`, `ΔG`, `qCO₂`, `N₂`, `O₂`.\n\n**PIÈGE** : `python-docx` ne lit que `paragraph.text` qui IGNORE les `<m:oMath>`. Un parseur naïf récupère `(...)` vide à la place des formules. Résultat : 24 parenthèses vides dans les 215 termes du 2026-04-20 (`ammoniac ()`, `fer ferreux ()`, `CO₂ ()` → formules manquantes).\n\n**SOLUTION** — parseur XML custom qui :\n1. Parse `word/document.xml` via `xml.etree.ElementTree`\n2. Pour chaque `<w:p>`, parcourt les éléments :\n   - `<w:t>` → texte normal (en skippant ceux à l'intérieur d'un `<m:oMath>`)\n   - `<w:br>` → `\\n`\n   - `<m:oMath>` → conversion récursive en Unicode (sub/sup)\n3. Détecte et supprime les fallbacks texte que Jenni produit parfois après un oMath (ex: `NH₃NH3` → `NH₃`)\n\n**Mapping OMML → Unicode** :\n- `<m:sSub>` : base + chiffres en indices (`₀₁₂₃₄₅₆₇₈₉`)\n- `<m:sSup>` : base + chiffres en exposants (`⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻`)\n- `<m:sSubSup>` : base + indice + exposant (ex: `Fe²⁺` = Fe sub vide sup 2+)\n- `<m:f>` : fraction `num/den`\n\n**Implémenté dans** : `tools/jenni/import_termes_jenni.py::parse_docx()` (à partir du 2026-04-20).\n\n**Vérification** : après un import Jenni, chercher les `\\(\\s*\\)` dans `definition`, `syn_fr`, `syn_en`. Si > 0 occurrences, le parser est défaillant ou Jenni a produit des parenthèses vides réelles (rare).\n\n```python\nimport re\nfor r in cur.execute(\"SELECT id, fr FROM terms\"):\n    for f in ['definition','syn_fr','syn_en']:\n        content = cur.execute(f\"SELECT {f} FROM terms WHERE id=?\", (r[0],)).fetchone()[0] or ''\n        if re.search(r'\\(\\s*\\)', content):\n            print(f\"⚠ #{r[0]} {r[1]} [{f}]\")\n```\n\n**Autres sources à patcher** si formules aussi nécessaires :\n- `enrich_thesaurus.py::*` : pas encore de parser math-aware (à vérifier)\n- `integrate_fiche.py` / `integrate_fiche_refs.py` : utilisent déjà `parse_jenni_docx` (math-aware OMML) ✓\n\n**Historique** : violation détectée 2026-04-20 (24 parenthèses vides dans 20 termes après import des docx thesaurus_1/2_20260420.docx). Corrigé en reparse avec OMML puis restauration 45 def + 1 rt. Parser officiel mis à jour.\n", "type": "technique", "crit": true}, {"id": 120, "titre": "Discipline BQ-clean — prompts jamais en contact avec méta-vocab", "contenu": "## Règle absolue BQ-clean — aucune fuite de méta-vocab dans les prompts Jenni\n\n**Liste noire** (vérifier AVANT génération de tout prompt Jenni) :\n\n- Codes doc : S0-S4, V1-V3, P1-P5, F1-F2, H1-H3\n- Vocab méta-projet : `corpus`, `strate`, `cross-ref`, `chaîne causale`,\n  `concept card`, `thésaurus`, `sol_vivant.db`, `section_key`, `doc_code`\n\n**Sources des leaks** (déjà rencontrés) :\n\n1. **terms.definition** : certains termes ont des définitions qui citent\n   des doc_codes (ex: \"Voir S2 — PGPR\") — violation directe.\n   → Audit et reformulation.\n\n2. **terms.fr / en** : concepts méta tels que\n   \"Chaîne 1 — Photosynthèse → Immunité intestinale\"\n   appartiennent à `chains_causales` (table dédiée), PAS à `terms`.\n   → Supprimer du `terms` si présents.\n\n3. **prompts.titre_h2 / contexte_sci / instructions / enrichissement** :\n   fuites manuelles fréquentes (cross-ref, chaîne causale).\n   → Scan régulier toutes colonnes texte.\n\n**Vérification systématique** :\n\n```python\nFORBIDDEN = [r'\\bchaîne causale\\b', r'\\bcross-ref\\b', r'\\bconcept card\\b',\n             r'\\bsol_vivant\\b', r'Corpus Le Sol Vivant', r'\\bdu corpus\\b',\n             r'\\bdans le corpus\\b', r'\\bthésaurus\\b', r'\\bthesaurus\\b',\n             r'\\bS[0-4]\\b', r'\\bV[1-3]\\b', r'\\bP[1-5]\\b',\n             r'\\bF[12]\\b', r'\\bH[1-3]\\b']\nfor pat in FORBIDDEN:\n    matches = re.findall(pat, text, re.IGNORECASE)\n    assert not matches, f\"Leak {pat}: {matches}\"\n```\n\n**À lancer à chaque régénération** des prompts_jenni_*.txt et\nprompt_fiche_*.docx.\n", "type": "regle", "crit": true}, {"id": 101, "titre": "Charte Jenni — règles opérationnelles (enrichissement thésaurus)", "contenu": "## Charte Jenni — règles opérationnelles (enrichissement thésaurus)\n\nSource : `docx/charte_de_recommandations_pour_un_travail_efficace.docx` — document produit par Jenni elle-même pour décrire son fonctionnement et ses attentes de prompt.\n\n**Portée** : s'applique principalement au workflow d'**enrichissement terminologique du thésaurus** mais les principes (bloc borné, balise de repère, structure immuable, validation de format) sont transposables à tous les prompts manuels envoyés à Jenni.\n\n---\n\n### 1. Règle du « Bloc de 10 »\n\nJenni travaille **par blocs de 10 termes maximum** par demande. Au-delà, la qualité des recherches documentaires diminue et le risque de mélange de sources augmente.\n\n**Implication technique** :\n- `gen_prompt_enrichissement.py` → `--max 10` par défaut\n- Plus de termes → plusieurs fichiers `enrich_*_lot{i}.txt`\n- Un fichier = une demande copiée dans Jenni\n\n### 2. La « Balise de Repère »\n\nJenni peut perdre le fil d'une liste longue sur une session étendue. Chaque nouvelle demande doit contenir **un point d'ancrage explicite** :\n\n> « On s'est arrêté à *Mucor hiemalis*. Reprends à partir de *Rhizopus stolonifer* pour les 10 prochains. »\n\n**Implication** : en mode multi-lots, inclure dans chaque prompt généré une phrase du type :\n`Dernier terme validé au lot précédent : {dernier_terme}. Nouveau bloc (10 termes) : commence à {premier_terme}.`\n\n### 3. La structure immuable des champs\n\nJenni a tendance à dévier du format si on ne le rappelle pas. **Chaque prompt doit lister explicitement les champs attendus**, dans l'ordre :\n\n```\nTERME : [terme français]\nEN : [traduction anglaise]\nDEF : [définition scientifique avec citations [N]]\nSYN_FR : [synonymes français]\nSYN_EN : [synonymes anglais]\nBT : [terme générique / parent]\nRT : [termes associés, max 5, séparés par ;]\n```\n\nCe bloc est déjà injecté par `gen_prompt_enrichissement.py` via la constante `STUB`. Ne pas supprimer, même si cela paraît redondant avec le template `config.jenni.prompt_enrichissement_thesaurus`.\n\n**`SYN_FR : -` / `SYN_EN : -` ne sont PAS des erreurs.** Le tiret (comme\n`aucun`, `none`, `n/a`, ou un champ vide) signifie *« ce terme n'a pas de\nsynonyme »*. C'est une réponse valide et fréquente : beaucoup de termes\ncanoniques (taxons, composés chimiques précis, enzymes nommées) n'ont\nlégitimement aucun synonyme. `import_termes_jenni.parse_bloc_text()`\nconvertit ces valeurs en `None` — donc un import de N termes affiche\nnormalement *moins de N* champs `SYN_FR`/`SYN_EN` remplis, sans que ce soit\nun manque. Ne jamais traiter un `SYN : -` comme un champ à re-solliciter\nauprès de Jenni.\n\n### 4. Validation des sources — format `[N]` uniquement\n\nJenni peut utiliser deux formats de citation :\n- `[1] [2] [3]` — identifiants numériques issus de ses outils de recherche (RIS projet + Open Access + Scholar)\n- `(Dupont et al., 2023)` ou URLs inline — format libre\n\n**Règle** : imposer le format `[N]`. Le template `prompt_enrichissement_thesaurus` contient la consigne `Citations au format numérique [N] uniquement — pas d'URLs ni noms d'auteurs entre parenthèses`.\n\n**Règle de validation côté Claude** : lors du parsing du .docx Jenni retourné, **rejeter toute définition** contenant :\n- Des URLs inline (`http://`, `https://`, `www.`)\n- Des noms d'auteurs entre parenthèses avec année (`(Dupont 2023)`, `(Smith et al., 2021)`)\n\nSi format mixte → renvoyer à Jenni avec rappel explicite.\n\n**Note importante** — distinction avec la règle BQ #39 (« Ne jamais demander à Jenni de sourcer ou citer ») :\n- BQ #39 concerne la **demande de citer** elle-même (redondant : Jenni cite intrinsèquement)\n- Cette règle concerne le **format** de citation (Jenni cite par défaut mais peut mélanger les formats)\n- Ce n'est pas contradictoire : on ne lui demande pas de citer, on lui demande d'utiliser un format précis.\n\n---\n\n### 5. Usage de `fetch_document` — présenter un doc de travail à Jenni\n\nJenni dispose d'un outil interne `fetch_document` qui lit un doc actif dans son espace. Pour les workflows longs (enrichissement multi-lots), on peut lui fournir un document de travail plutôt que coller les termes un à un.\n\n**Bonnes pratiques** :\n- **Ne pas donner le `doc_id` alphanumérique seul** — Jenni ne peut pas \"ouvrir\" un ID comme un fichier.\n- **Nommer le document par son titre exact** — confirme à Jenni qu'elle lit la bonne source.\n- **Structurer le document avec une section dédiée** en fin de document :\n\n```markdown\n### LISTE DES TERMES À TRAITER\n\n- Siderophore\n- Biofertilisant\n- Solubilisation du phosphate\n- Mycorhize à arbuscules\n- Rhizobactérie\n...\n```\n\nJenni repère cette section via `fetch_document`, identifie le dernier terme déjà rempli dans le corps, et lit les termes suivants dans la liste. Zéro invention, zéro dérive.\n\n### 6. Prompt type pour un bloc d'enrichissement\n\n```\nJenni, consulte mon document [Titre exact du document].\nNous reprenons le travail d'enrichissement.\n\nDernier terme traité : [nom du dernier terme validé]\nNouveau bloc : Génère les 10 termes suivants de la liste présente dans le document.\n\nStructure à respecter strictement :\nTERME : [Nom]\nEN : [Traduction]\nDEF : [Définition scientifique avec citations [N]]\nSYN_FR : [Synonymes français]\nSYN_EN : [Synonymes anglais]\nBT : [Terme générique]\nRT : [Termes associés]\n\nUtilise uniquement des sources académiques et cite au format [N].\n```\n\n---\n\n### Synthèse — check-list avant envoi d'un prompt d'enrichissement\n\n- [ ] Bloc de **10 termes maximum** ?\n- [ ] **Dernier terme validé** explicitement mentionné ?\n- [ ] **Structure des 7 champs** rappelée dans le prompt ?\n- [ ] Consigne **format `[N]` uniquement** présente ?\n- [ ] Si usage `fetch_document` : **titre exact** du doc utilisé (pas l'ID) ?\n- [ ] Aucun code interne (S0, V2…) — règle BQ #40 ?\n\n\n## Contexte\n\nenrichissement terminologique\n", "type": "regle", "crit": true}, {"id": 109, "titre": "Comment Jenni comprend les instructions — modele mental (chartes)", "contenu": "## Comment Jenni comprend les instructions — modele mental (source : chartes Jenni)\n\nSource : deux chartes redigees par Jenni elle-meme (docx/charte_de_recommandations_pour_un_travail_efficace.docx et docx/charte_de_travail___fiches_techniques.docx).\n\n### Jenni est une co-redactrice sur document partage, pas un chatbot\n\nJenni ne repond pas a des \"commandes\". Elle **developpe un document existant** :\n- Elle scanne le document de travail via `fetch_document` pour comprendre la structure\n- Elle lit le plan pour savoir ou elle en est\n- Elle lit les graines (affirmations plantees) pour orienter ses recherches academiques\n- Elle travaille **section par section** dans le chat, pas tout d''un bloc\n- Si une section est vide (pas de graine), elle improvise — et risque de diverger\n\n### Le prompt .txt est le plan du document, le chat est le dialogue\n\n**Deux canaux distincts, deux roles distincts :**\n\n| Canal | Role | Contient |\n|---|---|---|\n| **.txt** (prompt) | Plan statique du document | Structure (chapitres, sous-chapitres), graines (affirmations a developper), termes canoniques |\n| **Chat Jenni** | Dialogue vivant | Demande section par section, remarques de Jenni, propositions de recherches, ajustements |\n\nLe .txt ne dialogue pas. Il pose le cadre. Le chat execute section par section.\n\n**Consequence pratique** : ne jamais mettre d''instructions (\"fais ceci\", \"ne fais pas cela\", \"cite en format X\") dans le .txt. Ces consignes passent par le chat.\n\n### Le prompt ideal est un document amorce\n\nLe prompt n''est pas une commande — c''est un **etat initial synthetique du document** pour lequel on demande un enrichissement. La redaction oriente naturellement la reponse :\n- Chaque phrase plantee est une graine que Jenni va developper et sourcer\n- La structure (I, II.1, II.2...) conditionne la structure du retour\n- Les termes scientifiques utilises dans les graines orientent les recherches de Jenni\n- Plus les graines sont precises et scientifiques, plus les recherches de Jenni sont poussees\n\n### Mecanismes internes de Jenni (reveles par les chartes)\n\n1. **Perte de fil en session longue** : Jenni peut perdre le contexte apres ~4-5 sections. Solution : travailler section par section dans le chat, avec balise de repere (\"on s''est arrete a la section V, reprends a VI\").\n\n2. **Divergence si document vide** : si le document ne contient pas de contenu apres le dernier point traite, Jenni improvise (invente des sections, change de sujet). Solution : planter des graines dans toutes les sections, meme minimales.\n\n3. **fetch_document** : Jenni scanne le document de travail pour se reperer. Elle voit la structure, les titres, les termes. D''ou l''importance d''une numerotation claire et de termes canoniques presents dans le corps du texte.\n\n4. **Recherches spontanees** : quand un sujet l''inspire ou qu''elle detecte un angle sous-documente, Jenni propose spontanement des recherches recentes via le chat. Ces propositions sont souvent les plus precieuses.\n\n5. **Format APA par defaut** : configure globalement dans le projet Jenni, pas besoin de le preciser dans les prompts.\n\n### Implications pour la construction des prompts\n\n| Faire | Ne pas faire |\n|---|---|\n| Ecrire le prompt comme si c''etait le debut du document | Ecrire le prompt comme une liste d''instructions |\n| Structurer avec chapitres numerotes (I, II.1...) | Laisser Jenni inventer la structure |\n| Planter des affirmations scientifiques comme graines | Poser des questions generiques |\n| Mettre les termes canoniques dans le corps du texte | Mettre une liste de termes en annexe deconnectee |\n| Travailler section par section dans le chat | Demander tout d''un coup |\n| Utiliser les balises de repere en session longue | Presumer que Jenni se souvient de tout |\n", "type": "reference", "crit": true}, {"id": 122, "titre": "Contraintes de rendu — docx destinés à Jenni (tous types)", "contenu": "## Contraintes de rendu — docx destinés à Jenni\n\n**S'applique à TOUS les .docx générés pour Jenni** : prompts de fiches\n(techniques ou transversales), ébauches de documents de strate, prompts\nde complétion, docx de travail.\n\n### 1. Hiérarchie des titres — Title / H1 / H2 / H3 (H3 max)\n\nJenni ne gère pas les titres au-delà de H3. Hiérarchie effective :\n\n- **Title** (python-docx level 0) : nom du document — un seul, en tête\n- **H1** (level 1) : chapitres = sections principales\n  (Plan, Introduction, sections body, Conclusion, Résumé, Références,\n  Glossaire, Annexes, Termes canoniques)\n- **H2** (level 2) : sous-chapitres\n  (Ex fiche technique : Contexte scientifique, Protocole, Indicateurs,\n  Précautions, Applications. Ex doc strate : 1.1, 1.2, 2.1… sous un H1 chapitre)\n- **H3** (level 3) : sous-sous-chapitres\n  (Ex fiche technique : Ingrédients, Équipement, Procédure sous Protocole)\n\n**Pas de H4** — toute sous-structure au-delà de H3 doit passer en texte gras\ninline, liste à puces ou paragraphe normal.\n\n### 2. Titre du document — court, sans accent\n\nJenni sauvegarde son document de retour en utilisant le titre (style Title)\ncomme **nom de fichier**. Le titre doit donc être :\n\n- **court** (≤ 5 mots si possible, idéalement 2-4)\n- **sans accent** (compatibilité système de fichiers : pas de é, è, à, ô, ç)\n- **sans caractères spéciaux** (virgules, dashes étendus `—`, tirets cadratins)\n\nImplémentation : dériver le titre du slug via une fonction\n`titre_court_sans_accent(slug)`. Ex : slug `'chelation-aminoacide-diy'` →\ntitre `\"Chelation Aminoacide DIY\"`.\n\nLe titre descriptif complet (avec accents, long) peut rester dans un\nen-tête métadonnées après le Title (ex : `# Fiche — [titre complet]`).\n\n### 3. Scripts concernés\n\nTous les scripts qui émettent du docx pour Jenni doivent respecter\nces contraintes :\n\n| Script | Rôle |\n|---|---|\n| `tools/jenni/gen_fiche_docx.py` | Prompts de fiches (tous types) |\n| `tools/jenni/archives/gen_doc_ebauche.py` | Ébauches docs de strate (archivé) |\n| `tools/jenni/export_thesaurus_incomplets.py` | Liste termes à compléter |\n\nEn cas de modification d'un de ces scripts ou de création d'un nouveau :\n- Titre → style Title (level 0), court sans accent\n- Chapitres (sections principales) → H1\n- Sous-chapitres → H2\n- Sous-sous-chapitres → H3 max (sinon texte gras)\n\n\n### 3. Pas de séparateurs / décorations ASCII\n\nAucune décoration ASCII dans le corps des docx destinés à Jenni :\n- Pas de lignes de séparation (`─ * 40`, `─ * 60`, `=========`, `---`)\n- Pas de banderoles de titres (`## TITRE ##`, `== SECTION ==`)\n- Pas d'ornements Unicode (`▸ ▪ ❯ ▰`)\n\nRègle cohérente avec la BQ Jenni qui interdit déjà l'encadrement de titres\net la décoration ASCII dans les prompts. La structure visuelle passe\nuniquement par la hiérarchie H1/H2/H3 native de Word (bonne pratique\néditoriale : le lecteur navigue via le volet Navigation).\n\nImplémentation corrigée 2026-04-14 :\n- `gen_fiche_docx.py` : suppression des `─ * 40`\n- `gen_doc_ebauche.py` : suppression de `SEPARATOR`, `add_separator()`\n\n\n### 4. Préférer la structure plate au sein d'un chapitre H1\n\nQuand un chapitre H1 a plusieurs sous-chapitres H2 au même niveau\n(ex : 5 blocs charte fiches techniques), **éviter d'ajouter des H3 dans\nl'un d'eux** — la remontée H3 → H2 crée une ambiguïté d'interprétation\ndans Word (fin du sous-groupe H3 ? ou retour niveau H2 parent ?).\n\nSolution : garder tous les sous-chapitres au même niveau H2, et utiliser\ndes **paragraphes avec préfixe gras** pour les sous-listes à l'intérieur\nd'un H2 (ex : sous H2 « Protocole » → paragraphe « **Ingrédients —** … »).\n", "type": "regle", "crit": true}, {"id": 146, "titre": "Règles de rédaction des documents Jenni — référence unique", "contenu": "## Règles de rédaction des documents Jenni — référence unique\n\n**Portée** : toute rédaction destinée à Jenni — prompts de documents de\nstrate, prompts de fiches, prompts de validation, prompts d'enrichissement\ndu thésaurus, docx de reprise, docx de travail. Pas de cas particulier :\nles règles ci-dessous s'appliquent **toujours**. Pour un workflow\nspécifique (thésaurus, fiche, validation, doc de strate), consulter les\nBQ workflow correspondantes, mais les règles de rédaction restent celles\nqui suivent.\n\n### 1. Le document = le document lui-même\n\nLe prompt **n'est pas une discussion avec Jenni**. C'est le document\ndans son état courant. Jenni le lit comme un auteur reprendrait son\npropre brouillon — elle voit le contenu, elle identifie les manques,\nelle enrichit.\n\n- Pas de métaphrases (« Jenni, rédige cette section », « à compléter\n  par Jenni »)\n- Pas de marqueurs `[à compléter]`, `[TODO]`, `[à développer]`\n- Pas de typographie distinctive pour marquer « déjà écrit » vs « à\n  développer » — prose continue, le style est identique partout\n\n### 2. La proposition = l'état du corpus à l'instant t\n\nClaude rédige ce que le corpus dit **aujourd'hui**, en prose continue,\navec la densité que l'état des connaissances actuelles permet. Pas\nd'amorce stylisée, pas d'italique « brouillon » — le document vit tel\nqu'il est. Jenni complète là où elle identifie un manque, comme un\nauteur reprend un brouillon.\n\n### 3. Contenu issu du corpus uniquement\n\nLa matière d'une rédaction Claude vient :\n- Du thésaurus (définitions, synonymes, relations)\n- Des concept cards (contenu des descriptions, pas leur identifiant)\n- Des chaînes causales (narration, pas leur code)\n- Des fiches déjà intégrées (contenu assimilé, pas leur numéro)\n- De `jenni_sources` (bibliographie interne)\n- Des PDF de `jmj/pdf/` (sources externes validées)\n- Des notes JMJ (synthèses, analyses, arbitrages)\n\nPas de sources sorties de la mémoire générale de Claude. Si une\naffirmation ne peut être sourcée par le corpus ou un PDF local, soit\non la retire, soit on la marque comme hypothèse à confirmer par Jenni.\n\n### 4. Zéro méta-vocab dans le texte\n\n**Interdiction absolue** dans tout document destiné à Jenni :\n\n- Codes documents : `S0, S1, S2, S3, S4, V1, V2, V3, P1, P2, P3, P4,\n  P5, F1, F2, H1, H2, H3`\n- Vocabulaire méta-projet : `corpus`, `Corpus Le Sol Vivant`, `strate`,\n  `cross-ref`, `chaîne causale`, `concept card`, `thésaurus`,\n  `sol_vivant.db`, `section_key`, `doc_code`\n- Renvois internes : `card #N`, `fiche #N`, `chaîne CN`, `doc XN`,\n  `cf. fiche X`, `cf. card Y`\n- Instructions internes : « voir chapitre X », « comme décrit dans…\n  (en interne) », références aux scripts, tables, DB\n\n**Jenni ne sait rien de l'organisation du corpus**. Elle lit un\ndocument autonome qui tient debout tout seul.\n\n**Vérification avant tout commit ou envoi** :\n\n```python\nimport re\nFORBIDDEN = [\n    r'\\bcard #\\d+\\b', r'\\bfiche #\\d+\\b', r'\\bchaîne C\\d+\\b',\n    r'\\bchaîne causale\\b', r'\\bcross[- ]ref\\b', r'\\bconcept card\\b',\n    r'\\bsol_vivant\\b', r'\\bdu corpus\\b', r'\\bdans le corpus\\b',\n    r'\\bthésaurus\\b', r'\\bthesaurus\\b',\n    r'\\b[SV][0-4]\\b(?![a-zA-Z])', r'\\b[PF][1-5]\\b(?![a-zA-Z])',\n    r'\\bH[1-3]\\b(?![a-zA-Z])', r'\\bdoc [SPVFH]\\d*\\b',\n]\n```\n\nZéro violation obligatoire avant tout commit.\n\n**Faux positifs des codes docs (ne PAS charcuter)** — les patterns\n`S/V/P/F/H + chiffre` collisionnent avec la notation scientifique. Sont des\nfaux positifs, à conserver tels quels :\n\n- **Histones** : `H3`, `H4` et leurs marques (`H3K4me3`, `H3K9me2`, `H4K16ac`…)\n- **Générations filiales** : `F0`, `F1`, `F2`, `F3` (transmission, priming transgénérationnel)\n- **Stades végétatifs / régions 16S** : `V3`, `V4`, `V5` (stades phénologiques, régions hypervariables `V3-V4`)\n- **Gènes / enzymes** : `F6'H1`, `S8H`, `CYP82C4`, `CYP98A2`…\n\n`check_forbidden_jenni.py` (durci 2026-05-24) restreint les patterns aux codes\nvalides (`S0-4`, `V1-3`, `P1-5`, `F1-2`, `H1-3`) et **filtre par contexte** :\nun code entouré d'« histone / méthylation / génération / transmission / région /\nstade / → » est ignoré. Le gate ne doit signaler que du **vrai méta-vocab**.\n\n### 5. Structure Word / Google Doc\n\n- **Title** (level 0) : titre du document, **court, sans accent**\n  (Jenni l'utilise comme nom de fichier), `≤ 5 mots`, `sans caractère\n  spécial` (pas de `—`, `,`, `é/è/à/ô/ç`)\n- **Heading 1** : chapitres (Introduction, 1. …, 2. …, Résumé,\n  Références)\n- **Heading 2** : sous-chapitres quand un H1 a plusieurs angles\n- **Heading 3** : max — au-delà, texte gras inline ou paragraphe\n- Pas de H4, pas de H5\n\nPas de décoration ASCII (`---`, `===`, banderoles, `▸ ▪ ❯`). La\nstructure visuelle passe par la hiérarchie Word native.\n\n### 6. Termes canoniques intégrés dans le texte\n\nLes termes du thésaurus apparaissent **dans les phrases**, orthographe\nexacte (`terms.fr`). **Jamais en liste séparée** en fin de document\n— la liste redondante invite Jenni à inventer des définitions locales\nparasites et duplique le thésaurus.\n\n### 7. Citations et bibliographie (format Google Doc)\n\n**Citations inline** : format APA `(Auteur, année)` ou `(Auteur\net al., année)` pour ≥ 3 auteurs. Intégrées au plus près de\nl'affirmation.\n\n**Bibliographie finale** : section `Heading 1 — Références`, une\nentrée par paragraphe, tri alphabétique par premier auteur, format\nAPA complet avec **DOI ou URL résoluble** à la fin.\n\n**Hyperliens internes** (pattern Google Doc natif Jenni) : chaque\ncitation inline pointe vers un bookmark sur l'entrée biblio\ncorrespondante. C'est le format naturel de Jenni en retour. Claude\nproduit le markdown, le script de génération docx assemble les\nhyperliens lors de l'export.\n\n### 8. Règle du « Bloc de 10 » (listes pour Jenni)\n\nToute liste d'items envoyée à Jenni en bloc (termes à définir,\nsynonymes à compléter, points à préciser) ne dépasse pas **10 par\nenvoi**. Au-delà, qualité des recherches documentaires diminue, risque\nde mélange de sources. Multi-lots = plusieurs fichiers successifs,\navec **balise de repère** (« dernier terme traité : X, nouveau bloc\ncommence à Y »).\n\n### 9. Listes triées alphabétiquement (`lower(fr)`)\n\nToute liste de termes destinée à Jenni est triée alphabétiquement\nsur le libellé FR (`ORDER BY lower(fr)`). Le tri ASCII\ncase-sensitive (`COV` avant `Candida`) perturbe Jenni — toujours\nutiliser `lower()`.\n\n### 10. Pas de conseils rédactionnels redondants\n\nJenni produit naturellement un style concis, académique, adapté au\ncontexte donné. Ne pas ajouter de méta-instructions du type « rédige\n1500 mots », « cite les sources », « respecte le vocabulaire ». Elle\ncite et assemble intrinsèquement. Les seules consignes qui ajoutent\nde la valeur sont :\n- Format de citation imposé (`[N]` numérique vs `(Auteur, année)`)\n- Structure attendue (H1/H2/H3 du document)\n- Périmètre de contenu (ce que le document doit couvrir)\n\n### 11. Refs et sources — cadre de vérification\n\nChaque affirmation scientifique dans le document doit pouvoir être\nsourcée. Trois statuts possibles :\n\n- **Déjà sourcée** : citation inline `(Auteur, année)` + entrée biblio\n- **Issue du corpus sans source directe** : Claude synthétise à\n  partir du corpus existant (définitions, cards, chaînes, fiches) sans\n  inventer. Jenni ajoutera les sources au besoin.\n- **Hypothèse non sourcée** : à éviter. Si nécessaire, formuler\n  prudemment, Jenni décidera si elle trouve matière à confirmer.\n\nNe jamais citer des sources externes que Claude ne peut pas vérifier\n(pas de Pittelkow 2015 sorti de la mémoire si ce n'est pas dans\n`jenni_sources` ou un PDF local).\n\n### 12. Cycle itératif Claude → Jenni → JMJ\n\nLa rédaction Claude est une proposition de départ, pas une vérité finale.\n\n1. **Claude sème** : structure + affirmations ancrées dans le corpus\n   + chiffres d'ordre de grandeur + références principales. Affirmer\n   proprement, pas éluder par peur de se tromper — Jenni rectifiera\n   si la littérature diverge.\n2. **Jenni enrichit et conteste** : recherche dans ses sources\n   académiques, modifie si nécessaire, ajoute ses sources.\n3. **JMJ révise** en plusieurs passes pour valider et renforcer les\n   sources faibles.\n\nLa qualité finale émerge des trois étapes.\n\n## Règles d'intégration du retour Jenni\n\n**Les mêmes règles de rigueur que la rédaction s'appliquent à l'intégration**, sauf pour le thésaurus qui a son workflow dédié (cf. fin de section).\n\n### A. Aucun docx Jenni ne rentre tel quel en DB\n\nTout document de retour Jenni passe par **analyse Claude + scripts\nd'import contrôlés**. Le .docx vit hors DB. La DB stocke le résultat\nstructuré de l'analyse consciente :\n\n- Contenu rédigé → `fiche_contenus.contenu_integre` (fiche) ou\n  `doc_contenus.contenu_integre` (strate)\n- Termes candidats extraits → table `terms`\n- Références bibliographiques → `jenni_sources` + DOI normalisé\n- Formules chimiques (OMML) → Unicode préservé via parser math-aware\n  obligatoire (sinon `()` vides)\n\n### B. Parser OMML obligatoire (formules chimiques)\n\nJenni écrit toutes les formules chimiques/indices/exposants (NH₃, CO₂,\nFe²⁺, k₁, NO₃⁻, …) en Office Math ML (`<m:oMath>`). Le parser Python\n`python-docx` ignore les `<m:oMath>` et produit des `()` vides.\n\nTout script d'import d'un docx Jenni **doit** utiliser un parseur XML\ncustom qui extrait `<m:oMath>` et le convertit en Unicode. Référence :\n`tools/jenni/import_termes_jenni.py::parse_docx()`, réutilisable.\n\nVérification post-import : scan `\\(\\s*\\)` sur tous les champs texte\nintégrés. Zéro parenthèse vide tolérée.\n\n### C. Déduplication avant insertion\n\nAvant tout INSERT, vérifier absence de doublon par axes multiples :\n\n- **Sources** : DOI normalisé, titre complet, titre court, auteurs + année\n- **Termes** : `fr` normalisé (accents, casse, pluriel), `en` normalisé,\n  syn_fr/syn_en croisés (8 axes, cf. `import_termes_jenni.py`)\n- **Concept cards** : `title` + `description` substring\n- **Fiches** : `slug` unique, `titre` proche\n\nSi doublon détecté → **UPDATE** (enrichissement) plutôt que **INSERT**,\nou BLOCK + arbitrage manuel.\n\n### D. Substitution citations et validation sources\n\nLes citations inline au format `(Auteur, année)` doivent être **traçables**\ndans la bibliographie finale du docx et dans `jenni_sources`. Les `n.d.`\n(no date) doivent être résolues avant intégration (via Crossref DOI ou\nrapport `jenni_sources` enrichi).\n\n### E. Audit log systématique\n\nTout INSERT / UPDATE / MERGE en DB s'accompagne d'une ligne dans\n`audit_log` (horodaté, opération, table, référence, détail). Traçabilité\nobligatoire.\n\n### F. Archivage post-intégration\n\nDès qu'une fiche passe en statut `integree`, les\nfichiers sources associés sont **automatiquement** déplacés dans leurs\ndossiers `archives/` respectifs :\n\n- `docx/<nom>.docx` → `docx/archives/<nom>.docx`\n- `recherches/fiches/prompt_fiche_*.docx` → `recherches/fiches/archives/`\n\nImplémenté dans `tools/lib/fiche_archive.py::archive_fiche_files()`, câblé\nautomatiquement dans `integrate_fiche.py` à l'apply.\n\n### G. Cycle itératif — même principe que la rédaction\n\nL'intégration Claude est une **analyse consciente**, pas automatique :\n\n1. **Lire** le docx attentivement (contenu scientifique, termes, refs)\n2. **Extraire** : termes candidats, refs DOI, formules, cards liées\n3. **Dédupliquer** avant INSERT\n4. **Intégrer** avec audit log\n5. **Vérifier** : parenthèses vides, dummy-citations URLs, leaks méta-vocab\n6. **Archiver** le docx source\n\nJMJ valide après chaque intégration majeure.\n\n### H. Exception thésaurus — workflow dédié et analyse consciente\n\nL'intégration d'un retour Jenni thésaurus (`thesaurus___strate_X.docx`,\n`thesaurus_N_YYYYMMDD.docx`) est un chantier d'**analyse consciente\nlourde**, pas un simple import. Chaque docx contient typiquement\n30-100 termes avec définition + EN + SYN_FR + SYN_EN + BT + RT +\nrefs biblio inline + biblio finale + formules chimiques (OMML). Toutes\nces dimensions doivent être traitées consciemment.\n\n**Enjeu structurel** : les termes canoniques sont **portés dans tous les\nprompts** (fiches, documents de strate, validations). La qualité du\nthésaurus conditionne directement la qualité des prompts et donc du\ncorpus final. Un terme mal défini, un synonyme absent, une relation\nBT/RT orpheline ou mal orientée, une casse incohérente — tout cela se\npropage aux prompts et donc au travail de Jenni. D'où le travail\nd'arbitrage éditorial lourd en amont : chaque entrée du thésaurus doit\nêtre **stable**, **non-ambiguë**, **correctement reliée**, **avec des\nsynonymes cohérents**. L'intégration est consciente parce que le\nthésaurus est l'ossature lexicale du corpus.\n\n#### H.1 Matching et anti-doublon 8 axes\n\nChaque terme entrant est confronté à 8 axes de match normalisés\n(`norm()` : casse, accents, apostrophes, pluriel simple) :\n\n| Axe | Description |\n|---|---|\n| 1 | `norm(TERME)` ∈ `terms.fr` — même FR existant |\n| 2 | `norm(TERME)` ∈ `terms.en` — notre FR matche un EN ailleurs |\n| 3 | `norm(EN)` ∈ `terms.fr` — notre EN matche un FR ailleurs |\n| 4 | `norm(EN)` ∈ `terms.en` — même EN existant |\n| 5 | `norm(TERME)` ∈ `terms.syn_fr` — synonyme FR ailleurs |\n| 6 | `norm(TERME)` ∈ `terms.syn_en` — synonyme EN ailleurs |\n| 7 | `norm(EN)` ∈ `terms.syn_fr` — croisé |\n| 8 | `norm(EN)` ∈ `terms.syn_en` — synonyme |\n\nRègle de priorité (fix 2026-04-21) : **si aucun match direct (axes 1-4)\net multi-match uniquement via synonymes (axes 5-8), INSERT permis** — la\npolysémie d'un syn_en entre plusieurs termes est tolérée si le `fr` est\nunique. Ex : `Substance humique` (fr unique) + `Humic substance`\n(syn_en présent dans deux termes distincts : humus et acides humiques\net fulviques) → INSERT légitime.\n\n#### H.2 Résolution BT/NT/RT et orphelines\n\nLes relations BT (Broader Term), NT (Narrower Term), RT (Related Term)\nfournies par Jenni en texte brut sont résolues vers `to_term_id` via\nl'index normalisé `fr | en | syn_fr | syn_en`. Workflow :\n\n1. `build_fr_index(con)` construit `{norm(champ) → term_id}` à partir\n   des colonnes terms (fr, en, syn_fr, syn_en)\n2. `write_relations(from_id, rel_type, raw_text)` split le texte brut\n   sur `;,·`, normalise, cherche dans l'index, insère en\n   `term_relations` avec `to_term_id` résolu (ou NULL si orphelin)\n\n**Orphelines** : beaucoup de cibles BT/RT pointent vers des termes\nnon présents dans le thésaurus (formes courtes génériques, catégories\ntaxonomiques, hyperonymes non créés). Elles sont stockées en\n`to_term_text` avec `to_term_id = NULL`. C'est **informatif** (on\nvoit quels concepts Jenni relie), pas toujours à combler (cf. règle\ndoctrinale : le thésaurus est un vocabulaire contrôlé, pas une\nencyclopédie).\n\n**Re-résolution périodique** : après chaque intégration d'un lot de\nnouveaux termes, repasser sur toutes les orphelines existantes\n(`to_term_id IS NULL`) pour vérifier si les nouveaux termes n'ont pas\nrendu résolubles d'anciennes cibles. Gain typique : +5 à +10 % de\nrésolution par passe.\n\n#### H.3 Arbitrage éditorial conscient\n\n**Fusions de termes** (doublons latents, ex : `antibiorésistance` ↔\n`résistance aux antibiotiques`) :\n\n- Détection : syn d'un terme = fr d'un autre terme (scan périodique)\n- Décision : qui garde ? → JMJ arbitre selon convention éditoriale\n- Exécution : script `resolve_import_conflicts.py --apply` + merge\n  manuel consciencieux (syn_fr/syn_en concaténés, relations migrées,\n  doublons supprimés)\n\n**Nettoyage syn_fr erronés** (hiérarchie confondue avec synonymie) :\n\n- Cas : `goethite` est syn_fr de « Oxydes Fe/Al » → c'est un membre,\n  pas un synonyme\n- Correction : retirer de `syn_fr` + créer une RT ou BT/NT vers le\n  terme spécifique correspondant\n\n**Polysémie et acronymes** — cas comme `MO` vs `Mo` (Matière organique\nvs Molybdène) : `norm()` les collisionne à tort → utiliser `--skip-fr`\ndans `resolve_import_conflicts.py` pour protéger.\n\n#### H.4 Règle absolue : ne jamais modifier `terms.fr` automatiquement\n\nLe champ `terms.fr` est la **clé éditoriale** qui fait l'aller-retour\navec Jenni. Toute modification automatique (casse, ponctuation,\nespaces, apostrophes, tirets) crée un cycle vicieux : export avec\nforme modifiée → Jenni retourne la forme modifiée → la forme originale\nest perdue définitivement.\n\nInterdictions strictes :\n- Scripts de normalisation automatique de casse/ponctuation sur `fr`\n- Agents Task qui décident d'un changement de libellé\n- Règles typographiques abstraites (française, ISO 25964) appliquées\n  au `fr` existant\n\nAutorisé :\n- Modifications ciblées d'UN terme après validation explicite JMJ\n- Classification / analyse / comptage par agents Task\n- Normalisation sur champs secondaires (definition, syn_fr, syn_en) qui\n  ne font pas clé avec Jenni\n\n**Incident 2026-04-20** : Chantier A avait baissé la Majuscule initiale\nde 216 termes (« Antifragilité » → « antifragilité ») selon règle\ntypographique française — or Jenni utilise la Majuscule initiale\n(convention thésaurus). Cycle cassé de justesse. À ne jamais\nreproduire.\n\n#### H.5 Résolution citations `n.d.` pre-intégration\n\nJenni peut produire des citations inline `(Titre, n.d.)` quand elle n'a\npas extrait la date d'une source. Workflow de correction avant\nintégration :\n\n1. Extraire le RIS du docx, identifier les refs biblio avec DOI\n2. Résoudre les DOI via Crossref (gratuit, pas de clé) pour récupérer\n   année + auteurs + journal\n3. Produire un RIS enrichi (nouveau fichier, ne modifie pas l'original)\n4. Patcher le docx en substituant les `(Titre, n.d.)` par `(Auteur,\n   année)` — opération mécanique length-preserving pour préserver la\n   structure des runs Word (`<w:t>`, `<w:br>`)\n5. Re-vérifier : 0 `n.d.` restant avant intégration en DB\n\nCe patch n'est **pas** de la rédaction (c'est une substitution de\nmétadonnées factuelles vérifiables) — donc autorisé côté Claude sans\npasser par Jenni.\n\n#### H.6 Reclassement strates et doc_code\n\nLes nouveaux termes entrent par défaut en strate arbitraire (souvent S).\nReclassement nécessaire selon le **thème** du terme :\n\n- **F** : fondements, thermodynamique, évolution, politique, économie\n- **S** : sol, rhizosphère, bactérie du sol, cycle biogéochimique\n- **V** : plante, racine, photosynthèse, symbiose plante-microbe\n- **P** : pratique, rotation, couvert, compost, biochar, fermentation\n- **H** : humain, intestin, microbiome humain, santé, allergie\n\nClassification par heuristique mots-clés dans fr + definition. Les\nindécidables restent en S par défaut. JMJ corrige les cas particuliers\nà l'œil (ex : `érosion` classé automatiquement en H par co-occurrence\navec « humain » alors qu'il est clairement S).\n\n#### H.7 Audit post-intégration obligatoire\n\nAprès chaque `--apply`, vérification systématique :\n\n- **Diff source docx / DB** : chaque terme intégré doit avoir ses\n  DEF/SYN_FR/SYN_EN/EN identiques à la source (whitespace normalisé)\n- **Parenthèses vides** `\\(\\s*\\)` dans def/syn → 0 toléré (indicateur\n  de formule OMML mal parsée)\n- **URLs dummy-citation** `dummy-citation.com` → 0 toléré (artefact\n  Google Docs à nettoyer par le parser)\n- **n.d.** dans les définitions → 0 toléré (traité en pre-intégration)\n- **Relations BT/RT résolues** : compter le ratio résolues/orphelines\n  par type\n- **Re-résolution globale** des orphelines préexistantes\n- **Audit strates et docs_code** sur les nouveaux termes\n- **Scan doublons latents** (syn d'un = fr d'un autre) pour arbitrage\n  ultérieur\n\n#### H.9 Discipline amont — termes envoyés à Jenni doivent être propres\n\n**Règle opérationnelle** : toute liste de termes préparée pour Jenni\n(liste à puces, prompt, tableau d'entrée) doit être **vérifiée\northographiquement avant envoi**.\n\nPourquoi c'est critique :\n\n- **Jenni ne corrige pas l'orthographe.** Elle traite ce qu'on lui\n  donne tel quel — une casse bizarre, une ponctuation surnuméraire,\n  un accent manquant : elle les reproduit dans son retour docx.\n- **Le retour devient la nouvelle référence.** Au réimport, la forme\n  altérée écrase la forme originale en DB. Au cycle suivant, la\n  forme altérée part à nouveau chez Jenni → verrouillage définitif.\n- **Ça casse le flow de Jenni.** Une forme étrange (*Biodiversité*\n  avec double espace, `mycorhize,` avec virgule parasite,\n  `Mycorhize` mélangé avec `mycorhize` dans la même liste) perturbe\n  son traitement par bloc de 10, elle hésite, produit des variantes\n  non désirées, ou rate des entrées.\n\nContrôles obligatoires avant envoi à Jenni :\n\n1. **Tri `ORDER BY lower(fr)`** — évite les mélanges de casse\n   (`COV, Candida, CUE` en ASCII-tri vs `Candida, COV, CUE` en\n   tri normalisé)\n2. **Casse cohérente** : convention thésaurus = Majuscule initiale\n   pour les concepts + minuscule pour les taxons latins ajustés\n   (ex : *Rhizobium*). Vérifier la cohérence à l'œil sur la liste\n3. **Pas de ponctuation parasite** : pas de virgule terminale, pas de\n   point final, pas de double espace, pas de `-` en début\n4. **Apostrophes normalisées** : préférer l'apostrophe droite `'`\n   ou l'apostrophe typographique `'` selon convention adoptée, mais\n   jamais mélangées dans une même liste\n5. **Forme canonique** : si un terme existe en DB, envoyer la forme\n   exacte `terms.fr` — pas une variante orthographique\n\n**Outil** : `export_thesaurus_incomplets.py` et\n`gen_prompt_thesaurus.py` appliquent déjà ces règles (tri\n`lower(fr)`, forme `terms.fr` exacte, filtre `flag_pseudoscience=1`).\nLes listes manuelles (fiche prépa, prompt ad-hoc) doivent être\nvérifiées avant envoi — à l'œil ou via scan `check_integrity.py`.\n\n**Lien avec H.4** : H.4 interdit la modification automatique du\n`terms.fr` en DB. H.9 impose en amont que la forme envoyée soit\npropre. Les deux règles forment le **cycle fermé qui protège\nl'intégrité du thésaurus** contre la dérive orthographique\ninconsciente par l'aller-retour Jenni.\n\n#### H.8 Scripts et fonctions clés\n\n- `tools/jenni/import_termes_jenni.py` : import principal, matching\n  8 axes, modes `--replace` / `--insert-only`\n- `tools/jenni/resolve_import_conflicts.py` : résolution bloqués\n  multi-match avec `--skip-fr`\n- `tools/admin/dedupe_thesaurus.py` : déduplication périodique\n- `tools/lib/term_rels.py::build_fr_index()` + `write_relations()`:\n  résolution FK `to_term_id`\n- `tools/lib/term_rels.py::norm()` : normalisation matching (casse,\n  accents, apostrophes, pluriel)\n\nVoir BQ dédiées pour les workflows opérationnels détaillés.\n\n## BQ workflow spécifiques (consulter en complément)\n\nPour le **workflow opérationnel** propre à chaque type de document\n(quand exporter, comment générer le docx, comment intégrer le\nretour…), consulter la BQ workflow correspondante :\n\n- **Thésaurus** : workflow import/export/complétion (BQ thesaurus)\n- **Fiches** : création/Jenni/intégration consciente, structure\n  `fiche_sections` (BQ fiches)\n- **Validations** : workflow comblement de dette (BQ validations)\n- **Documents de strate** : prompts de strate via `export_jenni_doc.py`\n  (BQ strate)\n\nLes règles ci-dessus s'appliquent à **tous**, sans exception.\n\n### Historique\n\n- **2026-04-21** : consolidation unique des règles de rédaction.\n  Remplace l'éparpillement antérieur sur #3, #40, #89, #115, #120,\n  #130, #145, #101, #104, #109, #121, #122. Origine : session\n  2026-04-21 où Claude a violé 106 fois les règles sur 14 fiches par\n  manque de visibilité sur les garde-fous dispersés. BQ synthétique\n  consolidée + affichage au session_start via\n  `claude_rules.redaction_documents_jenni`.\n", "type": "workflow", "crit": true}, {"id": 158, "titre": "Pratiques naturelles typées hors-périmètre Jenni — KNF, JADAM, EM-Higa, LiFoFer, ferments", "contenu": "## Pratiques naturelles typées hors-périmètre Jenni\n\n### Règle absolue\n\nLe corpus Sol Vivant documente des **mécanismes scientifiques génériques**, pas des **recettes praticiennes**. Les pratiques naturelles dites « typées » — KNF, JADAM, EM-Higa, LiFoFer, bokashi, ferments traditionnels — sont des **instances paysannes** de mécanismes universels (fermentation lactique, hydrolyse enzymatique, anaérobiose dirigée, pression osmotique, etc.). Ce sont les mécanismes qui entrent dans le corpus, pas les recettes.\n\n### Pourquoi exclure Jenni de ces sujets\n\nJenni est un assistant de rédaction académique généraliste. Sur les pratiques typées, son corpus d'entraînement contient peu de littérature praticienne (Cho Han Kyu, Cho Youngsang, Higa, manuels paysans coréens/japonais). Empiriquement constaté : Jenni mélange acronymes (FAA → fermentation poisson générique), inverse les étapes aérobie/anaérobie, donne des ratios inexacts. Autant de bêtises que de vérités. **Risque inacceptable pour un corpus scientifique.**\n\n### Liste des pratiques typées (à date)\n\n- **KNF** (Korean Natural Farming, Cho Han Kyu) : IMO, FAA, FPJ, FFJ, OHN, BRV, LAB, WCA, WCP, BIO-9, OHN, SOWS, séries SA-N…\n- **JADAM** (Cho Youngsang) : JMS, JLF, JNP, etc.\n- **EM-Higa / Bokashi** : EM-1, fermentation anaérobie sons + microorganismes effectifs\n- **LiFoFer** (Lithuanian Forest Fermentation) : ferments solides/liquides à base de forêt\n- **Ferments traditionnels** : kefir, kimchi, choucroute, ensilage (recettes — les mécanismes restent)\n- **Préparations de biofertilisants paysans** sud-américains (Cuba EM, biofertilizantes brésiliens) — quand la doctrine prime sur le mécanisme\n\n### Sources autoritaires (jmj/pdf/)\n\n- **KNF** : `KNF - chos-global-natural-farming-sarra.pdf` (Cho Han Kyu général), `KNF - Dr Hoon Park III - Indigenous Microorganism(IMO).pdf`, séries inputs (FAA, FPJ, LAB, OHN, BRV, WCA, WCP, BIO-9, SA-1 à SA-19)\n- **JADAM** : `youngsang-cho-jadam-organic-farming_-the-way-to-ultra-low-cost-agriculture-jadam-2016-1.pdf`\n- **Fermentation lactique académique** : `LAB.pdf`, `LABresearch.pdf`\n- **LiFoFer** : `Lifofer_10.12.2024_Rezomes(5).pdf`, `Recettes-Lifofer-solides-liquides-et-reactivations.pdf`, `guide-lff-2018.pdf`\n- **EM/Bokashi** : `Agriton_EM_Fermentation-Bokashi-vs-Composting-...pdf`, `Bokashi as a soil improver (3 years).pdf`, `em-cuba.pdf`\n- **Biofertilisants généraux** : `Préparations de biofertilisants.pdf`, `Matière Microorganismes photosynthétiques.pdf`\n\n### Doctrine éditoriale corpus\n\n**Une fiche scientifique se construit sur le mécanisme**, jamais sur la recette. Exemple : pas de fiche « LAB-KNF » ni « LiFoFer », mais une fiche **« Fermentation lactique »** (Lactobacillus, baisse pH, biotransformation, conservation par compétition microbienne) qui mentionne KNF-LAB, LiFoFer, kefir, kimchi, choucroute, ensilage comme **instances illustratives**.\n\n### Workflow accepté pour ces sujets\n\n- **Sources directes** (PDFs `jmj/pdf/`) lues par Claude ou JMJ\n- Rédaction par **JMJ** ou **Claude** (extraction et synthèse) — jamais Jenni\n- Mention des acronymes-recettes **en clair** dans cards/fiches (ex. « Fish Amino Acid de Cho Han Kyu ») — pas indexés dans le thésaurus\n- **Cards philosophie** acceptables : comparer logiques épistémiques (KNF artisanal ciblé vs JADAM paysan mass-scale vs EM-Higa SynComs commercialisé vs LiFoFer minéral)\n\n### Agents d'audit — filtre `is_diy=0` obligatoire (périmètre)\n\nTout script d'audit qui traite des **fiches** via `agent_runner`\n(`analyse_fiches`, futurs audits fiche) doit **filtrer sur `is_diy=0`**\n(`COALESCE(f.is_diy,0)=0`) dans la requête `cmd_prepare`. Raisons :\n\n- Les **fiches DIY-recette** (`is_diy=1` : KNF/JADAM/EM, séries pratiques\n  typées) sont la source du bruit : recettes peu structurées, sans les\n  marqueurs canoniques (sections numérotées, blocs Références APA) que les\n  prompts d'audit attendent → catégories vides, JSON malformé, hors-périmètre.\n- En revanche une **fiche Claude STRUCTURÉE** (ex. #41 « transition robuste »,\n  `is_diy=0`, rédigée en direct depuis le Shift Project) a **autant de valeur\n  qu'une fiche Jenni** et **doit être auditée**. Le critère est donc `is_diy`\n  (nature recette vs structurée), **pas `origine`** (jenni/claude).\n- Le **filtrage amont** dans `--prepare` est la garantie ; tout filtrage\n  côté prompt agent est défaillant.\n\n> **Pourquoi pas `origine='jenni'` (ancien critère, corrigé 2026-06-09)** :\n> les #95-104 (séries KNF/JADAM) ont été re-typées `origine=jenni` le\n> 2026-06-01 (fiches mécanisme académiques) tout en restant `is_diy=1`. Le\n> filtre `origine='jenni'` était donc devenu **à l'envers** : il laissait\n> passer ces recettes (jenni) et excluait à tort la seule fiche claude\n> structurée (#41). Bascule sur `is_diy=0` (décision JMJ 2026-06-09).\n\nCas où le filtre est volontairement levé (rare) : ajouter un commentaire\nexplicite `# périmètre élargi — JMJ a validé` dans le script. Sans ce\ncommentaire (et sans filtre `is_diy=0`), le check pré-vol n°2 (BQ\n`agent_runner_garde_fous`) refuse le lancement.\n\nNote périmètre : `audit_opus`, `audit_focus`, `analyse_corpus` auditent les\n`concept_cards` (pas les fiches) et appellent le garde sans `sql_query` —\nle check périmètre y est skippé (sans objet).\n\nIncident référence : 2026-04-05 — 7 agents `analyse_fiches` lancés sur\nfiches DIY #95-104 ont produit du JSON conforme structurellement mais\nvide de fond sur 4/5 catégories. Coût : ~50 k tokens et confusion lors du\nconsolidate.\n\n### Audit du CONTENU — ne pas rejeter le DIY contextualisé sourcé (précision 2026-06-09)\n\nLe filtre `is_diy=0` cadre la **sélection** des fiches auditées (amont). Mais à\nl'**audit du contenu** d'une fiche `is_diy=0`, un agent (ou Claude) ne doit **PAS\nrejeter ni flagger comme dérive** les pratiques typées citées **comme instances\nd'un mécanisme générique académiquement sourcé**.\n\nRaison (règle JMJ) : **Jenni ne mobilise une pratique DIY que si elle est\nacadémiquement sourcée** — sinon elle ne peut pas en parler (open access\nuniquement). Sa présence dans un retour Jenni, avec citation `(Auteur, année)`,\natteste donc du sourçage et de l'angle mécanisme. C'est le régime autorisé\n(« mention contextualisée », cf. §Gate intégration).\n\nDistinction opérationnelle :\n- **Légitime (ne pas rejeter)** : « la haute pression osmotique des préparations\n  de type FAA induit une dormance (Gong 2025) » — mécanisme + source + instance.\n- **Dérive (à signaler)** : une recette nue non sourcée (« mélanger 1:1 sucre roux\n  et poisson ») sans mécanisme ni source.\n\nLe warning `RECETTE_TYPEE` du gate (regex acronymes) est un **signal à VÉRIFIER**\n(sourçage + angle mécanisme), **pas un rejet automatique** — JMJ arbitre. Cas\nattesté : fiche #224 (dormance), sections 4.4/5 ajoutées sur demande JMJ, DIY\nsourcé (Gong 2025, Brom 2023, Thompson 2025, Barquero 2021) → faux positif accepté.\n\n### Workflow interdit\n\n- Demander à Jenni de définir/rédiger sur ces sujets\n- Indexer les acronymes-recettes (FAA, FPJ, LAB-KNF, JMS, etc.) comme termes thésaurus\n- Confondre KNF et JADAM (deux écoles distinctes, presque opposées)\n- Présenter une recette comme contenu scientifique du corpus\n\n### Flag termes : flag_pratique_typee\n\nLa table `terms` reçoit un nouveau champ `flag_pratique_typee` (INTEGER 0/1) — distinct de `flag_pseudoscience`. Les termes flaggés sont **exclus des exports vers Jenni** (`enrich_thesaurus.py`, `gen_prompt_completion.py`, `export_thesaurus_incomplets.py`) mais permis en clair dans cards/fiches.\n\n### Gate intégration\n\nLe gate `tools/jenni/integrate_fiche.py` détecte les acronymes-recettes dans les retours Jenni. Une fiche contenant `FAA`, `FPJ`, `JMS`, `JLF`, `OHN`, `LAB-KNF`, `WCA`, `IMO` (au sens KNF), `BIO-9` etc. déclenche une **alerte** (warning RECETTE_TYPEE) — JMJ arbitre (rééditer ou accepter si mention contextualisée).\n\n### Mode dégradé existant\n\nLes fiches DIY actuelles intégrées avant cette doctrine restent en l'état (mode dégradé). À revoir lors d'une session dédiée à partir des documents officiels (KNF Cho Han Kyu, JADAM Cho Youngsang, LiFoFer guide-lff-2018).\n", "type": "doctrine", "crit": true}]}, "session": {"nom": "Gestion de session", "entries": [{"id": 70, "titre": "Git — toujours travailler sur main", "contenu": "**Règle** : travailler directement sur `main`. Pas de branches.\n\nLe projet est géré par un seul utilisateur + Claude Code. Les branches ajoutent de la complexité inutile (merge, stash, divergence) sans bénéfice.\n\n- `git commit` sur main\n- `git push origin main`\n- Pas de `git checkout -b`, pas de PR, pas de merge\n- Si l'environnement force une branche (Claude Code web), merger dans main dès que possible\n\n## Session web — ne PAS lancer `session_start.py` pour réinitialiser\n\nSur la plateforme web (`CLAUDE_CODE_REMOTE=true`), la branche `claude/<session>`\nest **imposée** et le provisioning est assuré par les hooks SessionStart\n(`.claude/hooks/session-start.sh` : pip/npm + `core.hooksPath` + réalignement du\nref `main` sur origin/main *sans checkout*). Le rituel RESET local de\n`session_start.py` (checkout main + `git branch -d claude/*` + `reset --hard`) y\nserait **destructif** : le `-d` « safe » réussit dès que la branche est à 0 commit\nd'écart avec origin/main → la branche de travail imposée est supprimée et on bascule\nsur `main`. Incident vécu 2026-06-04.\n\nDepuis 2026-06-04, `session_start.py` porte un **garde web** (`CLAUDE_CODE_REMOTE`)\nqui saute le bloc destructif : il n'affiche que le dashboard et réaligne le ref\n`main` sans checkout. **Réflexe** : sur le web, on travaille sur `claude/*` toute\nla session et on propage vers `main` à la clôture via `session_end.py` — on ne\nrelance pas `session_start.py` pour « repartir propre ».\n", "type": "contrainte", "crit": true}, {"id": 64, "titre": "maintenance_sessions — journal de bord", "contenu": "Journal de bord des sessions Claude Code.\n\n**Depuis Session C (2026-05-05) : filesystem natif** dans `jmj/rapports/session/<slug>.md`. La table `maintenance_sessions` a été droppée. Les champs sont regroupés dans le bloc `session:` du frontmatter YAML (cf. BQ #119 pour le format complet).\n\n**Procédure :**\n1. **Fin de session** : `session_end.py` lit `jmj/.pending_session_recap.md`, valide les champs, écrit dans `jmj/rapports/session/<slug>.md` avec frontmatter (champs racine + bloc `session:`)\n2. **Pas de rapport intermédiaire** — un seul fichier en fin de session\n3. Si plusieurs sessions dans la journée → 1 fichier par session (slug unique requis)\n\n**Champs obligatoires** (validés par `session_end.write_session_recap_to_fs`) :\n`slug`, `titre`, `date_session`, `ts_start`, `objectif`, `actions`, body markdown non vide.\n\n**Champs optionnels (bloc `session:`)** : `ts_end`, `declencheur`, `etat_avant`, `etat_apres`, `decisions`, `scripts_touches`, `tables_touchees`, `reste_a_faire`, `alertes`, `commit_refs`, `cout_estime`.\n\n**Consultation programmatique :**\n```python\nfrom reports_inventory import list_reports\nfor r in list_reports(categorie='session_recap'):\n    fm = r['frontmatter']\n    print(fm.get('ts_start'), fm.get('titre'))\n```\n\n**Recherche par grep** (filesystem = grep direct, plus de SQL nécessaire) :\n```bash\ngrep -l \"thesaurus\" jmj/rapports/session/*.md\n```\n\n**Historique** : 104 maintenance_sessions migrées en Session C vers `jmj/rapports/session/`. Les 25 entrées orphelines (sans `audit_reports.session_recap` matching, pre-BQ #119) ont été reconstruites avec slug forgé `session_<date>_<objectif_short>_legacy_<id>`.\n", "type": "instruction", "crit": false}, {"id": 78, "titre": "Nouveau script — checklist d'enregistrement", "contenu": "Après création d'un nouveau script Python dans `tools/` :\n\n1. Ajouter les imports partagés :\n   ```python\n   sys.path.insert(0, str(Path(__file__).resolve().parent.parent / 'lib'))\n   from db import get_connection\n   from cli import add_db_arg, check_db\n   ```\n2. Utiliser `add_db_arg(parser)` au lieu de `parser.add_argument('--db', ...)`\n3. Utiliser `check_db(args.db)` pour valider l'existence de la DB\n4. Utiliser `get_connection(args.db)` au lieu de `sqlite3.connect()` + `get_connection (inclut row_factory)`\n5. `git add tools/<folder>/<nom>.py` puis commit\n6. Verifier : `from scripts_inventory import list_scripts` puis filtrer par nom\n7. Si le script génère des fichiers → l'ajouter dans `regen_all.py`\n\n**Pour les scripts `batch/` et `batch/` (archivé)** (qui importent via `from lib.xxx`) :\n```python\nsys.path.insert(0, str(Path(__file__).resolve().parent.parent))\nfrom lib.db import get_connection\nfrom lib.cli import add_db_arg, check_db\n```\n", "type": "instruction", "crit": false}, {"id": 119, "titre": "Rituel de clôture de session — session_end.py", "contenu": "## Rituel session_end.py\n\n```bash\npython3 tools/admin/session_end.py --db sol_vivant.db\n```\n\n**Séquence obligatoire** :\n1. Vérif working tree propre + branche courante\n2. Régénération des pages (via `regen_all.py` — 15 générateurs)\n3. `check_integrity.py` (validation DB)\n4. **Écriture rapport de session en filesystem** (Session C, 2026-05-05) :\n   - `jmj/rapports/session/<slug>.md` avec frontmatter YAML\n   - Champs racine (slug, titre, categorie, date_session, ts_start/end, tags, stats_summary)\n   - Bloc `session:` (objectif, declencheur, actions, decisions, etat_avant/apres, scripts_touches, tables_touchees, reste_a_faire, alertes, commit_refs)\n   - Body markdown = ancien content_md\n5. `git add` étendu : sol_vivant.db, Publications/, MANIFEST.md, README.md, tools/, jmj/analyses/reports/, audit_reports/, jmj/rapports/\n6. Commit avec message structuré\n7. `git push origin claude/<branche-session>`\n8. `git checkout main && git merge --ff-only` + push\n9. Alignement origin/claude/<branche> sur main + suppression branche locale\n\n### Workflow session_recap (étape 4)\n\n**Avant** de lancer `session_end.py`, Claude écrit le narratif dans :\n\n```\njmj/.pending_session_recap.md\n```\n\nFormat = YAML frontmatter + body markdown. Le body markdown est conservé tel quel après le bloc frontmatter.\n\n```yaml\n---\nslug: session_2026-04-30_theme_court\ntitre: Session 2026-04-30 — Titre court\ndate_session: 2026-04-30\nts_start: 2026-04-30 08:30:00\ntags: [thesaurus, import_jenni]\nstats_summary:\n  terms_total: 1816\n  relations_total: 7186\n  taux_resolution_pct: 80.5\nobjectif: Une à deux phrases résumant la session.\ndeclencheur: Ce qui a motivé la session.\netat_avant: Snapshot DB/code avant.\nactions: |\n  Liste numérotée bout-en-bout.\n  Multi-ligne accepté.\ndecisions: Décisions structurantes prises et alternatives écartées.\netat_apres: Snapshot DB/code après.\nscripts_touches: Liste scripts modifiés\ntables_touchees: Liste tables modifiées\nreste_a_faire: Dette identifiée pour prochaines sessions.\nalertes: Points de friction (ou \"Aucune.\").\ncommit_refs: SHA1 courts séparés par virgules\n---\n\n# Markdown content_md ici\n\nSections recommandées : Objectif initial, Décisions structurantes,\nRéalisations, Statistiques DB, État technique, Dette, Alertes.\n```\n\n**Champs obligatoires** : `slug`, `titre`, `date_session`, `ts_start`, `objectif`, `actions`, et un body non vide.\n\n`session_end.py` lit le pending file, valide les champs, écrit `jmj/rapports/session/<slug>.md` (frontmatter + body), puis supprime le pending file. Comportement idempotent : si un session_recap existe déjà pour la date du jour ET qu'aucun pending file n'est présent, l'étape est skippée avec un message info (cas relance après clôture interrompue). En urgence : `--skip-recap` bypasse l'étape.\n\n### Pourquoi le filesystem (Session C, 2026-05-05)\n\nLes rapports de session sont du **markdown narratif** par nature. Le double-write DB+FS de la doctrine antérieure (2026-04-20) reproduisait deux fois la même information avec des risques de désync (cf. Session B sur les scripts). Désormais : **filesystem = source de vérité unique pour les rapports**, lisible directement via `grep`/`Read`/git diff.\n\n**Les champs racine et bloc `session:` du frontmatter** unifient l'ancien partage entre `audit_reports` (narratif) et `maintenance_sessions` (structuré) :\n- racine : slug, titre, categorie, date_session, ts_start, ts_end, tags, stats_summary\n- bloc `session:` (operationnel) : objectif, declencheur, actions, decisions, etat_avant, etat_apres, scripts_touches, tables_touchees, reste_a_faire, alertes, commit_refs\n\n### Contenu attendu du body markdown (après frontmatter)\n\nSections recommandées (pas obligatoires, on s'adapte) :\n- **Objectif initial** (ce qu'on voulait faire)\n- **Décisions structurantes** (pourquoi tel choix, alternatives écartées)\n- **Réalisations** (par commit si session à commits multiples)\n- **Statistiques DB** finales (chiffres clés qui permettent de mesurer l'impact)\n- **État technique** (branche, commits, integrité)\n- **Dette identifiée** pour prochaines sessions (très important — alimente l'audit de dette doctrinale)\n\n#### Synthèse réflexive — bloc OBLIGATOIRE en clôture (ajouté 2026-06-01)\n\nToute clôture inclut une **synthèse réflexive structurée en 4 sections**, dont la\nraison d'être est de **capitaliser sur les frictions pour qu'elles ne se reproduisent pas** :\n\n- **Frictions** : où Claude s'est trompé pendant la session, et la **cause**\n  (recadrages JMJ, hypothèses fausses, actions mécaniques).\n- **Anomalies** : ce que la session a révélé d'incohérent dans le corpus\n  (typage, audit, données, doctrine).\n- **Ce que j'ai compris** : la doctrine **réellement internalisée** — formulée\n  avec ses propres mots, pas un copier-coller de BQ.\n- **Réflexes** : ce qu'il faut faire **différemment** la prochaine fois.\n\nCette synthèse vit dans le body du recap (`jmj/rapports/session/<slug>.md`) ; pour\nune session particulièrement riche en frictions, elle peut aussi faire l'objet d'un\ndocument dédié dans `jmj/rapports/synthese/` (modèle : `synthese_session_2026-06-01_frictions_apprentissages.md`).\n\n### Cas d'usage futurs\n\n- **Audit temporel** : `from reports_inventory import list_reports; for r in list_reports('session_recap'): print(r['frontmatter']['ts_start'], r['frontmatter']['titre'])`\n- **Recherche thématique** : `grep -l '<kw>' jmj/rapports/session/*.md jmj/rapports/audit/*.md`\n- **Reprise de dette** : itérer `list_reports('session_recap')` et lire `r['frontmatter']['session']['reste_a_faire']`\n- **Audit de dette doctrinale** : parser `reste_a_faire` + `alertes` pour détecter les chantiers ouverts non repris\n\n### Règle absolue\n\nToute session doit se terminer avec :\n- working tree **propre**\n- `main` **synchronisé** (merge FF depuis claude/…)\n- **rapport en filesystem** (`jmj/rapports/session/<slug>.md` avec frontmatter)\n\nNe jamais laisser la branche `claude/…` en avance sur main (cf. CLAUDE.md \"Clôture de session — propagation obligatoire\").\n\n### Historique d'implémentation\n\n- **2026-04-20** : doctrine établie (insert DB obligatoire), implémentation manuelle.\n- **2026-04-21** : `session_end.py` regen via `regen_all.py` (16 générateurs au lieu de 5 hardcodés).\n- **2026-04-30** : étape 4 automatisée — pending file YAML + body MD, insert transactionnel `audit_reports` + `maintenance_sessions`, idempotent.\n- **2026-05-05** (Session C) : bascule en filesystem natif. `write_session_recap_to_fs(pending_path)` remplace `insert_session_recap`. Tables `audit_reports` + `maintenance_sessions` droppées (203 rows migrées vers `jmj/rapports/session/` et `jmj/rapports/audit/`).\n", "type": "commande", "crit": true}, {"id": 128, "titre": "Session Claude Code — démarrage + clôture", "contenu": "## Workflow Session — démarrage + clôture\n\n### Démarrage (toujours, en premier)\n\n```bash\npython3 tools/admin/session_start.py --db sol_vivant.db\n```\n\nCe script fait tout :\n1. **Sync git** — fetch origin/main, checkout main, rebase si besoin. Les commits fantômes d'une ancienne session sont écrasés (par design, cf. CLAUDE.md)\n2. **Backup DB** — snapshot horodaté de `sol_vivant.db` dans `jmj/session/`\n3. **Dashboard** — chiffres vitaux : termes, fiches, chaînes, concept cards, dettes, commits récents\n4. **Intégrité** — check rapide (0 criticité attendue)\n5. **Règles actives** — affichage des BQ critiques (depuis `config.claude_rules`)\n\n**Après le démarrage** : la plateforme Claude Code web impose une branche `claude/<nom-session>`. Claude travaille sur cette branche puis propage vers main en clôture.\n\n### Pendant la session (flux standard)\n\n```\n1. Lire le dashboard\n2. Comprendre la demande JMJ\n3. Chercher dans BQ si pattern applicable :    bq_query.py --search <mot>\n4. Faire (éditer DB / scripts / Publications/)\n5. Régénérer : python3 tools/regen_all.py --db sol_vivant.db (si outputs touchés)\n6. check_integrity.py --db sol_vivant.db\n7. Commit + push (sur la branche claude/ imposée)\n```\n\n### Clôture de session (obligatoire avant de rendre la main)\n\nLe workflow est **mono-utilisateur** avec DB **binaire non mergeable**. Laisser du travail sur une branche feature → collision garantie (JMJ merge manuellement dans GitKraken).\n\n**Séquence fast-forward uniquement** :\n\n```bash\n# 1. Working tree propre\ngit status   # rien à committer\n\n# 2. Push de la branche courante\ngit push -u origin claude/<branche-session>\n\n# 3. Propagation vers main\ngit checkout main\ngit pull origin main\ngit merge --ff-only claude/<branche-session>\ngit push origin main\n```\n\n**Si le FF échoue** (ne devrait jamais arriver en mono-session) → STOP, demander à JMJ.\n\n**Rester sur `main`** à la fin + annoncer explicitement à JMJ que la session est close.\n\n### Clôture prématurée (test en cours de session)\n\nSi JMJ demande à tester un fichier (script, HTML, export), Claude exécute la même séquence immédiatement, reste dispo sur `main` pour le test, puis reprend les modifs suivantes sur la branche `claude/…` imposée par la plateforme.\n\n### Scripts annexes\n\n| Script | Usage |\n|---|---|\n| `tools/admin/bq_query.py --domaine fiches` | Relire ce module |\n| `tools/admin/check_integrity.py` | Valider l'état DB à tout moment |\n| `tools/admin/session_end.py` | (optionnel) rituel de clôture formel avec résumé |\n\n### BQ liées\n\n- Règles absolues → #1 (carte), #70 (git main), #73 (DB source de vérité)\n- Maintenance détail → module `maintenance` (scripts, journal, check)\n\n\n### Path de sortie — config\n\nLe rapport de cloture va dans `jmj/rapports/session/<slug>.md` (filesystem natif depuis Session C, frontmatter YAML + body markdown)\n(= `jmj/rapports/session/`). Utiliser `get_path(conn, 'rapports_session',\nensure_exists=True)`. Fichier nomme `rapport_YYYY-MM-DD.md`.\n\nVoir BQ #134 pour la structure jmj/ complete.\n", "type": "workflow", "crit": true}, {"id": 90, "titre": "Environnement — pas de binaire sqlite3, utiliser python3", "contenu": "Le binaire `sqlite3` **n'est pas installé** dans l'environnement Claude Code (erreur `sqlite3: command not found`).\n\n**Toujours utiliser le module Python** pour interroger la DB :\n\n```bash\npython3 -c \"\ncon = get_connection('sol_vivant.db')\nfor r in con.execute(\"SELECT ... FROM ...\"):\n    print(dict(r))\n\"\n```\n\n**Note** : dans les scripts, toujours utiliser `get_connection()` de `lib/db.py` (inclut `row_factory=Row`). L'import direct `sqlite3.connect` n'est utilisé que dans les one-liners CLI.\n\n**Ne jamais tenter** `sqlite3 sol_vivant.db \"...\"` — ça échoue systématiquement.\n", "type": "contrainte", "crit": true}, {"id": 161, "titre": "Conseil du corpus — scénario opérationnel R1/R2 (modèle de référence)", "contenu": "## Conseil du corpus — scénario opérationnel (modèle de référence)\n\nMatérialisation concrète de la doctrine `conseil_contradicteur` (le POURQUOI + le\nprotocole en 3 temps) et de `ouverture_conseil` (le QUAND). Cette entrée fige le\nCOMMENT : la mécanique reproductible, validée sur le chantier audit concept_cards\n(session 2026-06-12f). À rejouer à l'identique pour tout audit/arbitrage de fond\n(cards, chaînes, cascades, design DB, arbitrage doctrinal). C'est la **couche de\ndélibération de l'audit conscient** : l'audit croisé produit le dossier, le\nConseil rend le verdict (cf. BQ `audit_conscient`, `audit_corpus`, `wf_solde_audit`).\n\nLe Conseil se joue en **agents Task parallèles** (`model='opus'`,\n`agents_opus_default`), qui font du **JUGEMENT / CRITIQUE — jamais de rédaction\néditoriale** (`pas_agent_redacteur`) : ils proposent des positions, des intitulés,\ndes arbitrages ; ils ne rédigent pas le contenu du corpus. Tous les artefacts\nintermédiaires vont dans `tmp/conseil_<sujet>/`.\n\n### ÉTAPE 0 — Dossier partagé (le chairman = Claude)\n\nLe chairman fait d'abord son **audit croisé** (piloté par la DB, pas par un\nrapport antérieur — `source_verite_data_avant_absence`) et écrit\n`tmp/conseil_<sujet>/dossier.md` :\n\n- le **fil directeur** concerné (axes `doctrine_chantiers`, étayage) ;\n- les **findings numérotés** (A, B, C…), explicitement marqués « à challenger,\n  pas à gober » ;\n- l'**inventaire brut** de l'artefact audité (ex. les 182 cards : id · dimension ·\n  catégorie · titre) ;\n- les **consignes** : jugement seul, vérifie tout en DB (`python3` module sqlite3,\n  **pas de binaire `sqlite3` CLI** — `environnement_web`), `principes_generatifs_avant_labels_reactifs`,\n  `audit_cards_first` (mobiliser l'existant avant de proposer du neuf).\n\n### ROUND 1 — Avis indépendants (N agents EN PARALLÈLE)\n\n**3 lentilles** (regards complémentaires, **choisies selon l'objet**) + **1\ncontradicteur**. Exemple cards : Cartographe (couverture/fil directeur),\nLogicien (cohérence/hygiène/redondance), Praticien-Filtre (rigueur/ancrage/usage).\nChaque siège lit le dossier, **VÉRIFIE en DB**, et rend un verdict structuré :\nfindings confirmés/infirmés (preuve DB) + propositions (intitulés/positions) +\n**angle mort** + **préoccupation n°1**. Le contradicteur traque dès R1\nl'**artefact de comptage** et la **fausse alarme**.\n\n### ÉTAPE intermédiaire — Procès-verbal (chairman)\n\nLe chairman condense les avis dans `tmp/conseil_<sujet>/minutes_r1.md` et **NOMME\nles 2-4 TENSIONS** à trancher (les vraies divergences entre sièges).\n\n### ROUND 2 — Échange confronté (N agents EN PARALLÈLE)\n\nChaque siège **lit le PV** (donc les autres), **CONCÈDE ou MAINTIENT** sur chaque\ntension (preuve DB à l'appui), puis nomme l'**angle mort COLLECTIF**, la **VRAIE\nconvergence** et la **VRAIE divergence**. C'est ici que les positions tombent\nquand la DB les dément (ex. réel : « je retire mon \"À RELIER\" — 15/17 candidates\nsont déjà tissées »). L'échange est **doctrine** (renforcé JMJ 2026-06-12) : il ne\nse saute jamais.\n\n### ÉTAPE — Synthèse du chairman\n\n`tmp/conseil_<sujet>/synthese_chairman.md` : findings démontés (artefacts) / le\nvrai travail / le différé / les **arbitrages ouverts pour JMJ**.\n\n### CONTRADICTEUR DE LA SYNTHÈSE (1 agent) — checkpoint NON-NÉGOCIABLE\n\nLe second contradicteur **attaque LA SYNTHÈSE**, pas le débat (déjà tenu) : le seul\nmaillon autrement non audité. Mandat : qu'a-t-elle **lissé, survendu, omis** ?\nquelle **sur-ingénierie** au regard du besoin réel ? qu'est-ce qui **ne survivra\npas à l'usage** ?\n\n### LE SIÈGE ANTI-MARTEAU (loi de l'instrument) — institué 2026-06-13\n\nÀ côté du contradicteur siège **l'anti-marteau** (marteau de Maslow : « pour qui\ntient un marteau, tout ressemble à un clou »). Distinction nette, NON redondante :\n\n- Le **contradicteur** demande « est-ce JUSTE ? » (faits, faux consensus, artefacts\n  de comptage).\n- **L'anti-marteau** demande « est-ce NÉCESSAIRE — ou tend-on un marteau parce\n  qu'on en a un ? ». Il traque le **biais d'instrument** : chaque siège voit le\n  clou de sa spécialité (Cartographe → relier, Logicien → normaliser, Narrateur →\n  réécrire, Contradicteur → crier à l'artefact), et le **format « audit + Conseil »\n  fabrique mécaniquement des to-do** (un audit qui conclut « RAS » est vécu comme un\n  échec). Il **défend le STATU QUO comme verdict de plein droit**.\n\nMandat : pour chaque action proposée, trancher **« vrai besoin » / « clou fabriqué\npour le marteau » / « non-problème »**. **Test décisif** : *qui LIT/consomme\nréellement ce qu'on s'apprête à modifier ?* (chercher les consommateurs réels en\nDB/scripts/templates). Un champ que nul ne lit, rempli « pour la complétude », est\nun clou fabriqué — pas une action.\n\nIl siège **au minimum à l'étape synthèse** : la synthèse subit alors DEUX critiques\nindépendantes — le contradicteur sur la justesse, l'anti-marteau sur la nécessité.\nPour un objet riche il peut aussi siéger aux rounds. Le chairman vérifie en DB les\naffirmations factuelles des DEUX (un anti-marteau peut sur-appliquer son propre\nmarteau « ne rien faire »).\n\n**Validé 2026-06-13 (chantier chaînes 2/3) — a INVERSÉ le verdict.** Le Conseil,\nayant jugé les chaînes saines, s'apprêtait à 4 relinks `chains_liees` + un\nmicro-reprofilage. L'anti-marteau a prouvé en DB que `chains_liees` n'est lu par\n**aucun rendu** (seul `check_integrity` le valide, en ignorant les vides) → relinks\n= clou fabriqué par le marteau-à-relier ; et a exhibé le SEUL geste réel, que tous\navaient classé « simple signalement » : le snapshot périmé de la doc\n`chaines_doctrine` (« 16 chaînes » au lieu de 42) que les **agents lisent pour\nproduire**. Verdict honnête retrouvé : chaînes RAS, corriger une doc.\n\n### ÉTAPE — Le chairman VÉRIFIE les contradicteurs (BQ `faux_positifs_opus_recurrents` #55)\n\nRègle d'or : **le contradicteur-synthèse est lui aussi un Opus faillible**. Le\nchairman re-vérifie EN DB chaque affirmation factuelle avant de conclure. Sur le\nchantier cards, cette étape a simultanément :\n- **validé** une vraie erreur du chairman (un `ref_link` fiche→card proposé alors\n  que `ref_links` ne lie que des tables `ref_*` ; le bon pont est `pedago_links`) ;\n- **invalidé** deux dépassements du contradicteur (il affirmait « #161 est déjà\n  titré crosstalk JA-SA » — faux, #161 = « immunité nutritionnelle → JA-SA », angle\n  azote ; et « 30 cards JA-SA » — non reproduit, scan propre = 15 dont 5 faux\n  positifs « priming effect du sol »).\n\nSans cette vérification, on aurait soit gardé un lien structurellement impossible,\nsoit supprimé à tort une création légitime. **C'est l'étape qui empêche de prendre\nle contradicteur pour argent comptant autant que le rapport.**\n\n### VERDICT à JMJ\n\nSynthèse corrigée + critique vérifiée + arbitrages ouverts. **JMJ tranche.\nN'AGIR (création/UPDATE en DB) qu'après cet arbitrage** — et alors en conscience\n(`wf_solde_audit` : tri technique / éditorial scientifique / éditorial thésaurus,\nvérif avant fusion, un commit + regen ciblé + WAL + `check_integrity` + `audit_log`).\n\n### Réglage d'échelle\n\nObjet riche : **4 agents/round × 2 rounds + 2 critiques de synthèse (contradicteur\n+ anti-marteau) = 10 agents**. Objet léger : R2 peut être resserré, **jamais\nsupprimé** ; les deux critiques de synthèse sont, elles, non négociables. Les sièges sont\nparallèles intra-round (un seul message, N appels Agent) ; les rounds sont\nséquentiels (R2 a besoin du PV de R1).\n\n### Anti-patterns\n\n- Sauter le Round 2 (échange) ou l'un des deux contradicteurs (oublié 2-3 fois\n  avant 2026-06-12 — `conseil_contradicteur`).\n- Faire rédiger du contenu éditorial par les agents (`pas_agent_redacteur`).\n- Conclure sur les dires du contradicteur sans re-vérifier en DB (#55).\n- Agir avant l'arbitrage JMJ.\n- Optimiser une **frontière de KPI** (« compteur 0 → 0 ») au lieu du vrai besoin —\n  piège que le contradicteur-synthèse doit débusquer.\n- **Confondre « on a tenu un Conseil » avec « il fallait agir »** : le format audit\n  fabrique des to-do. Le statu quo est un verdict de plein droit — l'anti-marteau y\n  veille. Toujours se demander *qui lit/consomme* ce qu'on s'apprête à modifier.\n\n### Exemple de référence\n\nChantier audit `concept_cards` (session 2026-06-12f) : dossier + R1 (Cartographe /\nLogicien / Praticien-Filtre / Contradicteur) + R2 (échange) + synthèse +\ncontradicteur-synthèse + vérification chairman → verdict « système sain, dette de\n**liens** pas de cards ; tissage éditorial des orphelines + 1 card-dispatcher\nJA-SA maigre + hygiène catégories ; pas de sur-production ».\n", "type": "workflow", "crit": true}]}, "sources-autoritaires": {"nom": "Sources autoritaires externes", "entries": [{"id": 114, "titre": "Doctrine alignement INRAE — corpus = référence, INRAE = préférence", "contenu": "## Doctrine d'alignement INRAE — préférence, pas autorité\n\n**Règle** : le corpus *Le Sol Vivant cet Holobionte* est la **référence**.\nLe thésaurus INRAE (v2.6, ~16 500 concepts) est une **préférence d'alignement**\nquand c'est pertinent, pas une autorité qui primerait sur le corpus.\n\n### Justification\n\nLe corpus est alimenté exclusivement par :\n- Jenni AI avec sources académiques uniquement (pas de vulgarisation non sourcée)\n- Analyses croisées Claude sur les fiches intégrées\n- Validation JMJ (cohérence doctrinale)\n\nIl est **spécialisé** (agriculture régénératrice, biologie des sols fine,\nfermentations KNF/JADAM, holobionte, continuum sol-plante-humain) alors que\nINRAE est généraliste (toute l'agriculture + environnement).\n\nStatistiquement : au 2026-04-13, sur 900 termes corpus, **81% sont hors INRAE**.\nCe n'est pas une dette à combler, c'est une **spécificité assumée**.\n\n### Usage d'INRAE (ce qu'on fait)\n\n1. **Enrichissement synonymes** (`sync_syn_inrae.py`) : pour les 138 matchs\n   parfaits, on ajoute les altLabel INRAE comme synonymes (syn_fr, syn_en).\n   Non-destructif : on n'écrase jamais une valeur corpus.\n\n2. **Signal de divergence** : quand FR est identique mais EN diverge, on\n   génère un docx d'arbitrage (`export_mismatches_inrae.py`). JMJ arbitre\n   cas par cas (conserver corpus / adopter INRAE / fusion en synonyme).\n\n3. **Benchmark audit** : la section BENCHMARK INRAE dans `audit_opus.py`\n   sert à positionner le corpus (part de spécificité vs alignement), pas\n   à détecter des erreurs.\n\n### Usage d'INRAE (ce qu'on ne fait pas)\n\n- ❌ Corriger automatiquement les EN du corpus sur INRAE\n- ❌ Supprimer les termes corpus qui n'ont pas d'équivalent INRAE\n- ❌ Considérer un mismatch EN comme une erreur à corriger d'office\n\n### Cas concrets (2026-04-13)\n\n**Mismatches où le corpus est plus précis ou plus actuel** :\n- `Rhizophagus irregularis` (corpus) vs `Rhizophagus` (INRAE) → corpus gardé\n- `systemic acquired resistance (SAR)` (corpus) vs `systemic acquired\n  resistance` simple (INRAE sans acronyme) → corpus gardé\n\n**Mismatches où INRAE propose une version plus récente** :\n- `Proteobacteria` (corpus) vs `Pseudomonadota` (INRAE, dénomination récente\n  GTDB) → à arbitrer\n\n**Mismatches cosmétiques** :\n- `externalités` pluriel (corpus) vs `externalité` singulier (INRAE) →\n  décidé au cas par cas par JMJ\n\n### Référence\n\nCe document formalise la position exprimée par JMJ le 2026-04-13 après\nl'intégration d'INRAE comme référentiel auxiliaire.\n", "type": "regle", "crit": false}, {"id": 131, "titre": "Doctrine Shift Project — source autoritaire transition FR", "contenu": "## Doctrine — The Shift Project comme source autoritaire pour la transition FR\n\nLe Shift Project (fondé par Jean-Marc Jancovici) est la référence de fait pour\ntoute analyse chiffrée de la transition énergie-climat en France. Scientifiquement\nsolide, consensus d'experts, revue par pairs interne, méthodologie transparente.\n**Les données Shift ne nécessitent pas de re-vérification** — elles sont intégrées\ntelles quelles dans le corpus, avec attribution claire.\n\n### Sources Shift disponibles dans la DB\n\n- **`jenni_sources` #1667** — The Shift Project (organisation, 2026)\n- **`jenni_sources` #1668** — Carbone 4 (cabinet conseil Jancovici, paire)\n- **`jenni_sources` #1669** — **Rapport final PREF 2026** — « Réussir la transition\n  dans l'incertitude : la méthode Shift en 20 chantiers » (340 pages, avril 2026)\n  → `jmj/pdf/Reussir-dans-lincertitude-SHIFT-PROJECT-avril-2026.pdf`\n- **`jenni_sources` #1670** — Synthèse PREF 2026 (28 pages)\n  → `jmj/pdf/PREF_Shift-Project_Transition-robuste_14-avril-2026.pdf`\n\n### Tables dérivées du PREF 2026\n\n- **`refs` (kind=esclave_energ)** — sections `france_*` (88 params validés)\n  - `france_macro` — 8 params (émissions FR, conso énergie/élec, cibles 2050)\n  - `france_energie` — 5 params (fossiles, exposition, objectifs PTEF)\n  - `france_secteurs` — 3 params (transport, industrie, bâtiment)\n  - `france_scenarios_2050` — 13 params (trajectoires H/I/B)\n  - `france_agriculture` — 14 params (azote, Haber-Bosch, légumineuses)\n  - `france_elevage` — 15 params
