hypothèses non passées — éviter de les ressusciter sans raison nouvelle\n\n**Tables impliquées** :\n- `concept_dimensions` (12) : axes de pensée transversaux (Cadre Eau/Redox/Économique/Évolutif, Types de sols, Histoire, Symptômes, Pratique, Cycle, Continuum)\n- `concept_cards` : les cartes proprement dites (statut `active` | `archive`)\n- `concept_card_tests` : liaisons vers `terrain_tests` pour validation empirique\n\n**Voir BQ dédiée** : *« Concept cards — système de filtre de rigueur »* (à venir).\n\n### Cycle de vie d''une fiche ou d''une validation\n\n```\na_faire   → créée en DB avec objet + docs cibles\nen_cours  → Claude prépare/affine le prompt Jenni\nenvoye    → fichier .txt généré et copié dans Jenni\nrecu      → .docx Jenni récupéré (stocké docx/ ou docx/)\nintegre   → contenu intégré dans prompts.contexte_sci/.enrichissement des docs cibles\n            + termes extraits vers `terms`\n            + contenu brut/intégré stocké dans fiche_contenus / validation_contenus\narchive   → terminé, sort de la vue active\n```\n\n### Cycle de vie d''un prompt\n\n```\na_completer → des fiches/validations en cours pointent vers lui (objet ouvert)\ncloture     → toutes les dépendances integre, prêt pour passe finale Jenni\n```\n\nCalculé automatiquement par vue SQL : si une fiche/validation **ouverte** (`statut != 'integre' && statut != 'archive'`) référence ce prompt dans ses `docs_cibles` ou `prompts_cibles`, alors le prompt est `a_completer`.\n\n### Cycle de vie d''un document de strate\n\n```\na_rediger        → certains prompts en a_completer\npret_a_rediger   → tous les prompts en cloture\nen_redaction     → envoyé à Jenni passe finale\nredige           → .docx final reçu et intégré\n```\n\n### Tables et leur rôle\n\n| Table | Rôle | Statuts |\n|---|---|---|\n| `documents` (18) | Docs cibles du corpus | a_rediger / pret_a_rediger / en_redaction / redige |\n| `prompts` (~191) | Prompts par section | a_completer / cloture |\n| `terms` | Thésaurus canonique | (présent ou manquant, pas de cycle) |\n| `fiches` | **Zooms** sur un point précis (sous-types `zoom`, `technique`) | a_faire / en_cours / envoye / recu / integre / archive |\n| `validations` | **Vérifications + comblements** (modes `validation`, `renforcement`, `comblement`) | idem fiches |\n| `chains_causales` (C1-C9) | Chaînes scientifiques du corpus | objet potentiellement référencé par une validation |\n| Rapports d'audit (`jmj/rapports/audit/*.md`) | Audits qui révèlent des lacunes | source possible de validations |\n\n### Workflow de production complet\n\n```\n1. AUDIT du corpus (analyse_corpus.py, audit_opus.py, agents)\n   ↓\n2. Identification des manques :\n   - termes manquants → enrichissement thésaurus (gen_prompt_enrichissement.py)\n   - sujets transversaux non couverts → nouvelles fiches\n   - chaînes/concepts/lacunes → nouvelles validations\n   ↓\n3. Production des prompts Jenni\n   - export_fiche.py            → prompts_fiche_*.txt\n   - export_validation.py       → prompts_validation_*.txt\n   - gen_prompt_enrichissement  → enrich_*.txt (lots de 10, charte Jenni)\n   ↓\n4. Cycle Jenni (envoye → recu)\n   ↓\n5. Intégration Claude :\n   - termes → terms\n   - contenu fiches → fiche_contenus + prompts.contexte_sci/.enr\n   - contenu validations → validation_contenus + prompts.contexte_sci/.enr\n   ↓\n6. Clôture des prompts (auto-déduit par vue SQL)\n   ↓\n7. Doc en pret_a_rediger\n   ↓\n8. Passe finale Jenni → doc rédigé\n```\n\n### Règles de séparation (pour éviter la dérive)\n\n1. **Une fiche n'est pas une validation**. Tables séparées, sémantiques distinctes.\n2. **Un prompt de strate ne contient jamais de méta-commentaire Claude**. Tout méta va dans `notes` ou `audit_reports`, jamais dans `contexte_sci/.instructions/.enrichissement`.\n3. **Les DOIs ne sont pas stockés** comme métadonnée d'une fiche/validation. `jenni_sources` est la source bibliographique unique. Cf. BQ #102.\n4. **Tout retour Jenni intégré** va dans le bon champ : `fiche_contenus` pour les fiches, `validation_contenus` pour les validations, et `prompts.contexte_sci/.enrichissement` pour les docs cibles. **Jamais** dans le champ `instructions` qui sert à la prochaine demande Jenni.\n5. **Les statuts sont la vérité** : on ne marque pas `exporte` ou `produit` sans cycle de vie cohérent. Le statut reflète l'état réel à tout moment.\n6. **Charte Jenni générique** (BQ #40, #41, #101) s'applique à TOUT prompt destiné à Jenni : pas de codes docs, pas de méta-vocabulaire, citations format `[N]`, blocs de 10 max pour l'enrichissement.\n7. **Charte fiches techniques** s'applique en plus aux fiches `type='technique'` : structure standardisée 8 sous-blocs (Contexte sci / Protocole / Ingrédients / Équipement / Procédure / Indicateurs qualité / Précautions & Stockage / Applications & Dosages).\n\n### État cible (idéal)\n\n- 100% des `terms` définis\n- 100% des `fiches` valides en `integre` ou `archive`\n- 100% des `validations` valides en `integre` ou `archive`\n- 100% des `prompts` en `cloture`\n- 100% des `documents` en `pret_a_rediger` puis `redige`\n\n### ⚠ Etat actuel (avril 2026)\n\n`validation_sections` et `validation_contenus` existent en DB avec des donnees historiques (81 et 16 rows respectivement) mais **aucun script actif ne les alimente**. La logique des validations est en pause (cf. BQ #127). Les BQ qui decrivent leur workflow sont conservees comme reference, mais les scripts `export_validation.py` / `import_validation.py` ne sont pas operationnels aujourd'hui.\n\n\n## Contexte\n\ndocument de référence absolu\n", "type": "reference", "crit": true}, {"id": 72, "titre": "Structure dépôt et conventions de nommage", "contenu": "**Arborescence du dépôt :**\n```\nTools/                          ← racine git\n├── sol_vivant.db               ← source de vérité données (corpus, audit_log, config, refs)\n├── CLAUDE.md                   ← généré par session_start.py\n├── tools/                      ← scripts Python\n├── Publications/\n│   ├── img/                    ← images (OG, favicons, logos)\n│   ├── web/                    ← pages HTML publiques (noms fixes)\n│   ├── cartographie/           ← documentation statique\n│   ├── prompts/                ← exports Jenni horodatés\n│   ├── workflows/              ← workflows horodatés\n│   └── journal/                ← journaux de session\n├── jmj/                        ← documents de travail auteur\n└── Ma bibliothèque.ris         ← export RIS\n```\n\n**Conventions de nommage :**\n- Pages web : noms fixes (index.html, mo_calculateur.html, triangle_textures.html) — trackées par git, versionnées\n- Images OG : dans Publications/img/ (miroir du dépôt GitHub Pages)\n- URL OG : `https://sol-vivant.github.io/Publications/img/<nom>.png`\n- Favicon : `href=\"../img/<nom>.png\"` (chemin relatif depuis web/)\n- Scripts : `--db` optionnel (défaut `sol_vivant.db` à la racine)\n- Pas d'horodatage sur les HTML web (une seule version, git fait le versioning)\n", "type": "reference", "crit": true}, {"id": 96, "titre": "Explorer DB — interface web locale", "contenu": "## Explorer la DB localement\n\n```bash\npython3 tools/admin/explorer.py [--db sol_vivant.db] [--port 8765]\n```\n\nOuvre une interface web sur http://localhost:8765 pour naviguer :\n- Toutes les tables et vues (groupées par domaine)\n- Recherche dans les colonnes\n- Pagination\n- Panneau de détail pour les textes longs\n- BQ modules avec contenu Markdown\n- Sessions de maintenance\n\n**Ne modifie rien** — consultation seule.\n", "type": "workflow", "crit": false}, {"id": 76, "titre": "Workflow : design avant code, commits fréquents", "contenu": "**Anti-pattern observé** : coder immédiatement → corrections multiples → doublons → bugs d'encoding.\n\n**Séquence recommandée :**\n1. **Comprendre** : lire le code existant, les données en DB, les patterns\n2. **Concevoir** : décider où mettre les données (nouvelle table ? colonne ? config ?), écrire le composant sur papier\n3. **Implémenter** : DB d'abord, puis script, puis template\n4. **Tester** : regénérer, vérifier le HTML, tester dans le navigateur\n5. **Commit** : un commit par étape logique, pas un gros commit final\n\n**Commits de checkpoint** : commiter tous les 2-3 items pour éviter les pertes.\nUn fichier cassé par un Edit partiel se restaure avec `git checkout -- fichier` — mais seulement si le commit précédent est propre.\n\n**Historique** : fichier cassé restauré par git checkout (session 01/04), 3 commits correctifs successifs sur l'encart MO (session 03/04).\n", "type": "conseil", "crit": false}, {"id": 129, "titre": "Intégration source — rapport JMJ → biblio interne", "contenu": "## Workflow intégration de source — opération consciente\n\n### Principe\n\nJMJ fournit un **rapport de source** (métadonnées d'un article scientifique, souvent copié-collé depuis un PDF reader, Semantic Scholar, PubMed, un groupe de veille…). Claude intègre cette source **une à la fois**, avec le même soin que l'intégration d'une fiche. Cette opération enrichit la biblio interne (`jenni_sources`) et **peut renforcer le thésaurus** si des termes canoniques manquent.\n\n**Règle d'or** : jamais de batch-insert. Chaque source est une pièce du corpus, elle mérite une lecture attentive.\n\n### Entrée — ce que JMJ donne\n\nUn bloc brut comme :\n\n```\nTitre de l'article\nType de document : Article de revue\nAuteur : A. Untel / B. Untel ...\nRésumé : [abstract complet]\nDate : YYYY/MM/DD\nDOI : 10.XXXX/...\nURL : https://...\nPublication : Nom du journal\nVolume, Pages, Numéro, ISSN\n```\n\nFormat variable (export RIS, Semantic Scholar copy, PubMed metadata, groupe email…). Claude **normalise mentalement** avant d'écrire.\n\n### Séquence (Claude pilote, JMJ valide)\n\n**1. Lecture consciente**\n- Lire le titre + résumé intégralement\n- Identifier le **thème principal** (ex : bone char contamination arsenic / riziculture)\n- Identifier les **concepts clés** candidats à enrichir le thésaurus (ex : `bone char`, `arsenic speciation`, `arsenic methylation`, `arsC/arsM genes`)\n- Identifier les **documents / fiches / cards** du corpus potentiellement concernés\n\n**2. Dedup**\n```python\ncur.execute(\"SELECT id, doi, titre_complet FROM jenni_sources WHERE doi = ? OR titre_complet LIKE ?\",\n            (doi, f'%{titre_court}%'))\n```\n- Si déjà présent → proposer un UPDATE (enrichissement) plutôt qu'un nouvel INSERT\n- Si nouveau → continuer\n\n**3. Insertion `jenni_sources`** (champs critiques)\n- `doi` (normalisé sans préfixe)\n- `auteurs` (format : `Nom1 P, Nom2 Q, Nom3 R, et al.`)\n- `annee` (INTEGER)\n- `titre_complet` (exact, pas tronqué)\n- `titre_court` (extrait-clé en 4-8 mots, lisible)\n- `journal`\n- `resume_court` (150-300 mots, reformulation synthétique — pas l'abstract brut)\n- `pertinence` (ex : `S2 microbiome + P2 conservation` ou `H3 AMR`)\n- `tags` (JSON list : mots-clés thématiques du corpus)\n- `url` (lien DOI ou URL article)\n\n**4. Liens `source_usages`** (si pertinent)\nSi la source cite/justifie directement un contenu du corpus, ajouter un lien :\n```python\nINSERT INTO source_usages (source_id, entity_type, entity_id, contexte, citation_brute)\nVALUES (?, 'fiche', ?, 'Section Contexte scientifique', '(Hao et al., 2026)')\n```\n`entity_type` ∈ `{doc, fiche, term, card, prompt}`.\n\n**5. Renforcement thésaurus** (si termes nouveaux)\nSi l'article introduit des termes canoniques absents du thésaurus :\n- Vérifier `SELECT id FROM terms WHERE fr=? OR en=?`\n- Si absent : **proposer** à JMJ un ajout (titre, def depuis résumé, syn_fr/en, bt, rt)\n- JMJ valide → insert dans `terms` avec `doc_code='S'` ou autre\n- **Ne jamais** inventer des définitions sans base article\n\n**6. Audit log**\n```python\nINSERT INTO audit_log (operation, table_name, record_ref, detail)\nVALUES ('INSERT', 'jenni_sources', f'source #{src_id}',\n        f'{auteurs_court} {annee} {journal} — {theme_en_une_ligne} ({doc_codes_cibles})')\n```\n\n### Exemple d'intégration (modèle)\n\n**Entrée** (rapport JMJ) :\n```\nMicro-nanoscale bone char modulates rhizosphere As-cycling genes…\nAuteur : Yi Hao, Weitao Wu, … Chuanxin Ma\nDOI : 10.1007/s44246-026-00258-4\nPublication : Carbon Research\n```\n\n**Traitement Claude** :\n- Thème : bone char amendement / arsenic speciation / rice paddy\n- Corpus concerné : `S1 architecture sol` (amendement), `S2 microbiome` (arsC/arsM genes), `P1 diagnostic` (contamination), `P2 conservation`\n- Nouveaux termes potentiels (à valider) : `bone char`, `arsenic speciation`, `arsenic methylation gene (arsM)`\n- Source déjà en DB ? → SELECT par DOI → non\n- `resume_court` synthétise : « MNBC 25 g/kg sur sol contaminé 75 mg/kg As : urease +94-166%, catalase +35-519%, carbone organique +9-30%, arsC/arsR −6-52%, arsM +11-20%. Amélioration de la santé du sol sans changer l'accumulation As dans le riz. »\n- `pertinence` : `S1/S2/P1 amendement bone char contamination arsenic`\n- `tags` : `[\"bone char\", \"arsenic\", \"paddy soil\", \"arsC arsM\", \"soil remediation\"]`\n\n**Sortie** (Claude rend compte à JMJ) :\n- Source #XXXX insérée\n- 0 ou N termes candidats identifiés (liste)\n- 0 ou N liens source_usages créés\n\n### Ce qui n'est **pas** ce workflow\n\n- Import batch biblio → archivé (modules retirés)\n- Enrichissement auto depuis PubMed/E-utilities → utile comme outil annexe (cf. `wf_veille`), mais la décision d'intégration reste manuelle\n- Ajouter des refs dans `fiche_contenus.refs` → ça c'est le job de Jenni à la rédaction, pas de Claude à la veille\n\n### Scripts (à construire au besoin)\n\nIl n'existe pas encore de script dédié. Aujourd'hui c'est interactif dans la session :\n\n```sql\n-- Template d'insertion (à adapter à chaque source)\nINSERT INTO jenni_sources (doi, auteurs, annee, titre_complet, titre_court,\n                           journal, resume_court, pertinence, tags, url, created_at)\nVALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, datetime('now'));\n```\n\nUn futur `tools/veille/integrate_source.py` pourrait automatiser le dedup + template, mais la **lecture consciente** reste en session.\n\n### BQ liées\n\n- `wf_veille` (à venir) : scan PubMed hebdo qui produit des candidats\n- `wf_fiche` : intégration de fiches (même logique consciente à plus grande échelle)\n- #106 concept_cards : filtre de rigueur — une source introduit souvent une hypothèse qui doit passer par une card avant d'entrer dans le corpus\n\n\n### Fiabilité des sources : règle « livre/rapport vs Jenni »\n\n**Source primaire validée (livre, rapport institutionnel, publication académique à DOI)** — les valeurs chiffrées sont **fiables par construction** :\n- Smil 2017, Fuller 1938, Jancovici 2015, Nikiforuk 2012 (livres)\n- The Shift Project PREF 2024, Carbone 4 (rapports institutionnels)\n- Arvalis Triple Performance, IPCC, ministère (guides/rapports officiels)\n- JMJ synthèses (docs travail propres, JMJ pilote)\n\n→ **Entrée en `ref_*` directe** sans double-vérification cognitive. Ancrage sur la page/ref de la source. La révision concerne la pertinence (est-ce dans notre scope ?) pas la véracité numérique.\n\n**Sortie Jenni** — les valeurs chiffrées sont **à vérifier systématiquement** :\n- Jenni peut halluciner des nombres plausibles mais faux\n- Jenni peut agglomérer deux valeurs de sources différentes\n- Jenni ne sait pas nuancer les unités (kWh utile vs thermique)\n\n→ **Lecture ligne-à-ligne** avant intégration, rejet de toute valeur non ancrée à une source primaire consultable, préférence à réécrire ou demander régénération plutôt qu'accepter avec doute.\n\n**Workflow pour sources livres PDF (`jmj/pdf/`)** :\n1. Read PDF via outil Read (fonction PDF native, `pages` pour PDF > 10 pages)\n2. Extraction ciblée des tableaux / valeurs chiffrées (pas copier tout le texte)\n3. INSERT dans `ref_*` avec `source_id` → entrée jenni_sources\n4. INSERT jenni_sources (type='livre' / 'rapport' / 'organisation') si pas déjà présent\n5. Pas de régression cognitive : la valeur en DB devient autoritaire pour la session\n\n### Flag « haute valeur » pour récupération PDF\n\nJMJ maintient un accès au texte intégral via son outil de collecte externe\n(biblio interne + bibliothèques institutionnelles). L'abstract RIS est suffisant\npour une intégration standard, mais certains articles justifient d'aller\nplus loin.\n\n**Flag explicitement « haute valeur — demander PDF »** quand :\n- Apport chiffré unique ou méthodologie inédite dans le corpus\n- Source primaire sur un concept pivot (souvent jamais cité ailleurs)\n- Données quantitatives qui dimensionneraient un calculateur (Kirkby, MO,\n  esclaves, triangle textures, transition robuste)\n- Revue de synthèse couvrant une zone aveugle du corpus\n- Article fondateur qu'on cite partout sans avoir lu\n\n**Ne pas flag** (intégration abstract suffit) quand :\n- Sujet déjà structurellement couvert (fiches + cards existantes)\n- Apport incrémental chiffré mais non-structurant\n- Donnée pays-spécifique qui ne généralise pas\n\nSi le PDF n'est pas disponible mais que la source mérite d'être gardée :\n- INSERT jenni_sources normal\n- `notes` : `'PDF indisponible 2026-AA-JJ — intégration abstract seul'`\n- Pas de concept_card détaillée, juste liens usages basiques\n", "type": "workflow", "crit": true}, {"id": 126, "titre": "Trios parallèles *_sections / *_contenus (redondance structurelle connue)", "contenu": "## Trios parallèles `*_sections` / `*_contenus` (DB pattern connu)\n\n**Constat de maintenance 2026-04-14** : 6 tables dupliquent le schéma\nentre 3 types de production (fiches / docs de strate / validations).\n\n### Trio 1 — Sections éditoriales\n\n```\nfiche_sections       (143 rows, 4 scripts) — fiches\nprompts              (191 rows, 24 scripts) — docs de strate (schéma enrichi)\nvalidation_sections  (81 rows, 1 script)   — validations\n```\n\nColonnes communes : `type`, `ordre`, `titre`, `contexte_sci`, `instructions`,\n`enrichissement`, `tableau`. `prompts` ajoute `titre_h1/h2/h3`, `doc_code`,\n`chapitre`, `section`, `style`, `statut`.\n\n### Trio 2 — Retours Jenni (contenus)\n\n```\nfiche_contenus        (28 rows, 3 scripts)  — retours Jenni fiches\nprompt_contenus       (12 rows, 2 scripts)  — retours docs\nvalidation_contenus   (16 rows, 0 script)   — ORPHELINE\n```\n\nQuasi identiques : `version`, `contenu_brut`, `contenu_integre`, `refs`,\n`notes_claude`, `date_import`. `prompt_contenus` avait un champ `contenu`\natypique — désormais `contenu_brut` rempli en parallèle (migration 2026-04-14).\n\n### Vues unifiées (historique, retirées 2026-04-20)\n\nDeux vues SQL avaient été créées le 2026-04-14 pour unifier l'accès aux 3 trios :\n`v_content_sections` (UNION ALL fiche_sections + prompts + validation_sections) et\n`v_content_retours` (UNION ALL fiche_contenus + prompt_contenus + validation_contenus).\n\nElles ont été **droppées le 2026-04-20** (cf. audit_log) :\n- aucun consommateur dans `tools/` ou `tests/`\n- `v_content_retours` exposait `contenu_integre` legacy (le contenu est maintenant dans `fiche_sections.contenu` par section, cf. BQ #130 §4.2)\n- `v_content_sections` ne connaissait pas les nouveaux champs (`contenu`, `analyse_claude`)\n\nSi un besoin de lecture transversale réapparaît, les vues sont à recréer avec les colonnes post-refonte (incluant `contenu` et `analyse_claude` pour `fiche_sections`).\n\n\n### Décision physique : pas de migration\n\n**Factorisation physique non appliquée** : risque de casser 24 scripts qui\nassument la structure actuelle, pour un gain modeste (~500 Ko, 6→2 tables).\nLes vues couvrent le besoin de lecture transversale sans toucher au stockage.\n\n**Actions complémentaires possibles** :\n- Archiver `validation_contenus` (0 script, table morte) — cf. BQ #127\n- Documenter le pattern pour les futures sessions (cette entrée)\n\n### À envisager après maturation complète\n\nUne fois le corpus stabilisé (fiches matures, docs de strate peuplés,\nplus de cycle d'écriture intensif), une migration vers l'architecture\nphysique unifiée serait plus sûre.\n\n### Autres redondances mineures (non critiques)\n\n- `doc_code` / `docs_codes` / `docs_cibles` : 3 formats pour désigner\n  des documents (string / string multi-slash / JSON array)\n- `categorie` / `tags` : conventions variables selon domaine\n- `notes_claude` vs `notes` : 2 conventions d'annotation\n\n\n### Principe architectural — préparation à l'import, rendu trivial (avril 2026)\n\nLes 3 trios (fiche / doc / validation) partagent une règle :\n\n> **Le nettoyage du texte se fait une fois à l'intégration**, dans `<entity>_sections.contenu` (TEXT, nouveau champ). Le rendu HTML devient du `fetch → afficher`.\n\nCorollaires :\n\n- Un seul parser docx partagé (`tools/lib/parse_jenni_docx.py`) alimente les 3 trios — gère OMML, LaTeX, refs FR→EN, tags Jenni résiduels, découpage par section selon le plan DB.\n- Un seul composant de rendu React (`SvRichContent`) consomme les 3 trios — lit le plan DB + affiche sections et refs. Plus de parser côté JS.\n- Si le format Jenni change → un seul point de maintenance (le parser d'import).\n- Les champs `<entity>_contenus.contenu_integre` (blob markdown) deviennent **legacy** : conservés pour l'historique des intégrations antérieures, plus écrits par les nouveaux imports.\n\nCette règle remplace la doctrine précédente qui acceptait du markdown brut en DB et laissait `SvRichText` faire un parsing tolérant côté client.\n\n### ⚠ Etat actuel (avril 2026)\n\n`validation_sections` et `validation_contenus` existent en DB avec des donnees historiques (81 et 16 rows respectivement) mais **aucun script actif ne les alimente**. La logique des validations est en pause (cf. BQ #127). Les BQ qui decrivent leur workflow sont conservees comme reference, mais les scripts `export_validation.py` / `import_validation.py` ne sont pas operationnels aujourd'hui.\n", "type": "reference", "crit": false}, {"id": 127, "titre": "`validation_contenus` en sommeil (0 script actif)", "contenu": "## `validation_contenus` — table en sommeil\n\n**Constat maintenance 2026-04-14** : table présente (16 rows, schéma\ncohérent avec `fiche_contenus`) mais **aucun script ne la lit**.\n\n### État\n- Rows : 16\n- Données depuis : 2026-04-10 (15 jours avant constat)\n- FK : `validation_id` → `validations(id)` ON DELETE CASCADE\n- Scripts qui la référencent : 0\n\n### Usage prévu (historique)\n\nStockage des retours Jenni pour les documents de validation (table\n`validations`, workflow parallèle à fiches et docs de strate). L'extension\ndu workflow vers les validations n'a pas été développée — la table\nattend son usage.\n\n### Décision de maintenance\n\n**Conserver** : les 16 rows contiennent des données (non-vides),\nprobablement des brouillons de validations. Ne pas supprimer tant que le\nworkflow validation n'est pas clarifié.\n\n**À décider** ultérieurement :\n- Développer le workflow validation (lecture + intégration)\n- OU archiver définitivement si validation_sections non plus exploitée\n", "type": "reference", "crit": false}, {"id": 134, "titre": "Structure jmj/ et config.paths — rapports et audits centralises", "contenu": "## Structure jmj/ et config.paths\n\n### Vue d'ensemble\n\nTous les **rapports** et **audits** sont centralises dans `jmj/`. Les paths\nsont en base (`config.paths.*`) et les scripts les lisent via\n`lib.config.get_path()`. Pas de path hardcode.\n\n```\njmj/\n├── rapports/            ← rapports centralises\n│   ├── session/         ← cloture session Claude Code (date YYYY-MM-DD.md)\n│   └── audit/           ← rapports audit (fiches, thesaurus, BQ, sources)\n├── analyses/            ← sortie gen_reports.py depuis audit_reports\n│   └── reports/\n├── archives/            ← docx sources archives\n├── docx/                ← docx sources JMJ (drafts, propositions Jenni)\n├── journaux/            ← journaux de seances\n├── pdf/                 ← biblio PDF externe (Shift, Triple Perf, etc.)\n├── revues/              ← revues JMJ\n├── session/             ← contexte session\n├── transcriptions/      ← transcriptions audio\n└── notes*.txt           ← notes volantes a la racine\n```\n\n### Table config — categorie `paths`\n\nPaths disponibles via `lib.config.get_path(conn, 'CLE')` :\n\n| Cle | Valeur | Usage |\n|---|---|---|\n| `rapports_session` | `jmj/rapports/session` | Sortie rapport fin de session |\n| `rapports_audit` | `jmj/rapports/audit` | Sorties audits (scripts audit_*.py) |\n| `analyses_reports` | `jmj/analyses/reports` | Sortie gen_reports.py |\n| `recherches_fiches` | `recherches/fiches` | Docx Jenni fiches (cycle) |\n| `recherches_thesaurus` | `recherches/thesaurus` | Exports thesaurus + audits semantiques |\n| `recherches_sources` | `recherches/sources` | Exports sources |\n| `recherches_veille` | `recherches/veille` | Veille hebdo (PubMed) |\n| `recherches_archives` | `recherches/archives` | Archives fiches/thesaurus |\n| `jmj_docx` | `jmj/docx` | Docx sources JMJ |\n| `jmj_archives` | `jmj/archives` | Archives docx sources |\n| `jmj_pdf` | `jmj/pdf` | PDF biblio externe JMJ |\n| `jmj_notes` | `jmj` | Racine pour notes*.txt |\n| `publications_web` | `Publications/web` | Pages HTML publiees |\n| `publications_workflows` | `Publications/workflows` | Workflows horodates |\n| `docx_en_cours` | `docx` | Docx en cours (envoyes Jenni) |\n| `docx_archives` | `docx/archives` | Docx retournes + integres |\n\n### Regles\n\n1. **Pas de path hardcode** dans les scripts. Utiliser `get_path()`.\n2. **Defaults** : chaque `get_path()` doit avoir un fallback au cas ou la\n   config serait absente (ex: `get_path(conn, 'rapports_audit', 'jmj/rapports/audit')`).\n3. **Creation automatique** : `get_path(..., ensure_exists=True)` cree le\n   dossier si besoin. A utiliser pour les sorties qui peuvent tomber sur\n   un path non encore cree.\n4. **Distinguer rapports vs recherches** :\n   - `rapports/` = artefacts peripheriques, memoire de sessions, non\n     consommes par les scripts (lecture humaine JMJ)\n   - `recherches/` = cycle Jenni actif, consommes/produits par les scripts\n     d'import/export fiches, thesaurus, etc.\n5. **Distinguer jmj/ vs racine** : `jmj/` = JMJ personnel + memoire ;\n   racine (`docx/`, `recherches/`, `Publications/`) = cycle de production\n   actif partage avec Jenni / publications.\n\n### Lien avec les autres BQ\n\n- **#125 structure_recherches** : structure `recherches/` detaillee (cycle\n  Jenni). Ce BQ-ci complete avec la structure `jmj/` centrale.\n- **#128 wf_session** : la cloture de session ecrit dans\n  `config paths.rapports_session`.\n- **#102 traitement_notes** : les notes volantes restent a la racine de\n  `jmj/` (path `jmj_notes`).\n\n### Migration 2026-04-18\n\n- `rapports_sessions/` (racine) → `jmj/rapports/session/`\n- `jmj/SESSION_*.md` → `jmj/rapports/session/`\n- `jmj/audit_fiches_*.md`, `jmj/revue_bq_*.md`, `jmj/plan_integration_*.md`\n  → `jmj/rapports/audit/`\n- `recherches/audits/*` (9 fichiers) → `jmj/rapports/audit/`\n\nLe dossier `recherches/audits/` a ete supprime ; les nouveaux audits\nvont dans `jmj/rapports/audit/`.\n", "type": "doctrine", "crit": true}, {"id": 143, "titre": "BQ — architecture domaines_techniques (refonte 2026-04-20)", "contenu": "## Architecture BQ — filesystem natif (refonte Session D 2026-05-06)\n\nLa BQ est stockee en **filesystem** : un fichier `jmj/bq/<slug>.md` par entree\navec frontmatter YAML + body markdown. Le catalogue des 14 domaines techniques\nest dans `jmj/bq/_domaines.yaml`.\n\nUne entree BQ a **1 domaine_primaire** (le pipeline ou elle fait loi) et\n**0-5 domaines_reference** (ou elle sert de doctrine transverse).\n\n### Frontmatter standard\n\n```yaml", "type": "reference", "crit": true}]}, "integrite": {"nom": "Intégrité DB", "entries": [{"id": 74, "titre": "Audit d'intégrité DB — sanity check technique", "contenu": "## Audit d'intégrité DB — sanity check technique\n\nAudit **technique** du schéma : FK orphelines, doublons sur clés normalisées, désynchronisations entre tables, scripts vs DB. Distinct des audits sémantiques (BQ `audit_thesaurus` et `audit_corpus`) qui éprouvent le contenu éditorial. Cet audit est une **routine rapide**, sans agent, à passer après chaque migration ou avant une consolidation majeure.\n\n### Périmètre\n\n| Axe | Scope |\n|---|---|\n| FK orphelines | `term_relations.to_term_id`, `chain_etapes.term_id`, `concept_cards.dimension_id`, `source_usages.source_id`, `pedago_links.card_id`, `card_chain_links.card_id`, `card_chain_links.chain_id` |\n| Doublons clés normalisées | `terms.fr` lower(), `concept_cards.title` lower(), `fiches.slug`, `jenni_sources.doi` lower() |\n| Désynchronisations cache | `chain_etapes.term_fr_text` ≠ `terms.fr`, `fiche_contenus.refs` ≠ `source_usages` |\n| Sections sans titre / titre dupliqué | `prompts.titre_h2`, `fiche_sections.titre` |\n| Documents inactifs cités | `concept_cards.docs_codes` JSON-each vs `documents.code` |\n| Audit log gaps | période > 24 h sans entrée, ou opérations sensibles non loggées |\n\n### Requêtes canoniques\n\n```sql\n-- 1. FK orphelines termes (relations vers term_id inexistant)\nSELECT tr.id, tr.from_term_id, tr.rel_type, tr.to_term_id, tr.to_term_text\nFROM term_relations tr\nLEFT JOIN terms t ON t.id = tr.to_term_id\nWHERE tr.to_term_id IS NOT NULL AND t.id IS NULL;\n\n-- 2. FK orphelines chaînes\nSELECT chain_id, position, term_fr_text FROM chain_etapes\nLEFT JOIN terms t ON t.id = chain_etapes.term_id\nWHERE chain_etapes.term_id IS NOT NULL AND t.id IS NULL;\n\n-- 3. Doublons termes par fr lower()\nSELECT lower(fr) k, count(*) n, group_concat(id) ids\nFROM terms GROUP BY k HAVING n > 1;\n\n-- 4. Désynchronisation chain_etapes.term_fr_text ↔ terms.fr\nSELECT ce.chain_id, ce.position, ce.term_fr_text, t.fr\nFROM chain_etapes ce JOIN terms t ON t.id=ce.term_id\nWHERE ce.term_fr_text IS NOT NULL AND ce.term_fr_text != t.fr;\n\n-- 5. Désynchronisation fiche_contenus.refs ↔ source_usages\n-- (compter refs JSON vs count source_usages par fiche)\nSELECT fc.fiche_id,\n       (SELECT count(*) FROM source_usages WHERE entity_type='fiche' AND entity_id=fc.fiche_id) n_usages,\n       (CASE WHEN fc.refs IS NULL THEN 0 ELSE json_array_length(fc.refs) END) n_refs_cache\nFROM fiche_contenus fc\nWHERE n_usages != n_refs_cache;\n\n-- 6. Cards orphelines (sans dimension)\nSELECT id, title FROM concept_cards\nWHERE dimension_id IS NOT NULL\n  AND dimension_id NOT IN (SELECT id FROM concept_dimensions);\n\n-- 7. docs_codes JSON-each cassé\nSELECT cc.id, cc.title, value AS doc_code\nFROM concept_cards cc, json_each(cc.docs_codes)\nLEFT JOIN documents d ON d.code = value\nWHERE d.code IS NULL;\n\n-- 8. Sources sans DOI ni URL (passe rapide — cf. audit_sources_orphelines.py pour rapport complet)\nSELECT count(*) FROM jenni_sources WHERE (doi IS NULL OR doi='') AND (url IS NULL OR url='');\n```\n\n### Script unifié\n\n`tools/admin/check_integrity.py` exécute la majorité de ces vérifications avec sortie structurée (markdown ou JSON). Mode `--strict` arrête au premier check rouge. À lancer **toutes les 3-5 sessions** ou avant toute migration de schéma.\n\n### Cadence et déclencheurs\n\n- **Cadence régulière** : `check_integrity` toutes les 3-5 sessions\n- **Déclencheurs immédiats** :\n  - Après migration schéma (`ALTER TABLE`, ajout/modif colonne)\n  - Après import massif (lot Jenni, refs Crossref, etc.)\n  - Après suppression d'un terme / d'une card / d'une chaîne (cascade FK)\n  - Avant `regen_all.py` (génère HTML public depuis DB — cohérence critique)\n- **Audit log gaps** : check trimestriel — détecter une opération sensible (DROP, DELETE en masse) non loggée\n\n### Articulation avec les autres audits\n\n| Audit | Couvre | Distinct de #74 |\n|---|---|---|\n| BQ `audit_thesaurus` | Sémantique du thésaurus (termes, relations, doublons éditoriaux, méta-vocab) | #74 ne juge que les FK et les doublons sur clé normalisée |\n| BQ `audit_corpus` | Sémantique du corpus (chaînes, cards, fiches, articulations) | #74 ne juge que les FK et les désync cache |\n| BQ `wf_fiche_integration` (#147) | Mini-audit phase 4bis post-intégration | Spécifique à une fiche, pas un audit global |\n\n### Historique d'incidents traités\n\n- 36 doublons termes corrigés (session 03/04 2026)\n- 77 orphelines `term_relations` (session 31/03 2026)\n- 2 FK fantômes `cascade_prerequis` (session 31/03 2026)\n- 13 préfixes `[XX]` parasites dans `chain_etapes.role_dans_chaine` (audit #34)\n- 14 termes Claude-rédigés supprimés (commit af35413 - session 2026-04-20)\n- 2 termes pseudoscience (#160, #214) + 11 relations supprimées (session 2026-04-23)\n\n### Voir aussi\n\n- BQ `audit_thesaurus` (#155) — sémantique thésaurus\n- BQ `audit_corpus` (#156) — sémantique corpus\n- BQ `audit_log` (#56) — utilisation de la table audit_log\n- BQ `maintenance_thesaurus` (#53) — opérations CRUD termes\n- `tools/admin/check_integrity.py` — script unifié\n", "type": "workflow", "crit": true}, {"id": 56, "titre": "audit_log", "contenu": "Voir les dernières opérations :\nSELECT ts, operation, table_name, record_ref, substr(detail, 1, 100) FROM audit_log ORDER BY ts DESC LIMIT 20;\n\nLogger une opération :\nINSERT INTO audit_log (operation, table_name, record_ref, detail) VALUES ('UPDATE', 'terms', 'strate S', 'description...');\n", "type": "commande", "crit": false}, {"id": "cross_refs_dette", "titre": "Cross-refs et flux : tables droppées, audit dérivé à créer", "contenu": "# Cross-refs et flux — Décision architecturale 2026-05-06\n\n## Constat (Session F+1)\n\nLes tables `doc_cross_refs` (118 lignes) et `term_connections` (81 lignes) étaient\ndes **artefacts d'audits Opus de mars 2026** stockés sous forme de chaînes\ndescriptives sans FK propres :\n\n```sql\ndoc_cross_refs : doc_source(text), doc_cible(text), pour_concept(text), justification(text)\nterm_connections : strate_source(text), terme_source(text), connexion(text), importance(text)\n```\n\nPas de FK vers `documents.code` ni vers `terms.id` — juste du texte qui décrit\nune relation. Si on renomme un doc/terme, les refs deviennent silencieusement\nobsolètes.\n\n**Pire** : le contenu sémantique de ces 199 lignes appartient en réalité à\n4 destinations naturelles déjà présentes en DB :\n\n| Type observé | Destination naturelle |\n|---|---|\n| Mécanisme causal multi-docs | `chains_causales` + `chain_etapes` |\n| Concept transverse partagé | `concept_cards` avec `docs_codes` étendu |\n| \"Doc X devrait mentionner ce que dit doc Y\" | `prompts.enrichissement` du doc cible |\n| Doublon déjà capturé ailleurs | suppression |\n\nCes 2 tables **dupliquaient** des relations qui existent déjà sous forme\nrelationnelle propre dans le corpus.\n\n## Décision\n\n**Drop des 2 tables** + **snapshot historique** dans\n`jmj/rapports/audit/cross_refs_snapshot_2026-03-20.md` (199 lignes lisibles\nen markdown, conservées pour audit).\n\n**Tabs Cross-refs et Flux retirés** du `Publications/web/index.html` (template\nid=9 patché : -8865 chars, fonctions `CrossRefsTab()` et `ConnectionsTab()` supprimées).\n\n## Successeur : `tools/admin/audit_corpus_relations.py` ✅ CRÉÉ 2026-05-06\n\nL'objectif n'est pas de recréer une table d'annotations mais de **dériver\ndynamiquement** les lacunes et émergences depuis les relations primaires\ndu corpus.\n\n### Inputs (relations primaires)\n\n- `terms.doc_code` : terme rattaché à un doc (ou multi-doc via `/`)\n- `term_relations` : BT/NT/RT entre termes\n- `prompts.enrichissement` : notes éditoriales pour Jenni\n- `concept_cards.docs_codes` : carte qui s'applique à plusieurs docs\n- `concept_card_links` : liens carte ↔ carte\n- `chains_causales` + `chain_etapes` : flux causal docs → docs\n- `pedago_links` : liens carte ↔ doc\n- `fiche_sections.contenu` : contenu intégré (texte des fiches v4)\n\n### Calculs\n\n- **Co-occurrences** : termes mentionnés dans ≥N docs sans concept_card\n- **Mécanismes implicites** : motifs apparaissant dans plusieurs sections sans chain\n- **Convergences** : sources citées par plusieurs fiches sans concept_card\n- **Strates traversées** : chain_etapes inter-strates avec/sans bidirectionnalité\n\n### Sortie\n\n- `jmj/rapports/audit/lacunes_emergences_<date>.md` avec 2 sections :\n  - **Lacunes** : relation attendue non matérialisée → propose chain/card/enrichissement\n  - **Émergences** : cluster/pattern spontané → propose nouveau concept à creuser\n\n### Workflow\n\n1. Le script tourne périodiquement (mensuel ?)\n2. JMJ lit le rapport\n3. Pour chaque lacune/émergence intéressante : intégration au cas par cas\n   via le workflow normal (chain / card / enrichissement / fiche / validation)\n\n### Différence vs anciennes tables\n\n- **Ancien** : table figée, mise à jour manuelle (jamais), pas de FK\n- **Nouveau** : vue calculée, source = relations primaires, FK implicites\n- **Régénération** : à la demande, snapshot daté dans `jmj/rapports/audit/`\n\n## Lien avec le workflow notes volantes (BQ #102)\n\nL'audit corpus_relations est complémentaire au workflow d'intégration des\nnotes volantes (`jmj/notes*.txt`) :\n\n- Notes volantes → captures externes du corpus → intégration via concept_card / fiche\n- Audit corpus_relations → captures **internes** du corpus → matérialisation des\n  relations implicites en chain / card / enrichissement\n\nLes deux pipelines convergent vers le même objectif : **enrichir le corpus\nen explicitant ses relations**.\n\n## Dette pour Session H (à venir)\n\nCréer `tools/admin/audit_corpus_relations.py` :\n- Phase 1 : extraction features (terms, sources, concepts par doc)\n- Phase 2 : calcul co-occurrences et clusters\n- Phase 3 : confrontation avec relations existantes\n- Phase 4 : output markdown lacunes/émergences\n\nEstimation : ~2-3h dev + premier run avec validation manuelle JMJ.\n\n## Dette résolue Session H ✅ 2026-05-06\n\nScript `tools/admin/audit_corpus_relations.py` créé. Premier run :\n- **108 lacunes** détectées (3 termes multi-docs sans card, 28 chaînes sans\n  fiche zoom, 77 cards sans pedago_link)\n- **83 émergences** (62 sources convergentes ≥3 fiches, 21 chaînes haute\n  connectivité ≥3 strates)\n- **92 fiches à créer** (59 cards transverses sans zoom, 13 termes\n  transverses sans fiche, 20 sources haut impact)\n\nPremier rapport : `jmj/rapports/audit/lacunes_emergences_2026-05-06.md`.\nRégénération à la demande, sans agent_runner pour le V1 (analyse\nstatistique pure sur la DB).\n\n## Historique\n\n- **2026-03-20** : audit Opus initial génère doc_cross_refs (118) + term_connections (81)\n- **2026-04 → 2026-05** : corpus enrichi (Sessions B/C/D/E/F + intégrations fiches v4 +\n  thésaurus +193 termes + sources +659). Les 199 lignes deviennent obsolètes.\n- **2026-05-06 (Session F+1)** : drop tables, snapshot, doctrine cette BQ.\n- **2026-05-06 (Session H)** : `audit_corpus_relations.py` créé, premier rapport\n  généré (283 entrées : lacunes/émergences/fiches à créer).\n", "type": "doctrine", "crit": false}]}, "jenni-workflow": {"nom": "Workflow Jenni", "entries": [{"id": 137, "titre": "Parser docx Jenni — extraction des formules chimiques OMML obligatoire", "contenu": "## Parseur docx : inclure les formules Office Math ML (OMML)\n\nLes docx produits par Jenni contiennent **TOUTES les formules chimiques, mathématiques, indices et exposants** sous forme d'équations Office Math ML (`<m:oMath>` dans le XML Word). Ex : `NH₃`, `CO₂`, `Fe²⁺`, `NO₃⁻`, `k₁`, `k₂`, `ΔG`, `qCO₂`, `N₂`, `O₂`.\n\n**PIÈGE** : `python-docx` ne lit que `paragraph.text` qui IGNORE les `<m:oMath>`. Un parseur naïf récupère `(...)` vide à la place des formules. Résultat : 24 parenthèses vides dans les 215 termes du 2026-04-20 (`ammoniac ()`, `fer ferreux ()`, `CO₂ ()` → formules manquantes).\n\n**SOLUTION** — parseur XML custom qui :\n1. Parse `word/document.xml` via `xml.etree.ElementTree`\n2. Pour chaque `<w:p>`, parcourt les éléments :\n   - `<w:t>` → texte normal (en skippant ceux à l'intérieur d'un `<m:oMath>`)\n   - `<w:br>` → `\\n`\n   - `<m:oMath>` → conversion récursive en Unicode (sub/sup)\n3. Détecte et supprime les fallbacks texte que Jenni produit parfois après un oMath (ex: `NH₃NH3` → `NH₃`)\n\n**Mapping OMML → Unicode** :\n- `<m:sSub>` : base + chiffres en indices (`₀₁₂₃₄₅₆₇₈₉`)\n- `<m:sSup>` : base + chiffres en exposants (`⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻`)\n- `<m:sSubSup>` : base + indice + exposant (ex: `Fe²⁺` = Fe sub vide sup 2+)\n- `<m:f>` : fraction `num/den`\n\n**Implémenté dans** : `tools/jenni/import_termes_jenni.py::parse_docx()` (à partir du 2026-04-20).\n\n**Vérification** : après un import Jenni, chercher les `\\(\\s*\\)` dans `definition`, `rt`, `bt`, `syn_fr`, `syn_en`. Si > 0 occurrences, le parser est défaillant ou Jenni a produit des parenthèses vides réelles (rare).\n\n```python\nimport re\nfor r in cur.execute(\"SELECT id, fr FROM terms\"):\n    for f in ['definition','syn_fr','syn_en','bt','rt']:\n        content = cur.execute(f\"SELECT {f} FROM terms WHERE id=?\", (r[0],)).fetchone()[0] or ''\n        if re.search(r'\\(\\s*\\)', content):\n            print(f\"⚠ #{r[0]} {r[1]} [{f}]\")\n```\n\n**Autres sources à patcher** si formules aussi nécessaires :\n- `enrich_thesaurus.py::*` : pas encore de parser math-aware (à vérifier)\n- `integrate_fiche_docx.py` : les fiches utilisent aussi des formules (à vérifier)\n\n**Historique** : violation détectée 2026-04-20 (24 parenthèses vides dans 20 termes après import des docx thesaurus_1/2_20260420.docx). Corrigé en reparse avec OMML puis restauration 45 def + 1 rt. Parser officiel mis à jour.\n", "type": "technique", "crit": true}, {"id": 120, "titre": "Discipline BQ-clean — prompts jamais en contact avec méta-vocab", "contenu": "## Règle absolue BQ-clean — aucune fuite de méta-vocab dans les prompts Jenni\n\n**Liste noire** (vérifier AVANT génération de tout prompt Jenni) :\n\n- Codes doc : S0-S4, V1-V3, P1-P5, F1-F2, H1-H3\n- Vocab méta-projet : `corpus`, `strate`, `cross-ref`, `chaîne causale`,\n  `concept card`, `thésaurus`, `sol_vivant.db`, `section_key`, `doc_code`\n\n**Sources des leaks** (déjà rencontrés) :\n\n1. **terms.definition** : certains termes ont des définitions qui citent\n   des doc_codes (ex: \"Voir S2 — PGPR\") — violation directe.\n   → Audit et reformulation.\n\n2. **terms.fr / en** : concepts méta tels que\n   \"Chaîne 1 — Photosynthèse → Immunité intestinale\"\n   appartiennent à `chains_causales` (table dédiée), PAS à `terms`.\n   → Supprimer du `terms` si présents.\n\n3. **prompts.titre_h2 / contexte_sci / instructions / enrichissement** :\n   fuites manuelles fréquentes (cross-ref, chaîne causale).\n   → Scan régulier toutes colonnes texte.\n\n**Vérification systématique** :\n\n```python\nFORBIDDEN = [r'\\bchaîne causale\\b', r'\\bcross-ref\\b', r'\\bconcept card\\b',\n             r'\\bsol_vivant\\b', r'Corpus Le Sol Vivant', r'\\bdu corpus\\b',\n             r'\\bdans le corpus\\b', r'\\bthésaurus\\b', r'\\bthesaurus\\b',\n             r'\\bS[0-4]\\b', r'\\bV[1-3]\\b', r'\\bP[1-5]\\b',\n             r'\\bF[12]\\b', r'\\bH[1-3]\\b']\nfor pat in FORBIDDEN:\n    matches = re.findall(pat, text, re.IGNORECASE)\n    assert not matches, f\"Leak {pat}: {matches}\"\n```\n\n**À lancer à chaque régénération** des prompts_jenni_*.txt et\nprompt_fiche_*.docx.\n", "type": "regle", "crit": true}, {"id": 101, "titre": "Charte Jenni — règles opérationnelles (enrichissement thésaurus)", "contenu": "## Charte Jenni — règles opérationnelles (enrichissement thésaurus)\n\nSource : `docx/charte_de_recommandations_pour_un_travail_efficace.docx` — document produit par Jenni elle-même pour décrire son fonctionnement et ses attentes de prompt.\n\n**Portée** : s'applique principalement au workflow d'**enrichissement terminologique du thésaurus** mais les principes (bloc borné, balise de repère, structure immuable, validation de format) sont transposables à tous les prompts manuels envoyés à Jenni.\n", "type": "regle", "crit": true}, {"id": 109, "titre": "Comment Jenni comprend les instructions — modele mental (chartes)", "contenu": "## Comment Jenni comprend les instructions — modele mental (source : chartes Jenni)\n\nSource : deux chartes redigees par Jenni elle-meme (docx/charte_de_recommandations_pour_un_travail_efficace.docx et docx/charte_de_travail___fiches_techniques.docx).\n\n### Jenni est une co-redactrice sur document partage, pas un chatbot\n\nJenni ne repond pas a des \"commandes\". Elle **developpe un document existant** :\n- Elle scanne le document de travail via `fetch_document` pour comprendre la structure\n- Elle lit le plan pour savoir ou elle en est\n- Elle lit les graines (affirmations plantees) pour orienter ses recherches academiques\n- Elle travaille **section par section** dans le chat, pas tout d''un bloc\n- Si une section est vide (pas de graine), elle improvise — et risque de diverger\n\n### Le prompt .txt est le plan du document, le chat est le dialogue\n\n**Deux canaux distincts, deux roles distincts :**\n\n| Canal | Role | Contient |\n|---|---|---|\n| **.txt** (prompt) | Plan statique du document | Structure (chapitres, sous-chapitres), graines (affirmations a developper), termes canoniques |\n| **Chat Jenni** | Dialogue vivant | Demande section par section, remarques de Jenni, propositions de recherches, ajustements |\n\nLe .txt ne dialogue pas. Il pose le cadre. Le chat execute section par section.\n\n**Consequence pratique** : ne jamais mettre d''instructions (\"fais ceci\", \"ne fais pas cela\", \"cite en format X\") dans le .txt. Ces consignes passent par le chat.\n\n### Le prompt ideal est un document amorce\n\nLe prompt n''est pas une commande — c''est un **etat initial synthetique du document** pour lequel on demande un enrichissement. La redaction oriente naturellement la reponse :\n- Chaque phrase plantee est une graine que Jenni va developper et sourcer\n- La structure (I, II.1, II.2...) conditionne la structure du retour\n- Les termes scientifiques utilises dans les graines orientent les recherches de Jenni\n- Plus les graines sont precises et scientifiques, plus les recherches de Jenni sont poussees\n\n### Mecanismes internes de Jenni (reveles par les chartes)\n\n1. **Perte de fil en session longue** : Jenni peut perdre le contexte apres ~4-5 sections. Solution : travailler section par section dans le chat, avec balise de repere (\"on s''est arrete a la section V, reprends a VI\").\n\n2. **Divergence si document vide** : si le document ne contient pas de contenu apres le dernier point traite, Jenni improvise (invente des sections, change de sujet). Solution : planter des graines dans toutes les sections, meme minimales.\n\n3. **fetch_document** : Jenni scanne le document de travail pour se reperer. Elle voit la structure, les titres, les termes. D''ou l''importance d''une numerotation claire et de termes canoniques presents dans le corps du texte.\n\n4. **Recherches spontanees** : quand un sujet l''inspire ou qu''elle detecte un angle sous-documente, Jenni propose spontanement des recherches recentes via le chat. Ces propositions sont souvent les plus precieuses.\n\n5. **Format APA par defaut** : configure globalement dans le projet Jenni, pas besoin de le preciser dans les prompts.\n\n### Implications pour la construction des prompts\n\n| Faire | Ne pas faire |\n|---|---|\n| Ecrire le prompt comme si c''etait le debut du document | Ecrire le prompt comme une liste d''instructions |\n| Structurer avec chapitres numerotes (I, II.1...) | Laisser Jenni inventer la structure |\n| Planter des affirmations scientifiques comme graines | Poser des questions generiques |\n| Mettre les termes canoniques dans le corps du texte | Mettre une liste de termes en annexe deconnectee |\n| Travailler section par section dans le chat | Demander tout d''un coup |\n| Utiliser les balises de repere en session longue | Presumer que Jenni se souvient de tout |\n", "type": "reference", "crit": true}, {"id": 122, "titre": "Contraintes de rendu — docx destinés à Jenni (tous types)", "contenu": "## Contraintes de rendu — docx destinés à Jenni\n\n**S'applique à TOUS les .docx générés pour Jenni** : prompts de fiches\n(techniques ou transversales), ébauches de documents de strate, prompts\nde complétion, docx de travail.\n\n### 1. Hiérarchie des titres — Title / H1 / H2 / H3 (H3 max)\n\nJenni ne gère pas les titres au-delà de H3. Hiérarchie effective :\n\n- **Title** (python-docx level 0) : nom du document — un seul, en tête\n- **H1** (level 1) : chapitres = sections principales\n  (Plan, Introduction, sections body, Conclusion, Résumé, Références,\n  Glossaire, Annexes, Termes canoniques)\n- **H2** (level 2) : sous-chapitres\n  (Ex fiche technique : Contexte scientifique, Protocole, Indicateurs,\n  Précautions, Applications. Ex doc strate : 1.1, 1.2, 2.1… sous un H1 chapitre)\n- **H3** (level 3) : sous-sous-chapitres\n  (Ex fiche technique : Ingrédients, Équipement, Procédure sous Protocole)\n\n**Pas de H4** — toute sous-structure au-delà de H3 doit passer en texte gras\ninline, liste à puces ou paragraphe normal.\n\n### 2. Titre du document — court, sans accent\n\nJenni sauvegarde son document de retour en utilisant le titre (style Title)\ncomme **nom de fichier**. Le titre doit donc être :\n\n- **court** (≤ 5 mots si possible, idéalement 2-4)\n- **sans accent** (compatibilité système de fichiers : pas de é, è, à, ô, ç)\n- **sans caractères spéciaux** (virgules, dashes étendus `—`, tirets cadratins)\n\nImplémentation : dériver le titre du slug via une fonction\n`titre_court_sans_accent(slug)`. Ex : slug `'chelation-aminoacide-diy'` →\ntitre `\"Chelation Aminoacide DIY\"`.\n\nLe titre descriptif complet (avec accents, long) peut rester dans un\nen-tête métadonnées après le Title (ex : `# Fiche — [titre complet]`).\n\n### 3. Scripts concernés\n\nTous les scripts qui émettent du docx pour Jenni doivent respecter\nces contraintes :\n\n| Script | Rôle |\n|---|---|\n| `tools/jenni/gen_fiche_prompt_docx.py` | Prompts de fiches (tous types) |\n| `tools/jenni/gen_doc_ebauche.py` | Ébauches docs de strate |\n| `tools/jenni/export_thesaurus_incomplets.py` | Liste termes à compléter |\n\nEn cas de modification d'un de ces scripts ou de création d'un nouveau :\n- Titre → style Title (level 0), court sans accent\n- Chapitres (sections principales) → H1\n- Sous-chapitres → H2\n- Sous-sous-chapitres → H3 max (sinon texte gras)\n\n\n### 3. Pas de séparateurs / décorations ASCII\n\nAucune décoration ASCII dans le corps des docx destinés à Jenni :\n- Pas de lignes de séparation (`─ * 40`, `─ * 60`, `=========`, `---`)\n- Pas de banderoles de titres (`## TITRE ##`, `== SECTION ==`)\n- Pas d'ornements Unicode (`▸ ▪ ❯ ▰`)\n\nRègle cohérente avec la BQ Jenni qui interdit déjà l'encadrement de titres\net la décoration ASCII dans les prompts. La structure visuelle passe\nuniquement par la hiérarchie H1/H2/H3 native de Word (bonne pratique\néditoriale : le lecteur navigue via le volet Navigation).\n\nImplémentation corrigée 2026-04-14 :\n- `gen_fiche_prompt_docx.py` : suppression des `─ * 40`\n- `gen_doc_ebauche.py` : suppression de `SEPARATOR`, `add_separator()`\n\n\n### 4. Préférer la structure plate au sein d'un chapitre H1\n\nQuand un chapitre H1 a plusieurs sous-chapitres H2 au même niveau\n(ex : 5 blocs charte fiches techniques), **éviter d'ajouter des H3 dans\nl'un d'eux** — la remontée H3 → H2 crée une ambiguïté d'interprétation\ndans Word (fin du sous-groupe H3 ? ou retour niveau H2 parent ?).\n\nSolution : garder tous les sous-chapitres au même niveau H2, et utiliser\ndes **paragraphes avec préfixe gras** pour les sous-listes à l'intérieur\nd'un H2 (ex : sous H2 « Protocole » → paragraphe « **Ingrédients —** … »).\n", "type": "regle", "crit": true}, {"id": 146, "titre": "Règles de rédaction des documents Jenni — référence unique", "contenu": "## Règles de rédaction des documents Jenni — référence unique\n\n**Portée** : toute rédaction destinée à Jenni — prompts de documents de\nstrate, prompts de fiches, prompts de validation, prompts d'enrichissement\ndu thésaurus, docx de reprise, docx de travail. Pas de cas particulier :\nles règles ci-dessous s'appliquent **toujours**. Pour un workflow\nspécifique (thésaurus, fiche, validation, doc de strate), consulter les\nBQ workflow correspondantes, mais les règles de rédaction restent celles\nqui suivent.\n\n### 1. Le document = le document lui-même\n\nLe prompt **n'est pas une discussion avec Jenni**. C'est le document\ndans son état courant. Jenni le lit comme un auteur reprendrait son\npropre brouillon — elle voit le contenu, elle identifie les manques,\nelle enrichit.\n\n- Pas de métaphrases (« Jenni, rédige cette section », « à compléter\n  par Jenni »)\n- Pas de marqueurs `[à compléter]`, `[TODO]`, `[à développer]`\n- Pas de typographie distinctive pour marquer « déjà écrit » vs « à\n  développer » — prose continue, le style est identique partout\n\n### 2. La proposition = l'état du corpus à l'instant t\n\nClaude rédige ce que le corpus dit **aujourd'hui**, en prose continue,\navec la densité que l'état des connaissances actuelles permet. Pas\nd'amorce stylisée, pas d'italique « brouillon » — le document vit tel\nqu'il est. Jenni complète là où elle identifie un manque, comme un\nauteur reprend un brouillon.\n\n### 3. Contenu issu du corpus uniquement\n\nLa matière d'une rédaction Claude vient :\n- Du thésaurus (définitions, synonymes, relations)\n- Des concept cards (contenu des descriptions, pas leur identifiant)\n- Des chaînes causales (narration, pas leur code)\n- Des fiches déjà intégrées (contenu assimilé, pas leur numéro)\n- De `jenni_sources` (bibliographie interne)\n- Des PDF de `jmj/pdf/` (sources externes validées)\n- Des notes JMJ (synthèses, analyses, arbitrages)\n\nPas de sources sorties de la mémoire générale de Claude. Si une\naffirmation ne peut être sourcée par le corpus ou un PDF local, soit\non la retire, soit on la marque comme hypothèse à confirmer par Jenni.\n\n### 4. Zéro méta-vocab dans le texte\n\n**Interdiction absolue** dans tout document destiné à Jenni :\n\n- Codes documents : `S0, S1, S2, S3, S4, V1, V2, V3, P1, P2, P3, P4,\n  P5, F1, F2, H1, H2, H3`\n- Vocabulaire méta-projet : `corpus`, `Corpus Le Sol Vivant`, `strate`,\n  `cross-ref`, `chaîne causale`, `concept card`, `thésaurus`,\n  `sol_vivant.db`, `section_key`, `doc_code`\n- Renvois internes : `card #N`, `fiche #N`, `chaîne CN`, `doc XN`,\n  `cf. fiche X`, `cf. card Y`\n- Instructions internes : « voir chapitre X », « comme décrit dans…\n  (en interne) », références aux scripts, tables, DB\n\n**Jenni ne sait rien de l'organisation du corpus**. Elle lit un\ndocument autonome qui tient debout tout seul.\n\n**Vérification avant tout commit ou envoi** :\n\n```python\nimport re\nFORBIDDEN = [\n    r'\\bcard #\\d+\\b', r'\\bfiche #\\d+\\b', r'\\bchaîne C\\d+\\b',\n    r'\\bchaîne causale\\b', r'\\bcross[- ]ref\\b', r'\\bconcept card\\b',\n    r'\\bsol_vivant\\b', r'\\bdu corpus\\b', r'\\bdans le corpus\\b',\n    r'\\bthésaurus\\b', r'\\bthesaurus\\b',\n    r'\\b[SV][0-4]\\b(?![a-zA-Z])', r'\\b[PF][1-5]\\b(?![a-zA-Z])',\n    r'\\bH[1-3]\\b(?![a-zA-Z])', r'\\bdoc [SPVFH]\\d*\\b',\n]\n```\n\nZéro violation obligatoire avant tout commit.\n\n**Faux positifs des codes docs (ne PAS charcuter)** — les patterns\n`S/V/P/F/H + chiffre` collisionnent avec la notation scientifique. Sont des\nfaux positifs, à conserver tels quels :\n\n- **Histones** : `H3`, `H4` et leurs marques (`H3K4me3`, `H3K9me2`, `H4K16ac`…)\n- **Générations filiales** : `F0`, `F1`, `F2`, `F3` (transmission, priming transgénérationnel)\n- **Stades végétatifs / régions 16S** : `V3`, `V4`, `V5` (stades phénologiques, régions hypervariables `V3-V4`)\n- **Gènes / enzymes** : `F6'H1`, `S8H`, `CYP82C4`, `CYP98A2`…\n\n`check_forbidden_jenni.py` (durci 2026-05-24) restreint les patterns aux codes\nvalides (`S0-4`, `V1-3`, `P1-5`, `F1-2`, `H1-3`) et **filtre par contexte** :\nun code entouré d'« histone / méthylation / génération / transmission / région /\nstade / → » est ignoré. Le gate ne doit signaler que du **vrai méta-vocab**.\n\n### 5. Structure Word / Google Doc\n\n- **Title** (level 0) : titre du document, **court, sans accent**\n  (Jenni l'utilise comme nom de fichier), `≤ 5 mots`, `sans caractère\n  spécial` (pas de `—`, `,`, `é/è/à/ô/ç`)\n- **Heading 1** : chapitres (Introduction, 1. …, 2. …, Résumé,\n  Références)\n- **Heading 2** : sous-chapitres quand un H1 a plusieurs angles\n- **Heading 3** : max — au-delà, texte gras inline ou paragraphe\n- Pas de H4, pas de H5\n\nPas de décoration ASCII (`---`, `===`, banderoles, `▸ ▪ ❯`). La\nstructure visuelle passe par la hiérarchie Word native.\n\n### 6. Termes canoniques intégrés dans le texte\n\nLes termes du thésaurus apparaissent **dans les phrases**, orthographe\nexacte (`terms.fr`). **Jamais en liste séparée** en fin de document\n— la liste redondante invite Jenni à inventer des définitions locales\nparasites et duplique le thésaurus.\n\n### 7. Citations et bibliographie (format Google Doc)\n\n**Citations inline** : format APA `(Auteur, année)` ou `(Auteur\net al., année)` pour ≥ 3 auteurs. Intégrées au plus près de\nl'affirmation.\n\n**Bibliographie finale** : section `Heading 1 — Références`, une\nentrée par paragraphe, tri alphabétique par premier auteur, format\nAPA complet avec **DOI ou URL résoluble** à la fin.\n\n**Hyperliens internes** (pattern Google Doc natif Jenni) : chaque\ncitation inline pointe vers un bookmark sur l'entrée biblio\ncorrespondante. C'est le format naturel de Jenni en retour. Claude\nproduit le markdown, le script de génération docx assemble les\nhyperliens lors de l'export.\n\n### 8. Règle du « Bloc de 10 » (listes pour Jenni)\n\nToute liste d'items envoyée à Jenni en bloc (termes à définir,\nsynonymes à compléter, points à préciser) ne dépasse pas **10 par\nenvoi**. Au-delà, qualité des recherches documentaires diminue, risque\nde mélange de sources. Multi-lots = plusieurs fichiers successifs,\navec **balise de repère** (« dernier terme traité : X, nouveau bloc\ncommence à Y »).\n\n### 9. Listes triées alphabétiquement (`lower(fr)`)\n\nToute liste de termes destinée à Jenni est triée alphabétiquement\nsur le libellé FR (`ORDER BY lower(fr)`). Le tri ASCII\ncase-sensitive (`COV` avant `Candida`) perturbe Jenni — toujours\nutiliser `lower()`.\n\n### 10. Pas de conseils rédactionnels redondants\n\nJenni produit naturellement un style concis, académique, adapté au\ncontexte donné. Ne pas ajouter de méta-instructions du type « rédige\n1500 mots », « cite les sources », « respecte le vocabulaire ». Elle\ncite et assemble intrinsèquement. Les seules consignes qui ajoutent\nde la valeur sont :\n- Format de citation imposé (`[N]` numérique vs `(Auteur, année)`)\n- Structure attendue (H1/H2/H3 du document)\n- Périmètre de contenu (ce que le document doit couvrir)\n\n### 11. Refs et sources — cadre de vérification\n\nChaque affirmation scientifique dans le document doit pouvoir être\nsourcée. Trois statuts possibles :\n\n- **Déjà sourcée** : citation inline `(Auteur, année)` + entrée biblio\n- **Issue du corpus sans source directe** : Claude synthétise à\n  partir du corpus existant (définitions, cards, chaînes, fiches) sans\n  inventer. Jenni ajoutera les sources au besoin.\n- **Hypothèse non sourcée** : à éviter. Si nécessaire, formuler\n  prudemment, Jenni décidera si elle trouve matière à confirmer.\n\nNe jamais citer des sources externes que Claude ne peut pas vérifier\n(pas de Pittelkow 2015 sorti de la mémoire si ce n'est pas dans\n`jenni_sources` ou un PDF local).\n\n### 12. Cycle itératif Claude → Jenni → JMJ\n\nLa rédaction Claude est une proposition de départ, pas une vérité finale.\n\n1. **Claude sème** : structure + affirmations ancrées dans le corpus\n   + chiffres d'ordre de grandeur + références principales. Affirmer\n   proprement, pas éluder par peur de se tromper — Jenni rectifiera\n   si la littérature diverge.\n2. **Jenni enrichit et conteste** : recherche dans ses sources\n   académiques, modifie si nécessaire, ajoute ses sources.\n3. **JMJ révise** en plusieurs passes pour valider et renforcer les\n   sources faibles.\n\nLa qualité finale émerge des trois étapes.\n\n## Règles d'intégration du retour Jenni\n\n**Les mêmes règles de rigueur que la rédaction s'appliquent à l'intégration**, sauf pour le thésaurus qui a son workflow dédié (cf. fin de section).\n\n### A. Aucun docx Jenni ne rentre tel quel en DB\n\nTout document de retour Jenni passe par **analyse Claude + scripts\nd'import contrôlés**. Le .docx vit hors DB. La DB stocke le résultat\nstructuré de l'analyse consciente :\n\n- Contenu rédigé → `fiche_contenus.contenu_integre` (fiche) ou\n  `doc_contenus.contenu_integre` (strate)\n- Termes candidats extraits → table `terms`\n- Références bibliographiques → `jenni_sources` + DOI normalisé\n- Formules chimiques (OMML) → Unicode préservé via parser math-aware\n  obligatoire (sinon `()` vides)\n\n### B. Parser OMML obligatoire (formules chimiques)\n\nJenni écrit toutes les formules chimiques/indices/exposants (NH₃, CO₂,\nFe²⁺, k₁, NO₃⁻, …) en Office Math ML (`<m:oMath>`). Le parser Python\n`python-docx` ignore les `<m:oMath>` et produit des `()` vides.\n\nTout script d'import d'un docx Jenni **doit** utiliser un parseur XML\ncustom qui extrait `<m:oMath>` et le convertit en Unicode. Référence :\n`tools/jenni/import_termes_jenni.py::parse_docx()`, réutilisable.\n\nVérification post-import : scan `\\(\\s*\\)` sur tous les champs texte\nintégrés. Zéro parenthèse vide tolérée.\n\n### C. Déduplication avant insertion\n\nAvant tout INSERT, vérifier absence de doublon par axes multiples :\n\n- **Sources** : DOI normalisé, titre complet, titre court, auteurs + année\n- **Termes** : `fr` normalisé (accents, casse, pluriel), `en` normalisé,\n  syn_fr/syn_en croisés (8 axes, cf. `import_termes_jenni.py`)\n- **Concept cards** : `title` + `description` substring\n- **Fiches** : `slug` unique, `titre` proche\n\nSi doublon détecté → **UPDATE** (enrichissement) plutôt que **INSERT**,\nou BLOCK + arbitrage manuel.\n\n### D. Substitution citations et validation sources\n\nLes citations inline au format `(Auteur, année)` doivent être **traçables**\ndans la bibliographie finale du docx et dans `jenni_sources`. Les `n.d.`\n(no date) doivent être résolues avant intégration (via Crossref DOI ou\nrapport `jenni_sources` enrichi).\n\n### E. Audit log systématique\n\nTout INSERT / UPDATE / MERGE en DB s'accompagne d'une ligne dans\n`audit_log` (horodaté, opération, table, référence, détail). Traçabilité\nobligatoire.\n\n### F. Archivage post-intégration\n\nDès qu'une fiche passe en statut `integre` ou `integre_partiel`, les\nfichiers sources associés sont **automatiquement** déplacés dans leurs\ndossiers `archives/` respectifs :\n\n- `docx/<nom>.docx` → `docx/archives/<nom>.docx`\n- `recherches/fiches/prompt_fiche_*.docx` → `recherches/fiches/archives/`\n\nImplémenté dans `integrate_fiche_docx.py::archive_fiche_files()` appelé\nautomatiquement à la fin de `apply_integration()`.\n\n### G. Cycle itératif — même principe que la rédaction\n\nL'intégration Claude est une **analyse consciente**, pas automatique :\n\n1. **Lire** le docx attentivement (contenu scientifique, termes, refs)\n2. **Extraire** : termes candidats, refs DOI, formules, cards liées\n3. **Dédupliquer** avant INSERT\n4. **Intégrer** avec audit log\n5. **Vérifier** : parenthèses vides, dummy-citations URLs, leaks méta-vocab\n6. **Archiver** le docx source\n\nJMJ valide après chaque intégration majeure.\n\n### H. Exception thésaurus — workflow dédié et analyse consciente\n\nL'intégration d'un retour Jenni thésaurus (`thesaurus___strate_X.docx`,\n`thesaurus_N_YYYYMMDD.docx`) est un chantier d'**analyse consciente\nlourde**, pas un simple import. Chaque docx contient typiquement\n30-100 termes avec définition + EN + SYN_FR + SYN_EN + BT + RT +\nrefs biblio inline + biblio finale + formules chimiques (OMML). Toutes\nces dimensions doivent être traitées consciemment.\n\n**Enjeu structurel** : les termes canoniques sont **portés dans tous les\nprompts** (fiches, documents de strate, validations). La qualité du\nthésaurus conditionne directement la qualité des prompts et donc du\ncorpus final. Un terme mal défini, un synonyme absent, une relation\nBT/RT orpheline ou mal orientée, une casse incohérente — tout cela se\npropage aux prompts et donc au travail de Jenni. D'où le travail\nd'arbitrage éditorial lourd en amont : chaque entrée du thésaurus doit\nêtre **stable**, **non-ambiguë**, **correctement reliée**, **avec des\nsynonymes cohérents**. L'intégration est consciente parce que le\nthésaurus est l'ossature lexicale du corpus.\n\n#### H.1 Matching et anti-doublon 8 axes\n\nChaque terme entrant est confronté à 8 axes de match normalisés\n(`norm()` : casse, accents, apostrophes, pluriel simple) :\n\n| Axe | Description |\n|---|---|\n| 1 | `norm(TERME)` ∈ `terms.fr` — même FR existant |\n| 2 | `norm(TERME)` ∈ `terms.en` — notre FR matche un EN ailleurs |\n| 3 | `norm(EN)` ∈ `terms.fr` — notre EN matche un FR ailleurs |\n| 4 | `norm(EN)` ∈ `terms.en` — même EN existant |\n| 5 | `norm(TERME)` ∈ `terms.syn_fr` — synonyme FR ailleurs |\n| 6 | `norm(TERME)` ∈ `terms.syn_en` — synonyme EN ailleurs |\n| 7 | `norm(EN)` ∈ `terms.syn_fr` — croisé |\n| 8 | `norm(EN)` ∈ `terms.syn_en` — synonyme |\n\nRègle de priorité (fix 2026-04-21) : **si aucun match direct (axes 1-4)\net multi-match uniquement via synonymes (axes 5-8), INSERT permis** — la\npolysémie d'un syn_en entre plusieurs termes est tolérée si le `fr` est\nunique. Ex : `Substance humique` (fr unique) + `Humic substance`\n(syn_en présent dans deux termes distincts : humus et acides humiques\net fulviques) → INSERT légitime.\n\n#### H.2 Résolution BT/NT/RT et orphelines\n\nLes relations BT (Broader Term), NT (Narrower Term), RT (Related Term)\nfournies par Jenni en texte brut sont résolues vers `to_term_id` via\nl'index normalisé `fr | en | syn_fr | syn_en`. Workflow :\n\n1. `build_fr_index(con)` construit `{norm(champ) → term_id}` à partir\n   des colonnes terms (fr, en, syn_fr, syn_en)\n2. `write_relations(from_id, rel_type, raw_text)` split le texte brut\n   sur `;,·`, normalise, cherche dans l'index, insère en\n   `term_relations` avec `to_term_id` résolu (ou NULL si orphelin)\n\n**Orphelines** : beaucoup de cibles BT/RT pointent vers des termes\nnon présents dans le thésaurus (formes courtes génériques, catégories\ntaxonomiques, hyperonymes non créés). Elles sont stockées en\n`to_term_text` avec `to_term_id = NULL`. C'est **informatif** (on\nvoit quels concepts Jenni relie), pas toujours à combler (cf. règle\ndoctrinale : le thésaurus est un vocabulaire contrôlé, pas une\nencyclopédie).\n\n**Re-résolution périodique** : après chaque intégration d'un lot de\nnouveaux termes, repasser sur toutes les orphelines existantes\n(`to_term_id IS NULL`) pour vérifier si les nouveaux termes n'ont pas\nrendu résolubles d'anciennes cibles. Gain typique : +5 à +10 % de\nrésolution par passe.\n\n#### H.3 Arbitrage éditorial conscient\n\n**Fusions de termes** (doublons latents, ex : `antibiorésistance` ↔\n`résistance aux antibiotiques`) :\n\n- Détection : syn d'un terme = fr d'un autre terme (scan périodique)\n- Décision : qui garde ? → JMJ arbitre selon convention éditoriale\n- Exécution : script `resolve_import_conflicts.py --apply` + merge\n  manuel consciencieux (syn_fr/syn_en concaténés, relations migrées,\n  doublons supprimés)\n\n**Nettoyage syn_fr erronés** (hiérarchie confondue avec synonymie) :\n\n- Cas : `goethite` est syn_fr de « Oxydes Fe/Al » → c'est un membre,\n  pas un synonyme\n- Correction : retirer de `syn_fr` + créer une RT ou BT/NT vers le\n  terme spécifique correspondant\n\n**Polysémie et acronymes** — cas comme `MO` vs `Mo` (Matière organique\nvs Molybdène) : `norm()` les collisionne à tort → utiliser `--skip-fr`\ndans `resolve_import_conflicts.py` pour protéger.\n\n#### H.4 Règle absolue : ne jamais modifier `terms.fr` automatiquement\n\nLe champ `terms.fr` est la **clé éditoriale** qui fait l'aller-retour\navec Jenni. Toute modification automatique (casse, ponctuation,\nespaces, apostrophes, tirets) crée un cycle vicieux : export avec\nforme modifiée → Jenni retourne la forme modifiée → la forme originale\nest perdue définitivement.\n\nInterdictions strictes :\n- Scripts de normalisation automatique de casse/ponctuation sur `fr`\n- Agents Task qui décident d'un changement de libellé\n- Règles typographiques abstraites (française, ISO 25964) appliquées\n  au `fr` existant\n\nAutorisé :\n- Modifications ciblées d'UN terme après validation explicite JMJ\n- Classification / analyse / comptage par agents Task\n- Normalisation sur champs secondaires (definition, syn_fr, syn_en,\n  bt, rt) qui ne font pas clé avec Jenni\n\n**Incident 2026-04-20** : Chantier A avait baissé la Majuscule initiale\nde 216 termes (« Antifragilité » → « antifragilité ») selon règle\ntypographique française — or Jenni utilise la Majuscule initiale\n(convention thésaurus). Cycle cassé de justesse. À ne jamais\nreproduire.\n\n#### H.5 Résolution citations `n.d.` pre-intégration\n\nJenni peut produire des citations inline `(Titre, n.d.)` quand elle n'a\npas extrait la date d'une source. Workflow de correction avant\nintégration :\n\n1. Extraire le RIS du docx, identifier les refs biblio avec DOI\n2. Résoudre les DOI via Crossref (gratuit, pas de clé) pour récupérer\n   année + auteurs + journal\n3. Produire un RIS enrichi (nouveau fichier, ne modifie pas l'original)\n4. Patcher le docx en substituant les `(Titre, n.d.)` par `(Auteur,\n   année)` — opération mécanique length-preserving pour préserver la\n   structure des runs Word (`<w:t>`, `<w:br>`)\n5. Re-vérifier : 0 `n.d.` restant avant intégration en DB\n\nCe patch n'est **pas** de la rédaction (c'est une substitution de\nmétadonnées factuelles vérifiables) — donc autorisé côté Claude sans\npasser par Jenni.\n\n#### H.6 Reclassement strates et doc_code\n\nLes nouveaux termes entrent par défaut en strate arbitraire (souvent S).\nReclassement nécessaire selon le **thème** du terme :\n\n- **F** : fondements, thermodynamique, évolution, politique, économie\n- **S** : sol, rhizosphère, bactérie du sol, cycle biogéochimique\n- **V** : plante, racine, photosynthèse, symbiose plante-microbe\n- **P** : pratique, rotation, couvert, compost, biochar, fermentation\n- **H** : humain, intestin, microbiome humain, santé, allergie\n\nClassification par heuristique mots-clés dans fr + definition. Les\nindécidables restent en S par défaut. JMJ corrige les cas particuliers\nà l'œil (ex : `érosion` classé automatiquement en H par co-occurrence\navec « humain » alors qu'il est clairement S).\n\n#### H.7 Audit post-intégration obligatoire\n\nAprès chaque `--apply`, vérification systématique :\n\n- **Diff source docx / DB** : chaque terme intégré doit avoir ses\n  DEF/SYN_FR/SYN_EN/EN identiques à la source (whitespace normalisé)\n- **Parenthèses vides** `\\(\\s*\\)` dans def/syn → 0 toléré (indicateur\n  de formule OMML mal parsée)\n- **URLs dummy-citation** `dummy-citation.com` → 0 toléré (artefact\n  Google Docs à nettoyer par le parser)\n- **n.d.** dans les définitions → 0 toléré (traité en pre-intégration)\n- **Relations BT/RT résolues** : compter le ratio résolues/orphelines\n  par type\n- **Re-résolution globale** des orphelines préexistantes\n- **Audit strates et docs_code** sur les nouveaux termes\n- **Scan doublons latents** (syn d'un = fr d'un autre) pour arbitrage\n  ultérieur\n\n#### H.9 Discipline amont — termes envoyés à Jenni doivent être propres\n\n**Règle opérationnelle** : toute liste de termes préparée pour Jenni\n(liste à puces, prompt, tableau d'entrée) doit être **vérifiée\northographiquement avant envoi**.\n\nPourquoi c'est critique :\n\n- **Jenni ne corrige pas l'orthographe.** Elle traite ce qu'on lui\n  donne tel quel — une casse bizarre, une ponctuation surnuméraire,\n  un accent manquant : elle les reproduit dans son retour docx.\n- **Le retour devient la nouvelle référence.** Au réimport, la forme\n  altérée écrase la forme originale en DB. Au cycle suivant, la\n  forme altérée part à nouveau chez Jenni → verrouillage définitif.\n- **Ça casse le flow de Jenni.** Une forme étrange (*Biodiversité*\n  avec double espace, `mycorhize,` avec virgule parasite,\n  `Mycorhize` mélangé avec `mycorhize` dans la même liste) perturbe\n  son traitement par bloc de 10, elle hésite, produit des variantes\n  non désirées, ou rate des entrées.\n\nContrôles obligatoires avant envoi à Jenni :\n\n1. **Tri `ORDER BY lower(fr)`** — évite les mélanges de casse\n   (`COV, Candida, CUE` en ASCII-tri vs `Candida, COV, CUE` en\n   tri normalisé)\n2. **Casse cohérente** : convention thésaurus = Majuscule initiale\n   pour les concepts + minuscule pour les taxons latins ajustés\n   (ex : *Rhizobium*). Vérifier la cohérence à l'œil sur la liste\n3. **Pas de ponctuation parasite** : pas de virgule terminale, pas de\n   point final, pas de double espace, pas de `-` en début\n4. **Apostrophes normalisées** : préférer l'apostrophe droite `'`\n   ou l'apostrophe typographique `'` selon convention adoptée, mais\n   jamais mélangées dans une même liste\n5. **Forme canonique** : si un terme existe en DB, envoyer la forme\n   exacte `terms.fr` — pas une variante orthographique\n\n**Outil** : `export_thesaurus_incomplets.py` et\n`gen_prompt_thesaurus.py` appliquent déjà ces règles (tri\n`lower(fr)`, forme `terms.fr` exacte, filtre `flag_pseudoscience=1`).\nLes listes manuelles (fiche prépa, prompt ad-hoc) doivent être\nvérifiées avant envoi — à l'œil ou via scan `check_integrity.py`.\n\n**Lien avec H.4** : H.4 interdit la modification automatique du\n`terms.fr` en DB. H.9 impose en amont que la forme envoyée soit\npropre. Les deux règles forment le **cycle fermé qui protège\nl'intégrité du thésaurus** contre la dérive orthographique\ninconsciente par l'aller-retour Jenni.\n\n#### H.8 Scripts et fonctions clés\n\n- `tools/jenni/import_termes_jenni.py` : import principal, matching\n  8 axes, modes `--replace` / `--insert-only`\n- `tools/jenni/resolve_import_conflicts.py` : résolution bloqués\n  multi-match avec `--skip-fr`\n- `tools/admin/dedupe_thesaurus.py` : déduplication périodique\n- `tools/lib/term_rels.py::build_fr_index()` + `write_relations()`:\n  résolution FK `to_term_id`\n- `tools/lib/term_rels.py::norm()` : normalisation matching (casse,\n  accents, apostrophes, pluriel)\n\nVoir BQ dédiées pour les workflows opérationnels détaillés.\n\n## BQ workflow spécifiques (consulter en complément)\n\nPour le **workflow opérationnel** propre à chaque type de document\n(quand exporter, comment générer le docx, comment intégrer le\nretour…), consulter la BQ workflow correspondante :\n\n- **Thésaurus** : workflow import/export/complétion (BQ thesaurus)\n- **Fiches** : création/Jenni/intégration consciente, structure\n  `fiche_sections` (BQ fiches)\n- **Validations** : workflow comblement de dette (BQ validations)\n- **Documents de strate** : prompts de strate via `export_jenni_doc.py`\n  (BQ strate)\n\nLes règles ci-dessus s'appliquent à **tous**, sans exception.\n\n### Historique\n\n- **2026-04-21** : consolidation unique des règles de rédaction.\n  Remplace l'éparpillement antérieur sur #3, #40, #89, #115, #120,\n  #130, #145, #101, #104, #109, #121, #122. Origine : session\n  2026-04-21 où Claude a violé 106 fois les règles sur 14 fiches par\n  manque de visibilité sur les garde-fous dispersés. BQ synthétique\n  consolidée + affichage au session_start via\n  `claude_rules.redaction_documents_jenni`.\n", "type": "workflow", "crit": true}, {"id": 158, "titre": "Pratiques naturelles typées hors-périmètre Jenni — KNF, JADAM, EM-Higa, LiFoFer, ferments", "contenu": "## Pratiques naturelles typées hors-périmètre Jenni\n\n### Règle absolue\n\nLe corpus Sol Vivant documente des **mécanismes scientifiques génériques**, pas des **recettes praticiennes**. Les pratiques naturelles dites « typées » — KNF, JADAM, EM-Higa, LiFoFer, bokashi, ferments traditionnels — sont des **instances paysannes** de mécanismes universels (fermentation lactique, hydrolyse enzymatique, anaérobiose dirigée, pression osmotique, etc.). Ce sont les mécanismes qui entrent dans le corpus, pas les recettes.\n\n### Pourquoi exclure Jenni de ces sujets\n\nJenni est un assistant de rédaction académique généraliste. Sur les pratiques typées, son corpus d'entraînement contient peu de littérature praticienne (Cho Han Kyu, Cho Youngsang, Higa, manuels paysans coréens/japonais). Empiriquement constaté : Jenni mélange acronymes (FAA → fermentation poisson générique), inverse les étapes aérobie/anaérobie, donne des ratios inexacts. Autant de bêtises que de vérités. **Risque inacceptable pour un corpus scientifique.**\n\n### Liste des pratiques typées (à date)\n\n- **KNF** (Korean Natural Farming, Cho Han Kyu) : IMO, FAA, FPJ, FFJ, OHN, BRV, LAB, WCA, WCP, BIO-9, OHN, SOWS, séries SA-N…\n- **JADAM** (Cho Youngsang) : JMS, JLF, JNP, etc.\n- **EM-Higa / Bokashi** : EM-1, fermentation anaérobie sons + microorganismes effectifs\n- **LiFoFer** (Lithuanian Forest Fermentation) : ferments solides/liquides à base de forêt\n- **Ferments traditionnels** : kefir, kimchi, choucroute, ensilage (recettes — les mécanismes restent)\n- **Préparations de biofertilisants paysans** sud-américains (Cuba EM, biofertilizantes brésiliens) — quand la doctrine prime sur le mécanisme\n\n### Sources autoritaires (jmj/pdf/)\n\n- **KNF** : `KNF - chos-global-natural-farming-sarra.pdf` (Cho Han Kyu général), `KNF - Dr Hoon Park III - Indigenous Microorganism(IMO).pdf`, séries inputs (FAA, FPJ, LAB, OHN, BRV, WCA, WCP, BIO-9, SA-1 à SA-19)\n- **JADAM** : `youngsang-cho-jadam-organic-farming_-the-way-to-ultra-low-cost-agriculture-jadam-2016-1.pdf`\n- **Fermentation lactique académique** : `LAB.pdf`, `LABresearch.pdf`\n- **LiFoFer** : `Lifofer_10.12.2024_Rezomes(5).pdf`, `Recettes-Lifofer-solides-liquides-et-reactivations.pdf`, `guide-lff-2018.pdf`\n- **EM/Bokashi** : `Agriton_EM_Fermentation-Bokashi-vs-Composting-...pdf`, `Bokashi as a soil improver (3 years).pdf`, `em-cuba.pdf`\n- **Biofertilisants généraux** : `Préparations de biofertilisants.pdf`, `Matière Microorganismes photosynthétiques.pdf`\n\n### Doctrine éditoriale corpus\n\n**Une fiche scientifique se construit sur le mécanisme**, jamais sur la recette. Exemple : pas de fiche « LAB-KNF » ni « LiFoFer », mais une fiche **« Fermentation lactique »** (Lactobacillus, baisse pH, biotransformation, conservation par compétition microbienne) qui mentionne KNF-LAB, LiFoFer, kefir, kimchi, choucroute, ensilage comme **instances illustratives**.\n\n### Workflow accepté pour ces sujets\n\n- **Sources directes** (PDFs `jmj/pdf/`) lues par Claude ou JMJ\n- Rédaction par **JMJ** ou **Claude** (extraction et synthèse) — jamais Jenni\n- Mention des acronymes-recettes **en clair** dans cards/fiches (ex. « Fish Amino Acid de Cho Han Kyu ») — pas indexés dans le thésaurus\n- **Cards philosophie** acceptables : comparer logiques épistémiques (KNF artisanal ciblé vs JADAM paysan mass-scale vs EM-Higa SynComs commercialisé vs LiFoFer minéral)\n\n### Workflow interdit\n\n- Demander à Jenni de définir/rédiger sur ces sujets\n- Indexer les acronymes-recettes (FAA, FPJ, LAB-KNF, JMS, etc.) comme termes thésaurus\n- Confondre KNF et JADAM (deux écoles distinctes, presque opposées)\n- Présenter une recette comme contenu scientifique du corpus\n\n### Flag termes : flag_pratique_typee\n\nLa table `terms` reçoit un nouveau champ `flag_pratique_typee` (INTEGER 0/1) — distinct de `flag_pseudoscience`. Les termes flaggés sont **exclus des exports vers Jenni** (`enrich_thesaurus.py`, `gen_prompt_completion.py`, `export_thesaurus_incomplets.py`) mais permis en clair dans cards/fiches.\n\n### Gate intégration\n\nLe gate `tools/jenni/integrate_fiche.py` détecte les acronymes-recettes dans les retours Jenni. Une fiche contenant `FAA`, `FPJ`, `JMS`, `JLF`, `OHN`, `LAB-KNF`, `WCA`, `IMO` (au sens KNF), `BIO-9` etc. passe en `integre_partiel` avec alerte — JMJ arbitre (rééditer ou accepter si mention contextualisée).\n\n### Mode dégradé existant\n\nLes fiches DIY actuelles intégrées avant cette doctrine restent en l'état (mode
