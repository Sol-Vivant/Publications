ssent quand même à l'intégration. Pas de perte de contenu.\n\n**Conséquence éditoriale** : la structure Word native du docx retour Jenni est non-canonique. Si la fiche est ré-éditée ou exportée, les niveaux Word peuvent rester incorrects.\n\n**Action recommandée** : signaler explicitement à Jenni dans le brief éditorial (étape 1) la convention \"TOUS les titres de section principale en H1 (Heading 1), pas en H2\" pour éviter la dérive. Vérifier post-intégration que le `contenu_integre` a bien tous les `## N.` au niveau H2 markdown (correspondance level=1 Word → ## markdown).\n\n**Garde-fou pipeline** : pas d'action automatique — la robustesse vient du matching numéro. Mais possible enrichissement futur du parser pour détecter les niveaux Word incorrects et émettre un warning gate au dry-run.\n\n---\n\n### Règle \"plan détaillé dans le brief\" — structure PLATE (mise à plat fiche/graine 2026-05-30)\n\n**Principe** : c'est le brief + le plan structurel qui déterminent la structure du\ndocx retour (\"notre prompt influence la rédaction, pas l'inverse\").\n\n**Règle opérationnelle (structure plate)** : le plan = **sections H1 uniquement**\n(6-7 H1 pour une transversale/zoom ; un H1 = un seul angle). **Pas de H2 imposé** :\nles sous-points de chaque section sont décrits **en prose dans la graine**\n(`fiche_sections.contexte_sci`), jamais en sous-titres Word. Si un angle est trop\nlarge, en faire un H1 distinct (pas un H2). La structure fine sous un H1 est laissée\nà Jenni. **H4 = jamais** (gate) ; une prose de graine claire évite que Jenni\nmultiplie les niveaux.\n\n**Références — inline vérifié, jamais auto.** Placer les `(Auteur, année)` **inline,\ndans le texte, à l'affirmation soutenue**, et **uniquement des sources vérifiées**\n(auteur + année + sujet réellement présents dans le corpus). Si pas de source sûre →\n**pas d'ancre** (Jenni sourcera) ; **jamais inventer**. Le bloc auto « Sources\nmobilisables sur cette section… » émis depuis `source_usages` est sujet aux **faux\npositifs** (attribution erronée, nom non translittéré type « Кунах ») → **à proscrire\nen rédaction manuelle**. Bloc « Références » final en APA. **Opérationnel : toute réf\ncitée inline doit être (a) une citation standalone propre — jamais noyée dans une autre\nparenthèse — et (b) liée à la fiche dans `source_usages`, sinon `gen_fiche_docx` n'émet\npas son entrée dans le bloc Références (cas vécu fiche #238).** Voir la section suivante\npour le mécanisme `source_usages` et la vigilance faux positifs.\n\n**Historique** : l'ancienne règle « lister H1 ET H2 explicitement » (directive\n2026-05-05, cas #91 métaux lourds) est **abandonnée** depuis la mise à plat\nfiche/graine (2026-05-30). Modèles : fiches plates récentes (mesure biodiversité,\neffet Birch).\n\n### Références du corpus dans les graines + peer review (2026-05-25, durci 2026-05-28b)\n\n**Références dans les graines — SYSTÉMATIQUE.** Quand on prépare/reprend une fiche,\nles graines portent les sources qu'on a **déjà** dans le corpus (`jenni_sources` via\ncroisement avec les fiches voisines et le brief) :\n- citations `(Auteur, année)` **inline**, aux affirmations qu'elles soutiennent ;\n- section « Références » finale en APA, **DOI en texte, sans hyperlien Word interne**\n  (Jenni réassocie citation ↔ entrée par le texte — mécanisme natif ; un hyperlien\n  cliquable est inutile).\n\nBut : Jenni ne **re-tisse pas** les liens qu'on a déjà → elle consacre sa recherche à\nenrichir et à apporter les sources manquantes. **Ne jamais forcer** : uniquement les\nsources réelles du corpus (zéro invention). Sujet nouveau sans source = normal, Jenni\nsourcera. `gen_fiche_docx.py` émet la section Références en mode graine depuis\n`source_usages` (évolution de l'ancienne doctrine §3 qui interdisait tout bloc\nRéférences en graine). Modèle de référence : fiche #129 (2026-05-25).\n\n**Critique JMJ 2026-05-28b — sans ancres `(Auteur, année)` dans la graine, Jenni\nne peut PAS réassocier la citation à l'entrée Références.** Émettre uniquement le\nbloc Références terminal sans aucun marqueur dans le corps de graine rend la biblio\n**invisible et inopérante** : Jenni la voit mais ne sait pas à quelle affirmation\nelle correspond → la biblio est perdue à la rédaction.\n\n**Mécanique d'attribution (graine `recreee` uniquement)** — implémentée dans\n`gen_fiche_docx.py` 2026-05-28b :\n\n1. Pour chaque ref liée via `source_usages`, lire `su.contexte` (mémoire du titre\n   de la section où elle apparaissait dans la v_précédente).\n2. Extraire un **numéro de section** par regex `^\\s*(\\d+(?:\\.\\d+)?)[.)]` (repli\n   sur la section parente si plan plat) → ref attribuée à la section de même\n   ordre. Seules les refs **ancrées** alimentent le bloc Références.\n3. Émettre le **bloc Références final** en APA, **dédoublonné par œuvre** (clé\n   DOI, à défaut auteurs+année+titre) : une source liée à N sections n'apparaît\n   qu'une fois (correctif 2026-06-03 ; auparavant émise N fois).\n\n> ⚠ **2026-06-03 — lignes récap auto SUPPRIMÉES.** Les anciennes émissions\n> « Sources mobilisables sur cette section : … » et « Sources additionnelles\n> mobilisables : … » ne sont **plus produites** : redondantes avec les ancres\n> `(Auteur, année)` désormais posées **à la main** dans la graine (cf. ci-dessous).\n> Le docx ne contient que **citations inline + bloc Références**. Code mort retiré\n> (`_autaa`, `section_refs_inline`).\n\nLimites assumées : le matching par numéro est imparfait (la graine recréée a\nsouvent un plan révisé, et certains contextes sont vides ou génériques type\n« biblio fiche »). Mais c'est l'heuristique maximale automatisable. Jenni\nréinjecte les `(Auteur, année)` en inline pendant la rédaction selon les\naffirmations soutenues — exactement comme avec un brief manuel.\n\n**Standard depuis 2026-06-03 (ex-« idéal futur », désormais réalisé)** : Claude\nenrichit `fiche_sections.contexte_sci` avec les ancres `(Auteur, année)` placées\n**au mot près**, aux affirmations qu'elles soutiennent, en puisant dans les\nsources **ventilées par section** (`su.contexte` numéroté). Travail de synthèse\nqui requiert Claude/JMJ — **jamais d'agent** (`pas_agent_redacteur`). Discipline :\nne citer inline **que** des sources présentes dans `source_usages` (sinon l'ancre\nn'a pas d'entrée Références correspondante).\n\nFormat APA inline : `(Smith et al., 2020)` pour multi-auteurs (≥2), `(Smith,\n2020)` pour mono-auteur. Premier nom de famille uniquement.\n\n**Peer review — DISCRÉTIONNAIRE (hors workflow fixe).** JMJ déclenche une revue par les\npairs (via Jenni) **au gré des besoins**, typiquement pour un sujet critique pour le\ncorpus. **Ce n'est PAS une étape systématique** du workflow. Nombre de passes **variable**\n(~3 sur un sujet bien publié ; davantage pour les sujets en marge des références\nacadémiques / peu publiés). Rôle de Claude : à chaque review reçue, **ajuster les graines**\n(`fiche_sections.contexte_sci`) pour intégrer les critiques de fond, puis régénérer le\ndocx pour la passe suivante. Effet observé (#129, 3 passes) : grâce aux références\nfournies, la revue ne signale plus « non sourcé » et attaque le fond (trade-off\ncroissance-défense, mécanismes récepteurs, limites au champ) → la fiche passe d'erreurs\nde fond à du fignolage référentiel.\n\n**Vigilance croisement — faux positifs.** Le matching d'une source du brief vers\n`jenni_sources` (LIKE sur `auteurs`) renvoie beaucoup de **faux positifs** : homonymes /\nco-auteurs récents sans rapport avec le sujet (ex. observés 2026-05-25 : « Calvet » →\nCarlino microbiome, « Slaughter » → Devkota soil-health, « Galet » → Canuto RNAi). Et\nmême un bon auteur peut renvoyer un **autre article / une autre année** que la ref citée\n(ex. brief « Luna 2012 » alors que le corpus a Luna 2011/2016 → ne PAS lier, risque de\nfausse attribution). **Règle : vérifier auteur + année + cohérence du sujet avant de lier ;\nen cas de doute, ne pas forcer (Jenni sourcera).** Gain du croisement très variable :\nnet pour les sujets recoupant le corpus (#129), nul pour les sujets en marge (#133\ncalcaire — sources classiques absentes), modeste pour #199 (Luna écarté).\n\n**Chantier futur (session dédiée)** : **état de santé clinique des fiches déjà en base**\n+ **audit des refs existantes** (`source_usages`, 9 703 liens) pour détecter les faux\npositifs / fausses attributions accumulés, sur le modèle de la vérification faite ici.\n\n**Tags d'état métadonnées `jenni_sources` (posés 2026-05-25, préfixe `META:`).** Audit de\nqualité de la biblio (champ `tags`, JSON array) — 226 refs taguées, filtrables pour\ncomplétion : `META:titre_manquant` (160), `META:annee_manquante` (47), `META:sans_lien`\n(142, ni DOI ni URL), `META:auteurs_manquants` (6). Une ref taguée a des métadonnées\nincomplètes (entrée Références dégradée si utilisée telle quelle). Filtrage :\n`SELECT id, auteurs, annee FROM jenni_sources WHERE tags LIKE '%META:titre_manquant%'`.\nLe champ `tags` (et non `notes`) est destiné aux **marqueurs Zotero** : tout enrichissement\nd'état d'une ref va dans `tags`, jamais dans `notes`.\n\n### Redo d'une fiche intégrée — graine corpus-aware re-sourcée (2026-06-03)\n\nPour **refaire** une fiche déjà `integree` dont le retour Jenni porte des scories\n(méta-notes, `[CITE]` non résolus, doublons, sections tronquées), on **régénère sa\ngraine** sans toucher à l'intégré affiché. Recette (modèles : **#84** trophobiose\nChaboussou, **#219** AGCC/butyrate) :\n\n0. **Audit corpus (obligatoire, étape 0).** Pour la fiche cible, sortir : chaîne(s)\n   causale(s) + étapes, cards liées (`card_chain_links`, `concept_cards`), fiches\n   voisines (`fiche_articulations`), et surtout la **ventilation des `source_usages`\n   par préfixe de `contexte`** (`1.`, `1.1`, `2.`…) — c'est la biblio déjà attribuée\n   section par section, socle des ancres inline.\n1. **Brief** (`fiches.notes`) corpus-aware : besoin, sources autoritaires, données\n   chiffrées, paradigmes, articulation (chaîne/cards/voisins). Reste **interne** —\n   jamais dans le docx. Si la fiche a déjà un bon brief, l'enrichir (marqueur redo).\n2. **Graines** (`fiche_sections.contexte_sci`) : prose **mécanistique dense** (Jenni\n   est une IA — langage mécanistique, pas de vulgarisation), avec ancres\n   `(Auteur, année)` **inline** puisées dans les sources ventilées de la section.\n   ZÉRO méta-vocab ; ZÉRO gabarit (« Mécanismes : … » / « Termes : … » **proscrits** —\n   termes intégrés au fil du texte, #146.6). Cible ~1000-1200 c/section ; total ~8-10k (un\n   zoom très sous-sectionné peut monter, **jamais ≥ 12k**).\n3. **Statut** : `graines.statut='recreee'` (sinon pas de bloc Références auto en\n   mode graine).\n4. **Génération + contrôle** : `gen_fiche_docx.py --fiche-id <N>` → scan méta-vocab\n   (regex FORBIDDEN, #146.4) + **zéro doublon biblio** + **absence** de ligne\n   « Sources mobilisables ».\n5. **Affichage** : le redo **ne change pas** le Cahier (la fiche `integree` montre son\n   `fiche_retour_sections`) ; la nouvelle graine ne vit qu'au **prochain cycle Jenni**\n   (envoi → enrichissement ×N → ré-intégration).\n\nCitations inline + bloc Références = doctrine #146.7. **Rédaction = Claude direct,\njamais d'agent** (`pas_agent_redacteur`). Backup DB avant écriture ;\n`wal_checkpoint(TRUNCATE)` avant `git add sol_vivant.db`.\n", "type": "workflow", "crit": true}, {"id": 121, "titre": "Charte fiches techniques DIY — structure spécifique", "contenu": "## Charte fiches techniques DIY — structure spécifique\n\nCharte spécifique aux fiches `type='technique'` — protocoles DIY, préparations biologiques, méthodes de mesure à la ferme. Source initiale : `docx/charte_de_travail___fiches_techniques.docx` rédigée par Jenni en 2026-04.\n\n**S'applique à** : `chelation-aminoacide-diy`, `knf-jadam-preparations`, `ipmo-jakoba-natural-farming`, `rhodopseudomonas-palustris`, `diagnostic-seve-ph-ec` et toute nouvelle fiche technique à venir.\n\n### Structure générale (héritée des fiches transversales)\n\nIdentique aux fiches transversales pour l'ossature :\n\n```\n[Title court sans accent ≤ 5 mots]\n\n[H1] Introduction\n[H1] 1. [Titre section 1]  (avec 5 H2 — voir détail ci-dessous)\n[H1] 2. [Titre section 2]  (avec 5 H2)\n...\n[H1] Résumé\n[H1] Termes canoniques en fin (Jenni §1.C)\n[H1] Références\n```\n\n### Spécificité : 5 sous-blocs H2 immuables par section numérotée\n\nChaque section body H1 numérotée contient **5 H2 au même niveau** (structure plate, pas de H3 pour éviter les ambiguïtés d'interprétation Word) :\n\n```\n[H1] 1. Préparation du LiFoFer\n  [H2] Contexte scientifique\n  [H2] Protocole\n  [H2] Indicateurs de qualité\n  [H2] Précautions & Stockage\n  [H2] Applications & Dosages\n\n[H1] 2. [Autre préparation]\n  [H2] Contexte scientifique\n  [H2] Protocole\n  [H2] Indicateurs de qualité\n  [H2] Précautions & Stockage\n  [H2] Applications & Dosages\n```\n\n### Détail des 5 H2\n\n#### H2 — Contexte scientifique\n\nPourquoi ce protocole fonctionne. Mécanismes biologiques, chimiques, écologiques mobilisés. Références scientifiques. **Rédigé par Claude + enrichi par Jenni**.\n\n#### H2 — Protocole\n\nStructure à sous-paragraphes en **préfixe gras** (pas de H3) :\n\n```\n**Ingrédients —** liste des matériels et matières consommables avec quantités précises, sources d'approvisionnement, alternatives de substitution.\n\n**Équipement nécessaire —** ustensiles, capacités volumiques, conditions (obscurité, température, aération). Inclure les EPI (gants, lunettes, masque filtrant si applicable).\n\n**Procédure —** suite d'étapes chronologiques numérotées ou en listes, avec durées, températures, signes sensoriels à vérifier à chaque étape (changement de couleur, odeur attendue, consistance).\n```\n\n**Règle doctrine** : la rédaction du Protocole est du **volet pratique** confié à JMJ (qui teste, ajuste, documente) et à Jenni (qui recherche sources praticiens : Carandang, Cho Han-kyu, Tao Orion, Gil Carandang, Higa EM-1, retours aquaculture asiatique, etc.). Claude rédige **uniquement le Contexte scientifique** et la partie théorique — pas d'invention de protocole par Claude seul.\n\n#### H2 — Indicateurs de qualité\n\nComment savoir que la préparation est réussie. Paramètres mesurables (pH, couleur, odeur, température, densité), valeurs de référence, signaux de dérive (mouillage, odeurs putrides, changement de teinte anormale), durée de maturation typique.\n\n#### H2 — Précautions & Stockage\n\nRisques chimiques et biologiques, incompatibilités, conditions de stockage (température, lumière, durée de conservation), signes d'altération justifiant le rejet, gestion des résidus et déchets.\n\n#### H2 — Applications & Dosages\n\nCultures ou contextes où la préparation est utile, doses recommandées (par litre, par hectare, par plant), fréquences d'application, modalités (trempage de semences, pulvérisation foliaire, incorporation sol, dilution irrigation), compatibilités / incompatibilités avec d'autres pratiques concurrentes.\n\n### Document amorce, pas template vide\n\nLe docx produit est un document de travail **amorce/partiellement rédigé**, pas un template avec `[à compléter]`. Les sous-blocs H2 contiennent une description éditoriale concise (5-15 lignes) qui pose le cadre de ce qui est attendu, plutôt qu'un placeholder vide.\n\n### Recommandations protocoles DIY (sources Jenni)\n\nLes sources praticiennes reconnues que Jenni mobilise pour les protocoles :\n\n- **Carandang, Gil** — Natural Farming Philippines, IMO, FAA, FPJ, FFJ\n- **Cho Han-kyu** — Korean Natural Farming (KNF), IMO1-4, JADAM\n- **Tao Orion** — permaculture thérapeutique, intégrations\n- **Higa, Teruo** — Effective Microorganisms (EM-1)\n- **Aquaculture asiatique** — usage combinés en riziculture-pisciculture\n\n**Règle** : les doses et protocoles issus de ces sources sont contextuels. Toute adaptation locale doit être testée en pilote avant généralisation.\n\n### Gestion des termes canoniques\n\nComme pour les fiches transversales (cf. BQ `wf_fiche_production`) :\n- Termes canoniques **intégrés dans les phrases** (orthographe exacte `terms.fr`).\n- Pas de liste séparée en fin de document.\n- Première mention avec EN entre parenthèses : `« micro-organismes efficaces (Effective Microorganisms, EM) »`.\n\n### Contraintes de rendu (rappel)\n\nIdentiques aux fiches transversales :\n- Title ≤ 5 mots sans accent\n- Hiérarchie Word native (Title + H1-H3 max, pas de H4)\n- Pas d'ASCII décoratif\n- Structure plate sous un H1 technique (5 H2 sans H3 dans l'un d'eux)\n- Zéro méta-vocab\n\n### Principe du cadrage éditorial\n\nLes 5 H2 sont **immuables** pour garantir la cohérence inter-fiches techniques : un lecteur qui ouvre plusieurs fiches techniques retrouve toujours la même architecture et sait où chercher chaque type d'information. Cette standardisation vaut contrainte : si une fiche technique n'a rien à dire dans un H2 (ex : pas de Précautions spécifiques à documenter pour une préparation particulièrement bénigne), le H2 est conservé avec une mention concise, pas supprimé.\n\n### BQ complémentaires\n\n- `fiche_definition` — définition, taxonomie, cycle de vie des fiches\n- `wf_fiche_production` — workflow de production (s'applique aussi aux techniques)\n- `wf_fiche_integration` — intégration consciente du retour Jenni\n- `redaction_documents_jenni` (#146) — règles unifiées de rédaction Jenni\n", "type": "reference", "crit": false}, {"id": "wf_arbitrage_jenni", "titre": "Arbitrage Jenni — workflow d'intégration (corrige le corpus, pas le HTML)", "contenu": "## Arbitrage Jenni — workflow d'intégration\n\n**Règle gouvernante** : un *arbitrage* est une **synthèse de haut niveau** (issue du dispositif\nconseil / émergences, tranchée par JMJ) que **Jenni rédige et source** (accès *open access* + base\ninterne — **jamais Zotero**). Le retour arrive en **docx format Jenni** (Title + Heading 2/3 +\nchamps de citation + bloc *References*).\n\n> **Un arbitrage sert à CORRIGER LE CORPUS (le fond : cards + refs), il n'apparaît PAS en HTML tel\n> quel.** Distinguer : *arbitrage* (corrige le fond) ≠ *chapitre Cahier* (pédagogie HTML) ≠ *fiche\n> claude* (synthèse auditée).\n\n### Pipeline d'intégration consciente\n\n```\nConseil/émergences → arbitrage (squelette sourcé) → Jenni rédige+source → docx/<slug>.docx\n   ↓ intégration CONSCIENTE (jamais de copier-coller massif)\n1. PARSER le docx (contenu par axe + bloc References ; citations Jenni en clair).\n2. ANALYSER axe par axe vs l'existant (audit_cards_first) : qu'apporte-t-il de CORRECTIF\n   (nouveau mécanisme, nuance, mise à jour de paradigme) — vs ce que la card dit déjà ?\n3. INSERTIONS CHIRURGICALES dans les concept_cards concernées, SEULEMENT si nécessaire\n   (append ciblé à `description`, formulation sourcée, l'existant préservé).\n4. REFS → bank `jenni_sources` (INSERT, dédup par DOI ; note de provenance « via arbitrage Jenni »).\n5. SI la synthèse est conservée → FICHE CLAUDE (cf. modèle fiche #41) :\n   - `fiches` : origine='claude', is_diy=0, type='transversale', statut='integree' ;\n   - contenu → `fiche_retour_sections` ; refs → `fiche_contenus.refs` ;\n   - RACCORDEMENT AUDIT : `pedago_links` (entity_type='fiche') vers les cards-ancres ;\n   - chapitre Cahier adossé via `config.cahier.chapter_fiches` (la page reste lisible ET auditée).\n6. `check_integrity` (la fiche doit être raccordée : pas d'orpheline, refs cohérentes).\n7. ARCHIVER le docx d'arbitrage dans son dossier dédié : `git mv docx/<slug>.docx\n   docx/archives/arbitrages/Arbitrage-NN.docx` (numérotation continue ; NE PAS le nommer\n   `fiche_<id>.docx` — cette convention est réservée aux *fiches* archivées dans `docx/archives/`).\n```\n\n### Précautions\n- **Ne jamais fabriquer de source** : Jenni source depuis l'open access (vérifiable). Vérifier\n  l'**attribution fidèle** (l'affirmation dit bien ce que la source dit — risque des assistants de citation).\n- **Insertions conscientes** : exposer le jugement (quel apport, pour quelle card, pourquoi) avant\n  d'écrire ; le **conseil de validation** peut blinder le périmètre avant insertion.\n- **`is_diy=0`** sur la fiche claude → elle entre dans le périmètre des audits comme les autres.\n\n### Référence d'implémentation\nArbitrage « Le régime fixe les rôles — du sol vivant à la plante saine » (2026-06-09) :\ninsertions chirurgicales #65 (double pilier Glomero/Mucoromycotina), #161 (volet pesticides/\nglyphosate, Martinez 2021), #167 (piège énergétique, Tello 2023) ; +8 réfs au bank ; **fiche claude\n#253** raccordée (16 refs + 18 cards) + chapitre Cahier adossé.\n", "type": "workflow", "crit": true}, {"id": 147, "titre": "Intégration consciente du retour Jenni — workflow canonique", "contenu": "## Intégration consciente du retour Jenni — workflow canonique\n\n### Principe directeur\n\n**L'intégration du retour Jenni est le moment crucial où Claude mobilise toutes ses capacités d'analyse intégrative.** Ce n'est pas un lancement de script suivi d'un commit. C'est l'analyse consciente d'un document scientifique enrichi à co-rédiger avec le reste du corpus existant.\n\nJMJ a co-rédigé avec Jenni mais n'a plus le bandwidth pour relier transversalement, contrôler la cohérence inter-pièces, repérer les évolutions de paradigme et les manques exposés. **C'est la responsabilité de Claude à l'intégration.**\n\nUne intégration sans analyse intégrative produit du contenu juxtaposé sans cohérence — exactement le piège du corpus mal géré.\n\n**Le câblage automatique est aveugle au neuf (institué 2026-06-13, demande JMJ).** Le pipeline `integrate_fiche.py` ne fait que *valider un câblage préétabli* : il matche le retour contre les cards et axes **qui existent déjà** (scoring de recouvrement) et propage vers eux. Par construction, il **ne peut pas détecter ce qui est nouveau** — un concept absent du corpus, un renversement de cadre, une tension avec un axe établi n'ont aucun score d'overlap avec l'existant. La détection du neuf exige une **lecture analytique, pas un score** : c'est pourquoi l'étape 3 n'est pas « Claude lit avec attention » (mou, sautable) mais un **Conseil d'audit du retour** formel — le dispositif complet de `conseil_modele` (#161). Cas fondateur : fiche #264 (microsite refuge évolutif) — l'apply mécanique a tissé 4 axes existants sans voir que le retour Jenni introduisait le concept **« Microbial Village »** (0 card / 0 terme au corpus, sourcé Wilpiszeski 2019) ni le renversement *anoxie-relique → anoxie-norme* (en tension avec les axes #12/#179). Le câblage était vert ; l'intégration consciente, non faite.\n\n### Règle d'or\n\n**Aucun docx Jenni ne rentre tel quel en DB.** Toute intégration passe par le pipeline `integrate_fiche.py` + analyse intégrative consciente + intégration des refs biblio + audit croisé documenté + propagation aux autres pièces du corpus.\n\n### Pipeline complet en 7 étapes\n\n```bash\n# Étape 1-3 : dry-run + contrôles\npython3 tools/jenni/integrate_fiche.py --db sol_vivant.db --fiche-id <N> --docx docx/<slug>.docx\n# Étapes 4-7 : analyse + apply + intégration refs + audit + archivage\npython3 tools/jenni/integrate_fiche.py --db sol_vivant.db --fiche-id <N> --docx docx/<slug>.docx --apply\npython3 tools/jenni/integrate_fiche_refs.py --fiche-id <N> --docx docx/<slug>.docx --apply\n# (audit croisé manuel — voir étape 6)\n```\n\n---\n\n### Étape 1 — Parse + match + diff (script auto)\n\nParseur OMML math-aware (`tools/lib/parse_jenni_docx.py`) qui extrait :\n\n- **Sections** par niveaux Word (Title, H1, H2, H3) — alignement avec le plan DB via numérotation dans le titre (cf. BQ `wf_fiche_production` #130)\n- **Refs biblio** via style `JenniRefBody` (format natif Jenni)\n- **Citations inline** APA `(Auteur, année)`\n- **Formules chimiques Unicode** depuis les `<m:oMath>` (NH₃, CO₂, Fe²⁺) — sans parseur math-aware, parens vides résiduelles. Cf. BQ `parse_docx_omath` #137.\n- **Tags Jenni résiduels** `[Fiche zoom...]`, `(nd)` autoréférences → supprimés au parse\n\nDiff vs version précédente : première intégration → note neutre. Réintégration → comparaison textuelle, refs ajoutées/retirées signalées, passages disparus flaggés.\n\n---\n\n### Étape 2 — Contrôles techniques pré-apply (BQ §E)\n\n**Avant tout apply, vérification consciente** par scan regex sur le contenu parsé :\n\n| Contrôle | Pattern | Tolérance |\n|---|---|---|\n| Parens vides OMML | `\\(\\s*\\)` | **0** (sinon formule perdue) |\n| Dummy-citations Google Docs | `dummy[- ]citation` | 0 |\n| Citations `n.d.` non résolues | `\\(.*?n\\.d\\.\\)` | 0 |\n| Méta-vocab | `card #N`, `chaîne CN`, `corpus`, `strate`, codes doc, `thésaurus` | 0 |\n| Anglicismes non consacrés | `turnover`, `hotspot`, `pool/pools`, `mix`, `cry-for-help` (sans glose), `feedback` (sans glose) | 0 ou glose bilingue acceptable |\n| Sujets interdits | `biodynam*`, `Steiner`, `anthroposoph*` | 0 (BQ #154) |\n\nSi parens vides résiduelles → restaurer les acronymes/formules avant apply (UPDATE post-apply autorisé).\n\nSi anglicisme avec glose bilingue (« Plant-Soil Feedback (rétroaction plante-sol) ») → acceptable, terme technique consacré.\n\n---\n\n### Étape 3 — Conseil d'audit du retour (l'analyse intégrative — le cœur de l'intégration)\n\n**C'est le travail principal de Claude au retour Jenni, et il prend la forme d'un Conseil (institué 2026-06-13).** Le câblage (étapes 1-2-4) valide l'existant ; ce Conseil **lit le retour pour en extraire le NEUF** que le câblage ne peut pas voir. Il se tient **avant l'apply** (ou juste après le temps-1 fidèle, jamais après la propagation).\n\n**Dispositif — le modèle complet `conseil_modele` (#161), pas une version incarnée raccourcie :**\n- **Round 1** (agents Task parallèles, `model='opus'`) — 3 lentilles choisies pour l'objet + **contradicteur** + **anti-marteau**. Chaque siège lit le dossier, **VÉRIFIE en DB**, rend findings + angle mort + préoccupation n°1.\n- **Round 2** (mêmes sièges, après PV du chairman) — échange confronté : concèdent/maintiennent preuve DB à l'appui, nomment l'angle mort collectif et la vraie convergence.\n- **Synthèse** (chairman = Claude) → **contradicteur de la synthèse + anti-marteau** (deux critiques indépendantes : justesse / nécessité) → le chairman **re-vérifie en DB** les dires des contradicteurs (faux positifs Opus, BQ #55) → **verdict + arbitrages à JMJ**. *N'écrire en DB qu'après l'arbitrage de JMJ.*\n\n**Mandat spécifique du Conseil d'audit d'intégration — trouver ce qui est nouveau :**\n- **Concepts / cadres neufs** : le retour nomme-t-il un objet absent du corpus (vérifier : 0 card / 0 terme / 0 axe) qui mérite une card ou un terme ? (ex. #264 « Microbial Village »)\n- **Renversements / déplacements de paradigme** : le retour pousse-t-il un cadre jusqu'à mettre un axe du fil directeur en tension ? (ex. #264 *anoxie relique → norme* vs #12/#179)\n- **Tensions / contradictions** avec cards, chaînes, autres fiches.\n- **Termes candidats de fond** (distincts des artefacts de parsing).\n\nLes sous-questions A-D ci-dessous sont la grille que le Conseil instruit :\n\n#### A. Cohérence vs corpus existant\n\n- Quelles **affirmations valident** des contenus existants (cards, chaînes, autres fiches) ?\n- Quelles **affirmations contredisent** des contenus existants ?\n- Quelles **données chiffrées** mises à jour faut-il propager ailleurs ?\n- Quelles **citations partagées** créent des liens trans-fiches ?\n- Quels **mécanismes décrits dans les réponses aux questions de sourçage**\n  (validations `statut=integre`) recoupent la fiche ? → croisement obligatoire,\n  volet H de l'audit croisé. La prose-réponse est désormais en DB\n  (`validation_contenus.contenu_brut`, captée par `integrate_validation_refs`\n  depuis 2026-06-02) — la requêter. ⚠ Exception : les sourçages intégrés **avant**\n  le correctif (ex. faune #15) n'ont pas de prose en DB → leur matière reste dans\n  `docx/archives/QS-*.docx` (+ brief `validation_sections`).\n\n#### B. Évolutions de paradigme\n\n- La fiche introduit-elle un **nouveau paradigme** qui doit faire bouger d'autres pièces du corpus ?\n  Exemple : Soil Continuum Model invalide l'humification classique → impacte cards #54, #98 et fiche #11\n- Quels **arbitrages éditoriaux** sont rendus possibles par cette intégration ?\n\n#### C. Manques nouveaux exposés\n\n- Par contraste, quels **termes thésaurus** apparaissent absents et nécessaires ?\n- Quelles **fiches voisines** deviennent prioritaires à créer ou à réviser ?\n- Quelles **chaînes causales** sont à enrichir (maillons faibles, étapes manquantes) ?\n- Quelles **controverses scientifiques** sont à formaliser explicitement ?\n\n#### D. Impact opérationnel\n\n- Quelles cards demandent un renforcement (via `pedago_links` carte→fiche, ou `description`\n  si la fiche apporte un cadre génératif absent — **pas** `concept_cards.notes`, non rendu : cf. étape 7.1) ?\n- Quelles fiches en cours doivent être briefées-à-jour avant envoi Jenni ?\n- Quels prompts de docs cibles doivent être enrichis (`prompts.contexte_sci/.enrichissement`) ?\n\nCe travail produit le **rapport audit croisé** (étape 6).\n\n---\n\n### Étape 4 — Apply (script auto au green-light)\n\n```\n✓ UPSERT fiche_contenus (contenu_integre + refs JSON cache)\n✓ INSERT fiche_retour_sections (plan Jenni parsé, par section)\n✓ DELETE source_usages anciens pour la fiche\n✓ INSERT N source_usages (refs déjà en DB)\n✓ UPDATE fiches : statut=integree, updated_at\n✓ INSERT graines version+1 (statut a_rediger) — cycle suivant\n✓ RENFORCE auto cards score≥8 (scoring step_cards — voir note)\n✓ audit_log (operation=INTEGRATE)\n✓ COMMIT\n```\n\n> **Versioning (modèle fiches 2026-05-25, précisé 2026-06-07)** : `fiches.version` est\n> **abandonné** (champ legacy dormant, lecture seule, `DROP` à venir — ne plus s'y fier).\n> Le **contenu intégré n'est PAS versionné** : `fiche_contenus`/`fiche_retour_sections`\n> portent le **dernier état seulement**, réécrit à chaque (ré)intégration (cf. §Refonte\n> « version abandonnée : le contenu est dernier seulement »). L'état qui **fait foi** est\n> `fiches.statut='integree'` + le contenu courant.\n> La table **`graines`** versionne le **cycle de PRODUCTION des briefs**, **pas** le contenu\n> intégré : chaque apply ouvre une graine `version = MAX(version)+1` (statut `a_rediger`)\n> pour amorcer le cycle suivant. ⚠ **Ne pas lire `graines.version` comme « la version de la\n> fiche intégrée »** — c'est un compteur d'itérations d'envoi/rédaction Jenni (une\n> réintégration laisse souvent une graine `a_rediger` jamais rédigée, ex. #238 graine v2).\n> Pour désigner une réintégration, dire « **réintégration du `<date>`** », **pas** « v`<N>` »\n> (la notation « #238 v2 » prête à confondre avec un id de fiche).\n\n> **Renfort auto des cards — à reprendre consciemment (étape 7)** : le script applique un\n> `RENFORCE` automatique aux cards de score ≥ 8 (`step_cards`). Ce scoring est **grossier\n> sur les transversales** (bruit de kw_hits sur le titre, et il **rate les pivots réels**)\n> → il pose des tags `[Apport fiche #N]` **vides** à nettoyer. ⚠ Ces tags vont dans\n> `concept_cards.notes`, **champ non rendu au lecteur** (cf. étape 7.1) : ils ne valent que comme\n> généalogie. Le **vrai renforcement rendu** passe par `pedago_links` (+ `description` si cadre\n> neuf) à l'étape 7 ; les tags vides hors-sujet sont retirés.\n\n---\n\n### Étape 5 — Intégration refs biblio (étape obligatoire — pas optionnelle)\n\nLe script principal note « N nouvelles refs à intégrer séparément ». **Cette étape ne doit pas rester pendante** — elle doit être faite immédiatement après l'apply via :\n\n```bash\npython3 tools/jenni/integrate_fiche_refs.py --fiche-id <N> --docx docx/<slug>.docx --apply\n```\n\nLe script :\n- Parse le docx pour extraire toutes les refs biblio (~20-100/fiche)\n- Dedup par DOI normalisé + titre (80 premiers chars lowercase) vs `jenni_sources`\n- INSERT les nouvelles refs avec métadonnées minimales (doi, auteurs, année, titre, url, journal, source_docx)\n- Crée les `source_usages` pour TOUTES les refs (citées inline ou présentes en biblio)\n- Audit log\n\nMétadonnées minimales cohérentes avec l'état actuel de `jenni_sources` (78% DOI, 86% URL, 5% résumé). Résumés et tags enrichissables plus tard via BQ `wf_source_integration` #129 si la source devient centrale.\n\n`source_usages` est la **source de vérité** pour les liens fiche ↔ ref. `fiche_contenus.refs` (JSON) est un cache d'affichage.\n\n---\n\n### Étape 6 — Audit croisé (rapport documenté)\n\nProduction obligatoire de `audit_reports/audit_croise_fiche<N>_<date>.md` avec 8 volets :\n\n```\nA. Cards concernées (avec scores overlap, role : pivot / supports / contextualizes)\nB. Chaînes causales traversées (étapes nourries, étapes à enrichir)\nC. Termes thésaurus mobilisés (par strate) + termes candidats (vrais nouveaux vs artefacts parsing) — les vrais nouveaux sont **versés au fichier unique** (`recherches/thesaurus/termes_a_definir.txt`, cf. Étape 7.4)\nD. Autres fiches en recouvrement (redondance / articulation / contradiction)\nE. Contradictions potentielles (vérification manuelle Claude + JMJ)\nF. Bibliographie (refs liées vs nouvelles, % de matching)\nG. Actions recommandées par priorité (UPDATE cards, alertes fiches en cours, propositions thésaurus, propagation prompts)\nH. Croisement avec les réponses aux questions de sourçage (mécanismes décrits)\n```\n\n**Volet H — ne pas perdre la matière des sourçages (demande JMJ 2026-06-02).**\nLes réponses Jenni aux questions de sourçage (validations) décrivent des\n**mécanismes** riches qui, dans le pipeline actuel, ne sont **pas captés en DB** —\n`integrate_validation_refs` n'extrait que les refs (`source_usages`), pas la prose.\nCette matière ne survit que dans `docx/archives/QS-*.docx` (+ le brief\n`validation_sections.contexte_sci`). L'audit croisé doit donc, pour chaque fiche :\n(1) recenser les sourçages intégrés (`validations.statut=integre`) dont le sujet\nrecoupe la fiche ; (2) **croiser explicitement** les mécanismes décrits (lien réel,\npas forcé — sinon le noter) ; (3) signaler les **croisements à venir** : les\nsourçages `en_cours` que la fiche viendra nourrir une fois intégrés (ex. fiche iode\n↔ #16 *eau du sol* pour le lessivage, ↔ #17 *microbiote intestinal* pour le bout\nsanté du continuum). Depuis 2026-06-02, `integrate_validation_refs` **capte la\nprose-réponse** dans `validation_contenus.contenu_brut` (requêtable) — le volet H\nse nourrit donc directement de la DB (`SELECT contenu_brut FROM validation_contenus\n… WHERE validation_id IN (…)`), plus besoin de re-parser le docx archivé.\n\nModèle référence : `audit_reports/audit_croise_fiche57_2026-04-22.md` (volets A-G),\n`audit_reports/audit_croise_fiche242_2026-06-02.md` (volet H inaugural).\n\n---\n\n### Étape 7 — Phase 4bis : propagation aux autres pièces du corpus\n\nAction concrète sur la base du rapport audit croisé :\n\n1. **Cards renforcées** — ⚠ **un renforcement ne vaut que s'il est RENDU au lecteur**\n   (établi 2026-06-16, intégration #207). Les **canaux carte réellement rendus** :\n   - **`pedago_links`** (sens carte→fiche, rendu « Fiches qui la mobilisent » sur\n     `concept_cards.html`) : INSERT `(entity_type='fiche', entity_id=<N>, card_id=<C>, role)`\n     pour chaque card que la fiche **instancie réellement** (`role` `primaire`/`reference`).\n     C'est le canal de renforcement par défaut.\n   - **`concept_cards.description`** (rendu) : enrichissement éditorial **scientifique**\n     (JMJ + Claude en direct, `pas_agent_redacteur`), seulement si la fiche apporte un **cadre\n     génératif absent** — plafonné, sans régression d'altitude de la carte.\n   - ❌ **`concept_cards.notes` n'est PAS rendu** (vérifié sur 3 fronts : `build_card_payloads`\n     n'expose que `description` ; `gen_cahier`/JS templates ne lisent jamais `concept_cards.notes` ;\n     idem `fiches.notes`, lu seulement pour le flag `[HORS-JENNI]`). Un tag `[Apport fiche #<N>]`\n     en `notes` = **généalogie interne seulement** (traçabilité d'audit), jamais un « renforcement »\n     visible. **Ne pas confondre écrire en DB et servir le lecteur.**\n2. **Fiches en cours impactées** — si une fiche en cours porte sur un sujet revisité par l'intégration :\n   - Cas mécanique (ajout d'une ref) → UPDATE fiche_contenus.refs sans envoi Jenni\n   - Cas éditorial (paradigme bouge, contradiction) → UPDATE `fiches.notes` avec consigne pour la prochaine génération du docx prompt + alerte JMJ\n3. **Prompts docs cibles** — si la fiche enrichit un point d'un doc de strate, propager dans `prompts.contexte_sci/.enrichissement` (option `--propagate` du script integrate_fiche)\n4. **Termes candidats → fichier unique** (OBLIGATOIRE) — profiter de l'analyse consciente déjà faite (volet C) : les termes candidats **vrais nouveaux** (hors artefacts de parsing) sont **ajoutés au fichier unique `recherches/thesaurus/termes_a_definir.txt`** (un seul fichier pour TOUS les workflows — cf. `thesaurus_workflow` §0 « Vie du fichier »). Dédupliqués contre `terms` (ne garder que les absents) ET contre le contenu déjà présent, **triés alphabétiquement** (règle #115, `lower(fr)`). On n'attend pas un passage séparé d'`export_termes_candidats.py` : la matière a déjà été triée (vrais nouveaux vs artefacts) à l'intégration, autant l'y verser tout de suite. Le fichier accumulé au fil des intégrations part au prochain cycle thésaurus → Jenni → `import_termes_jenni.py --sent` (qui l'archive/purge).\n5. **Audit log systématique** — chaque modification trace le lien `[Propagation fiche #<src> v<N> (<date>)]`\n\n### Règle d'ordre des intégrations\n\nQuand plusieurs fiches sont au retour Jenni en même temps et se recoupent :\n\n1. **Fiche maîtresse / la plus transversale** d'abord (cascade structurante, cycle pivot)\n2. **Fiches plus spécifiques** ensuite, alignées sur la maîtresse\n\nIntégrer une spécifique avant une transversale produit l'effet inverse : la transversale doit être révisée a posteriori.\n\n---\n\n### Archivage automatique\n\nDès qu'une fiche passe `integree` :\n\n```\ndocx/<slug>.docx                            → docx/archives/<slug>.docx\nrecherches/fiches/<NN>_fiche_<slug>_<date>.docx → recherches/fiches/archives/\n```\n\nImplémenté dans `tools/lib/fiche_archive.py::archive_fiche_files()`, câblé automatiquement dans `integrate_fiche.py` à l'apply (idempotent, `docx_index` pour le mapping nom origine ↔ canonique).\n\n---\n\n### Reprise d'une fiche déjà intégrée\n\nUne fiche `integree` peut être retouchée pour enrichissement biblio, ajout d'une section, correction post nouvelle étude. Trois canaux :\n\n- **Chat Jenni direct** (modification simple ponctuelle) — Claude n'a rien à préparer\n- **Document de travail uploadé** (reprise structurée) — Claude génère le docx via `gen_fiche_docx.py` (lit `fiche_sections.contenu` pour ré-éditer le contenu intégré), passage par le pipeline d'intégration au retour (version N+1)\n- **Dialogue markdown — substitutions chirurgicales** (corrections lexicales sans toucher la structure) — Claude produit un fichier `recherches/fiches/relecture_<sujet>_<date>.md` listant section par section les passages à corriger : pour chaque entrée, le **passage original** + la **substitution proposée** + une **justification courte**. JMJ pousse ce markdown à Jenni qui valide / amende / ajoute des références. Au retour, application surgical via `str.replace` sur `fiche_contenus.contenu_integre` avec garde-fou pré-flight (« old_str doit exister exactement, sinon abort »), audit_log par UPDATE. Cas d'usage : vague d'anglicismes blacklist, normalisation terminologique (`pool` → `réservoir`, `no-till` → `semis direct`), corrections orthographiques ou de cohérence inter-fiches.\n\n**Modèle de référence** : `recherches/fiches/relecture_anglicismes_2026-05-06.md` (7 substitutions surgical sur 7 fiches, validées par Jenni avec citations académiques, appliquées via UPDATE Python sur contenu_integre).\n\n---\n\n### Anti-patterns confirmés\n\n- **Pas d'apply mécanique sans Conseil d'audit (étape 3)** — c'est le piège principal qui a justifié la refonte de cette BQ, **re-confirmé 2026-06-13** (intégration #264 : câblage vert, concept « Microbial Village » et renversement *anoxie=norme* ratés). Tisser les cards/axes **existants** n'EST PAS l'analyse intégrative : c'est de la propagation (étape 7) sur du câblage préétabli, aveugle au neuf. Le script `integrate_fiche.py --apply` ne suffit pas ; le Conseil d'audit, l'audit croisé et la propagation sont OBLIGATOIRES, pas optionnels.\n- **Pas d'oubli de l'intégration des refs biblio** — étape 5 obligatoire post-apply via `integrate_fiche_refs.py`.\n- **Pas de gate vert sans contrôles techniques §E** — toujours dry-run d'abord, vérifier parens vides + méta-vocab + dummy-cite + n.d.\n- **Pas d'import direct des termes candidats parsés dans `terms`** — seul le workflow thésaurus standard (export liste à Jenni → retour docx → `import_termes_jenni.py`) crée des termes canoniques.\n- **Pas d'archivage manuel oublié** — les `docx/` et `recherches/fiches/` doivent rester propres ; seules les fiches en cycle actif y restent.\n\n### Scripts clés\n\n| Script | Rôle |\n|---|---|\n| `tools/jenni/integrate_fiche.py` | Pipeline d'intégration principal (parse + dry-run + apply) |\n| `tools/jenni/integrate_fiche_refs.py` | Intégration des refs biblio (jenni_sources + source_usages) |\n| `tools/lib/fiche_archive.py::archive_fiche_files()` | Archivage auto post-intégration (câblé dans integrate_fiche.py) |\n| `tools/jenni/gen_fiche_docx.py` | Génération docx pour reprise |\n\n### Acquis 2026-05-24 — pipeline canonique sans RIS, nommage, faux positifs gate\n\n**Pipeline canonique d'intégration (sans RIS)** — confirmé sur le lot de 71 retours :\n\n1. `integrate_fiche.py --apply` (`tools/jenni/`) : parse le docx (lit la biblio\n   `JenniRefBody` directement — **aucun RIS requis**), écrit `fiche_contenus`,\n   crée les `source_usages` des refs déjà en DB, passe `statut=integree`.\n2. `integrate_fiche_refs.py --apply` (`tools/jenni/`) : insère les **nouvelles**\n   refs dans `jenni_sources` + `source_usages` (obligatoire, pas optionnel).\n3. `archive_fiche_files()` (`tools/lib/fiche_archive.py`, câblé dans `integrate_fiche.py`) :\n   docx → `docx/archives/fiche_<id>.docx` + `index.json` (automatique à l'apply).\n4. `relink_fiche_refs.py` (`tools/admin/`) : resync cache `fiche_contenus.refs`\n   vers `jenni_sources.id` (en fin de lot).\n\n**Note 2026-05-26** : l'ancien `integrate_fiche_docx.py` (et son symétrique\n`integrate_doc_docx.py`), chemins rivaux exigeant un RIS `Ma bibliothèque.ris`, ont été\n**supprimés** — comme `triage_ris.py` et `tools/lib/sources.py` (parsing RIS Zotero). Le\nRIS n'est plus géré via Zotero : les références viennent de la biblio `JenniRefBody` du\ndocx Jenni et entrent en base directement. Pipeline canonique unique : `integrate_fiche.py`\n(+ `integrate_fiche_refs.py`), sans RIS. `archive_fiche_files()` vit désormais dans\n`tools/lib/fiche_archive.py`.\n\n**Nommage canonique** : `fiche_<id>.docx` partout (`docx/archives/` ET\n`recherches/fiches/`). `gen_fiche_docx.py` génère `fiche_<id>.docx`.\n\n**Gate — faux positifs codes docs** : les patterns `S/V/P/F/H + chiffre`\ncollisionnent avec la notation scientifique. NE PAS charcuter : histones\n`H3`/`H4` (et marques `H3K4me3`), générations filiales `F1`-`F3`, stades\nvégétatifs / régions 16S `V3`-`V5`, gènes (`F6'H1`, `S8H`, `CYP82C4`).\n`check_forbidden_jenni.py` filtre ces cas par contexte (depuis 2026-05-24).\n\n**Reprise méta-vocab (modèle fiche #107)** : si une graine contient un renvoi\n(`fiche/card #N`, `cf. fiche`, `corpus`), nettoyer **en base**\n(`fiche_sections.contexte_sci`) puis régénérer le docx (output).\n\n### Refonte du modèle de données fiches (2026-05-25) — ⚠ EN PARTIE SUPERSÉDÉ\n\n> **Note 2026-05-30** : la décision ci-dessous « cycle `a_faire→en_cours→envoye→integre→archive`\n> **conservé** dans `fiches.statut` » a été **renversée** par le refactor fiche/graine du 30-05 :\n> `fiches.statut` = `jenni|integree|archive`, et le cycle détaillé est descendu dans\n> `graines.statut` (`a_rediger→redigee→envoyee→recue→recreee→a_jour`). `envoye` reste un statut\n> générique pour **validations/docs** uniquement. Doctrine canonique à jour : `fiche_definition`.\n> Le reste de cette section (fiche_retour_sections, intégration 2 temps, abandon `version`,\n> conversion des 147 fiches) reste valable comme historique du chantier.\n\nDécisions actées (à ne pas perdre entre sessions) :\n\n**Deux plans distincts, non-miroir** :\n- `fiche_sections.contexte_sci` = **graines** (plan d'envoi). Artefact **régénérable**\n  par Claude (synthèse maturité corpus + audit récent) → aucun historique, remplacement libre.\n- `fiche_retour_sections` (**table créée 2026-05-25**) = **dernier retour Jenni**, par\n  section (ordre, niveau H1/H2/H3, titre, contenu), fidèle, libre de diverger du plan\n  d'envoi. Un seul retour conservé ; recovery via `docx/archives/`.\n\n**Intégration en 2 temps** (remplace l'« apply » monolithique) :\n1. **temps 1 (auto)** — recopie fidèle du retour → `fiche_retour_sections` (ajustements\n   techniques seulement : OMML, tags, markdown ; zéro interprétation/réécriture) ;\n2. **temps 2 (conscient, JMJ/Claude)** — synthèse → régénère les graines `fiche_sections`.\n   Pas de génération automatique (rédaction interdite). Finalité : la graine pure\n   alimente les graines/prompts des 18 documents de strate (cible du projet).\n\n**Statuts** : cycle standard `a_faire → en_cours → envoye → integre → archive` **conservé**.\n`envoye` est un statut **générique** (fiches/validations/docs) → **ne pas abandonner**.\n\n**`version` abandonnée** : ne sert plus (le contenu est « dernier seulement »). Retirée de\n`integrate_fiche.py` (plus de `+1`). Le 2ᵉ chemin `integrate_fiche_docx.py` (qui forçait\n`version=1`) a été **supprimé** (2026-05-26), de même que le one-shot `migrate_docx_index.py`.\nReste à finaliser : retirer la dernière lecture résiduelle de `version` (`audit_fiches`)\npuis `DROP` la colonne. Tant que ce n'est pas fait, `version` est dormant (inoffensif, lecture seule).\n\n**État** :\n- ✅ table `fiche_retour_sections` + pilote #213 · `integrate_fiche` temps 1 (testé #12)\n- ✅ `integrate_fiche_docx` + `integrate_doc_docx` + `triage_ris` + `lib/sources.py` supprimés (2026-05-26, pipeline RIS Zotero obsolète) ; `archive_fiche_files` → `tools/lib/fiche_archive.py` câblée dans `integrate_fiche.py`. ⏳ reste : finir l'abandon `version` + `DROP`\n- ✅ **rendu Cahier/Comprendre lit `fiche_retour_sections`** (2026-05-27) : rendu fin\n  section par section (titre au niveau + paragraphes) pour les fiches `integre` ayant un\n  retour ; fallback blob `contenu_integre` pour les fiches sans retour ; masquage des\n  graines (prompt) pour les `integre`. Fait dans `gen_cahier.py::_retour_type/load_data`\n  et `web_template.py::build_comprendre_data`. Régression corrigée (6 fiches affichaient\n  la graine : #41/#94/#106/#213/#233/#234).\n- ✅ **conversion des 147 fiches anciennes → `fiche_retour_sections`** (2026-05-27) : re-parse\n  des docx archivés (source fidèle, comme `integrate_fiche` temps 1), 4578 sections.\n  **Les 153 fiches `integre` ont désormais un rendu fin** ; le fallback blob ne sert plus\n  qu'en filet. 14 fiches taguées `STRUCTURE À RÉVISER` dans `fiches.notes` (anomalies : 5 en\n  H4, 9 avec titre de niveau-min isolé) — à reprendre/recycler Jenni.\n  Niveaux Word bruts normalisés **au rang** au rendu (gère H3/H4).\n- ⏳ `gen_fiche_docx` tracer l'envoi (`date_export`) · finir l'abandon `version` + `DROP` (mineurs)\n- ✅ **blob `fiche_contenus.contenu_integre` SUPPRIMÉ** (2026-06-08) : colonne `DROP COLUMN`,\n  source unique = `fiche_retour_sections`. Tous les lecteurs (glossaire cahier/web, audits,\n  pedago, gen_fiche_docx) routés via le helper unique `tools/lib/fiche_text.py::fiche_texte_integre`\n  (reconstruit le texte concaténé à la volée, format byte-identique à l'ex-blob). Les écrivains\n  (`integrate_fiche`, `refresh_retour_text`) ne reconstruisent plus le blob. Lossless **prouvé** :\n  180 blobs, 0 sans retour ; 4 fiches `archive` (#2/#3/#9/#15) converties en section unique ;\n  oracle glossaire 218/218 byte-identique ; cahier.html + pages comprendre régénérés byte-identiques\n  sans le blob. DB −5 Mo (VACUUM). ⚠ Le `fiche_texte_integre` est désormais le **seul** point de\n  lecture du texte intégré : ne plus jamais requêter `fiche_contenus.contenu_integre` (colonne\n  inexistante). NB : `fiche_sections.contenu` (graines blocks legacy) reste — dépréciation\n  distincte, à acter séparément.\n\n### Voir aussi\n\n- BQ `fiche_definition` (#69) — ce qu'est une fiche, double fonction\n- BQ `wf_fiche_production` (#130) — produire une fiche (graine + brief)\n- BQ `wf_source_integration` (#129) — intégration source isolée (rapport JMJ)\n- BQ `redaction_documents_jenni` (#146) — règles de rédaction\n- BQ `parse_docx_omath` (#137) — parseur math-aware\n- BQ `sujets_interdits_corpus` (#154) — biodynamie/Steiner exclus\n- BQ `conseil_modele` (#161) — le COMMENT du Conseil d'audit de l'étape 3 (R1/R2 + contradicteur + anti-marteau)\n- `conseil_contradicteur` / `ouverture_conseil` (config `claude_rules`) — protocole en 3 temps + anti-marteau\n", "type": "workflow", "crit": true}]}, "thesaurus": {"nom": "Pipeline thesaurus", "entries": [{"id": 138, "titre": "Ne pas modifier le libelle fr canonique d'un terme existant", "contenu": "## Règle absolue — le `fr` canonique d'un terme ne se modifie JAMAIS automatiquement\n\n**Le champ `terms.fr` est la CLÉ ÉDITORIALE qui fait l'aller-retour avec Jenni.**\n\nWorkflow Jenni :\n1. On exporte une liste de termes vers Jenni (via `export_thesaurus_incomplets.py` ou `gen_prompt_thesaurus.py`)\n2. Jenni reçoit le libellé EXACT de la DB → elle le recopie verbatim dans son docx de retour\n3. On réimporte via `import_termes_jenni.py --replace` → le TERME du docx remplace/matche le terme en DB\n\n**Conséquence** : si on modifie automatiquement le `fr` en DB (casse, ponctuation, espaces, apostrophes, tirets), on crée un cycle vicieux :\n- Export : Jenni reçoit la version modifiée\n- Retour Jenni : le docx a la version modifiée (Jenni ne rétablit pas)\n- Réimport : DB reste avec la version modifiée\n- Perte définitive de la casse/ponctuation d'origine\n\n**Incident de référence — 2026-04-20** : le Chantier A (normalisation casse initiale via agents Task, commit 5970137) avait baissé la Majuscule initiale de **216 termes** (Antifragilité → antifragilité, Biofilms → biofilms, Bioturbation → bioturbation, etc.) selon une règle typographique française stricte (noms communs en min). Or Jenni écrit ces termes en Majuscule initiale (convention standard de thésaurus). Après le Chantier A :\n- Les exports envoyaient à Jenni \"antifragilité\" → Jenni retournait \"antifragilité\"\n- Le cycle a failli être définitif\n\nCorrection (commit 86408df) : restauration de la casse Jenni pour les 216 termes + migration des term_relations associées.\n\n**Interdictions absolues** :\n- ❌ Lancer un script qui modifie automatiquement la casse initiale de tous les termes\n- ❌ Normaliser les apostrophes, tirets, espaces dans le `fr` sans audit préalable de la casse Jenni\n- ❌ Appliquer une règle typographique abstraite (française, ISO 25964, etc.) au `fr` existant\n- ❌ Baser un fix sur une décision agent Task automatisée sans validation JMJ\n\n**Règles autorisées** :\n- ✅ Modifier le `fr` d'UN terme spécifique après validation explicite JMJ\n- ✅ Les agents Task peuvent CLASSIFIER / ANALYSER / COMPTER mais pas DÉCIDER d'un changement de libellé\n- ✅ Normalisations typographiques dans les champs `definition`, `syn_fr`, `syn_en` (qui ne font pas l'aller-retour direct avec Jenni comme clé)\n\n**Conséquence sur les scripts existants** :\n- `import_termes_jenni.py` : en mode `--replace` match par `fr` normalisé (casse/apostrophes ignorées) — OK\n- Chantier A doit être considéré comme une erreur qui ne doit JAMAIS être reproduite sur le `fr` canonique\n- Si une décision éditoriale veut changer la casse/ponctuation d'un terme : passer par JMJ + export Jenni coordonné\n\n**Pour les champs secondaires** (definition, syn_fr, syn_en) : les modifications (normalisation apostrophes, cleanup URLs, ajout formules OMML via parser math-aware) sont OK car ces champs ne font pas clé avec Jenni. (BT/RT sont des **relations** dans `term_relations`, plus des colonnes de `terms`.)\n", "type": "regle_absolue", "crit": true}, {"id": 53, "titre": "Maintenance thésaurus", "contenu": "Ajouter un terme concept :\n```sql\nINSERT INTO terms (section_key, strate, fr, en, definition, doc_code, type, statut)\nVALUES ('S2', 'S', 'terme fr', 'english term', 'Définition complète.', 'S2', 'concept', '◆');\n```\n\nAjouter un terme glossaire (support, définition courte) :\n```sql\nINSERT INTO terms (section_key, strate, fr, en, definition, doc_code, type, statut)\nVALUES ('S2', 'S', 'terme fr', 'english term', 'Définition courte.', 'S2', 'glossaire', '~');\n```\n\n**Deux types de termes :**\n- `concept` (défaut) — terme structurant du corpus avec définition complète, synonymes, INRAE, relations\n- `glossaire` — terme support apparaissant dans les relations (rt), définition courte, pas de synonymes requis\n\nRéassigner un terme :\n```sql\nUPDATE terms SET doc_code = 'S1', section_key = 'S1' WHERE id = 237;\n```\n\nFusionner un doublon :\n```sql\nDELETE FROM terms WHERE id = 238;  -- garder le plus complet\n```\n", "type": "commande", "crit": false}, {"id": 71, "titre": "Pseudoscience — flag et définitions factuelles", "contenu": "**Règle** : le corpus ne fait pas de publicité pour la pseudoscience.\n\n**Terme concerné** : `Agriculture Biodynamique` (ID 160, strate F, doc F1/F2)\n- Définition réécrite : factuelle, sourcée (Chalker-Scott 2013, Rienth 2024, FiBL 21 ans, MIVILUDES 2024)\n- `flag_pseudoscience = 1` dans la table `terms`\n\n**Mécanisme** :\n- La colonne `flag_pseudoscience` (INTEGER, défaut 0) permet de marquer tout terme relevant de la pseudoscience\n- Les scripts d'export (Jenni, prompts) doivent filtrer ou signaler les termes marqués\n- La définition contient un avertissement visible : ⚠ Pseudoscience\n\n**Principe** : le corpus traite d'agriculture régénératrice fondée sur la science. Les pratiques sans validation scientifique (biodynamie, électroculture, basalte magnétique) sont documentées factuellement mais jamais valorisées.\n\n**Dossier source** : `jmj/biodynamie.docx` — analyse critique complète (Steiner, préparations, MIVILUDES, infiltration INRAE, marché commercial).\n\n**Requête de contrôle** :\n```sql\nSELECT id, fr, definition FROM terms WHERE flag_pseudoscience = 1;\n```\n", "type": "regle", "crit": true}, {"id": 115, "titre": "Listes de termes triées alphabétiquement (règle absolue workflow Jenni)", "contenu": "## Thésaurus — listes de termes triées alphabétiquement obligatoire\n\n**Règle** : toute liste de termes envoyée à Jenni (workflow thésaurus : bloc\nde 10, complétion, redéfinition) **doit être triée alphabétiquement** sur le\nlibellé FR.\n\n### Justification\n\nObservé en conditions de production : une liste non triée (par ordre\nd'ajout, par id, ou par strate) perturbe le traitement Jenni — elle se\nperd dans la « position » dans la liste (`Dernier terme traité : X`),\nrate des termes, ou mélange les blocs de 10.\n\nAvec un tri alphabétique strict :\n- Jenni retrouve immédiatement où reprendre (« après Z comes AA »)\n- Les blocs de 10 sont prédictibles\n- Pas de dérive dans la séquence\n\n### Application côté production\n\nLes scripts qui génèrent des listes pour Jenni appliquent déjà ce tri :\n\n- `tools/jenni/export_thesaurus_incomplets.py` : `ORDER BY lower(fr)`\n- Tout nouveau script de génération de listes de termes doit suivre la\n  même convention\n\nVérif SQL standard :\n```sql\nSELECT fr FROM terms WHERE strate='S' ORDER BY lower(fr);\n```\n\nLe `lower()` garantit que la casse ne casse pas le tri (« mulch » et\n« Mulch » classés ensemble).\n\n### Format du docx de sortie\n\nListe à puces verticale, un terme par ligne, sans indication de champs\nmanquants ni formatage de consigne (cf règle « docx minimal » et charte\nde travail JMJ). Jenni applique son propre format de sortie via son prompt.\n\n### Référence\n\nRègle formalisée par JMJ le 2026-04-14 suite à observation répétée de\nconfusions Jenni sur listes non triées.\n", "type": "regle", "crit": true}, {"id": 116, "titre": "Workflow thésaurus — import, complétion, déduplication", "contenu": "## Workflow thésaurus Jenni — scripts et doctrine\n\n**Chaîne de traitement complète** d'un docx Jenni de thésaurus (format TERME/EN/DEF/SYN_FR/SYN_EN/BT/RT) :\n\n### ⚠ Principe transversal — Synonymes/acronymes = clé des arbitrages\n\nLes **synonymes et acronymes** ne sont pas du bruit : ce sont les **pivots** qui\ndécident des arbitrages, **en amont** (création de la liste) **et en aval**\n(intégration du retour). Le matching lexical `norm()` est aveugle à la sémantique —\nce sont les synonymes/acronymes qui révèlent qu'un « nouveau » terme existe déjà.\n\n**Amont — création de la liste à envoyer (cf. §0, §2 dédup).**\nNe pas re-proposer un terme dont le **concept** existe déjà sous un autre libellé,\nacronyme ou synonyme. La dédup doit être **sémantique**, pas seulement lexicale :\n- acronyme ↔ forme longue (`POM` ↔ « matière organique particulaire », `AOA` ↔\n  « archées oxydatrices de l'ammoniac », `MAOM` ↔ « matière organique associée aux\n  minéraux ») ;\n- reformulation / singulier-pluriel (`maladie non transmissible` ↔ #3625 « maladies\n  non transmissibles », `communication inter-plantes` ↔ #3079 « Communication\n  plante-plante ») ;\n- équivalent sémantique (`métrique de biodiversité` ↔ #1449 « indice de diversité »).\n\n→ croiser le candidat contre `fr` **ET** `syn_fr`/`syn_en`/acronymes de **tous** les\ntermes avant de l'ajouter à la liste (pas seulement le `fr` canonique).\n\n**Aval — intégration du retour (cf. §2 bloqués, §3).**\nUn bloc **bloqué « multiple matches »** vient presque toujours d'un **synonyme mal\nplacé** : un nom spécifique (souvent l'anglais) logé en `syn_en` d'un terme\n**générique/taxon** capte à tort le bloc destiné au terme **spécifique** — ex.\n`Soil organic carbon` sur #1877 « Carbone » alors qu'il appartient à #403, ou\n`Ammonia-oxidizing archaea` sur #25 Thaumarchaeota alors qu'il appartient à #274.\n**Résolution non destructive** : retirer le synonyme mal placé du terme\ngénérique/taxon **après avoir vérifié qu'il est déjà présent sur le terme\nspécifique** (suppression sans perte) → le bloc s'intègre proprement en UPDATE.\n**Surtout pas** `resolve_import_conflicts` sur ces cas : il **fusionnerait** deux\ntermes distincts (incident `bq_access` : Thaumarchaeota / Nitrosomonas frôlés).\n\nLes **acronymes / labels nus** (AMO, POM, Shannon) sont des **synonymes** de termes\ncomplets : `mode_force=skip` à l'import *standalone*, mais ils restent\nindispensables car les renvois BT/RT des autres termes s'y résolvent.\n\nRéconcilier un **doublon latent** (variante non vue par `norm()`) : ajouter la\nvariante en `syn_fr` du terme canonique → l'import matche et **UPDATE** au lieu\nd'INSÉRER un doublon.\n\nCas modèle : `audit_reports/integration_thesaurus_20260606.md` (8 faux-positifs\ndébloqués par nettoyage de synonymes, 2 doublons latents réconciliés).\n\n### Méthode canonique — termes par lot de fiches (provenance + remonter le fil)\n\n**Innovation 2026-06-01 (JMJ + Claude).** Les termes manquants du thésaurus\nn'émergent **pas** d'une liste « au hasard » : on **travaille un lot de fiches** et\nles termes manquants en sont extraits. Chaque terme **trace alors vers sa fiche\nsource** — ce *câblage amont* est le cœur de la méthode et ne doit pas être perdu.\n\n**Pourquoi.** La strate et le `doc_code` (place dans la carte des 18 documents) sont\n**internes au corpus** : une base académique (Jenni) ne les connaît pas. La liste\nenvoyée à Jenni est donc plate, alphabétique, **sans strate** (§0). Au retour, le\nplacement se ré-attribue **côté corpus** — et la provenance terme→fiche le rend\n**traçable et grounded**, sans devinette.\n\n**Chaîne complète :**\n1. **Lot de fiches** travaillé (production / intégration de #N…#M).\n2. **Extraction** des termes candidats par croisement fiches ↔ corpus (pool curaté\n   + agents d'**extraction** — `pas_agent_redacteur` autorise l'extraction, jamais la\n   rédaction de définitions). **Conserver la provenance terme→fiche.**\n3. **Dédup** `tr.norm()` sur fr/en/syn_fr/syn_en (homonymes : arbitrer — ex.\n   « sélénite » minéral vs ion → `ion sélénite`).\n4. **Liste §0** (plate, triée, sans strate) → Jenni définit (TERME/EN/DEF/SYN/BT/RT).\n5. **Import** `import_termes_jenni --replace --mapping <csv>` : le mapping\n   (terme→strate/doc_code, issu de la provenance) ré-attribue le placement côté corpus.\n6. **Analyse consciente** (jamais un import mécanique) :\n   - **remonter le fil** : chaque terme → sa fiche source → strate/`doc_code` du sujet\n     sur la carte des 18 docs (S4 cycles, V3 fermentations, P1 diagnostic, H1 santé…) ;\n   - **terme vs concept** : un terme = *vocabulaire* ; une **affirmation/hypothèse**\n     relève du filtre `concept_cards`, pas d'un INSERT terme (BQ `modele_conceptuel`) ;\n   - **contrôles** : 0 fuite méta-vocab dans `terms.definition` (`audit_thesaurus` row E),\n     anglicismes `fr==en` (hors cognats/taxons), type `concept`/`glossaire` ;\n   - **arbitrage fr canonique** (#138) : un TERME Jenni divergent ne s'écrit pas en dur\n     — décision JMJ (ex. `CO2` → `dioxyde de carbone`, 2026-06-01).\n   - **vigilance dérive de libellé (acronymes / reformulation)** : Jenni ajoute ou\n     retire parfois l'acronyme, ou reformule le `fr`. Vérifier que le libellé rendu\n     correspond à l'envoi ; le `fr` canonique reste **stable** (#138), l'acronyme va\n     en `syn_fr`/`syn_en`, toute divergence réelle est **arbitrée** (jamais écrite en\n     dur). `import_termes_jenni` signale déjà le « fr divergent », mais le traitement\n     **par lots (1/session)** impose de re-vérifier la **cohérence inter-lots** : le\n     même concept peut revenir sous deux libellés selon le lot (`MAOM` au lot N,\n     `matière organique associée aux minéraux` au lot N+1) → réconcilier.\n   - **dédoublonnage sémantique** (pas seulement lexical) : `import_termes_jenni`\n     dédupe par `norm()` (casse/accents/apostrophes/pluriels) — il **ne rapproche\n     PAS** une forme longue et son acronyme (`ARG` ↔ `gène de résistance aux\n     antibiotiques`, `MAOM` ↔ `matière organique associée aux minéraux`) ni deux\n     formulations synonymes. Croisement conscient **obligatoire** avant INSERT pour\n     éviter les doublons latents (cf. `audit_thesaurus` row D). Les formules en\n     chiffres plats restantes (`CO2`, `CH4`…) se normalisent en unicode au passage\n     (réflexe `parser_docx_omath`, champ `definition` — sentinel `def-jenni-ok`).\n   - **anti-doublon multi-axes** (au-delà du `norm()` lexical, sources avérées de doublons) :\n     - **singulier/pluriel** et variantes orthographiques — `norm()` absorbe les\n       pluriels réguliers, mais re-vérifier les cas tordus (un même concept ne doit pas\n       exister deux fois) ;\n     - **caractères indésirables infiltrés en DB** — espace insécable, zéro-largeur,\n       caractère de contrôle, soft-hyphen. Ils font **échouer le match** : le terme\n       ressort « propre » dans une liste à définir et est re-proposé → faux nouveau\n       terme = doublon. **Scanner et nettoyer `terms.fr/syn`** de ces parasites\n       (corruption invisible, distinct du libellé canonique #138) AVANT de générer toute\n       liste ; sinon le filtre amont §0 laisse passer le faux-neuf ;\n     - **confusion SYN** — un `fr` qui est en réalité le **synonyme** d'un autre terme\n       (ex. `Oxydo-réduction` ↔ syn de `Redox`, `densité apparente` ↔ syn de `densité`)\n       est un doublon latent à **fusionner** (audit_thesaurus row D), pas un terme\n       distinct ; ne pas confondre non plus un synonyme reçu avec une entrée à créer ;\n     - **croiser les RT** — vérifier que les `RT` rendus pointent vers des termes réels\n       et cohérents (orphelins, casse, polysémie — audit_thesaurus row C) ;\n     - **vérif FR/EN** — `en` présent et cohérent avec `fr` ; `fr==en` toléré seulement\n       pour cognats/taxons, sinon anglicisme déguisé (audit_thesaurus row G).\n7. **Rapport** d'analyse consciente dans `audit_reports/` + entrée `audit_log`.\n\n**Cas modèle** : lot fiches #238-249 → 120 termes (2026-06-01),\n`audit_reports/analyse_termes_thesaurus_2026-06-01.md`.\n\n**Anti-pattern** : lancer `import_termes_jenni --apply` sans analyse consciente ni\nremonter-le-fil → placement deviné, terme/concept non trié, provenance perdue.\n\n### 0. Format canonique de la liste « termes à définir » — RÈGLE UNIQUE\n\n**Une seule façon de faire**, valable pour toute liste de termes candidats\nenvoyée à Jenni (vague d'audit, hyperonymes, nouveaux concepts issus du corpus).\nNe plus en inventer d'autre.\n\n- **Emplacement — UN SEUL fichier pour tous les workflows** (simplification JMJ\n  2026-06-06 ; remplace l'ancienne distinction INPUT/OUTPUT `thesaurus_<N>.txt` vs\n  `thesaurus_a_definir_<date>.txt` — précisément la source des candidats orphelins\n  et de la confusion) : **`recherches/thesaurus/termes_a_definir.txt`**. Pas de\n  numéro, pas de date, pas de copie. C'est **à la fois** l'accumulateur de candidats\n  ET la liste envoyée à Jenni.\n\n- **Vie du fichier — le CYCLE** (accumulation → résolution → purge) :\n    1. **Accumulation** (Claude, en continu) : à **chaque** intégration qui révèle\n       un terme absent, Claude **ajoute** le candidat dans `termes_a_definir.txt` —\n       intégration fiche (volet C / Étape 7.4 `wf_fiche_integration`), import termes\n       thésaurus (orphelins BT/RT du lot — `wf_source_integration` §Variante étape 6),\n       solde post-audit corpus, notes volantes. Dédup contre `terms` ET contre le\n       fichier, tri alpha (#115), artefacts filtrés à la main.\n    2. **Maintenance / résolution** (décision JMJ) : `export_thesaurus_incomplets\n       --single-txt` **réécrit le fichier en place** — il PRÉSERVE les candidats\n       manuels accumulés ET y réinjecte les termes DB incomplets (à enrichir), dédup\n       `normalize`, near-dups B6 en WARN. Le fichier est ensuite envoyé à Jenni.\n    3. **Import + purge** : le retour Jenni se réimporte avec `import_termes_jenni.py\n       --sent recherches/thesaurus/termes_a_definir.txt` → `--sent` **archive (purge)**\n       le fichier envoyé (`→ recherches/thesaurus/archives/`) à l'apply. Un **nouveau\n       cycle** démarre : `termes_a_definir.txt` repart vide, amorcé par les orphelins\n       BT/RT du lot qu'on vient d'importer (boucle → étape 1).\n  ⚠ **Ordre quand un retour thésaurus ET une fiche sont en attente** (règle JMJ\n  2026-06-07) : intégrer **le retour thésaurus AVANT la fiche**. L'intégration d'une\n  fiche **ré-accumule** des candidats dans `termes_a_definir.txt` (Étape 7.4\n  `wf_fiche_integration`) ; or `--sent` **archive/purge le fichier entier** à l'apply.\n  Si la fiche passe d'abord, ses candidats sont purgés **sans avoir été envoyés à\n  Jenni** → perdus du cycle. Faire le thésaurus d'abord garantit que `--sent` purge\n  exactement le lot envoyé ; les candidats de la fiche **amorcent ensuite proprement le\n  cycle suivant** (fichier reparti vide après purge).\n  ⚠ Le fichier **peut** être édité à la main (Claude y ajoute des candidats) — c'est\n  voulu. `export_thesaurus_incomplets` ne l'écrase pas : il le relit et le fusionne.\n- **Format** : **un terme par ligne, UNIQUEMENT le terme.** Pas de tiret, pas de\n  puce, pas de numéro, pas de préfixe, pas de titre, pas d'annotation (fréquence,\n  strate, catégorie, case à cocher). Le fichier ne contient QUE les libellés bruts.\n- **Tri** : alphabétique `lower(fr)` accent-insensible (NFKD) — règle absolue #115.\n- **Libellés bruts** : la forme proposée telle quelle, jamais normalisée\n  (règle #138 — le `fr` canonique ne se décide pas côté Claude).\n- **Acronymes — UNE SEULE forme par ligne, jamais `terme (ACRO)`.** Ne pas accoler\n  l'acronyme entre parenthèses au libellé. Jenni traite **par lots (1/session, pour\n  éviter les dérives)** et restitue l'acronyme de façon **non constante** (tantôt\n  gardé, tantôt supprimé, tantôt seul) → le `fr` rendu **dérive** du libellé envoyé\n  d'un lot à l'autre, ce qui casse la clé d'aller-retour (#138) et fabrique des\n  doublons inter-lots. Règle :\n    - concept à **nom français descriptif** → envoyer **le nom complet seul** ;\n      l'acronyme sera rattaché en **synonyme** (`syn_fr`/`syn_en`) au retour, pas dans\n      le libellé (ex. `matière organique associée aux minéraux`, pas `… (MAOM)`) ;\n    - **sigle / standard propre** sans nom français courant (SHAPE, SMAF, CASH, VESS,\n      NIRS, DGT, ISO 23611, REW…) → envoyer **l'acronyme seul** comme libellé ;\n    - **jamais les deux formes** dans le même libellé.\n- **Filtres amont obligatoires** : exclure pseudoscience (#154), pratiques-recettes\n  typées (KNF/JADAM/LiFoFer…), méta-vocab (#146 §4), mots génériques, et synonymes\n  d'entrées déjà présentes (match `norm()` sur fr/en/syn_fr/syn_en).\n- **Vérif avant envoi** : `check_forbidden_jenni` → zéro méta-vocab.\n\nLe retour Jenni (docx `TERME/EN/DEF/SYN_FR/SYN_EN/BT/RT`) se réimporte via\n`import_termes_jenni.py --replace --sent recherches/thesaurus/termes_a_definir.txt`\n(étape 2 ; `--sent` archive/purge le fichier pour le cycle suivant). Les sections\n1/1bis/1ter ci-dessous ne sont que des **alimenteurs** de ce fichier unique — le\nformat ne change jamais.\n\n### 1. Export demande de complétion\n\nLes termes incomplets **repassent dans le workflow thésaurus standard** :\nlistes à puces en docx qui fait le round-trip avec Jenni, pas de prompt\ntexte spécifique.\n\n```bash\n# Export docx listes à puces (triées alphabétiquement, pour Jenni workflow bloc de 10)\npython3 tools/jenni/export_thesaurus_incomplets.py --db sol_vivant.db --strates F,S,V,P,H\n```\n\nSortie : `recherches/thesaurus/thesaurus_incomplets_strate_<X>_<date>.docx`\n\n**Filtre doctrine** : `flag_pseudoscience=1` exclu (les définitions des\ntermes tagués pseudoscience — Agriculture Biodynamique — sont figées et\nne doivent pas être redéfinies par Jenni).\n\nLe retour Jenni arrive en `recherches/thesaurus/thesaurus___strate_X.docx`\n(même format que les imports initiaux), ce qui permet le réimport via\n`import_termes_jenni.py --replace` (étape 2).\n\n⚠ **Déprécié** : `gen_prompt_completion.py` générait des prompts texte\n`complete_{strate}_{date}.txt`. Redondant avec le workflow docx ci-dessus.\nLes fichiers générés sont archivés dans `recherches/archives/completion/`.\n\n### 1ter. Hyperonymes structurels (BT-hubs avec définition stub)\n\n**Cas d'usage** : les termes hyperonymes (`type='class'` en DB) sont\nexclus du workflow standard car considérés comme classes structurelles\nnon-éditoriales. Mais leurs définitions sont parfois des stubs auto\n(« Hyperonyme regroupant N termes : X1, X2... ») qui n'expliquent pas\nle concept en lui-même. JMJ navigue le thésaurus, voit ces stubs comme\ndéfinitions vides ; il faut les compléter par Jenni.\n\n**Doctrine BQ #136 + #146** : aucune définition Claude depuis sa\nmémoire générale. Les hyperonymes structurels passent par cycle Jenni\ncomme tout autre terme, format minimal :\n\n```bash\n# Inclut les hyperonymes structurels avec définition courte (<150c)\npython3 tools/jenni/export_thesaurus_incomplets.py --db sol_vivant.db \\\n    --single-txt --include-class\n```\n\nSortie : `recherches/thesaurus/termes_a_definir.txt` (fichier unique, réécrit en place — cf. §0)\n- Format : un terme par ligne, sans tiret, sans préfixe, sans titre\n- Tri alphabétique global (`normalize` NFKD + lower)\n- Inclut termes incomplets standards + hyperonymes `type='class'` avec\n  def stub si `--include-class` passé\n\n**Constat 2026-05-06** : 614 hyperonymes avec stub auto pattern\n« Hyperonyme regroupant... » accumulés au fil des sessions. Reset\nmassif → cycle Jenni dédié pour rédiger les définitions complètes\n(Jenni produit le format TERME/EN/DEF/SYN_FR/SYN_EN/BT/RT classique\nau retour, qui se réimporte via `import_termes_jenni.py --replace`).\n\n**Anti-pattern à éviter** (incident 2026-05-06) : Claude tenté de\nremplir 49 défs en lot avec sa mémoire générale (constat « pour les\nnon-importants »). Reverte via reconstruction stub depuis BT-relations\npuis envoyé en cycle Jenni standard. Cf. doctrine BQ #136 §\n« Pas de batch automatisé pour la rédaction éditoriale ».\n\n### 1bis. Variante simplifiée — liste de termes pour vagues d'audit (BT académiques)\n\n**Cas d'usage** : grosses vagues de termes candidats issus d'un audit\n(audit Opus, audit corpus, vague conceptuelle thématique). Volumes\ntypiques 50-150 termes répartis sur plusieurs strates.\n\n**Constat 2026-05-06** : pour ce type de vague, les stubs structurés\nTERME/EN/DEF/SYN_FR/SYN_EN/BT/RT par strate (`gen_prompt_thesaurus.py\n--all-strates --from-final`) sont trop verbeux pour la première passe.\nJMJ préfère envoyer **un seul fichier**, **une seule liste à puces**,\ntoutes strates confondues, et recevoir au retour les **BT académiques**\nseuls (la définition complète vient ensuite, en seconde passe via la\nvariante structurée si besoin).\n\n**Format** : le **format canonique §0** (un terme par ligne, AUCUN tiret, trié\n`lower(fr)`). Emplacement : le **fichier unique** `recherches/thesaurus/termes_a_definir.txt`\n(cf. §0 « Vie du fichier » — un seul fichier, on y **ajoute**, on ne le regénère\njamais sous un autre nom).\n\n**Génération** : ajouter les candidats neufs (absents de la DB ET du fichier) au\nfichier unique, puis laisser `export_thesaurus_incomplets` le maintenir (merge\nDB-incomplets + dédup + WARN near-dups) :\n\n```python\n# 1) Ajouter les candidats neufs au fichier unique (dédup vs DB + vs fichier) :\nimport json, sqlite3, re\nfrom pathlib import Path\nimport sys; sys.path.insert(0, 'tools/lib')\nimport term_rels as tr   # norm() : casse/accents/apostrophes/pluriels\n\ncon = sqlite3.connect('sol_vivant.db')\npresent = set()\nfor row in con.execute(\"SELECT fr, en, syn_fr, syn_en FROM terms\"):\n    for f in row:\n        for part in re.split(r'[;,·]', f or ''):\n            k = tr.norm(part)\n            if k: present.add(k)\n\nSINGLE = Path('recherches/thesaurus/termes_a_definir.txt')\nexisting = SINGLE.read_text(encoding='utf-8').splitlines() if SINGLE.exists() else []\npresent |= {tr.norm(t) for t in existing if t.strip()}\ndata = json.loads(Path('jmj/analyses/reports/final_consolide_<source>.json').read_text(encoding='utf-8'))\nnew_terms = [c['fr'].strip() for c in data['concepts'] if tr.norm(c['fr']) not in present]\nallt = [t for t in existing if t.strip()] + new_terms\nSINGLE.write_text('\\n'.join(sorted(allt, key=tr.norm)) + '\\n', encoding='utf-8')\n```\n\n```bash\n# 2) Maintenance : merge DB-incomplets + dédup + WARN near-dups (réécrit EN PLACE) :\npython3 tools/jenni/export_thesaurus_incomplets.py --db sol_vivant.db --single-txt\n# → recherches/thesaurus/termes_a_definir.txt (le MÊME fichier)\n```\n\n**Source canonique** : un JSON `final_consolide_<source>.json` placé\ndans `jmj/analyses/reports/` qui consolide les termes proposés par\nl'audit. Format :\n```json\n{\"source\": \"...\", \"date\": \"...\", \"concepts\": [{\"fr\": \"...\", \"strate\": \"F\"}, ...]}\n```\n\n**Retour Jenni attendu** : pour chaque terme, le **BT académique**\n(broader term hiérarchique). Pas de définition, pas de syn, pas de RT\nen première passe. La passe 2 (définition complète + EN + syn) part de\nla nouvelle structure BT pour cibler les termes les plus structurants\nen priorité.\n\n**Réimport** : la passe « 1 BT seul » n'a **jamais été implémentée** (pas de\n`import_thesaurus_bt.py`) et le thésaurus est désormais quasi complet (3 incomplets\nau 2026-06-05). Le chemin **canonique unique** est la passe complète : Jenni rend\n`TERME/EN/DEF/SYN_FR/SYN_EN/BT/RT`, réimporté par `import_termes_jenni.py --replace`\n(qui écrit les BT dans `term_relations`, `rel_type='BT'`). Cette variante 1bis « BT\nacadémiques d'abord » est conservée comme mémoire, mais n'est plus une étape outillée\ndistincte (mise à plat 2026-06-05).\n\n**Doctrine respectée** :\n- BQ #146 §4 : zéro méta-vocab dans le fichier (vérifié `check_forbidden_jenni`)\n- BQ #146 §9 + #115 : tri `lower(fr)` strict\n- BQ #154 : exclusion explicite des termes pseudoscience dans le JSON\n  amont\n- BQ #136 : aucune définition Claude dans le fichier (juste les libellés)\n- BQ #138 : pas de modification du `fr` canonique (les termes envoyés\n  sont les libellés bruts proposés par l'audit, pas une variante\n  normalisée)\n\n**Cas d'usage attestés** :\n- 2026-05-06 : 70 termes audit Opus → `thesaurus_audit_opus_2026-05-06.txt`\n  (source `final_consolide_audit_opus_2026-05-06.json`)\n\n### Format attendu du docx Jenni (ne pas tiquer à l'ouverture)\n\nUn docx Jenni ouvert avec `python-docx` (`paragraph.text`) montre des éléments qui\n**semblent** anormaux mais sont **attendus et gérés** — workflow fluide = ne pas\ns'en alarmer :\n\n1. **Formules chimiques/math en `( )` vides.** Jenni encode NH₃, CO₂, Fe²⁺, NO₃⁻…\n   en Office Math ML (`<m:oMath>`), que `paragraph.text` **ignore**. Le parseur\n   math-aware `import_termes_jenni.parse_docx()` les restitue en Unicode (BQ\n   `parser_docx_omath` #137). Les `()` ne sont visibles que dans le `.text` brut,\n   **pas** après import. Vérif post-import : 0 occurrence de `\\(\\s*\\)` dans\n   `definition`/`syn_fr`/`syn_en`.\n2. **Citations hyperliées `(Auteur, année)`.** Format Google Docs (« Citations avec\n   hyperlien » — cliquables, sans champs Word). Chaque citation porte un lien\n   `dummy-citation.com/…` (placeholder). Le parseur **retire le lien** et\n   **conserve le texte `(Auteur, année)`** dans la définition (cf.\n   `regles_de_redaction_des_documents_jenni_reference` §7).\n3. **Bloc Références en fin de document.** Titre `Heading 1 — Références` (styles\n   `JenniRefHeader` + `JenniRefBody`, ~250 entrées APA). **Pour le thésaurus, ce\n   bloc n'est PAS intégré** : les termes citent en inline `(Auteur, année)` dans la\n   définition (texte), sans bibliographie par terme\n   (`source_usages.entity_type='term'` ≈ 0). C'est la différence avec les\n   **fiches**, où `integrate_fiche_refs.py` capte cette bibliographie.\n\n### 2. Import retour Jenni\n\n```bash\n# Dry-run puis apply\npython3 tools/jenni/import_termes_jenni.py --db sol_vivant.db \\\n    --docx recherches/thesaurus/thesaurus___strate_X.docx --strate X --replace\npython3 tools/jenni/import_termes_jenni.py ... --apply\n```\n\nMode `--replace` = UPDATE intégral si match unique trouvé. Sans match = INSERT.\nMultiples matches = BLOQUÉ (conflit à résoudre).\n\nContrôle anti-doublon 8 axes : fr/en cross × syn_fr/syn_en cross.\n\n### 3. Résolution conflits (bloqués multi-match)\n\n```bash\npython3 tools/jenni/resolve_import_conflicts.py --db sol_vivant.db --docx X.docx \\\n    --skip-fr \"MO,Rhizodéposition\"  # faux positifs norm()\npython3 tools/jenni/resolve_import_conflicts.py ... --apply\n```\n\n**Fonctionnalités clés** :\n- `--skip-fr` : exclut les termes dont `norm()` collisionne à tort\n  (ex: `norm(\"Mo\") = norm(\"MO\") = \"mo\"` : Molybdène vs Matière Organique)\n- Reload d'index entre chaque résolution : évite chain-collisions\n  (résoudre A peut modifier les matches de B)\n\n### 4. Déduplication périodique\n\n```bash\npython3 tools/admin/dedupe_thesaurus.py --db sol_vivant.db  # dry-run\npython3 tools/admin/dedupe_thesaurus.py --db sol_vivant.db --apply\n```\n\nFusion avec scoring qualité + migration term_relations + merge syn_fr/syn_en.\n\n### 4bis. Archivage post-intégration (pattern git mv obligatoire)\n\nUne fois le retour Jenni intégré (UPDATEs/INSERTs/arbitrage collisions) :\n\n```bash\n# OUI — `git mv` stage rename + delete + add en une commande\ngit mv docx/thesaurus_<date>.docx docx/archives/thesaurus_<date>.docx\n\n# NON — `mv` + `git add` stage l'add mais OUB
