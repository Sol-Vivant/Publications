èle référence : `jmj/rapports/audit_data/audit_croise_fiche57_2026-04-22.md` (volets A-G),\n`jmj/rapports/audit_data/audit_croise_fiche242_2026-06-02.md` (volet H inaugural).\n\n---\n\n### Étape 7 — Phase 4bis : propagation aux autres pièces du corpus\n\nAction concrète sur la base du rapport audit croisé :\n\n1. **Cards renforcées** — ⚠ **un renforcement ne vaut que s'il est RENDU au lecteur**\n   (établi 2026-06-16, intégration #207). Les **canaux carte réellement rendus** :\n   - **`pedago_links`** (sens carte→fiche, rendu « Fiches qui la mobilisent » sur\n     `concept_cards.html`) : INSERT `(entity_type='fiche', entity_id=<N>, card_id=<C>, role)`\n     pour chaque card que la fiche **instancie réellement** (`role` `primaire`/`reference`).\n     C'est le canal de renforcement par défaut.\n   - **`concept_cards.description`** (rendu) : enrichissement éditorial **scientifique**\n     (JMJ + l'agent en direct, `pas_agent_redacteur`), seulement si la fiche apporte un **cadre\n     génératif absent** — plafonné, sans régression d'altitude de la carte.\n    - ❌ **`concept_cards.notes` n'est PAS rendu** (vérifié sur 3 fronts : `build_card_payloads`\n      n'expose que `description` ; `gen_cahier`/JS templates ne lisent jamais `concept_cards.notes` ;\n      idem `fiches.notes`, lu seulement pour le flag `[HORS-JENNI]`). Un tag `[Apport fiche #<N>]`\n      en `notes` = **généalogie interne seulement** (traçabilité d'audit), jamais un « renforcement »\n      visible. **Ne pas confondre écrire en DB et servir le lecteur.**\n      > **Conseil 2026-06-21** : le writeback automatique `[Apport fiche #N]` à l'apply (scoring B3\n      > dans `integrate_fiche.py`) est **retiré en Phase C**. Les **157 tags existants** (194 fiches,\n      #1-#264) sont **préservés comme audit-trail read-only** — ne pas purger. Le « vrai renforcement\n      > rendu » passe uniquement par `pedago_links` (+ `description` si cadre neuf).\n2. **Fiches en cours impactées** — si une fiche en cours porte sur un sujet revisité par l'intégration :\n   - Cas mécanique (ajout d'une ref) → INSERT/UPDATE dans `source_usages` (depuis 2026-07-05, plus de cache `fiche_contenus.refs` à maintenir — la vue `v_fiche_refs` régénère à la volée)\n   - Cas éditorial (paradigme bouge, contradiction) → UPDATE `fiches.notes` avec consigne pour la prochaine génération du docx prompt + alerte JMJ\n3. **Prompts docs cibles** — ⚠ **DÉPRÉCIÉ** (Conseil 2026-06-21). Le workflow 18 docs-strates est archivé tant que le corpus n'est pas consolidé. Le flag `--propagate` d'`integrate_fiche.py` est conservé comme no-op avec `DeprecationWarning` (retrait en Phase C). À réintroduire si le workflow docs redémarre.\n4. **Termes candidats → fichier unique** (OBLIGATOIRE) — profiter de l'analyse consciente déjà faite (volet C) : les termes candidats **vrais nouveaux** (hors artefacts de parsing) sont **ajoutés au fichier unique `recherches/thesaurus/termes_a_definir.txt`** (un seul fichier pour TOUS les workflows — cf. `thesaurus_workflow` §0 « Vie du fichier »). Dédupliqués contre `terms` (ne garder que les absents) ET contre le contenu déjà présent, **triés alphabétiquement** (règle #115, `lower(fr)`). On n'attend pas un passage séparé d'`export_termes_candidats.py` : la matière a déjà été triée (vrais nouveaux vs artefacts) à l'intégration, autant l'y verser tout de suite. Le fichier accumulé au fil des intégrations part au prochain cycle thésaurus → Jenni → `import_termes.py --sent` (qui l'archive/purge).\n5. **Audit log systématique** — chaque modification trace le lien `[Propagation fiche #<src> v<N> (<date>)]`\n\n### Règle d'ordre des intégrations\n\nQuand plusieurs fiches sont au retour Jenni en même temps et se recoupent :\n\n1. **Fiche maîtresse / la plus transversale** d'abord (cascade structurante, cycle pivot)\n2. **Fiches plus spécifiques** ensuite, alignées sur la maîtresse\n\nIntégrer une spécifique avant une transversale produit l'effet inverse : la transversale doit être révisée a posteriori.\n\n---\n\n### Archivage automatique\n\nDès qu'une fiche passe `integree` :\n\n```\nrecherches/fiches/<NN>_fiche_<slug>_<date>.md → recherches/fiches/archives/\njmj/rapports/deepseek/fiche_N_hybride_<ts>.md → conservé (traçabilité run)\n```\n\nImplémenté dans `tools/lib/fiche_archive.py::archive_fiche_files()`, câblé automatiquement dans `integrate_fiche.py` à l'apply (idempotent, `docx_index` pour le mapping nom origine ↔ canonique).\n\n---\n\n### Reprise d'une fiche déjà intégrée\n\nUne fiche `integree` peut être retouchée pour enrichissement biblio, ajout d'une section, correction post nouvelle étude. Trois canaux :\n\n- **Édition MD directe** (modification simple ponctuelle) — l'agent édite le MD source archivé ou produit un MD de relecture, puis repasse par `integrate_fiche.py --md`\n- **Re-production subagent** (reprise structurée) — pipeline `[D]` du skill `compose` : un subagent rédacteur est relancé sur la fiche (il lit la DB incluant le contenu intégré précédent), produit un nouveau MD, repassage par le pipeline d'intégration\n- **Dialogue markdown — substitutions chirurgicales** (corrections lexicales sans toucher la structure) — l'agent produit un fichier `recherches/fiches/relecture_<sujet>_<date>.md` listant section par section les passages à corriger : pour chaque entrée, le **passage original** + la **substitution proposée** + une **justification courte**. Application surgical via `str.replace` sur `fiche_retour_sections.contenu` (section par section) avec garde-fou pré-flight (« old_str doit exister exactement, sinon abort »), audit_log par UPDATE. Cas d'usage : vague d'anglicismes blacklist, normalisation terminologique (`pool` → `réservoir`, `no-till` → `semis direct`), corrections orthographiques ou de cohérence inter-fiches.\n- **Regen biblio ciblée** (fiche `integree` mais audit `refs_json` PARTIEL/ORPHELIN, i.e. cites non résolus < 85 %) — workflow dédié : BQ `wf_fiche_regen_biblio`. Sweep des sources existantes non câblées → enrichissement métadonnées vides → création des sources manquantes via Crossref/S2 → réécriture ciblée du cite si cohérence bibliographique (early view→publié). **Ne touche pas au fond éditorial.** Distinct de l'étape 5 (qui est l'ingestion mécanique initiale du bloc `## Références`) : la regen est la **résolution analytique post-intégration** des orphelins.\n\n**Modèle de référence** : `recherches/fiches/relecture_anglicismes_2026-05-06.md` (7 substitutions surgical sur 7 fiches, appliquées via UPDATE Python sur `fiche_retour_sections.contenu`).\n\n---\n\n### Anti-patterns confirmés\n\n- **Pas d'apply mécanique sans Conseil d'audit (étape 3)** — c'est le piège principal qui a justifié la refonte de cette BQ, **re-confirmé 2026-06-13** (intégration #264 : câblage vert, concept « Microbial Village » et renversement *anoxie=norme* ratés). Tisser les cards/axes **existants** n'EST PAS l'analyse intégrative : c'est de la propagation (étape 7) sur du câblage préétabli, aveugle au neuf. Le script `integrate_fiche.py --apply` ne suffit pas ; le Conseil d'audit, l'audit croisé et la propagation sont OBLIGATOIRES, pas optionnels.\n- **Pas d'oubli de l'intégration des refs biblio** — étape 5 obligatoire post-apply via `integrate_fiche_refs.py`. **Garde-fou mécanique 2026-07-11** : le gate `step_gate` bloque désormais une fiche non pédagogique sans bloc `## Références` (violation critique non-bypassable). Mais la racine reste l'orchestrateur (GLM) qui ne doit pas bâcler : un MD produit sans biblio finale est non conforme dès l'amont (subagent rédacteur) et ne doit jamais atteindre l'apply.\n- **Pas de gate vert sans contrôles techniques §E** — toujours dry-run d'abord, vérifier parens vides + méta-vocab + dummy-cite + n.d.\n- **Pas d'import direct des termes candidats parsés dans `terms`** — seul le workflow thésaurus standard (export liste → subagent rédacteur → `import_termes.py`) crée des termes canoniques.\n- **Pas d'archivage manuel oublié** — les `docx/` et `recherches/fiches/` doivent rester propres ; seules les fiches en cycle actif y restent.\n\n### Scripts clés\n\n| Script | Rôle |\n|---|---|\n| `tools/integration/integrate_fiche.py` | Pipeline d'intégration principal (parse MD/docx + dry-run + apply) |\n| `tools/integration/integrate_fiche_refs.py` | Intégration des refs biblio (sources + source_usages) |\n| `tools/lib/parse_jenni_md.py` | Parseur MD natif (symétrique de `parse_jenni_docx.py`) |\n| `tools/lib/fiche_archive.py::archive_fiche_files()` | Archivage auto post-intégration (câblé dans integrate_fiche.py) |\n\n### Modèle de données fiches — décisions structurelles vivantes\n\n**Contenu intégré** :\n- `fiche_retour_sections` = **dernier contenu intégré**, par section (`section`\n  + `sous_section`, `titre`, `contenu`, `analyse_agent`), fidèle au MD produit\n  par l'API d'audit. Un seul état conservé ; recovery via `recherches/fiches/archives/`.\n\n**Intégration en 2 temps** :\n1. **temps 1 (auto, étape 4 apply)** — recopie fidèle du MD parsé →\n   `fiche_retour_sections` (ajustements techniques seulement : formules Unicode,\n   tags résiduels, markdown ; zéro interprétation/réécriture) ;\n2. **temps 2 (conscient, JMJ/l'agent)** — synthèse → propagation aux cards,\n   chaînes, thésaurus (étape 7). Pas de génération automatique (rédaction interdite).\n\n**Statuts** (`fiches.statut`) : `jenni|integree|archive` uniquement. Cf.\n`fiche_definition` pour la doctrine canonique.\n\n**Colonnes legacy** (vivant mais dormant) :\n- `fiches.version` : **abandonnée** (le contenu est « dernier seulement »).\n  Conservée car lue par `audit_center/audit_fiches/explorer/dashboard`\n  (à nettoyer dans une prochaine passe).\n\n**Helper unique pour le texte intégré** :\n`tools/lib/fiche_text.py::fiche_texte_integre(con, fiche_id)` reconstruit le\ntexte concaténé à la volée depuis `fiche_retour_sections` (depuis le DROP du\nblob `fiche_contenus.contenu_integre` 2026-06-08, puis le DROP de la table\nentière `fiche_contenus` le 2026-07-05). **Seul point de lecture**\ndu texte intégré — ne plus jamais requêter `fiche_contenus` (table inexistante).\n\n### Fiches pédagogiques (`type='pedagogique'`) — sans bibliographie propre\n\nLes fiches `type='pedagogique'` rédigées **en direct par l'agent** (l'API d'audit ne\nfait pas de vulgarisation, cf. `fiche_definition`) sont **intentionnellement\nsans liens `source_usages` `entity_type='fiche'`** (donc absentes de la vue\n`v_fiche_refs`). Leur\ncâblage refs se fait via `integrate_validation_refs.py` sur les prompts V1\n(`source_usages.entity_type='prompt'`, 9-13 par fiche).\n\n**Conséquences opérationnelles** :\n- ✓ L'audit `audit_fiches` affiche `usages=ZERO` et `refs=ABSENT` pour ces\n  fiches — c'est **normal et attendu** (leurs sources vivent dans les cards\n  et fiches d'appui vers lesquelles elles renvoient).\n\n### Scripts de maintenance (post-intégration, hors pipeline nominal)\n\n| Script | Rôle | Quand |\n|---|---|---|\n| ~~`tools/admin/relink_fiche_refs.py`~~ | **SUPPRIMÉ 2026-07-05** (table `fiche_contenus` droppée, vue `v_fiche_refs` auto-cohérente — plus de cache à resync) | — |\n| `tools/admin/retag_source_usages.py` | Re-tagger les `source_usages.contexte` (réparation post-bug) | One-shot post-2026-05-28 |\n| `tools/admin/repair_usages_collision_millesime.py` | Fix collisions millésime (bug pré-2026-06-02) | One-shot consommé (audit-trail conservé) |\n| `tools/integration/raccorde_refs_cache.py` | Pendant sans-docx de `integrate_fiche_refs` (depuis cache) | Pointé par `check_integrity:523,545` (hint réparation) |\n| `tools/admin/backfill_biblio.py` | Backfill biblio depuis docx + prompts | Maintenance biblio (relève de `wf_source_integration`) |\n| `tools/integration/integrate_source.py` | Source isolée (rapport JMJ) | Doctrine dédiée : `wf_source_integration` |\n\n### Voir aussi\n\n- BQ `fiche_definition` — ce qu'est une fiche, double fonction\n### Numérotation normalisée des sections (absorbé depuis `sections_numerotation_normalisee`)\n\nDeux colonnes dédiées : `section` (INTEGER) + `sous_section` (INTEGER).\nConvention : `0` = Intro · `1..N` = H1 numéroté · `99` = Résumé/Conclusion · `NULL` = non numéroté.\n`sous_section` : `0` = titre principal · `1..M` = H2 numéroté.\nLe champ `titre` est **nettoyé** : texte éditorial pur, plus de numéro en préfixe.\n\nHelper canonique : `tools/lib/section.py` — `parse_titre()`, `format_titre()`, `retour_type()`, `niveau_from_section()`.\n- BQ `wf_source_integration` — intégration source isolée (rapport JMJ)\n- Règles de rédaction transversales : `.opencode/RULES.md` + `check_forbidden_jenni.py` + BQ `listes_de_termes_triees_alphabetiquement_regle_abs` (doctrine Jenni d'origine archivée : `_archive/archive_2026_07_09_regles_de_redaction_jenni_obsolete.md`)\n- BQ `parse_docx_omath` — parseur math-aware\n- BQ `sujets_interdits_corpus` — biodynamie/Steiner exclus\n- BQ `conseil_modele` — le COMMENT du Conseil d'audit de l'étape 3 (R1/R2 + contradicteur + anti-marteau)\n- `conseil_modele` / `ouverture_conseil` (config `.opencode/RULES.md`) — double critique de la synthèse (contradicteur + anti-marteau)\n", "type": "workflow", "crit": true}]}, "thesaurus": {"nom": "Pipeline thesaurus", "entries": [{"id": 138, "titre": "Ne pas modifier le libelle fr canonique d'un terme existant", "contenu": "## Règle absolue — le `fr` canonique d'un terme ne se modifie JAMAIS automatiquement\n\n**Le champ `terms.fr` est la CLÉ D'IDENTITÉ du terme** — le libellé stable sur\nlequel s'appuie tout le rattachement (term_relations, pedago_links,\nsource_usages, citations dans fiche_retour_sections, alignement INRAE).\n\n### Pourquoi le `fr` est immuable\n\nTrois motivations cumulatives :\n\n1. **Cohérence référentielle interne** : le `fr` est référencé par\n   `term_relations` (BT/NT/RT), `pedago_links`, `source_usages`, et cité\n   textuellement dans `fiche_retour_sections`. Une modification automatique\n   (casse, ponctuation, tirets) désynchronise ces rattachements et casse la\n   traçabilité.\n2. **Alignement INRAE** : le thésaurus est aligné sur le référentiel INRAE\n   (`thesaurusINRAE_normalise.json`). Le `fr` canonique est la clé d'aller-retour\n   avec ce référentiel externe ; le modifier casse l'alignement.\n3. **Traçabilité `audit_log`** : le `fr` est la clé humaine de référence dans\n   l'`audit_log` et les arbitrages éditoriaux. Le modifier sans trace casse\n   l'historique des décisions.\n\n**Cycle vicieux d'une modification automatique** : si un script normalise le\n`fr` (casse, apostrophes, tirets), tous les rattachements qui le citent\ndeviennent orphelins ou désynchronisés, l'alignement INRAE casse, et l'audit_log\nperd la correspondance avec les décisions passées.\n\n**Incident de référence — 2026-04-20 (Chantier A)** : la normalisation de la\ncasse initiale via agents Task (commit 5970137) avait baissé la Majuscule\ninitiale de **216 termes** (Antifragilité → antifragilité, Biofilms → biofilms,\nBioturbation → bioturbation, etc.) selon une règle typographique française\nstricte. Or la casse d'origine était la convention du thésaurus (alignée INRAE\net stable référentiellement). Correction (commit 86408df) : restauration de la\ncasse d'origine pour les 216 termes + migration des term_relations associées.\n\n> **Note historique (legacy Jenni)** : avant la suppression du workflow Jenni\n> (2026-07), le `fr` servait aussi de clé d'aller-retour avec Jenni\n> (`export_thesaurus_incomplets.py` → Jenni → `import_termes.py --replace`).\n> L'import legacy docx reste possible via `--docx`, mais la motivation\n> d'immuabilité est désormais portée par la cohérence référentielle + INRAE +\n> audit_log (ci-dessus), indépendamment du canal d'import.\n\n**Interdictions absolues** :\n- ❌ Lancer un script qui modifie automatiquement la casse initiale de tous les termes\n- ❌ Normaliser les apostrophes, tirets, espaces dans le `fr` sans audit préalable\n- ❌ Appliquer une règle typographique abstraite (française, ISO 25964, etc.) au `fr` existant\n- ❌ Baser un fix sur une décision agent Task automatisée sans validation JMJ\n\n**Règles autorisées** :\n- ✅ Modifier le `fr` d'UN terme spécifique après validation explicite JMJ\n- ✅ Les agents Task peuvent CLASSIFIER / ANALYSER / COMPTER mais pas DÉCIDER d'un changement de libellé\n- ✅ Normalisations typographiques dans les champs `definition`, `syn_fr`, `syn_en` (champs secondaires, ne font pas clé d'identité)\n\n**Conséquence sur les scripts existants** :\n- `import_termes.py` : en mode `--replace`, match par `fr` normalisé (casse/apostrophes ignorées) — OK (l'import ne casse pas le canonique, il le matche)\n- Chantier A doit être considéré comme une erreur qui ne doit JAMAIS être reproduite sur le `fr` canonique\n- Si une décision éditoriale veut changer la casse/ponctuation d'un terme : passer par JMJ + audit_log de la décision\n\n**Pour les champs secondaires** (definition, syn_fr, syn_en) : les modifications (normalisation apostrophes, cleanup URLs, ajout formules OMML via parser math-aware) sont OK car ces champs ne font pas clé d'identité. (BT/RT sont des **relations** dans `term_relations`, pas des colonnes de `terms`.)\n", "type": "regle_absolue", "crit": true}, {"id": 116, "titre": "Workflow thésaurus — import, complétion, déduplication", "contenu": "## Workflow thésaurus — import MD + doctrine d'import\n\n**Chaîne de traitement complète** d'un retour thésaurus (format MD TERME/EN/DEF/SYN_FR/SYN_EN/BT/NT/RT).\n\n### 🔗 Hub doctrine thésaurus — où trouver quoi\n\nCette BQ est le point d'entrée du workflow thésaurus. La doctrine détaillée\nd'intégration est éclatée sur plusieurs BQ — s'y référer pour le détail :\n\n| Sujet | BQ | Section |\n|---|---|---|\n| **Rédaction des documents éditoriaux** (zéro méta-vocab, structure, listes triées…) | `listes_de_termes_triees_alphabetiquement_regle_abs` + `.opencode/RULES.md` + `check_forbidden_jenni.py` | règle #115 + règle méta-vocab |\n| **Intégration du retour** (général : A parser, B dédup, C subst, D audit, E log, F archivage, G cycle) | `wf_fiche_integration` + règle `integration_conseil_audit` | — |\n| **Exception thésaurus** (H.1 matching 8 axes, H.2 BT/NT/RT, H.3 arbitrage, H.5 citations n.d., H.6 strates, H.7 audit post-import, H.9 discipline amont) | **§H ci-dessous** (doctrine legacy docx active) | §H.1-H.9 |\n| **`fr` canonique jamais modifié auto (ex-H.4)** | `pas_modif_fr_canonique` + `.opencode/RULES.md` §Thésaurus | règle #138 |\n| **Import batch de termes thésaurus** (variante source `integrate_source.py`) | `wf_source_integration` | **§Variante import batch** |\n\n> 📜 **Trace historique** : la doctrine d'import Jenni d'origine vivait dans la BQ\n> `regles_de_redaction_des_documents_jenni_reference` (#146, **archivée 2026-07**\n> — Jenni supprimée du modèle). Sa section §H (exception thésaurus) reste **active\n> pour le legacy docx** et a été condensée ci-dessous en **§H**. Les règles\n> transversales (§4 méta-vocab, §9 listes triées, §H.4 fr canonique) ont été\n> migrées vers leurs BQ dédiées. Archive complète conservée pour trace :\n> `_archive/archive_2026_07_09_regles_de_redaction_jenni_obsolete.md`.\n\n**Réflexes agent** (`.opencode/RULES.md` §Thésaurus) : `thesaurus_carte`,\n`pas_modif_fr_canonique`, `termes_fichier_unique`.\n\n### 🎯 3 modes de déclenchement du workflow thésaurus\n\nLa doctrine canonique (JMJ 2026-07-14, cf. `jmj/rapports/doctrine_workflow_corpus_conscient_2026-07-14.md`)\ndistingue **3 modes de déclenchement** selon le contexte. Chaque mode a son\noutillage et son acteur principal. L'orchestrateur (GLM) est **garant de\nl'intégrité et de l'enrichissement** — un script ne remplace jamais son\njugement.\n\n| Mode | Quand | Acteur principal | Outils typiques |\n|---|---|---|---|\n| **Dynamique** | Événement au cours d'un workflow (intégration fiche révèle candidats, audit factuel signale terme mal défini, conversation JMJ mentionne terme) | Orchestrateur (seul) | MCP `create_term`/`link_terms` (unitaire), SQL direct, ajout dans `termes_a_definir.txt` |\n| **Batch** | Décision JMJ de session dédiée — cycle thésaurus classique, audit complet, import source externe | Orchestrateur + subagent rédacteur + JMJ | `import_termes.py [--md\\|--docx]` (bulk, dédup 8 axes), `audit_thesaurus.py`, Conseil d'import formel |\n| **Arbitrage** | Conflit ou décision éditoriale — doublon latent, divergence `fr` canonique (#138), synonyme mal placé, concept émergent | Orchestrateur + JMJ (+ Conseil si doute) | SQL direct (toujours), vues SQL (lecture contextuelle), Conseil d'audit |\n\n**Couche Conseil transverse** : mobilisable à tout moment (pas un 4ᵉ mode) sur\nangle mort ou enjeu caché. Cas typique : fusion doublon avec implications\nstructurelles, divergence `fr` révélant une tension doctrinale, ajout de\nconcept nécessitant un maillage aux chapeaux (cf. réflexe\n`integration_maillage_chapeaux`). Cf. BQ `conseil_modele`.\n\n> **Anti-pattern** : créer un script dédié par cas particulier (`relabel_canonique.py`,\n> `retirer_syn_safe.py`, `delete_term_safe.py`...). Ces opérations relèvent du\n> **jugement de l'orchestrateur** + SQL ciblé + `check_integrity` post-action,\n> jamais d'un script qui déciderait à sa place. Les scripts restent légitimes\n> pour le bulk déterministe, le parsing, la validation technique et les\n> calculs lourds (scoring dédup).\n\n### ⚠ Principe transversal — Synonymes/acronymes = clé des arbitrages\n\nLes **synonymes et acronymes** ne sont pas du bruit : ce sont les **pivots** qui\ndécident des arbitrages, **en amont** (création de la liste) **et en aval**\n(intégration du retour). Le matching lexical `norm()` est aveugle à la sémantique —\nce sont les synonymes/acronymes qui révèlent qu'un « nouveau » terme existe déjà.\n\n**Amont — création de la liste à envoyer (cf. §0, §2 dédup).**\nNe pas re-proposer un terme dont le **concept** existe déjà sous un autre libellé,\nacronyme ou synonyme. La dédup doit être **sémantique**, pas seulement lexicale :\n- acronyme ↔ forme longue (`POM` ↔ « matière organique particulaire », `AOA` ↔\n  « archées oxydatrices de l'ammoniac », `MAOM` ↔ « matière organique associée\n  aux minéraux ») ;\n- reformulation / singulier-pluriel (`maladie non transmissible` ↔ #3625 « maladies\n  non transmissibles », `communication inter-plantes` ↔ #3079 « Communication\n  plante-plante ») ;\n- équivalent sémantique (`métrique de biodiversité` ↔ #1449 « indice de diversité »).\n\n→ croiser le candidat contre `fr` **ET** `syn_fr`/`syn_en`/acronymes de **tous** les\ntermes avant de l'ajouter à la liste (pas seulement le `fr` canonique).\n\n**Aval — intégration du retour (cf. §2 bloqués, §3).**\nUn bloc **bloqué « multiple matches »** vient presque toujours d'un **synonyme mal\nplacé** : un nom spécifique (souvent l'anglais) logé en `syn_en` d'un terme\n**générique/taxon** capte à tort le bloc destiné au terme **spécifique** — ex.\n`Soil organic carbon` sur #1877 « Carbone » alors qu'il appartient à #403, ou\n`Ammonia-oxidizing archaea` sur #25 Thaumarchaeota alors qu'il appartient à #274.\n**Résolution non destructive** : retirer le synonyme mal placé du terme\ngénérique/taxon **après avoir vérifié qu'il est déjà présent sur le terme\nspécifique** (suppression sans perte) → le bloc s'intègre proprement en UPDATE.\n**Surtout pas** `resolve_import_conflicts` sur ces cas : il **fusionnerait** deux\ntermes distincts (incident Thaumarchaeota / Nitrosomonas frôlés).\n\nLes **acronymes / labels nus** (AMO, POM, Shannon) sont des **synonymes** de termes\ncomplets : `mode_force=skip` à l'import *standalone*, mais ils restent\nindispensables car les renvois BT/RT des autres termes s'y résolvent.\n\nRéconcilier un **doublon latent** (variante non vue par `norm()`) : ajouter la\nvariante en `syn_fr` du terme canonique → l'import matche et **UPDATE** au lieu\nd'INSÉRER un doublon.\n\nCas modèle : `jmj/rapports/audit_data/integration_thesaurus_20260606.md` (8 faux-positifs\ndébloqués par nettoyage de synonymes, 2 doublons latents réconciliés).\n\n### Méthode canonique — termes par lot de fiches (provenance + remonter le fil)\n\n**Innovation 2026-06-01 (JMJ + l'agent).** Les termes manquants du thésaurus\nn'émergent **pas** d'une liste « au hasard » : on **travaille un lot de fiches** et\nles termes manquants en sont extraits. Chaque terme **trace alors vers sa fiche\nsource** — ce *câblage amont* est le cœur de la méthode et ne doit pas être perdu.\n\n**Pourquoi.** La strate et le `doc_code` (place dans la carte des 18 documents) sont\n**internes au corpus** : un LLM externe (l'API d'audit) ne les connaît pas. La liste\nenvoyée à l'API d'audit est donc plate, alphabétique, **sans strate** (§0). Au retour, le\nplacement se ré-attribue **côté corpus** — et la provenance terme→fiche le rend\n**traçable et grounded**, sans devinette.\n\n**Chaîne complète :**\n1. **Lot de fiches** travaillé (production / intégration de #N…#M).\n2. **Extraction** des termes candidats par croisement fiches ↔ corpus (pool curaté\n   + agents d'**extraction** — `pas_agent_redacteur` autorise l'extraction, jamais la\n   rédaction de définitions). **Conserver la provenance terme→fiche.**\n3. **Dédup** `norm()` (source `text_norm.py`) sur fr/en/syn_fr/syn_en (homonymes : arbitrer — ex.\n   « sélénite » minéral vs ion → `ion sélénite`).\n 4. **Liste §0** (plate, triée, sans strate) → production des définitions (TERME/EN/DEF/SYN/BT/NT/RT).\n5. **Import** `import_termes --replace` : le mapping (terme→strate/doc_code, issu de la provenance) ré-attribue le placement côté corpus.\n6. **Analyse consciente** (jamais un import mécanique) :\n   - **remonter le fil** : chaque terme → sa fiche source → strate/`doc_code` du sujet\n     sur la carte des 18 docs (S4 cycles, V3 fermentations, P1 diagnostic, H1 santé…) ;\n   - **terme vs concept** : un terme = *vocabulaire* ; une **affirmation/hypothèse**\n     relève du filtre `concept_cards`, pas d'un INSERT terme (BQ `modele_conceptuel`) ;\n   - **contrôles** : 0 fuite méta-vocab dans `terms.definition` (`audit_thesaurus` row E),\n     anglicismes `fr==en` (hors cognats/taxons), type `concept`/`glossaire` ;\n   - **arbitrage fr canonique** (#138) : un TERME l'API d'audit divergent ne s'écrit pas en dur\n     — décision JMJ (ex. `CO2` → `dioxyde de carbone`, 2026-06-01).\n   - **vigilance dérive de libellé (acronymes / reformulation)** : l'API d'audit ajoute ou\n     retire parfois l'acronyme, ou reformule le `fr`. Vérifier que le libellé rendu\n     correspond à l'envoi ; le `fr` canonique reste **stable** (#138), l'acronyme va\n     en `syn_fr`/`syn_en`, toute divergence réelle est **arbitrée** (jamais écrite en\n     dur). `import_termes` signale déjà le « fr divergent », mais le traitement\n     **par lots (1/session)** impose de re-vérifier la **cohérence inter-lots** : le\n     même concept peut revenir sous deux libellés selon le lot (`MAOM` au lot N,\n     `matière organique associée aux minéraux` au lot N+1) → réconcilier.\n   - **dédoublonnage sémantique** (pas seulement lexical) : `import_termes`\n     dédupe par `norm()` (casse/accents/apostrophes/pluriels) — il **ne rapproche\n     PAS** une forme longue et son acronyme (`ARG` ↔ `gène de résistance aux\n     antibiotiques`, `MAOM` ↔ `matière organique associée aux minéraux`) ni deux\n     formulations synonymes. Croisement conscient **obligatoire** avant INSERT pour\n     éviter les doublons latents (cf. `audit_thesaurus` row D). Les formules en\n     chiffres plats restantes (`CO2`, `CH4`…) se normalisent en unicode au passage.\n   - **anti-doublon multi-axes** (au-delà du `norm()` lexical, sources avérées de doublons) :\n     - **singulier/pluriel** et variantes orthographiques — `norm()` absorbe les\n       pluriels réguliers, mais re-vérifier les cas tordus ;\n     - **caractères indésirables infiltrés en DB** — espace insécable, zéro-largeur,\n       caractère de contrôle, soft-hyphen. Ils font **échouer le match** : le terme\n       ressort « propre » dans une liste à définir et est re-proposé → faux nouveau\n       terme = doublon. **Scanner et nettoyer `terms.fr/syn`** de ces parasites\n       AVANT de générer toute liste ;\n     - **confusion SYN** — un `fr` qui est en réalité le **synonyme** d'un autre terme\n       (ex. `Oxydo-réduction` ↔ syn de `Redox`, `densité apparente` ↔ syn de `densité`)\n       est un doublon latent à **fusionner** (audit_thesaurus row D), pas un terme\n       distinct ;\n     - **croiser les RT** — vérifier que les `RT` rendus pointent vers des termes réels\n       et cohérents (orphelins, casse, polysémie — audit_thesaurus row C) ;\n     - **vérif FR/EN** — `en` présent et cohérent avec `fr` ; `fr==en` toléré seulement\n       pour cognats/taxons, sinon anglicisme déguisé (audit_thesaurus row G).\n7. **Rapport** d'analyse consciente dans `jmj/rapports/audit_data/` + entrée `audit_log`.\n\n**Cas modèle** : lot fiches #238-249 → 120 termes (2026-06-01),\n`jmj/rapports/audit_data/analyse_termes_thesaurus_2026-06-01.md`.\n\n**Anti-pattern** : lancer `import_termes --apply` sans analyse consciente ni\nremonter-le-fil → placement deviné, terme/concept non trié, provenance perdue.\n\n### 0. Format canonique de la liste « termes à définir » — RÈGLE UNIQUE\n\n**Une seule façon de faire**, valable pour toute liste de termes candidats\nenvoyée à l'API d'audit (vague d'audit, hyperonymes, nouveaux concepts issus du corpus).\nNe plus en inventer d'autre.\n\n- **Emplacement — UN SEUL fichier pour tous les workflows** : **`recherches/thesaurus/termes_a_definir.txt`**. Pas de numéro, pas de date, pas de copie. C'est **à la fois** l'accumulateur de candidats ET la liste envoyée à l'API d'audit.\n\n- **Vie du fichier — le CYCLE** (accumulation → résolution → purge) :\n    1. **Accumulation** (l'agent, en continu) : à **chaque** intégration qui révèle\n       un terme absent, l'agent **ajoute** le candidat dans `termes_a_definir.txt` —\n       intégration fiche (volet C / Étape 7.4 `wf_fiche_integration`), import termes\n       thésaurus (orphelins BT/RT du lot — `wf_source_integration` §Variante étape 6),\n       solde post-audit corpus, notes volantes. Dédup contre `terms` ET contre le\n       fichier, tri alpha (#115), artefacts filtrés à la main.\n    2. **Maintenance / résolution** (décision JMJ) : `export_thesaurus_incomplets\n       --single-txt` **réécrit le fichier en place** — il PRÉSERVE les candidats\n       manuels accumulés ET y réinjecte les termes DB incomplets (à enrichir), dédup\n       `normalize`, near-dups B6 en WARN. Le fichier est ensuite envoyé pour production\n       des définitions.\n     3. **Import + purge** : le retour se réimporte avec `import_termes.py\n       --sent recherches/thesaurus/termes_a_definir.txt` → `--sent` **archive (purge)**\n       le fichier envoyé (`→ recherches/thesaurus/archives/`) à l'apply. Un **nouveau\n       cycle** démarre : `termes_a_definir.txt` repart vide, amorcé par les orphelins\n       BT/RT du lot qu'on vient d'importer (boucle → étape 1).\n   ⚠ **Ordre quand un retour thésaurus ET une fiche sont en attente** (règle JMJ\n   2026-06-07) : intégrer **le retour thésaurus AVANT la fiche**. L'intégration d'une\n   fiche **ré-accumule** des candidats dans `termes_a_definir.txt` ; or `--sent`\n   **archive/purge le fichier entier** à l'apply. Si la fiche passe d'abord, ses\n   candidats sont purgés **sans avoir été envoyés à l'API d'audit** → perdus du cycle.\n   ⚠ Le fichier **peut** être édité à la main (l'agent y ajoute des candidats) — c'est\n   voulu. `export_thesaurus_incomplets` ne l'écrase pas : il le relit et le fusionne.\n- **Format** : **un terme par ligne, UNIQUEMENT le terme.** Pas de tiret, pas de\n  puce, pas de numéro, pas de préfixe, pas de titre, pas d'annotation (fréquence,\n  strate, catégorie, case à cocher). Le fichier ne contient QUE les libellés bruts.\n- **Tri** : alphabétique `lower(fr)` accent-insensible (NFKD) — règle absolue #115.\n- **Libellés bruts** : la forme proposée telle quelle, jamais normalisée\n  (règle #138 — le `fr` canonique ne se décide pas côté l'agent).\n- **Acronymes — UNE SEULE forme par ligne, jamais `terme (ACRO)`.** Règle :\n    - concept à **nom français descriptif** → envoyer **le nom complet seul** ;\n      l'acronyme sera rattaché en **synonyme** (`syn_fr`/`syn_en`) au retour ;\n    - **sigle / standard propre** sans nom français courant (SHAPE, SMAF, CASH, VESS,\n      NIRS, DGT, ISO 23611, REW…) → envoyer **l'acronyme seul** comme libellé ;\n    - **jamais les deux formes** dans le même libellé.\n- **Filtres amont obligatoires** : exclure pseudoscience (#154), pratiques-recettes\n  typées (KNF/JADAM/LiFoFer…), méta-vocab (`check_forbidden_jenni.py`), mots génériques, et synonymes\n  d'entrées déjà présentes (match `norm()` sur fr/en/syn_fr/syn_en).\n- **Vérif avant envoi** : `check_forbidden_jenni` → zéro méta-vocab.\n\n### Format MD attendu\n\nLe fichier `jmj/rapports/deepseek/thesaurus_<date>.md` contient **un bloc par terme**, séparé par `---` :\n\n```md\n## <terme-fr-canonique>\n\n- EN: <terme-anglais>\n- SYN_FR: <synonyme1>; <synonyme2>\n- SYN_EN: <synonyme1>\n- BT: <broader-term-fr>\n- NT: <narrower-term-fr>\n- RT: <related-term-fr>; <related-term-fr-2>\n- TYPE: <concept|glossaire|class>\n\n<définition libre en prose, citations APA inline (Auteur, année)>\n```\n\nRègles :\n- `##` obligatoire (titre du bloc = `fr` canonique proposé)\n- Champs multiples : séparateur `; `\n- `BT`/`NT`/`RT` : utiliser le `fr` canonique des termes existants (vérifier en DB)\n- `TYPE` : `concept` (défaut) / `glossaire` (entrée technique) / `class` (hyperonyme structurel)\n- Définition : prose libre, citations APA `(Auteur, année)`, **0 méta-vocab** (`card #N`, `fiche #N`, codes doc…)\n\n### 2. Import retour (commande `/integrate-thesaurus`)\n\n**MD natif** :\n\n```bash\n# Dry-run (analyse consciente obligatoire avant apply)\npython3 tools/integration/import_termes.py --db sol_vivant.db \\\n    --md jmj/rapports/deepseek/thesaurus_<date>.md --replace --rels-mode merge\n\n# Apply (après dry-run + arbitrage)\npython3 tools/integration/import_termes.py ... --apply\n```\n\n**Legacy docx (Jenni)** :\n\n```bash\npython3 tools/integration/import_termes.py --db sol_vivant.db \\\n    --docx docx/thesaurus_<date>.docx --replace --rels-mode merge \\\n    --sent recherches/thesaurus/termes_a_definir.txt\n```\n\n**Variante multi-strates** (rare, legacy docx) : ajouter `--mapping recherches/thesaurus/mapping_<date>.csv`.\n\nFlags :\n- `--replace` : UPDATE intégral si match unique (sinon INSERT seul). Préservé : `fr` canonique (#138), `definition` solide, `syn_fr`/`syn_en` fusionnés.\n- `--sent <txt>` : **obligatoire si un `termes_a_definir.txt` a été envoyé à l'API d'audit/Jenni** — archive le `.txt` et le fichier réponse à l'apply (clôture le cycle §0). Legacy principalement.\n- `--apply` : sans lui = dry-run (aucune écriture).\n- `--rels-mode merge` : **défaut** — ne pas l'écrire. `--force-defs` et `--allow-rels-destruction` : rarement requis (guardrails anti-perte).\n\nMode `--replace` = UPDATE intégral si match unique trouvé. Sans match = INSERT. Multiples matches = BLOQUÉ (conflit à résoudre, §3).\n\nContrôle anti-doublon 8 axes : fr/en cross × syn_fr/syn_en cross.\n\n### 3. Résolution conflits (bloqués multi-match)\n\n```bash\npython3 tools/integration/resolve_import_conflicts.py --db sol_vivant.db --md X.md \\\n    --skip-fr \"MO,Rhizodéposition\"  # faux positifs norm()\npython3 tools/integration/resolve_import_conflicts.py ... --apply\n```\n\n**Fonctionnalités clés** :\n- `--skip-fr` : exclut les termes dont `norm()` collisionne à tort\n  (ex: `norm(\"Mo\") = norm(\"MO\") = \"mo\"` : Molybdène vs Matière Organique)\n- Reload d'index entre chaque résolution : évite chain-collisions\n\n⚠ **NE PAS utiliser** `resolve_import_conflicts` sur les synonymes mal placés — il fusionnerait des termes distincts. Retirer le synonyme à la main après vérification.\n\n### 4. Déduplication périodique\n\n```bash\npython3 tools/admin/dedupe_thesaurus.py --db sol_vivant.db  # dry-run\npython3 tools/admin/dedupe_thesaurus.py --db sol_vivant.db --apply\n```\n\nFusion avec scoring qualité + migration term_relations + merge syn_fr/syn_en.\n\n### 4bis. Archivage post-intégration (pattern git mv obligatoire)\n\nUne fois le retour intégré (UPDATEs/INSERTs/arbitrage collisions) :\n\n```bash\n# MD natif (l'API d'audit)\ngit mv jmj/rapports/deepseek/thesaurus_<date>.md recherches/thesaurus/archives/thesaurus_<date>.md\n\n# Legacy docx (Jenni)\ngit mv docx/thesaurus_<date>.docx docx/archives/thesaurus_<date>.docx\n```\n\n**Pourquoi `git mv`** : git détecte automatiquement le rename, garde l'historique du fichier, et évite le pattern « delete unstagé après commit ».\n\nSi le `mv` est déjà fait (oubli) : `git add -A` capture le delete et l'add en une fois.\n\n### 5. Audit\n\nScript inline dans sessions : vérifier 11 axes (distribution, complétude,\nleaks méta-vocab, doublons, acronymes orphelins, pseudoscience, statut,\norphelins relations, couverture INRAE, isolation).\n\n### ⚠ Qualité éditoriale des listes — pas la taille (constat 2026-04-14)\n\nLa taille n'est PAS le facteur principal de dérive du LLM. Une liste propre tient jusqu'à ~150 termes en un envoi. À l'inverse, une petite liste mal cadrée peut la faire dérailler.\n\nCauses réelles de dérive (à diagnostiquer en pré-envoi) :\n1. **Tri erratique** — case-sensitive ASCII cassait la perception d'ordre. Corrigé par `lower(fr)` partout.\n2. **Termes `fr == en` (anglais déguisé)** — 140 cas dans la DB au constat. Demander de définir en français un terme qui est en anglais fait dériver vers une définition anglaise. Audit + correction au cas par cas.\n3. **Doublons / sub-concepts mélangés** — ex : avoir « polysaccharides » et « EPS » tous deux dans la liste sans hiérarchie crée de l'ambiguïté.\n4. **Termes mal cadrés** — entrées historiques imprécises ou avec méta-vocab résiduel.\n\n**Solution prioritaire** : qualité de la liste avant envoi, pas fragmentation forcée.\n\n### Tri alphabétique strict\n\nTous les exports `ORDER BY fr` sont passés à `ORDER BY lower(fr)` pour éviter le tri ASCII case-sensitive.\n\n### H. Import legacy docx Jenni — doctrine (ex-§H de #146, archivée 2026-07)\n\n> 🎯 **Cette section documente le mode BATCH legacy** (format docx). Pour le\n> format natif actuel (**MD**, subagent rédacteur sous instruction), voir §0\n> ci-dessus et `jmj/rapports/doctrine_workflow_corpus_conscient_2026-07-14.md`.\n> Pour les modes **dynamique** et **arbitrage**, voir le tableau des 3 modes\n> en tête de cette BQ.\n\nLa BQ `regles_de_redaction_des_documents_jenni_reference` (#146) a été archivée\n2026-07 (Jenni supprimée du modèle de production). Sa **doctrine d'import thésaurus\nreste active** pour le legacy docx (`import_termes.py --docx`). Cette section\nla condense et la reloge ici. Archive complète : `_archive/archive_2026_07_09_regles_de_redaction_jenni_obsolete.md`.\n\n#### H.1 Matching et anti-doublon 8 axes\n\nChaque terme entrant est confronté à 8 axes de match normalisés (`norm()` :\ncasse, accents, apostrophes, pluriel simple) — `fr`/`en` croisés sur\n`terms.{fr,en,syn_fr,syn_en}`.\n\nRègle de priorité (fix 2026-04-21) : **si aucun match direct (axes 1-4) et\nmulti-match uniquement via synonymes (axes 5-8), INSERT permis** — la polysémie\nd'un `syn_en` entre plusieurs termes est tolérée si le `fr` est unique (ex :\n`Substance humique` fr unique + `Humic substance` syn_en partagé → INSERT légitime).\n\n#### H.2 Résolution BT/NT/RT et orphelines\n\nLes relations BT/NT/RT fournies en texte brut sont résolues vers `to_term_id` via\nl'index normalisé (`fr | en | syn_fr | syn_en`). Workflow : `build_fr_index(con)`\nconstruit `{norm(champ) → term_id}`, `write_relations(from_id, rel_type, raw_text)`\nsplit sur `;,·`, normalise, cherche, insère en `term_relations` (ou `to_term_id NULL`\nsi orphelin).\n\n**Orphelines** : beaucoup de cibles BT/RT pointent vers des termes non présents\n(catégories taxonomiques, hyperonymes non créés). Stockées en `to_term_text` avec\n`to_term_id = NULL` — **informatif** (vocabulaire contrôlé, pas encyclopédie).\n\n**Re-résolution périodique** : après chaque lot, repasser sur les orphelines\n(`to_term_id IS NULL`) — les nouveaux termes peuvent rendre résolubles d'anciennes\ncibles. Gain typique +5 à +10 % par passe (cf. `audit_thesaurus` row C).\n\n#### H.3 Arbitrage éditorial conscient\n\n- **Fusions** (doublons latents, ex : `antibiorésistance` ↔ `résistance aux\n  antibiotiques`) : détection par scan « syn d'un = fr d'un autre » → **JMJ arbitre**\n  qui garde → exécution `resolve_import_conflicts.py --apply` + merge manuel.\n- **Nettoyage syn_fr erronés** (hiérarchie confondue avec synonymie, ex :\n  `goethite` syn_fr de « Oxydes Fe/Al » = c'est un membre) : retirer de `syn_fr` +\n  créer BT/NT ou RT.\n- **Polysémie/acronymes** (`MO` vs `Mo` : Matière organique vs Molybdène) :\n  `norm()` collisionne → `--skip-fr` dans `resolve_import_conflicts.py`.\n\n⚠ **Ne pas utiliser** `resolve_import_conflicts` sur les synonymes mal placés (cf.\n§« Principe transversal » ci-dessus) — il fusionnerait des termes distincts.\n\n#### H.4 `fr` canonique — règle absolue\n\n→ **Migrée vers BQ dédiée `pas_modif_fr_canonique`** (règle #138). Le champ\n`terms.fr` ne se modifie jamais automatiquement (casse/ponctuation/espaces) —\ncycle Jenni cassé sinon. Modifications ciblées uniquement après validation JMJ.\n\n#### H.5 Résolution citations `n.d.` pre-intégration\n\nJenni/l'API d'audit peuvent produire des `(Titre, n.d.)` quand la date n'est pas extraite.\nWorkflow de correction **avant intégration** :\n1. Extraire le RIS, identifier les refs avec DOI.\n2. Résoudre les DOI via Crossref (gratuit) → année + auteurs + journal.\n3. RIS enrichi (nouveau fichier, ne modifie pas l'original).\n4. Patcher le docx : substitution `(Titre, n.d.)` → `(Auteur, année)`, opération\n   length-preserving pour préserver les runs Word.\n5. Re-vérifier : 0 `n.d.` restant avant intégration DB.\n\nSubstitution de métadonnées factuelles vérifiables → **autorisée côté l'agent**,\npas de la rédaction.\n\n#### H.6 Reclassement strates et doc_code\n\nLes nouveaux termes entrent par défaut en strate `S` (souvent). Reclassement selon\nle **thème** (heuristique mots-clés dans `fr` + `definition`) :\n- **F** : fondements, thermodynamique, évolution, politique, économie\n- **S** : sol, rhizosphère, bactérie du sol, cycle biogéochimique\n- **V** : plante, racine, photosynthèse, symbiose plante-microbe\n- **P** : pratique, rotation, couvert, compost, biochar, fermentation\n- **H** : humain, intestin, microbiome humain, santé\n\nIndécidables → `S` par défaut, JMJ corrige les cas particuliers à l'œil\n(ex : `érosion` auto-classé H par co-occurrence « humain » alors que clairement S).\n\n#### H.7 Audit post-intégration obligatoire\n\nAprès chaque `--apply`, vérification systématique :\n- **Diff source / DB** : chaque terme intégré doit avoir DEF/SYN_FR/SYN_EN/EN\n  identiques à la source (whitespace normalisé).\n- **Parenthèses vides** `\\(\\s*\\)` dans def/syn → 0 toléré (indicateur formule\n  OMML mal parsée).\n- **URLs dummy-citation** `dummy-citation.com` → 0 toléré.\n- **n.d.** dans les définitions → 0 toléré (traité en H.5).\n- **Relations BT/RT résolues** : compter le ratio résolues/orphelines par type.\n- **Re-résolution globale** des orphelines préexistantes.\n- **Audit strates/docs_code** + **scan doublons latents** (syn d'un = fr d'un autre).\n\nScript : `tools/lib/audit_post_import.py`.\n\n#### H.8 Scripts et fonctions clés\n\n- `tools/integration/import_termes.py` : import principal, matching 8 axes,\n  modes `--replace` / `--insert-only` / `--md` (l'API d'audit natif) / `--docx` (legacy).\n- `tools/integration/resolve_import_conflicts.py` : résolution bloqués multi-match\n  avec `--skip-fr`.\n- `tools/admin/dedupe_thesaurus.py` : déduplication périodique (scoring qualité).\n- `tools/lib/term_rels.py::build_fr_index()` + `write_relations()` : résolution FK.\n- `tools/lib/term_rels.py::norm()` : normalisation matching.\n- `tools/lib/audit_post_import.py` : audit post-import systématique (H.7).\n\n#### H.9 Discipline amont — termes envoyés doivent être propres\n\nToute liste de termes préparée pour l'API d'audit/Jenni doit être **vérifiée\northographiquement avant envoi**. Le LLM ne corrige pas l'orthographe — il\nreproduit ce qu'on lui donne, et le retour devient la nouvelle référence (cycle\nvicieux si forme altérée).\n\nContrôles obligatoires avant envoi :\n1. **Tri `ORDER BY lower(fr)`** (anti-mélange casse).\n2. **Casse cohérente** (Majuscule initiale concepts + minuscule taxons latins).\n3. **Pas de ponctuation parasite** (virgule terminale, point final, double espace).\n4. **Apostrophes normalisées** (jamais mélangées dans une même liste).\n5. **Forme canonique** : si un terme existe en DB, envoyer la forme exacte\n   `terms.fr` (règle #138), pas une variante.\n\nOutils : `export_thesaurus_incomplets.py` applique\ndéjà ces règles (tri `lower(fr)`, forme exacte, filtre `flag_pseudoscience=1`).\nLes listes manuelles doivent être vérifiées à l'œil ou via `check_integrity.py`.\n\n**Lien avec H.4** : H.4 interdit la modification auto du `terms.fr` en DB ; H.9\nimpose en amont que la forme envoyée soit propre. Les deux règles forment le\n**cycle fermé qui protège le thésaurus** contre la dérive orthographique.\n\n### Voir aussi (audit)\n\n- BQ `audit_thesaurus` — doctrine d'audit thésaurus avec passes T1/T2/B1/A1/M1\n- BQ `audit_integrite_db` — sanity check FK et doublons schema\n- Commande `/integrate-thesaurus` — intégration thésaurus\n- Skill `integrate-terms` — chargé par `/integrate-thesaurus`\n- Skill `thesaurus-edit` — édition terme isolé\n\n---\n\n### Maintenance SQL (absorbé depuis `maintenance_thesaurus`)\n\nAjouter un terme concept :\n```sql\nINSERT INTO terms (section_key, strate, fr, en, definition, doc_code, type, statut)\nVALUES ('S2', 'S', 'terme fr', 'english term', 'Définition complète.', 'S2', 'concept', '◆');\n```\n\nAjouter un terme glossaire (support, définition courte) :\n```sql\nINSERT INTO terms (section_key, strate, fr, en, definition, doc_code, type, statut)\nVALUES ('S2', 'S', 'terme fr', 'english term', 'Définition courte.', 'S2', 'glossaire', '~');\n```\n\n**Deux types de termes** : `concept` (défaut — terme structurant avec définition, synonymes, INRAE, relations) / `glossaire` (support, définition courte, pas de synonymes requis).\n\nRéassigner : `UPDATE terms SET doc_code = 'S1', section_key = 'S1' WHERE id = 237;`\n\nFusionner un doublon : `DELETE FROM terms WHERE id = 238;` (garder le plus complet).\n\n### Règle — listes triées alphabétiquement (absorbé depuis `listes_de_termes_triees`)\n\nToute liste de termes préparée pour production **doit être triée alphabétiquement** sur le libellé FR (`ORDER BY lower(fr)`). Une liste non triée (par ordre d'ajout, par id, par strate) génère des oublis et des blocs imprévisibles.\n", "type": "commande", "crit": false}, {"id": 154, "titre": "Sujets interdits dans le corpus — biodynamie, Steiner, anthroposophie", "contenu": "## Sujets interdits dans le corpus Sol Vivant\n\n### Règle absolue\n\nLe corpus \"Le Sol Vivant cet Holobionte\" est un corpus **scientifique**. Certains courants ou doctrines **pseudoscientifiques** ne doivent pas y apparaître comme références constructives (définitions qui s'appuient dessus, relations qui les valorisent, citations qui les adoptent).\n\n### Liste noire (à date)\n\n- **Biodynamie** (Rudolf Steiner, 1924)\n- **Anthroposophie** (doctrine source de la biodynamie)\n- **Préparations biodynamiques** (BD 500-507 : bouse en corne, achillée en vessie, etc.)\n- **Calendrier lunaire biodynamique**\n- Par extension, toute doctrine ésotérique présentée comme technique agricole validée\n\n### Ce qui est autorisé\n\n- **Contre-exemple pédagogique** : mentionner la biodynamie comme illustration d'une dérive pseudoscientifique, dans une section **dédiée et explicitement critique** (ex. un encadré \"pièges épistémiques\"). Doit rester exceptionnel et marqué.\n- **Flag `flag_pseudoscience=1`** sur un terme isolé (mais pas utilisé comme hyperonyme/rt pour des termes scientifiques).\n\n### Ce qui est interdit\n\n- Définition d'un terme scientifique qui **attribue son origine** ou **donne comme référence principale** la biodynamie / Steiner.\n- Relations `BT`/`RT` entre un terme scientifique et un terme pseudoscientifique (ex : Capital biologique --RT--> Agriculture Biodynamique).\n- Citations bibliographiques sur préparations biodynamiques utilisées dans une fiche scientifique.\n- Tout doublon d'un concept scientifique avec une version pseudoscientifique (ex : \"L'Organisme-Ferme\" thermodynamique **vs** \"l'Organisme-Ferme\" steinerien).\n\n### Process de vigilance\n\nÀ lancer avant tout import massif (export Jenni, analyse corpus, création fiche) :\n\n```sql\n-- Termes\nSELECT id, fr, doc_code, definition, flag_pseudoscience\nFROM terms\nWHERE lower(fr) LIKE '%biodynam%'\n   OR lower(definition) LIKE '%biodynam%'\n   OR lower(definition) LIKE '%steiner%'\n   OR lower(definition) LIKE '%anthroposoph%';\n\n-- Relations\nSELECT id, from_term_id, rel_type, to_term_id, to_term_text\nFROM term_relations\nWHERE lower(to_term_text) LIKE '%biodynam%'\n   OR lower(to_term_text) LIKE '%steiner%'\n   OR lower(to_term_text) LIKE '%anthroposoph%';\n\n-- Sources Jenni\nSELECT id, doi, auteurs, annee, titre_court\nFROM sources\nWHERE lower(titre_court) LIKE '%biodynam%'\n   OR lower(titre_complet) LIKE '%biodynam%'\n   OR lower(auteurs) LIKE '%steiner%';\n\n-- Sections (prompts), concept_cards, fiches : mêmes recherches textuelles\n```\n\nLe terme `flag_pseudoscience=1` dans le thésaurus reste la trace technique, mais cette BQ est la **doctrine visible** au démarrage de session via `session_start.py --db sol_vivant.db`.\n\n### Incident de référence — 2026-04-23\n\nAudit corpus complet (`analyse_corpus.py --type complet`). La passe T2 détecte un doublon `L'Organisme-Ferme` :\n- **#1158 (F)** — définition thermodynamique scientifique (Ikerd, Tello et al.) — **propre**\n- **#214 (F2)** — définition steinerienne (\"concept central de l'agriculture biodynamique, formulé par Rudolf Steiner en 1924\") — **contaminée**\n\nContamination associée :\n- Terme **#160 \"Agriculture Biodynamique\"** (F1/F2), flag_pseudoscience=1, déf détaillant les préparations BD 500-507\n- Relation **#168 Capital biologique --RT--> #160** (valorisation croisée)\n- Relations depuis #214 vers \"Rudolf Steiner\", \"Autosuffisance\" (concepts anthroposophiques)\n- Source **sources #404 Pettinelli 2023** \"Is there any influence of biodynamic preparation 501...\"\n\nCorrectif appliqué (2026-04-23) :\n- `DELETE FROM terms WHERE id IN (160, 214)` → 2 termes supprimés\n- `DELETE FROM term_relations WHERE from_term_id IN (160, 214) OR to_term_id IN (160, 214)` → ~11 relations supprimées\n- #1158 \"L'Organisme-Ferme\" (F) conservé comme source unique\n\nSource js#404 et citation dans fiche #33 : arbitrage séparé JMJ (référence bibliographique utilisée par §3.11 d'une fiche intégrée).\n\n### Corollaire — contrôle de nouveaux imports\n\nTout nouvel import (Jenni, enrichissement thésaurus, nouvelle source) qui ramène biodynamie/Steiner sans marqueur critique explicite doit être **rejeté à l'import** ou **flaggé** pour validation manuelle JMJ.\n\n### Faux positifs à ne pas traiter\n\nLes requêtes SQL de vigilance ci-dessus remontent des occurrences légitimes qui ne sont **pas** des contaminations :\n\n- **Steinernema** — genre de nématodes entomopathogènes (*Steinernema carpocapsae*, *S. feltiae*). Utilisé en protection biologique. Cf. card #91 IPMO.\n- **Auteurs nommés Steiner** — nom de famille scientifique courant (ex. Steiner 2019 agronomie soja brésilien, Steiner dans études basalt / enhanced weathering). Ne rien faire si le contexte est bibliographique strict.\n- **Système de Steiner** en mathématiques / autres contextes non-agricoles.\n\nRègle : ne purger que si le contexte est **agricole + doctrinal** (préparations biodynamiques, anthroposophie, calendrier lunaire, \"organisme-ferme\" steinerien, etc.). Avant toute suppression, lire le contexte et confirmer.\n\n## Voir aussi\n\n- `pseudo` — trace technique (colonne `flag_pseudoscience`, terme #160). Cette BQ = doctrine visible au démarrage de session.\n", "type": "doctrine", "crit": true}]}, "validations": {"nom": "Pipeline validations", "entries": [{"id": 105, "titre": "Validations — workflow et structure (table dédiée)", "contenu": "## Validations — workflow et structure\n\n**Différence avec une fiche** : la fiche est un **zoom proactif** sur un sujet intéressant en soi ; la validation est un **comblement réactif** d'une dette identifiée dans le corpus (chaîne non validée, concept non étayé, lacune détectée par audit).\n\nLes deux contribuent au même objectif : **clôturer les prompts des docs de strate**. Cf. BQ « Modèle conceptuel — production du corpus ».\n\n### Tables\n\n```sql\nCREATE TABLE validations (\n  id              INTEGER PRIMARY KEY AUTOINCREMENT,\n  slug            TEXT UNIQUE NOT NULL,\n  titre           TEXT NOT NULL,\n  mode            TEXT NOT NULL,    -- 'validation' | 'renforcement' | 'comblement'\n\n  -- Objet à valider/combler\n  objet_type      TEXT,             -- 'chaine_causale' | 'concept' | 'lacune' | 'affirmation' | 'transversal'\n  objet_ref       TEXT,             -- ex: 'C7', id_term, 'S2.ch3.s2', texte libre\n\n  -- Cibles : ce qui sera clôturé par cette validation\n  docs_cibles     TEXT,             -- JSON ['F2','S2','P2','P5']\n  prompts_cibles  TEXT,             -- JSON [prompt_id,...] optionnel si granularité fine\n\n  -- Demande\n  question        TEXT,             -- formulation claire de ce qu'on cherche / ce qu'on valide\n\n  -- Cycle de vie\n  statut          TEXT DEFAULT 'a_faire',\n                                    -- a_faire | en_cours | envoye | recu | integre | archive\n  verdict         TEXT,             -- pour mode='validation' : 'confirme'|'infirme'|'nuance'|'reserves'\n\n  date_creation   TEXT DEFAULT (datetime('now')),\n  date_envoi      TEXT,\n  date_retour     TEXT,\n  date_integration TEXT,\n\n  notes           TEXT,             -- notes libres l'agent (pas pour Jenni)\n  updated_at      TEXT DEFAULT (datetime('now'))\n);\n\nCREATE TABLE validation_sections (\n  id              INTEGER PRIMARY KEY AUTOINCREMENT,\n  validation_id   INTEGER NOT NULL REFERENCES validations(id),\n  ordre           INTEGER NOT NULL,\n  type            TEXT NOT NULL DEFAULT 'section',  -- intro | section | verdict\n  titre           TEXT,\n  contexte_sci    TEXT,             -- ce que le corpus dit déjà\n  instructions    TEXT,              -- questions/demandes précises à Jenni\n  enrichissement  TEXT,             -- contexte additionnel pour Jenni (rare)\n  UNIQUE(validation_id, ordre)\n);\n\nCREATE TABLE validation_contenus (\n  id              INTEGER PRIMARY KEY AUTOINCREMENT,\n  validation_id   INTEGER NOT NULL REFERENCES validations(id),\n  version         INTEGER DEFAULT 1,\n  contenu_brut    TEXT,             -- contenu .docx Jenni brut\n  contenu_integre TEXT,             -- contenu nettoyé/intégré\n  refs            TEXT,             -- JSON [doi,...] récupérés post-Jenni → intégrés dans `sources`\n  notes_agent    TEXT,             -- notes d'analyse agent\n  date_import     TEXT DEFAULT (datetime('now')),\n  UNIQUE(validation_id, version)\n);\n```\n\n### Modes\n\n| Mode | Quand l'utiliser | Objet typique |\n|---|---|---|\n| `validation` | Vérifier une affirmation existante du corpus, valider une chaîne causale | `chaine_causale` (C1-C9), `affirmation` |\n| `renforcement` | Renforcer un sujet sous-couvert dans le corpus | `transversal` (par strate ou thématique) |\n| `comblement` | Combler une lacune précise identifiée par audit | `lacune` (section/chapitre précis) |\n\nLa frontière entre les 3 modes peut être floue — c'est intentionnel. Ce qui compte est l'objet (`objet_type`/`objet_ref`) et les docs cibles. Le mode est informatif.\n\n### Cycle de vie (`validations.statut`)\n\n```\na_faire   → créée en DB (objet, mode, docs_cibles, sections)\nen_cours  → l'agent prépare/affine le prompt Jenni\nenvoye    → fichier .txt généré et copié dans Jenni\nrecu      → .docx Jenni récupéré\nintegre   → contenu intégré dans prompts.contexte_sci/.enr des docs cibles\n            + termes extraits vers terms\n            + contenu brut/intégré stocké dans validation_contenus\n            + verdict renseigné si mode='validation'\narchive   → terminé, sort de la vue active\n```\n\n### Workflow\n\n1. **Identifier une dette** : audit révèle une lacune, une chaîne causale non validée, un concept faible\n2. **Créer la validation** : `INSERT INTO validations` avec mode + objet + docs_cibles\n3. **Renseigner les sections** : `validation_sections` (intro, sections de question, verdict si validation)\n4. **Générer le prompt** : `export_validation.py --slug <slug>` → `recherches/prompts_validation_{slug}.txt`\n5. **Envoyer à Jenni**, récupérer le .docx\n6. **Intégrer** : l'agent analyse le .docx → `validation_contenus` + `prompts.contexte_sci/.enr` des docs cibles + verdict si validation\n7. **Marquer `integre`**, puis `archive` quand terminé\n\n### Charte applicable\n\nLes prompts de validation suivent la **charte de rédaction transversale** (`check_forbidden_jenni.py` + `.opencode/RULES.md`, ex-#146 archivé 2026-07) :\n- Pas de codes docs (S0, V2…)\n- Pas de méta-vocabulaire (corpus, thésaurus…)\n- Citations format `[N]`\n- Blocs séparés par `---`\n\n**Pas de structure standardisée 8 sous-blocs** (qui est spécifique aux fiches techniques). Une validation a une structure libre adaptée à la question posée.\n\n### Distinction des champs (règle stricte)\n\n- `validation_sections.contexte_sci` = ce que le corpus/la science dit déjà sur l'objet\n- `validation_sections.instructions` = questions précises à Jenni pour valider/combler\n- `validation_sections.enrichissement` = contexte additionnel pour Jenni si nécessaire (rare)\n- `validation_contenus.contenu_integre` = ce que Jenni a renvoyé, intégré\n\n**Jamais** mélanger contenu reçu et instructions de production — chacun dans sa table.\n\n### Lien avec la production du corpus\n\nUne validation `integre` alimente les `prompts` des docs cibles, contribuant à leur clôture. Tant qu'une validation pertinente reste à produire, le doc cible n'est pas en `pret_a_rediger`.\n\n### Exemples actuels (à migrer en Phase 2)\n\n| Slug actuel | Source | Migration |\n|---|---|---|\n| `validation-c7-performance-robustesse` (table fiches) | `revue_critique` de la chaîne C7 | mode=`validation`, objet=`chaine_causale:C7` |\n| `thermotolerance-microbiome-sol` (table fiches) | `revue_critique` | mode=`validation`, objet=`transversal:thermotolerance` |\n| `prompt_validation_notes_2026-04-08.txt` (orphelin) | Affirmations issues de notes Jenni | mode=`validation`, objet=`affirmation` (multi) |\n| `renforce_sections_manquantes_*.txt` (orphelin) | Audit | mode=`comblement`, objet=`lacune` (multi) |\n| `renforce_modules_faibles_*.txt` (orphelin) | Audit | mode=`renforcement` |\n| `renforce_pratiques_fermentations_economie_*.txt` | Audit P | mode=`renforcement`, objet=`transversal:fermentations_economie` |\n| `renforce_sol_carbone_redox_methodes_*.txt` | Audit S | mode=`renforcement` |\n| `renforce_vegetal_holobionte_nutrition_*.txt` | Audit V | mode=`renforcement` |\n\n### ⚠ Etat actuel (avril 2026)\n\n`validation_sections` et `validation_contenus` existent en DB avec des donnees historiques (86 et 17 rows respectivement) mais **aucun script actif ne les alimente**. La logique des validations est en pause (cf. BQ `validations_workflow_et_structure_table_dediee`). Les BQ qui decrivent leur workflow sont conservees comme reference, mais la logique des validations est en pause (cf. BQ `validations_workflow_et_structure_table_dediee`) : `import_validation.py` a été supprimé, `export_validation.py` existe mais n'alimente plus les tables.\n\n## Contexte\n\nworkflow validations\n", "type": "reference", "crit": false}, {"id": 160, "titre": "Intégration d'une réponse de sourçage — refs Jenni → corpus (pendant de l'intégration fiche)", "contenu": "## Intégration d'une réponse de sourçage — refs Jenni → corpus\n\n> **Quand consulter cette BQ** — Jenni renvoie un docx **en réponse à une\n> question / validation de sourçage** (BQ `validations_workflow_et_structure_table_dediee`, #105) : prose sourcée +\n> bibliographie. Mots-clés de déclenchement : *retour sourçage, réponse Jenni\n> question, intégrer QS, integrate_validation_refs, refs validation*.\n\n### Le maillon qui manquait\n\nLe corpus avait deux pipelines de retour Jenni :\n- **Fiche** → `integrate_fiche.py` + `integrate_fiche_refs.py` (contenu + refs).\n- **Source biblio unique** (rapport JMJ) → `integrate_source.py` (une source à la fois).\n\nMais **rien** pour la réponse à une **question de sourçage** : un docx Jenni de\nprose + biblio dont le but n'est pas de créer une fiche, mais de **sourcer des\naffirmations déjà présentes** dans un doc de strate. C'est le pendant de\nl'intégration fiche, **cible = une `validation`** (et ses `prompts_cibles`), pas\nune fiche. Outil : `tools/integration/integrate_validation_refs.py`.\n\n### Invariant du format Jenni (confirmé JMJ 2026-06-02)\n\nJenni exporte en mode **« Citations avec hyperlien »** (recommandé Google Docs) :\n- **Bibliographie TOUJOURS en fin de document** (style `JenniRefBody`), APA avec DOI.\n- Citations inline **`(Auteur, Année)` cliquables** (hyperliens `dummy-citation.com`\n  à nettoyer — artefact interne Jenni, **non résoluble** en DOI).\n\n`tools/lib/parse_jenni_docx.py` (`parse_docx`) gère déjà les deux : il lit le bloc\nbiblio final et nettoie les URLs dummy. **Ne jamais** tenter de décoder un blob\ndummy-citation : la vraie ref est dans la biblio de fin, appariée par\n`(surname, année)`.\n\n### Partie MÉCANIQUE (scriptée) — `integrate_validation_refs.py`\n\n```bash\n# 1. dry-run : extraction + dédup + aperçu rattachement\npython3 tools/integration/integrate_validation_refs.py --db sol_vivant.db \\\n    --validation <slug> --docx docx/<reponse>.docx\n# 2. après revue → apply\npython3 tools/integration/integrate_validation_refs.py --db sol_vivant.db \\\n    --validation <slug> --docx docx/<reponse>.docx --apply\n```\n\nLe script enchaîne :\n1. **parse** — sections + refs (`parse_docx`).\n2. **dedup** — DOI / titre / `surname+année` contre `sources` (réutilise les\n   helpers de `integrate_fiche_refs`).\n3. **map** — chaque ref → section(s) du doc via sa citation inline. Mapping\n   **H2 du docx → chapitre → `prompts_cibles`** : les N sections de niveau 2 du\n   docx sont appariées, dans l'ordre, aux N chapitres distincts des\n   `prompts_cibles`. Une ref citée sous un H2 se rattache à toutes les sections\n   `prompts` de ce chapitre.\n4. **apply** — INSERT `sources` (nouvelles) + `source_usages`\n   (`entity_type='prompt'`, sinon `'doc'` en fallback biblio-seule) + **capte la\n   PROSE-réponse** dans `validation_contenus.contenu_brut` + clôture la\n   validation (`statut=integre`, `date_retour`, `date_integration`, `verdict`).\n4bis. **capture de prose (volet H, depuis 2026-06-02)** — le docx de sourçage\n   décrit des **mécanismes** (pas que des refs) ; le pipeline les archive désormais\n   en DB (`validation_contenus`, requêtable) au lieu de les laisser uniquement dans\n   le docx archivé. Demande JMJ : « des mécanismes y sont décrits, dommage de perdre\n   cette matière ». Cette prose alimente le **volet H** des méta-analyses de fiches\n   (croisement des réponses de sourçage — BQ `wf_fiche_integration`).\n5. **archivage** (factorisé `lib/doc_archive.py::archive_integrated_docx`) — déplace\n   le docx réponse → `docx/archives/` ET son **pendant** question →\n   `recherches/questions/archives/` (pendant deviné par convention de nommage depuis\n   le slug : `sourcage-faune-du-sol` → `question_faune_du_sol_*.docx`, ou forcé via\n   `--question-docx`). Idempotent, non bloquant, après le commit. Même principe que\n   les lanes fiche et thésaurus — voir réflexe `wf_fiche_integration`.\n\nGranularité de rattachement assumée : **chapitre** (pas H3). Le mapping H3 docx →\nH2 corpus serait fuzzy et fragile ; le niveau chapitre est robuste et honnête\n(« cette source étaye le chapitre vers-de-terre de V1 »).\n\n### Partie CONSCIENTE (à la main, l'agent) — l'analyse intégrative\n\nLe script ne fait QUE la plomberie. Conformément à la doctrine « Intégration\nconsciente du retour Jenni », l'agent assure ensuite :\n\n- **Harmonisation des valeurs** — *uniquement si le doc cible a déjà du contenu\n  rédigé* (`prompt_contenus`/`doc_contenus`). Comparer les « valeurs\n  consensuelles » de Jenni aux affirmations du corpus ; signaler à JMJ toute\n  divergence chiffrée (ne **pas** réécrire le contenu scientifique — éditorial =\n  JMJ/Jenni).\n- **Cas pré-sourçage** — si le doc est encore au stade **graines**\n  (`contexte_sci`, pas de contenu rédigé), il n'y a **rien à harmoniser** : la\n  question de sourçage **pré-équipe** les sections en sources, prêtes pour quand\n  Jenni rédigera le doc. C'est un usage légitime (cf. faune V1, ci-dessous).\n- **Propagation transversale** — au jugement : les sources peuvent aussi étayer\n  des `concept_cards` ou des chaînes du même sujet. Lien optionnel, pas\n  systématique.\n\n### Masque canonique — faune du sol (2026-06-02)\n\n- Validation **#15** `sourcage-faune-du-sol` (`objet_ref=V1`,\n  `prompts_cibles=[162…170]`), docx réponse `docx/QS-faune_du_sol.docx`.\n- 47 refs (46 DOI) → **33 nouvelles** sources, 1 enrichie, 13 déjà en DB ;\n  **111 `source_usages`** rattachés aux 9 sections V1 (11-15 sources/section).\n- V1 était au stade graines (0 contenu) → **pré-sourçage**, aucune harmonisation.\n- Validation #15 close (`integre`). Dette audit #3 (« V1 faune : 0 source »)\n  résolue.\n\n### Différences avec les pipelines voisins\n\n| Pipeline | Cible | Crée du contenu ? | Refs |\n|---|---|---|---|\n| `integrate_fiche_refs.py` | fiche | oui (la fiche) | refs → `entity_type='fiche'` |\n| `integrate_source.py` | — | non | **une** source biblio (rapport JMJ) |\n| `integrate_validation_refs.py` | **validation** | non | refs → `prompt`/`doc` du strate ciblé |\n\n### Pourquoi cette entrée (2026-06-02)\n\nPour clore la dette #3 (faune), JMJ a envoyé une question de sourçage à Jenni puis\na poussé la réponse (`docx/QS-faune_du_sol.docx`). À l'intégration, le maillon\nmanquait : `integrate_source.py` n'avale qu'une source à la fois (format\n`Champ : valeur`), pas un docx de 47 refs ; `integrate_fiche_refs.py` est\ncloué à une fiche. D'où ce script + cette doctrine. Réflexe actif :\n`integration_reponse_sourcage`.\n", "type": "workflow", "crit": true}]}}, "web": {"web": {"nom": "Pages web (toutes)", "entries": [{"id": 84, "titre": "Architecture pages web", "contenu": "## Architecture des pages HTML\n\nChaque page web interactive suit le même schéma en 4 couches :\n\n1. **`web_pages`** — Métadonnées (slug, title, subtitle, description, og_image, script_path, status, icon, ordre)\n2. **`html_templates`** — Templates par page (head, page_css, page_js) identifiés par `page_slug`\n3. **Script Python** `gen_*.py` — Extrait les données de la DB, charge les templates, appelle `render_page()`\n4. **`web_template.py`** — Module partagé : charte CSS, header SV, OG tags, favicon, structure HTML, pré-compilation JSX\n\n### Pages actives (état avril 2026)\n\n**Pages publiques** (visibles dans la nav bar) :\n\n| Slug | Script | Status | Icône | Description |\n|------|--------|--------|-------|-------------|\n| `index` | `gen_web.py` | publie | 🗺️ | Cartographie interactive du corpus |\n| `mo_calculateur` | `gen_mo_calc.py` | publie | 🧪 | Calculateur C/N et matière organique |\n| `lifofer` | `gen_lifofer.py` | active | 🌿 | Calculateur LiFoFer |\n| `triangle_textures` | `gen_triangle_textures.py` | publie | 🔺 | Triangle GEPPA interactif |\n| `concept_cards` | `gen_concept_cards.py` | active | 📋 | Atomes conceptuels du corpus (grille) |\n| `cahier` | `gen_cahier.py` | publie | 📚 | Cahier de Science — livre pédagogique multi-onglets (chapitres existants + fiches intégrées regroupées par thème). Charge `config.cahier.chapitres`, `config.cahier.onglets` et le texte intégré (via `tools/lib/fiche_text.py::fiche_texte_integre`). |\n\n**Pages internes** (hors nav — outils de pilotage JMJ/l'agent) :\n\n| Slug | Script | Status | Icône | Description |\n|------|--------|--------|-------|-------------|\n| `dashboard` | `gen_dashboard.py` | interne | 📊 | Tableau de bord (vision rapide corpus pour l'agent) |\n| `ebauches` | `gen_ebauches_web.py` *(archivé)* | interne | 📝 | Lecture web des ébauches Jenni (mammoth) — script dans `tools/docs/archives/` |\n| `explorer` | `gen_explorer.py` | interne | 🔍 | Explorer DB — inspection tables et dashboard maintenance |\n| `technique` | `gen_technique.py` | interne | 📖 | Guide technique (architecture, sessions, git) |\n\nLe statut `interne` exclut la page de la barre de navigation inter-pages (filtre `status != 'interne'` dans `load_nav_pages()`). La page est toujours régénérée par `regen_all.py` et accessible par URL directe.\n\n### Cahier de Science — spécificités\n\n- **Structure des onglets** : `config.cahier.onglets` (JSON). Par défaut 2 onglets : `Pédagogie` (type=`all_chapitres`, rend tous les chapitres de `config.cahier.chapitres`) et `Fiches` (type=`all_fiches`, rend toutes les fiches intégrées en accordéon, groupées par type). Un onglet peut aussi référencer un `chapitre_id` ou une liste explicite `fiche_ids` si besoin.\n- **Rendu des fiches** : pour chaque `fiche_id`, `gen_cahier.py` charge le texte intégré via `tools/lib/fiche_text.py::fiche_texte_integre` (routé depuis `fiche_retour_sections`) et `v_fiche_refs.refs` (liste JSON régénérée à la volée depuis `source_usages` + `sources`), et les passe à `SvRichText` + `SvSourceList`. Les refs sont normalisées depuis les clés FR (`auteurs`, `annee`) vers les clés attendues par `SvSourceList` (`authors`, `year`).\n- **Format des fiches** : le texte intégré (`fiche_retour_sections.contenu`) suit la charte Jenni (Introduction + sections `## 1. Titre` + sous-sections `#### Titre`). `SvRichText` rend directement ces headings Markdown.\n- **Deep-link** : `cahier.html#tab-<id_onglet>` ouvre directement l'onglet choisi.\n- **Navigation** : `SvTabs` sticky en haut (charte `.sv-tabs` top:0 z-index:10). Pas de sidebar.\n\n### Workflow de création d'une nouvelle page\n\n1. Créer l'entrée `web_pages` (slug, title, subtitle, status, icon, ordre)\n2. Créer les 3 `html_templates` : head (vendor local React+Babel), page_css, page_js (React JSX)\n3. Créer le script `gen_*.py` dans `tools/docs/` (auto-détecté par `tools/lib/scripts_inventory.py`)\n4. Ajouter le script dans la liste `GENERATORS` de `tools/regen_all.py`\n5. `git add tools/docs/gen_<page>.py` puis commit\n6. Tester : `python3 tools/docs/gen_<page>.py --db sol_vivant.db`\n7. Les données sont toujours dans `config` ou dans les tables de référence — **jamais hardcodées dans le template JS**\n", "type": "reference", "crit": false}, {"id": 85, "titre": "Charte graphique Sol Vivant", "contenu": "## Charte graphique Sol Vivant\n\nStockée en DB `html_templates(slug='sv-charter-css', page_slug=NULL, type='page_css')` — chargée lazy par `tools/lib/web_template.py::get_charter_css(conn)` au 1er `load_templates()` (migration 2026-04). Editer la charte = UPDATE DB, pas besoin de toucher au code Python. Toutes les pages DOIVENT utiliser ces variables et classes.\n\n### Variables CSS (26)\n\n```\n--bg: #f4f6f8          --card-bg: #ffffff\n--text: #1e293b         --text-secondary: #64748b\n--accent: #2563EB       --accent-dark: #1d4ed8    --accent-light: #DBEAFE\n--border: #e2e8f0       --border-hover: #cbd5e1\n--radius: 10px          --shadow / --shadow-hover\n--success: #059669      --success-light: #D1FAE5\n--warning: #D97706      --warning-light: #FEF3C7\n--danger: #DC2626       --danger-light: #FEE2E2\n--info: #2563EB         --info-light: #DBEAFE\n--header-from: #0f172a  --header-to: #1e3a5f\n```\n\n### Classes communes\n\n| Classe | Usage |\n|--------|-------|\n| `.sv-header` | Bandeau bleu gradient (auto via `render_page`) |\n| `.sv-container` | Wrapper centré max-width 1400px |\n| `.sv-card` | Carte blanche avec ombre et border |\n| `.sv-tag` / `.sv-tag-*` | Badges colorés (doc, term, info, risk, test) |\n| `.sv-callout` / `.sv-callout-*` | Encarts warning/success/danger |\n| `.sv-btn` | Bouton accent |\n| `.sv-input` | Champ de saisie |\n| `.sv-nav` | Fil d'Ariane |\n| `.sv-footer` | Pied de page |\n\n### Inline emphasis (refonte avril 2026)\n\n| Classe | Usage |\n|--------|-------|\n| `.sv-mark` | Surlignage inline léger (fond `--accent-light`, texte `--accent-dark`). Pour les termes-clés, concepts pivot, ou fragments à mettre en valeur dans un paragraphe. |\n| `.sv-emphasis` | Gras inline (équivalent sémantique de `<strong>`), couleur `--text`. |\n\n### Bloc de section unifié (refonte avril 2026)\n\n| Classe | Usage |\n|--------|-------|\n| `.sv-section-block` | Conteneur d'une section de page (marge verticale unifiée) |\n| `.sv-section-title` | Titre de section. Modificateurs : `.sv-section-title-h2` et `.sv-section-title-h3` |\n| `.sv-section-icon` | Préfixe emoji optionnel dans le titre |\n\nUtiliser via le composant React `SvSection` plutôt qu'en JSX brut (cf. BQ `html_templates_carte_des_composants_web`).\n\n### Bloc texte riche (refonte avril 2026)\n\n| Classe | Usage |\n|--------|-------|\n| `.sv-richtext` | Wrapper autour du rendu `SvRichText` : line-height unifié, spacing des `<p>` et `<ul>` internes |\n\n### Règle : pas de couleurs hardcodées\n\nDans le CSS spécifique à la page (html_templates type=page_css), toujours utiliser `var(--*)` plutôt que des hex. Exemple : `color: var(--success)` et non `color: #059669`.\n\nDans le JSX React (page_js), idem : utiliser `style={{color:'var(--success)'}}`. Les classes Tailwind ne sont plus autorisées depuis la refonte vers la charte sv-* unifiée (avril 2026). Toute classe de style (`bg-*`, `text-*`, `rounded-*`…) doit être soit une classe `sv-*` soit un style inline avec les variables CSS.\n\n### Legacy en cours de migration\n\n- `.sv-accordion*` (CSS dans CHARTER_CSS) est **legacy** — remplacé par `SvCollapse` + `.sv-collapse*`. Encore utilisé par `mo-calc-js` et `index-js` (migration progressive). Toute nouvelle page doit utiliser `SvCollapse` uniquement.\n- `vendor/tailwind.min.css` et `vendor/tailwind.js` sont obsolètes (plus référencés depuis la refonte sv-*). **Supprimés 2026-06-20** (cf. BQ `mode_hors_ligne_et_deploiement`).\n\n### Échelle typographique pilotée par --font-scale (avril 2026)\n\nL'échelle font-* dérive d'une variable `--font-scale` (defaut `1`) :\n```\n--font-scale: 1;\n--font-2xs: calc(0.68rem * var(--font-scale));\n--font-xs:  calc(0.75rem * var(--font-scale));\n--font-sm:  calc(0.82rem * var(--font-scale));\n--font-base:calc(0.9rem  * var(--font-scale));\n--font-md:  calc(1rem    * var(--font-scale));\n--font-lg:  calc(1.15rem * var(--font-scale));\n--font-xl:  calc(1.5rem  * var(--font-scale));\n--font-2xl: calc(1.8rem  * var(--font-scale));\n--font-1-4: calc(1.4rem  * var(--font-scale));\n```\n\nLe bouton zoom typo `A−/A/A+` (toolbar flottante) modifie `--font-scale` en runtime → toutes les `--font-*` suivent. Persistance `localStorage('sv-font-scale')`.\n\n**Règle absolue** : ne jamais hardcoder de `font-size: <rem>` dans un page_css ou un style inline JSX. Toujours `var(--font-*)`. Sinon le zoom typo ne suit pas.\n\n### Échelle d'espacement\n\n```\n--space-2xs: 0.25rem\n--space-xs:  0.5rem\n--space-sm:  0.75rem\n--space-md:  1rem\n--space-lg:  1.25rem\n--space-xl:  1.5rem\n--space-2xl: 2rem\n```\n\nÀ utiliser pour padding/margin plutôt que des valeurs `rem` arbitraires.\n\n### Mode sombre — variables theme-aware\n\nVariables CSS dupliquées dans `[data-theme=\"dark\"]` ET `@media (prefers-color-scheme: dark)`. Toggle via le bouton `☾/☀` de la toolbar.\n\n**Règles** :\n- TOUJOURS définir `color` explicite quand on définit `background`. Sans ça, le texte hérité peut devenir illisible quand le fond change en dark.\n- Les `--*-light` (success/warning/danger/info) deviennent **très foncés** en dark (#064e3b, #451a03, etc.). Les classes `.sv-callout-*` doivent forcer leur `color` via `var(--color-*-text)`.\n- Pour les fonds papier crème (`.sv-cahier`, `.sv-science-note`), utiliser `var(--paper-bg)` / `--paper-bg-2` / `--paper-border` (theme-aware).\n- Pour fonds secondaires (accordéon, callout neutre), utiliser `var(--color-bg-subtle)` jamais `#f8fafc` en dur.\n\n### Schémas de flux Mermaid — theme-aware (juin 2026)\n\nDiagrammes Mermaid rendus côté client via `vendor/mermaid.min.js`. Cas d'usage : guide technique (`section.diagram` du JSON `config.technique.chapitres`).\n\nRègles :\n- **Theme-aware obligatoire** : le thème Mermaid suit `data-theme` (<html>) + fallback `prefers-color-scheme`, re-rendu au toggle ☾/☀. Jamais de thème fixe — un diagramme blanc en mode sombre est un bug.\n- **Rendu paresseux** : déclenché à l'ouverture de la section (SvCollapse), pas en startOnLoad.\n- **Pas d'étirement** : `flowchart.useMaxWidth: false` + `flowchart.padding` (espace nœuds↔bord SVG). Sans ça, le SVG s'étire au conteneur et les labels collent au cadre.\n- **Conteneur `.tech-diagram`** : `var(--color-bg-subtle)` + `var(--border)`, `overflow-x:auto`. Le SVG garde son fond propre (image intégrée).\n- **Un diagramme max par section**, seulement s'il éclaire le propos.\n- **Agnosticisme** : le guide public ne nomme pas les outils (l'agent/Jenni/GLM).\n- **Fallback** : markup invalide → source brute affichée, jamais de crash.\n\n### Navigation captive (sticky)\n\n`.sv-nav-pages` est `position: sticky; top: 0; z-index: 20` ; reste sur **1 ligne** (`overflow-x: auto` si débordement). Le bandeau `.sv-header` peut donc s'effacer au scroll.\n\n`.sv-tabs` est `sticky; top: 2.1rem` (2.5rem mobile) — collé juste sous la nav-pages. Profite de l'espace libéré pour mettre une intro accordéon (`SvTabIntro`) au-dessus du contenu.\n\n### Onglets — 2 niveaux distincts\n\n| Composant | Usage | Look |\n|-----------|-------|------|\n| `SvTabs` | Niveau 1 (Pratique / Comprendre, Données / Analyse, etc.) | Vrais onglets : coin arrondi haut + fond carte sur active |\n| `SvSubTabs` | Niveau 2 (sous-onglets dans un onglet niveau 1) | Pills compactes inline, fond vert sur active |\n\n**Règle** : ne jamais utiliser deux `SvTabs` imbriqués (confusion hiérarchique). Si un onglet niveau 1 a des sous-vues, utiliser `SvSubTabs`.\n\n`SvSubTabs` doit être accompagné d'un `useEffect(() => setStateLocal(null), [subtab])` pour réinitialiser les states locaux (accordéons ouverts, etc.) au changement de sous-onglet.\n\n### Bandeau `.sv-header` — hiérarchie refondue (avril 2026)\n\n**Principe** : le seul élément qui change d'une page à l'autre est le **titre de la page**. Le nom du corpus (identique partout) est relégué en lien discret au-dessus.\n\n```html\n<header class=\"sv-header\">\n  <a class=\"sv-corpus-link\" href=\"index.html\">Le Sol Vivant cet Holobionte<\/a>  <!-- petit, opacity 0.6 -->\n  <h1>Calculateur Matière Organique<\/h1>                                       <!-- titre de la page -->\n  <div class=\"sv-subtitle\">C/N, humification, mélanges interactifs<\/div>       <!-- description -->\n  <div class=\"sv-meta\">Jean-Michel Juzan — Généré le ... — MIT<\/div>   <!-- meta -->\n<\/header>\n```\n\n**Règles strictes** :\n- Chaque ligne du bandeau est contrainte sur **une ligne stricte** (`white-space: nowrap; overflow: hidden; text-overflow: ellipsis`). Garantit une hauteur de bandeau identique sur toutes les pages.\n- Police via variables charte uniquement :\n  - `.sv-corpus-link` : `var(--font-xs)` + opacity 0.6\n  - `.sv-header h1` : `var(--font-xl)` (1.5rem × --font-scale)\n  - `.sv-subtitle` : `var(--font-sm)` + opacity 0.7\n  - `.sv-meta` : `var(--font-xs)` + opacity 0.45\n- Responsive `
