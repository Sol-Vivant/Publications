eur\n**concept_cards** : id, title, description, category, docs_codes (JSON), status\n**refs** (migration 2026-04) : id, ref_kind, code, label, description, source, source_id, data JSON, ordre, is_active, legacy_id. Helper `tools/lib/refs.py::load_refs(con, kind)` deplie data + alias compat\n    **refs (kind=matiere)** : 110 rows. Colonnes specifiques (cn_min/max, k1_min/max, NPK, densite, cout, synonymes, source) dans le champ `data` JSON, deplies a la racine par `load_refs(con, 'matiere')`\n**ref_cn_incorporation** : id, cn_seuil_min, cn_seuil_max, niveau, titre, contenu, conditions (JSON), cas_etude (JSON), redox (JSON), timeline\n**html_templates** : id, slug, page_slug, type (page_css/page_js/head), contenu\n**BQ (filesystem Session D)** : `tools/bq/<slug>.md` frontmatter YAML + body MD. Voir BQ `bq_architecture_domaines`. Catalogue 14 domaines : `tools/bq/_domaines.yaml`\n**chains_causales** : id, titre, docs_traverses, valeur_ajoutee (argument lecteur, propre), notes (provenance éditoriale : [xref]/[Distinction…], non affichée), created_at\n**chain_etapes** : id, chain_id, position, term_id, term_fr_text, strate_etape, role_dans_chaine (mécanisme lecteur, propre), notes (renvois [voir fiche #N…], non affichés)\n\n### Conventions de liaison entre tables (Conseil liens, 2026-06-10)\n\nLe schéma est **~95 % normalisé** : **toute relation N-N passe par une table de jointure** (FK déclarées) — `card_chain_links`, `concept_card_links`, `concept_card_tests`, `cascade_level_links`, `chain_etapes`, `fiche_articulations`, `pedago_links`, `source_usages`, `term_relations`, `diagnostic_rule_terms`. **C'est le pattern par défaut pour tout nouveau lien.**\n\n**Exceptions assumées — ne PAS « normaliser » par zèle (décision Conseil + contradicteur) :**\n\n- **`doctrine_chantiers` (registre du fil)** lie ses axes par des **listes d'ids en JSON** : `cards_liees`, `fiches_contributrices`, `chains_liees`, `terms_lies`. Choix délibéré : petit registre éditorial (~24 lignes), listes **comptées** (`len(json.loads(...))` dans `audit_center`/`audit_opus`), **jamais jointes** → une table de jointure n'apporterait aucune requête réelle. Garde-fou : `check_integrity.check_doctrine_chantiers_json_orphans` (les ids doivent exister ; `terms_lies` = ids `terms`, **pas des noms** — chaos nettoyé le 2026-06-10).\n- **`concept_cards.source`** = **provenance-texte** (`fiche_30_2026-05-02`, `fiches #25 #11 #4`, `corpus_v1`, `session_…`), **pas un lien relationnel**. La provenance card→fiche y est dérivable (parsing → 41 fiches, 78 cards) mais **aucun code ne la requête** → **pas de table `card_fiche_links`** tant qu'un consommateur réel n'émerge pas (YAGNI ; sinon on créerait une 2ᵉ source de vérité du même lien).\n- **`chain_etapes.term_fr_text`** = **cache dérivé** du nom, à côté du vrai FK `term_id`. Régénérable ; une désync = cache périmé (`term_fr_text` ≠ `terms.fr`), pas une erreur de lien.\n- **`terms.doc_code`** peut être **multi-codes** (`H3/S2`, `S0/V1/P2`) = terme partagé par plusieurs docs. Surcharge sémantique assumée (non scindée : 204 lignes, coût/risque > bénéfice à ce jour).\n\n**FK enforcement** : `PRAGMA foreign_keys = 0` (non persisté par SQLite ; choix workflow mono-user — l'enforcement runtime imposerait l'ordre insert/delete à tous les scripts). Filet équivalent : `check_integrity.check_foreign_keys_pragma` (`PRAGMA foreign_key_check` périodique) + les checks d'orphelins ciblés. `foreign_key_check` = **0 violation** (2026-06-10).\n\n**Règle** : un schéma clair = **documenté et justifié**, pas migré pour la pureté. Chaque exception ci-dessus a son garde-fou dans `check_integrity`.\n", "type": "reference", "crit": true}, {"id": 1, "titre": "Carte du projet — vue d'ensemble (à lire en premier)", "contenu": "## Carte du projet — Le Sol Vivant cet Holobionte\n\n**Lire en premier.** Cette entrée donne la vue d'ensemble. Toutes les BQ sont ensuite des références détaillées.\n\n### Le projet en 4 lignes\n\nCorpus scientifique en **18 documents** sur l'agriculture régénératrice et la biologie des sols, écrit par Jean-Michel Juzan. Claude Code édite la DB et les scripts ; Jenni AI rédige. Biblio interne dans la table `jenni_sources` (1639 refs), alimentée par intégration consciente des rapports de sources fournis par JMJ. DB unique `sol_vivant.db` = source de vérité. Branche `main` = production.\n\n### Les 3 acteurs\n\n| Acteur | Rôle | Interface |\n|---|---|---|\n| **Claude Code** (moi) | Édite la DB, les scripts, audit corpus, intégration retours Jenni, veille | Terminal + sol_vivant.db |\n| **Jenni AI** | Rédige à partir de prompts, produit des .docx | Web, piloté par .txt prompts |\n| **JMJ** (auteur) | Donne des rapports de sources à intégrer, valide les actions Claude | Session + .md |\n\n### Pipeline global\n\n```\n    ┌─────────────────────────────────────────────────────────────┐\n    │          CORPUS = 18 documents rédigés par Jenni            │\n    └──────────────────────────▲──────────────────────────────────┘\n                               │ passe finale Jenni\n                               │\n          ┌────────────────────┴────────────────────┐\n          │   PROMPTS clôturés (prompts.statut=cloture)  │\n          │     contexte_sci + instructions + enrichissement       │\n          └────────────────────▲────────────────────┘\n                               │\n       ┌───────────────────────┼───────────────────────┐\n       │                       │                       │\n  ┌────┴─────┐           ┌─────┴─────┐           ┌─────┴──────┐\n  │ THÉSAURUS │           │  FICHES   │           │VALIDATIONS│\n  │ 962 termes│           │ 27 intégr.│           │ (en pause)│\n  └────▲─────┘           └─────▲─────┘           └─────▲──────┘\n       │                       │                       │\n       │ enrich_thesaurus       │ fiches zoom           │ combler dette\n       │                       │ (transversale/        │ (audit révèle)\n       │                       │  technique/zoom)      │\n       │                       │                       │\n  ┌────┴───────────────────────┴───────────────────────┴────┐\n  │              AUDIT du corpus / notes volantes           │\n  │    analyse_corpus · audit_opus · check_integrity        │\n  └─────────────────────────────────────────────────────────┘\n```\n\n**Note** : les `concept_cards` (91 actives) agissent en **filtre de rigueur** entre captation et intégration : toute nouvelle affirmation doit d'abord passer par une carte (cf. #106).\n\n### Les 5 scripts à connaître (chaque session)\n\n| Commande | Rôle |\n|---|---|\n| `python3 tools/admin/session_start.py --db sol_vivant.db` | Démarre la session (sync git, backup DB, dashboard, règles actives) |\n| `python3 tools/admin/bq_query.py --list` / `--domaine <slug>` / `--search <kw>` | Consulter cette BQ (filesystem `tools/bq/`) |\n| `python3 tools/admin/check_integrity.py --db sol_vivant.db` | Valider l'état DB (FK, orphelins, doublons) |\n| `python3 tools/regen_all.py --db sol_vivant.db` | Régénérer tous les outputs (HTML, README, workflows) depuis la DB |\n| `python3 tools/veille/weekly_scan.py --db sol_vivant.db` | Veille PubMed hebdomadaire (9 thèmes, 28 requêtes) |\n\n### Les 4 règles absolues\n\n1. **`main` est la production** — travailler et pousser directement sur main (cf. #70)\n2. **La DB est source de vérité** — fichiers générés = vues (cf. #73). Ne jamais modifier un fichier de sortie ; toujours modifier la source puis `regen_all.py`\n3. **Le .docx Jenni ne rentre jamais tel quel en DB** — tout passe par analyse Claude + scripts d'import contrôlés\n4. **Pas de codes docs / méta-vocab dans les prompts** — S2, V1, \"strate\", \"corpus\", \"thésaurus\" interdits dans `prompts.contexte_sci/.instructions/.enrichissement` (cf. #120)\n\n### Infrastructure transverse\n\n**Table `config` (84 clés)** — paramètres centralisés par catégorie/clé. Toute valeur partagée entre scripts va là, pas en dur.\n- `config.corpus.*` : nom, auteur, version du projet\n- `config.veille.hot_topics` : 9 thèmes PubMed de la veille\n- `config.web.icon_library` : bibliothèque d'icônes unifiée\n- `config.cahier.onglets`, `config.cahier.chapitres`, `config.cahier.tab_descriptions` : structure du Cahier de Science\n- `config.jenni.*` : templates de prompts Jenni\n- `config.claude_rules.*` : règles Claude affichées au démarrage\n\nLecture Python : `from config import get, get_json, get_int, get_float` (dans `tools/lib/config.py`).\n\n**Table `audit_log` (1200+ entrées)** — trace horodatée de toutes les opérations significatives en DB. Colonnes : `ts, operation, table_name, record_ref, detail`. Opérations les plus courantes : `GENERATE` (régénération page), `UPDATE` (modification), `INSERT` (ajout), `IMPORT` (import docx), `MERGE`, `SYNC`.\n\nUtile pour :\n- Reconstituer l'historique d'une fiche ou d'un terme\n- Debugger « qui a modifié quoi quand »\n- Produire les rapports de session\n\n**Écriture systématique** : tout script qui modifie la DB doit écrire dans audit_log :\n```python\ncon.execute(\"INSERT INTO audit_log (operation, table_name, record_ref, detail) VALUES (?, ?, ?, ?)\",\n            ('UPDATE', 'terms', f'term #{tid}', 'Correction definition corrompue'))\n```\n\n**Table `jenni_sources` (1639 refs)** — biblio interne du projet. Chaque source a `doi, auteurs, annee, titre_complet, journal, resume_court, pertinence, tags, url`. Alimentée par **intégration consciente** (un rapport de source à la fois — cf. workflow `wf_source_integration`). Jamais de batch-insert aveugle.\n\n**Table `source_usages` (2322 liens)** — relie une source à une entité (fiche / document / terme / card / prompt) avec contexte et citation brute. Permet de reconstituer « où est cette source citée ? ».\n\n### Modules BQ — où chercher quoi\n\n| Module | Contenu | Quand aller voir |\n|---|---|---|\n| **projet** | Doctrine corpus, modèle conceptuel, concept cards | Avant de toucher la rédaction ou la structure |\n| **claude** | Règles Claude (git, DB, pseudoscience, faux positifs) | Avant toute action |\n| **workflow** | Un workflow métier par BQ (fiche, thésaurus, veille, web…) | Pour retrouver le bon enchaînement |\n| **web** | Charte graphique, composants React, pages HTML | Génération/modif de pages |\n| **jenni** | Chartes rédaction, format prompts, enrichissement | Avant de produire un prompt Jenni |\n| **sqlite** | Schéma tables, vues, requêtes utiles | Inspection DB |\n| **maintenance** | Sessions, scripts, régénération, intégrité | Opérations de maintenance |\n", "type": "info", "crit": false}, {"id": 73, "titre": "DB = source de vérité — données en DB, fichiers = vues", "contenu": "**Règle** : `sol_vivant.db` est la source de vérité **pour les données** (corpus, audit_log, config, refs). Les **scripts** Python sont versionnés par git dans `tools/` (Session B). Les fichiers HTML/MD/TXT générés depuis la DB sont des **vues**.\n\n**Ne jamais modifier directement :**\n- `Publications/prompts/prompts_jenni_*.txt` → générés par `export_jenni_doc.py` depuis les tables `prompts`, `terms`, `jenni_doc_specs`\n- `Publications/web/*.html` → générés par `gen_mo_calc.py`, `gen_web.py`, `gen_triangle_textures.py` depuis les tables `ref_*`, `html_templates`\n- `Publications/cartographie/*.html` → généré par `gen_web.py`\n- `Publications/workflows/*.md` → générés par `gen_workflows.py`\n- `tools/**/README.md` → générés par `gen_readme.py`\n\n**Toujours corriger la source :**\n- Contenu des prompts → modifier dans table `prompts` ou dans le script `export_jenni_doc.py`\n- CSS/JS des calculateurs → modifier dans table `html_templates`\n- Données de référence → modifier dans les tables `ref_*`\n- Puis regénérer le fichier avec le script approprié\n\n**Workflow correct :**\n1. Modifier la DB (tables, templates, config)\n2. Regénérer les fichiers (`python3 tools/docs/gen_*.py --db sol_vivant.db`)\n3. (Plus de sync — les scripts sont versionnes par git directement)\n4. `git add` + `git commit` + `git push`\n\n### (fusionné depuis #79 : Données = DB, code = logique uniquement)\n\n**Règle** : toute donnée paramétrable va dans la DB, jamais en dur dans le code Python ou JS.\n\n**Où stocker quoi :**\n| Type de donnée | Table DB |\n|---|---|\n| Paramètres API (modèle, tokens, prix) | `config` |\n| Données de référence (C/N, matières, textures) | `ref_*` |\n| CSS/JS des pages web | `html_templates` |\n| Contenu des prompts Jenni | `prompts` |\n| Termes canoniques | `terms` |\n| Mélanges prédéfinis | `refs` (kind=matiere, categorie=Mélange) |\n\n**Exceptions tolérées** : constantes physiques universelles, noms de colonnes SQL, noms de fichiers de sortie.\n\n**Code = filesystem, donnees = DB :**\n    Les **scripts Python** sont versionnes par git dans `tools/` (table `scripts` droppee Session B). Lire un script = `Read tools/<folder>/<nom>.py`. Inventaire programmatique = `tools/lib/scripts_inventory.py::list_scripts()`. Les **templates HTML** restent en DB (`html_templates.contenu`). Les **donnees** restent en DB (terms, refs, fiches, etc.).\n\n| Pour lire... | Faire | Ne pas faire |\n|---|---|---|\n    | Un script | `Read tools/<folder>/<nom>.py` ou `from scripts_inventory import list_scripts` |\n| Un template React | `SELECT contenu FROM html_templates WHERE id = N` | `Read` sur le HTML généré |\n| Une config | `SELECT valeur FROM config WHERE cle = 'xxx'` | Lire CLAUDE.md |\n| Des données | `SELECT ... FROM refs / terms / ...` (helper `tools/lib/refs.py`) | Lire un export JSON/CSV |\n\n**Historique** : polygones GEPPA hardcodés dans gen_triangle_textures.py, nombre de cartes \"35\" en dur (sessions 31/03, 01/04). Lecture fichier gen_triangle_textures.py dépassant 10K tokens (session 04/04).\n", "type": "contrainte", "crit": true}, {"id": 59, "titre": "Requêtes utiles — pilotage, thésaurus, diagnostic", "contenu": "## Requêtes utiles — pilotage, thésaurus, diagnostic\n\nLes requêtes de référence sont stockées dans **`tools/sql/<categorie>/<nom>.sql`** (Session E 2026-05-06, table `requetes_utiles` droppée). Voir BQ `requetes_utiles_catalogue_sql` pour le format complet.\n\n```bash\n# Trouver une requête par nom\ncat tools/sql/sante/etat_production.sql\n\n# Requêtes de démarrage de session\ngrep -l \"usage_type: session\" tools/sql/**/*.sql\n\n# Requêtes de diagnostic\ngrep -l \"usage_type: diagnostic\" tools/sql/**/*.sql\n\n# Requêtes d'un domaine\nls tools/sql/thesaurus/\n```\n\n**Exécution shell** :\n```bash\nsqlite3 sol_vivant.db < tools/sql/thesaurus/doublons_termes.sql\n```\n\n**Exécution Python** :\n```python\nfrom pathlib import Path\nimport sqlite3\nsql = Path('tools/sql/thesaurus/termes_sans_definition.sql').read_text()\nconn = sqlite3.connect('sol_vivant.db')\nfor r in conn.execute(sql).fetchall():\n    print(r)\n```\n\nCatégories : sante, documents, thesaurus, chaines, bq, crossrefs, maintenance, biblio, cascade, pilotage, config.\nTypes : session (15), pilotage (14), diagnostic (9), export (2), maintenance (1).\n\n### Requêtes thesaurus\n\nLes requêtes thésaurus sont dans `tools/sql/thesaurus/` :\n```bash\nls tools/sql/thesaurus/\n# doublons_termes.sql, densite_termes_par_doc.sql, termes_partages.sql,\n# termes_sans_definition.sql, termes_document.sql, thesaurus_complet_compact.sql\n```\n\n### Requêtes diagnostic rapide — copier-coller\n\nRequêtes courantes à copier-coller au démarrage ou pendant le travail :\n\n```sql\n-- État du corpus\nSELECT strate, COUNT(*) FROM documents GROUP BY strate;\n\n-- Termes par doc\nSELECT doc_code, COUNT(*) FROM terms GROUP BY doc_code ORDER BY doc_code;\n\n-- Prompts incomplets (pas d'enrichissement)\nSELECT doc_code, titre_h2 FROM prompts WHERE enrichissement IS NULL OR enrichissement = '';\n\n-- Dernières opérations\nSELECT ts, operation, table_name, substr(detail,1,80) FROM audit_log ORDER BY ts DESC LIMIT 10;\n\n-- Config API\nSELECT cle, valeur FROM config WHERE categorie = 'api';\n\n-- BQ critiques par domaine (filesystem Session D)\n-- python3 tools/admin/bq_query.py --critical-only\n\n-- Inventaire scripts (filesystem Session B)\n-- python3 -c \"from tools.lib.scripts_inventory import list_scripts; ...\"\n```\n", "type": "commande", "crit": false}, {"id": 139, "titre": "Refactor term_relations - source unique BT/NT/RT (2026-04-20)", "contenu": "## Refactoring term_relations — source de vérité unique pour BT/NT/RT\n\n**Depuis le 2026-04-20** : les colonnes `terms.bt`, `terms.nt`, `terms.rt` ont été **supprimées**. La table `term_relations` est la SEULE source de vérité pour les relations entre termes.\n\n### Schéma actuel\n\n```sql\nCREATE TABLE term_relations (\n    id              INTEGER PRIMARY KEY AUTOINCREMENT,\n    from_term_id    INTEGER NOT NULL REFERENCES terms(id) ON DELETE CASCADE,\n    to_term_text    TEXT NOT NULL,          -- libellé brut (Jenni/docx)\n    to_term_id      INTEGER REFERENCES terms(id),  -- FK si résolu, NULL si orphelin\n    rel_type        TEXT NOT NULL CHECK(rel_type IN ('BT','NT','RT'))\n);\nCREATE INDEX idx_term_relations_to ON term_relations(to_term_id);\n```\n\n### Vues\n\n**`v_term_relations`** — joint source et cible, expose `display_text` (COALESCE to_fr, to_term_text) et `is_orphan` :\n```sql\nSELECT ... FROM v_term_relations WHERE from_id = ? AND rel_type = 'RT'\n```\n\n**`v_terms_full`** — expose `terms` avec `bt`/`nt`/`rt` agrégés automatiquement depuis `v_term_relations` (GROUP_CONCAT avec ` · ` comme séparateur). Remplace les anciennes colonnes `terms.bt`/`terms.rt`. Les scripts lecteurs doivent faire `SELECT ... FROM v_terms_full` au lieu de `FROM terms` quand ils ont besoin de bt/rt.\n\n### Module partagé\n\n**`tools/lib/term_rels.py`** — helpers pour les scripts écrivains :\n- `norm(s)` : normalisation matching (apostrophes, accents, casse, sing/plur)\n- `build_fr_index(con)` : construit le dict `{norm(fr|en|syn) → term_id}`\n- `write_relations(con, from_id, rel_type, raw_text, index=None)` : delete existantes + split + insert avec `to_term_id` résolu automatiquement\n- `get_relations(con, from_id, rel_type)` / `get_relations_text(...)` : lecture formatée\n\n### Scripts patchés (2026-04-20)\n\n**Lecteurs** (maintenant `SELECT ... FROM v_terms_full`) :\n- `tools/batch/analyse_corpus.py`\n- `tools/jenni/gen_prompt_completion.py`\n- `tools/jenni/gen_prompt_thesaurus.py`\n- `tools/docs/gen_web.py`\n\n**Écrivains** (retire `bt/rt` des INSERT/UPDATE sur terms, écrit via `term_rels.write_relations`) :\n- `tools/jenni/import_termes_jenni.py`\n- `tools/jenni/enrich_thesaurus.py`\n- `tools/jenni/import_enrichissement.py`\n- `tools/jenni/resolve_import_conflicts.py`\n- `tools/admin/dedupe_thesaurus.py` (met aussi à jour `to_term_id` quand il migre `to_term_text`)\n\n### Migration effectuée\n\n**Phase 0 — Synchronisation** : toutes les relations des anciennes colonnes `terms.bt`/`terms.rt` qui n'étaient pas dans `term_relations` y ont été ajoutées :\n- BT : 437 → 852 (+415)\n- RT : 3488 → 5927 (+2439)\n- NT : 14 (inchangé)\n\n**Phase 1 — Migration FK** : `to_term_id` résolu via `norm()` pour 4296 relations ; 2497 restent orphelines (texte cible hors thésaurus, à arbitrer via agents Task ou décisions éditoriales).\n\n**Phase 2 — Vues** : v_term_relations + v_terms_full créées.\n\n**Phase 3 — Scripts patchés** : 8 scripts mis à jour.\n\n**Phase 4 — Drop colonnes** : `terms.bt`, `terms.nt`, `terms.rt` supprimées (ALTER TABLE DROP COLUMN — SQLite ≥ 3.35).\n\n### Bénéfices\n\n- **Orphelins explicites** : `SELECT * FROM v_term_relations WHERE is_orphan = 1` liste directement les 2497 relations dont la cible n'est pas dans le thésaurus\n- **Plus de redondance** : une seule source de vérité, la vue reconstruit le texte à la volée\n- **FK suivie automatiquement** : si on renomme un terme, les relations vers lui n'ont plus à être réécrites (le `to_term_id` reste valide)\n- **Audit de cohérence simplifié** : une requête SQL simple (plus besoin de parser les champs texte)\n\n### Comportement orphelins\n\nQuand une relation pointe vers un texte qui ne matche aucun terme (`to_term_id IS NULL`) :\n- `v_term_relations.display_text` = `to_term_text` (le texte brut)\n- `is_orphan = 1`\n- `v_terms_full.rt` inclura ce texte brut dans la concaténation\n\nQuand l'orphelin deviendra résolu (un nouveau terme est créé ou un syn est ajouté qui matche), il suffit de ré-exécuter une passe de résolution :\n```python\nfrom lib.term_rels import build_fr_index\nidx = build_fr_index(con)\nfor r in con.execute(\"SELECT id, to_term_text FROM term_relations WHERE to_term_id IS NULL\"):\n    tid = idx.get(norm(r[1]))\n    if tid:\n        con.execute(\"UPDATE term_relations SET to_term_id=? WHERE id=?\", (tid, r[0]))\n```\n\nVoir commit de référence : `claude/refactor-term-relations`.\n\n### Alerte post-import `detect_cross_syn_fr()` (session 2026-04-21)\n\n**Problème** : le format strict de Jenni protège le `fr` canonique (règle absolue CLAUDE.md). Conséquence perverse : si on envoie à Jenni un terme mal formaté (ex : `'BRF (Bois Raméal Fragmenté)'`), elle garde le `fr` tel quel et met la version propre (`'Bois Raméal Fragmenté'`) en `syn_fr`. Si ce libellé existe déjà comme `fr` canonique d'un terme séparé → **deux entrées désignent le même concept sans détection automatique**.\n\n**Diagnostic** : scan rétroactif = 50 collisions syn↔fr dans le thésaurus courant.\n\n**Solution** (commit `084a043`) :\n\n- `tools/lib/term_rels.py::detect_cross_syn_fr(con, term_ids=None)` — scanne les `syn_fr`/`syn_en` de `term_ids` (ou tout le thésaurus si None) et retourne la liste des collisions avec un `fr` canonique existant. Format de retour :\n  ```python\n  [{'from_id': ..., 'from_fr': ..., 'syn_text': ..., 'syn_field': 'syn_fr'|'syn_en',\n    'collides_with_id': ..., 'collides_with_fr': ...}]\n  ```\n- Hook post-commit ajouté dans les 3 scripts qui écrivent dans `syn_fr`/`syn_en` :\n  - `tools/jenni/import_termes_jenni.py`\n  - `tools/jenni/enrich_thesaurus.py`\n  - `tools/jenni/import_enrichissement.py`\n- Le hook affiche les collisions (⚠) et écrit un WARN dans `audit_log` (operation='WARN', table='terms').\n\n**Règle stricte** : aucune modification automatique des termes. L'alerte **surface** pour arbitrage JMJ — jamais d'action silencieuse sur le thésaurus.\n\n**Arbitrage par paire détectée** :\n1. Même concept → fusion (via `dedupe_thesaurus.py` ou manuel)\n2. Concepts distincts mais syn mal attribué → retirer le syn fautif (ne pas modifier le fr canonique)\n3. Hiérarchie réelle → poser BT/NT explicite, retirer le syn\n\n**Historique** : cette doctrine avait été implémentée la veille (2026-04-20) et perdue dans un rollback. Documentée ici pour survivre aux prochains rollbacks.\n", "type": "technique", "crit": true}, {"id": 65, "titre": "requetes_utiles — catalogue SQL", "contenu": "41 requêtes SQL de référence organisées par catégorie dans **`tools/sql/<categorie>/<nom>.sql`** (Session E 2026-05-06, table `requetes_utiles` droppée).\n\n**11 catégories** : sante, documents, thesaurus, chaines, bq, crossrefs, maintenance, biblio, cascade, pilotage, config\n\n**Types d'usage** (en commentaire d'en-tête de chaque .sql) :\n- `session` (15) — démarrage, contexte rapide\n- `pilotage` (14) — suivi production, décisions\n- `diagnostic` (9) — recherche de problèmes\n- `export` (2) — contexte LLM/biblio\n- `maintenance` (1) — logging\n\n**Format des fichiers** :\n\n```sql\n-- nom: <nom>\n-- categorie: <categorie>\n-- usage_type: <usage_type>\n-- parametres: <parametres ou aucun>\n-- description: <description>\n\n<sql_text>\n```\n\n**Consultation** :\n\n```bash\n# Liste les requêtes par catégorie\nls tools/sql/\n\n# Liste les requêtes d'une catégorie\nls tools/sql/thesaurus/\n\n# Voir une requête\ncat tools/sql/sante/etat_production.sql\n\n# Lancer une requête\nsqlite3 sol_vivant.db < tools/sql/sante/etat_production.sql\n```\n\n**Exécution depuis Python** :\n\n```python\nfrom pathlib import Path\nimport sqlite3\n\nsql = (Path('tools/sql/thesaurus') / 'doublons_termes.sql').read_text()\nconn = sqlite3.connect('sol_vivant.db')\nfor r in conn.execute(sql).fetchall():\n    print(r)\n```\n\n**Recherche full-text** (par grep, plus de SQL meta nécessaire) :\n\n```bash\ngrep -lR \"fiches.statut\" tools/sql/\ngrep -lR \"ORDER BY\" tools/sql/maintenance/\n```\n\n**Historique** :\n- avant 2026-05-06 : table `requetes_utiles` (41 rows, schéma { categorie, nom, description, sql_text, parametres, usage_type, updated_at }). Catalogue passif (aucun script Python ne le lisait).\n- **Session E 2026-05-06** : migration vers `tools/sql/<categorie>/<nom>.sql` (en-tête commenté + body SQL natif). Drop table. Coloration syntaxique IDE + diff git natif.\n", "type": "instruction", "crit": false}, {"id": 103, "titre": "Modèle conceptuel — production du corpus (référence absolue)", "contenu": "## Modèle conceptuel — production du corpus\n\n**Document de référence absolu.** Toute future session Claude doit lire cette entrée en priorité avant d'agir sur les fiches, validations, prompts ou production du corpus.\n\n### Objectif final\n\nProduire les **18 documents scientifiques** du corpus *Le Sol Vivant cet Holobionte*, rédigés en passe finale par Jenni.\n\n### Étape pivot — la « clôture » des prompts\n\nPour qu'un document soit prêt pour la passe finale Jenni, **tous ses prompts doivent être clôturés**. Un prompt est clôturé quand :\n1. `contexte_sci` est rempli (ce que la science dit déjà)\n2. `instructions` sont claires (ce que Jenni doit produire)\n3. **Aucune dette de contenu ne reste** : pas de chaîne causale non validée, pas de concept à étayer, pas de lacune connue\n\n### Les outils pour amener un prompt à la clôture\n\n| Outil | Action conceptuelle | Sortie Jenni intègre… | Table source |\n|---|---|---|---|\n| **Thésaurus** | Définir un terme canonique | `prompts.instructions` (vocabulaire utilisable par Jenni) | `terms` |\n| **Concept card** ⚠ | **Filtrer la rigueur** d'une hypothèse avant intégration corpus | (gate, bloque les affirmations bancales) | `concept_cards` |\n| **Fiche** | *Zoomer* sur un point précis (proactif) | `prompts.contexte_sci` / `.enrichissement` des docs cibles | `fiches` |\n| **Validation** | *Vérifier* une affirmation, *étayer* un concept, *combler* une lacune (réactif) | `prompts.contexte_sci` / `.enrichissement` des docs cibles | `validations` |\n| **Enrichissement thésaurus** | Cas particulier : enrichir massivement le thésaurus à partir d'une liste | thésaurus | `terms` (ajouts) |\n\n**Distinction Fiche vs Validation** :\n- **Fiche** = élargir le savoir, sujet intéressant en soi (proactif)\n- **Validation** = combler une dette identifiée par audit ou par manque détecté (réactif)\n\nLes deux contribuent au **même but** : nourrir les prompts pour les amener à clôture.\n\n### Concept cards — le filtre de rigueur (règle absolue)\n\n> **Une affirmation bancale ne passe pas dans le corpus.**\n\nLe système `concept_cards` est l'**outil de filtre** qui s'intercale entre la **captation** d'une hypothèse (note volante, vulgarisation, intuition de lecture) et son **intégration** au corpus (fiche, validation, prompt). Sans ce filtre, le corpus se laisse polluer par des affirmations séduisantes mais non vérifiées.\n\n**Workflow** :\n```\nNote vulga / hypothèse / intuition\n   ↓\nCréation/affinement d'une concept_card\n   (positionnement dans une dimension conceptuelle parmi les 12)\n   ↓\nConfrontation rigoureuse :\n  - Cohérence avec les autres dimensions\n  - Compatibilité avec les concept_card_tests (validation empirique terrain)\n  - Cohérence avec le corpus existant\n   ↓\n✗ Affirmation bancale → REJET (la carte reste en archive ou est supprimée)\n✓ Affirmation solide → la carte passe en active → l'hypothèse peut alimenter\n                       une fiche, une validation, un prompt, ou un terme\n```\n\n**Plusieurs concepts du corpus actuel ont été identifiés ainsi** : note de vulgarisation captée → pépite extraite → concept_card créée → confrontation → validation → intégration.\n\n**Rôle dans le modèle** :\n- **Amont** des fiches/validations : avant de créer une fiche pour zoomer sur un point, vérifier qu'il y a au moins une concept_card cohérente qui le supporte\n- **Filtre des notes volantes** : avant d'intégrer une pépite de note (BQ #102), tester via concept_card si l'affirmation tient la route\n- **Mémoire de rejet** : les cartes en `archive` représentent l'historique des hypothèses non passées — éviter de les ressusciter sans raison nouvelle\n\n**Tables impliquées** :\n- `concept_dimensions` (12) : axes de pensée transversaux (Cadre Eau/Redox/Économique/Évolutif, Types de sols, Histoire, Symptômes, Pratique, Cycle, Continuum)\n- `concept_cards` : les cartes proprement dites (statut `active` | `archive`)\n- `concept_card_tests` : liaisons vers `terrain_tests` pour validation empirique\n\n**Voir BQ dédiée** : *« Concept cards — système de filtre de rigueur »* (à venir).\n\n### Cycle de vie d''une validation\n\n> **Fiches** : depuis le refactor fiche/graine (2026-05-30), les fiches n'utilisent\n> PLUS ce cycle. `fiches.statut` = **`jenni` | `integree` | `archive`** ; le stade du\n> cycle Jenni (`a_rediger`/`redigee`/`envoyee`/`recue`/`recreee`) vit dans\n> **`graines.statut`** (canonique : BQ `fiche_definition`). Le cycle ci-dessous reste\n> celui des **validations**.\n\n```\na_faire   → créée en DB avec objet + docs cibles\nen_cours  → Claude prépare/affine le prompt Jenni\nenvoye    → fichier .txt généré et copié dans Jenni\nrecu      → .docx Jenni récupéré (stocké docx/ ou docx/)\nintegre   → contenu intégré dans prompts.contexte_sci/.enrichissement des docs cibles\n            + termes extraits vers `terms`\n            + contenu brut/intégré stocké dans fiche_contenus / validation_contenus\narchive   → terminé, sort de la vue active\n```\n\n### Cycle de vie d''un prompt\n\n```\na_completer → des fiches/validations en cours pointent vers lui (objet ouvert)\ncloture     → toutes les dépendances integre, prêt pour passe finale Jenni\n```\n\n⚠ **Statut figé, pas calculé automatiquement.** `prompts.statut` n'est mis à jour par **aucune vue ni trigger** (vérifié 2026-06-14 : les vues `v_avancement`/`v_prompt_final`/`v_terms_full` lisent `documents.statut`/`terms.statut`, jamais `prompts.statut` ; zéro trigger en DB). Les 192 prompts sont à `a_completer` depuis leur création. La transition vers `cloture` est **conceptuelle** — un prompt devient « clôturable » quand toutes les fiches/validations ouvertes (`statut` ∉ {`integre`, `archive`}) qui le référencent via `docs_cibles`/`prompts_cibles` sont soldées — mais elle doit être **actée à la main** et n'est pas encore outillée (aucun prompt n'est passé `cloture` à ce jour).\n\n### Cycle de vie d''un document de strate\n\n```\na_rediger        → certains prompts en a_completer\npret_a_rediger   → tous les prompts en cloture\nen_redaction     → envoyé à Jenni passe finale\nredige           → .docx final reçu et intégré\n```\n\n### Tables et leur rôle\n\n| Table | Rôle | Statuts |\n|---|---|---|\n| `documents` (18) | Docs cibles du corpus | a_rediger / pret_a_rediger / en_redaction / redige |\n| `prompts` (~191) | Prompts par section | a_completer / cloture |\n| `terms` | Thésaurus canonique | (présent ou manquant, pas de cycle) |\n| `fiches` | **Zooms** sur un point précis (sous-types `zoom`, `technique`) | jenni / integree / archive (cycle graine → `graines.statut`) |\n| `validations` | **Vérifications + comblements** (modes `validation`, `renforcement`, `comblement`) | a_faire / en_cours / envoye / recu / integre / archive |\n| `chains_causales` (C1-C9) | Chaînes scientifiques du corpus | objet potentiellement référencé par une validation |\n| Rapports d'audit (`jmj/rapports/audit/*.md`) | Audits qui révèlent des lacunes | source possible de validations |\n\n### Workflow de production complet\n\n```\n1. AUDIT du corpus (analyse_corpus.py, audit_opus.py, agents)\n   ↓\n2. Identification des manques :\n   - termes manquants → enrichissement thésaurus (gen_prompt_enrichissement.py)\n   - sujets transversaux non couverts → nouvelles fiches\n   - chaînes/concepts/lacunes → nouvelles validations\n   ↓\n3. Production des prompts Jenni\n   - export_fiche.py            → prompts_fiche_*.txt\n   - export_validation.py       → prompts_validation_*.txt\n   - gen_prompt_enrichissement  → enrich_*.txt (lots de 10, charte Jenni)\n   ↓\n4. Cycle Jenni (envoye → recu)\n   ↓\n5. Intégration Claude :\n   - termes → terms\n   - contenu fiches → fiche_contenus + prompts.contexte_sci/.enr\n   - contenu validations → validation_contenus + prompts.contexte_sci/.enr\n   ↓\n6. Clôture des prompts (transition `a_completer → cloture` actée à la main — pas de vue/trigger automatique ; non outillée à ce jour)\n   ↓\n7. Doc en pret_a_rediger\n   ↓\n8. Passe finale Jenni → doc rédigé\n```\n\n### Règles de séparation (pour éviter la dérive)\n\n1. **Une fiche n'est pas une validation**. Tables séparées, sémantiques distinctes.\n2. **Un prompt de strate ne contient jamais de méta-commentaire Claude**. Tout méta va dans `notes` ou `audit_reports`, jamais dans `contexte_sci/.instructions/.enrichissement`.\n3. **Les DOIs ne sont pas stockés** comme métadonnée d'une fiche/validation. `jenni_sources` est la source bibliographique unique. Cf. BQ #102.\n4. **Tout retour Jenni intégré** va dans le bon champ : `fiche_contenus` pour les fiches, `validation_contenus` pour les validations, et `prompts.contexte_sci/.enrichissement` pour les docs cibles. **Jamais** dans le champ `instructions` qui sert à la prochaine demande Jenni.\n5. **Les statuts sont la vérité** : on ne marque pas `exporte` ou `produit` sans cycle de vie cohérent. Le statut reflète l'état réel à tout moment.\n6. **Charte Jenni générique** (BQ #40, #41, #101) s'applique à TOUT prompt destiné à Jenni : pas de codes docs, pas de méta-vocabulaire, citations format `[N]`, blocs de 10 max pour l'enrichissement.\n7. **Charte fiches techniques** s'applique en plus aux fiches `type='technique'` : structure standardisée 8 sous-blocs (Contexte sci / Protocole / Ingrédients / Équipement / Procédure / Indicateurs qualité / Précautions & Stockage / Applications & Dosages).\n\n### État cible (idéal)\n\n- 100% des `terms` définis\n- 100% des `fiches` valides en `integre` ou `archive`\n- 100% des `validations` valides en `integre` ou `archive`\n- 100% des `prompts` en `cloture`\n- 100% des `documents` en `pret_a_rediger` puis `redige`\n\n### ⚠ Etat actuel (avril 2026)\n\n`validation_sections` et `validation_contenus` existent en DB avec des donnees historiques (81 et 16 rows respectivement) mais **aucun script actif ne les alimente**. La logique des validations est en pause (cf. BQ #127). Les BQ qui decrivent leur workflow sont conservees comme reference, mais les scripts `export_validation.py` / `import_validation.py` ne sont pas operationnels aujourd'hui.\n\n\n## Contexte\n\ndocument de référence absolu\n", "type": "reference", "crit": true}, {"id": 72, "titre": "Structure dépôt et conventions de nommage", "contenu": "**Arborescence du dépôt :**\n```\nTools/                          ← racine git\n├── sol_vivant.db               ← source de vérité données (corpus, audit_log, config, refs)\n├── CLAUDE.md                   ← généré par session_start.py\n├── tools/                      ← scripts Python\n├── Publications/\n│   ├── img/                    ← images (OG, favicons, logos)\n│   ├── web/                    ← pages HTML publiques (noms fixes)\n│   ├── cartographie/           ← documentation statique\n│   ├── prompts/                ← exports Jenni horodatés\n│   ├── workflows/              ← workflows horodatés\n│   └── journal/                ← journaux de session\n├── jmj/                        ← documents de travail auteur\n└── Ma bibliothèque.ris         ← export RIS\n```\n\n**Conventions de nommage :**\n- Pages web : noms fixes (index.html, mo_calculateur.html, triangle_textures.html) — trackées par git, versionnées\n- Images OG : dans Publications/img/ (miroir du dépôt GitHub Pages)\n- URL OG : `https://sol-vivant.github.io/Publications/img/<nom>.png`\n- Favicon : `href=\"../img/<nom>.png\"` (chemin relatif depuis web/)\n- Scripts : `--db` optionnel (défaut `sol_vivant.db` à la racine)\n- Pas d'horodatage sur les HTML web (une seule version, git fait le versioning)\n", "type": "reference", "crit": false}, {"id": 96, "titre": "Explorer DB — interface web locale", "contenu": "## Explorer la DB localement\n\n```bash\npython3 tools/admin/explorer.py [--db sol_vivant.db] [--port 8765]\n```\n\nOuvre une interface web sur http://localhost:8765 pour naviguer :\n- Toutes les tables et vues (groupées par domaine)\n- Recherche dans les colonnes\n- Pagination\n- Panneau de détail pour les textes longs\n- BQ modules avec contenu Markdown\n- Sessions de maintenance\n\n**Ne modifie rien** — consultation seule.\n", "type": "workflow", "crit": false}, {"id": 76, "titre": "Workflow : design avant code, commits fréquents", "contenu": "**Anti-pattern observé** : coder immédiatement → corrections multiples → doublons → bugs d'encoding.\n\n**Séquence recommandée :**\n1. **Comprendre** : lire le code existant, les données en DB, les patterns\n2. **Concevoir** : décider où mettre les données (nouvelle table ? colonne ? config ?), écrire le composant sur papier\n3. **Implémenter** : DB d'abord, puis script, puis template\n4. **Tester** : regénérer, vérifier le HTML, tester dans le navigateur\n5. **Commit** : un commit par étape logique, pas un gros commit final\n\n**Commits de checkpoint** : commiter tous les 2-3 items pour éviter les pertes.\nUn fichier cassé par un Edit partiel se restaure avec `git checkout -- fichier` — mais seulement si le commit précédent est propre.\n\n**Historique** : fichier cassé restauré par git checkout (session 01/04), 3 commits correctifs successifs sur l'encart MO (session 03/04).\n", "type": "conseil", "crit": false}, {"id": 129, "titre": "Intégration source — rapport biblio JMJ ET import batch termes thésaurus (import_termes_jenni)", "contenu": "## Workflow intégration de source — opération consciente\n\n> **Quand consulter cette BQ** — toute **demande d'intégration** d'un retour\n> externe dans le corpus :\n> - **(a) rapport bibliographique** JMJ (article, PDF, métadonnées) → table\n>   `jenni_sources` : sections ci-dessous.\n> - **(b) docx Jenni de termes** (`TERME/EN/DEF/SYN_FR/SYN_EN/BT/RT`) →\n>   `tools/jenni/import_termes_jenni.py` : section **« Variante — import batch\n>   de termes thésaurus »** en bas de cette BQ (frictions de production à\n>   anticiper). Réimport : voir aussi BQ thésaurus #116.\n>\n> Mots-clés de déclenchement : *intégration source, import termes, retour Jenni\n> thésaurus, import_termes_jenni, dédoublonnage, mapping strate*.\n\n### Principe\n\nJMJ fournit un **rapport de source** (métadonnées d'un article scientifique, souvent copié-collé depuis un PDF reader, Semantic Scholar, PubMed, un groupe de veille…). Claude intègre cette source **une à la fois**, avec le même soin que l'intégration d'une fiche. Cette opération enrichit la biblio interne (`jenni_sources`) et **peut renforcer le thésaurus** si des termes canoniques manquent.\n\n**Règle d'or** : jamais de batch-insert. Chaque source est une pièce du corpus, elle mérite une lecture attentive.\n\n### Entrée — ce que JMJ donne\n\nUn bloc brut comme :\n\n```\nTitre de l'article\nType de document : Article de revue\nAuteur : A. Untel / B. Untel ...\nRésumé : [abstract complet]\nDate : YYYY/MM/DD\nDOI : 10.XXXX/...\nURL : https://...\nPublication : Nom du journal\nVolume, Pages, Numéro, ISSN\n```\n\nFormat variable (export RIS, Semantic Scholar copy, PubMed metadata, groupe email…). Claude **normalise mentalement** avant d'écrire.\n\n### Séquence (Claude pilote, JMJ valide)\n\n**1. Lecture consciente**\n- Lire le titre + résumé intégralement\n- Identifier le **thème principal** (ex : bone char contamination arsenic / riziculture)\n- Identifier les **concepts clés** candidats à enrichir le thésaurus (ex : `bone char`, `arsenic speciation`, `arsenic methylation`, `arsC/arsM genes`)\n- Identifier les **documents / fiches / cards** du corpus potentiellement concernés\n\n**2. Dedup**\n```python\ncur.execute(\"SELECT id, doi, titre_complet FROM jenni_sources WHERE doi = ? OR titre_complet LIKE ?\",\n            (doi, f'%{titre_court}%'))\n```\n- Si déjà présent → proposer un UPDATE (enrichissement) plutôt qu'un nouvel INSERT\n- Si nouveau → continuer\n\n**3. Insertion `jenni_sources`** (champs critiques)\n- `doi` (normalisé sans préfixe)\n- `auteurs` (format : `Nom1 P, Nom2 Q, Nom3 R, et al.`)\n- `annee` (INTEGER)\n- `titre_complet` (exact, pas tronqué)\n- `titre_court` (extrait-clé en 4-8 mots, lisible)\n- `journal`\n- `resume_court` (150-300 mots, reformulation synthétique — pas l'abstract brut)\n- `pertinence` (ex : `S2 microbiome + P2 conservation` ou `H3 AMR`)\n- `tags` (JSON list : mots-clés thématiques du corpus)\n- `url` (lien DOI ou URL article)\n\n**4. Liens `source_usages`** (si pertinent)\nSi la source cite/justifie directement un contenu du corpus, ajouter un lien :\n```python\nINSERT INTO source_usages (source_id, entity_type, entity_id, contexte, citation_brute)\nVALUES (?, 'fiche', ?, 'Section Contexte scientifique', '(Hao et al., 2026)')\n```\n`entity_type` ∈ `{doc, fiche, term, card, prompt}`.\n\n**5. Renforcement thésaurus** (si termes nouveaux)\nSi l'article introduit des termes canoniques absents du thésaurus :\n- Vérifier `SELECT id FROM terms WHERE fr=? OR en=?`\n- Si absent : **proposer** à JMJ un ajout (titre, def depuis résumé, syn_fr/en, bt, rt)\n- JMJ valide → insert dans `terms` avec `doc_code='S'` ou autre\n- **Ne jamais** inventer des définitions sans base article\n\n**6. Audit log**\n```python\nINSERT INTO audit_log (operation, table_name, record_ref, detail)\nVALUES ('INSERT', 'jenni_sources', f'source #{src_id}',\n        f'{auteurs_court} {annee} {journal} — {theme_en_une_ligne} ({doc_codes_cibles})')\n```\n\n### Exemple d'intégration (modèle)\n\n**Entrée** (rapport JMJ) :\n```\nMicro-nanoscale bone char modulates rhizosphere As-cycling genes…\nAuteur : Yi Hao, Weitao Wu, … Chuanxin Ma\nDOI : 10.1007/s44246-026-00258-4\nPublication : Carbon Research\n```\n\n**Traitement Claude** :\n- Thème : bone char amendement / arsenic speciation / rice paddy\n- Corpus concerné : `S1 architecture sol` (amendement), `S2 microbiome` (arsC/arsM genes), `P1 diagnostic` (contamination), `P2 conservation`\n- Nouveaux termes potentiels (à valider) : `bone char`, `arsenic speciation`, `arsenic methylation gene (arsM)`\n- Source déjà en DB ? → SELECT par DOI → non\n- `resume_court` synthétise : « MNBC 25 g/kg sur sol contaminé 75 mg/kg As : urease +94-166%, catalase +35-519%, carbone organique +9-30%, arsC/arsR −6-52%, arsM +11-20%. Amélioration de la santé du sol sans changer l'accumulation As dans le riz. »\n- `pertinence` : `S1/S2/P1 amendement bone char contamination arsenic`\n- `tags` : `[\"bone char\", \"arsenic\", \"paddy soil\", \"arsC arsM\", \"soil remediation\"]`\n\n**Sortie** (Claude rend compte à JMJ) :\n- Source #XXXX insérée\n- 0 ou N termes candidats identifiés (liste)\n- 0 ou N liens source_usages créés\n\n### Ce qui n'est **pas** ce workflow\n\n- Import batch biblio → archivé (modules retirés)\n- Enrichissement auto depuis PubMed/E-utilities → utile comme outil annexe, mais la décision d'intégration reste manuelle\n- Ajouter des refs dans `fiche_contenus.refs` → ça c'est le job de Jenni à la rédaction, pas de Claude à la veille\n\n### Scripts (à construire au besoin)\n\nIl n'existe pas encore de script dédié. Aujourd'hui c'est interactif dans la session :\n\n```sql\n-- Template d'insertion (à adapter à chaque source)\nINSERT INTO jenni_sources (doi, auteurs, annee, titre_complet, titre_court,\n                           journal, resume_court, pertinence, tags, url, created_at)\nVALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, datetime('now'));\n```\n\nUn futur `tools/veille/integrate_source.py` pourrait automatiser le dedup + template, mais la **lecture consciente** reste en session.\n\n## Variante — import batch de termes thésaurus (`import_termes_jenni.py`)\n\nQuand JMJ fournit un **docx Jenni de termes** (format\n`TERME/EN/DEF/SYN_FR/SYN_EN/BT/RT`, retour d'une liste envoyée via le workflow\nthésaurus), l'intégration passe par `tools/jenni/import_termes_jenni.py` — **pas**\npar l'insertion `jenni_sources` ci-dessus. Doctrine de réimport : BQ thésaurus\n#116. Les frictions ci-dessous ont été constatées **en production** (passe de\n100 termes, 2026-05-29 : 92 inserts / 8 doublons) et doivent être anticipées.\n\n### Séquence\n\n1. **Backup DB** avant toute mutation. ⚠ `session_start.py` ne dépose pas\n   toujours un backup visible dans `backups/` → copier `sol_vivant.db` à la main\n   au besoin.\n2. **Dry-run** : `import_termes_jenni.py --db … --docx <docx> --strate S`\n   (placeholder) → lire le rapport « À INSÉRER / À UPDATER / BLOQUÉS ».\n3. **Mapping multi-strates** : Jenni ne fournit **aucune strate** (elle ignore\n   l'organisation du corpus — règle absolue), donc le docx de retour n'en porte\n   pas. L'assignation strate/doc_code est **l'arbitrage de Claude**. Un docx\n   hétérogène **exige** un `--mapping CSV`\n   (`terme, strate_proposee, doc_code_propose, mode_force`) ; le `--strate`\n   unique ne vaut que pour un docx mono-strate. La **lettre de strate seule**\n   (F/S/V/P/H) est cohérente avec ~40 % des termes existants — pas de fausse\n   précision sur les sous-niveaux, JMJ raffine au besoin (BQ #53).\n4. **Apply** : ajouter `--apply`. `--rels-mode merge` (défaut) préserve les\n   relations existantes ; ne **jamais** `replace` sans `--allow-rels-destruction`.\n5. **Vérif post-import** : inspecter les flags « doublons croisés », backfiller\n   les chaînes/cards en attente de ces termes (ex. C30), puis `regen_all.py` +\n   `check_integrity.py`.\n6. **Orphelins BT/RT du lot → fichier unique** (OBLIGATOIRE) — les orphelins BT/RT\n   du lot (cibles non résolues) sont de **vrais candidats nouveaux termes** :\n   `build_fr_index` couvre déjà fr/en/syn_fr/syn_en, donc un orphelin\n   (`to_term_id` NULL) n'a matché **aucun** libellé ni synonyme. Ils sont ajoutés\n   **consciemment** au fichier unique `recherches/thesaurus/termes_a_definir.txt`\n   (cf. thesaurus_workflow §0 « Vie du fichier »), dédupliqués contre `terms` ET\n   contre le fichier, tri alpha (#115), **artefacts filtrés à la main** (coquilles,\n   placeholders `[…]`, notation `¹⁵N`, acronymes nus). `export_thesaurus_incomplets\n   --single-txt` les conserve et y ajoute les DB-incomplets au run suivant.\n   Reproductible a posteriori : re-parser le docx du lot et résoudre ses BT/RT\n   contre les `terms` courants (les non-résolus = candidats). ⚠ Ne **pas** verser\n   le backlog historique global (`… WHERE to_term_id IS NULL` sur toute la table) :\n   des milliers de labels prose-dérivés pollués — dette séparée, pas la matière d'un\n   cycle. Ne verser que **les orphelins du lot en cours** (propres, issus des champs\n   BT/RT structurés).\n\n### Frictions à anticiper (checklist production)\n\n- **Doublons amont (8 % en prod)** — des termes de la liste candidate existent\n  déjà sous un **libellé FR canonique différent** (landrace = « Variété locale »,\n  « microzone anoxique » = « microsites anoxiques », bio-augmentation =\n  « Bioaugmentation », carbon farming = « Agriculture du carbone »…) ou en\n  collision `syn_en` (r/K-stratège ≈ Copiotrophes/Oligotrophes). → Passer la\n  liste candidate au **contrôle anti-doublon 4 axes (fr/en croisés) AVANT envoi\n  Jenni** (sinon effort Jenni gaspillé). Les bloqués-sur-match se traitent en\n  `mode_force=skip` dans le mapping — **jamais `--replace`** (écraserait le `fr`\n  canonique, règle #138).\n- **Jenni simplifie les libellés** — elle retire souvent les **parenthétiques**\n  (« Iroko (Milicia excelsa) » → « Iroko » ; « …sols (QBS) » → « …sols »). Le\n  `norm()` du mapping ne matche alors plus le terme → strate « ? » placeholder.\n  → Diffuser le **docx parsé contre la liste envoyée** et aligner les clés du\n  mapping sur la forme **réellement renvoyée** par Jenni.\n- **Collisions `syn_fr ↔ fr` détectées seulement POST-insert** — le contrôle\n  4 axes ne voit pas qu'un `syn_fr` d'un nouveau terme = `fr` canonique d'un\n  terme existant. Le script le signale **après** l'INSERT (« arbitrage JMJ\n  requis »). Inspecter chaque flag : certains sont de **vrais doublons ratés\n  par la dédup amont** (ex. « hydrophobicité du sol » vs « hydrophobie du\n  sol » : `fr` ET `en` diffèrent légèrement → 4 axes aveugle) ; d'autres sont\n  des synonymes trop larges à resserrer (ex. « alley cropping » portait\n  « culture intercalaire », concept distinct #3177).\n- **Relations BT/RT partiellement orphelines** — les broader/related-terms des\n  concepts neufs pointent souvent vers des cibles absentes du thésaurus (en\n  prod : 58 BT + 161 RT orphelins / 92 termes). C'est **normal** ; ne pas\n  chercher à toutes les résoudre à l'import. Elles « entrent avec les passes\n  suivantes » **via l'étape 6** (versement dans le fichier à-définir) — sinon\n  elles restent des relations `to_term_id` NULL jamais requêtées et la dette ne\n  se résorbe pas. Le versement EST le mécanisme de résorption.\n- **`chain_etapes` n'a pas de colonne `updated_at`** — piège de schéma au moment\n  du backfill des `term_id` (les `terms` en ont, pas `chain_etapes`).\n\n### BQ liées\n\n- `wf_fiche` : intégration de fiches (même logique consciente à plus grande échelle)\n- #106 concept_cards : filtre de rigueur — une source introduit souvent une hypothèse qui doit passer par une card avant d'entrer dans le corpus\n\n\n### Fiabilité des sources : règle « livre/rapport vs Jenni »\n\n**Source primaire validée (livre, rapport institutionnel, publication académique à DOI)** — les valeurs chiffrées sont **fiables par construction** :\n- Smil 2017, Fuller 1938, Jancovici 2015, Nikiforuk 2012 (livres)\n- The Shift Project PREF 2024, Carbone 4 (rapports institutionnels)\n- Arvalis Triple Performance, IPCC, ministère (guides/rapports officiels)\n- JMJ synthèses (docs travail propres, JMJ pilote)\n\n→ **Entrée en `ref_*` directe** sans double-vérification cognitive. Ancrage sur la page/ref de la source. La révision concerne la pertinence (est-ce dans notre scope ?) pas la véracité numérique.\n\n**Sortie Jenni** — les valeurs chiffrées sont **à vérifier systématiquement** :\n- Jenni peut halluciner des nombres plausibles mais faux\n- Jenni peut agglomérer deux valeurs de sources différentes\n- Jenni ne sait pas nuancer les unités (kWh utile vs thermique)\n\n→ **Lecture ligne-à-ligne** avant intégration, rejet de toute valeur non ancrée à une source primaire consultable, préférence à réécrire ou demander régénération plutôt qu'accepter avec doute.\n\n**Workflow pour sources livres PDF (`jmj/pdf/`)** :\n1. Read PDF via outil Read (fonction PDF native, `pages` pour PDF > 10 pages)\n2. Extraction ciblée des tableaux / valeurs chiffrées (pas copier tout le texte)\n3. INSERT dans `ref_*` avec `source_id` → entrée jenni_sources\n4. INSERT jenni_sources (type='livre' / 'rapport' / 'organisation') si pas déjà présent\n5. Pas de régression cognitive : la valeur en DB devient autoritaire pour la session\n\n### Flag « haute valeur » pour récupération PDF\n\nJMJ maintient un accès au texte intégral via son outil de collecte externe\n(biblio interne + bibliothèques institutionnelles). L'abstract RIS est suffisant\npour une intégration standard, mais certains articles justifient d'aller\nplus loin.\n\n**Flag explicitement « haute valeur — demander PDF »** quand :\n- Apport chiffré unique ou méthodologie inédite dans le corpus\n- Source primaire sur un concept pivot (souvent jamais cité ailleurs)\n- Données quantitatives qui dimensionneraient un calculateur (Kirkby, MO,\n  esclaves, triangle textures, transition robuste)\n- Revue de synthèse couvrant une zone aveugle du corpus\n- Article fondateur qu'on cite partout sans avoir lu\n\n**Ne pas flag** (intégration abstract suffit) quand :\n- Sujet déjà structurellement couvert (fiches + cards existantes)\n- Apport incrémental chiffré mais non-structurant\n- Donnée pays-spécifique qui ne généralise pas\n\nSi le PDF n'est pas disponible mais que la source mérite d'être gardée :\n- INSERT jenni_sources normal\n- `notes` : `'PDF indisponible 2026-AA-JJ — intégration abstract seul'`\n- Pas de concept_card détaillée, juste liens usages basiques\n", "type": "workflow", "crit": true}, {"id": 126, "titre": "Trios parallèles *_sections / *_contenus (redondance structurelle connue)", "contenu": "## Trios parallèles `*_sections` / `*_contenus` (DB pattern connu)\n\n**Constat de maintenance 2026-04-14** : 6 tables dupliquent le schéma\nentre 3 types de production (fiches / docs de strate / validations).\n\n### Trio 1 — Sections éditoriales\n\n```\nfiche_sections       (143 rows, 4 scripts) — fiches\nprompts              (191 rows, 24 scripts) — docs de strate (schéma enrichi)\nvalidation_sections  (81 rows, 1 script)   — validations\n```\n\nColonnes communes : `type`, `ordre`, `titre`, `contexte_sci`, `instructions`,\n`enrichissement`, `tableau`. `prompts` ajoute `titre_h1/h2/h3`, `doc_code`,\n`chapitre`, `section`, `style`, `statut`.\n\n### Trio 2 — Retours Jenni (contenus)\n\n```\nfiche_contenus        (28 rows, 3 scripts)  — retours Jenni fiches\nprompt_contenus       (12 rows, 2 scripts)  — retours docs\nvalidation_contenus   (16 rows, 0 script)   — ORPHELINE\n```\n\nQuasi identiques : `version`, `contenu_brut`, `contenu_integre`, `refs`,\n`notes_claude`, `date_import`. `prompt_contenus` avait un champ `contenu`\natypique — désormais `contenu_brut` rempli en parallèle (migration 2026-04-14).\n\n### Vues unifiées (historique, retirées 2026-04-20)\n\nDeux vues SQL avaient été créées le 2026-04-14 pour unifier l'accès aux 3 trios :\n`v_content_sections` (UNION ALL fiche_sections + prompts + validation_sections) et\n`v_content_retours` (UNION ALL fiche_contenus + prompt_contenus + validation_contenus).\n\nElles ont été **droppées le 2026-04-20** (cf. audit_log) :\n- aucun consommateur dans `tools/` ou `tests/`\n- `v_content_retours` exposait `contenu_integre` legacy (le contenu est maintenant dans `fiche_sections.contenu` par section, cf. BQ #130 §4.2)\n- `v_content_sections` ne connaissait pas les nouveaux champs (`contenu`, `analyse_claude`)\n\nSi un besoin de lecture transversale réapparaît, les vues sont à recréer avec les colonnes post-refonte (incluant `contenu` et `analyse_claude` pour `fiche_sections`).\n\n\n### Décision physique : pas de migration\n\n**Factorisation physique non appliquée** : risque de casser 24 scripts qui\nassument la structure actuelle, pour un gain modeste (~500 Ko, 6→2 tables).\nLes vues couvrent le besoin de lecture transversale sans toucher au stockage.\n\n**Actions complémentaires possibles** :\n- Archiver `validation_contenus` (0 script, table morte) — cf. BQ #127\n- Documenter le pattern pour les futures sessions (cette entrée)\n\n### À envisager après maturation complète\n\nUne fois le corpus stabilisé (fiches matures, docs de strate peuplés,\nplus de cycle d'écriture intensif), une migration vers l'architecture\nphysique unifiée serait plus sûre.\n\n### Autres redondances mineures (non critiques)\n\n- `doc_code` / `docs_codes` / `docs_cibles` : 3 formats pour désigner\n  des documents (string / string multi-slash / JSON array)\n- `categorie` / `tags` : conventions variables selon domaine\n- `notes_claude` vs `notes` : 2 conventions d'annotation\n\n\n### Principe architectural — préparation à l'import, rendu trivial (avril 2026)\n\nLes 3 trios (fiche / doc / validation) partagent une règle :\n\n> **Le nettoyage du texte se fait une fois à l'intégration**, dans `<entity>_sections.contenu` (TEXT, nouveau champ). Le rendu HTML devient du `fetch → afficher`.\n\nCorollaires :\n\n- Un seul parser docx partagé (`tools/lib/parse_jenni_docx.py`) alimente les 3 trios — gère OMML, LaTeX, refs FR→EN, tags Jenni résiduels, découpage par section selon le plan DB.\n- Un seul composant de rendu React (`SvRichContent`) consomme les 3 trios — lit le plan DB + affiche sections et refs. Plus de parser côté JS.\n- Si le format Jenni change → un seul point de maintenance (le parser d'import).\n- Les champs `<entity>_contenus.contenu_integre` (blob markdown) deviennent **legacy** : conservés pour l'historique des intégrations antérieures, plus écrits par les nouveaux imports.\n\nCette règle remplace la doctrine précédente qui acceptait du markdown brut en DB et laissait `SvRichText` faire un parsing tolérant côté client.\n\n### ⚠ Etat actuel (avril 2026)\n\n`validation_sections` et `validation_contenus` existent en DB avec des donnees historiques (81 et 16 rows respectivement) mais **aucun script actif ne les alimente**. La logique des validations est en pause (cf. BQ #127). Les BQ qui decrivent leur workflow sont conservees comme reference, mais les scripts `export_validation.py` / `import_validation.py` ne sont pas operationnels aujourd'hui.\n", "type": "reference", "crit": false}, {"id": 127, "titre": "`validation_contenus` en sommeil (0 script actif)", "contenu": "## `validation_contenus` — table en sommeil\n\n**Constat maintenance 2026-04-14** : table présente (16 rows, schéma\ncohérent avec `fiche_contenus`) mais **aucun script ne la lit**.\n\n### État\n- Rows : 16\n- Données depuis : 2026-04-10 (15 jours avant constat)\n- FK : `validation_id` → `validations(id)` ON DELETE CASCADE\n- Scripts qui la référencent : 0\n\n### Usage prévu (historique)\n\nStockage des retours Jenni pour les documents de validation (table\n`validations`, workflow parallèle à fiches et docs de strate). L'extension\ndu workflow vers les validations n'a pas été développée — la table\nattend son usage.\n\n### Décision de maintenance\n\n**Conserver** : les 16 rows contiennent des données (non-vides),\nprobablement des brouillons de validations. Ne pas supprimer tant que le\nworkflow validation n'est pas clarifié.\n\n**À décider** ultérieurement :\n- Développer le workflow validation (lecture + intégration)\n- OU archiver définitivement si validation_sections non plus exploitée\n", "type": "reference", "crit": false}, {"id": 134, "titre": "Structure jmj/ et config.paths — rapports et audits centralises", "contenu": "## Structure jmj/ et config.paths\n\n### Vue d'ensemble\n\nTous les **rapports** et **audits** sont centralises dans `jmj/`. Les paths\nsont en base (`config.paths.*`) et les scripts les lisent via\n`lib.config.get_path()`. Pas de path hardcode.\n\n```\njmj/\n├── rapports/            ← rapports centralises\n│   ├── session/         ← cloture session Claude Code (date YYYY-MM-DD.md)\n│   └── audit/           ← rapports audit (fiches, thesaurus, BQ, sources)\n├── analyses/            ← sortie gen_reports.py depuis audit_reports\n│   └── reports/\n├── archives/            ← docx sources archives\n├── docx/                ← docx sources JMJ (drafts, propositions Jenni)\n├── journaux/            ← journaux de seances\n├── pdf/                 ← biblio PDF externe (Shift, Triple Perf, etc.)\n├── revues/              ← revues JMJ\n├── session/             ← contexte session\n├── transcriptions/      ← transcriptions audio\n└── notes*.txt           ← notes volantes a la racine\n```\n\n### Table config — categorie `paths`\n\nPaths disponibles via `lib.config.get_path(conn, 'CLE')` :\n\n| Cle | Valeur | Usage |\n|---|---|---|\n| `rapports_session` | `jmj/rapports/session` | Sortie rapport fin de session |\n| `rapports_audit` | `jmj/rapports/audit` | Sorties audits (scripts audit_*.py) |\n| `analyses_reports` | `jmj/analyses/reports` | Sortie gen_reports.py |\n| `recherches_fiches` | `recherches/fiches` | Docx Jenni fiches (cycle) |\n| `recherches_thesaurus` | `recherches/thesaurus` | Exports thesaurus + audits semantiques |\n| `recherches_sources` | `recherches/sources` | Exports sources |\n| `recherches_veille` | `recherches/veille` | Veille hebdo (PubMed) |\n| `recherches_archives` | `recherches/archives` | Archives fiches/thesaurus |\n| `jmj_docx` | `jmj/docx` | Docx sources JMJ |\n| `jmj_archives` | `jmj/archives` | Archives docx sources |\n| `jmj_pdf` | `jmj/pdf` | PDF biblio externe JMJ |\n| `jmj_notes` | `jmj` | Racine pour notes*.txt |\n| `publications_web` | `Publications/web` | Pages HTML publiees |\n| `publications_workflows` | `Publications/workflows` | Workflows horodates |\n| `docx_en_cours` | `docx` | Docx en cours (envoyes Jenni) |\n| `docx_archives` | `docx/archives` | Docx retournes + integres |\n\n### Regles\n\n1. **Pas de path hardcode** dans les scripts. Utiliser `get_path()`.\n2. **Defaults** : chaque `get_path()` doit avoir un fallback au cas ou la\n   config serait absente (ex: `get_path(conn, 'rapports_audit', 'jmj/rapports/audit')`).\n3. **Creation automatique** : `get_path(..., ensure_exists=True)` cree le\n   dossier si besoin. A utiliser pour les sorties qui peuvent tomber sur\n   un path non encore cree.\n4. **Distinguer rapports vs recherches** :\n   - `rapports/` = artefacts peripheriques, memoire de sessions, non\n     consommes par les scripts (lecture humaine JMJ)\n   - `recherches/` = cycle Jenni actif, consommes/produits par les scripts\n     d'import/export fiches, thesaurus, etc.\n5. **Distinguer jmj/ vs racine** : `jmj/` = JMJ personnel + memoire ;\n   racine (`docx/`, `recherches/`, `Publications/`) = cycle de production\n   actif partage avec Jenni / publications.\n\n### Lien avec les autres BQ\n\n- **#125 structure_recherches** : structure `recherches/` detaillee (cycle\n  Jenni). Ce BQ-ci complete avec la structure `jmj/` centrale.\n- **#128 wf_session** : la cloture de session ecrit dans\n  `config paths.rapports_session`.\n- **#102 traitement_notes** : les notes volantes restent a la racine de\n  `jmj/` (path `jmj_notes`).\n\n### Migration 2026-04-18\n\n- `rapports_sessions/` (racine) → `jmj/rapports/session/`\n- `jmj/SESSION_*.md` → `jmj/rapports/session/`\n- `jmj/audit_fiches_*.md`, `jmj/revue_bq_*.md`, `jmj/plan_integration_*.md`\n  → `jmj/rapports/audit/`\n- `recherches/audits/*` (9 fichiers) → `jmj/rapports/audit/`\n\nLe dossier `recherches/audits/` a ete supprime ; les nouveaux audits\nvont dans `jmj/rapports/audit/`.\n", "type": "doctrine", "crit": false}, {"id": 143, "titre": "BQ — architecture domaines_techniques (refonte 2026-04-20)", "contenu": "## Architecture BQ — filesystem natif (refonte Session D 2026-05-06)\n\nLa BQ est stockee en **filesystem** : un fichier `tools/bq/<slug>.md` par entree\navec frontmatter YAML + body markdown. Le catalogue des 14 domaines techniques\nest dans `tools/bq/_domaines.yaml`.\n\nUne entree BQ a **1 domaine_primaire** (le pipeline ou elle fait loi) et\n**0-5 domaines_reference** (ou elle sert de doctrine transverse).\n\n### Frontmatter standard\n\n```yaml\n---\nslug: bq_architecture_domaines        # = nom de fichier\ntitre: \"BQ — architecture domaines techniques\"\ntype: reference                        # workflow|regle|reference|doctrine|...\nis_critique: false\nis_active: true\nordre: 99\ndomaine_primaire: bq                   # 1 slug exactement\ndomaines_reference: [session, integrite]  # 0-5 slugs\ntags: [architecture, bq, doctrine]\nlegacy_id: 143                         # facultatif, audit migration\ncode_bq: bq_architecture_domaines      # facultatif, ancien systeme\n---\n\n# Body markdown (= ancien contenu_md)\n```\n\n### Catalogue des 14 domaines (`tools/bq/_domaines.yaml`)\n\n```yaml\ndomaines:\n  - slug: thesaurus\n    nom: \"Pipeline thesaurus\"\n    categorie: pipeline\n    ordre: 1\n  # ... 14 entrees\n```\n\n### 4 catégories\n\n- **pipeline** : cycle prompt Jenni → .docx → integration (thesaurus, fiches, docs, validations)\n- **corpus** : contenu en base, edition directe Claude, pas de cycle Jenni (concept-cards, chaines)\n- **web** : toutes les pages du site\n- **technique** : infrastructure transverse (bq, session, integrite, analyse, archivage, jenni-workflow, sources-autoritaires)\n- **specifique** : chantier one-shot (vide actuellement, conserve pour usage futur)\n\n### Consultation (bq_query.py v3.0)\n\n```bash\n# Inventaire des domaines groupes par categorie\npython3 tools/admin/bq_query.py --list\n\n# Charger un domaine entier (primaires + references)\npython3 tools/admin/bq_query.py --domaine fiches\n\n# Primaires seulement\npython3 tools/admin/bq_query.py --domaine bq --primaire-only\n\n# Entrees critiques d'un domaine\npython3 tools/admin/bq_query.py --domaine web --critical-only\n\n# Recherche full-text (fuzzy NFKD)\npython3 tools/admin/bq_query.py --search \"pseudoscience\"\n\n# Tags transversaux\npython3 tools/admin/bq_query.py --tags workflow,contrainte\npython3 tools/admin/bq_query.py --list-tags\n```\n\n### Ajouter une entree BQ\n\nEditer/creer un fichier `tools/bq/<slug>.md` avec le frontmatter ci-dessus.\nLe slug doit etre unique. Le `domaine_primaire` doit exister dans\n`_domaines.yaml`.\n\n### Module programmatique\n\n```python\nfrom bq_inventory import (\n    list_entries, search_entries, list_domaines, list_tags, read_entry, write_entry\n)\n\n# Toutes les entrees primaires du domaine 'fiches'\nentries = list_entries(domaine='fiches', primaire_only=True)\n\n# Recherche fuzzy\nmatched = search_entries('pseudoscience')\n\n# Inventaire avec stats\nfor d in list_domaines():\n    print(f\"{d['slug']:20s} {d['n_prim']:3d} primaires, {d['n_ref']:3d} refs\")\n```\n\n### Historique\n\n- **avant 2026-04-20** : `bq_modules` (9 modules) + `bq_entries.module_code` (1 entree = 1 module).\n- **2026-04-20** : refonte vers `domaines_techniques` (14 slugs, 4 categories) + `domaine_bq` (N-N, role primaire|reference). Tables SQL avec index.\n- **2026-05-06 (Session D)** : bascule en filesystem natif. 89 BQ migrees vers `jmj/bq/<slug>.md` (80 actives + 9 archivees dans `_archive/`). 303 liens N-N fusionnes dans frontmatter (`domaine_primaire` + `domaines_reference[]`). Tables `bq_entries`, `domaines_techniques`, `domaine_bq` droppees. Module `tools/lib/bq_inventory.py` remplace les 11 SELECT consommateurs.\n- **2026-05-26** : deplacement `jmj/bq/` → `tools/bq/` (rapprochement de la doctrine et du code ; `jmj/` reste l'espace des donnees de travail/sorties). Seul `BQ_ROOT` dans `bq_inventory.py` change.\n\n### Scripts consommateurs\n\n- `tools/admin/bq_query.py` v3.0 (API CLI principale, lit FS via `bq_inventory`)\n- `tools/admin/audit_opus.py` (audit doctrine globale)\n- `tools/admin/explorer.py` (Flask UI dev)\n- `tools/admin/session_start.py` (compte BQ au demarrage)\n- `tools/docs/gen_bq_page.py` (genere `Publications/web/bq.html`)\n- `tools/docs/gen_dashboard.py` (stats + BQ critiques)\n- `tools/docs/gen_explorer.py` (explorer doc)\n- `tools/docs/gen_readme.py` (section BQ README)\n- `tools/docs/gen_web.py` (section BQ technique)\n- `tools/docs/gen_workflows.py` (filtre par type pour pages workflows)\n\nConcept cards (`tools/admin/bq_query.py --cards`) restent en DB\n(table `concept_cards` + dimensions, hors scope Session D).\n", "type": "reference", "crit": false}]}, "integrite": {"nom": "Intégrité DB", "entries": [{"id": 74, "titre": "Audit d'intégrité DB — sanity check technique", "contenu": "## Audit d'intégrité DB — sanity check technique\n\nAudit **technique** du schéma : FK orphelines, doublons sur clés normalisées, désynchronisations entre tables, scripts vs DB. Distinct des audits sémantiques (BQ `audit_thesaurus` et `audit_corpus`) qui éprouvent le contenu éditorial. Cet audit est une **routine rapide**, sans agent, à passer après chaque migration ou avant une consolidation majeure.\n\n### Périmètre\n\n| Axe | Scope |\n|---|---|\n| FK orphelines | `term_relations.to_term_id`, `chain_etapes.term_id`, `concept_cards.dimension_id`, `source_usages.source_id`, `pedago_links.card_id`, `card_chain_links.card_id`, `card_chain_links.chain_id` |\n| Doublons clés normalisées | `terms.fr` lower(), `concept_cards.title` lower(), `fiches.slug`, `jenni_sources.doi` lower() |\n| Désynchronisations cache | `chain_etapes.term_fr_text` ≠ `terms.fr`, `fiche_contenus.refs` ≠ `source_usages` |\n| Sections sans titre / titre dupliqué | `prompts.titre_h2`, `fiche_sections.titre` |\n| Documents inactifs cités | `concept_cards.docs_codes` JSON-each vs `documents.code` |\n| Audit log gaps | période > 24 h sans entrée, ou opérations sensibles non loggées |\n\n### Requêtes canoniques\n\n```sql\n-- 1. FK orphelines termes (relations vers term_id inexistant)\nSELECT tr.id, tr.from_term_id, tr.rel_type, tr.to_term_id, tr.to_term_text\nFROM term_relations tr\nLEFT JOIN terms t ON t.id = tr.to_term_id\nWHERE tr.to_term_id IS NOT NULL AND t.id IS NULL;\n\n-- 2. FK orphelines chaînes\nSELECT chain_id, position, term_fr_text FROM chain_etapes\nLEFT JOIN terms t ON t.id = chain_etapes.term_id\nWHERE chain_etapes.term_id IS NOT NULL AND t.id IS NULL;\n\n-- 3. Doublons termes par fr lower()\nSELECT lower(fr) k, count(*) n, group_concat(id) ids\nFROM terms GROUP BY k HAVING n > 1;\n\n-- 4. Désynchronisation chain_etapes.term_fr_text ↔ terms.fr\nSELECT ce.chain_id, ce.position, ce.term_fr_text, t.fr\nFROM chain_etapes ce JOIN terms t ON t.id=ce.term_id\nWHERE ce.term_fr_text IS NOT NULL AND ce.term_fr_text != t.fr;\n\n-- 5. Désynchronisation fiche_contenus.refs ↔ source_usages\n-- (compter refs JSON vs count source_usages par fiche)\nSELECT fc.fiche_id,\n       (SELECT count(*) FROM source_usages WHERE entity_type='fiche' AND entity_id=fc.fiche_id) n_usages,\n       (CASE WHEN fc.refs IS NULL THEN 0 ELSE json_array_length(fc.refs) END) n_refs_cache\nFROM fiche_contenus fc\nWHERE n_usages != n_refs_cache;\n\n-- 6. Cards orphelines (sans dimension)\nSELECT id, title FROM concept_cards\nWHERE dimension_id IS NOT NULL\n  AND dimension_id NOT IN (SELECT id FROM concept_dimensions);\n\n-- 7. docs_codes JSON-each cassé\nSELECT cc.id, cc.title, value AS doc_code\nFROM concept_cards cc, json_each(cc.docs_codes)\nLEFT JOIN documents d ON d.code = value\nWHERE d.code IS NULL;\n\n-- 8. Sources sans DOI ni URL (passe rapide — cf. audit_sources_orphelines.py pour rapport complet)\nSELECT count(*) FROM jenni_sources WHERE (doi IS NULL OR doi='') AND (url IS NULL OR url='');\n```\n\n### Script unifié\n\n`tools/admin/check_integrity.py` exécute la majorité de ces vérifications avec sortie structurée (markdown ou JSON). Mode `--strict` arrête au premier check rouge. À lancer **toutes les 3-5 sessions** ou avant toute migration de schéma.\n\n> **Couverture FK `term_relations`** (depuis 2026-06-07) : le script vérifie les **deux** sens — `from_term_id` ET `to_term_id` (requête canonique #1). Le check `to_term_id` (FK pendante après suppression d'un terme cible, le `ON DELETE CASCADE` ne couvrant que `from_term_id` et `foreign_keys=0` au runtime) avait été un **angle mort** jusque-là. Distinguer des orphelins **légitimes** `to_term_id IS NULL` (cf. `refactor_term_relations`).\n\n### Pièges méthodologiques (acquis 2026-06-07)\n\n- **`foreign_key_check` noyé par une FK fantôme** : une FK déclarée vers une table **droppée** (`terms.section_key → sections`) fait remonter *tous* les enfants comme « violations » (3732), masquant les vraies. Décompter par table parent (`PRAGMA foreign_key_check` → grouper) ; retirer la FK obsolète par recréation de table (`legacy_alter_table=ON` pour préserver les vues pendant le `RENAME`).\n- **Désync `fiche_contenus.refs ↔ source_usages` (requête #5) massivement surestimée par le `count` brut** :\n  1. `source_usages` compte les **occurrences** de citation, `refs` les **sources uniques** → déduplication par `source_id` obligatoire.\n  2. Une ref **présente dans le cache mais sans le champ `id`** (source créée à l'étape 5 d'intégration) est comptée à tort comme « hors cache » alors qu'elle **s'affiche correctement** (`gen_cahier` lit `auteurs/année/titre`, pas `id`). Comparer par **DOI + signature (surname, année)**, pas par `id`. En 2026-06, sur 1060 « hors cache » bruts : **91 % étaient des refs sans `id`** (faux positif), vrai cas = 89.\n- **Faire confiance à un `id` de cache sans le vérifier vivant crée des orphelins** : `relink_fiche_refs.py` matérialisait des `source_usages` vers des sources mortes après un dedup `jenni_sources`. **Durci 2026-06-07** (vérifie `live_ids`, re-route/retire). Réflexe général : lancer `check_integrity` après tout relink/dedup.\n\n### Cadence et déclencheurs\n\n- **Cadence régulière** : `check_integrity` toutes les 3-5 sessions\n- **Déclencheurs immédiats** :\n  - Après migration schéma (`ALTER TABLE`, ajout/modif colonne)\n  - Après import massif (lot Jenni, refs Crossref, etc.)\n  - Après suppression d'un terme / d'une card / d'une chaîne (cascade FK)\n  - Avant `regen_all.py` (génère HTML public depuis DB — cohérence critique)\n- **Audit log gaps** : check trimestriel — détecter une opération sensible (DROP, DELETE en masse) non loggée\n\n### Articulation avec les autres audits\n\n| Audit | Couvre | Distinct de #74 |\n|---|---|---|\n| BQ `audit_thesaurus` | Sémantique du thésaurus (termes, relations, doublons éditoriaux, méta-vocab) | #74 ne juge que les FK et les doublons sur clé normalisée |\n| BQ `audit_corpus` | Sémantique du corpus (chaînes, cards, fiches, articulations) | #74 ne juge que les FK et les désync cache |\n| BQ `wf_fiche_integration` (#147) | Mini-audit phase 4bis post-intégration | Spécifique à une fiche, pas un audit global |\n\n### Historique d'incidents traités\n\n- 36 doublons termes corrigés (session 03/04 2026)\n- 77 orphelines `term_relations` (session 31/03 2026)\n- 2 FK fantômes `cascade_prerequis` (session 31/03 2026)\n- 13 préfixes `[XX]` parasites dans `chain_etapes.role_dans_chaine` (audit #34)\n- 14 termes Claude-rédigés supprimés (commit af35413 - session 2026-04-20)\n- 2 termes pseudoscience (#160, #214) + 11 relations supprimées (session 2026-04-23)\n- **2026-06-07** : FK fantôme `terms.section_key → sections` retirée (recréation de table, `foreign_key_check` 3741→0) ; 9 relations `to_term_id` pendantes supprimées (#1604/#386/#2319 termes supprimés) + check `to_term_id` ajouté à `check_integrity` ; 10 `chain_etapes.term_fr_text` resync ; T4 cache refs : `relink` (718 id + 257 usages, cas1→0), 25 ids de sources mortes (dedup) re-routés + 28 usages orphelins nettoyés, 32 faux appariements supprimés (surnames à tiret unicode mal liés). Bugs de fond : (1) `relink` ne vérifiait pas les id morts → **CORRIGÉ 2026-06-07** (vérifie `live_ids`, re-route vers survivant ou retire) ; (2) dedup `jenni_sources` ne nettoie pas `fiche_contenus.refs` → mitigé par relink durci (filet), cause racine à corriger ; (3) matching tiret unicode (U+2010..U+2014) → **CORRIGÉ** (normalisation ajoutée dans `relink._normalize`, `integrate_fiche.normalize`, `integrate_fiche_refs._surname`) ; (4) divergence cache (étape 4) / `source_usages` (étape 5) du pipeline fiche → **à investiguer** (cas #84, docx outlier 443k).\n\n### Voir aussi\n\n- BQ `audit_thesaurus` (#155) — sémantique thésaurus\n- BQ `audit_corpus` (#156) — sémantique corpus\n- BQ `audit_log` (#56) — utilisation de la table audit_log\n- BQ `maintenance_thesaurus` (#53) — opérations CRUD termes\n- `tools/admin/check_integrity.py` — script unifié\n", "type": "workflow", "crit": false}, {"id": 56, "titre": "audit_log", "contenu": "Voir les dernières opérations :\nSELECT ts, operation, table_name, record_ref, substr(detail, 1, 100) FROM audit_log ORDER BY ts DESC LIMIT 20;\n\nLogger une opération :\nINSERT INTO audit_log (operation, table_name, record_ref, detail) VALUES ('UPDATE', 'terms', 'strate S', 'description...');\n", "type": "commande", "crit": false}, {"id": "cross_refs_dette", "titre": "Cross-refs et flux : tables droppées, audit dérivé à créer", "contenu": "# Cross-refs et flux — Décision architecturale 2026-05-06\n\n## Constat (Session F+1)\n\nLes tables `doc_cross_refs` (118 lignes) et `term_connections` (81 lignes) étaient\ndes **artefacts d'audits Opus de mars 2026** stockés sous forme de chaînes\ndescriptives sans FK propres :\n\n```sql\ndoc_cross_refs : doc_source(text), doc_cible(text), pour_concept(text), justification(text)\nterm_connections : strate_source(text), terme_source(text), connexion(text), importance(text)\n```\n\nPas de FK vers `documents.code` ni vers `terms.id` — juste du texte qui décrit\nune relation. Si on renomme un doc/terme, les refs deviennent silencieusement\nobsolètes.\n\n**Pire** : le contenu sémantique de ces 199 lignes appartient en réalité à\n4 destinations naturelles déjà présentes en DB :\n\n| Type observé | Destination naturelle |\n|---|---|\n| Mécanisme causal multi-docs | `chains_causales` + `chain_etapes` |\n| Concept transverse partagé | `concept_cards` avec `docs_codes` étendu |\n| \"Doc X devrait mentionner ce que dit doc Y\" | `prompts.enrichissement` du doc cible |\n| Doublon déjà capturé ailleurs | suppression |\n\nCes 2 tables **dupliquaient** des relations qui existent déjà sous forme\nrelationnelle propre dans le corpus.\n\n## Décision\n\n**Drop des 2 tables** + **snapshot historique** dans\n`jmj/rapports/audit/cross_refs_snapshot_2026-03-20.md` (199 lignes lisibles\nen markdown, conservées pour audit).\n\n**Tabs Cross-refs et Flux retirés** du `Publications/web/index.html` (template\nid=9 patché : -8865 chars, fonctions `CrossRefsTab()` et `ConnectionsTab()` supprimées).\n\n## Successeur : `tools/admin/audit_corpus_relations.py` ✅ CRÉÉ 2026-05-06\n\nL'objectif n'est pas de recréer une table d'annotations mais de **dériver\ndynamiquement** les lacunes et émergences depuis les relations primaires\ndu corpus.\n\n### Inputs (relations primaires)\n\n- `terms.doc_code` : terme rattaché à un doc (ou multi-doc via `/`)\n- `term_relations` : BT/NT/RT entre termes\n- `prompts.enrichissement` : notes éditoriales pour Jenni\n- `concept_cards.docs_codes` : carte qui s'applique à plusieurs docs\n- `concept_card_links` : liens carte ↔ carte\n- `chains_causales` + `chain_etapes` : flux causal docs → docs\n- `pedago_links` : liens carte ↔ doc\n- `fiche_sections.contenu` : contenu intégré (texte des fiches v4)\n\n### Calculs\n\n- **Co-occurrences** : termes mentionnés dans ≥N docs sans concept_card\n- **Mécanismes implicites** : motifs apparaissant dans plusieurs sections sans chain\n- **Convergences** : sources citées par plusieurs fiches sans concept_card\n- **Strates traversées** : chain_etapes inter-strates avec/sans bidirectionnalité\n\n### Sortie\n\n- `jmj/rapports/audit/lacunes_emergences_<date>.md` avec 2 sections :\n  - **Lacunes** : relation attendue non matérialisée → propose chain/card/enrichissement\n  - **Émergences** : cluster/pattern spontané → propose nouveau concept à creuser\n\n### Workflow\n\n1. Le script tourne périodiquement (mensuel ?)\n2. JMJ lit le rapport\n3. Pour chaque lacune/émergence intéressante : intégration au cas par cas\n   via le workflow normal (chain / card / enrichissement / fiche / validation)\n\n### Différence vs anciennes tables\n\n- **Ancien** : table figée, mise à jour manuelle (jamais), pas de FK\n- **Nouveau** : vue calculée, source = relations primaires, FK implicites\n- **Régénération** : à la demande, snapshot daté dans `jmj/rapports/audit/`\n\n## Lien avec le workflow notes volantes (BQ #102)\n\nL'audit corpus_relations est complémentaire au workflow d'intégration des\nnotes volantes (`jmj/notes*.txt`) :\n\n- Notes volantes → captures externes du corpus → intégration via concept_card / fiche\n- Audit corpus_relations → captures **internes** du corpus → matérialisation des\n  relations implicites en chain / card / enrichissement\n\nLes deux pipelines convergent vers le même objectif : **enrichir le corpus\nen explicitant ses relations**.\n\n## Dette pour Session H (à venir)\n\nCréer `tools/admin/audit_corpus_relations.py` :\n- Phase 1 : extraction features (terms, sources, concepts par doc)\n- Phase 2 : calcul co-occurrences et clusters\n- Phase 3 : confrontation avec relations existantes\n- Phase 4 : output markdown lacunes/émergences\n\nEstimation : ~2-3h dev + premier run avec validation manuelle JMJ.\n\n## Dette résolue Session H ✅ 2026-05-06\n\nScript `tools/admin/a
