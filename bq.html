API (source unique)\n", "type": "regle", "crit": false}, {"id": 129, "titre": "Intégration source — rapport biblio JMJ ET import batch termes thésaurus (import_termes)", "contenu": "## Workflow intégration de source — opération consciente\n\n> **Quand consulter cette BQ** — toute **demande d'intégration** d'un retour\n> externe dans le corpus :\n> - **(a) rapport bibliographique** JMJ (article, PDF, métadonnées) → table\n>   `sources` : sections ci-dessous.\n> - **(b) docx Jenni de termes** (`TERME/EN/DEF/SYN_FR/SYN_EN/BT/RT`) →\n>   `tools/integration/import_termes.py` : section **« Variante — import batch\n>   de termes thésaurus »** en bas de cette BQ (frictions de production à\n>   anticiper). Réimport : voir aussi BQ `thesaurus_workflow`.\n>\n> Mots-clés de déclenchement : *intégration source, import termes, retour Jenni\n> thésaurus, import_termes, dédoublonnage, mapping strate*.\n\n### Principe\n\nJMJ fournit un **rapport de source** (métadonnées d'un article scientifique, souvent copié-collé depuis un PDF reader, Semantic Scholar, PubMed, un groupe de veille…). L'agent intègre cette source **une à la fois**, avec le même soin que l'intégration d'une fiche. Cette opération enrichit la biblio interne (`sources`) et **peut renforcer le thésaurus** si des termes canoniques manquent.\n\n**Règle d'or** : jamais de batch-insert. Chaque source est une pièce du corpus, elle mérite une lecture attentive.\n\n### Entrée — ce que JMJ donne\n\nUn bloc brut comme :\n\n```\nTitre de l'article\nType de document : Article de revue\nAuteur : A. Untel / B. Untel ...\nRésumé : [abstract complet]\nDate : YYYY/MM/DD\nDOI : 10.XXXX/...\nURL : https://...\nPublication : Nom du journal\nVolume, Pages, Numéro, ISSN\n```\n\nFormat variable (export RIS, Semantic Scholar copy, PubMed metadata, groupe email…). L'agent **normalise mentalement** avant d'écrire.\n\n### Séquence (l'agent pilote, JMJ valide)\n\n**1. Lecture consciente**\n- Lire le titre + résumé intégralement\n- Identifier le **thème principal** (ex : bone char contamination arsenic / riziculture)\n- Identifier les **concepts clés** candidats à enrichir le thésaurus (ex : `bone char`, `arsenic speciation`, `arsenic methylation`, `arsC/arsM genes`)\n- Identifier les **documents / fiches / cards** du corpus potentiellement concernés\n\n**2. Dedup**\n```python\ncur.execute(\"SELECT id, doi, titre_complet FROM sources WHERE doi = ? OR titre_complet LIKE ?\",\n            (doi, f'%{titre_court}%'))\n```\n- Si déjà présent → proposer un UPDATE (enrichissement) plutôt qu'un nouvel INSERT\n- Si nouveau → continuer\n\n**3. Insertion `sources`** (champs critiques)\n- `doi` (normalisé sans préfixe)\n- `auteurs` (format : `Nom1 P, Nom2 Q, Nom3 R, et al.`)\n- `annee` (INTEGER)\n- `titre_complet` (exact, pas tronqué)\n- `titre_court` (extrait-clé en 4-8 mots, lisible)\n- `journal`\n- `resume_court` (150-300 mots, reformulation synthétique — pas l'abstract brut)\n- `pertinence` (ex : `S2 microbiome + P2 conservation` ou `H3 AMR`)\n- `tags` (JSON list : mots-clés thématiques du corpus)\n- `url` (lien DOI ou URL article)\n\n**4. Liens `source_usages`** (si pertinent)\nSi la source cite/justifie directement un contenu du corpus, ajouter un lien :\n```python\nINSERT INTO source_usages (source_id, entity_type, entity_id, contexte, citation_brute)\nVALUES (?, 'fiche', ?, 'Section Contexte scientifique', '(Hao et al., 2026)')\n```\n`entity_type` ∈ `{doc, fiche, term, card, prompt}`.\n\n**5. Renforcement thésaurus** (si termes nouveaux)\nSi l'article introduit des termes canoniques absents du thésaurus :\n- Vérifier `SELECT id FROM terms WHERE fr=? OR en=?`\n- Si absent : **proposer** à JMJ un ajout (titre, def depuis résumé, syn_fr/en, bt, rt)\n- JMJ valide → insert dans `terms` avec `doc_code='S'` ou autre\n- **Ne jamais** inventer des définitions sans base article\n\n**6. Audit log**\n```python\nINSERT INTO audit_log (operation, table_name, record_ref, detail)\nVALUES ('INSERT', 'sources', f'source #{src_id}',\n        f'{auteurs_court} {annee} {journal} — {theme_en_une_ligne} ({doc_codes_cibles})')\n```\n\n### Exemple d'intégration (modèle)\n\n**Entrée** (rapport JMJ) :\n```\nMicro-nanoscale bone char modulates rhizosphere As-cycling genes…\nAuteur : Yi Hao, Weitao Wu, … Chuanxin Ma\nDOI : 10.1007/s44246-026-00258-4\nPublication : Carbon Research\n```\n\n**Traitement l'agent** :\n- Thème : bone char amendement / arsenic speciation / rice paddy\n- Corpus concerné : `S1 architecture sol` (amendement), `S2 microbiome` (arsC/arsM genes), `P1 diagnostic` (contamination), `P2 conservation`\n- Nouveaux termes potentiels (à valider) : `bone char`, `arsenic speciation`, `arsenic methylation gene (arsM)`\n- Source déjà en DB ? → SELECT par DOI → non\n- `resume_court` synthétise : « MNBC 25 g/kg sur sol contaminé 75 mg/kg As : urease +94-166%, catalase +35-519%, carbone organique +9-30%, arsC/arsR −6-52%, arsM +11-20%. Amélioration de la santé du sol sans changer l'accumulation As dans le riz. »\n- `pertinence` : `S1/S2/P1 amendement bone char contamination arsenic`\n- `tags` : `[\"bone char\", \"arsenic\", \"paddy soil\", \"arsC arsM\", \"soil remediation\"]`\n\n**Sortie** (l'agent rend compte à JMJ) :\n- Source #XXXX insérée\n- 0 ou N termes candidats identifiés (liste)\n- 0 ou N liens source_usages créés\n\n### Ce qui n'est **pas** ce workflow\n\n- Import batch biblio → archivé (modules retirés)\n- Enrichissement auto depuis PubMed/E-utilities → utile comme outil annexe, mais la décision d'intégration reste manuelle\n- Ajouter des refs dans le cache refs des fiches → ça c'est le job de Jenni à la rédaction, pas de l'agent à la veille (depuis 2026-07-05, le cache est la vue `v_fiche_refs` régénérée depuis `source_usages` + `sources`). *(Exception : la régénération biblio post-intégration d'une fiche PARTIEL — cf. BQ `wf_fiche_regen_biblio` — est un chantier dédié où l'agent crée les sources identifiées par audit d'orphelins, source par source.)*\n\n### Script dédié — `tools/integration/integrate_source.py`\n\nLe script dédié **existe** et implémente cette doctrine (parse → dedup strict DOI + auteurs+année+titre → classification docs/fiches/cards → `source_usages` → extraction des termes candidats, non auto-intégrés). La **lecture consciente** reste en session.\n\n```bash\n# Dry-run : parse + dedup + classification proposée\npython3 tools/integration/integrate_source.py --db sol_vivant.db --file <rapport.txt>\n# Intégration effective + liaisons source_usages\npython3 tools/integration/integrate_source.py --db sol_vivant.db --file <rapport.txt> --apply --link\n```\n\nOptions : `--apply` (écrit, sinon dry-run), `--step parse|dedup|classify|terms|gate|apply` (isole une étape), `--stdin` (coller le rapport). L'INSERT `sources` reste le fond de l'opération mais passe par le script — plus d'insertion manuelle à la main.\n\n## Variante — import batch de termes thésaurus (`import_termes.py`)\n\nQuand JMJ fournit un **docx Jenni de termes** (format\n`TERME/EN/DEF/SYN_FR/SYN_EN/BT/RT`, retour d'une liste envoyée via le workflow\nthésaurus), l'intégration passe par `tools/integration/import_termes.py` — **pas**\npar l'insertion `sources` ci-dessus. Doctrine de réimport : BQ thésaurus\n#116. Les frictions ci-dessous ont été constatées **en production** (passe de\n100 termes, 2026-05-29 : 92 inserts / 8 doublons) et doivent être anticipées.\n\n### Séquence\n\n1. **Backup DB** avant toute mutation. ⚠ `session_start.py` ne dépose pas\n   toujours un backup visible dans `backups/` → copier `sol_vivant.db` à la main\n   au besoin.\n2. **Dry-run** : `import_termes.py --db … --docx <docx> --strate S`\n   (placeholder) → lire le rapport « À INSÉRER / À UPDATER / BLOQUÉS ».\n3. **Mapping multi-strates** : Jenni ne fournit **aucune strate** (elle ignore\n   l'organisation du corpus — règle absolue), donc le docx de retour n'en porte\n   pas. L'assignation strate/doc_code est **l'arbitrage de l'agent**. Un docx\n   hétérogène **exige** un `--mapping CSV`\n   (`terme, strate_proposee, doc_code_propose, mode_force`) ; le `--strate`\n   unique ne vaut que pour un docx mono-strate. La **lettre de strate seule**\n   (F/S/V/P/H) est cohérente avec ~40 % des termes existants — pas de fausse\n   précision sur les sous-niveaux, JMJ raffine au besoin (BQ `doc_definition`).\n4. **Apply** : ajouter `--apply`. `--rels-mode merge` (défaut) préserve les\n   relations existantes ; ne **jamais** `replace` sans `--allow-rels-destruction`.\n5. **Vérif post-import** : inspecter les flags « doublons croisés », backfiller\n   les chaînes/cards en attente de ces termes (ex. C30), puis `regen_all.py` +\n   `check_integrity.py`.\n6. **Orphelins BT/RT du lot → fichier unique** (OBLIGATOIRE) — les orphelins BT/RT\n   du lot (cibles non résolues) sont de **vrais candidats nouveaux termes** :\n   `build_fr_index` couvre déjà fr/en/syn_fr/syn_en, donc un orphelin\n   (`to_term_id` NULL) n'a matché **aucun** libellé ni synonyme. Ils sont ajoutés\n   **consciemment** au fichier unique `recherches/thesaurus/termes_a_definir.txt`\n   (cf. thesaurus_workflow §0 « Vie du fichier »), dédupliqués contre `terms` ET\n   contre le fichier, tri alpha (#115), **artefacts filtrés à la main** (coquilles,\n   placeholders `[…]`, notation `¹⁵N`, acronymes nus). `export_thesaurus_incomplets\n   --single-txt` les conserve et y ajoute les DB-incomplets au run suivant.\n   Reproductible a posteriori : re-parser le docx du lot et résoudre ses BT/RT\n   contre les `terms` courants (les non-résolus = candidats). ⚠ Ne **pas** verser\n   le backlog historique global (`… WHERE to_term_id IS NULL` sur toute la table) :\n   des milliers de labels prose-dérivés pollués — dette séparée, pas la matière d'un\n   cycle. Ne verser que **les orphelins du lot en cours** (propres, issus des champs\n   BT/RT structurés).\n\n### Frictions à anticiper (checklist production)\n\n- **Doublons amont (8 % en prod)** — des termes de la liste candidate existent\n  déjà sous un **libellé FR canonique différent** (landrace = « Variété locale »,\n  « microzone anoxique » = « microsites anoxiques », bio-augmentation =\n  « Bioaugmentation », carbon farming = « Agriculture du carbone »…) ou en\n  collision `syn_en` (r/K-stratège ≈ Copiotrophes/Oligotrophes). → Passer la\n  liste candidate au **contrôle anti-doublon 4 axes (fr/en croisés) AVANT envoi\n  Jenni** (sinon effort Jenni gaspillé). Les bloqués-sur-match se traitent en\n  `mode_force=skip` dans le mapping — **jamais `--replace`** (écraserait le `fr`\n  canonique, règle #138).\n- **Jenni simplifie les libellés** — elle retire souvent les **parenthétiques**\n  (« Iroko (Milicia excelsa) » → « Iroko » ; « …sols (QBS) » → « …sols »). Le\n  `norm()` du mapping ne matche alors plus le terme → strate « ? » placeholder.\n  → Diffuser le **docx parsé contre la liste envoyée** et aligner les clés du\n  mapping sur la forme **réellement renvoyée** par Jenni.\n- **Collisions `syn_fr ↔ fr` détectées seulement POST-insert** — le contrôle\n  4 axes ne voit pas qu'un `syn_fr` d'un nouveau terme = `fr` canonique d'un\n  terme existant. Le script le signale **après** l'INSERT (« arbitrage JMJ\n  requis »). Inspecter chaque flag : certains sont de **vrais doublons ratés\n  par la dédup amont** (ex. « hydrophobicité du sol » vs « hydrophobie du\n  sol » : `fr` ET `en` diffèrent légèrement → 4 axes aveugle) ; d'autres sont\n  des synonymes trop larges à resserrer (ex. « alley cropping » portait\n  « culture intercalaire », concept distinct #3177).\n- **Relations BT/RT partiellement orphelines** — les broader/related-terms des\n  concepts neufs pointent souvent vers des cibles absentes du thésaurus (en\n  prod : 58 BT + 161 RT orphelins / 92 termes). C'est **normal** ; ne pas\n  chercher à toutes les résoudre à l'import. Elles « entrent avec les passes\n  suivantes » **via l'étape 6** (versement dans le fichier à-définir) — sinon\n  elles restent des relations `to_term_id` NULL jamais requêtées et la dette ne\n  se résorbe pas. Le versement EST le mécanisme de résorption.\n- **`chain_etapes` n'a pas de colonne `updated_at`** — piège de schéma au moment\n  du backfill des `term_id` (les `terms` en ont, pas `chain_etapes`).\n\n### BQ liées\n\n- `wf_fiche` : intégration de fiches (même logique consciente à plus grande échelle)\n- #106 concept_cards : filtre de rigueur — une source introduit souvent une hypothèse qui doit passer par une card avant d'entrer dans le corpus\n\n### Fiabilité des sources : règle « livre/rapport vs Jenni »\n\n**Source primaire validée (livre, rapport institutionnel, publication académique à DOI)** — les valeurs chiffrées sont **fiables par construction** :\n- Smil 2017, Fuller 1938, Jancovici 2015, Nikiforuk 2012 (livres)\n- The Shift Project PREF 2026, Carbone 4 (rapports institutionnels)\n- Arvalis Triple Performance, IPCC, ministère (guides/rapports officiels)\n- JMJ synthèses (docs travail propres, JMJ pilote)\n\n→ **Entrée en `ref_*` directe** sans double-vérification cognitive. Ancrage sur la page/ref de la source. La révision concerne la pertinence (est-ce dans notre scope ?) pas la véracité numérique.\n\n**Sortie Jenni** — les valeurs chiffrées sont **à vérifier systématiquement** :\n- Jenni peut halluciner des nombres plausibles mais faux\n- Jenni peut agglomérer deux valeurs de sources différentes\n- Jenni ne sait pas nuancer les unités (kWh utile vs thermique)\n\n→ **Lecture ligne-à-ligne** avant intégration, rejet de toute valeur non ancrée à une source primaire consultable, préférence à réécrire ou demander régénération plutôt qu'accepter avec doute.\n\n**Workflow pour sources livres PDF (`jmj/pdf/`)** :\n1. Read PDF via outil Read (fonction PDF native, `pages` pour PDF > 10 pages)\n2. Extraction ciblée des tableaux / valeurs chiffrées (pas copier tout le texte)\n3. INSERT dans `ref_*` avec `source_id` → entrée sources\n4. INSERT sources (type='livre' / 'rapport' / 'organisation') si pas déjà présent\n5. Pas de régression cognitive : la valeur en DB devient autoritaire pour la session\n\n### Flag « haute valeur » pour récupération PDF\n\nJMJ maintient un accès au texte intégral via son outil de collecte externe\n(biblio interne + bibliothèques institutionnelles). L'abstract RIS est suffisant\npour une intégration standard, mais certains articles justifient d'aller\nplus loin.\n\n**Flag explicitement « haute valeur — demander PDF »** quand :\n- Apport chiffré unique ou méthodologie inédite dans le corpus\n- Source primaire sur un concept pivot (souvent jamais cité ailleurs)\n- Données quantitatives qui dimensionneraient un calculateur (Kirkby, MO,\n  esclaves, triangle textures, transition robuste)\n- Revue de synthèse couvrant une zone aveugle du corpus\n- Article fondateur qu'on cite partout sans avoir lu\n\n**Ne pas flag** (intégration abstract suffit) quand :\n- Sujet déjà structurellement couvert (fiches + cards existantes)\n- Apport incrémental chiffré mais non-structurant\n- Donnée pays-spécifique qui ne généralise pas\n\nSi le PDF n'est pas disponible mais que la source mérite d'être gardée :\n- INSERT sources normal\n- `notes` : `'PDF indisponible 2026-AA-JJ — intégration abstract seul'`\n- Pas de concept_card détaillée, juste liens usages basiques\n\n## Voir aussi\n\n- `thesaurus_workflow` — workflow complet du thésaurus (cette BQ couvre l'intégration source, dont la variante import thésaurus)\n- Règles de rédaction transversales : `.opencode/RULES.md` + `check_forbidden_jenni.py` + BQ `listes_de_termes_triees_alphabetiquement_regle_abs` (doctrine Jenni d'origine archivée)\n", "type": "workflow", "crit": true}, {"id": 126, "titre": "Trios parallèles *_sections / *_contenus (redondance structurelle connue)", "contenu": "> **⚠ BQ dépréciée 2026-07** : le pattern « 3 trios parallèles » est obsolète.\n> `fiche_sections` (pilier du Trio 1) est droppée (→ `fiche_retour_sections`),\n> et `fiche_contenus` (pilier du Trio 2) est devenu la vue `v_fiche_refs`. Le\n> parallélisme structurel qui motivait cette BQ n'est plus net. Le contenu\n> ci-dessous est conservé comme **référence historique** de l'architecture\n> d'origine et des migrations successives. Pour l'état courant des tables,\n> voir `architecture_db_tables_vues_colonnes_cles`.\n\n## Trios parallèles `*_sections` / `*_contenus` (DB pattern connu — déprécié)\n\n**Constat de maintenance 2026-04-14** (historique) : 6 tables dupliquent le schéma\nentre 3 types de production (fiches / docs de strate / validations). Ce pattern\nest **obsolète depuis 2026-07** (cf. bandeau ci-dessus).\n\n### Trio 1 — Sections éditoriales\n\n```\nfiche_sections       (3583 rows, 4 scripts) — fiches\nprompts              (192 rows, 24 scripts)  — docs de strate (schéma enrichi)\nvalidation_sections  (86 rows, 1 script)     — validations\n```\n\nColonnes communes : `type`, `ordre`, `titre`, `contexte_sci`, `instructions`,\n`enrichissement`, `tableau`. `prompts` ajoute `titre_h1/h2/h3`, `doc_code`,\n`chapitre`, `section`, `style`, `statut`.\n\n**⚠ Migration 2026-07-03** : `fiche_sections` et `fiche_retour_sections`\nportent désormais la numérotation dans 2 colonnes dédiées `section`\n(INTEGER) et `sous_section` (INTEGER) — le `titre` est nettoyé (texte\néditorial pur, plus de numéro en préfixe). `fiche_retour_sections.niveau`\nest dérivé de `(section, sous_section)` (recalculé, corrige 2743\nincohérences). Helper canonique : `tools/lib/section.py`. `prompts` et\n`validation_sections` ne sont pas concernés (pas de numérotation dans le\ntitre).\n\n### Trio 2 — Retours Jenni (contenus)\n\n```\nv_fiche_refs          (vue, régénère à la volée depuis source_usages + sources)\nprompt_contenus       (12 rows, 2 scripts)  — retours docs\nvalidation_contenus   (17 rows, 0 script)   — orpheline\n```\n\nQuasi identiques (historique) : `version`, `contenu_brut`, `contenu_integre`, `refs`,\n`notes_agent`, `date_import`. `prompt_contenus` avait un champ `contenu`\natypique — désormais `contenu_brut` rempli en parallèle (migration 2026-04-14).\n\n**⚠ Refonte fiche 2026-05/06 → 2026-07** : pour `fiche_contenus` spécifiquement, les colonnes `contenu_integre` et `contenu_brut` ont été **supprimées** (DROP COLUMN 2026-06-08). Le texte intégré vit dans `fiche_retour_sections.contenu` (section par section). Puis la **table entière `fiche_contenus` a été DROPpée le 2026-07-05** et remplacée par la vue `v_fiche_refs` (cache `refs` régénéré à la volée depuis `source_usages` + `sources` ; `notes_agent` droppé sans migration, redondant avec `audit_log`). `doc_contenus` et `validation_contenus` conservent leur blob `contenu_integre`.\n\n### Vues unifiées (historique, retirées 2026-04-20)\n\nDeux vues SQL avaient été créées le 2026-04-14 pour unifier l'accès aux 3 trios :\n`v_content_sections` (UNION ALL fiche_sections + prompts + validation_sections) et\n`v_content_retours` (UNION ALL fiche_contenus + prompt_contenus + validation_contenus, à l'époque où fiche_contenus était physique).\n\nElles ont été **supprimées le 2026-04-20** (cf. audit_log) :\n- aucun consommateur dans `tools/` ou `tests/`\n- `v_content_retours` exposait `contenu_integre` legacy (pour les fiches, le contenu vit désormais dans `fiche_retour_sections.contenu` par section)\n- `v_content_sections` ne connaissait pas les nouveaux champs (`contenu`, `analyse_agent`)\n\nSi un besoin de lecture transversale réapparaît, les vues sont à recréer avec les colonnes post-refonte (incluant `contenu` et `analyse_agent` pour `fiche_sections`).\n\n### Décision physique : pas de migration\n\n**Factorisation physique non appliquée** : risque de casser 24 scripts qui\nassument la structure actuelle, pour un gain modeste (~500 Ko, 6→2 tables).\nLes vues couvrent le besoin de lecture transversale sans toucher au stockage.\n\n**Actions complémentaires possibles** :\n- Archiver `validation_contenus` (0 script, table morte) — cf. BQ `validations_workflow_et_structure_table_dediee` et `validation_contenus_sommeil` (décision maintenance dédiée)\n- Documenter le pattern pour les futures sessions (cette entrée)\n\n### À envisager après maturation complète\n\nUne fois le corpus stabilisé (fiches matures, docs de strate peuplés,\nplus de cycle d'écriture intensif), une migration vers l'architecture\nphysique unifiée serait plus sûre.\n\n### Autres redondances mineures (non critiques)\n\n- `doc_code` / `docs_codes` / `docs_cibles` : 3 formats pour désigner\n  des documents (string / string multi-slash / JSON array)\n- `categorie` / `tags` : conventions variables selon domaine\n- `notes_agent` vs `notes` : 2 conventions d'annotation\n\n### Principe architectural — préparation à l'import, rendu trivial (avril 2026)\n\nLes 3 trios (fiche / doc / validation) partagent une règle :\n\n> **Le nettoyage du texte se fait une fois à l'intégration**, dans la table de retour par section (`fiche_retour_sections.contenu` / `prompt_contenus` / `validation_contenus.contenu_integre`). Le rendu HTML devient du `fetch → afficher`.\n\nCorollaires :\n\n- Un seul parser docx partagé (`tools/lib/parse_jenni_docx.py`) alimente les 3 trios — gère OMML, LaTeX, refs FR→EN, tags Jenni résiduels, découpage par section selon le plan DB.\n- Un seul composant de rendu React (`SvRichContent`) consomme les 3 trios — lit le plan DB + affiche sections et refs. Plus de parser côté JS.\n- Si le format Jenni change → un seul point de maintenance (le parser d'import).\n- Les champs `<entity>_contenus.contenu_integre` (blob markdown) sont **legacy pour doc/validation** (conservés pour l'historique). Pour les fiches, la table `fiche_contenus` entière a été **DROPpée le 2026-07-05** et remplacée par la vue `v_fiche_refs` (cache `refs` régénéré à la volée). Le texte intégré vit dans `fiche_retour_sections.contenu` depuis la refonte 2026-06-08.\n\nCette règle remplace la doctrine précédente qui acceptait du markdown brut en DB et laissait `SvRichText` faire un parsing tolérant côté client.\n\n### ⚠ Etat actuel (avril 2026)\n\n`validation_sections` et `validation_contenus` existent en DB avec des donnees historiques (86 et 17 rows respectivement) mais **aucun script actif ne les alimente**. La logique des validations est en pause (cf. BQ `validations_workflow_et_structure_table_dediee`). Les BQ qui decrivent leur workflow sont conservees comme reference, mais la logique des validations est en pause (cf. BQ `validations_workflow_et_structure_table_dediee`) : `import_validation.py` a été supprimé, `export_validation.py` existe mais n'alimente plus les tables.\n\n*(Détails `validation_contenus` — 16 rows, FK CASCADE → `validations`, conservation en attendant clarification workflow — absorbés depuis `validation_contenus_sommeil` 2026-07.)*\n", "type": "reference", "crit": false}, {"id": 134, "titre": "Structure jmj/ et config.paths — rapports et audits centralises", "contenu": "## Structure jmj/ et config.paths\n\n### Vue d'ensemble\n\nTous les **rapports** et **audits** sont centralises dans `jmj/`. Les paths\nsont en base (`config.paths.*`) et les scripts les lisent via\n`lib.config.get_path()`. Pas de path hardcode.\n\n```\njmj/\n├── rapports/            ← TOUS les rapports/audits centralisés (depuis 2026-06-30)\n│   ├── session/         ← cloture session agent Code (date YYYY-MM-DD.md)\n│   ├── audit/           ← rapports audit textuels (fiches, thesaurus, BQ, sources)\n│   ├── audit_data/      ← JSON audits structurés + MD historiques (audit_reports/json/ migré)\n│   │   └── json/        ← rapports JSON + symlinks _latest\n│   ├── audit_runs/      ← responses agents LLM versionnées (analyse_corpus, conseil_emergences…)\n│   ├── analyses/        ← analyses historiques (jmj/analyses/ migré)\n│   │   └── reports/     ← 135+ fichiers analyses legacy (gen_reports.py retiré)\n│   ├── synthese/        ← synthèses transverses\n│   └── veille/          ← rapports de veille\n├── archives/            ← docx sources archives\n├── docx/                ← docx sources JMJ (drafts, propositions Jenni)\n├── journaux/            ← journaux de seances\n├── pdf/                 ← biblio PDF externe (Shift, Triple Perf, etc.)\n├── revues/              ← revues JMJ\n├── session/             ← contexte session\n├── transcriptions/      ← transcriptions audio\n└── notes*.txt           ← notes volantes a la racine\n```\n\n### Table config — categorie `paths`\n\nPaths disponibles via `lib.config.get_path(conn, 'CLE')` :\n\n| Cle | Valeur | Usage |\n|---|---|---|\n| `rapports_session` | `jmj/rapports/session` | Sortie rapport fin de session |\n| `rapports_audit` | `jmj/rapports/audit` | Sorties audits textuelles (scripts audit_*.py) |\n| `audit_data` | `jmj/rapports/audit_data` | JSON audits structurés (depuis 2026-06-30, ex-`audit_reports/`) |\n| `audit_runs` | `jmj/rapports/audit_runs` | Responses agents LLM versionnées (depuis 2026-06-30, ex-`audit_runs/`) |\n| `analyses_reports` | `jmj/rapports/analyses/reports` | Legacy — producteur `gen_reports.py` retiré |\n| `recherches_fiches` | `recherches/fiches` | Docx Jenni fiches (cycle) |\n| `recherches_thesaurus` | `recherches/thesaurus` | Exports thesaurus + audits semantiques |\n| `recherches_veille` | `recherches/veille` | Veille hebdo (PubMed) |\n| `recherches_archives` | `recherches/archives` | Archives fiches/thesaurus |\n| `jmj_docx` | `jmj/docx` | Docx sources JMJ |\n| `jmj_archives` | `jmj/archives` | Archives docx sources |\n| `jmj_pdf` | `jmj/pdf` | PDF biblio externe JMJ |\n| `jmj_notes` | `jmj` | Racine pour notes*.txt |\n| `publications_web` | `Publications/web` | Pages HTML publiees |\n| `publications_workflows` | `Publications/workflows` | Workflows horodates |\n| `docx_en_cours` | `docx` | Docx en cours (envoyes Jenni) |\n| `docx_archives` | `docx/archives` | Docx retournes + integres |\n\n### Regles\n\n1. **Pas de path hardcode** dans les scripts. Utiliser `get_path()`.\n2. **Defaults** : chaque `get_path()` doit avoir un fallback au cas ou la\n   config serait absente (ex: `get_path(conn, 'rapports_audit', 'jmj/rapports/audit')`).\n3. **Creation automatique** : `get_path(..., ensure_exists=True)` cree le\n   dossier si besoin. A utiliser pour les sorties qui peuvent tomber sur\n   un path non encore cree.\n4. **Distinguer rapports vs recherches** :\n   - `rapports/` = artefacts peripheriques, memoire de sessions, non\n     consommes par les scripts (lecture humaine JMJ)\n   - `recherches/` = cycle Jenni actif, consommes/produits par les scripts\n     d'import/export fiches, thesaurus, etc.\n5. **Distinguer jmj/ vs racine** : `jmj/` = JMJ personnel + memoire ;\n   racine (`docx/`, `recherches/`, `Publications/`) = cycle de production\n   actif partage avec Jenni / publications.\n\n### Lien avec les autres BQ\n\n- **#125 structure_recherches** : structure `recherches/` detaillee (cycle\n  Jenni). Ce BQ-ci complete avec la structure `jmj/` centrale.\n- **#128 wf_session** : la cloture de session ecrit dans\n  `config paths.rapports_session`.\n- **#102 traitement_notes** : les notes volantes restent a la racine de\n  `jmj/` (path `jmj_notes`).\n\n### Migration 2026-04-18\n\n- `rapports_sessions/` (racine) → `jmj/rapports/session/`\n- `jmj/SESSION_*.md` → `jmj/rapports/session/`\n- `jmj/audit_fiches_*.md`, `jmj/revue_bq_*.md`, `jmj/plan_integration_*.md`\n  → `jmj/rapports/audit/`\n- `recherches/audits/*` (9 fichiers) → `jmj/rapports/audit/`\n\nLe dossier `recherches/audits/` a ete supprime ; les nouveaux audits\nvont dans `jmj/rapports/audit/`.\n\n### Migration 2026-06-30 — centralisation totale dans `jmj/rapports/`\n\nTous les dossiers de rapports/audits qui vivaient à la racine ou hors\n`jmj/rapports/` ont été centralisés :\n\n- `audit_reports/` (racine) → `jmj/rapports/audit_data/`\n  - `audit_reports/json/` → `jmj/rapports/audit_data/json/`\n  - 21 scripts Python mis à jour (defaults hardcodés → nouveau path)\n  - config.paths : `audit_reports` et `audit_reports_json` supprimés,\n    remplacés par `audit_data`\n- `audit_runs/` (racine) → `jmj/rapports/audit_runs/`\n  - 9 scripts Python mis à jour (WORK_DIR hardcodés → nouveau path)\n  - config.paths.audit_runs ajouté\n- `jmj/analyses/` → `jmj/rapports/analyses/`\n  - 137 fichiers migrés\n  - config.paths.analyses_reports mis à jour\n  - 1 référence nettoyée dans `jmj/rapports/session/session_2026-06-21_*.md`\n\nBénéfices :\n- 1 seul arbre `jmj/rapports/` avec sous-dossiers thématiques clairs\n- Racine du repo allégée (9 dossiers au lieu de 12)\n- Doctrine « tous les rapports dans `jmj/` » enfin respectée\n\n### Phase 2 — Variables d'environnement structurées (2026-06-30)\n\nCentralisation des **secrets API** (l'API d'audit, Zotero — ScholarAI supprimé 2026-07, Semantic Scholar est gratuit sans clé) — auparavant\néparpillés : `os.environ.get` direct dans 7 scripts + fallback fichier\n`.deepseek_key` pour l'API d'audit (supprimé 2026-07-01, `.env` validé en production).\nMécanisme unifié :\n\n- **`lib.config.get_secret(name, required=False)`** — loader centralisé.\n  Charge `.env` à la racine (une fois, sans écraser les exports shell) puis\n  lit `os.environ`. Lève `SecretMissing` si requis et absent.\n- **`.env`** (racine, gitignoré) — convention projet. **`.env.example`**\n  versionné documente les clés + APIs publiques sans auth.\n- **Priorité** : export shell (`~/.bashrc`) > `.env`. Permet l'override\n  personnel JMJ sans toucher au repo.\n- **Scripts migrés** : `audit_factuel_arbitrage`, `audit_factuel_deepseek`, `push_zotero_web`. ⚠ Scripts ScholarAI supprimés 2026-07 : `scholarai_search`, `enrich_scholarai`, `enrich_thesaurus_api`, `audit_factuel_scholarai`, `audit_factuel_pdf`.\n\nAucune clé n'est jamais stockée en DB ni committée. Tests dans\n`tests/test_config.py` (section get_secret).\n\n### Reste — Phase 3\n\nPhase 3 (nettoyage racine) à traiter en session dédiée.\n\n### Phase 3 — Nettoyage racine (2026-06-30)\n\nAllègement de la racine FS après centralisation `jmj/rapports/` (P1) et env vars\nstructurées (P2) :\n\n- **5 `.bak` DB supprimés** (234 MB) : `sol_vivant.db.2026062[2-5].bak` +\n  `sol_vivant.db.pre_optim_20260622.bak`. Redondants vs `backups/` (snapshots\n  datés proprement 2026-06-25→30 + dump `sol_vivant.sql.gz`).\n- **`.directory`** (config KDE Dolphin, gitignoré, auto-régénéré) supprimé.\n- **`PLAN_NETTOYAGE_V1.md`** déménagé vers `jmj/rapports/synthese/` (aligné sur\n  la doctrine « tous les rapports dans `jmj/rapports/` »). Documente le\n  chantier DB séparé (DROP tables/colonnes + 55 scripts vers\n  `_archive_maintenance/`) — non entamé, 7 questions ouvertes pour JMJ.\n- **`package.json` / `package-lock.json` conservés** : audit confirme usage\n  actif (toolchain Babel/React pour les publications web via\n  `tools/lib/compile_jsx.js` + `<script type=\"text/babel\">` dans 5 générateurs).\n\nRestructuration FS (P1→P3) soldée. Racine stabilisée à 9 dossiers + fichiers\ncanoniques (README, MANIFEST, AGENTS, LICENSE, requirements, package, .env.example).\n", "type": "doctrine", "crit": false}, {"id": 143, "titre": "BQ — architecture domaines (filesystem natif depuis 2026-05-06)", "contenu": "## Architecture BQ — filesystem natif (refonte Session D 2026-05-06)\n\nLa BQ est stockee en **filesystem** : un fichier `tools/bq/<slug>.md` par entree\navec frontmatter YAML + body markdown. Le catalogue des 14 domaines techniques\nest dans `tools/bq/_domaines.yaml`.\n\nUne entree BQ a **1 domaine_primaire** (le pipeline ou elle fait loi) et\n**0-5 domaines_reference** (ou elle sert de doctrine transverse).\n\n### Frontmatter standard\n\n```yaml\n---\nslug: bq_architecture_domaines        # = nom de fichier\ntitre: \"BQ — architecture domaines techniques\"\ntype: reference                        # workflow|regle|reference|doctrine|...\nis_critique: false\nis_active: true\nordre: 99\ndomaine_primaire: bq                   # 1 slug exactement\ndomaines_reference: [session, integrite]  # 0-5 slugs\ntags: [architecture, bq, doctrine]\nlegacy_id: 143                         # facultatif, audit migration\ncode_bq: bq_architecture_domaines      # facultatif, ancien systeme\n---\n\n# Body markdown (= ancien contenu_md)\n```\n\n### Catalogue des 14 domaines (`tools/bq/_domaines.yaml`)\n\n```yaml\ndomaines:\n  - slug: thesaurus\n    nom: \"Pipeline thesaurus\"\n    categorie: pipeline\n    ordre: 1\n  # ... 14 entrees\n```\n\n### 4 catégories\n\n- **pipeline** : cycle prompt Jenni → .docx → integration (thesaurus, fiches, docs, validations)\n- **corpus** : contenu en base, edition directe l'agent, pas de cycle Jenni (concept-cards, chaines)\n- **web** : toutes les pages du site\n- **technique** : infrastructure transverse (bq, session, integrite, analyse, archivage, jenni-workflow, sources-autoritaires)\n- **specifique** : chantier one-shot (vide actuellement, conserve pour usage futur)\n\n### Consultation (bq_query.py v3.0)\n\n```bash\n# Inventaire des domaines groupes par categorie\npython3 tools/admin/bq_query.py --list\n\n# Charger un domaine entier (primaires + references)\npython3 tools/admin/bq_query.py --domaine fiches\n\n# Primaires seulement\npython3 tools/admin/bq_query.py --domaine bq --primaire-only\n\n# Entrees critiques d'un domaine\npython3 tools/admin/bq_query.py --domaine web --critical-only\n\n# Recherche full-text (fuzzy NFKD)\npython3 tools/admin/bq_query.py --search \"pseudoscience\"\n\n# Tags transversaux\npython3 tools/admin/bq_query.py --tags workflow,contrainte\npython3 tools/admin/bq_query.py --list-tags\n```\n\n### Ajouter une entree BQ\n\nEditer/creer un fichier `tools/bq/<slug>.md` avec le frontmatter ci-dessus.\nLe slug doit etre unique. Le `domaine_primaire` doit exister dans\n`_domaines.yaml`.\n\n### Référencement entre BQ — slug privilégié, `#N` legacy\n\n- **Référencer une BQ par son `slug`** (ex. « BQ `wf_session` »), pas par son\n  `legacy_id` (`#128`). Le `legacy_id` est un vestige de la migration Session D\n  (anciens ids SQL), conservé pour l'audit de migration — **non** pour le\n  référencement courant.\n- Les BQ post-Session D n'ont **pas de `legacy_id`** (9 entrées) : toute réf `#N`\n  vers elles est irrésolvable. Le slug reste stable et unique.\n- Ambiguïté connue du `#N` : un même nombre peut désigner un `legacy_id` BQ, un\n  id de terme, un id de fiche, un id de card ou un n° de rapport. Le slug lève\n  l'ambiguïté.\n- Pour corriger une réf `#N` existante, vérifier le mapping `legacy_id → slug`\n  via `bq_inventory` (audit 2026-06-25 : `thesaurus_workflow` #116→#129 corrigé).\n\n### Module programmatique\n\n```python\nfrom bq_inventory import (\n    list_entries, search_entries, list_domaines, list_tags, read_entry, write_entry\n)\n\n# Toutes les entrees primaires du domaine 'fiches'\nentries = list_entries(domaine='fiches', primaire_only=True)\n\n# Recherche fuzzy\nmatched = search_entries('pseudoscience')\n\n# Inventaire avec stats\nfor d in list_domaines():\n    print(f\"{d['slug']:20s} {d['n_prim']:3d} primaires, {d['n_ref']:3d} refs\")\n```\n\n### Historique\n\n- **avant 2026-04-20** : `bq_modules` (9 modules) + `bq_entries.module_code` (1 entree = 1 module).\n- **2026-04-20** : refonte vers `domaines_techniques` (14 slugs, 4 categories) + `domaine_bq` (N-N, role primaire|reference). Tables SQL avec index.\n- **2026-05-06 (Session D)** : bascule en filesystem natif. 89 BQ migrees vers `jmj/bq/<slug>.md` (80 actives + 9 archivees dans `_archive/`). 303 liens N-N fusionnes dans frontmatter (`domaine_primaire` + `domaines_reference[]`). Tables `bq_entries`, `domaines_techniques`, `domaine_bq` supprimées. Module `tools/lib/bq_inventory.py` remplace les 11 SELECT consommateurs.\n- **2026-05-26** : deplacement `jmj/bq/` → `tools/bq/` (rapprochement de la doctrine et du code ; `jmj/` reste l'espace des donnees de travail/sorties). Seul `BQ_ROOT` dans `bq_inventory.py` change.\n\n### Scripts consommateurs\n\n- `tools/admin/bq_query.py` v3.0 (API CLI principale, lit FS via `bq_inventory`)\n- `tools/admin/explorer.py` (Flask UI dev)\n- `tools/admin/session_start.py` (compte BQ au demarrage)\n- `tools/docs/gen_bq_page.py` (genere `Publications/web/bq.html`)\n- `tools/docs/gen_dashboard.py` (stats + BQ critiques)\n- `tools/docs/gen_explorer.py` (explorer doc)\n- `tools/docs/gen_readme.py` (section BQ README)\n- `tools/docs/gen_web.py` (section BQ technique)\n- `tools/docs/gen_workflows.py` (filtre par type pour pages workflows)\n\nConcept cards (`tools/admin/bq_query.py --cards`) restent en DB\n(table `concept_cards` + dimensions, hors scope Session D).\n", "type": "reference", "crit": false}]}, "integrite": {"nom": "Intégrité DB", "entries": [{"id": "db_backup_strategy", "titre": "Stratégie backup DB (binaire sorti de git, dump SQL compressé)", "contenu": "## DB binaire sortie de git — dump SQL compressé comme versioning\n\n**Décision JMJ 2026-06-22.** Le binaire `sol_vivant.db` (54 Mo) **n'est plus\nsuivi par git**. Il est remplacé par `backups/sol_vivant.sql.gz` (12 Mo, gain 77%),\ncompressé et à diff lisible.\n\n### Architecture\n\n```\nsol_vivant.db (54 Mo binaire, .gitignore)        ← source de vérité locale\n   ├── backups/sol_vivant.db.YYYY-MM-DD.bak      ← backup quotidien session_start\n   ├── backups/sol_vivant.sql.gz (12 Mo, git)    ← dump SQL compressé pour git\n   └── backup externe (à configurer JMJ)         ← S3/Backblaze/rsync\n```\n\n### Workflow session_end (modifié)\n\n1. WAL checkpoint TRUNCATE (flush WAL dans .db)\n2. **`dump_db_sql.py --db sol_vivant.db`** — génère `backups/sol_vivant.sql.gz`\n3. `git add backups/ ...` (au lieu de `git add sol_vivant.db`)\n\n### Restauration (depuis git clone propre)\n\n```bash\n# 1. Cloner le repo (léger, ~15 Mo au lieu de ~70 Mo)\ngit clone <repo>\n\n# 2. Reconstruire la DB depuis le dump\ngunzip -c backups/sol_vivant.sql.gz | sqlite3 sol_vivant.db\n\n# 3. Vérifier\npython3 tools/admin/session_start.py --db sol_vivant.db\n```\n\nTemps de restauration : ~10 s pour 12 Mo gzippé.\n\n### Pourquoi cette stratégie\n\n- **Binaire vs texte** : git ne fait pas de delta efficace sur les binaires,\n  chaque version complète est stockée (×1.5 à 5 Mo / commit), vs dump SQL qui\n  compresse + diff efficace\n- **Coût GitHub** : 1 commit/jour × 54 Mo = 18 Go/an en binaire, vs 4 Go/an\n  en dump SQL (gain 77%)\n- **Diff lisible** : le dump SQL est texte, git log -p permet de voir les\n  changements réels (ajout d'abstract, modification de fiche, etc.)\n- **Backup externe** : la DB binaire reste sur le disque + backup quotidien\n  `.bak`, le dump SQL est le canal de versioning git\n\n### Script dédié\n\n`tools/admin/dump_db_sql.py` :\n- Output : `backups/sol_vivant.sql.gz` (écrasé à chaque session_end)\n- Compresse gzip level 9\n- `--check` : restore dans DB temporaire et compare row counts (validation)\n- Header avec metadata (date, taille source, etc.)\n\n### Backup externe (rotation 7 jours)\n\n`tools/admin/backup_rotation.py` :\n- Copie dump SQL + backup binaire vers cible externe (rsync)\n- Rotation : supprime > 7 jours\n- Format nom : `sol_vivant_YYYY-MM-DD.{sql.gz,db.bak}` — date dans le nom\n\nUsage :\n```bash\n# Manuel\npython3 tools/admin/backup_rotation.py --target /mnt/backups/sol_vivant\n\n# Cron quotidien (4h du matin)\n0 4 * * * cd /home/jmj/glm/GLM_depot && python3 tools/admin/backup_rotation.py --target /mnt/backups/sol_vivant >> tmp/logs/backup.log 2>&1\n```\n\nVolumétrie : ~50 Mo/jour × 7 = 350 Mo max (dump SQL 12 Mo + binaire 38 Mo).\nOptions : `--retention 14` (2 semaines), `--dry-run` (simulation).\n\n### Note sur l'historique .git existant\n\nLes 11 anciens commits qui touchaient `sol_vivant.db` restent dans le `.git`\navec leur version binaire complète (~550 Mo cumulés). Pour purger, il faudrait\n`git filter-repo` (réécriture de l'historique, change tous les hashes). Pas\ncritique tant que le repo reste clonable.\n\n### Anti-patterns\n\n- **Pas de commit direct de `sol_vivant.db`** — il est dans .gitignore, doit\n  rester exclu. Si `git add sol_vivant.db` échoue silencieusement, vérifier le\n  .gitignore.\n- **Pas de restauration sans vérifier** — toujours `--check` après dump pour\n  valider row counts.\n- **Pas de dump en cours de transaction** — toujours WAL checkpoint avant dump\n  (géré par dump_db_sql.py).\n\n### Voir aussi\n\n- `tools/admin/dump_db_sql.py` — script de dump\n- `tools/admin/backup_rotation.py` — backup externe rotation 7 jours\n- `tools/admin/session_end.py` — clôture modifiée (dump avant git add)\n- BQ `wf_session` — workflow session complet\n", "type": "meta", "crit": true}, {"id": 74, "titre": "Audit d'intégrité DB — sanity check technique", "contenu": "## Audit d'intégrité DB — sanity check technique\n\nAudit **technique** du schéma : FK orphelines, doublons sur clés normalisées, désynchronisations entre tables, scripts vs DB. Distinct des audits sémantiques (BQ `audit_thesaurus` et `audit_corpus`) qui éprouvent le contenu éditorial. Cet audit est une **routine rapide**, sans agent, à passer après chaque migration ou avant une consolidation majeure.\n\n### Périmètre\n\n| Axe | Scope |\n|---|---|\n| FK orphelines | `term_relations.to_term_id`, `chain_etapes.term_id`, `concept_cards.dimension_id`, `source_usages.source_id`, `pedago_links.card_id`, `card_chain_links.card_id`, `card_chain_links.chain_id` |\n| Doublons clés normalisées | `terms.fr` lower(), `concept_cards.title` lower(), `fiches.slug`, `sources.doi` lower() |\n| Désynchronisations cache | `chain_etapes.term_fr_text` ≠ `terms.fr` (le cache refs `fiche_contenus` a été remplacé par la vue `v_fiche_refs` le 2026-07-05 — auto-cohérent par construction, plus de drift possible) |\n| Sections sans titre / titre dupliqué | `prompts.titre_h2`, `fiche_retour_sections.titre` |\n| Documents inactifs cités | `concept_cards.docs_codes` JSON-each vs `documents.code` |\n| Audit log gaps | période > 24 h sans entrée, ou opérations sensibles non loggées |\n\n### Requêtes canoniques\n\n```sql\n-- 1. FK orphelines termes (relations vers term_id inexistant)\nSELECT tr.id, tr.from_term_id, tr.rel_type, tr.to_term_id, tr.to_term_text\nFROM term_relations tr\nLEFT JOIN terms t ON t.id = tr.to_term_id\nWHERE tr.to_term_id IS NOT NULL AND t.id IS NULL;\n\n-- 2. FK orphelines chaînes\nSELECT chain_id, position, term_fr_text FROM chain_etapes\nLEFT JOIN terms t ON t.id = chain_etapes.term_id\nWHERE chain_etapes.term_id IS NOT NULL AND t.id IS NULL;\n\n-- 3. Doublons termes par fr lower()\nSELECT lower(fr) k, count(*) n, group_concat(id) ids\nFROM terms GROUP BY k HAVING n > 1;\n\n-- 4. Désynchronisation chain_etapes.term_fr_text ↔ terms.fr\nSELECT ce.chain_id, ce.position, ce.term_fr_text, t.fr\nFROM chain_etapes ce JOIN terms t ON t.id=ce.term_id\nWHERE ce.term_fr_text IS NOT NULL AND ce.term_fr_text != t.fr;\n\n-- 5. Désynchronisation cache refs ↔ source_usages — OBSOLÈTE 2026-07-05\n-- (la table fiche_contenus a été DROPpée, remplacée par la vue v_fiche_refs\n-- qui régénère le cache depuis source_usages + sources à la volée).\n-- Le check est désormais auto-cohérent par construction ; pour vérifier la\n-- couverture refs/usages par fiche, requêter directement :\n--   SELECT entity_id AS fiche_id,\n--          COUNT(DISTINCT source_id) AS n_usages_uniques\n--   FROM source_usages WHERE entity_type='fiche'\n--   GROUP BY entity_id;\n\n-- 6. Cards orphelines (sans dimension)\nSELECT id, title FROM concept_cards\nWHERE dimension_id IS NOT NULL\n  AND dimension_id NOT IN (SELECT id FROM concept_dimensions);\n\n-- 7. docs_codes JSON-each cassé\nSELECT cc.id, cc.title, value AS doc_code\nFROM concept_cards cc, json_each(cc.docs_codes)\nLEFT JOIN documents d ON d.code = value\nWHERE d.code IS NULL;\n\n-- 8. Sources sans DOI ni URL (passe rapide — cf. audit_sources_orphelines.py pour rapport complet)\nSELECT count(*) FROM sources WHERE (doi IS NULL OR doi='') AND (url IS NULL OR url='');\n```\n\n### Script unifié\n\n`tools/admin/check_integrity.py` exécute la majorité de ces vérifications avec sortie structurée (markdown ou JSON). Mode `--strict` arrête au premier check rouge. À lancer **toutes les 3-5 sessions** ou avant toute migration de schéma.\n\n> **Couverture FK `term_relations`** (depuis 2026-06-07) : le script vérifie les **deux** sens — `from_term_id` ET `to_term_id` (requête canonique #1). Le check `to_term_id` (FK pendante après suppression d'un terme cible, le `ON DELETE CASCADE` ne couvrant que `from_term_id` et `foreign_keys=0` au runtime) avait été un **angle mort** jusque-là. Distinguer des orphelins **légitimes** `to_term_id IS NULL` (cf. `refactor_term_relations`).\n\n### Pièges méthodologiques (acquis 2026-06-07)\n\n- **`foreign_key_check` noyé par une FK fantôme** : une FK déclarée vers une table **droppée** (`terms.section_key → sections`) fait remonter *tous* les enfants comme « violations » (3732), masquant les vraies. Décompter par table parent (`PRAGMA foreign_key_check` → grouper) ; retirer la FK obsolète par recréation de table (`legacy_alter_table=ON` pour préserver les vues pendant le `RENAME`).\n- **Désync `fiche_contenus.refs ↔ source_usages` (requête #5) — OBSOLÈTE 2026-07-05** : la table `fiche_contenus` a été DROPpée et remplacée par la vue `v_fiche_refs` qui régénère le cache à la volée depuis `source_usages` + `sources`. Le drift est désormais impossible par construction. Historique des pièges (à conserver pour mémoire) :\n  1. `source_usages` compte les **occurrences** de citation, `refs` les **sources uniques** → déduplication par `source_id` obligatoire.\n  2. Une ref **présente dans le cache mais sans le champ `id`** (source créée à l'étape 5 d'intégration) est comptée à tort comme « hors cache » alors qu'elle **s'affiche correctement** (`gen_cahier` lit `auteurs/année/titre`, pas `id`). Comparer par **DOI + signature (surname, année)**, pas par `id`. En 2026-06, sur 1060 « hors cache » bruts : **91 % étaient des refs sans `id`** (faux positif), vrai cas = 89.\n- **Faire confiance à un `id` de cache sans le vérifier vivant crée des orphelins** : `relink_fiche_refs.py` matérialisait des `source_usages` vers des sources mortes après un dedup `sources`. **Durci 2026-06-07** (vérifie `live_ids`, re-route/retire). Réflexe général : lancer `check_integrity` après tout relink/dedup.\n\n### Cadence et déclencheurs\n\n- **Cadence régulière** : `check_integrity` toutes les 3-5 sessions\n- **Déclencheurs immédiats** :\n  - Après migration schéma (`ALTER TABLE`, ajout/modif colonne)\n  - Après import massif (lot Jenni, refs Crossref, etc.)\n  - Après suppression d'un terme / d'une card / d'une chaîne (cascade FK)\n  - Avant `regen_all.py` (génère HTML public depuis DB — cohérence critique)\n- **Audit log gaps** : check trimestriel — détecter une opération sensible (DROP, DELETE en masse) non loggée\n\n### Articulation avec les autres audits\n\n| Audit | Couvre | Distinct de #74 |\n|---|---|---|\n| BQ `audit_thesaurus` | Sémantique du thésaurus (termes, relations, doublons éditoriaux, méta-vocab) | #74 ne juge que les FK et les doublons sur clé normalisée |\n| BQ `audit_corpus` | Sémantique du corpus (chaînes, cards, fiches, articulations) | #74 ne juge que les FK et les désync cache |\n| BQ `wf_fiche_integration` | Mini-audit phase 4bis post-intégration | Spécifique à une fiche, pas un audit global |\n\n### Historique d'incidents traités\n\n- 36 doublons termes corrigés (session 03/04 2026)\n- 77 orphelines `term_relations` (session 31/03 2026)\n- 2 FK fantômes `cascade_prerequis` (session 31/03 2026)\n- 13 préfixes `[XX]` parasites dans `chain_etapes.role_dans_chaine` (audit #34)\n- 14 termes l'agent-rédigés supprimés (commit af35413 - session 2026-04-20)\n- 2 termes pseudoscience (#160, #214) + 11 relations supprimées (session 2026-04-23)\n- **2026-06-07** : FK fantôme `terms.section_key → sections` retirée (recréation de table, `foreign_key_check` 3741→0) ; 9 relations `to_term_id` pendantes supprimées (#1604/#386/#2319 termes supprimés) + check `to_term_id` ajouté à `check_integrity` ; 10 `chain_etapes.term_fr_text` resync ; T4 cache refs : `relink` (718 id + 257 usages, cas1→0), 25 ids de sources mortes (dedup) re-routés + 28 usages orphelins nettoyés, 32 faux appariements supprimés (surnames à tiret unicode mal liés). Bugs de fond : (1) `relink` ne vérifiait pas les id morts → **CORRIGÉ 2026-06-07** (vérifie `live_ids`, re-route vers survivant ou retire) ; (2) dedup `sources` ne nettoie pas `fiche_contenus.refs` → mitigé par relink durci (filet), cause racine à corriger ; (3) matching tiret unicode (U+2010..U+2014) → **CORRIGÉ** (normalisation ajoutée dans `relink._normalize`, `integrate_fiche.normalize`, `integrate_fiche_refs._surname`) ; (4) divergence cache (étape 4) / `source_usages` (étape 5) du pipeline fiche → **à investiguer** (cas #84, docx outlier 443k).\n\n### audit_log — utilisation (absorbé depuis `audit_log`)\n\n```sql\n-- Voir les dernières opérations\nSELECT ts, operation, table_name, record_ref, substr(detail, 1, 100) FROM audit_log ORDER BY ts DESC LIMIT 20;\n\n-- Logger une opération\nINSERT INTO audit_log (operation, table_name, record_ref, detail) VALUES ('UPDATE', 'terms', 'strate S', 'description...');\n```\n\n**Purge** : le journal est purgé à chaque clôture par `purge_audit_log.py` (appelé par `session_end.py` étape 4bis). Rétention = `config.maintenance.audit_log_retention_mois`. Sans `--vacuum`. Doit tourner AVANT le flush WAL.\n\n### Voir aussi\n\n- BQ `audit_thesaurus` — sémantique thésaurus\n- BQ `audit_corpus` — sémantique corpus\n- BQ `maintenance_thesaurus` — opérations CRUD termes\n- `tools/admin/check_integrity.py` — script unifié\n", "type": "workflow", "crit": false}]}, "jenni-workflow": {"nom": "Workflow Jenni", "entries": [{"id": 120, "titre": "Discipline BQ-clean — zéro méta-vocab dans les prompts LLM", "contenu": "## Règle absolue BQ-clean — aucune fuite de méta-vocab dans les prompts Jenni\n\n**Liste noire** (vérifier AVANT génération de tout prompt Jenni) :\n\n- Codes doc : S0-S4, V1-V3, P1-P5, F1-F2, H1-H3\n- Vocab méta-projet : `corpus`, `strate`, `cross-ref`, `chaîne causale`,\n  `concept card`, `thésaurus`, `sol_vivant.db`, `section_key`, `doc_code`\n\n**Sources des leaks** (déjà rencontrés) :\n\n1. **terms.definition** : certains termes ont des définitions qui citent\n   des doc_codes (ex: \"Voir S2 — PGPR\") — violation directe.\n   → Audit et reformulation.\n\n2. **terms.fr / en** : concepts méta tels que\n   \"Chaîne 1 — Photosynthèse → Immunité intestinale\"\n   appartiennent à `chains_causales` (table dédiée), PAS à `terms`.\n   → Supprimer du `terms` si présents.\n\n3. **prompts.titre_h2 / contexte_sci / instructions / enrichissement** :\n   fuites manuelles fréquentes (cross-ref, chaîne causale).\n   → Scan régulier toutes colonnes texte.\n\n**Vérification systématique** :\n\n```python\nFORBIDDEN = [r'\\bchaîne causale\\b', r'\\bcross-ref\\b', r'\\bconcept card\\b',\n             r'\\bsol_vivant\\b', r'Corpus Le Sol Vivant', r'\\bdu corpus\\b',\n             r'\\bdans le corpus\\b', r'\\bthésaurus\\b', r'\\bthesaurus\\b',\n             r'\\bS[0-4]\\b', r'\\bV[1-3]\\b', r'\\bP[1-5]\\b',\n             r'\\bF[12]\\b', r'\\bH[1-3]\\b']\nfor pat in FORBIDDEN:\n    matches = re.findall(pat, text, re.IGNORECASE)\n    assert not matches, f\"Leak {pat}: {matches}\"\n```\n\n**À lancer à chaque régénération** des prompts_jenni_*.txt et\nprompt_fiche_*.docx.\n", "type": "regle", "crit": true}, {"id": 158, "titre": "Pratiques naturelles typées hors-périmètre corpus — KNF, JADAM, EM-Higa, LiFoFer, ferments", "contenu": "## Pratiques naturelles typées hors-périmètre Jenni\n\n### Règle absolue\n\nLe corpus Sol Vivant documente des **mécanismes scientifiques génériques**, pas des **recettes praticiennes**. Les pratiques naturelles dites « typées » — KNF, JADAM, EM-Higa, LiFoFer, bokashi, ferments traditionnels — sont des **instances paysannes** de mécanismes universels (fermentation lactique, hydrolyse enzymatique, anaérobiose dirigée, pression osmotique, etc.). Ce sont les mécanismes qui entrent dans le corpus, pas les recettes.\n\n### Pourquoi exclure Jenni de ces sujets\n\nJenni est un assistant de rédaction académique généraliste. Sur les pratiques typées, son corpus d'entraînement contient peu de littérature praticienne (Cho Han Kyu, Cho Youngsang, Higa, manuels paysans coréens/japonais). Empiriquement constaté : Jenni mélange acronymes (FAA → fermentation poisson générique), inverse les étapes aérobie/anaérobie, donne des ratios inexacts. Autant de bêtises que de vérités. **Risque inacceptable pour un corpus scientifique.**\n\n### Liste des pratiques typées (à date)\n\n- **KNF** (Korean Natural Farming, Cho Han Kyu) : IMO, FAA, FPJ, FFJ, OHN, BRV, LAB, WCA, WCP, BIO-9, OHN, SOWS, séries SA-N…\n- **JADAM** (Cho Youngsang) : JMS, JLF, JNP, etc.\n- **EM-Higa / Bokashi** : EM-1, fermentation anaérobie sons + microorganismes effectifs\n- **LiFoFer** (Lithuanian Forest Fermentation) : ferments solides/liquides à base de forêt\n- **Ferments traditionnels** : kefir, kimchi, choucroute, ensilage (recettes — les mécanismes restent)\n- **Préparations de biofertilisants paysans** sud-américains (Cuba EM, biofertilizantes brésiliens) — quand la doctrine prime sur le mécanisme\n\n### Sources autoritaires (jmj/pdf/)\n\n- **KNF** : `KNF - chos-global-natural-farming-sarra.pdf` (Cho Han Kyu général), `KNF - Dr Hoon Park III - Indigenous Microorganism(IMO).pdf`, séries inputs (FAA, FPJ, LAB, OHN, BRV, WCA, WCP, BIO-9, SA-1 à SA-19)\n- **JADAM** : `youngsang-cho-jadam-organic-farming_-the-way-to-ultra-low-cost-agriculture-jadam-2016-1.pdf`\n- **Fermentation lactique académique** : `LAB.pdf`, `LABresearch.pdf`\n- **LiFoFer** : `Lifofer_10.12.2024_Rezomes(5).pdf`, `Recettes-Lifofer-solides-liquides-et-reactivations.pdf`, `guide-lff-2018.pdf`\n- **EM/Bokashi** : `Agriton_EM_Fermentation-Bokashi-vs-Composting-...pdf`, `Bokashi as a soil improver (3 years).pdf`, `em-cuba.pdf`\n- **Biofertilisants généraux** : `Préparations de biofertilisants.pdf`, `Matière Microorganismes photosynthétiques.pdf`\n\n### Doctrine éditoriale corpus\n\n**Une fiche scientifique se construit sur le mécanisme**, jamais sur la recette. Exemple : pas de fiche « LAB-KNF » ni « LiFoFer », mais une fiche **« Fermentation lactique »** (Lactobacillus, baisse pH, biotransformation, conservation par compétition microbienne) qui mentionne KNF-LAB, LiFoFer, kefir, kimchi, choucroute, ensilage comme **instances illustratives**.\n\n### Workflow accepté pour ces sujets\n\n- **Sources directes** (PDFs `jmj/pdf/`) lues par l'agent ou JMJ\n- Rédaction par **JMJ** ou **l'agent** (extraction et synthèse) — jamais Jenni\n- Mention des acronymes-recettes **en clair** dans cards/fiches (ex. « Fish Amino Acid de Cho Han Kyu ») — pas indexés dans le thésaurus\n- **Cards philosophie** acceptables : comparer logiques épistémiques (KNF artisanal ciblé vs JADAM paysan mass-scale vs EM-Higa SynComs commercialisé vs LiFoFer minéral)\n\n### Agents d'audit — filtre `is_diy=0` obligatoire (périmètre)\n\nTout script d'audit qui traite des **fiches** via `agent_runner`\n(`analyse_fiches`, futurs audits fiche) doit **filtrer sur `is_diy=0`**\n(`COALESCE(f.is_diy,0)=0`) dans la requête `cmd_prepare`. Raisons :\n\n- Les **fiches DIY-recette** (`is_diy=1` : KNF/JADAM/EM, séries pratiques\n  typées) sont la source du bruit : recettes peu structurées, sans les\n  marqueurs canoniques (sections numérotées, blocs Références APA) que les\n  prompts d'audit attendent → catégories vides, JSON malformé, hors-périmètre.\n- En revanche une **fiche l'agent STRUCTURÉE** (ex. #41 « transition robuste »,\n  `is_diy=0`, rédigée en direct depuis le Shift Project) a **autant de valeur\n  qu'une fiche Jenni** et **doit être auditée**. Le critère est donc `is_diy`\n  (nature recette vs structurée), **pas `origine`** (jenni/LLM).\n- Le **filtrage amont** dans `--prepare` est la garantie ; tout filtrage\n  côté prompt agent est défaillant.\n\n> **Pourquoi pas `origine='jenni'` (ancien critère, corrigé 2026-06-09)** :\n> les #95-104 (séries KNF/JADAM) ont été re-typées `origine=jenni` le\n> 2026-06-01 (fiches mécanisme académiques) tout en restant `is_diy=1`. Le\n> filtre `origine='jenni'` était donc devenu **à l'envers** : il laissait\n> passer ces recettes (jenni) et excluait à tort la seule fiche LLM\n> structurée (#41). Bascule sur `is_diy=0` (décision JMJ 2026-06-09).\n\nCas où le filtre est volontairement levé (rare) : ajouter un commentaire\nexplicite `# périmètre élargi — JMJ a validé` dans le script. Sans ce\ncommentaire (et sans filtre `is_diy=0`), le check pré-vol n°2 (BQ\n`agent_runner_garde_fous`) refuse le lancement.\n\nNote périmètre : `audit_focus`, `analyse_corpus` auditent les\n`concept_cards` (pas les fiches) et appellent le garde sans `sql_query` —\nle check périmètre y est skippé (sans objet).\n\nIncident référence : 2026-04-05 — 7 agents `analyse_fiches` lancés sur\nfiches DIY #95-104 ont produit du JSON conforme structurellement mais\nvide de fond sur 4/5 catégories. Coût : ~50 k tokens et confusion lors du\nconsolidate.\n\n### Audit du CONTENU — ne pas rejeter le DIY contextualisé sourcé (précision 2026-06-09)\n\nLe filtre `is_diy=0` cadre la **sélection** des fiches auditées (amont). Mais à\nl'**audit du contenu** d'une fiche `is_diy=0`, un agent (ou l'agent) ne doit **PAS\nrejeter ni flagger comme dérive** les pratiques typées citées **comme instances\nd'un mécanisme générique académiquement sourcé**.\n\nRaison (règle JMJ) : **Jenni ne mobilise une pratique DIY que si elle est\nacadémiquement sourcée** — sinon elle ne peut pas en parler (open access\nuniquement). Sa présence dans un retour Jenni, avec citation `(Auteur, année)`,\natteste donc du sourçage et de l'angle mécanisme. C'est le régime autorisé\n(« mention contextualisée », cf. §Gate intégration).\n\nDistinction opérationnelle :\n- **Légitime (ne pas rejeter)** : « la haute pression osmotique des préparations\n  de type FAA induit une dormance (Gong 2025) » — mécanisme + source + instance.\n- **Dérive (à signaler)** : une recette nue non sourcée (« mélanger 1:1 sucre roux\n  et poisson ») sans mécanisme ni source.\n\nLe warning `RECETTE_TYPEE` du gate (regex acronymes) est un **signal à VÉRIFIER**\n(sourçage + angle mécanisme), **pas un rejet automatique** — JMJ arbitre. Cas\nattesté : fiche #224 (dormance), sections 4.4/5 ajoutées sur demande JMJ, DIY\nsourcé (Gong 2025, Brom 2023, Thompson 2025, Barquero 2021) → faux positif accepté.\n\n### Workflow interdit\n\n- Demander à Jenni de définir/rédiger sur ces sujets\n- Indexer les acronymes-recettes (FAA, FPJ, LAB-KNF, JMS, etc.) comme termes thésaurus\n- Confondre KNF et JADAM (deux écoles distinctes, presque opposées)\n- Présenter une recette comme contenu scientifique du corpus\n\n### Flag termes : flag_pratique_typee\n\nLa table `terms` porte le champ `flag_pratique_typee` (INTEGER 0/1) — distinct de l'ancien `flag_pseudoscience` (colonne droppée 2026-06-24, aucun terme n'était flaggé). Les termes flaggés sont **exclus des exports vers Jenni** (`enrich_thesaurus.py`, `export_thesaurus_incomplets.py`) mais permis en clair dans cards/fiches.\n\n### Gate intégration\n\nLe gate `tools/integration/integrate_fiche.py` détecte les acronymes-recettes dans les retours Jenni. Une fiche contenant `FAA`, `FPJ`, `JMS`, `JLF`, `OHN`, `LAB-KNF`, `WCA`, `IMO` (au sens KNF), `BIO-9` etc. déclenche une **alerte** (warning RECETTE_TYPEE) — JMJ arbitre (rééditer ou accepter si mention contextualisée).\n\n### Mode dégradé existant\n\nLes fiches DIY actuelles intégrées avant cette doctrine restent en l'état (mode dégradé). À revoir lors d'une session dédiée à partir des documents officiels (KNF Cho Han Kyu, JADAM Cho Youngsang, LiFoFer guide-lff-2018).\n", "type": "doctrine", "crit": true}]}, "session": {"nom": "Gestion de session", "entries": [{"id": 128, "titre": "Session opencode — démarrage, travail, clôture", "contenu": "## Session opencode — démarrage, travail, clôture\n\nBQ narrative fusionnée (Étape 7, 2026-07-10). Absorbe : `session_end_ritual`,\n`git_toujours_travailler_sur_main`, `environnement_pas_de_binaire_sqlite3_utiliser_pyth`,\n`maintenance_sessions_journal_de_bord`, `nouveau_script_checklist_d_enregistrement`.\n\n---\n\n### 1. Démarrage\n\n```bash\npython3 tools/admin/session_start.py --db sol_vivant.db\n```\n\nLe script fait le minimum opérationnel (refactor 2026-07-07) :\n1. **État git** — branche courante, working tree, ahead/behind vs upstream. **Sans reset, sans checkout, sans suppression de branche**.\n2. **Backup DB** — snapshot horodaté de `sol_vivant.db` (un par jour) + WAL checkpoint TRUNCATE.\n\nPuis briefing analytique via sous-agent scribe :\n\n```\n@session-scribe briefing\n```\n\nLe scribe exécute la check-list canonique (cf. skill `session-flow` § Briefing canonique) :\n- Dernier recap (`jmj/rapports/session/session_*.md`) → `reste_a_faire` + `alertes`\n- Santé DB (`v_sante` + `sqlite_master` dynamique — pas de liste en dur)\n- Intégrité (`check_integrity.py` — SSOT)\n- Audits (`audit_meta.py` — SSOT, exit code = statut global)\n- Règles critiques (extrait `.opencode/RULES.md`)\n- Synthèse priorisée : 🔴 criticités → ⚠ dettes → 📌 plan\n\n**Contrat sur le champ `reste_a_faire`** : c'est la source de vérité du « ticket en cours ». Toute session laissant un chantier inachevé doit le documenter dans `session.reste_a_faire` du recap, sinon il sera invisible au démarrage suivant.\n\n---\n\n### 2. Pendant la session\n\n```\n1. Lire le briefing scribe\n2. Comprendre la demande JMJ\n3. Chercher dans BQ si pattern applicable :    bq_query.py --search <mot>\n4. Faire (éditer DB / scripts / Publications/)\n5. Régénérer : python3 tools/regen_all.py --db sol_vivant.db (si outputs touchés)\n6. check_integrity.py --db sol_vivant.db\n7. Commit + push (branche courante vers son upstream)\n```\n\n---\n\n### 3. Clôture canonique\n\n**Paradigme : environnement physique local (PC JMJ).** Le filesystem local +\ngit local sont la source de vérité immédiate. Le push vers `origin` est une\n**synchronisation** (différable), pas une sauvegarde critique. Le recap est une\n**capitalisation** (souhaitable), pas une obligation de traçabilité. L'integrity\nest une **surveillance** (corrigeable à la session suivante), pas une urgence.\n\nLe workflow est **mono-utilisateur** avec DB **binaire non fusionnable**. Le\nworking tree sale est accepté par défaut (git add -A l'incluera).\n\n3 temps :\n\n1. **Recap** (recommandé, pas bloquant) — 3 voies par priorité :\n   - `@session-scribe recap <contexte>` → rédige `jmj/rapports/session/<slug>.md`\n     (sessions substantielles/éditoriales).\n   - Rédiger `jmj/.pending_session_recap.md` (agent primaire, canonique) →\n     `session_end.py` l'**archive automatiquement** vers `jmj/rapports/session/`\n     (slug extrait du frontmatter `slug:`).\n   - `--skip-recap` pour les sessions techniques courtes (la trace git suffit).\n2. **JMJ valide/amende** le recap (si scribe).\n3. **`session_end.py`** — enchaîne recap (archive .pending si présent) + regen +\n   integrity + dump + commit + push.\n\n```bash\npython3 tools/admin/session_end.py --db sol_vivant.db                    # .pending auto-archivé (canonique)\npython3 tools/admin/session_end.py --db sol_vivant.db --recap-slug <slug> # scribe déjà rédigé\npython3 tools/admin/session_end.py --db sol_vivant.db --short            # session courte (skip regen+integrity+dump)\npython3 tools/admin/session_end.py --db sol_vivant.db --skip-recap       # technique pure (trace git suffit)\npython3 tools/admin/session_end.py --db sol_vivant.db --no-push          # commit local, push différé\n```\n\n#### Séquence canonique session_end.py\n\n1. **Pré-flight** : branche courante + working tree. **Working tree sale accepté par défaut** (local-first). `--require-clean` pour abort si sale.\n2. **Recap** : `.pending` (archive auto, canonique) > `--recap-slug` (scribe) > `--skip-recap`. Cf. `resolve_recap()`.\n3. **Régénération** des pages (`regen_all.py`) — timeout 900s, abort si dépasse. `--skip-regen` pour skip.\n4. **`check_integrity.py`** — bloquant si `critique > 0` (corruption structurelle), **warning si `degraded`** (corrigeable à la session suivante, non bloquant). `--skip-integrity` pour skip.\n5. **Purge `audit_log`** (rétention) + **dump SQL compressé** (`backups/sol_vivant.sql.gz`). Le dump fait son propre `wal_checkpoint(TRUNCATE)`. Abort si dump échoue. `--skip-dump` pour skip.\n6. **Commit** : `git add -A` (DB `.db`/`.db-wal` et `.env` gitignorés). Message structuré : `session_end : <slug_recap>`.\n7. **Push** de la branche courante — **bloquant si échec** (abort, pas « close ✓ » trompeur). `--no-push` pour commit local sans sync.\n\n#### Flags\n\n| Flag | Effet |\n|---|---|\n| *(aucun)* | Recap via `.pending` auto-archivé (canonique agent primaire) |\n| `--recap-slug <slug>` | Recap déjà rédigé par `@session-scribe recap` |\n| `--short` | Session courte : skip regen + integrity + dump + recap, commit + push direct |\n| `--dry-run` | Simulation sans commit ni push |\n| `--skip-regen` | Skip la régénération web |\n| `--skip-dump` | Skip le dump SQL compressé |\n| `--skip-integrity` | Skip check_integrity |\n| `--skip-recap` | Skip session recap (sessions techniques — la trace git suffit) |\n| `--no-push` | Commit local sans push (sync différée — acceptable en local) |\n| `--require-clean` | Exige un working tree propre (abort si sale) |\n\n---\n\n### 4. Format du recap (`jmj/rapports/session/<slug>.md`)\n\nYAML frontmatter + body markdown. Le scribe utilise la notation **block-scalar `|`** pour tous les champs texte longs (robuste aux apostrophes françaises).\n\n```yaml\n---\nslug: session_2026-07-10_theme_court\ntitre: 'Session 2026-07-10 — Titre court'\ndate_session: 2026-07-10\nts_start: '2026-07-10 08:30:00'\nts_end: '2026-07-10 12:30:00'\ntags: [domaine1, domaine2]\ncategorie: session_recap\nstats_summary:\n  terms_total: <int>\n  cards_active: <int>\n  chains: <int>\n  fiches_integrees: <int>\nsession:\n  objectif: |\n    <1-2 phrases>\n  actions: |\n    - <sha7> <sujet commit>\n  decisions: |\n    <décisions structurantes>\n  tables_touchees: |\n    <liste depuis audit_log>\n  reste_a_faire: |\n    <dette identifiée, ou \"Néant.\">\n  alertes: |\n    <frictions, ou \"Néant.\">\n---\n\n# Markdown body — synthèse réflexive 4 sections (recommandée pour sessions substantielles)\n\n## Objectif initial\n## Décisions structurantes\n## Réalisations\n## Synthèse réflexive\n### Frictions\n### Anomalies\n### Ce que j'ai compris\n### Réflexes\n```\n\n**Champs obligatoires** : `slug`, `titre`, `date_session`, `ts_start`, `objectif`, `actions`. La synthèse réflexive 4 sections est **recommandée** (capitalise sur les frictions) mais pas obligatoire — pour les sessions techniques courtes, la trace git (commit message + diff) suffit comme mémoire.\n\n#### Synthèse réflexive — pourquoi recommandée\n\nLa **synthèse réflexive structurée en 4 sections** capitalise sur les frictions pour qu'elles ne se reproduisent pas :\n\n- **Frictions** : où l'agent s'est trompé, et la **cause** (recadrages JMJ, hypothèses fausses).\n- **Anomalies** : ce que la session a révélé d'incohérent dans le corpus.\n- **Ce que j'ai compris** : la doctrine **réellement internalisée** — pas un copier-coller de BQ.\n- **Réflexes** : ce qu'il faut faire **différemment** la prochaine fois.\n\n---\n\n### 5. Consultation historique\n\nLes rapports de session sont en **filesystem natif** (`jmj/rapports/session/<slug>.md`) depuis Session C (2026-05-05). Plus de table DB — le filesystem est l'unique source, lisible via `grep`/`Read`/git diff.\n\n```bash\n# Recherche thématique\ngrep -l \"thesaurus\" jmj/rapports/session/*.md\n\n# Reprise de dette : lire reste_a_faire des derniers recaps\ngrep -A5 \"reste_a_faire:\" jmj/rapports/session/session_2026-07-*.md\n```\n\n---\n\n### 6. Topologie git — l'agent ne force jamais\n\n`main` = production, `origin/main` = source de vérité. Projet mono-utilisateur (JMJ + opencode) avec DB binaire non fusionnable.\n\nL'agent **ne modifie jamais la topologie git** :\n- pas de `git reset --hard`\n- pas de `git checkout`\n- pas de `git branch -d`\n- pas de `git push --force`\n\nL'agent peut `git add`, `git commit`, `git push` (de la branche courante vers son upstream) uniquement via `session_end.py` ou sur instruction explicite de JMJ. L'arbitrage des fusions reste humain (JMJ peut avoir son propre client git en parallèle).\n\n---\n\n### 7. Environnement — pas de binaire sqlite3\n\nLe binaire `sqlite3` **n'est pas installé** dans l'environnement opencode. Toujours utiliser le module Python :\n\n```python\ncon = get_connection('sol_vivant.db')  # lib/db.py (inclut row_factory=Row)\nfor r in con.execute(\"SELECT ... FROM ...\"):\n    print(dict(r))\n```\n\nNe jamais tenter `sqlite3 sol_vivant.db \"...\"` — ça échoue systématiquement.\n\n---\n\n### 8. Checklist nouveau script\n\nAprès création d'un nouveau script Python dans `tools/` :\n\n1. Imports partagés : `from db import get_connection`, `from cli import add_db_arg, check_db`\n2. Utiliser `add_db_arg(parser)` au lieu de `parser.add_argument('--db', ...)`\n3. Utiliser `check_db(args.db)` pour valider l'existence de la DB\n4. `git add tools/<folder>/<nom>.py` puis commit\n5. Si le script génère des fichiers → l'ajouter dans `regen_all.py`\n\n**Quand un script mérite-t-il une BQ ?** Uniquement s'il porte une règle ou procédure réutilisable (workflow, audit récurrent, pipeline). Les utilitaires ponctuels n'en nécessitent pas — leur docstring suffit.\n", "type": "workflow", "crit": true}, {"id": "conseil_overview", "titre": "Le Conseil — vue d'ensemble (point d'entrée court)", "contenu": "## Le Conseil en 30 secondes\n\nLe Conseil est le **dispositif de délibération** qui tranche toute décision de fond (audit cards/chaînes, arbitrage doctrinal, intégration fiche). Il corrige deux défauts d'un agent IA seul : **confirmer sa première intuition** et **le grain consolidatif** (câbler le neuf, rater l'absent).\n\n**Architecture en deux temps séparés par une valve** :\n\n```\nTRIAGE → [TEMPS 1 génération · juge FÉCONDITÉ] → VALVE → [TEMPS 2 validation · juge JUSTESSE & NÉCESSITÉ] → vérif chairman → VERDICT JMJ → (promue vers juge de VÉRITÉ externe : Semantic Scholar)\n```\n\n## Les 3 juges (jamais confondre)\n\n| Juge | Question | Siège |\n|---|---|---|\n| **FÉCONDITÉ** | le pont est-il génératif ? | Filtre de fécondité, **Temps 1** |\n| **JUSTESSE & NÉCESSITÉ** | faut-il s'engager ? | Contradicteur + Anti-marteau, **Temps 2** |\n| **VÉRITÉ** | est-ce vrai scientifiquement ? | **Juge externe — Semantic Scholar** (`audit_factuel_arbitrage.py`), HORS Conseil |\n\n**Règle dure** : le Conseil ne tranche **jamais** la vérité — il **promeut** une hypothèse féconde + juste + nécessaire vers Semantic Scholar. Mettre la vérité dans le Conseil court-circuite le juge externe.\n\n## Quand déclencher le Conseil ? (triage)\n\nL'anti-marteau appliqué au Conseil lui-même :\n\n- **(a) TRIVIAL** → réponds simplement. STOP.\n- **(b) DÉCISION sans structure nouvelle** → saute le Temps 1, va au Temps 2.\n- **(c) INTÉGRATION / SYNTHÈSE** (composants transverses possibles) → Temps 1 puis 2.\n\nLe mode génératif (Temps 1) ne se déclenche **qu'en régime (c)** — sinon on rallume le marteau qu'on prétend éteindre.\n\n## Les 9 sièges (architecture v3, post-2026-06-21)\n\nLe Conseil v3 comporte **9 sièges typés**, répartis sur les deux temps :\n\n**TEMPS 1 — GÉNÉRATION (3 sièges)**\n- **Pontonnier ANCRÉ** — propose des ponts **internes** au corpus (entre cards/chaînes/fiches existantes).\n- **Pontonnier LIBRE** — propose des ponts **externes** (cadres d'autres disciplines).\n- **Réfutateur par cards** — pour chaque pont, recense les cards qui le valident ou l'infirment (`concept_card_links`, link_type `contradicts` notamment).\n\n**TEMPS 2 — VALIDATION (6 sièges)**\n- **Contrarian** — cherche la faille fatale, l'artefact de comptage, la friction dissoute.\n- **Mécaniste** — exige le mécanisme causal nommable.\n- **Transversaliste** — cherche les adjacences (autres strates, chaînes à ouvrir).\n- **Terrain** — confronte aux tests terrain, seuils, données chiffrées.\n- **Sourceur** — évalue l'ancrage scientifique (sources), ou renvoie à Semantic Scholar.\n- **Anti-marteau** — défend le statu quo comme verdict de plein droit.\n\n**Score de fécondité chiffré** (Temps 1) : grille /9 — portée (0-3) + compression (-2 à +2, négatif si dissout tension) + fécondité prédictive (0-2) + critère négatif (0-2). Seuil ≥5 = fécond.\n\n## Où aller plus loin\n\n| Besoin | Lire |\n|---|---|\n| Détail de l'ossature (3 juges, valve, garde-friction, décorrélation) | `conseil_modele` |\n| Détail opératoire du Temps 1 (génération) | `conseil_generatif` |\n| Implémentation technique (script Python) | `tools/admin/conseil_emergences.py` (docstring) |\n| Détection des tensions transversales (angles cachés, pré-Conseil) | `tools/admin/analyse_emergences.py` (docstring) |\n| Prompt portable hors-corpus | `jmj/outils/conseil_v2_prompt.md` |\n| Diagnostic complet et améliorations (2026-06-21) | `jmj/rapports/analyses/conseil_diagnostic_ameliorations.md` |\n\n## Anti-patterns (rappels)\n\n- **Mettre la vérité dans le Conseil** quand Semantic Scholar existe.\n- **Sauter le Round 2** ou l'un des deux gardiens (contradicteur, anti-marteau).\n- **Faire rédiger du contenu éditorial** par les agents (`pas_agent_redacteur`).\n- **Conclure sur les dires d'un gardien sans re-vérifier en DB** (chairman).\n- **Agir avant l'arbitrage JMJ**.\n- **Optimiser une frontière de KPI** (« compteur 0 → 0 ») au lieu du vrai besoin.\n- **Récompenser la compression en bloc** → rejouer M0 (friction dissoute).\n", "type": "info", "crit": true}, {"id": 161, "titre": "Le Conseil — dispositif de délibération (ossature + deux temps)", "contenu": "## Le Conseil — dispositif de délibération du corpus\n\n> **Architecture v3 (refonte 2026-06-21)** — pour une vue d'ensemble courte,\n> lire d'abord `conseil_overview`. Le détail opératoire du Temps 1 (génération)\n> est dans `conseil_generatif`. Diagnostic complet et motivations :\n> `jmj/rapports/analyses/conseil_diagnostic_ameliorations.md`. Implémentation technique :\n> `tools/admin/conseil_emergences.py` (v3, 9 sièges, score /9 chiffré,\n> vérification auto des citations `[CARD #N]`).\n\nLe Conseil est **LE dispositif de délibération** : la couche qui rend un **verdict** sur\ntoute décision de fond (audit cards/chaînes/cascades, design DB, arbitrage doctrinal,\nintégration d'un retour fiche). Il répond à deux défauts d'un agent IA seul : il **confirme\nsa première intuition**, et un dispositif de pure validation a un **« grain consolidatif »**\n— il câble le neuf à l'existant mais ne voit pas ce qui manque (un nœud absent lui reste\ninvisible).\n\nIl se joue en **agents Task parallèles** (`model='<modèle configuré>'`) qui font du\n**JUGEMENT / CRITIQUE — jamais de rédaction éditoriale** (`pas_agent_redacteur`) : ils\nproposent des positions, des intitulés, des arbitrages ; ils ne rédigent pas le contenu du\ncorpus. Tous les artefacts intermédiaires vont dans `tmp/conseil_<sujet>/`.\n\nCette fiche est le **chapeau** : l'ossature, le triage et les deux temps. Le détail opératoire\ndu Temps 1 (génération) est dans `conseil_generatif`. Dérivé portable hors-corpus :\n`jmj/outils/conseil_v2_prompt.md` (et `conseil_prompt.md` pour la pure validation).\n\n### V3 — 9 sièges typés et score /9 chiffré (2026-06-21)\n\nLa v3 enrichit l'ossature d'origine sans en changer les principes :\n- **3 sièges au Temps 1** (génération) : `pontonnier_ancre`, `pontonnier_libre`, `cards_refutateur`.\n- **6 sièges au Temps 2** (validation) : `contrarian`, `mecaniste`, `transversaliste`, `terrain`, `sourceur`, `anti_marteau`.\n- **Score de fécondité /9** chiffré : portée (0-3) + compression (-2 à +2, **négatif si dissout tension → veto automatique M0**) + fécondité prédictive (0-2) + critère négatif (0-2). Seuil ≥5 + compression ≥0 = féconde.\n- **Vérification automatique des citations** `[CARD #N]` / `[FICHE #N]` / `[TERM #N]` / `[CHAIN #N]` à la consolidate — alerte sur références mortes ou `#N` nus (anti-confusion d'espaces de noms).\n- **Décorrelation des modèles** via `config.api.advisors_models` (round-robin par advisor).\n- **Retry + mode dégradé** : 3 retry par batch, marquage `(indisponible)` plutôt que blocage (doctrine dans le README généré par `agent_runner.py`).\n\n## L'OSSATURE — trois juges, une valve, une garde\n\n### Les TROIS juges (ne jamais les confondre)\n\nC'est l'ossature du dispositif. Trois questions, trois juges distincts :\n\n| Juge | Question | Où il siège |\n|---|---|---|\n| **FÉCONDITÉ** | le pont est-il génératif ? | filtre de fécondité, **Temps 1** |\n| **JUSTESSE & NÉCESSITÉ** | faut-il s'y engager ? | contradicteur + anti-marteau, **Temps 2** |\n| **VÉRITÉ** | est-ce académiquement vrai ? | **juge externe — arbitrage Semantic Scholar** (`audit_factuel_arbitrage.py`), HORS Conseil |\n\n**Règle dure** : quand un juge de vérité externe existe (en corpus : Semantic Scholar via `audit_factuel_arbitrage.py`), le Conseil ne\ntranche **jamais** la vérité — il PROMEUT une hypothèse féconde + juste + nécessaire VERS ce\njuge (`integration_conseil_audit`, `wf_fiche_integration`). Mettre la vérité *dans* le Conseil\ncourt-circuite Semantic Scholar. Hors-corpus (pas d'API académique), la vérification web est le seul substitut —\n**à escompter**.\n\n### La VALVE à sens unique\n\nGénération jugée à la **fécondité**, validation jugée à la **justesse/nécessité** : **jamais\nle même siège** pour les deux (un pont inédit ne se valide pas contre un corpus où il n'existe\npas encore). Seules passent en Temps 2 les hypothèses fécondes **qui préservent la friction**.\nSens unique : ce qui ne passe pas ne remonte pas. La valve évite que la critique stricte\nn'étrangle la génération à la naissance.\n\n### La GARDE-FRICTION (leçon M0)\n\n**Un bon pont — comme une bonne synthèse d'audit — NOMME la tension productive, il ne la\nDISSOUT jamais** sous couvert de « résoudre ». Fondre deux contraires féconds en un méta-récit\nlisse éteint la friction : c'est stérilisant, pas fécond, même si « ça compresse ». Le\ncontradicteur-synthèse traque la **friction dissoute** autant que le fait non vérifié. (Détail\nde M0 dans `conseil_generatif`.)\n\n### La DÉCORRÉLATION — plusieurs axes, aucun souverain\n\n(1) sièges **typés** non interchangeables ; (2) **régimes** opposés (ancré / libre) ;\n(3) **modèles** différents si possible. Axes **orthogonaux** à cumuler ; aucun n'est « la seule\nvraie » décorrélation. Le modèle l'orchestrateur reste le défaut ; varier le modèle est un **bonus**\n(à tracer), pas une obligation. Mono-contexte ou mono-lignée de modèle = auto-critique, pas\nconsensus → **escompter la confiance**.\n\n## ÉTAPE 0 — TRIAGE (l'anti-marteau appliqué au Conseil lui-même)\n\nAvant tout : cette question mérite-t-elle le rituel, ou est-il lui-même un marteau ? Tranche un\nrégime et annonce-le en une ligne :\n- **(a) TRIVIAL / faible enjeu** → réponds simplement, sans Conseil. STOP.\n- **(b) DÉCISION / jugement, sans structure nouvelle attendue** → saute le Temps 1, va au Temps 2.\n- **(c) INTÉGRATION / SYNTHÈSE, où des composants transverses peuvent manquer** → Temps 1 puis 2.\n\nLe mode génératif (Temps 1) ne se déclenche **qu'en régime (c)** — sinon on rallume le marteau\nqu'on prétend éteindre.\n\n## LE DISPOSITIF EN DEUX TEMPS\n\n```\nÉTAPE 0 triage → [TEMPS 1 génération · jugé FÉCONDITÉ] → VALVE → [TEMPS 2 validation · jugé\nJUSTESSE & NÉCESSITÉ] → vérif chairman (#55) → VERDICT JMJ → promotion VÉRITÉ vers Semantic Scholar\n```\n\n### TEMPS 1 — GÉNÉRATION (jugée à la FÉCONDITÉ, jamais à la vérité)\n\nBut : faire apparaître les **composants transverses qui n'existent pas encore** (ponts,\nabstractions). On rend l'absent visible (en corpus, `conseil_emergences.py` localise les trous\ndu graphe déterministiquement) ; un **pontonnier** propose des hypothèses marquées ; le **filtre\nde fécondité** tranche (portée / compression discriminée / fécondité prédictive / critère\nnégatif). Ici l'anti-marteau est **INVERSÉ** : il trie sans tuer, ne punit jamais la nouveauté.\n\n→ **Détail opérato
