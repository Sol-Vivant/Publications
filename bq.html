<script id="bq-data" type="application/json">{"technique": {"analyse": {"nom": "Analyse corpus", "entries": [{"id": 55, "titre": "Faux positifs Opus récurrents", "contenu": "Claude Code est lui-même Opus — ces erreurs récurrentes doivent être détectées chez lui-même avant d'agir :\n\n1. **« Mentions problématiques dans prompts »** → SQLite LIKE est case-insensitive. `sol vivant` (scientifique) matche `Le Sol Vivant cet Holobionte` (projet). Vérifier en Python avec un match exact avant d'agir.\n\n2. **Tables droppées** → `prompt_contenus` et `term_connections` ont été remplacées. Ne pas les recréer.\n\n3. **Cross-refs `doc_source/doc_cible`** → ces colonnes contiennent des descripteurs longs, pas un bug. Les colonnes normalisées sont `doc_code_source`/`doc_code_cible`.\n\n**Règle** : ne pas agir sur un signalement sans vérification indépendante — même si c'est moi (Claude) qui ai signalé le point.\n", "type": "conseil", "crit": true}, {"id": 102, "titre": "Workflow — traitement des notes volantes (jmj/notes*.txt)", "contenu": "## Workflow — traitement des notes volantes\n\n**Fichiers concernés** : `jmj/notes*.txt`, `jmj/transcriptions/*.txt` et tout matériel brut que JMJ capture \"au pied levé\" (posts LinkedIn, abstracts, fragments de lecture).\n\n### Contexte\n\nLes notes volantes sont des captures rapides d'informations scientifiques croisées au gré des recherches de JMJ. **Elles ne sont pas sourcées de manière académique** — l'objectif de JMJ est la collecte rapide d'informations, pas leur traçabilité bibliographique. Les sources académiques viendront plus tard, **apportées par Jenni** lors de la rédaction des fiches/documents.\n\n### Règle sur les DOIs dans les notes\n\nLes DOIs qui apparaissent parfois dans les notes sont **accessoires et optionnels** :\n\n- ✅ **Utilisables** comme porte d'entrée pour une recherche web de clarification conceptuelle si Claude en a besoin pour comprendre un mécanisme cité\n- ❌ **Ne pas stocker systématiquement** dans `fiches.sources_dois` ou ailleurs\n- ❌ **Ne pas chercher à extraire tous les DOIs** d'une note pour les tracer\n- ✅ **Bibliographie de référence = `jenni_sources`**, alimentée via le pipeline Jenni → analyse .docx → attribution\n\n### Pipeline d'intégration\n\n**Étape 1 — Analyse**\nClaude lit la note, identifie les concepts scientifiques, mécanismes, taxa, molécules.\n\n**Étape 2 — Tri**\nClasser chaque note (ou segment) en :\n- 🟢 **Retenue** : apporte un mécanisme, un taxon, un concept, une hypothèse ou une donnée pertinente\n- 🟡 **Enrichissement** : complète une fiche/section existante plutôt qu'une nouveauté\n- 🔴 **Écartée** : doublon, fragment trop court sans contexte, ou vraiment sans aucun apport (rare)\n\n⚠ **Règle des pépites — ne pas confondre niveau de vulgarisation et absence d'intérêt**\n\nJMJ prend volontairement des notes de **vulgarisation** parce qu'il y a parfois des **pépites dans des hypothèses** apparemment basiques. Plusieurs concepts du corpus actuel ont été identifiés ainsi (zoom apparemment trivial qui masque une hypothèse féconde).\n\n**Le critère d'écartement n'est PAS** :\n- ❌ « niveau cours de lycée »\n- ❌ « vulgarisation grand public »\n- ❌ « pas de DOI »\n- ❌ « format LinkedIn »\n\n**Le bon critère d'écartement est** :\n- ✅ Aucune hypothèse, aucun mécanisme, aucune connexion conceptuelle, aucune donnée chiffrée nouvelle\n- ✅ Strict recopiage d'une définition académique standard sans angle particulier\n- ✅ Doublon littéral d'une note précédente\n\n**Avant d'écarter une note dite \"vulgarisation\", chercher activement** :\n- Une hypothèse formulée même implicitement\n- Un mécanisme expliqué d'un angle inhabituel\n- Une donnée chiffrée inattendue\n- Une connexion entre deux domaines (ex: gut-brain × sol)\n- Un terme/concept émergent absent du thésaurus\n\nSi **rien** de tout cela → écarter. Sinon → la note mérite d'être lue avec soin et probablement intégrée comme zoom ou enrichissement.\n\n**Étape 3 — Regroupement (clustering)**\nRapprocher les notes qui traitent d'un même thème cohérent. Une note peut nourrir plusieurs clusters si elle contient plusieurs mécanismes distincts.\n\n**Étape 4 — Synthèse**\nPour chaque cluster retenu, décider :\n- **Nouvelle fiche** si le sujet n'est pas couvert par une fiche existante\n- **Enrichissement d'une fiche existante** si scope aligné\n- **Enrichissement de `prompts.enrichissement`** d'une section si le contenu relève d'un seul document de strate\n\n**Étape 5 — Proposition utilisateur**\nPrésenter à JMJ le clustering + la proposition d'action avant toute écriture DB. JMJ valide/ajuste. Pas d'écriture sans validation.\n\n**Étape 6 — Écriture DB**\nAprès validation :\n- Créer/enrichir les fiches dans `fiches` + `fiche_sections`\n- Extraire les termes candidats → lot enrichissement thésaurus (`gen_prompt_enrichissement.py`, charte Jenni « Bloc de 10 »)\n- Éventuellement UPDATE `prompts.enrichissement` pour les sections ciblées\n\n### Ce qu'on NE fait PAS\n\n- ❌ Pas d'extraction automatique de DOIs depuis les notes (intégration consciente dans `jenni_sources` uniquement)\n- ❌ Pas d'écriture directe en DB avant validation JMJ sur le plan\n- ❌ Pas de création d'entrées terms avec définitions forgées depuis les notes — les définitions viennent de Jenni\n- ❌ Pas d'intégration de notes \"trop basiques\" (niveau cours de lycée) au corpus scientifique, même si les termes sont canoniques\n\n### Où archiver les notes déjà traitées\n\nAprès intégration complète et validation, déplacer la note vers `jmj/archives/notes_traitees/` avec un préfixe date et référence aux fiches créées, afin de tracer l'origine sans polluer le répertoire `jmj/` actif.\n\n## Contexte\n\ntraitement notes volantes JMJ\n", "type": "regle", "crit": true}, {"id": 132, "titre": "Stratégie agents Task — quand, comment, résilience", "contenu": "## Stratégie — quand et comment utiliser des agents Task\n\nTrois patterns d'usage des **agents** dans le corpus Sol Vivant. Chaque pattern\na son domaine, ses pièges, ses règles de résilience.\n\n### 1. Pattern `agent_runner` — prepare → batches → Task → consolidate\n\n**Quand :** tâche LLM répétitive sur N items indépendants (attribution sources\nsur 100 refs, audit_opus sur 50 fiches, validation RIS sur 200 entrées).\nGain : parallélisation massive + reprise sur échec partiel (batches isolés).\n\n**Comment :** utiliser `tools/lib/agent_runner.py`\n- Phase 1 : script `--prepare` écrit les batches JSON dans `tmp/<script>/batches/`\n- Phase 2 : **Claude Code lance les agents Task** lisant les batches, écrivant\n  dans `tmp/<script>/responses/`\n- Phase 3 : script `--consolidate` recharge les responses et produit l'artefact\n\n**Exemples existants :** `audit_opus.py`, `attribution.py`, `analyse_corpus.py`,\n`validate_ris.py` (tous via `lib/agent_runner.py`).\n\n**Pièges :**\n- Ne jamais appeler l'API Anthropic externe — Claude Code EST Opus (règle\n  CLAUDE.md absolue #4). L'agent Task s'exécute dans la session courante.\n- Batches trop gros → timeout. Viser < 60 s d'exécution agent par batch.\n- State.json partagé — ne pas re-préparer sans purger (cf. docstring).\n\n### 2. Pattern agents Task in-session (exploration/extraction)\n\n**Quand :** recherche ouverte dans le code (`Explore`), extraction structurée\nd'un long document, résumé d'un corpus — tâches où je n'ai pas besoin du\nrésultat immédiat en contexte ou quand ça va saturer mon contexte.\n\n**Comment :** `Agent(subagent_type='Explore'|'general-purpose', prompt=...,\nrun_in_background=True)` si je peux continuer d'autres tâches pendant.\n\n**Pièges observés 2026-04-18 :**\n- **Timeout stream idle** après ~130 s. Un agent qui démarre gros plante\n  avant d'écrire son résultat. Leçon : **écriture progressive obligatoire**\n  dans le prompt (« écris tes trouvailles au fil de l'extraction dans\n  /tmp/<file>, ne pas attendre la fin »).\n- **Pas de reprise automatique.** Si l'agent plante, tout son travail est\n  perdu sauf si le prompt l'a forcé à écrire en streaming.\n- **Limite de taille des prompts.** Plus de 1000 lignes d'instructions →\n  l'agent rate la consigne. Viser < 500 lignes.\n\n**Recette anti-timeout :**\n```\n- Briefer l'agent avec un plan en N étapes (N ≤ 6)\n- Exiger une écriture partielle (append) à la fin de CHAQUE étape\n- Demander un résumé final ≤ 300 mots (pas de restitution complète)\n- run_in_background=True quand les tâches ne sont pas bloquantes\n```\n\n### 3. Pattern lecture directe (tool use inline)\n\n**Quand :** analyse qui nécessite d'intégrer le contenu dans mon contexte\npour rédaction, synthèse, articulation avec le reste du corpus. Un agent\nTask me ferait perdre cette capacité (son résultat ne serait qu'un résumé).\n\n**Exemples :** lire un chapitre PDF, rédiger une fiche transversale à partir\nde plusieurs sources, croiser des BQ pour produire un plan.\n\n**Règle :** si je dois produire ensuite un artefact cohérent qui croise ce\nque je lis avec d'autres informations → lecture directe + Write pour\nsauvegarder au fur et à mesure (pour récupération si la session plante).\n\n### Arbitrage — quel pattern ?\n\n| Situation | Pattern |\n|---|---|\n| 50 items LLM indépendants (attribution, audit) | 1 — agent_runner |\n| Extraction structurée d'un long doc (>50 p), résultat en artefact | 2 — Task in-session (avec writes progressifs) |\n| Exploration ouverte du code, recherche ouverte | 2 — Task Explore |\n| Rédaction qui nécessite intégration contextuelle | 3 — lecture directe |\n| Tâche parallélisable où je peux faire autre chose | 2 — Task en background |\n| Artefact unique long (fiche, synthèse) | 3 — lecture + Write progressif |\n\n### Principes transverses\n\n1. **Sauvegarder tôt, sauvegarder souvent.** Tout travail long doit laisser\n   une trace persistante (fichier `/tmp/<work>.md`, ou commit git) au plus\n   tard à mi-parcours. Le timeout Anthropic peut survenir à tout moment.\n\n2. **Ne pas déléguer la compréhension.** Un agent Task ne doit pas recevoir\n   de prompt du type « analyse X puis fais Y » — je dois faire la synthèse\n   moi-même. L'agent extrait, classe, compte. Moi je conclus.\n\n3. **Pas de chaîne d'agents profonde.** Un agent ne devrait pas lancer un\n   autre agent (risque de timeout cascade). Je suis le chef d'orchestre.\n\n4. **Contexte vs parallélisme.** Chaque agent Task a un contexte frais —\n   brief complet dans le prompt, pas de référence à « ce qu'on a dit tout à\n   l'heure ». C'est une feature, pas un bug.\n\n5. **Post-mortem après crash.** Quand un agent plante (timeout, erreur) :\n   - Vérifier ce qui a été écrit sur /tmp/\n   - Raccourcir le périmètre si nécessaire\n   - Relancer avec writes plus fréquents\n\n### Anti-pattern : agents un-a-un au lieu d'agent_runner (incident 2026-04-20)\n\nSession 2026-04-20 : lancement de 27 agents Task individuels pour analyse\nde fiches, au lieu d utiliser `tools/lib/agent_runner.py`. Consequences :\n\n- 27 messages separes, chaque agent pollue le contexte avec son prompt\n  (resume puis resultat) alors que le pattern agent_runner garde les\n  responses hors contexte (`responses/<cid>.json`).\n- Pas de reprise possible si un agent plante a mi-parcours.\n- Parallelisation artisanale (4 a la fois) au lieu de parallele massif\n  dans un seul message.\n- Trois formats de JSON differents produits par les agents (strict, wrap\n  `{sections: ...}`, liste), forcant un normalisateur cote consolidation\n  qui aurait ete evite par un prompt centralise.\n\nCorrection : creation de `tools/admin/analyse_fiches.py` (prepare +\nconsolidate) pour basculer les fiches restantes sur le bon pattern.\n\n**Declencheur mental** : des que j'identifie une tache avec > 5 items LLM\nindependants, avant de lancer le premier agent, penser 'agent_runner'.\nCf. claude_rules.agent_runner_reflexe (affichee a chaque session_start).\n", "type": "doctrine", "crit": true}, {"id": 140, "titre": "Workflows d analyse — pattern unifie agent_runner", "contenu": "## Workflows d'analyse — pattern unifie agent_runner\n\nToute tache d'analyse repetitive sur N items (fiches, sources, sections,\ndocs, termes) suit le **meme pattern en 3 phases**. Centralisation de\ntoutes les recettes et composants reutilisables.\n\n### Principe\n\n```\n[donnees DB] -> --prepare -> batches/<cid>.json\n               |                  |\n               |          agents Task paralleles (Claude Code, un seul message)\n               |                  |\n               |                  v\n               |           responses/<cid>.json\n               |                  |\n               -> --consolidate -> [DB enrichie / artefact final]\n```\n\n**Ne JAMAIS** lancer les agents un par un via plusieurs messages successifs\n(cf. anti-pattern BQ #132 section finale).\n\n### Scripts partages\n\n| Module | Role |\n|--------|------|\n| `tools/lib/agent_runner.py` | `prepare_batches()` + `load_responses()` |\n| `tools/lib/repair_json.py` | Robustesse parsing JSON d'agents |\n\n### Exemples en production\n\n| Script | Domaine | Format entree | Format sortie |\n|--------|---------|---------------|---------------|\n| `tools/batch/analyse_corpus.py` | Audit modulaire corpus (T1-T2, S1-S2, C1-C2, K1-K2, B1) | 1 batch par passe | JSON rapport par passe |\n| `tools/batch/audit_opus.py` | Audit structure fiches (~50) | 1 batch par fiche | JSON per-fiche |\n| `(module archivé)` | Attribution `jenni_sources` ~100 refs | 1 batch par ref | JSON attribution |\n| `(module archivé)` | Validation RIS ~200 entrees | 1 batch par entree | JSON validation |\n| `tools/admin/analyse_fiches.py` | Extraction consciente fiches (formules, chiffres, cards, termes candidats) | 1 batch par fiche | JSON par section `{<ordre>: {chiffres_cles, formules, termes_candidats, cards_liees, fiches_liees}}` |\n\n### Recette prompt type pour extraction\n\nLe prompt d'un agent d'analyse DOIT contenir :\n\n1. **Cible explicite** (fiche_id, source_id, ou autre)\n2. **Doctrine rappelee** : \"extraction uniquement, zero redaction\"\n   (reference CLAUDE.md BQ #136 pas_agent_redacteur)\n3. **Format de sortie strict** (JSON avec schema documente) — toujours le\n   MEME format pour que `--consolidate` puisse parser sans normaliseur.\n4. **Commandes SQL pretes a copier-coller** pour l'exploration\n5. **Un modele reference en DB** (\"la fiche #23 a son analyse_claude, consulte-la\")\n6. **Regles concretes** : motifs concrets pas generiques, verifier absence\n   thesaurus avant proposer candidat, etc.\n7. **Output attendu exact** : chemin fichier + resume max 5 lignes\n\n### Anti-patterns frequents\n\n- **Wrapper JSON** : l'agent produit `{\"fiche_id\": X, \"sections\": [...]}`\n  au lieu du schema strict `{\"<ordre>\": {...}}`. Prevention : exemple\n  literal dans le prompt + instruction \"PAS DE WRAPPER\".\n- **Liste au lieu de dict** : l'agent produit `[{ordre:0,...}, ...]`.\n  Prevention : instruction \"cles = ordre (str)\".\n- **Redaction subreptice** : motifs des cards_liees deviennent des resumes\n  rediges. Prevention : \"motif = ce que la section APPORTE, verbe au\n  present indicatif, ≤ 15 mots\".\n- **Cards 'archive' melangees avec 'active'** : rappeler `status='active' UNIQUEMENT`.\n\n### Declencheurs mentaux (pour moi, Claude)\n\n- \"J'ai N fiches / sources / termes a traiter\" avec N > 5\n  → reflexe agent_runner\n- \"Je vais lancer un Agent() pour chaque item\"\n  → STOP, utilise agent_runner (prepare + parallel + consolidate)\n- \"Chaque agent doit retourner du JSON structure\"\n  → agent_runner garde responses hors du contexte principal\n\n### Stockage des resultats d'analyse\n\n| Artefact | Destination |\n|----------|-------------|\n| Extraction par fiche/section | `fiche_sections.analyse_claude` (JSON) |\n| Extraction par source | `jenni_sources.notes_claude` ou table dediee |\n| Rapports d'audit corpus | `audit_reports/<theme>_<date>.md` |\n| Rapport de session | `jmj/rapports/session/rapport_YYYY-MM-DD.md` |\n\n### Voir aussi\n\n- BQ #132 \"Strategie agents Task — quand/comment/resilience\" (doctrine generale)\n- BQ #136 \"Pas d'agents redacteurs\" (regle absolue sur les limites)\n- `claude_rules.agent_runner_reflexe` (affichee a chaque session_start)\n\n### Recette anti-timeout `analyse_corpus.py` (session 2026-04-21)\n\nConstat : run complet (9 passes) sur le corpus entier avec `max_ctx_analyse_corpus=55000` :\n\n| Passe | Contexte brut | Contexte livré agent | Résultat |\n|---|---|---|---|\n| T1 | thes + secs = 532 k chars | 110 k (truncate) | **stream idle timeout** × 2, même avec progressive writes |\n| K1 | cascade + secs | 88 k | OK mais 22 min |\n| S1 / C1 | secs / chains | 56-74 k | **timeout** 1er tour, OK après relance progressive |\n| T2, S2, C2, K2, B1 | variable | 55-110 k | OK 1er tour mais **corpus amputé** |\n\n**Cause racine** : `truncate(text, max_chars=55000)` coupe au milieu du payload. Avec `max_ctx_analyse_corpus=55000` :\n- Thésaurus complet = ~450 k chars (def + syn + BT/RT) → agents voient **12 %**\n- Sections complètes (18 docs) = 81 k chars → agents voient 12 docs sur 18 (6 docs absents : P3 P4 P5 S0 S1 S2)\n\n**Patch appliqué** (T1 uniquement, session 2026-04-21) :\n\n1. **Index thésaurus condensé** : au lieu de passer le thésaurus complet avec définitions/BT/RT, construire un index `id + [strate] + fr / syn_en` (70 k chars pour 1071 termes). Suffit pour vérifier présence/absence d'un terme.\n2. **Sections complètes** : appeler `extract_sections(con)` en direct pour avoir les 18 docs entiers (81 k chars).\n3. **Split par groupes de docs** : T1 éclaté en T1a (F+H, 5 docs, 90 k) / T1b (P, 5 docs, 92 k) / T1c (S, 5 docs, 98 k) / T1d (V, 3 docs, 85 k). Chaque sous-batch sous la limite de timeout (≈ 5-7 min agent).\n4. **Fusion responses T1a-d → T1_completude.json** avant `--consolidate`.\n\n**Généralisation recommandée** (non encore appliquée au script, à faire) :\n- Passer `max_ctx_analyse_corpus` à 90 000 pour éviter la troncature des sections (81 k suffisent).\n- Pour T1/T2/B1 qui consomment le thésaurus : basculer sur un mode `index` (id+fr+syn_en) avec définitions disponibles via un second helper si l'agent veut creuser. Économise 90 % du contexte thésaurus sans perte de capacité de détection.\n- Pour T1 : ajouter un flag `--split-by-strate` qui produit 4 batches au lieu d'1 (F+H / P / S / V). Sortie : 4 responses à fusionner dans le consolidate.\n- Pour S1 / S2 / K1 qui utilisent beaucoup les sections : même pattern de split par strate en cas de timeout (pas obligatoire, selon volume DB).\n\n**Écriture progressive pour ces passes** : dans le prompt agent, exiger `Write tmp/analyse_corpus/responses/<cid>.json après chaque doc traité` avec JSON partiel cumulatif. Garantit un résultat partiel même si timeout à mi-parcours. Pattern appliqué avec succès sur C1 (2 min → 9 min 17 min) et T1a-d.\n\n**Règle** : dès qu'un batch dépasse 80 k chars utiles **ET** fait de l'analyse cross-section (pas juste extraction d'un item), prévoir le split ou l'écriture progressive. 80 k chars utiles ≈ limite où un agent tient en 5-10 min.\n", "type": "workflow", "crit": true}, {"id": 155, "titre": "Audit du thésaurus — doctrine et workflow", "contenu": "## Audit du thésaurus — doctrine et workflow\n\nL'audit du thésaurus est un **chantier conscient** qui s'appuie sur un ensemble fini d'objectifs et de contrôles, exécutés à intervalles réguliers ou avant un cycle d'envoi Jenni majeur. Le thésaurus étant l'ossature lexicale du corpus (BQ `redaction_documents_jenni` #146 §H), une dérive lexicale ou des relations cassées se propagent dans tous les prompts produits. Cet audit n'est pas un simple `check_integrity` : il requiert lecture, croisements et arbitrage éditorial.\n\n### Objectifs canoniques\n\n| Axe | Objectif | Sortie attendue |\n|---|---|---|\n| **A. Nouveaux termes candidats** | Extraire les concepts mobilisés dans les fiches intégrées récentes / les retours Jenni mais absents du thésaurus | Liste triée par strate, prête pour un cycle d'enrichissement (workflow BQ `thesaurus_workflow` #116) |\n| **B. Termes incomplets** | Identifier les termes en DB sans définition, sans EN, sans synonymes, sans BT/RT — et les classer par priorité | Liste docx « bloc de 10 » à passer par Jenni via `export_thesaurus_incomplets.py` |\n| **C. Relations cassées** | Vérifier la cohérence des BT/NT/RT : orphelines, doublons latents, polysémie, casses incohérentes | Rapport markdown d'arbitrages éditoriaux (à valider JMJ) |\n| **D. Doublons latents** | Détecter les `fr` qui sont des synonymes d'un autre terme, les variantes orthographiques, les acronymes qui collisionnent (`MO` vs `Mo`) | Liste de fusions candidates avec scoring qualité |\n| **E. Méta-vocab dans définitions** | Scanner les `terms.definition` à la recherche de fuites (`corpus`, `strate`, `card #N`, codes doc) | 0 toléré — UPDATE direct |\n| **F. Pseudoscience** | Vigilance BQ `sujets_interdits_corpus` #154 : termes biodynamie/Steiner non flaggés, relations valorisantes | Suppression ou flag (cf. incident 2026-04-23) |\n| **G. Anglicismes en strate FR** | Détecter `terms.fr` qui sont des termes anglais déguisés (140 cas constatés 2026-04-14) — nuisent au cycle Jenni | Audit + correction au cas par cas (taxons exclus) |\n| **H. Couverture par strate** | S'assurer que chaque strate F/S/V/P/H a une couverture lexicale équilibrée vs les sections de prompts | Rapport quantitatif (n termes par strate, ratio terms/section) |\n\n### Cards comme outil d'audit du thésaurus\n\nLes **concept cards** (BQ `concept_cards_filtre` #106 — rôle 5 « audit / stress-test ») servent de filtre amont : un terme candidat issu d'une fiche doit être confronté aux cards de la dimension correspondante avant d'être proposé pour enrichissement. Si aucune card existante ne contient le concept ou si une card en `archive` (mémoire de rejet) le contredit, le candidat est mis en attente jusqu'à arbitrage.\n\n```sql\n-- Cards 'active' qui mentionnent un concept (recherche large)\nSELECT id, title, dimension_id, status FROM concept_cards\nWHERE status='active' AND (lower(title) LIKE '%<concept>%' OR lower(description) LIKE '%<concept>%');\n\n-- Cards 'archive' qui rejettent un concept proche (mémoire de rejet)\nSELECT id, title, notes FROM concept_cards\nWHERE status='archive' AND lower(description) LIKE '%<concept>%';\n```\n\n### Pipeline d'audit en 5 passes (pattern `agent_runner`)\n\nL'audit thésaurus est éclaté en passes modulaires alignées avec `tools/batch/analyse_corpus.py` (BQ `wf_analyse` #140), pour permettre la parallélisation et la reprise après timeout.\n\n| Passe | Code | Objectifs | Contexte agent | Risque timeout |\n|---|---|---|---|---|\n| **T1** | Complétude | Termes vs sections : termes incomplets (B), nouveaux candidats (A), couverture (H) | Sections complètes (~81 k) + index thésaurus condensé (~70 k) | **Élevé** — split obligatoire par strate |\n| **T2** | Doublons | Doublons latents (D), relations (C), pseudoscience (F) | Thésaurus complet par strate + relations | Modéré |\n| **B1** | Biblio | Couverture refs par terme (jenni_sources / source_usages) | Thésaurus + biblio | Modéré |\n| **A1** | Anglicismes | Anglicismes en strate FR (G) — `audit_anglicismes.py` | Thésaurus FR seul | Faible |\n| **M1** | Méta-vocab | Leaks méta-vocab dans définitions (E) — scan regex inline | Thésaurus.definition seul | Très faible (scan local) |\n\n### Anti-timeout — règles opérationnelles\n\nCf. BQ `wf_analyse` #140 §recette anti-timeout. Spécifique au thésaurus :\n\n1. **Index condensé** : ne JAMAIS passer le thésaurus complet (def + BT + RT = ~450 k chars). Construire un index `id + [strate] + fr / syn_en / type` (~70 k chars pour 1071 termes). Définitions à la demande seulement, via second helper.\n2. **Split par strate** pour T1 : éclater en T1a (F+H) / T1b (P) / T1c (S) / T1d (V). 4 batches → fusion responses → consolidate.\n3. **Écriture progressive obligatoire** dans tous les prompts agent : `Write tmp/audit_thesaurus/responses/<cid>.json après chaque sous-batch traité`. Garantit un résultat partiel même si timeout à mi-parcours.\n4. **Limite dure** : 80 k chars utiles par agent → au-delà, split obligatoire.\n\n### Scripts dédiés\n\n| Script | Rôle | Pattern |\n|---|---|---|\n| `tools/admin/check_integrity.py` | Sanity check rapide (FK, doublons schema) | Direct (pas d'agent) |\n| `tools/admin/audit_anglicismes.py` | Passe A1 (anglicismes en strate FR) | Direct |\n| `tools/admin/check_forbidden_jenni.py` | Passe M1 (méta-vocab dans définitions + tout contenu Jenni) | Direct |\n| `tools/admin/audit_sources_orphelines.py` | Sources sans DOI/URL (B1 partiel) | Direct |\n| `tools/batch/analyse_corpus.py --type thesaurus` | Passes T1 + T2 (passes lourdes) | `agent_runner` parallèle |\n| `tools/jenni/export_thesaurus_incomplets.py` | Sortie axes B (incomplets) → docx Jenni | Direct |\n| `tools/admin/dedupe_thesaurus.py` | Axe D (déduplication) | Direct + scoring |\n\n### Cadence et déclencheurs\n\n- **Cadence régulière** : audit complet toutes les **3-5 sessions**, ou systématiquement avant une consolidation thésaurus (envoi de listes Jenni > 50 termes).\n- **Déclencheurs immédiats** :\n  - Après un import massif (lot de termes Jenni > 30 entrées) → re-passe T2 + axes C/D\n  - Après une fusion ou suppression de termes → re-passe relations (C)\n  - Après une fiche intégrée → extraire termes mobilisés, comparer aux candidats (A)\n  - Après une session Jenni qui a touché à des relations BT/RT → axe C\n- **Avant tout commit `--apply`** d'un import thésaurus : passes M1 (méta-vocab) + F (pseudoscience) obligatoires.\n\n### Sortie consolidée\n\nRapport unique `jmj/rapports/audit/audit_thesaurus_<date>.md` avec une section par axe (A→H) + section synthétique « actions priorisées ». Format aligné sur `audit_corpus_<date>.md` (BQ `audit_corpus`).\n\n```\n# Audit thésaurus — <date>\n## A. Nouveaux termes candidats (N)\n## B. Termes incomplets (N) — par priorité\n## C. Relations cassées (N orphelines, N doublons, N polysémie)\n## D. Doublons latents (N candidats fusion)\n## E. Méta-vocab leaks (N occurrences) — UPDATE direct\n## F. Pseudoscience (N occurrences flag/suppression)\n## G. Anglicismes en strate FR (N termes à corriger)\n## H. Couverture par strate (tableau quantitatif)\n## Synthèse — actions priorisées (top 10)\n```\n\n### Règles d'arbitrage\n\n1. **Pas d'INSERT direct** des termes candidats issus d'extractions (cf. BQ #147 anti-pattern). Les axes A et B alimentent le **workflow Jenni standard** (`export_thesaurus_incomplets.py` ou `gen_prompt_thesaurus.py`), Jenni rédige les définitions, retour via `import_termes_jenni.py`.\n2. **Pas de modification automatique de `terms.fr`** (BQ #146 §H.4 et `claude_rules.pas_modif_fr_canonique`). Toute correction casse/ponctuation sur `fr` passe par validation JMJ explicite.\n3. **Cards confrontées avant proposition** (BQ #106 + `claude_rules.audit_cards_first`) : un nouveau terme candidat doit avoir au moins une card `active` qui le justifie ou le contextualise. Sans card, c'est une affirmation orpheline.\n4. **Audit log systématique** : chaque action correctrice (UPDATE, DELETE, INSERT) trace dans `audit_log` avec `operation`, `table_name`, `record_ref`, `detail`.\n\n### Anti-patterns confirmés\n\n- **Pas d'agent Task pour rédiger les définitions** des termes candidats (BQ #136). Extraction → liste → Jenni rédige.\n- **Pas de scan régex « tout-en-un »** sur le thésaurus complet — séparer les axes (A/B/C/D/E/F/G/H) pour traçabilité et reprise partielle.\n- **Pas de re-passe complète après chaque correction mineure** — batch les corrections puis re-audit ciblé.\n- **Pas d'oubli des orphelines BT/RT** après import — re-résolution périodique obligatoire (gain 5-10 % par passe, BQ #146 §H.2).\n\n### Voir aussi\n\n- BQ `audit_corpus` (#156) — pendant côté corpus (chaînes, cards, fiches)\n- BQ `wf_analyse` (#140) — pattern agent_runner unifié\n- BQ `strategie_agents` (#132) — anti-timeout, écriture progressive\n- BQ `thesaurus_workflow` (#116) — workflow import/export complet\n- BQ `redaction_documents_jenni` (#146) — règles de rédaction + §H thésaurus\n- BQ `concept_cards_filtre` (#106) — cards comme filtre + outil d'audit\n- BQ `sujets_interdits_corpus` (#154) — biodynamie/Steiner exclus\n- BQ `pas_agent_redacteur` (#136) — règle absolue rédaction\n- BQ `audit_integrite_db` (#74) — sanity check DB technique\n", "type": "workflow", "crit": true}, {"id": 156, "titre": "Audit du corpus — chaînes causales, concept cards, fiches", "contenu": "## Audit du corpus — chaînes causales, concept cards, fiches\n\nL'audit du corpus est le **chantier conscient** qui éprouve la cohérence narrative et scientifique des artefacts éditoriaux : chaînes causales, concept cards, fiches. Distinct de l'audit thésaurus (BQ `audit_thesaurus`) qui éprouve l'ossature lexicale, et de l'audit d'intégrité (BQ #74) qui éprouve les FK et schémas, cet audit éprouve la **doctrine** : ce que le corpus affirme tient-il debout ?\n\n### Objectifs canoniques\n\n| Axe | Objectif | Sortie attendue |\n|---|---|---|\n| **C1. Chaînes causales — étapes nourries** | Vérifier que chaque étape (`chain_etapes`) a son `term_id`, son `role_dans_chaine` rédigé, sans placeholder résiduel `[XX]` | Rapport par chaîne (Cn → étapes complètes vs trous) |\n| **C2. Chaînes causales — étapes orphelines / à enrichir** | Identifier les étapes peu nourries par le corpus (fiches/cards qui ne renvoient pas à la chaîne), proposer enrichissement | Liste des étapes à étoffer + cards/fiches candidates |\n| **C3. Chaînes causales — nouvelles chaînes implicites** | Détecter les enchaînements causaux mentionnés dans plusieurs fiches sans qu'une chaîne formalisée les capture | Propositions de nouvelles chaînes Cn+1, Cn+2, … |\n| **K1. Concept cards — santé de la collection** | Inventaire actives vs archives, cohérence dimension, links manquants, cards orphelines (sans terrain_test, sans link, sans pedago_link) | Tableau santé par dimension |\n| **K2. Concept cards — confronter aux fiches récentes** | Pour chaque fiche `integre*` récente, vérifier que les cards de score ≥ 5 ont reçu `[Apport fiche #N]` dans `notes` (cf. BQ #147 phase 4bis) | Liste des renforcements omis |\n| **K3. Concept cards — contradictions doctrinales** | Vérifier explicitement les `concept_card_links.link_type='contradicts'` (BQ `cards_contradictions` #112) — pas d'heuristique texte | Rapport des contradictions actives à arbitrer |\n| **K4. Cards comme filtre amont** | Vérifier qu'aucune fiche `integre*` ne porte une affirmation contredite par une card `archive` (mémoire de rejet) | Alertes éditoriales pour relecture JMJ |\n| **F1. Fiches — intégrité contenu** | `fiche_contenus.contenu_integre` rempli pour les `integre*`, `refs` cache cohérent avec `source_usages` | Liste des fiches avec dette technique |\n| **F2. Fiches — articulation entre fiches** | Détecter les fiches qui se recouvrent sans articulation explicite dans `fiches.notes` (`[Articulation fiche #N]`) | Propositions de cross-références |\n| **F3. Fiches — propagation vers prompts docs cibles** | Pour chaque fiche `integre*`, vérifier que `prompts.contexte_sci` ou `.enrichissement` des `docs_cibles` mentionne le sujet | Liste des propagations omises |\n| **F4. Fiches — anglicismes résiduels** | Scan `audit_anglicismes.py` sur graines + contenu intégré | 0 anglicisme non glosé |\n\n### Concept cards comme outil d'audit (rôle 5 — BQ #106)\n\nLes concept cards sont **un instrument d'audit double** :\n\n1. **Filtre amont** (production) : `claude_rules.audit_cards_first` — avant toute création de fiche, terme, validation, Claude lance `SELECT FROM concept_cards WHERE …` sur les keywords du domaine. Si une card `active` couvre le sujet → enrichir cette voie. Si une card `archive` rejette une affirmation proche → renoncer ou justifier la rupture.\n\n2. **Stress-test aval** (audit) : confronter chaque artefact éditorial du corpus aux cards correspondantes. Cette confrontation produit :\n   - Des **alertes éditoriales** (axe K4) quand une affirmation dans une fiche entre en tension avec une card de la même dimension.\n   - Des **propositions de renforcement** (axe K2) quand une fiche apporte de la matière à une card existante (synthèse 3-5 lignes dans `concept_cards.notes`).\n   - Des **propositions de nouvelles cards** quand une fiche mobilise un mécanisme/concept récurrent que le réseau actuel ne capture pas.\n   - Des **liens `concept_card_links`** à tisser explicitement (`completes`, `contradicts`, `prerequisite`, `derives_from`, `related_to`, `supersedes`, `example_of`).\n\nL'audit doit produire un récap des cards-hubs (cards les plus citées via `pedago_links`, BQ #151) et des cards-orphelines (jamais référencées) pour décision : enrichir, articuler, ou archiver.\n\n### Chaînes causales comme outil d'audit\n\nLes chaînes (BQ `chaines_doctrine` #144) sont **les démonstrations transverses** du corpus. L'audit éprouve :\n\n- Chaque chaîne a-t-elle ses étapes complètement rédigées (pas de placeholder, term_id obligatoire) ?\n- Les fiches récemment intégrées **nourrissent-elles** des étapes existantes (mention « voir fiche #N » dans `chain_etapes.role_dans_chaine`) ?\n- Y a-t-il des **chaînes implicites** dans le corpus que la collection actuelle ne formalise pas (axe C3) ?\n- Les cards de chaque dimension sont-elles connectées à au moins une chaîne via `card_chain_links` ?\n\n```sql\n-- Audit étapes incomplètes (placeholders)\nSELECT chain_id, position, term_fr_text FROM chain_etapes\nWHERE term_id IS NULL OR term_fr_text LIKE '[%' OR role_dans_chaine LIKE '%[%]%';\n\n-- Audit term_fr_text désynchronisé de terms.fr\nSELECT ce.chain_id, ce.position, ce.term_fr_text, t.fr\nFROM chain_etapes ce JOIN terms t ON t.id=ce.term_id\nWHERE ce.term_fr_text != t.fr;\n\n-- Cards d'une dimension sans aucune chain_etapes liée\nSELECT cc.id, cc.title FROM concept_cards cc\nLEFT JOIN card_chain_links ccl ON ccl.card_id=cc.id\nWHERE cc.status='active' AND cc.dimension_id=<N> AND ccl.card_id IS NULL;\n```\n\n### Pipeline d'audit en 7 passes (pattern `agent_runner`)\n\nL'audit corpus est éclaté en passes modulaires alignées avec `tools/batch/analyse_corpus.py` (BQ `wf_analyse` #140).\n\n| Passe | Code | Objectifs | Contexte agent | Risque timeout |\n|---|---|---|---|---|\n| **S1** | Sections/contradictions | Cohérence inter-sections (contradictions de fond entre fiches) | Sections + fiches `integre*` | **Élevé** — split par strate |\n| **S2** | Source unique | Concept défini une seule fois (pas de doublon thésaurus/section) | Sections + thésaurus condensé | Modéré |\n| **C1** | Chaînes documentées | Étapes vs sections : maillons effectivement étayés | Chaînes + sections | Modéré |\n| **C2** | Nouvelles chaînes | Détection chaînes implicites depuis sections | Sections + cards | Modéré |\n| **K1** | Cascade N0-N5 | Couverture cascade biophysique / coûts cachés / autres méta-cascades | Cascades + sections | Modéré |\n| **K2** | Mapping cards | Mapping concept_cards ↔ sections (cards orphelines, sections sans card) | Cards + sections | Modéré |\n| **B1** | Couverture refs | Couverture refs par section (via tags db_meta) | Sections + jenni_sources | Modéré |\n\nPour chaque fiche intégrée, l'audit ajoute un **mini-pipeline « phase 4bis »** (BQ `wf_fiche_integration` #147) :\n- Cards à renforcer (K2 ciblé)\n- Fiches en cours impactées (alerte JMJ)\n- Prompts docs cibles (F3)\n\n### Anti-timeout — règles opérationnelles\n\nCf. BQ `wf_analyse` #140 §recette anti-timeout. Spécifique au corpus :\n\n1. **Index sections condensé** : pour les passes K1/K2 qui croisent cards × sections, passer un index `{section_key, doc_code, titre, contexte_sci, enrichissement, mots-clés extraits}` (~50 k chars) au lieu des sections complètes.\n2. **Cards condensées** : pour les passes qui croisent fiches × cards, passer un index `{id, dimension_id, status, title, description (300 chars max), notes (last 500 chars)}` (~30 k chars pour 56 cards).\n3. **Split par strate ou par dimension** pour S1/K2 : éclater par strate F/S/V/P/H ou par dimension de cards.\n4. **Écriture progressive obligatoire** : `Write tmp/audit_corpus/responses/<cid>.json après chaque sous-batch traité`.\n5. **Limite dure** : 80 k chars utiles par agent → au-delà, split obligatoire.\n\n### Scripts dédiés\n\n| Script | Rôle | Pattern |\n|---|---|---|\n| `tools/admin/audit_fiches.py` | Audit fiches `integre*` (axes F1-F2) | Direct |\n| `tools/admin/audit_anglicismes.py` | Axe F4 (anglicismes graines + contenu) | Direct |\n| `tools/admin/check_integrity.py` | Sanity check FK chaînes/cards | Direct |\n| `tools/admin/check_forbidden_jenni.py` | Méta-vocab dans contenus destinés à Jenni | Direct |\n| `tools/admin/analyse_fiches.py` | Extraction consciente par fiche (formules, chiffres, cards, candidats) | `agent_runner` |\n| `tools/batch/analyse_corpus.py --type sections|chaines|cascade|biblio` | Passes S1/S2/C1/C2/K1/K2/B1 | `agent_runner` parallèle |\n\n### Cadence et déclencheurs\n\n- **Cadence régulière** : audit complet toutes les **3-5 sessions**, ou systématiquement avant un consolidé éditorial majeur (publication, revue de corpus).\n- **Déclencheurs immédiats** :\n  - Après une intégration de fiche → mini-audit phase 4bis (cf. BQ #147)\n  - Après création/refonte d'une chaîne → passes C1 + C2 + K2\n  - Après une revue JMJ qui touche aux paradigmes → relecture des cards de la dimension concernée + axe K4\n  - Avant un envoi Jenni d'une fiche dont le sujet a déjà des cards `archive` → axe K4 obligatoire (sinon risque d'envoyer un sujet déjà rejeté)\n\n### Sortie consolidée\n\nRapport unique `jmj/rapports/audit/audit_corpus_<date>.md` avec une section par axe + section synthétique « actions priorisées ». Format aligné sur `audit_thesaurus_<date>.md`.\n\n```\n# Audit corpus — <date>\n## C1. Chaînes — étapes nourries (N chaînes complètes / N total)\n## C2. Chaînes — étapes à enrichir (top 10 par priorité)\n## C3. Chaînes — nouvelles chaînes implicites (N propositions)\n## K1. Cards — santé de la collection (par dimension)\n## K2. Cards — renforcements omis post-fiche (N alertes)\n## K3. Cards — contradictions actives (N à arbitrer)\n## K4. Cards — alertes éditoriales (fiches vs archives)\n## F1. Fiches — intégrité contenu (N en dette technique)\n## F2. Fiches — articulation manquante (N propositions)\n## F3. Fiches — propagation prompts docs cibles (N omises)\n## F4. Fiches — anglicismes résiduels (N occurrences)\n## Synthèse — actions priorisées (top 10)\n```\n\n### Règles d'arbitrage\n\n1. **Cards comme dernière instance** (BQ #106) : si l'audit produit une alerte éditoriale (axe K4), Claude propose une note d'arbitrage mais **ne modifie ni la fiche ni la card** sans validation JMJ explicite. Une affirmation bancale n'est pas corrigée à l'aveugle.\n2. **Pas de fusion automatique de chaînes** — toute fusion ou suppression d'une chaîne passe par JMJ. Les axes C2/C3 produisent des **propositions**, pas des actions.\n3. **Pas de tissage automatique de `concept_card_links.contradicts`** (BQ #112) — analyse sémantique humaine requise. Les contradictions détectées par l'audit sont signalées comme alertes K3 avec justification, JMJ tisse explicitement.\n4. **Audit log systématique** : chaque modification (UPDATE notes card, INSERT link, UPDATE chaîne) trace dans `audit_log`.\n5. **Phase 4bis obligatoire post-intégration** (BQ #147) : un audit corpus ne remplace pas la phase 4bis qui doit être faite à chaque intégration de fiche, et qui produit elle-même un audit croisé fiche.\n\n### Anti-patterns confirmés\n\n- **Pas d'agent Task pour rédiger les rôles de chaînes ou les notes de cards** (BQ #136). L'agent extrait, classe, propose ; Claude+JMJ rédige.\n- **Pas d'heuristique texte pour les contradictions de cards** (BQ #112) — uniquement liens explicites `contradicts`.\n- **Pas d'audit en bloc des 50 fiches dans un seul agent** — split par lot ou par strate (BQ #140 §recette anti-timeout).\n- **Pas de batch INSERT de cards depuis le retour Jenni** — les cards sont créées par Claude/JMJ après filtre conscient, jamais par Jenni.\n- **Pas d'oubli de la phase 4bis** d'une intégration récente — un audit corpus régulier détecte les omissions (axe K2, F3).\n\n### Voir aussi\n\n- BQ `audit_thesaurus` (#155) — pendant côté thésaurus\n- BQ `audit_integrite_db` (#74) — sanity check DB technique\n- BQ `concept_cards_filtre` (#106) — cards filtre + outil d'audit (rôle 5)\n- BQ `cards_contradictions` (#112) — règle contradictions explicites uniquement\n- BQ `chaines_doctrine` (#144) — concept, structure, workflow chaînes\n- BQ `wf_analyse` (#140) — pattern agent_runner unifié\n- BQ `strategie_agents` (#132) — anti-timeout, écriture progressive\n- BQ `wf_fiche_integration` (#147) — phase 4bis post-intégration fiche\n- BQ `pedago_links` (#151) — passerelles pédagogiques entité ↔ card\n- BQ `pas_agent_redacteur` (#136) — règle absolue rédaction\n", "type": "workflow", "crit": true}]}, "archivage": {"nom": "Archivage post-intégration", "entries": [{"id": 125, "titre": "Structure `recherches/` — rangement canonique", "contenu": "## Structure des dossiers de travail `recherches/`\n\n**Source unique** pour tout ce qui est \"document de travail en cours ou\nhistorique\" lié au corpus. Publications/recherches n'existe plus (éliminé\nle 2026-04-14 pour cause de doublon).\n\n### Arborescence canonique\n\n### Biblio PDF JMJ : `jmj/pdf/`\n\nBiblio PDF personnelle de JMJ (poussée sur le repo). Contient les publications académiques, rapports et ressources de référence en PDF que JMJ a rassemblés. Exemples : Shift Project PREF, Kirkby et al. 2016, rapports Triple Performance (Arvalis), guides techniques (Maraîchage Sol Vivant, bilan humique AMG), etc.\n\nUtilisation par Claude : **lecture directe via l'outil Read** (fonction PDF native, avec `pages` pour PDF > 10 pages). Extraire les valeurs chiffrées, paramètres, tableaux pour enrichir `ref_*` tables + `jenni_sources`. Ne jamais copier-coller le contenu dans des fichiers — extraction ciblée et ancrage en DB (comme pour `refs (kind=esclave_energ)` depuis `jmj/pdf/PREF_Shift-Project_Transition-robuste_14-avril-2026.pdf`).\n\n### Arborescence canonique\n\n```\njmj/\n├── pdf/                 # Biblio PDF JMJ (publications académiques, rapports, guides)\n├── archives/            # Documents de travail JMJ (docx, notes, drafts)\n├── session/             # Snapshots DB inter-sessions\n├── analyses/            # Rapports d'audit générés\n└── journaux/            # Journaux de session\n\nrecherches/\n├── fiches/              # Prompts docx fiches en cours (envoye / a_faire)\n├── thesaurus/           # Enrichissement thesaurus (Jenni) :\n│                         #   - thesaurus___strate_*.docx (retours Jenni avec nouveaux termes)\n│                         #   - thesaurus_incomplets_strate_*.docx (listes à compléter)\n│                         #   - enrich_thesaurus_<axe>_<strate>_YYYY-MM-DD.docx (lots export par gen enrich_thesaurus.py)\n├── audits/              # Rapports et audits (mismatches INRAE, sources orphelines, etc.)\n├── sources/             # Exports RIS biblio interne (sources_incomplete_*.ris)\n└── archives/\n    ├── fiches/          # Fiches traitées (statut integre ou archive)\n    ├── thesaurus/       # Thesaurus traités (à venir)\n    └── prompts_validation/  # Anciens prompts validation archivés\n```\n\n### Règle de rangement\n\n| Ce qu'on produit | Où le ranger |\n|---|---|\n| Prompt docx d'une fiche technique/transversale | `recherches/fiches/` |\n| Retour Jenni thesaurus strate X | `recherches/thesaurus/thesaurus___strate_X.docx` |\n| Docx d'une strate à compléter | `recherches/thesaurus/thesaurus_incomplets_strate_X_<date>.docx` |\n| Audit INRAE / sources orphelines / termes candidats / rapport de session | `recherches/audits/` |\n| Export RIS des sources à enrichir en biblio interne | `recherches/sources/` |\n| Une fois traité (fiche intégrée, thesaurus digéré) | `recherches/archives/<catégorie>/` |\n\n### Scripts conformes\n\nScripts mis à jour le 2026-04-14 :\n- `gen_fiche_prompt_docx.py` → `recherches/fiches/`\n- `gen_prompt_completion.py` → `recherches/completion/`\n- `gen_prompt_enrichissement.py` → `recherches/completion/`\n- `gen_prompt_thesaurus.py` → `recherches/thesaurus/`\n- `export_fiche.py` → `recherches/fiches/`\n- `export_validation.py` → `recherches/audits/`\n- `export_thesaurus_incomplets.py` → `recherches/thesaurus/`\n- `export_sources_incomplete.py` → `recherches/sources/` (à migrer)\n- `export_mismatches_inrae.py` → `recherches/audits/` (à migrer)\n- `export_termes_candidats.py` → `recherches/audits/` (à migrer)\n- `audit_sources_orphelines.py` → `recherches/audits/` (OK)\n\n### Anti-pattern à éviter\n\n- ❌ Créer un `Publications/recherches/` bis (doublonnage historique)\n- ❌ Mettre des audits ou rapports dans `recherches/thesaurus/` (fourre-tout)\n- ❌ Scripts avec chemins hardcodés dans `Publications/` pour du travail\n  intermédiaire (`Publications/` = outputs publiables uniquement)\n\n\n### Note 2026-04-14 — `completion/` déprécié\n\nLe dossier `recherches/completion/` a été supprimé : les termes incomplets\ndu thésaurus repassent désormais dans le workflow initial (docx d'import).\nWorkflow unique :\n- Listes d'incomplets générées en docx dans `recherches/thesaurus/thesaurus_incomplets_strate_X_<date>.docx`\n- Retours Jenni dans `recherches/thesaurus/thesaurus___strate_X.docx`\n- Réimport via `import_termes_jenni.py --replace`\n\nLes anciens `complete_*.txt` sont archivés dans\n`recherches/archives/completion/`. Le script `gen_prompt_completion.py`\nest marqué déprécié.\n\n", "type": "reference", "crit": true}]}, "bq": {"nom": "BQ elle-même", "entries": [{"id": 136, "titre": "Pas d'agents rédacteurs — la rédaction c'est JMJ + Claude + Jenni, jamais un sous-agent", "contenu": "## Règle absolue — pas d'agents rédacteurs\n\n**La rédaction de contenu éditorial du corpus est STRICTEMENT limitée à :**\n- **Jenni** (via le workflow docx : prompt → Jenni rédige → retour docx → import contrôlé)\n- **JMJ** (directement, ou en demandant à Claude de rédiger spécifiquement)\n- **Claude** (moi) SEULEMENT quand JMJ me le demande explicitement en direct\n\n**Sont interdits** :\n- Lancer un agent Task (`Agent` tool) pour rédiger **définitions**, **synonymes**, **contenus de fiches**, **contenus de prompts**, **descriptions de concept_cards**, **contenus BQ** ou tout autre contenu éditorial du corpus\n- Demander à un agent de \"produire des définitions courtes\", \"rédiger une synthèse\", \"écrire une amorce\", \"compléter une description\"\n- Inventer des définitions ou contenus sans base docx/prompt Jenni ou indication explicite de JMJ\n\n**Sont autorisés pour les agents Task** :\n- Classification, extraction, analyse (ex: normaliser la casse, détecter des orphelins, trier des termes)\n- Recherche dans le code ou la DB\n- Parsing/formatage de données existantes\n- Audit/comparaison\n\n**Workflow correct pour créer un nouveau terme** :\n1. Identifier le besoin (ex: hyperonyme manquant)\n2. Écrire le nom du terme dans une liste à faire passer par Jenni\n3. Exporter via `export_thesaurus_incomplets.py` ou `gen_prompt_thesaurus.py`\n4. Jenni rédige la définition\n5. Réimport via `import_termes_jenni.py --replace`\n\n**Justification** : JMJ passe des heures à faire rédiger Jenni avec soin. Toute définition Claude-made sabote ce travail et pollue le thésaurus avec du contenu non validé. Violation détectée 2026-04-20 (14 termes créés avec def Claude en commit af35413 — supprimés et à refaire via Jenni).\n\n**Exception limitée** : les définitions que JMJ demande à Claude de rédiger EN DIRECT (dans la conversation) sont OK car c'est explicite et JMJ valide immédiatement.\n\n## Extension — pas de batch automatisé pour la rédaction (constat 2026-04-25)\n\nAu-delà de l'interdiction des agents Task pour la rédaction (règle ci-dessus), un **constat opérationnel récurrent** s'impose :\n\n**Le batch automatisé pour la rédaction éditoriale (refonte de fiches, extraction-condensation de contenu, génération de graines en lot) ne donne pas la qualité requise.**\n\n### Pourquoi le batch échoue (cas observés)\n\n- **Vague 3 batch automatisé Option A 2026-04-25** : tentative de traiter 23 fiches `integre_extrait` via un parser markdown + condense automatique. Résultat sur les 3 fiches passées avant blocage (#4, #10, #12) : titres tronqués (« Efficacité mesurée : La source indique que l'alignem… »), phrases entières comme titres, numérotation cassée (`s1=2.`, `s4=4.3.1.`), sections manquantes (4-5 au lieu de 8). Process bloqué sur #13 (regex/contenu trop long). Rollback nécessaire.\n- **Sessions antérieures** : pattern récurrent de batch qui « marche techniquement » mais produit des contenus à corriger massivement après coup, annulant le bénéfice de l'automatisation.\n\n### Causes structurelles\n\n1. **Hétérogénéité du contenu source** : les fiches existantes utilisent des structures hybrides (## mélangé avec ####, numérotations variables, citations APA dans titres) qui défient le parsing automatique propre.\n2. **Pas de jugement éditorial** : un script ne peut pas distinguer un titre court d'une phrase descriptive, ni hiérarchiser quelles sources préserver dans une condensation.\n3. **Méta-vocab résiduel** : les contenus existants citent souvent « cf. fiche #N » ou « card #N » qu'il faut systématiquement nettoyer — un batch les laisse passer.\n4. **Articulations transverses** : la rédaction d'un brief éditorial structuré (besoin corpus, paradigmes, articulation, doctrine) requiert une compréhension contextuelle que seul Claude possède en lecture directe.\n\n### Règle opérationnelle\n\nPour toute opération de **refonte/requalification de fiches** (Option A typiquement), procéder **fiche par fiche manuellement** :\n\n1. Lecture intro + conclusion du contenu existant\n2. Identification consciente des sources clés et de la structure (8 sections cible : intro + 6 body + résumé)\n3. Rédaction du brief éditorial structuré (besoin corpus / sources autoritaires / données chiffrées / paradigmes / articulation / doctrine)\n4. Rédaction de 6-8 graines ~600 chars chacune (cible BQ #130). **Pas de citations APA inline forcées dans la graine** — la graine est un état conceptuel pur (angle + 2-3 mécanismes + termes canoniques + périmètre). C'est Jenni qui apporte les références sourcées au cycle de co-rédaction. Si une référence est mentionnée dans la graine, elle doit être effectivement rattachée au texte qu'elle supporte (pas de bibliographie générique pré-posée).\n5. Audit méta-vocab regex post-génération + nettoyage\n6. Régénération du docx via `gen_fiche_docx.py`\n\n**Volume estimé** : 30-60 min par fiche selon volume contenu source. Pour 20+ fiches, prévoir plusieurs sessions étalées.\n\n### Modèles de référence\n\nLe modèle canonique est la fiche #37 `agroforesterie-temperee-fonctions-sol` (cf. BQ #130) : graines ~600 chars, angle conceptuel pur, termes canoniques intégrés, sans citations APA inline, sans bloc Références pré-posé.\n\n**Note 2026-04-30** : la doctrine antérieure (graines ~1k chars avec 11-19 cit. APA inline, biblio pré-posée — fiches #11, #24, #35, #26, #33 traitées 2026-04-25) est **dépréciée**. Constat JMJ : la \"graine c'est tout\", inutile de poser des refs qui ne sont pas effectivement rattachées au texte. Jenni est la source bibliographique au retour. Les fiches v3 doivent s'aligner sur le modèle #37, pas sur celles de la vague 2026-04-25.\n\n### Anti-pattern « ça marchera mieux la prochaine fois »\n\nLe batch automatisé pour la rédaction est tenté de manière récurrente avec l'espoir d'un gain de productivité. **À chaque tentative, le résultat est insatisfaisant** — soit qualité dégradée nécessitant correction manuelle (qui annule le gain), soit échec technique pur. Cette BQ explicite l'observation : **ne plus retenter**. Réserver le batch automatisé aux opérations de transformation déterministes (parsing structuré, dédup, normalisation FK, audit régex) — pas à la rédaction éditoriale.\n", "type": "regle_absolue", "crit": true}, {"id": 57, "titre": "Architecture DB — tables, vues, colonnes clés", "contenu": "**Comptages à jour** (générés dynamiquement par `session_start.py`) :\n```sql\nSELECT\n  (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name != 'sqlite_sequence') as tables,\n  (SELECT COUNT(*) FROM sqlite_master WHERE type='view') as vues;\n```\n\nNe pas mettre de chiffres en dur ici — utiliser la requête ci-dessus ou `session_start.py`.\n\n**Noyau documentaire** : documents, prompts, prompt_contenus, doc_cross_refs, jenni_doc_specs, jenni_doc_versions\n**Thésaurus** : terms, term_relations, term_connections\n**Chaînes** : chains_causales, chain_etapes\n**Cascade** : cascade_prerequis, cascade_level_links, concept_cards, terrain_tests, diagnostic_rules\n**Config** : config, db_meta, audit_log, requetes_utiles\n**Fiches** : fiches\n\n### (fusionné depuis #58 : Tables actives vs legacy)\n\n**Tables actives (utilisées quotidiennement) :**\ndocuments, prompts, terms, term_relations, jenni_doc_specs, jenni_doc_versions, jenni_section_specs, doc_cross_refs, chains_causales, chain_etapes, db_meta, audit_log, config, fiches\n\n**Tables de référence (calculateurs, données scientifiques) :**\nrefs (unifiee 2026-04, kind=matiere|texture|esclave_energ|shift_chantier|cn_regle, 317 rows) + ref_cn_incorporation, ref_melanges_predefinies, ref_kirkby (conservees, structures specifiques)\n\n**Tables web (templates, pages) :**\nhtml_templates, web_pages\n\n**Tables cascade & diagnostic :**\ncascade_prerequis, cascade_level_links, concept_cards, terrain_tests, diagnostic_rules\n\n**Tables de maintenance :**\nrequetes_utiles\n\n**Tables legacy (peuvent être supprimées) :**\nprompt_contenus (remplacé par prompts.enrichissement), term_connections (vide)\n\nCompter les tables :\n```sql\nSELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name != 'sqlite_sequence';\n```\n\n### (fusionné depuis #82 : Colonnes clés par table — aide-mémoire)\n\nColonnes les plus utilisées (évite les PRAGMA table_info à répétition) :\n\n**terms** : id, section_key, strate, fr, en, definition, syn_fr, syn_en, inrae, doc_code, statut, type, flag_pseudoscience\n**prompts** : id, doc_code, type (intro/section/conclusion), chapitre, section, titre_h1, titre_h2, contexte_sci, instructions, enrichissement, style, tableau, ordre\n**documents** : code, titre, strate, sous_titre, resume\n**config** : categorie, cle, valeur\n**concept_cards** : id, title, description, category, docs_codes (JSON), status\n**refs** (migration 2026-04) : id, ref_kind, code, label, description, source, source_id, data JSON, ordre, is_active, legacy_id. Helper `tools/lib/refs.py::load_refs(con, kind)` deplie data + alias compat\n    **refs (kind=matiere)** : 110 rows. Colonnes specifiques (cn_min/max, k1_min/max, NPK, densite, cout, synonymes, source) dans le champ `data` JSON, deplies a la racine par `load_refs(con, 'matiere')`\n**ref_cn_incorporation** : id, cn_seuil_min, cn_seuil_max, niveau, titre, contenu, conditions (JSON), cas_etude (JSON), redox (JSON), timeline\n**html_templates** : id, slug, page_slug, type (page_css/page_js/head), contenu\n**BQ (filesystem Session D)** : `jmj/bq/<slug>.md` frontmatter YAML + body MD. Voir BQ `bq_architecture_domaines`. Catalogue 14 domaines : `jmj/bq/_domaines.yaml`\n**chains_causales** : id, titre, docs_traverses\n**chain_etapes** : id, chain_id, etape, doc_code, description\n", "type": "reference", "crit": true}, {"id": 1, "titre": "Carte du projet — vue d'ensemble (à lire en premier)", "contenu": "## Carte du projet — Le Sol Vivant cet Holobionte\n\n**Lire en premier.** Cette entrée donne la vue d'ensemble. Toutes les BQ sont ensuite des références détaillées.\n\n### Le projet en 4 lignes\n\nCorpus scientifique en **18 documents** sur l'agriculture régénératrice et la biologie des sols, écrit par Jean-Michel Juzan. Claude Code édite la DB et les scripts ; Jenni AI rédige. Biblio interne dans la table `jenni_sources` (1639 refs), alimentée par intégration consciente des rapports de sources fournis par JMJ. DB unique `sol_vivant.db` = source de vérité. Branche `main` = production.\n\n### Les 3 acteurs\n\n| Acteur | Rôle | Interface |\n|---|---|---|\n| **Claude Code** (moi) | Édite la DB, les scripts, audit corpus, intégration retours Jenni, veille | Terminal + sol_vivant.db |\n| **Jenni AI** | Rédige à partir de prompts, produit des .docx | Web, piloté par .txt prompts |\n| **JMJ** (auteur) | Donne des rapports de sources à intégrer, valide les actions Claude | Session + .md |\n\n### Pipeline global\n\n```\n    ┌─────────────────────────────────────────────────────────────┐\n    │          CORPUS = 18 documents rédigés par Jenni            │\n    └──────────────────────────▲──────────────────────────────────┘\n                               │ passe finale Jenni\n                               │\n          ┌────────────────────┴────────────────────┐\n          │   PROMPTS clôturés (prompts.statut=cloture)  │\n          │     contexte_sci + instructions + enrichissement       │\n          └────────────────────▲────────────────────┘\n                               │\n       ┌───────────────────────┼───────────────────────┐\n       │                       │                       │\n  ┌────┴─────┐           ┌─────┴─────┐           ┌─────┴──────┐\n  │ THÉSAURUS │           │  FICHES   │           │VALIDATIONS│\n  │ 962 termes│           │ 27 intégr.│           │ (en pause)│\n  └────▲─────┘           └─────▲─────┘           └─────▲──────┘\n       │                       │                       │\n       │ enrich_thesaurus       │ fiches zoom           │ combler dette\n       │                       │ (transversale/        │ (audit révèle)\n       │                       │  technique/zoom)      │\n       │                       │                       │\n  ┌────┴───────────────────────┴───────────────────────┴────┐\n  │              AUDIT du corpus / notes volantes           │\n  │    analyse_corpus · audit_opus · check_integrity        │\n  └─────────────────────────────────────────────────────────┘\n```\n\n**Note** : les `concept_cards` (91 actives) agissent en **filtre de rigueur** entre captation et intégration : toute nouvelle affirmation doit d'abord passer par une carte (cf. #106).\n\n### Les 5 scripts à connaître (chaque session)\n\n| Commande | Rôle |\n|---|---|\n| `python3 tools/admin/session_start.py --db sol_vivant.db` | Démarre la session (sync git, backup DB, dashboard, règles actives) |\n| `python3 tools/admin/bq_query.py --list` / `--domaine <slug>` / `--search <kw>` | Consulter cette BQ (filesystem `jmj/bq/`) |\n| `python3 tools/admin/check_integrity.py --db sol_vivant.db` | Valider l'état DB (FK, orphelins, doublons) |\n| `python3 tools/regen_all.py --db sol_vivant.db` | Régénérer tous les outputs (HTML, README, workflows) depuis la DB |\n| `python3 tools/veille/weekly_scan.py --db sol_vivant.db` | Veille PubMed hebdomadaire (9 thèmes, 28 requêtes) |\n\n### Les 4 règles absolues\n\n1. **`main` est la production** — travailler et pousser directement sur main (cf. #70)\n2. **La DB est source de vérité** — fichiers générés = vues (cf. #73). Ne jamais modifier un fichier de sortie ; toujours modifier la source puis `regen_all.py`\n3. **Le .docx Jenni ne rentre jamais tel quel en DB** — tout passe par analyse Claude + scripts d'import contrôlés\n4. **Pas de codes docs / méta-vocab dans les prompts** — S2, V1, \"strate\", \"corpus\", \"thésaurus\" interdits dans `prompts.contexte_sci/.instructions/.enrichissement` (cf. #120)\n\n### Infrastructure transverse\n\n**Table `config` (84 clés)** — paramètres centralisés par catégorie/clé. Toute valeur partagée entre scripts va là, pas en dur.\n- `config.corpus.*` : nom, auteur, version du projet\n- `config.veille.hot_topics` : 9 thèmes PubMed de la veille\n- `config.web.icon_library` : bibliothèque d'icônes unifiée\n- `config.cahier.onglets`, `config.cahier.chapitres`, `config.cahier.tab_descriptions` : structure du Cahier de Science\n- `config.jenni.*` : templates de prompts Jenni\n- `config.claude_rules.*` : règles Claude affichées au démarrage\n\nLecture Python : `from config import get, get_json, get_int, get_float` (dans `tools/lib/config.py`).\n\n**Table `audit_log` (1200+ entrées)** — trace horodatée de toutes les opérations significatives en DB. Colonnes : `ts, operation, table_name, record_ref, detail`. Opérations les plus courantes : `GENERATE` (régénération page), `UPDATE` (modification), `INSERT` (ajout), `IMPORT` (import docx), `MERGE`, `SYNC`.\n\nUtile pour :\n- Reconstituer l'historique d'une fiche ou d'un terme\n- Debugger « qui a modifié quoi quand »\n- Produire les rapports de session\n\n**Écriture systématique** : tout script qui modifie la DB doit écrire dans audit_log :\n```python\ncon.execute(\"INSERT INTO audit_log (operation, table_name, record_ref, detail) VALUES (?, ?, ?, ?)\",\n            ('UPDATE', 'terms', f'term #{tid}', 'Correction definition corrompue'))\n```\n\n**Table `jenni_sources` (1639 refs)** — biblio interne du projet. Chaque source a `doi, auteurs, annee, titre_complet, journal, resume_court, pertinence, tags, url`. Alimentée par **intégration consciente** (un rapport de source à la fois — cf. workflow `wf_source_integration`). Jamais de batch-insert aveugle.\n\n**Table `source_usages` (2322 liens)** — relie une source à une entité (fiche / document / terme / card / prompt) avec contexte et citation brute. Permet de reconstituer « où est cette source citée ? ».\n\n### Modules BQ — où chercher quoi\n\n| Module | Contenu | Quand aller voir |\n|---|---|---|\n| **projet** | Doctrine corpus, modèle conceptuel, concept cards | Avant de toucher la rédaction ou la structure |\n| **claude** | Règles Claude (git, DB, pseudoscience, faux positifs) | Avant toute action |\n| **workflow** | Un workflow métier par BQ (fiche, thésaurus, veille, web…) | Pour retrouver le bon enchaînement |\n| **web** | Charte graphique, composants React, pages HTML | Génération/modif de pages |\n| **jenni** | Chartes rédaction, format prompts, enrichissement | Avant de produire un prompt Jenni |\n| **sqlite** | Schéma tables, vues, requêtes utiles | Inspection DB |\n| **maintenance** | Sessions, scripts, régénération, intégrité | Opérations de maintenance |\n", "type": "info", "crit": true}, {"id": 73, "titre": "DB = source de vérité — données en DB, fichiers = vues", "contenu": "**Règle** : `sol_vivant.db` est la source de vérité **pour les données** (corpus, audit_log, config, refs). Les **scripts** Python sont versionnés par git dans `tools/` (Session B). Les fichiers HTML/MD/TXT générés depuis la DB sont des **vues**.\n\n**Ne jamais modifier directement :**\n- `Publications/prompts/prompts_jenni_*.txt` → générés par `export_jenni_doc.py` depuis les tables `prompts`, `terms`, `jenni_doc_specs`\n- `Publications/web/*.html` → générés par `gen_mo_calc.py`, `gen_web.py`, `gen_triangle_textures.py` depuis les tables `ref_*`, `html_templates`\n- `Publications/cartographie/*.html` → généré par `gen_web.py`\n- `Publications/workflows/*.md` → générés par `gen_workflows.py`\n- `tools/**/README.md` → générés par `gen_readme.py`\n\n**Toujours corriger la source :**\n- Contenu des prompts → modifier dans table `prompts` ou dans le script `export_jenni_doc.py`\n- CSS/JS des calculateurs → modifier dans table `html_templates`\n- Données de référence → modifier dans les tables `ref_*`\n- Puis regénérer le fichier avec le script approprié\n\n**Workflow correct :**\n1. Modifier la DB (tables, templates, config)\n2. Regénérer les fichiers (`python3 tools/docs/gen_*.py --db sol_vivant.db`)\n3. (Plus de sync — les scripts sont versionnes par git directement)\n4. `git add` + `git commit` + `git push`\n\n### (fusionné depuis #79 : Données = DB, code = logique uniquement)\n\n**Règle** : toute donnée paramétrable va dans la DB, jamais en dur dans le code Python ou JS.\n\n**Où stocker quoi :**\n| Type de donnée | Table DB |\n|---|---|\n| Paramètres API (modèle, tokens, prix) | `config` |\n| Données de référence (C/N, matières, textures) | `ref_*` |\n| CSS/JS des pages web | `html_templates` |\n| Contenu des prompts Jenni | `prompts` |\n| Termes canoniques | `terms` |\n| Mélanges prédéfinis | `ref_melanges_predefinies` |\n\n**Exceptions tolérées** : constantes physiques universelles, noms de colonnes SQL, noms de fichiers de sortie.\n\n**Code = filesystem, donnees = DB :**\n    Les **scripts Python** sont versionnes par git dans `tools/` (table `scripts` droppee Session B). Lire un script = `Read tools/<folder>/<nom>.py`. Inventaire programmatique = `tools/lib/scripts_inventory.py::list_scripts()`. Les **templates HTML** restent en DB (`html_templates.contenu`). Les **donnees** restent en DB (terms, refs, fiches, etc.).\n\n| Pour lire... | Faire | Ne pas faire |\n|---|---|---|\n    | Un script | `Read tools/<folder>/<nom>.py` ou `from scripts_inventory import list_scripts` |\n| Un template React | `SELECT contenu FROM html_templates WHERE id = N` | `Read` sur le HTML généré |\n| Une config | `SELECT valeur FROM config WHERE cle = 'xxx'` | Lire CLAUDE.md |\n| Des données | `SELECT ... FROM refs / terms / ...` (helper `tools/lib/refs.py`) | Lire un export JSON/CSV |\n\n**Historique** : polygones GEPPA hardcodés dans gen_triangle_textures.py, nombre de cartes \"35\" en dur (sessions 31/03, 01/04). Lecture fichier gen_triangle_textures.py dépassant 10K tokens (session 04/04).\n", "type": "contrainte", "crit": true}, {"id": 59, "titre": "Requêtes utiles — pilotage, thésaurus, diagnostic", "contenu": "## Requêtes utiles — pilotage, thésaurus, diagnostic\n\nLes requêtes de référence sont stockées dans **`tools/sql/<categorie>/<nom>.sql`** (Session E 2026-05-06, table `requetes_utiles` droppée). Voir BQ `requetes_utiles_catalogue_sql` pour le format complet.\n\n```bash\n# Trouver une requête par nom\ncat tools/sql/sante/etat_production.sql\n\n# Requêtes de démarrage de session\ngrep -l \"usage_type: session\" tools/sql/**/*.sql\n\n# Requêtes de diagnostic\ngrep -l \"usage_type: diagnostic\" tools/sql/**/*.sql\n\n# Requêtes d'un domaine\nls tools/sql/thesaurus/\n```\n\n**Exécution shell** :\n```bash\nsqlite3 sol_vivant.db < tools/sql/thesaurus/doublons_termes.sql\n```\n\n**Exécution Python** :\n```python\nfrom pathlib import Path\nimport sqlite3\nsql = Path('tools/sql/thesaurus/termes_sans_definition.sql').read_text()\nconn = sqlite3.connect('sol_vivant.db')\nfor r in conn.execute(sql).fetchall():\n    print(r)\n```\n\nCatégories : sante, documents, thesaurus, chaines, bq, crossrefs, maintenance, biblio, cascade, pilotage, config.\nTypes : session (15), pilotage (14), diagnostic (9), export (2), maintenance (1).\n\n### Requêtes thesaurus\n\nLes requêtes thésaurus sont dans `tools/sql/thesaurus/` :\n```bash\nls tools/sql/thesaurus/\n# doublons_termes.sql, densite_termes_par_doc.sql, termes_partages.sql,\n# termes_sans_definition.sql, termes_document.sql, thesaurus_complet_compact.sql\n```\n\n### Requêtes diagnostic rapide — copier-coller\n\nRequêtes courantes à copier-coller au démarrage ou pendant le travail :\n\n```sql\n-- État du corpus\nSELECT strate, COUNT(*) FROM documents GROUP BY strate;\n\n-- Termes par doc\nSELECT doc_code, COUNT(*) FROM terms GROUP BY doc_code ORDER BY doc_code;\n\n-- Prompts incomplets (pas d'enrichissement)\nSELECT doc_code, titre_h2 FROM prompts WHERE enrichissement IS NULL OR enrichissement = '';\n\n-- Dernières opérations\nSELECT ts, operation, table_name, substr(detail,1,80) FROM audit_log ORDER BY ts DESC LIMIT 10;\n\n-- Config API\nSELECT cle, valeur FROM config WHERE categorie = 'api';\n\n-- BQ critiques par domaine (filesystem Session D)\n-- python3 tools/admin/bq_query.py --critical-only\n\n-- Inventaire scripts (filesystem Session B)\n-- python3 -c \"from tools.lib.scripts_inventory import list_scripts; ...\"\n```\n", "type": "commande", "crit": true}, {"id": 139, "titre": "Refactor term_relations - source unique BT/NT/RT (2026-04-20)", "contenu": "## Refactoring term_relations — source de vérité unique pour BT/NT/RT\n\n**Depuis le 2026-04-20** : les colonnes `terms.bt`, `terms.nt`, `terms.rt` ont été **supprimées**. La table `term_relations` est la SEULE source de vérité pour les relations entre termes.\n\n### Schéma actuel\n\n```sql\nCREATE TABLE term_relations (\n    id              INTEGER PRIMARY KEY AUTOINCREMENT,\n    from_term_id    INTEGER NOT NULL REFERENCES terms(id) ON DELETE CASCADE,\n    to_term_text    TEXT NOT NULL,          -- libellé brut (Jenni/docx)\n    to_term_id      INTEGER REFERENCES terms(id),  -- FK si résolu, NULL si orphelin\n    rel_type        TEXT NOT NULL CHECK(rel_type IN ('BT','NT','RT'))\n);\nCREATE INDEX idx_term_relations_to ON term_relations(to_term_id);\n```\n\n### Vues\n\n**`v_term_relations`** — joint source et cible, expose `display_text` (COALESCE to_fr, to_term_text) et `is_orphan` :\n```sql\nSELECT ... FROM v_term_relations WHERE from_id = ? AND rel_type = 'RT'\n```\n\n**`v_terms_full`** — expose `terms` avec `bt`/`nt`/`rt` agrégés automatiquement depuis `v_term_relations` (GROUP_CONCAT avec ` · ` comme séparateur). Remplace les anciennes colonnes `terms.bt`/`terms.rt`. Les scripts lecteurs doivent faire `SELECT ... FROM v_terms_full` au lieu de `FROM terms` quand ils ont besoin de bt/rt.\n\n### Module partagé\n\n**`tools/lib/term_rels.py`** — helpers pour les scripts écrivains :\n- `norm(s)` : normalisation matching (apostrophes, accents, casse, sing/plur)\n- `build_fr_index(con)` : construit le dict `{norm(fr|en|syn) → term_id}`\n- `write_relations(con, from_id, rel_type, raw_text, index=None)` : delete existantes + split + insert avec `to_term_id` résolu automatiquement\n- `get_relations(con, from_id, rel_type)` / `get_relations_text(...)` : lecture formatée\n\n### Scripts patchés (2026-04-20)\n\n**Lecteurs** (maintenant `SELECT ... FROM v_terms_full`) :\n- `tools/batch/analyse_corpus.py`\n- `tools/jenni/gen_prompt_completion.py`\n- `tools/jenni/gen_prompt_thesaurus.py`\n- `tools/docs/gen_web.py`\n\n**Écrivains** (retire `bt/rt` des INSERT/UPDATE sur terms, écrit via `term_rels.write_relations`) :\n- `tools/jenni/import_termes_jenni.py`\n- `tools/jenni/enrich_thesaurus.py`\n- `tools/jenni/import_enrichissement.py`\n- `tools/jenni/resolve_import_conflicts.py`\n- `tools/admin/dedupe_thesaurus.py` (met aussi à jour `to_term_id` quand il migre `to_term_text`)\n\n### Migration effectuée\n\n**Phase 0 — Synchronisation** : toutes les relations des anciennes colonnes `terms.bt`/`terms.rt` qui n'étaient pas dans `term_relations` y ont été ajoutées :\n- BT : 437 → 852 (+415)\n- RT : 3488 → 5927 (+2439)\n- NT : 14 (inchangé)\n\n**Phase 1 — Migration FK** : `to_term_id` résolu via `norm()` pour 4296 relations ; 2497 restent orphelines (texte cible hors thésaurus, à arbitrer via agents Task ou décisions éditoriales).\n\n**Phase 2 — Vues** : v_term_relations + v_terms_full créées.\n\n**Phase 3 — Scripts patchés** : 8 scripts mis à jour.\n\n**Phase 4 — Drop colonnes** : `terms.bt`, `terms.nt`, `terms.rt` supprimées (ALTER TABLE DROP COLUMN — SQLite ≥ 3.35).\n\n### Bénéfices\n\n- **Orphelins explicites** : `SELECT * FROM v_term_relations WHERE is_orphan = 1` liste directement les 2497 relations dont la cible n'est pas dans le thésaurus\n- **Plus de redondance** : une seule source de vérité, la vue reconstruit le texte à la volée\n- **FK suivie automatiquement** : si on renomme un terme, les relations vers lui n'ont plus à être réécrites (le `to_term_id` reste valide)\n- **Audit de cohérence simplifié** : une requête SQL simple (plus besoin de parser les champs texte)\n\n### Comportement orphelins\n\nQuand une relation pointe vers un texte qui ne matche aucun terme (`to_term_id IS NULL`) :\n- `v_term_relations.display_text` = `to_term_text` (le texte brut)\n- `is_orphan = 1`\n- `v_terms_full.rt` inclura ce texte brut dans la concaténation\n\nQuand l'orphelin deviendra résolu (un nouveau terme est créé ou un syn est ajouté qui matche), il suffit de ré-exécuter une passe de résolution :\n```python\nfrom lib.term_rels import build_fr_index\nidx = build_fr_index(con)\nfor r in con.execute(\"SELECT id, to_term_text FROM term_relations WHERE to_term_id IS NULL\"):\n    tid = idx.get(norm(r[1]))\n    if tid:\n        con.execute(\"UPDATE term_relations SET to_term_id=? WHERE id=?\", (tid, r[0]))\n```\n\nVoir commit de référence : `claude/refactor-term-relations`.\n\n### Alerte post-import `detect_cross_syn_fr()` (session 2026-04-21)\n\n**Problème** : le format strict de Jenni protège le `fr` canonique (règle absolue CLAUDE.md). Conséquence perverse : si on envoie à Jenni un terme mal formaté (ex : `'BRF (Bois Raméal Fragmenté)'`), elle garde le `fr` tel quel et met la version propre (`'Bois Raméal Fragmenté'`) en `syn_fr`. Si ce libellé existe déjà comme `fr` canonique d'un terme séparé → **deux entrées désignent le même concept sans détection automatique**.\n\n**Diagnostic** : scan rétroactif = 50 collisions syn↔fr dans le thésaurus courant.\n\n**Solution** (commit `084a043`) :\n\n- `tools/lib/term_rels.py::detect_cross_syn_fr(con, term_ids=None)` — scanne les `syn_fr`/`syn_en` de `term_ids` (ou tout le thésaurus si None) et retourne la liste des collisions avec un `fr` canonique existant. Format de retour :\n  ```python\n  [{'from_id': ..., 'from_fr': ..., 'syn_text': ..., 'syn_field': 'syn_fr'|'syn_en',\n    'collides_with_id': ..., 'collides_with_fr': ...}]\n  ```\n- Hook post-commit ajouté dans les 3 scripts qui écrivent dans `syn_fr`/`syn_en` :\n  - `tools/jenni/import_termes_jenni.py`\n  - `tools/jenni/enrich_thesaurus.py`\n  - `tools/jenni/import_enrichissement.py`\n- Le hook affiche les collisions (⚠) et écrit un WARN dans `audit_log` (operation='WARN', table='terms').\n\n**Règle stricte** : aucune modification automatique des termes. L'alerte **surface** pour arbitrage JMJ — jamais d'action silencieuse sur le thésaurus.\n\n**Arbitrage par paire détectée** :\n1. Même concept → fusion (via `dedupe_thesaurus.py` ou manuel)\n2. Concepts distincts mais syn mal attribué → retirer le syn fautif (ne pas modifier le fr canonique)\n3. Hiérarchie réelle → poser BT/NT explicite, retirer le syn\n\n**Historique** : cette doctrine avait été implémentée la veille (2026-04-20) et perdue dans un rollback. Documentée ici pour survivre aux prochains rollbacks.\n", "type": "technique", "crit": true}, {"id": 65, "titre": "requetes_utiles — catalogue SQL", "contenu": "41 requêtes SQL de référence organisées par catégorie dans **`tools/sql/<categorie>/<nom>.sql`** (Session E 2026-05-06, table `requetes_utiles` droppée).\n\n**11 catégories** : sante, documents, thesaurus, chaines, bq, crossrefs, maintenance, biblio, cascade, pilotage, config\n\n**Types d'usage** (en commentaire d'en-tête de chaque .sql) :\n- `session` (15) — démarrage, contexte rapide\n- `pilotage` (14) — suivi production, décisions\n- `diagnostic` (9) — recherche de problèmes\n- `export` (2) — contexte LLM/biblio\n- `maintenance` (1) — logging\n\n**Format des fichiers** :\n\n```sql\n-- nom: <nom>\n-- categorie: <categorie>\n-- usage_type: <usage_type>\n-- parametres: <parametres ou aucun>\n-- description: <description>\n\n<sql_text>\n```\n\n**Consultation** :\n\n```bash\n# Liste les requêtes par catégorie\nls tools/sql/\n\n# Liste les requêtes d'une catégorie\nls tools/sql/thesaurus/\n\n# Voir une requête\ncat tools/sql/sante/etat_production.sql\n\n# Lancer une requête\nsqlite3 sol_vivant.db < tools/sql/sante/etat_production.sql\n```\n\n**Exécution depuis Python** :\n\n```python\nfrom pathlib import Path\nimport sqlite3\n\nsql = (Path('tools/sql/thesaurus') / 'doublons_termes.sql').read_text()\nconn = sqlite3.connect('sol_vivant.db')\nfor r in conn.execute(sql).fetchall():\n    print(r)\n```\n\n**Recherche full-text** (par grep, plus de SQL meta nécessaire) :\n\n```bash\ngrep -lR \"fiches.statut\" tools/sql/\ngrep -lR \"ORDER BY\" tools/sql/maintenance/\n```\n\n**Historique** :\n- avant 2026-05-06 : table `requetes_utiles` (41 rows, schéma { categorie, nom, description, sql_text, parametres, usage_type, updated_at }). Catalogue passif (aucun script Python ne le lisait).\n- **Session E 2026-05-06** : migration vers `tools/sql/<categorie>/<nom>.sql` (en-tête commenté + body SQL natif). Drop table. Coloration syntaxique IDE + diff git natif.\n", "type": "instruction", "crit": true}, {"id": 103, "titre": "Modèle conceptuel — production du corpus (référence absolue)", "contenu": "## Modèle conceptuel — production du corpus\n\n**Document de référence absolu.** Toute future session Claude doit lire cette entrée en priorité avant d'agir sur les fiches, validations, prompts ou production du corpus.\n\n### Objectif final\n\nProduire les **18 documents scientifiques** du corpus *Le Sol Vivant cet Holobionte*, rédigés en passe finale par Jenni.\n\n### Étape pivot — la « clôture » des prompts\n\nPour qu'un document soit prêt pour la passe finale Jenni, **tous ses prompts doivent être clôturés**. Un prompt est clôturé quand :\n1. `contexte_sci` est rempli (ce que la science dit déjà)\n2. `instructions` sont claires (ce que Jenni doit produire)\n3. **Aucune dette de contenu ne reste** : pas de chaîne causale non validée, pas de concept à étayer, pas de lacune connue\n\n### Les outils pour amener un prompt à la clôture\n\n| Outil | Action conceptuelle | Sortie Jenni intègre… | Table source |\n|---|---|---|---|\n| **Thésaurus** | Définir un terme canonique | `prompts.instructions` (vocabulaire utilisable par Jenni) | `terms` |\n| **Concept card** ⚠ | **Filtrer la rigueur** d'une hypothèse avant intégration corpus | (gate, bloque les affirmations bancales) | `concept_cards` |\n| **Fiche** | *Zoomer* sur un point précis (proactif) | `prompts.contexte_sci` / `.enrichissement` des docs cibles | `fiches` |\n| **Validation** | *Vérifier* une affirmation, *étayer* un concept, *combler* une lacune (réactif) | `prompts.contexte_sci` / `.enrichissement` des docs cibles | `validations` |\n| **Enrichissement thésaurus** | Cas particulier : enrichir massivement le thésaurus à partir d'une liste | thésaurus | `terms` (ajouts) |\n\n**Distinction Fiche vs Validation** :\n- **Fiche** = élargir le savoir, sujet intéressant en soi (proactif)\n- **Validation** = combler une dette identifiée par audit ou par manque détecté (réactif)\n\nLes deux contribuent au **même but** : nourrir les prompts pour les amener à clôture.\n\n### Concept cards — le filtre de rigueur (règle absolue)\n\n> **Une affirmation bancale ne passe pas dans le corpus.**\n\nLe système `concept_cards` est l'**outil de filtre** qui s'intercale entre la **captation** d'une hypothèse (note volante, vulgarisation, intuition de lecture) et son **intégration** au corpus (fiche, validation, prompt). Sans ce filtre, le corpus se laisse polluer par des affirmations séduisantes mais non vérifiées.\n\n**Workflow** :\n```\nNote vulga / hypothèse / intuition\n   ↓\nCréation/affinement d'une concept_card\n   (positionnement dans une dimension conceptuelle parmi les 12)\n   ↓\nConfrontation rigoureuse :\n  - Cohérence avec les autres dimensions\n  - Compatibilité avec les concept_card_tests (validation empirique terrain)\n  - Cohérence avec le corpus existant\n   ↓\n✗ Affirmation bancale → REJET (la carte reste en archive ou est supprimée)\n✓ Affirmation solide → la carte passe en active → l'hypothèse peut alimenter\n                       une fiche, une validation, un prompt, ou un terme\n```\n\n**Plusieurs concepts du corpus actuel ont été identifiés ainsi** : note de vulgarisation captée → pépite extraite → concept_card créée → confrontation → validation → intégration.\n\n**Rôle dans le modèle** :\n- **Amont** des fiches/validations : avant de créer une fiche pour zoomer sur un point, vérifier qu'il y a au moins une concept_card cohérente qui le supporte\n- **Filtre des notes volantes** : avant d'intégrer une pépite de note (BQ #102), tester via concept_card si l'affirmation tient la route\n- **Mémoire de rejet** : les cartes en `archive` représentent l'historique des
