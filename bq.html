ire complet : `conseil_generatif`.**\n\n### TEMPS 2 — VALIDATION (jugée à la JUSTESSE & la NÉCESSITÉ)\n\nIci l'anti-marteau retrouve **plein pouvoir** : on décide de COMMETTRE (ou non) au réel. La\nvalidation évalue les questions du sujet ET les ponts promus par le Temps 1.\n\n**Dossier partagé (le chairman = agent).** Le chairman fait son **audit croisé** (piloté par la\nDB, pas par un rapport antérieur — `source_verite_data_avant_absence`) et écrit\n`tmp/conseil_<sujet>/dossier.md` : le **fil directeur** concerné (axes `doctrine_chantiers`) ;\nles **findings numérotés** marqués « à challenger, pas à gober » ; l'**inventaire brut** de\nl'artefact audité ; les **consignes** (jugement seul, vérifier tout en DB via `python3`/module\nsqlite3 — `environnement_web` ; `audit_cards_first` ; `principes_generatifs_avant_labels_reactifs`).\n\n**Round 1 — avis indépendants (N agents EN PARALLÈLE).** **3 lentilles** (regards complémentaires\n**choisis selon l'objet** — ex. cards : Cartographe / Logicien / Praticien-Filtre) + **1\ncontradicteur** + **l'anti-marteau**. Chaque siège lit le dossier, **VÉRIFIE en DB**, et rend :\nfindings confirmés/infirmés (preuve DB) + propositions (intitulés/positions) + **angle mort** +\n**préoccupation n°1**. Le contradicteur traque dès R1 l'**artefact de comptage** et la **fausse\nalarme** ; l'anti-marteau, pour chaque action, tranche « vrai besoin / clou fabriqué / non-problème ».\n\n**Procès-verbal (chairman).** Condense les avis dans `minutes_r1.md` et **NOMME les 2-4 TENSIONS**\nà trancher (les vraies divergences).\n\n**Round 2 — échange confronté (N agents EN PARALLÈLE).** Chaque siège **lit le PV**, **CONCÈDE ou\nMAINTIENT** sur chaque tension (preuve DB), puis nomme l'**angle mort COLLECTIF**, la **VRAIE\nconvergence** et la **VRAIE divergence**. C'est ici que les positions tombent quand la DB les\ndément. L'échange est **doctrine** (renforcé JMJ 2026-06-12) : il ne se saute **jamais**. Toute\ndissidence substantielle qui survit → **rapport minoritaire** (alternative vivante, pas fondue\ndans « ce qui reste ouvert »).\n\n**Synthèse du chairman.** `synthese_chairman.md` : findings démontés (artefacts) / le vrai travail\n/ le différé / les **arbitrages ouverts pour JMJ** / le sort de chaque pont (retenu / rejeté /\nen attente de juge externe).\n\n**DOUBLE CRITIQUE DE LA SYNTHÈSE — checkpoint NON-NÉGOCIABLE.** La synthèse est le seul maillon\nautrement non audité. Deux gardiens l'attaquent (pas le débat, déjà tenu) :\n- le **CONTRADICTEUR** (« est-ce JUSTE ? ») — qu'a-t-elle **lissé, survendu, omis** ? quel fait\n  reste non vérifié ? quelle **sur-ingénierie** au regard du besoin réel ?\n- l'**ANTI-MARTEAU** (« est-ce NÉCESSAIRE ? », loi de l'instrument — « pour qui tient un marteau,\n  tout ressemble à un clou ») — quel composant ne survivra pas à l'usage ? quelle **friction la\n  synthèse a-t-elle dissoute** ? Il **défend le STATU QUO comme verdict de plein droit**. **Test\n  décisif : qui LIT/consomme réellement ce qu'on s'apprête à modifier ?** Un champ que nul ne lit,\n  rempli « pour la complétude », est un clou fabriqué — pas une action.\n\n## Le chairman VÉRIFIE les contradicteurs (`faux_positifs_audit_recurrents` #55)\n\nRègle d'or : **le contradicteur-synthèse est lui aussi un LLM faillible.** Le chairman re-vérifie\nEN DB chaque affirmation factuelle des DEUX gardiens avant de conclure (un anti-marteau peut\nsur-appliquer son propre marteau « ne rien faire »). Sur le chantier cards, cette étape a\nsimultanément **validé** une vraie erreur du chairman (`ref_link` fiche→card proposé alors que\n`ref_links` ne lie que des tables `ref_*` ; le bon pont est `pedago_links`) et **invalidé** deux\ndépassements du contradicteur (un titre prétendu existant — faux ; « 30 cards » — non reproduit,\nscan propre = 15 dont 5 faux positifs). C'est l'étape qui empêche de prendre le contradicteur\npour argent comptant **autant que** le rapport.\n\n## VERDICT — JMJ tranche, la vérité va à Semantic Scholar\n\nSynthèse corrigée + critique vérifiée + arbitrages ouverts. **JMJ tranche. N'AGIR\n(création/UPDATE en DB) qu'après cet arbitrage** — et alors en conscience (`wf_solde_audit` : tri\ntechnique / éditorial scientifique / éditorial thésaurus, vérif avant fusion, un commit + regen\nciblé + WAL + `check_integrity` + `audit_log`). Les hypothèses retenues sont **marquées HYPOTHÈSE**\net promues vers l'**arbitrage Semantic Scholar** (`audit_factuel_arbitrage.py`) pour la vérité **avant** toute intégration (cards / chaînes /\nfiches).\n\n## Réglage d'échelle\n\nObjet riche : **4 sièges/round × 2 rounds + 2 critiques de synthèse (contradicteur + anti-marteau)\n≈ 10 agents**. Objet léger : R2 peut être resserré, **jamais supprimé** ; les deux critiques de\nsynthèse sont, elles, non négociables. Les sièges sont parallèles intra-round (un seul message,\nN appels Agent) ; les rounds sont séquentiels (R2 a besoin du PV de R1).\n\n## Anti-patterns\n\n- Sauter le Round 2 (échange) ou l'un des deux gardiens (oublié 2-3 fois avant 2026-06-12 —\n  `conseil_modele`).\n- **Mettre la vérité dans le Conseil** quand Semantic Scholar existe → court-circuite l'arbitrage.\n- Faire rédiger du contenu éditorial par les agents (`pas_agent_redacteur`).\n- Conclure sur les dires d'un gardien sans re-vérifier en DB (#55).\n- Agir avant l'arbitrage JMJ.\n- **Confondre « on a tenu un Conseil » avec « il fallait agir »** : le format audit fabrique des\n  to-do. Le **statu quo est un verdict de plein droit** — l'anti-marteau y veille.\n- Optimiser une **frontière de KPI** (« compteur 0 → 0 ») au lieu du vrai besoin.\n\n## Exemples de référence\n\n- **Mode audit** — chantier `concept_cards` (2026-06-12f) : dossier + R1 (Cartographe / Logicien /\n  Praticien-Filtre / Contradicteur) + R2 + synthèse + double critique + vérif chairman → verdict\n  « système sain, dette de **liens** pas de cards ; pas de sur-production ».\n- **L'anti-marteau a INVERSÉ un verdict** (chantier chaînes, 2026-06-13) : le Conseil s'apprêtait à\n  4 relinks `chains_liees` ; l'anti-marteau a prouvé en DB que `chains_liees` n'est lu par **aucun\n  rendu** (clou fabriqué) et a exhibé le seul geste réel que tous avaient sous-estimé — une doc au\n  snapshot périmé que **les agents lisent pour produire**. Verdict honnête : chaînes RAS, corriger\n  une doc.\n", "type": "workflow", "crit": true}, {"id": "conseil_generatif", "titre": "Conseil — Temps 1, génération des ponts manquants (détail)", "contenu": "## Conseil — Temps 1 : génération (détail opératoire)\n\n> **V3 (2026-06-21)** — cette fiche décrit la doctrine du Temps 1. L'implémentation\n> v3 (`tools/admin/conseil_emergences.py`) ajoute : 2 Pontonniers (ANCRÉ + LIBRE)\n> en sièges LLM dédiés, un `cards_refutateur` qui cherche explicitement les cards\n> qui valident/réfutent, et un score de fécondité chiffré /9 (objectivation du\n> verdict). Vue d'ensemble : `conseil_overview`. Diagnostic complet :\n> `jmj/rapports/analyses/conseil_diagnostic_ameliorations.md`.\n\nDétail du **Temps 1** du Conseil — la moitié **générative** qui fait apparaître les composants\ntransverses qui n'existent pas encore (ponts, abstractions) avant de les soumettre au Temps 2.\nL'**ossature** (les trois juges, la valve à sens unique, la garde-friction, la décorrélation,\nle triage qui décide *si* on génère) est dans le chapeau **`conseil_modele`** — ici, le « comment »\nde la génération.\n\nRappel cadre (détail dans le chapeau) : on **génère d'abord, on valide ensuite** ; jamais le même\nsiège pour générer et valider (valve) ; on juge la **fécondité**, jamais la vérité ; seules passent\nau Temps 2 les hypothèses fécondes **qui préservent la friction**. Le Temps 1 ne se déclenche qu'en\nrégime **intégration / synthèse** (triage (c) du chapeau).\n\n## Phase A — détection des trous\n\nRendre l'absent visible par la **forme de son absence** :\n- deux régions/clusters traités séparément mais qui co-occurrent ou devraient se relier ;\n- des concepts qui reviennent ensemble sans qu'aucun nœud ne NOMME ce qu'ils partagent ;\n- des structures de **forme isomorphe** dans des régions distantes (analogie cross-domaine).\n\nEn corpus, laisser **`tools/admin/conseil_emergences.py`** les localiser **déterministiquement**\n(croisements de dimensions sous-pontés, cards transverses sous-connectées, grands axes ; détection\n→ advisors → verdict de fécondité ; pattern `agent_runner` 3 phases ; **garde de fraîcheur** :\nrefuse si corpus/doctrine ont bougé depuis le `--prepare`). Recalcul **LIVE**, jamais relu d'un\nrapport figé (`db_source_de_verite_donnees_en_db_fichiers_vues`). Hors-corpus (sans graphe), c'est une **heuristique**, pas une\nmesure — le dire.\n\n**Deux régimes** (ils décorrèlent) :\n- **ANCRÉ** : croise les axes internes du champ, vérifie en DB. Risque propre = la **complaisance**\n  (épouser le cordon sanitaire du champ).\n- **LIBRE** : importe des cadres externes (autres disciplines) et les plaque sur le sujet. Risque\n  propre = la **métaphore qui décolle**, ou rouvrir une porte fermée à raison.\n\nSignal le plus fort : quand les deux régimes **convergent sur le MÊME objet par des chemins\nopposés** — l'intuition est robuste.\n\n## Phase A — Pontonniers (v3 : sièges LLM dédiés)\n\n**V3** — fini l'ambiguïté « advisors validateurs qui proposent en passant ». Le Temps 1\na désormais **3 sièges LLM dédiés** à la génération :\n\n- **Pontonnier ANCRÉ** — propose 3-5 ponts **internes** (entre cards / chaînes / fiches / termes existants). ANTI-RECYCLAGE : la liste exhaustive des existants est dans le pack.\n- **Pontonnier LIBRE** — propose 3-5 ponts **externes** (cadres d'autres disciplines : écologie, médecine, économie, anthropologie, physique). Attention au risque propre : métaphore qui décolle, ou rouvrir une porte fermée à raison.\n- **Cards réfutateur** — pour chaque candidat et chaque pont, recense les cards qui le **valident** ou l'**infirment** (`concept_card_links.link_type='contradicts'` notamment). Si une card contredit → verdict=artefact.\n\nChaque pont est une **HYPOTHÈSE explicitement marquée** — des **INTITULÉS**, **jamais** du\ncontenu rédigé (`pas_agent_redacteur`). Le signal le plus fort : quand l'ANCRÉ et le LIBRE\n**convergent sur le MÊME objet par des chemins opposés** — l'intuition est robuste.\n\n## Phase A — le filtre de fécondité (v3 : score chiffré /9)\n\n**V3** — fini le verdict subjectif `feconde|artefact|deja_captee`. Chaque advisor rend\nune **grille chiffrée** qui agrège en un **total /9** :\n\n| Dimension | Plage | Évaluation |\n|---|---|---|\n| **portée** | 0-3 | 0 = une paire ; 1 = 2-3 paires ; 2 = 4-9 ; 3 = ≥10 |\n| **compression** | -2 à +2 | +2 = comprime une REDONDANCE ; 0 = neutre ; -1 = superficiel ; **-2 = DISSOUT une tension productive** → interdit |\n| **fécondité prédictive** | 0-2 | fait apparaître une relation testable non enregistrée (0=non, 1=une, 2=plusieurs) |\n| **critère négatif** | 0-2 | cite une épreuve concrète (source, donnée, observation) — 0=aucune, 1=vague, 2=précise+reproductible |\n\n**TOTAL = portée + compression + fécondité prédictive + critère négatif.** Plage : -2 à +9.\n\n| Verdict | Condition |\n|---|---|\n| `feconde` | total ≥ 5 **ET** compression ≥ 0 |\n| `artefact` | total < 5 **OU** compression < 0 (veto automatique M0) |\n| `deja_captee` | candidat reformulant un existant (anti-recyclage) |\n| `a_sourcer` | aucune card ne l'appuie (diagnostic du `cards_refutateur`) |\n| `neutre` | ni fécond ni rejetable, prudence |\n\nL'agrégation à la consolidate calcule **score moyen + dispersion** par candidat ; un\ndésaccord >3 points entre advisors déclenche une **alerte dispersion** dans le dossier\ndu chairman.\n\nNe pénalise **jamais** la nouveauté en tant que telle ; ne récompense **jamais** la compression en\ntant que telle. Ici l'anti-marteau n'est pas tué mais **INVERSÉ** : il devient ce filtre qui **trie\nsans tuer**.\n\n## ⚑ GARDE-FRICTION (leçon M0) — la règle qui manquait\n\nLe filtre ne récompense **jamais la compression en bloc**. **Un bon pont NOMME la friction, il ne\nla dissout jamais.** Lors de l'exploration « Conseil divergent » du 2026-06-13, un méta-principe\nunificateur séduisant — **M0**, « le sol = recyclage redox de la nécromasse » — a été **rétrogradé** : il\ncompressait, donc *semblait* fécond, mais fondre deux pistes en tension productive dans un\nméta-récit lisse **éteint la friction féconde**. *Unifier éteint la friction ; on ne grave pas de\nméta-principe, on préserve les frictions.* Le contradicteur-synthèse (Temps 2) traque la **friction\ndissoute** autant que le fait non vérifié.\n\n## Outil et dérivé portable\n\n- **Outil corpus** : `tools/admin/conseil_emergences.py` (détection déterministe + advisors +\n  verdict de fécondité, garde de fraîcheur).\n- **Prompt portable** (hors-corpus, sans graphe) : `jmj/outils/conseil_v2_prompt.md` (génération +\n  validation unifiées ; voir aussi `conseil_prompt.md` pour la pure validation).\n\n## Anti-patterns spécifiques au Temps 1\n\n- **Récompenser la compression en soi** → rejouer M0 (friction dissoute sous couvert de « synthèse »).\n- **Agents rédacteurs** : les sièges proposent des intitulés, jamais du contenu (`pas_agent_redacteur`).\n- **Consolider sur contexte périmé** : la garde de fraîcheur refuse si corpus/doctrine ont bougé\n  depuis le `--prepare` (`db_source_de_verite_donnees_en_db_fichiers_vues`).\n- **Sauter le triage** → rallumer le marteau qu'on prétend éteindre (le Temps 1 ne se déclenche\n  qu'en régime intégration/synthèse, cf. chapeau `conseil_modele`).\n- **Mettre la vérité dans le Conseil** : une hypothèse féconde est *promue* vers le juge externe\n  (Jenni), jamais gravée comme vraie ici.\n", "type": "workflow", "crit": true}]}, "sources-autoritaires": {"nom": "Sources autoritaires externes", "entries": [{"id": "enrich_sources_doctrine", "titre": "Enrichissement sources — doctrine multi-source et routing DOI", "contenu": "# Enrichissement sources — doctrine multi-source et routing DOI\n\n**PB** (Problème) : 10035 sources bibliographiques dont ~532 sans `resume_court`\n(plafond ~94%). Les sources sont hétérogènes (papers, livres, chapitres,\npreprints, essais FR) et **aucune API unique ne couvre tout**. Le routing\nmulti-source est nécessaire.\n\n**Solution** : module `tools/lib/source_enrich.py` + 4 tools MCP associés.\nSource de vérité pour les paramètres : table `config` catégorie `enrich`.\n\n## Sources disponibles — rendements observés (corpus Sol Vivant, 2026-07)\n\n| Source | Endpoint | Rendement abstracts | Rendement métadonnées | Notes |\n|---|---|---|---|---|\n| **CrossRef** | `api.crossref.org/works` | ~11% (41/374) | ~56% (200/357 sur champs biblio) | Politely pool avec mailto. Couvre papers classiques. **Vide sur livres/Zenodo/essais FR**. |\n| **Zenodo** | `zenodo.org/api/records/<id>` | **96% (26/27)** | n/a | **API directe** (fix session 2026-07-16). Récupère `metadata.description` (HTML nettoyé). Exceptions : records 410 GONE (supprimés). |\n| **Semantic Scholar** | `api.semanticscholar.org/graph/v1` | **0%** (0/352 testé) | n/a | Inefficace sur ce corpus mais **tldr** parfois dispo (résumé 1 phrase auto-généré). Pool partagé sans clé. |\n| **HAL** | `api.archives-ouvertes.fr/search` | 0% (0/30 testé) | n/a | Thèses et dépôts FR. Utile pour `url LIKE '%hal%'` même sans DOI. |\n| **OpenLibrary (ISBN)** | `openlibrary.org/isbn/<isbn>` | à valider | n/a | **Livres/chapitres** (ISBN-13 extractible du DOI). |\n| **OpenLibrary (titre)** | `openlibrary.org/search.json` | **0%** (0/2 testé sur livres pointus) | n/a | Pour livres sans ISBN extractible. Rendement nul sur ce corpus (livres trop spécifiques). |\n| **BnF (SRU Dublin Core)** | `catalogue.bnf.fr/api/SRU` | **NON ACTIONNABLE** | n/a | Dublin Core sans champ abstract. Nécessiterait InterMarcX (lourd). |\n\n**Conclusion doctrine mise à jour (session 2026-07-16, 3e session)** :\n- CrossRef reste roi pour papers classiques (abstracts + métadonnées).\n- **Zenodo direct API est la 2e source** (~96% rendement sur dépôts Zenodo).\n- S2, HAL inefficaces ; OpenLibrary par titre inefficace sur ce corpus.\n- **BnF hors de portée simple** (Dublin Core sans abstract).\n\n## Routing DOI par type (`route_doi` dans `source_enrich.py`)\n\nLe routing choisit l'ordre des sources selon le préfixe DOI :\n\n| Pattern DOI | Routing | Justification |\n|---|---|---|\n| `10.1007/978*`, `10.1079/978*`, `10.1016/[Bb]978*` | **openlibrary → crossref** | Livres/chapitres (Springer, CABI, Elsevier). ISBN-13 extractible. |\n| `hal.*`, `10.x/hal.*`, `10.x/tel.*` | **hal → crossref** | Dépôts français (thèses, papers FR). |\n| `10.5281/zenodo.*` | **zenodo → crossref → s2** | **API directe Zenodo d'abord** (96% rendement, fix session 2026-07-16). CrossRef en fallback. |\n| `10.22541/*`, `10.48550/*`, `10.2643/*` | **s2 → crossref** | Preprints (ChemRxiv, arXiv). CrossRef souvent vide. |\n| `10.1071/*` (CSIRO) | **crossref → s2** | Couverture CrossRef bonne. |\n| Default `10.x/*` | **crossref → s2** | Papers académiques standard. |\n\n**Source de vérité** : `route_doi(doi)` dans `tools/lib/source_enrich.py`.\nToute modification du routing se fait dans `_DOI_PATTERNS` (liste de\ntuples `regex, sources`).\n\n## Configuration centralisée (`config.enrich.*`)\n\nTous les throttles et limites dans la table `config` (règle AGENTS.md #5) :\n\n| Clé | Défaut | Rôle |\n|---|---|---|\n| `crossref_throttle` | 0.2s | Polite pool CrossRef |\n| `s2_throttle` | 2.0s | Pool partagé S2 |\n| `hal_throttle` | 1.0s | API HAL lenient |\n| `openlibrary_throttle` | 0.5s | API OL |\n| `s2_chunk_size` | 50 | Batch POST S2 |\n| `max_abstract_chars` | 500 | Tronquer abstracts longs |\n| `min_abstract_chars` | 50 | Filtrer abstracts trop courts |\n| `http_timeout` | 15s | Timeout HTTP par défaut |\n| `http_retries` | 3 | Retries sur 429/5xx |\n| `user_agent_mailto` | (email JMJ) | Polite pool CrossRef/HAL/OL |\n\n**Bootstrap** : `ensure_config(con)` dans `source_enrich.py` fait `INSERT OR IGNORE`\ndes 10 clés. Idempotent.\n\n## Résolution des citations inline (P1/P2)\n\nLe tool MCP `resolve_inline_citations(fiche_id, with_crossref_suggestions, max_suggestions, context_hint)`\nidentifie les citations `(Auteur, année)` non matchées dans une fiche et propose\ndes DOI candidats via CrossRef.\n\n**Leçon critique (session 2026-07-16)** : sans `context_hint`, ~80% des\nsuggestions CrossRef sont **hors-sujet** (surname+year seul trop bruité —\nex : (akiyama, 2005) retourne des papers d'ingénierie électrique japonaise).\n\n**Fix** : passer un `context_hint` court (1-3 mots-clés larges du domaine) :\n- `'soil plant'` pour fiches agronomie\n- `'soil microbial'` pour fiches microbiologie\n- `'tree biomass'` pour fiches foresterie\n- `'hedgerow agroforestry'` pour fiches paysage\n\nAvec contexte, le taux de pertinence apparent monte à **~75%**. Mais mesure\nfine (session 2026-07-16, 3e session) montre que la pertinence **réelle**\nest plus faible (~21%) à cause de la **barrière FR↔EN**.\n\n### Barrière FR↔EN (mesurée session 2026-07-16)\n\nLe contexte local des fiches est en **français** ; les titres paper en **anglais**.\nOverlap de mots significatifs : **0/15** (test rigoureux sur fiche #132).\nExemples : \"exsudats\" ≠ \"exudates\", \"déshydratation\" ≠ \"dehydration\".\n\n**Méthode validée** : subagent LLM contextuel (FR↔EN).\n- POC fiche #132 : 1/10 VALIDE (10%) — Gerhardt 1984 paper sur subcellular metabolite ↔ contexte \"malate vacuoles\".\n- 3 subagents parallèles sur 9 fiches (66 cites) : **14 VALIDE (21%)**.\n- Patterns de faux positifs fréquents : homonymes auteurs (Andersen, Davies, Douglas), papers médicaux vs agronomie (Dumont 2013 rumen ↔ oncologie).\n\n**Pipeline canonique** :\n1. Préparer batches JSON par fiche (cite + DOI top 1 + contexte local FR) dans `tmp/`\n2. Lancer N subagents `general` en parallèle (3-4 max par batch de ~20 cites)\n3. Récupérer `tmp/validation_batch_*.json`\n4. Apply : créer source si manquante (DOI) + source_usage (entity_type='fiche')\n\n**Apply** : pas de tool MCP direct — SQL manuel après validation.\n**Jamais d'apply automatique sans validation LLM ou humaine** (anti-pattern inscrit).\n\n### Rendement consolidé apply P1/P2 (session 2026-07-16)\n\n- **15 DOI validés** au total sur 11 fiches P1/P2 (~21% taux VALIDE)\n- 14 nouvelles sources créées + 14 source_usages\n- Impact sur `audit_fiches refs_json KO` : stable à 11 (taux résolution amélioré mais sous seuil 85% — il faudrait ~150 DOI validés pour résoudre toutes les fiches)\n\n## Drift schéma `sources` — colonnes `lieu` et `tags`\n\nLa table `sources` (18 colonnes) **n'a pas** de colonnes `lieu` ou `tags`,\nmais elles sont référencées dans plusieurs scripts bibliographiques (héritage\nd'un schéma pré-2026 planifié puis abandonné).\n\n**Scripts corrigés (session 2026-07-16)** :\n- `tools/admin/enrich_sources_crossref.py` (bug `lieu` — corrigé session précédente)\n- `tools/admin/export_biblio.py` (bug `lieu` + `tags` dans `base_cols`)\n- `tools/admin/backfill_biblio.py` (bug `lieu` dans `BACKFILL_FIELDS`)\n\n**Scripts robustes** (utilisent `.get('lieu')`) :\n- `tools/lib/biblio_format.py` (safe)\n- `tools/admin/push_zotero.py` (safe)\n- `tools/admin/pull_zotero.py` (filtre dynamique `[c for c in wanted if c in existing_cols]`)\n\n**Test régression** : `tests/test_mcp_server.py::TestExtractCrossrefFields::test_pas_de_colonne_lieu`\nprotège contre la réapparition de `lieu` dans `extract_crossref_fields`.\n\n## Tools MCP associés (4 tools)\n\nTous dans `tools/mcp/server.py`, utilisent `tools/lib/source_enrich.py` :\n\n| Tool | Rôle | Signature |\n|---|---|---|\n| `enrich_abstracts` | Routing multi-source pour `resume_court` | `(limit, source_ids, sources)` |\n| `enrich_source_fields` | Tous champs biblio (CrossRef) | `(limit, source_ids, force_overwrite)` |\n| `resolve_inline_citations` | Liste cites inline non matchées + suggestions | `(fiche_id, with_crossref_suggestions, max_suggestions, context_hint)` |\n| `search_corpus` | Recherche unifiée fiches+cards+terms | `(query, limit_per_category, search_in)` |\n\n## Cross-références\n\n- **BQ `architecture_db_tables_vues_colonnes_cles`** — schéma complet DB\n- **BQ `audit_corpus`** — audit fiches (axe refs_json)\n- **BQ `wf_source_integration`** — workflow intégration source isolée\n- **Skill `db-query`** — consultation DB\n- **Skill `audit`** — audit corpus / fiches\n- **`tools/lib/source_enrich.py`** — module source de vérité (routing + fetchers)\n- **`tests/test_mcp_server.py`** — 54 tests (routing DOI, parsing, signatures)\n\n## Anti-patterns\n\n- ❌ Lancer `enrich_abstracts` en S2-seul (0% rendement sur ce corpus)\n- ❌ Considérer P3 « résolu » après apply (les 475 DOI placeholders + 20 essais FR sans DOI resteront)\n- ❌ Confondre « fiche orpheline » = « taux citations bas » (≠ nb usages bas)\n- ❌ Apply automatique sans validation sur `resolve_inline_citations` (25% bruit résiduel)\n- ❌ Ajouter `lieu` ou `tags` dans un SELECT/INSERT/UPDATE sur `sources` (drift schéma)\n- ❌ Hardcoder throttles/limites (règle AGENTS.md #5 → table `config`)\n", "type": "reference", "crit": false}, {"id": 114, "titre": "Doctrine alignement INRAE — corpus = référence, INRAE = préférence", "contenu": "## Doctrine d'alignement INRAE — préférence, pas autorité\n\n**Règle** : le corpus *Le Sol Vivant cet Holobionte* est la **référence**.\nLe thésaurus INRAE (v2.6, ~16 500 concepts) est une **préférence d'alignement**\nquand c'est pertinent, pas une autorité qui primerait sur le corpus.\n\n### Justification\n\nLe corpus est alimenté exclusivement par :\n- Jenni AI avec sources académiques uniquement (pas de vulgarisation non sourcée)\n- Analyses croisées l'agent sur les fiches intégrées\n- Validation JMJ (cohérence doctrinale)\n\nIl est **spécialisé** (agriculture régénératrice, biologie des sols fine,\nfermentations KNF/JADAM, holobionte, continuum sol-plante-humain) alors que\nINRAE est généraliste (toute l'agriculture + environnement).\n\nStatistiquement : au 2026-04-13, sur 900 termes corpus, **81% sont hors INRAE**.\nCe n'est pas une dette à combler, c'est une **spécificité assumée**.\n\n### Usage d'INRAE (ce qu'on fait)\n\n1. **Enrichissement synonymes** (`sync_syn_inrae.py`) : pour les 138 matchs\n   parfaits, on ajoute les altLabel INRAE comme synonymes (syn_fr, syn_en).\n   Non-destructif : on n'écrase jamais une valeur corpus.\n\n2. **Signal de divergence** : quand FR est identique mais EN diverge, on\n   génère un docx d'arbitrage (`export_mismatches_inrae.py`). JMJ arbitre\n   cas par cas (conserver corpus / adopter INRAE / fusion en synonyme).\n\n3. **Benchmark audit** : un benchmark INRAE\n   sert à positionner le corpus (part de spécificité vs alignement), pas\n   à détecter des erreurs.\n\n### Usage d'INRAE (ce qu'on ne fait pas)\n\n- ❌ Corriger automatiquement les EN du corpus sur INRAE\n- ❌ Supprimer les termes corpus qui n'ont pas d'équivalent INRAE\n- ❌ Considérer un mismatch EN comme une erreur à corriger d'office\n\n### Cas concrets (2026-04-13)\n\n**Divergences où le corpus est plus précis ou plus actuel** :\n- `Rhizophagus irregularis` (corpus) vs `Rhizophagus` (INRAE) → corpus gardé\n- `systemic acquired resistance (SAR)` (corpus) vs `systemic acquired\n  resistance` simple (INRAE sans acronyme) → corpus gardé\n\n**Divergences où INRAE propose une version plus récente** :\n- `Proteobacteria` (corpus) vs `Pseudomonadota` (INRAE, dénomination récente\n  GTDB) → à arbitrer\n\n**Divergences cosmétiques** :\n- `externalités` pluriel (corpus) vs `externalité` singulier (INRAE) →\n  décidé au cas par cas par JMJ\n\n### Référence\n\nCe document formalise la position exprimée par JMJ le 2026-04-13 après\nl'intégration d'INRAE comme référentiel auxiliaire.\n", "type": "regle", "crit": false}, {"id": "workflow_zotero_biblio", "titre": "Workflow Zotero ↔ sources (biblio du corpus)", "contenu": "## Zotero = source de vérité biblio riche ; sources = biblio du corpus syncée\n\n**Décision JMJ 2026-06-22, pivot 2026-06-23.** Zotero (user 19582809,\n`jmjuzan`) est la bibliothèque **riche** (abstracts, métadonnées, PDF, tags,\nrétractations…). `sources` reste la biblio **interne au corpus** (citée\nvia `source_usages`). La synchronisation se fait au fil de l'eau via l'**API\nweb Zotero** (api.zotero.org) — voie principale depuis 2026-06-23.\n\n### Architecture (depuis 2026-06-23)\n\n```\nsources (DB sol_vivant.db) — SOURCE DE VÉRITÉ DONNÉES\n   ├── Champs : doi, auteurs, annee, titre, journal, volume, issue, pages,\n   │            resume_court, editeur, lieu, url, type, tags\n   ├── Liens : source_usages (FK CASCADE)\n   └── Enrichissement : Semantic Scholar (abstracts manquants) + CrossRef (métadonnées)\n\n       ↓ push_zotero_web.py (POST batch 50, ~55 min pour 9385 items)\n       ↓ OU export_zotero.py → File > Import (RIS natif, dédup native)\n\nZotero (api.zotero.org + sync local port 23119)\n   ├── Items avec tags : strate (S/V/P/F/H), doc_code, type, sol-vivant\n   ├── Tags qualité : sans-resume (resume_court NULL), resume-court (<500c)\n   ├── Tags éditoriaux : Retracté, …\n   └── JMJ enrichit / dédoublonne / rédige résumés au fil de l'eau\n\n       ↓ pull_zotero.py (dry-run puis --apply, non-destructif)\n```\n\n### Scripts (un par rôle)\n\n| Script | Rôle | Quand l'utiliser |\n|---|---|---|\n| `tools/admin/push_zotero_web.py` | **Push bulk via API web** (POST batch 50) | Push complet (~55 min pour 9385), avec `--purge` pour reset |\n| `tools/admin/pull_zotero.py` | **Sync retour** Zotero → sources | Régulier, après enrichissement manuel Zotero par JMJ |\n| `tools/veille/semantic_scholar.py` | **Enrichissement resume_court** via Semantic Scholar (query DOI) | Quand % resume_court bas ; cible les NULL avec DOI |\n| `tools/admin/export_zotero.py` | Génère RIS avec tags strate/doc_code/type | Backup RIS ou import manuel alternatif |\n| `tools/admin/enrich_sources_crossref.py` | Enrichissement métadonnées via CrossRef | Compléter journal/volume/issue/pages |\n| `tools/admin/push_zotero.py` | _(déprécié)_ Push via connector local | À éviter : 0.5 item/s, préférer `push_zotero_web.py` |\n\n### Authentification\n\n- **API web** (`api.zotero.org`) : clé `ZOTERO_API_KEY` (env, ~/.bashrc),\n  header `Zotero-API-Key`. Permissions : library + files + notes + **write**.\n  → POST/PUT/PATCH/DELETE tous supportés.\n- **API locale** (`localhost:23119`) : pas de clé. GET lecture + connector\n  `/connector/saveItems` (création 1 par 1). **DELETE/PUT refusés** (501).\n\n### Push bulk — workflow type\n\n```bash\n# Dry-run (compte + échantillon)\npython3 tools/admin/push_zotero_web.py --db sol_vivant.db\n\n# Purge complète + push propre (reset Zotero)\npython3 tools/admin/push_zotero_web.py --db sol_vivant.db --purge --apply \\\n    --include-orphans --include-no-locator\n\n# Push seul (exclut doublons déjà présents — pas de dédup native API web)\npython3 tools/admin/push_zotero_web.py --db sol_vivant.db --apply\n```\n\n### Enrichissement Semantic Scholar (abstracts manquants)\n\n⚠ **Migration 2026-07** : `tools/admin/enrich_scholarai.py` est supprimé (ScholarAI abandonné). Le remplacement par `tools/veille/semantic_scholar.py` est à outiller (script d'enrichissement à recréer).\n\n```bash\n# Cible : abstracts manquants avec DOI\npython3 -c \"\nimport sqlite3\nc = sqlite3.connect('sol_vivant.db')\nn = c.execute(\\\"SELECT COUNT(*) FROM sources WHERE doi IS NOT NULL AND (resume_court IS NULL OR resume_court = '')\\\").fetchone()[0]\nprint(f'{n} sources avec DOI sans resume_court')\n\"\n\n# Workaround manuel via le client S2 (à scripter)\npython3 -c \"\nimport sys\nsys.path.insert(0, 'tools')\nfrom veille.semantic_scholar import SemanticScholarClient\nclient = SemanticScholarClient()\n# paper = client.get_paper('DOI:10.1038/...')\n# abstract = paper.get('abstract')\n\"\n```\n\n- **API gratuite, pas de clé requise**. Client : `tools/veille/semantic_scholar.py`.\n- Rate limit : throttle recommandé (S2 limite à ~1 req/seconde sans clé).\n- **Réflexe `semantic_scholar_mirror_local_reflexe`** (RULES.md) : toute acquisition → INSERT en DB dans la même session.\n\n### Tags qualité dans Zotero (posés à la création)\n\n- `sans-resume` : `resume_court` NULL ou vide.\n- `resume-court` : `resume_court` non vide mais < 500 chars.\n- Permet à JMJ de filtrer dans Zotero UI les refs à enrichir manuellement.\n\n### Pull retour (sync Zotero → DB)\n\n1. JMJ enrichit Zotero manuellement (abstracts, PDF, dédoublonnage).\n2. `python3 tools/admin/pull_zotero.py --db sol_vivant.db` (dry-run)\n3. Vérifier le bilan (abstracts/champs à récupérer).\n4. `--apply` (non-destructif : champs vides seulement, `--force-overwrite` pour forcer).\n\n### Marquage spécial — Rétractées\n\nTag Zotero « Retracté » posé par JMJ → propagation manuelle :\n`UPDATE sources SET tags = 'Retracté' || COALESCE(';' || tags, '') WHERE doi = '...'`.\n3 cas initiaux (2026-06-22) : #4292 Meloidogyne, #9218 Acanthus, #7328 Bacillus.\n\n### Audit pré-push (à refaire si nouvelle vague bulk)\n\n```bash\n# Dédup interne (DOI / URL) — doit être 0 doublon DOI\nsqlite3 sol_vivant.db \"SELECT LOWER(doi), COUNT(*) FROM sources WHERE doi!='' GROUP BY LOWER(doi) HAVING COUNT(*)>1\"\n\n# Audit resume_court (< 300c) — distinguer bruit import vs légitimes\nsqlite3 sol_vivant.db \"SELECT id, LENGTH(resume_court), SUBSTR(resume_court,1,60) FROM sources WHERE resume_court IS NOT NULL AND resume_court!='' AND LENGTH(resume_court) < 300\"\n```\n\n### Anti-patterns\n\n- **Pas de `LIKE 'Summary%'` sans clause LENGTH** — matche trop large,\n  détruit des résumés légitimes (bug 2026-06-23 : 206 supprimés au lieu de 64,\n  restaurés depuis backup). Toujours borner les patterns de nettoyage par longueur.\n- **Pas de pull bulk silencieux** — toujours dry-run d'abord, JMJ voit le bilan.\n- **Pas de `push_zotero.py` (connector) pour >100 items** — trop lent (0.5/s).\n  Préférer `push_zotero_web.py` (POST batch 50, ~3 items/s).\n- **Pas d'écrasement de champs sources déjà remplis** sans `--force-overwrite`.\n- **Pas de dépendance à l'abstract Zotero pour les fiches** — `resume_court` est\n  un bonus (les fiches citent en inline `(Auteur, année)`).\n\n### Réflexes `.opencode/RULES.md` associés\n\n- `pull_zotero_reflexe` : après mise à jour Zotero par JMJ, lancer\n  `pull_zotero.py --db sol_vivant.db` (dry-run) → bilan → apply si gain.\n- `semantic_scholar_mirror_local_reflexe` : si % resume_court < 90%, lancer\n  `semantic_scholar.py` sur les NULL avec DOI, puis re-push Zotero.\n\n### Voir aussi\n\n- `tools/lib/biblio_format.py` — parsing APA, formatage RIS/APA\n- `tools/veille/semantic_scholar.py` — découverte papiers (veille, candidats JMJ) — gratuit\n- `tools/admin/export_biblio.py` — export simple (sans tags, tous filtres)\n- `tools/admin/resolve_sources_crossref.py` — Phase 1 Crossref (orphelins)\n- BQ `wf_arbitrage_jenni.md` — arbitrage Jenni\n", "type": "commande", "crit": false}, {"id": 131, "titre": "Doctrine Shift Project — source autoritaire transition FR", "contenu": "## Doctrine — The Shift Project comme source autoritaire pour la transition FR\n\nLe Shift Project (fondé par Jean-Marc Jancovici) est la référence de fait pour\ntoute analyse chiffrée de la transition énergie-climat en France. Scientifiquement\nsolide, consensus d'experts, revue par pairs interne, méthodologie transparente.\n**Les données Shift ne nécessitent pas de re-vérification** — elles sont intégrées\ntelles quelles dans le corpus, avec attribution claire.\n\n### Sources Shift disponibles dans la DB\n\n- **`sources` #1667** — The Shift Project (organisation, 2026)\n- **`sources` #1668** — Carbone 4 (cabinet conseil Jancovici, paire)\n- **`sources` #1669** — **Rapport final PREF 2026** — « Réussir la transition\n  dans l'incertitude : la méthode Shift en 20 chantiers » (340 pages, avril 2026)\n  → `jmj/pdf/Reussir-dans-lincertitude-SHIFT-PROJECT-avril-2026.pdf`\n- **`sources` #1670** — Synthèse PREF 2026 (28 pages)\n  → `jmj/pdf/PREF_Shift-Project_Transition-robuste_14-avril-2026.pdf`\n\n### Tables dérivées du PREF 2026\n\n- **`refs` (kind=esclave_energ)** — sections `france_*` (88 params validés)\n  - `france_macro` — 8 params (émissions FR, conso énergie/élec, cibles 2050)\n  - `france_energie` — 5 params (fossiles, exposition, objectifs PTEF)\n  - `france_secteurs` — 3 params (transport, industrie, bâtiment)\n  - `france_scenarios_2050` — 13 params (trajectoires H/I/B)\n  - `france_agriculture` — 14 params (azote, Haber-Bosch, légumineuses)\n  - `france_elevage` — 15 params (bovins, revenus, CH4, ETP)\n  - `france_puits_c` — 15 params (prairies, couverts, haies, agroforesterie)\n  - `france_foret` — 10 params (mortalité, essences, scolytes, sols)\n  - `france_historique` — 1 param (COVID)\n\n- **`refs` (kind=shift_chantier)** — les 20 chantiers avec variantes H/I/B\n  - Cœur de corpus (4) : ch.14 Azote, ch.15 Élevage, ch.18 Bioénergies partiel, ch.19 Puits C\n  - Hors scope (16) : transports, bâtiment, numérique, industrie, production électrique\n\n### Règle de priorité\n\n1. **Pour une donnée France agri/énergie/climat** : chercher d'abord dans\n   `refs` (kind=esclave_energ) sections `france_*` ou `refs` (kind=shift_chantier).\n   Si présente → source unique Shift PREF 2026.\n2. **Conflit Shift vs autre** : priorité Shift (sauf si autre source est\n   primaire physique — Smil, Even, Fuller — pour les constantes physiques).\n3. **Chiffres cités dans fiches / validations / calculateurs** : format\n   `(Shift Project, 2026, p.X)` + lien source sources.\n4. **Ne jamais re-calculer Jancovici** — c'était l'erreur de la session\n   précédente. Les références physiques (PCI, rendements, puissance humaine)\n   restent Smil 2017 / Fuller 1938 ; le cadre transition FR reste Shift.\n\n### Contrepartie\n\n- Sources académiques individuelles (Jenni) → vérification systématique\n- Livres primaires (Fuller, Smil, Jancovici grand public) → vérification allégée\n- **Rapports institutionnels autoritaires (Shift, Carbone 4, ADEME, HCC, CITEPA)\n  → acceptés sans re-vérification**\n", "type": "doctrine", "crit": false}, {"id": "doctrine_deepseek_api", "titre": "API d'audit factuel — doctrine d'intégration", "contenu": "## API d'audit factuel — doctrine d'intégration\n\n**Source de vérité opérationnelle** sur l'API d'audit factuel (vérification\nscientifique, gâche 3 de l'audit conscient, cf. BQ `audit_conscient`).\n\n**Référence doc officielle** : https://api-docs.deepseek.com/\n\n**Rôle** : cette API est appelée par les scripts d'audit factuel pour produire\ndes verdicts `[VRAI]`/`[FAUX]`/`[DÉBAT]`/`[À VÉRIFIER]` sur les affirmations\ndes fiches. **Elle ne produit jamais de contenu éditorial** (cf. BQ\n`pas_agent_redacteur`).\n\n## Config DB (source unique)\n\nTous les paramètres vivent dans la table `config` (catégorie `api`) :\n\n| Clé | Description |\n|---|---|\n| `<api>_url` | Endpoint |\n| `<api>_model` | Modèle à utiliser |\n| `<api>_thinking` | `enabled` \\| `disabled` |\n| `<api>_reasoning_effort` | `high` \\| `max` |\n| `<api>_max_tokens` | Max tokens completion |\n| `<api>_timeout_s` | Timeout HTTP |\n\nLecture canonique via `lib.config.get(conn, 'api', <cle>)` et\n`get_int(conn, 'api', <cle>)`. **Ne jamais coder en dur** ces valeurs dans les\nscripts (règle `compteurs_corpus_pas_en_dur` étendue aux params API).\n\n## Authentification\n\n**Source unique** : variable d'environnement (chargée via `.env` à la racine,\ngitignoré — voir `.env.example`). Lecture via `lib.config.get_secret()`.\n\n**Aucune clé n'est jamais stockée en DB ni committée** (règle absolue secrets).\n\n## Mode thinking — contrat\n\nLe mode thinking fait précéder la réponse finale d'une chaîne de raisonnement\n(CoT) pour améliorer la précision.\n\n| Paramètre (format OpenAI-compatible) | Valeurs |\n|---|---|\n| `thinking: {\"type\": \"...\"}` | `enabled` \\| `disabled` |\n| `reasoning_effort` | `high` \\| `max` |\n\n**Compatibilité silencieuse** : `low`/`medium` sont mappés sur `high`,\n`xhigh` sur `max`. Aucune erreur n'est levée mais l'effort réel est ajusté.\n\n### Construction du payload\n\n```python\npayload = {\n    'model': model,           # lu depuis config\n    'messages': [...],\n    'stream': False,\n    'max_tokens': max_tokens, # lu depuis config\n}\nif thinking == 'enabled':\n    payload['thinking'] = {'type': 'enabled'}\nif effort in ('high', 'max', 'medium', 'low'):\n    payload['reasoning_effort'] = effort\n```\n\n### Réponse\n\nLe champ `reasoning_content` est au **même niveau** que `content` (pas imbriqué).\nLes scripts corpus lisent `msg.get('reasoning_content', '')` et\n`msg.get('content', '')`.\n\n### Pièges thinking mode\n\n- ❌ **`temperature`, `top_p`, `presence_penalty`, `frequency_penalty` ignorés**\n  en thinking mode (pas d'erreur, mais aucun effet).\n- ❌ **Multi-turn sans tool call** : `reasoning_content` des tours précédents est\n  ignoré par l'API — ne pas le re-passer (inutile, gaspille des tokens).\n- ❌ **Multi-turn avec tool call** : `reasoning_content` **doit être re-passé**\n  intégralement dans les tours suivants, sinon erreur 400.\n- ⚠ **Latence** : thinking mode + effort `high`/`max` peut dépasser 60s.\n\n## Endpoints\n\n| Endpoint | Format | Usage |\n|---|---|---|\n| `https://api.deepseek.com/chat/completions` | OpenAI | ✅ défaut corpus |\n| `https://api.deepseek.com/anthropic` | Anthropic | non utilisé (compat seulement) |\n\nHeader : `Authorization: Bearer ${API_KEY}` + `Content-Type: application/json`.\n\n## Scripts corpus utilisant l'API\n\n| Script | Rôle |\n|---|---|\n| `tools/admin/audit_factuel_deepseek.py` | Gâche 3 audit conscient (vérification factuelle fiches) |\n\n## Pattern canonique — Appel simple (audit factuel)\n\n```python\nfrom lib.config import get, get_int, get_secret\n\nkey = get_secret('API_KEY', required=True)\nurl = get(conn, 'api', 'audit_url', 'https://api.deepseek.com/chat/completions')\nmodel = get(conn, 'api', 'audit_model')\nthinking = get(conn, 'api', 'audit_thinking', 'enabled').lower()\neffort = get(conn, 'api', 'audit_reasoning_effort', 'high').lower()\nmax_tokens = get_int(conn, 'api', 'audit_max_tokens', 8000)\ntimeout = get_int(conn, 'api', 'audit_timeout_s', 300)\n\npayload = {\n    'model': model,\n    'messages': [{'role': 'system', 'content': CONSIGNE},\n                 {'role': 'user', 'content': texte_fiche}],\n    'stream': False, 'max_tokens': max_tokens,\n}\nif thinking == 'enabled':\n    payload['thinking'] = {'type': 'enabled'}\nif effort in ('high', 'max', 'medium', 'low'):\n    payload['reasoning_effort'] = effort\n\nr = requests.post(url, headers={'Authorization': f'Bearer {key}',\n                                'Content-Type': 'application/json'},\n                  json=payload, timeout=timeout)\nr.raise_for_status()\ndata = r.json()\nmsg = data['choices'][0]['message']\nverdict = msg.get('content', '')\nraisonnement = msg.get('reasoning_content', '')\n```\n\n## Anti-patterns\n\n- ❌ Hardcoder le nom du modèle ou `reasoning_effort` dans le code (toujours via `config` table).\n- ❌ Stocker une clé API en DB ou la committer (règle absolue secrets).\n- ❌ Compter sur `temperature`/`top_p` en thinking mode (ignorés silencieusement).\n- ❌ Utiliser cette API comme rédacteur éditorial (rôle : vérification/synthèse uniquement).\n- ❌ Oublier `thinking: {'type': 'enabled'}` avec un modèle thinking (l'expliciter sécurise).\n- ❌ Re-passer `reasoning_content` en multi-turn sans tool call (gaspille tokens).\n- ❌ Concurrency élevée — attention aux batches massifs en parallèle.\n\n## Références\n\n- **Doc officielle** : https://api-docs.deepseek.com/\n- **BQ connexes** : `api_externes` (toutes les API de veille), `audit_conscient` (gâche 3 factuel), `pas_agent_redacteur` (paradigme d'orchestration)\n- **Scripts** : `tools/admin/audit_factuel_deepseek.py`\n- **Secrets** : `.env.example` (template), `tools/lib/config.py` (`get_secret`)\n", "type": "regle", "crit": true}, {"id": "constrained_decoding", "titre": "Constrained decoding (logit masking) — doctrine et ressources", "contenu": "## Constrained decoding — concept général\n\n**Automates à états finis & grammaires context-free appliqués au décodage\nLLM** : à chaque étape de génération, les logits des tokens qui violeraient la\ngrammaire/le schéma cible sont masqués (entre les logits et le softmax) → le\nmodèle ne peut *physiquement* pas produire une sortie invalide.\n\nDifférence fondamentale avec la réparation post-hoc (`repair_json`) :\n**garantie à la génération** vs réparation après coup. C'est le même principe\nque la doctrine du server MCP (« contrainte **structurelle** (schéma), pas\ndiscrétionnaire (instruction prompt) »), appliqué à la génération.\n\n## Ressources de référence\n\n- **Outlines** (dottxt-ai) — lib Python de structured generation : JSON\n  Schema → automate, logit masking. Référence d'implémentation open source.\n  Backends : `outlines_core`, `xgrammar`, `llguidance`. Inférence locale\n  (Transformers, vLLM, llama.cpp, MLX) ; pour les API cloud, délègue aux\n  features natives du provider.\n  https://dottxt-ai.github.io/outlines/\n- **GBNF** (GGML BNF) — format de grammaire de llama.cpp pour contraindre la\n  génération locale. Conversion JSON Schema → GBNF intégrée\n  (`json_schema` body field, `--json` CLI). Subset de JSON Schema seulement\n  (pas de `uniqueItems`, `not`, conditionnelles ; features non supportées\n  silencieusement ignorées ; piège perf : `x? x? x?` → `x{0,N}`).\n  https://github.com/ggml-org/llama.cpp/blob/master/grammars/README.md\n- **OpenAI** — docs Structured Outputs / JSON mode / function calling.\n  `response_format: {type: \"json_schema\", strict: true}` → constrained\n  decoding server-side (schéma compilé en grammaire, caché après le 1er appel).\n  https://platform.openai.com/docs/guides/structured-outputs\n- **Anthropic** — docs tool use / JSON output. `output_config.format:\n  {type: \"json_schema\", schema}` + strict tool use → constrained decoding\n  server-side. GA sur Claude ≥ 4.5.\n  https://docs.anthropic.com/en/docs/build-with-claude/structured-outputs\n- **DeepSeek** — JSON Output : `response_format: {'type': 'json_object'}`\n  → JSON valide **sans** garantie de schéma ; known issue : contenu parfois\n  vide (prévoir retry) ; exige le mot « json » dans le prompt.\n  https://api-docs.deepseek.com/guides/json_mode\n\n## Limites (à ne pas oublier)\n\n1. **Syntaxe ≠ sémantique** : un JSON valide contre schéma peut contenir du\n   contenu halluciné → la gâche 3 (factuel) reste indispensable.\n2. **Ne résout pas la troncature** : si `max_tokens` est atteint, la sortie\n   contrainte est incomplète (`finish_reason=length`) → un filet de réparation\n   reste nécessaire.\n3. La racine des JSON cassés reste souvent le budget (CoT thinking qui sature\n   `max_tokens`) → `thinking='disabled'` + `max_tokens` dimensionné pour les\n   tâches mécaniques de batch.\n\n## Application au projet (état 2026-07-20, APPLIQUÉ)\n\n- `deepseek_client.call_deepseek(response_format={'type': 'json_object'})` :\n  retry borné automatique sur contenu vide (known issue DeepSeek) intégré au\n  client. **2 callers migrés** : `run_thesaurus_batches`, `audit_bq_deepseek`\n  (prompts déjà conformes : mention « JSON » + exemple).\n  **Non applicables** : `agent_runner` (n'appelle pas l'API — réponses via\n  agents Task opencode), `audit_factuel_deepseek` / `audit_fiche_md_deepseek`\n  (verdicts texte libre, pas JSON).\n- `repair_json` **conservé en filet** (défense en profondeur : pas de schéma\n  strict côté DeepSeek + troncature toujours possible).\n- Validé par test live opt-in (`tests/test_mcp_enrich_tools.py::\n  TestJsonObjectModeLive`) : JSON valide retourné par l'API réelle.\n- Si un jour le schéma strict devient nécessaire : OpenAI `json_schema strict`\n  ou Anthropic `output_config.format` (réintroduit un provider — arbitrage\n  coût à faire).\n- Piste veille : inférence locale (batch massif termes/sources) → Outlines +\n  GBNF (ou xgrammar via vLLM/SGLang) avec garantie stricte et coût marginal\n  nul.\n\n## Voir aussi\n\n- BQ `doctrine_deepseek_api` — config et usage de l'API d'audit factuel\n- BQ `agent_runner_garde_fous` — 13 garde-fous batch LLM (dont parsing JSON)\n- Rapport `jmj/rapports/audit/audit_api_mcp_2026-07-20.md` §5 — analyse\n  complète et plan d'action\n", "type": "regle", "crit": false}]}}, "(sans catégorie)": {"architecture": {"nom": "architecture", "entries": [{"id": "wf_mcp_server_tools", "titre": "Serveur MCP sol-vivant — doctrine des 16 tools (interface typée DB)", "contenu": "## Serveur MCP sol-vivant — doctrine des 16 tools\n\n`tools/mcp/server.py` (FastMCP, transport stdio, déclaré dans\n`.opencode/opencode.json`) est l'interface **typée** canonique des agents à la\nDB. La contrainte est **structurelle** (schéma MCP), pas discrétionnaire :\nl'agent ne peut pas inventer de flag CLI ni d'écriture hors périmètre.\n\n### Inventaire (16 tools)\n\n- **Read (5)** : `run_audit(script)` (whitelist déclarative `AUDIT_SCRIPTS`,\n  args canoniques) · `audit_fiche(fiche_id)` · `db_schema(table?)` (live via\n  `sqlite_master` + PRAGMA, jamais de nom de table en dur) ·\n  `db_query(sql, limit)` (read-only, regex mot-entier anti-faux-positifs sur\n  les colonnes `updated_at`/`created_at`) · `search_corpus(query)`\n- **Write (8)** : `write_section` (upsert, titre préservé via COALESCE) ·\n  `create_card` (card + section atomique) · `link_cards` · `create_chain` ·\n  `link_card_chain` · `create_term` (anti-doublon COLLATE NOCASE) ·\n  `link_terms` (BT/NT/RT) · `create_fiche`\n- **Enrichissement (3)** : `enrich_abstracts` · `enrich_source_fields` ·\n  `resolve_inline_citations` — routing multi-source DOI (cf.\n  `tools/lib/source_enrich.py::route_doi`)\n\n### Patterns de sécurité\n\n- Toute écriture est précédée d'une **validation FK** (entité parent existe)\n  et tracée dans `audit_log` (helper `_audit_log`).\n- `db_query` : ouverture `mode=ro` URI + `PRAGMA query_only=ON` + refus des\n  mots-clés d'écriture en **mot entier** (`\\b`), pas en sous-chaîne (régression\n  2026-07-18 : « update » ⊂ « updated_at » rejetait des SELECT légitimes).\n- Boilerplate factorisé : `_db()` / `_db_connect()` (connexion),\n  `_audit_log()` (trace), `_run_script()` (subprocess whitelisté, timeout\n  `TIMEOUT_AUDIT_S`, troncature `TRUNCATE_CHARS`).\n\n### Piège opérationnel\n\nLe serveur est un **processus long** (spawné au démarrage d'opencode) : toute\nédition de `server.py` n'est effective qu'au **redémarrage** d'opencode.\nTester les corrections hors-processus (`python3 -c \"import server; ...\"`)\navant de valider via les tools MCP.\n\n### Tests\n\n`tests/test_mcp_server.py` : routing DOI + parsing abstracts (unitaire),\ntools read sur DB réelle (intégration), signatures stables des 16 tools,\nfiltre `db_query` (faux positifs colonnes), whitelist `AUDIT_SCRIPTS`\n(chemins filesystem réels).\n", "type": "reference", "crit": false}]}}, "corpus": {"chaines": {"nom": "Chaînes causales", "entries": [{"id": 144, "titre": "Chaînes causales — concept, structure, workflow", "contenu": "## Chaînes causales — concept, structure, workflow\n\nLes **chaînes causales** (`chains_causales`) sont les démonstrations narratives transverses du corpus Sol Vivant. Elles relient des mécanismes scientifiques étape par étape à travers les strates (F→S→V→P→H), rendant visible l'enchaînement causal d'un phénomène depuis sa racine jusqu'à ses conséquences globales.\n\n### Ce qu'une chaîne EST\n\n- Un **outil pédagogique transverse** : une chaîne traverse plusieurs docs et plusieurs strates, alors qu'une fiche zoome sur un point précis.\n- Un **argumentaire pour les prompts** : `prompts.contexte_sci` peut invoquer une chaîne pour illustrer une causalité de bout en bout.\n- Une **démonstration scientifique** : chaque étape doit être étayée par le thésaurus (`terms`) et la littérature interne (`sources`).\n\n### Ce qu'une chaîne N'EST PAS\n\n- Ce n'est pas une fiche (zoom ponctuel).\n- Ce n'est pas un schéma libre : chaque étape doit pointer vers un terme canonique du thésaurus.\n- Ce n'est pas un texte rédigé par Jenni : les chaînes sont rédigées par l'agent/JMJ en direct (workflow spécifique, pas de cycle prompt Jenni).\n\n### Structure DB\n\n```sql\n-- Table des chaînes\nCREATE TABLE chains_causales (\n  id TEXT PRIMARY KEY,              -- C1, C2, … (42 chaînes au 2026-06 ; format \"C<N>\", préfixe C obligatoire)\n  titre TEXT NOT NULL,              -- \"A → B\" (flèche unicode comme séparateur)\n  docs_traverses TEXT,              -- \"P2/S4/S2/...\" (slash-joined, ordre des strates visitées)\n  valeur_ajoutee TEXT,              -- argumentaire pour les décideurs / enseignants\n  created_at TEXT\n);\n\n-- Étapes d'une chaîne (1-N)\nCREATE TABLE chain_etapes (\n  id INTEGER PRIMARY KEY AUTOINCREMENT,\n  chain_id TEXT REFERENCES chains_causales(id),\n  position INTEGER NOT NULL,        -- 1, 2, 3, ... (ordre narratif)\n  term_id INTEGER REFERENCES terms(id),  -- OBLIGATOIRE : terme pivot canonique\n  term_fr_text TEXT,                -- miroir lisible du terme (DOIT correspondre à terms.fr)\n  strate_etape TEXT,                -- F | S | V | P | H (strate de l'étape, peut différer du doc_code)\n  role_dans_chaine TEXT             -- rédaction 1-3 phrases qui LIE explicitement à la position précédente\n);\n```\n\n### Conventions (incidents 2026-04-11 → règles)\n\n1. **Numérotation** : `C<N>` uniquement (C1, C2, …). Pas de 0-padding, pas de préfixe doc.\n2. **Pas de placeholders `[XX]`** : les étapes créées en mars 2026 avaient `term_fr_text = '[P2]'` — incident résolu par la session 22 qui a rédigé C1-C6 à partir de zéro (cf. audit_reports #32).\n3. **term_id obligatoire** : une étape sans `term_id` est un bug. Le terme doit exister dans `terms` avant insertion de l'étape.\n4. **Cohérence term_fr_text ↔ term_id.fr** : `term_fr_text` est un miroir lisible. Si un terme est renommé dans `terms.fr`, re-synchroniser les étapes concernées.\n5. **Pas de scories dans role_dans_chaine (rendu EN CLAIR sur index.html)** : le champ s'affiche littéralement sur la page publique (objectif pédagogique). Aucune de ces marques de travail : préfixe `[P2]`/`[S4]` (audit #34, 2026-04-11), flèche `→` en tête de ligne, renvoi numérique inter-étapes `[N]`/`[N-N]`, méta-vocab corpus (`card #N`, `fiche #N`, « cf. fiche… »), note interne (« Boucle suggérée par audit Opus… »). Nettoyage de référence : **Conseil 2026-06-16, Palier 0** — 14 scories retirées sur C2/C12/C26/C27/C38 (science intacte).\n6. **Liaison causale explicite — registre-cible, portée DESCRIPTIVE** : registre visé pour toute chaîne — chaque `role_dans_chaine` (sauf position 1) est une **phrase complète** reliée à la précédente par une **liaison causale explicite** (connecteur ou verbe de transition : « alimente », « favorise », « déclenche », « au terme de… » ; pour un faisceau de mécanismes parallèles, des connecteurs de convergence : « à cela s'ajoute… », « ensemble, ces mécanismes… »). **Longueur libre** : pas de quota de caractères (le « 1-3 phrases » est indicatif). La flèche `→` des exemples **illustre la causalité, ce n'est pas un caractère à mettre en tête** (flèche littérale = scorie, règle 5). **Portée (Conseil 2026-06-16)** : cible des chaînes **futures et des rédactions en cours**, **non opposée rétroactivement** — une chaîne **concise mais homogène** (l'ordre porte la causalité) est acceptée en l'état ; on ne réécrit pas un corpus pour la lettre d'une règle qu'aucun script ne contrôle (constat : 211 entrées audit_log sur les chaînes, 0 sur le registre). Le vrai défaut à corriger en direct (JMJ + l'agent) est l'**hétérogénéité INTRA-chaîne** (étapes fragmentaires juxtaposées à des étapes abouties dans la même chaîne).\n\n### Workflow création (pattern validé session 22)\n\nPattern `agent_runner` pour une chaîne complète (N étapes → 1 agent dédié) :\n\n1. **Préparer le contexte** (JSON par chaîne) :\n   - `titre` + `valeur_ajoutee`\n   - liste ordonnée des positions avec `doc_code` + titre du doc correspondant\n   - thésaurus filtré : pour chaque position, tous les termes dont `doc_code` contient le code doc cible (~80 candidats par position)\n2. **Lancer 1 agent par chaîne** (général-purpose, parallèle massif) avec mission :\n   - Choisir 1 terme pivot par position parmi les candidats\n   - Rédiger `role_dans_chaine` (1-3 phrases, liaison explicite à la position précédente)\n   - Maintenir cohérence narrative avec `titre` + `valeur_ajoutee`\n   - Sortir JSON strict : `{chain_id, etapes: [{position, doc_code, term_id, term_fr_text, role_dans_chaine, justification_choix}]}`\n3. **Consolider** : valider `term_id` existe, `strate_etape` cohérente, INSERT chain_etapes.\n4. **Référence de style** : pointer les agents vers les chaînes déjà rédigées (C7, C8, C9 après avril 2026, puis toutes les 16 après la session 22).\n\n### Workflow édition\n\n- **Changer un terme pivot** : UPDATE `term_id` + resynchroniser `term_fr_text` + réécrire `role_dans_chaine` si la connexion narrative change.\n- **Réordonner** : UPDATE `position`. Attention à la liaison narrative (1→2, 2→3...) qui dépend de l'ordre.\n- **Ajouter une étape** : shift des positions suivantes, puis INSERT avec le term_id canonique.\n- **Supprimer une étape** : vérifier qu'aucune `role_dans_chaine` suivante ne fait référence explicite à ce terme.\n\n### Articulation avec le corpus\n\n| Table amont/aval | Rôle | Obligatoire |\n|---|---|---|\n| `terms` | Terme pivot de chaque étape (`chain_etapes.term_id`) | Oui |\n| `documents` | Strates traversées (`chains_causales.docs_traverses`) | Oui |\n| `sources` | Étayage scientifique dans `role_dans_chaine` (via référence textuelle) | Recommandé |\n| `concept_cards` | Concept(s) renforcés par la chaîne (via `card_chain_links`) | Optionnel |\n| `fiches` | Certaines fiches transversales invoquent des chaînes | Optionnel |\n| `prompts.contexte_sci` | Les chaînes peuvent être citées comme argumentaire | Optionnel |\n\n### Requêtes utiles\n\n```sql\n-- Inventaire des chaînes\nSELECT id, titre, docs_traverses FROM chains_causales ORDER BY CAST(substr(id,2) AS INTEGER);\n\n-- Chaîne détaillée\nSELECT position, strate_etape, term_fr_text, role_dans_chaine\nFROM chain_etapes WHERE chain_id='C1' ORDER BY position;\n\n-- Audit : étapes sans term_id (bug)\nSELECT chain_id, position, term_fr_text FROM chain_etapes WHERE term_id IS NULL;\n\n-- Audit : placeholders résiduels\nSELECT chain_id, position, term_fr_text FROM chain_etapes\nWHERE term_fr_text LIKE '[%' OR role_dans_chaine LIKE '%[%]%';\n\n-- Audit : term_fr_text désynchronisé de terms.fr\nSELECT ce.chain_id, ce.position, ce.term_fr_text, t.fr\nFROM chain_etapes ce JOIN terms t ON t.id=ce.term_id\nWHERE ce.term_fr_text != t.fr;\n```\n\n### Historique et sessions de référence\n\n- **2026-03-20** : création initiale C1-C9 avec placeholders `[XX]` (jamais rédigé).\n- **2026-04-11 Session 22** :\n  - `audit_reports #32` — rédaction C1-C6 (43 étapes, 6 agents parallèles)\n  - `audit_reports #33` — création C10-C16 (7 chaînes, 56 étapes)\n  - `audit_reports #34` — harmonisation C7-C9 + retrait 13 préfixes parasites\n- **État actuel (2026-06)** : 42 chaînes, 280 étapes, aucun placeholder, toutes les étapes liées à un `term_id`. (Le détail historique ci-dessus décrit la création initiale C1-C16 ; le corpus a grandi depuis — la DB fait foi, pas ce paragraphe.)\n\n### Scripts consommateurs\n\n- `tools/admin/check_integrity.py` (audit placeholders + FK term_id)\n- `tools/docs/gen_web.py` + `gen_dashboard.py` (rendu cartographie onglet \"Chaînes\")\n- `tools/docs/gen_concept_cards.py` (liens `card_chain_links`)\n- `tools/docs/gen_explorer.py` (exploration via interface web)\n\n### Audit\n\nPour l'audit régulier des chaînes (étapes nourries, étapes orphelines, nouvelles chaînes implicites), voir BQ `audit_corpus` §C1-C3.\n\n### Croisement chaînes ↔ fiches (absorbé depuis `chaines_croisement_fiches`)\n\n- **Liens étape → fiche** : `gen_web.py` parse `chain_etapes.notes` (`voir fiche #N`), filtre aux fiches `statut IN ('integree','jenni')`. Ajouter `[voir fiche #N <slug>]` dans `notes` pour créer un lien cliquable.\n- **Méthode de croisement** : (1) présélection mécanique terme+rôle vs fiches ; (2) sélection par jugement — 1 fiche « colonne vertébrale » + 1-2 thématiques par étape ; (3) lecture du contenu réel avant retenir ; (4) agents pour N>5 (extraction, pas rédaction) ; (5) vérif chairman.\n- **Réflexe** : à chaque nouvelle chaîne, poser ses liens fiches (sinon dette muette).\n- **Coverage** : 42/42 chaînes croisées (campagne 2026-06-16).\n", "type": "reference", "crit": false}]}, "concept-cards": {"nom": "Cartes de concept", "entries": [{"id": 106, "titre": "Concept cards — filtre de rigueur (« une affirmation bancale ne passe pas »)", "contenu": "## Concept cards — système de filtre de rigueur\n\n> **« Une affirmation bancale ne passe pas dans le corpus. »** (règle absolue JMJ)\n\nLes `concept_cards` sont l'**outil de filtre** qui garantit la qualité scientifique du corpus *Le Sol Vivant cet Holobionte*. Toute hypothèse captée — qu'elle vienne d'une note de vulgarisation, d'une intuition de lecture, d'un audit ou d'une fiche en construction — doit passer la confrontation aux dimensions conceptuelles et aux tests terrain avant d'être intégrée.\n\n### Position dans le workflow\n\n```\nCaptation (notes, lectures, intuitions)\n   ↓\nHypothèse formulée\n   ↓\n┌─────────────────────────────────────────────┐\n│ FILTRE concept_cards :                      │\n│   - Création/affinement de la carte         │\n│   - Positionnement dimension                │\n│   - Confrontation autres dimensions         │\n│   - Confrontation concept_card_tests        │\n│   - Cohérence corpus                        │\n└─────────────────────────────────────────────┘\n   ↓                            ↓\n✗ bancale                    ✓ solide\n   ↓                            ↓\narchive (mémoire de rejet)   active\n                                ↓\n                         Alimentation possible :\n                          - terms (nouveau terme canonique)\n                          - fiches (zoom proactif)\n                          - validations (confirmation/comblement)\n                          - prompts.contexte_sci/.enrichissement\n```\n\n### Architecture (tables existantes)\n\n#### `concept_dimensions` (12 axes)\n\n| ID | Dimension | Description |\n|---|---|---|\n| 1 | Cadre — Eau | Eau facteur limitant, modes d'application |\n| 2 | Cadre — Redox | Gradients redox, microzones, redox ladder |\n| 3 | Cadre — Économique | Coûts réels, énergie, filières |\n| 4 | Cadre — Socio-économique | Travail, filières, risques |\n| 5 | Cadre — Évolutif | Temporalité, évolution anaérobie→aérobie |\n| 6 | Types de sols | Comportements différenciés par texture |\n| 7 | Histoire | Histoire des sols : désastres et réussites |\n| 9 | Symptôme — MO/Hydrique | Stress MO, redox, stratégies adaptatives |\n| 10 | Symptôme — Structure | Compaction, asphyxie, diagnostic |\n| 11 | Pratique | ACS, diagnostic terrain, interventions |\n| 12 | Cycle | Cycles biogéochimiques (N, P, C, S...) |\n| 13 | Continuum | Continuum sol-plante-humain, résistome |\n\n#### `concept_cards`\n\n```sql\nCREATE TABLE concept_cards (\n    id           INTEGER PRIMARY KEY,\n    dimension_id INTEGER REFERENCES concept_dimensions(id),\n    title        TEXT,\n    description  TEXT,\n    scope_type   TEXT,\n    scope_ref    TEXT,\n    status       TEXT DEFAULT 'archive',  -- active | archive\n    docs_codes   TEXT,    -- JSON [doc_code, ...]\n    sections     TEXT,    -- JSON [section, ...]\n    adapted      INTEGER, -- 0=archive brut, 1=adapté cartographie v2\n    source       TEXT,\n    category     TEXT,\n    notes        TEXT,\n    created_at   TEXT\n);\n```\n\n#### `concept_card_tests`\n\n```sql\nCREATE TABLE concept_card_tests (\n    card_id   INTEGER REFERENCES concept_cards(id),\n    test_id   INTEGER REFERENCES terrain_tests(id),\n    relevance REAL,\n    usage     TEXT,\n    PRIMARY KEY (card_id, test_id)\n);\n```\n\n→ Liens **carte ↔ test terrain** pour validation empirique. C'est l'ancrage qui empêche l'abstraction pure.\n\n### Cycle de vie\n\n```\n[création]\n  - Nouvelle hypothèse à tester (souvent issue d'une note vulga ou d'une lecture)\n  - Création d'une carte avec dimension, scope, description\n  - statut = 'archive' par défaut\n   ↓\n[confrontation]\n  - Recherche de tests terrain pertinents → ajout dans concept_card_tests\n  - Vérification cohérence avec autres cartes de la même dimension\n  - Vérification cohérence avec corpus existant (docs_codes, sections)\n   ↓\n[verdict]\n  - ✓ Solide → status = 'active' + adapted = 1 (cartographie v2) → utilisable\n  - ✗ Bancale → reste en archive (mémoire de rejet)\n   ↓\n[exploitation aval]\n  - Cartes 'active' alimentent : terms, fiches, validations, prompts\n```\n\n### État actuel (dashboard fait foi)\n\n| Statut | Cartes | Notes |\n|---|---|---|\n| `active` | 184 | Réparties sur les 12 dimensions |\n| `archive` | 1 | Mémoire de rejet (hypothèse non passée) |\n| **Total** | 185 | |\n\n**Observation (mise à jour 2026-06)** : le système concept_cards est un **instrument vivant** du corpus (cf. addendum « la card est un instrument VIVANT », JMJ 2026-06-17, plus bas). L'épisode « mis en sommeil » d'avril 2026 est dépassé : les cartes sont activement enrichies et opérationnalisées comme filtre (rôle 1) et outil d'audit (rôle 5). Chiffres à jour : `gen_dashboard.py` / `bq_query.py --cards`.\n\n### Règles d'usage (à respecter)\n\n1. **Toute pépite captée dans une note volante** (BQ `workflow_traitement_des_notes_volantes_jmj_notes_t`) doit créer ou affiner une concept_card avant d'être intégrée au corpus. Pas de raccourci.\n\n2. **Toute fiche nouvelle** doit s'appuyer sur au moins une concept_card cohérente. Si aucune carte existante ne couvre le sujet → en créer une et la confronter avant de produire la fiche.\n\n3. **Une carte en `archive` n'est pas ressuscitée à la légère** : elle représente une affirmation qui n'a pas passé le filtre. Pour la passer en `active`, il faut une **nouvelle preuve** ou un nouveau test terrain qui change la donne.\n\n4. **Les concept_card_tests** sont obligatoires : une carte sans aucun test terrain associé est considérée comme une **hypothèse abstraite non vérifiée** — elle ne peut pas alimenter le corpus tant qu'elle n'est pas reliée à au moins un test.\n\n5. **Si l'agent utilise les concept_cards dans une analyse**, il doit le mentionner explicitement dans ses recommandations (« basé sur la carte #X dimension Y, status active, tests Z »). Pas d'affirmation orpheline sans ancrage.\n\n### Lien avec les notes volantes (BQ `workflow_traitement_des_notes_volantes_jmj_notes_t`)\n\nLa règle des pépites de BQ `workflow_traitement_des_notes_volantes_jmj_notes_t` (« ne pas écarter la vulgarisation trop vite ») est complétée par cette règle des concept_cards :\n\n> **Trouver une pépite ne suffit pas. La pépite doit passer le filtre concept_card avant d'entrer dans le corpus.**\n\nC'est ce double processus (largeur de captation × rigueur de filtrage) qui garantit que le corpus s'enrichit sans se polluer.\n\n---\n\n## Navigation et utilisation (ajout session 2026-04-11)\n\n### Les 5 rôles des concept_cards\n\nLe système concept_cards n'est pas seulement un filtre de rigueur — il est un **artefact multi-rôle** :\n\n| Rôle | Description | Utilisateur principal |\n|---|---|---|\n| **1. Filtre de rigueur** | Gate en amont des fiches/validations/termes. Bloque les affirmations bancales. | l'agent (production) |\n| **2. Navigation interne** | Cartes reliées par `concept_card_links` et `concept_card_tests`. Permet la traversée sémantique du corpus. | l'agent (consultation) |\n| **3. Diagnostic terrain** | Cartes symptômes (#33-#42), profils sols (#11-#16), tests terrain (`terrain_tests`). Entrée par observation de terrain. | Agronomes, praticiens |\n| **4. Pédagogique** | Cards structurées en arbre de décision, conditions numérotées, cas documentés. Consommables par utilisateurs finaux. | Étudiants, formateurs |\n| **5. Audit / stress-test** | Éprouver le corpus : confronter chaque affirmation aux cartes, détecter les faiblesses et contradictions. | l'agent (audit), JMJ |\n\n### Principe — la card est un instrument VIVANT, pas une entrée figée (JMJ, 2026-06-17)\n\nLes rôles 1 et 5 (filtre, audit) imposent une conséquence directe : **une card doit pouvoir être\nactualisée — et l'être.** Une card sert à *valider et diagnostiquer des affirmations* ; elle ne le peut\nque si sa `description` reflète l'**état courant du corpus**. Quand des fiches développent le concept\nqu'une card se contente de **nommer** (typiquement les cadres fondateurs `corpus_v1`, figés avant la\nmaturation du corpus), la card devient un **pointeur creux** : un filtre dégradé qui n'a plus la\nsubstance pour trancher. → l'actualisabilité n'est pas cosmétique, elle est **constitutive de la\nfonction**. C'est la justification de l'enrichissement de #1/#2/#3/#6/#8/#19 (2026-06-17).\n\nÀ distinguer de « pas de gabarit de longueur » (BQ `concept_cards_renvois_casse`) : on n'allonge pas pour allonger, **mais on\nrefuse de laisser une card se périmer** par rapport au corpus qui a grandi autour d'elle. **Réflexe\nd'audit** : ne jamais classer une card brève « concis légitime » sans appliquer le test —\n*le concept est-il livré, ou seulement nommé alors qu'une fiche le développe ?* (un Conseil peut être\ntrop généreux ; l'œil du lecteur-auteur tranche).\n\n### Tables impliquées\n\n| Table | Rôle | Lignes |\n|---|---|---|\n| `concept_dimensions` | 12 axes de pensée | 12 |\n| `concept_cards` | Cartes proprement dites | 185 (184 active) |\n| `concept_card_tests` | Liaison cartes ↔ tests terrain | 54 |\n| `concept_card_links` | Réseau inter-cartes (types: completes, contradicts, prerequisite, derives_from, related_to, supersedes, example_of) | 830 |\n| `terrain_tests` | 20 tests de terrain (VESS, infiltration, bocal, etc.) | 20 |\n\n### Répartition post-migration v2 (2026-04-11)\n\n| Dim | Nom | Cartes |\n|---|---|---|\n| 1 | Cadre — Eau | 1 |\n| 2 | Cadre — Redox | 1 |\n| 3 | Cadre — Économique | 1 |\n| 4 | Cadre — Socio-économique | 1 |\n| 5 | Cadre — Évolutif | 5 |\n| 6 | Types de sols | 7 |\n| 7 | Histoire | 1 |\n| 9 | Symptôme — MO/Hydrique | 5 |\n| 10 | Symptôme — Structure | 10 |\n| 11 | Pratique | 8 |\n| 12 | Cycle | 6 |\n| 13 | Continuum | 6 |\n\n### Migration v1 → v2 (session 2026-04-11)\n\n**Contexte** : 48 des 52 cartes initiales étaient en `status='archive'` avec source `legacy_v1_to_review` ou `base_obsolete_v1`. Seules 4 cartes (dim Cadre—Eau, source `analyse_fiches`) étaient `active`. La dim 1 (Cadre—Eau) servait de fourre-tout : 12 de ses 13 cartes appartenaient à d'autres dimensions.\n\n**Actions réalisées** :\n1. Correction dimension de 12 cartes mal placées (dim 1 → dim correcte)\n2. Activation massive des 48 cartes archive → active (adapted=1)\n3. Réécriture de 3 cartes touchées par la session (#11 sableux, #14 calcaire, #38 faim d'azote)\n4. Création de 4 nouvelles cartes (#60-#63)\n5. Tissage initial de 32 `concept_card_links`\n\n**Résultat** : 56 cartes actives, 0 archive, réseau amorcé.\n\n**Post-migration archive = rejet.** Dorénavant, une carte en `archive` signifie explicitement \"hypothèse rejetée\" (mémoire de rejet, pas legacy en attente).\n\n### Règles d'accès pour l'agent (`.opencode/RULES.md`)\n\n- `audit_cards_first` : AVANT toute création de terme/carte/fiche/validation, l'agent DOIT lancer un audit `SELECT ... FROM concept_cards WHERE ...` sur les keywords du domaine concerné\n- `carte_du_projet_vue_d_ensemble_a_lire_en_premier` : AVANT toute décision structurelle, l'agent DOIT lancer `bq_query.py --search \"<keyword>\"`\n\n### Backlog outillage (identifié 2026-04-11 — état 2026-06)\n\n- ✅ `bq_query.py --cards` / `--card <id>` / `--dim <nom>` : sous-commandes exploration cartes — **fait**\n- ✅ `session_start.py` / `gen_dashboard.py` : ligne cartes dans le dashboard — **fait**\n- ✅ `gen_concept_cards.py` : rendu HTML/web des cartes (dans `regen_all.py`) — **fait**\n- ⬜ `check_integrity.py --cards` : heuristique de détection de contradictions entre cartes — reste à faire\n\n- BQ `audit_corpus` — cards comme outil d'audit (rôle 5 opérationnalisé)\n\n## Contexte\n\nfiltre de rigueur scientifique\n\n### Tissage inter-card & cards_liees (absorbé depuis `cards_tissage_et_cards_liees`)\n\n- **`doctrine_chantiers.cards_liees`** = vitrine narrative curée à la main (2-11 cards emblématiques par axe). Ne jamais calculer un « % de couverture » depuis `cards_liees` — le vrai tissu vit dans `concept_card_links` + `card_chain_links`.\n- **Tisser à la création** : toute nouvelle card est tissée au graphe inter-card dès sa création — viser ≥ `config.audit.tissage_inter_card_min` (défaut **3**) liens pertinents. Jamais pour vider un compteur.\n- **Filet** : `check_integrity` flague les cards chaîne-câblées mais inter-card faibles (`check_cards_weakly_woven`).\n", "type": "reference", "crit": true}, {"id": 112, "titre": "Concept cards — contradictions explicites uniquement (pas d'heuristique texte)", "contenu": "## Concept cards — contradictions explicites uniquement\n\n**Règle** : les contradictions entre concept cards doivent être **tissées\nexplicitement** via `concept_card_links.link_type='contradicts'`. Pas de\ndétection par heuristique texte (trop de faux positifs — cf session\n2026-04-12 où 10 faux positifs `surface/incorpor` ont été détectés dans la\ndimension Pratique alors que c'était précisément son objet).\n\n### Source de vérité\n\n```sql\nSELECT ccl.from_id, ccl.to_id, c1.title, c2.title, ccl.notes\nFROM concept_card_links ccl\nJOIN concept_cards c1 ON c1.id = ccl.from_id\nJOIN concept_cards c2 ON c2.id = ccl.to_id\nWHERE ccl.link_type = 'contradicts'\n  AND c1.status = 'active' AND c2.status = 'active';\n```\n\n### Cycle de vie d'une contradiction\n\n```\n[détection]\n  - l'agent ou JMJ identifie une opposition de fond entre deux cartes actives\n    (pas un simple antonyme de vocabulaire — un désaccord doctrinal)\n   ↓\n[tissage]\n  - INSERT dans concept_card_links avec link_type='contradicts'\n  - notes = justification brève de l'opposition\n   ↓\n[arbitrage]\n  - Relecture des deux cartes + corpus + tests terrain\n  - Quatre issues possibles :\n    (a) une carte est affinée/reformulée → le conflit disparaît\n    (b) une carte passe en archive → l'autre survit\n    (c) les deux restent avec un link_type='completes' + note pour expliquer\n        le contexte où chacune s'applique (fausse opposition contextuelle)\n    (d) les deux restent en 'contradicts', le débat est porté VOLONTAIREMENT\n        (deux paradigmes scientifiquement opposés mobilisés en miroir,\n        « ne pas auto-résoudre ») → tension productive, débat vif du fil directeur\n   ↓\n[résolution OU maintien productif]\n  - (a,b) : le lien 'contradicts' est supprimé\n  - (c)   : le lien est remplacé par 'completes'\n  - (d)   : le lien 'contradicts' est CONSERVÉ, mais `notes` reçoit un mot-clé\n            d'exclusion (`productive`, `volontaire` ou `par design`) →\n            check_integrity ne le compte plus comme dette (cf. docstring\n            check_cards_explicit_contradictions)\n  - check_integrity retombe à 0 sur ce check\n```\n\n### Issue (d) — la tension productive (débat vif assumé)\n\nToute contradiction n'est pas une dette à éliminer. Le corpus **porte** certains\ndébats scientifiques ouverts comme axes structurants (les « DÉBATS VIFS » du\ncentre d'audit) : deux paradigmes opposés tenus en miroir parce que la science\nn'a pas tranché. Les résoudre artificiellement appauvrirait le corpus.\n\nPour ces cas, le lien `contradicts` est **conservé** et sa `notes` est marquée\nd'un mot-clé reconnu par le check — convention française privilégiée :\n`[Tension productive et volontaire]` (l'anglicisme `par design` est aussi\naccepté par le code mais à éviter, cf. réflexe `audit_anglicismes`). La règle de\nfond reste : ne marquer (d) que pour une opposition réellement assumée et étayée,\n**jamais** pour faire taire le check sur une vraie dette doctrinale non arbitrée.\n\n### Pourquoi pas d'heuristique texte\n\nL'heuristique testée (co-occurrence d'antonymes dans les descriptions) a\nproduit 10/10 faux positifs sur `surface`/`incorpor` dans la dim Pratique.\nRaisons :\n- la dimension Pratique traite précisément du débat surface vs incorporation\n- les cartes citent les deux termes pour distinguer les contextes, pas pour\n  s'opposer\n- le texte ne dit pas qui pose la thèse et qui l'antithèse\n\nUne contradiction réelle demande une analyse sémantique que seule la lecture\n(l'agent + JMJ) peut produire. Le texte libre n'est pas une source de vérité\npour les contradictions — le tissage explicite l'est.\n\n### État au 2026-06-19\n\n- 6 liens `contradicts` actifs, **tous hors-dette** → check vert. 5 marqués\n  `[Tension productive et volontaire]` (issue d, session 2026-06-19) + 1 déjà\n  productif.\n- Ces 5 sont les axes « DÉBATS VIFS » / tensions assumées du fil directeur :\n  Nécromasse vs récalcitrance (#45↔#114, #98↔#82), fermentaire vs aérobie\n  (#49↔#18), Wood Wide Web (#132↔#133), autonomie vs SynComs (#181↔#134).\n\n### État au 2026-04-12 (historique)\n\n- 0 lien `contradicts` en DB → check vert\n- 4 `link_type` actuellement utilisés dans `concept_card_links` : related_to\n  (101), completes (23), prerequisite (3), derives_from (2)\n- Les autres types mentionnés dans le schéma (`contradicts`, `supersedes`,\n  `example_of`) sont disponibles à l'usage\n\n### Voir aussi\n\n- BQ `audit_corpus` §K3 — passe d'audit dédiée aux contradictions actives\n", "type": "regle", "crit": true}, {"id": 165, "titre": "Concept cards — convention de casse des renvois inline (deep-links SvRichText)", "contenu": "## Concept cards — renvois inline cliquables : LA CASSE COMPTE\n\nIssu du chantier « homogénéité des cards » (Conseil 2026-06-16/17, jumeau du Conseil chaînes).\n\n### La règle\n\nLa `description` d'une concept card est rendue par **`SvRichText`** (`html_templates#16`,\n`sv-shared-components`), qui transforme certains motifs en **deep-links cliquables**. La regex est\n**SENSIBLE À LA CASSE ET AU FORMAT** :\n\n```\n/Card #(\\d+)(?:\\s*\\([^)]*\\))?|Card \"([^\"]+)\"|`code`|**gras**|*ital*|fiche (\\d+)/g\n```\n\n→ Pour qu'un renvoi devienne un lien, il faut l'écrire **exactement** :\n\n| Cible | ✅ Écrire | ❌ Ne marche PAS (rendu en texte mort) |\n|---|---|---|\n| une card par id | `Card #74` | `card #74`, `carte #74`, `(#74)` |\n| une card par titre | `Card \"titre exact\"` | — |\n| une fiche | `fiche 225` | `fiche #225` (le `#` casse le match) |\n\n⚠ **Piège de la parenthèse traînante** : `Card #N (texte)` fait **avaler `(texte)`** par la regex\n(groupe optionnel `(?:\\s*\\([^)]*\\))?`). Si une glose suit le renvoi, utiliser un **tiret** :\n`Card #74 — phages = vecteurs d'ARG` (pas `Card #74 (phages…)`). Le `fiche (\\d+)` n'a PAS ce groupe :\n`fiche 225 (glose)` est sûr.\n\n### Pourquoi cette BQ existe\n\nLes cards rédigées à partir de ~2026-06 multipliaient les renvois `card #N` / `fiche #N` / `(#N)` —\ntoutes **mauvaise casse/format** → **0 deep-link inter-card ne fonctionnait** (36 refs cassées sur 11\ncards, #177-#192). Réparé par normalisation (audit_log 2026-06-17). À l'écriture de toute nouvelle card :\n**écrire `Card #N` / `fiche N`**, et vérifier le rendu si une parenthèse suit.\n\n### Notes connexes (mêmes Conseils)\n\n- **Pas de modèle de longueur — MAIS une exception** : la card est un **filtre de rigueur**\n  (`filtre_de_rigueur`), pas un gabarit de caractères. `description` n'est gatée que par un plancher\n  anti-vide (`length ≥ 20`, `check_integrity`). « Concis ≠ brouillon » : un `cadre`-lentille bref ou un\n  `symptome`-template 2 lignes est complet par conception, et la cible doctrinale est **RELIER**\n  (`concept_card_links` ≥3, `cards_tissage_et_cards_liees`), **pas allonger** → pas d'enrichissement de\n  masse par la longueur.\n  **L'exception (arbitrée par JMJ, 2026-06-17)** : les **cadres FONDATEURS** (`source=corpus_v1`,\n  2026-01) sont un cas distinct — ils **précèdent le modèle riche** ET le corpus a **mûri autour d'eux**\n  (des fiches dédiées développent désormais leur concept). Leur brièveté n'est alors PAS « concis par\n  conception » mais un **pointeur creux** : la card nomme un concept (« esclaves énergétiques ») sans le\n  délivrer alors que la matière existe. C'est une **vraie dette d'enrichissement SUR LE FOND** (pas la\n  longueur), à solder en direct (JMJ + l'agent), en gardant le registre lentille (~600-850c : concept +\n  ordre de grandeur + levier + cross-links sourcés). Fait pour #1/#2/#3/#6/#8/#19 (2026-06-17). Le test\n  qui distingue : *« le concept est-il livré, ou seulement nommé alors qu'une fiche le développe ? »* —\n  le Conseil avait d'abord été trop généreux (tout classé « concis légitime ») ; c'est l'œil de JMJ\n  (lecteur-auteur) qui a tranché. Ne PAS généraliser aux cards récentes ni aux types-concis.\n- **`category` est visible** : badge + filtre (`catFilter`) sur concept_cards.html. Une card mal\n  catégorisée trie mal et trompe le lecteur (corrigé : #17/#18 `symptome`→`cadre`, 2026-06-17). Vérifier\n  que l'ouverture du contenu (« **Cadre :** », « Diagnostic terrain : »…) colle à la `category`.\n- **Champ `sections` abandonné** (non vide sur ~5/185, contenu résiduel `[\"#25\",\"#11\"]`) : ne pas\n  l'alimenter, toute la rédaction vit dans `description`. Colonne conservée (compat), non dropée.\n", "type": "doctrine", "crit": false}, {"id": 153, "titre": "LiFoFer — position pédagogique du corpus sur le repiquage (pas une règle universelle)", "contenu": "**Préambule** : il n'y a pas de règle universelle sur la réactivation/repiquage en LiFoFer. Chaque praticien adapte selon son échelle, son matériel et ses contraintes. La position ci-dessous est celle **retenue pour le corpus** (cohérence pédagogique), elle n'arbitre pas les pratiques.\n\n---\n\n### Variantes mondiales reconnues — le corpus n'arbitre pas\n\nLa fermentation appliquée à l'agroécologie a des traditions loca
