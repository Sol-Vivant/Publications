 (bovins, revenus, CH4, ETP)\n  - `france_puits_c` — 15 params (prairies, couverts, haies, agroforesterie)\n  - `france_foret` — 10 params (mortalité, essences, scolytes, sols)\n  - `france_historique` — 1 param (COVID)\n\n- **`refs` (kind=shift_chantier)** — les 20 chantiers avec variantes H/I/B\n  - Cœur de corpus (4) : ch.14 Azote, ch.15 Élevage, ch.18 Bioénergies partiel, ch.19 Puits C\n  - Hors scope (16) : transports, bâtiment, numérique, industrie, production électrique\n\n### Règle de priorité\n\n1. **Pour une donnée France agri/énergie/climat** : chercher d'abord dans\n   `refs` (kind=esclave_energ) sections `france_*` ou `refs` (kind=shift_chantier).\n   Si présente → source unique Shift PREF 2026.\n2. **Conflit Shift vs autre** : priorité Shift (sauf si autre source est\n   primaire physique — Smil, Even, Fuller — pour les constantes physiques).\n3. **Chiffres cités dans fiches / validations / calculateurs** : format\n   `(Shift Project, 2026, p.X)` + lien source jenni_sources.\n4. **Ne jamais re-calculer Jancovici** — c'était l'erreur de la session\n   précédente. Les références physiques (PCI, rendements, puissance humaine)\n   restent Smil 2017 / Fuller 1938 ; le cadre transition FR reste Shift.\n\n### Contrepartie\n\n- Sources académiques individuelles (Jenni) → vérification systématique\n- Livres primaires (Fuller, Smil, Jancovici grand public) → vérification allégée\n- **Rapports institutionnels autoritaires (Shift, Carbone 4, ADEME, HCC, CITEPA)\n  → acceptés sans re-vérification**\n", "type": "doctrine", "crit": false}]}}, "corpus": {"chaines": {"nom": "Chaînes causales", "entries": [{"id": 144, "titre": "Chaînes causales — concept, structure, workflow", "contenu": "## Chaînes causales — concept, structure, workflow\n\nLes **chaînes causales** (`chains_causales`) sont les démonstrations narratives transverses du corpus Sol Vivant. Elles relient des mécanismes scientifiques étape par étape à travers les strates (F→S→V→P→H), rendant visible l'enchaînement causal d'un phénomène depuis sa racine jusqu'à ses conséquences globales.\n\n### Ce qu'une chaîne EST\n\n- Un **outil pédagogique transverse** : une chaîne traverse plusieurs docs et plusieurs strates, alors qu'une fiche zoome sur un point précis.\n- Un **argumentaire pour les prompts** : `prompts.contexte_sci` peut invoquer une chaîne pour illustrer une causalité de bout en bout.\n- Une **démonstration scientifique** : chaque étape doit être étayée par le thésaurus (`terms`) et la littérature interne (`jenni_sources`).\n\n### Ce qu'une chaîne N'EST PAS\n\n- Ce n'est pas une fiche (zoom ponctuel).\n- Ce n'est pas un schéma libre : chaque étape doit pointer vers un terme canonique du thésaurus.\n- Ce n'est pas un texte rédigé par Jenni : les chaînes sont rédigées par Claude/JMJ en direct (workflow spécifique, pas de cycle prompt Jenni).\n\n### Structure DB\n\n```sql\n-- Table des chaînes\nCREATE TABLE chains_causales (\n  id TEXT PRIMARY KEY,              -- C1, C2, … (42 chaînes au 2026-06 ; format \"C<N>\", préfixe C obligatoire)\n  titre TEXT NOT NULL,              -- \"A → B\" (flèche unicode comme séparateur)\n  docs_traverses TEXT,              -- \"P2/S4/S2/...\" (slash-joined, ordre des strates visitées)\n  valeur_ajoutee TEXT,              -- argumentaire pour les décideurs / enseignants\n  created_at TEXT\n);\n\n-- Étapes d'une chaîne (1-N)\nCREATE TABLE chain_etapes (\n  id INTEGER PRIMARY KEY AUTOINCREMENT,\n  chain_id TEXT REFERENCES chains_causales(id),\n  position INTEGER NOT NULL,        -- 1, 2, 3, ... (ordre narratif)\n  term_id INTEGER REFERENCES terms(id),  -- OBLIGATOIRE : terme pivot canonique\n  term_fr_text TEXT,                -- miroir lisible du terme (DOIT correspondre à terms.fr)\n  strate_etape TEXT,                -- F | S | V | P | H (strate de l'étape, peut différer du doc_code)\n  role_dans_chaine TEXT             -- rédaction 1-3 phrases qui LIE explicitement à la position précédente\n);\n```\n\n### Conventions (incidents 2026-04-11 → règles)\n\n1. **Numérotation** : `C<N>` uniquement (C1, C2, …). Pas de 0-padding, pas de préfixe doc.\n2. **Pas de placeholders `[XX]`** : les étapes créées en mars 2026 avaient `term_fr_text = '[P2]'` — incident résolu par la session 22 qui a rédigé C1-C6 à partir de zéro (cf. audit_reports #32).\n3. **term_id obligatoire** : une étape sans `term_id` est un bug. Le terme doit exister dans `terms` avant insertion de l'étape.\n4. **Cohérence term_fr_text ↔ term_id.fr** : `term_fr_text` est un miroir lisible. Si un terme est renommé dans `terms.fr`, re-synchroniser les étapes concernées.\n5. **Pas de préfixes parasites dans role_dans_chaine** : la session 2026-04-11 (audit #34) a retiré 13 préfixes `[P2]`, `[S4]` ajoutés par erreur lors de la rédaction automatique.\n6. **Lien narratif explicite** : chaque `role_dans_chaine` (sauf position 1) doit relier l'étape à la précédente par un verbe de liaison causale (\"→ alimente\", \"→ favorise\", \"→ transfère\").\n\n### Workflow création (pattern validé session 22)\n\nPattern `agent_runner` pour une chaîne complète (N étapes → 1 agent dédié) :\n\n1. **Préparer le contexte** (JSON par chaîne) :\n   - `titre` + `valeur_ajoutee`\n   - liste ordonnée des positions avec `doc_code` + titre du doc correspondant\n   - thésaurus filtré : pour chaque position, tous les termes dont `doc_code` contient le code doc cible (~80 candidats par position)\n2. **Lancer 1 agent par chaîne** (général-purpose, parallèle massif) avec mission :\n   - Choisir 1 terme pivot par position parmi les candidats\n   - Rédiger `role_dans_chaine` (1-3 phrases, liaison explicite à la position précédente)\n   - Maintenir cohérence narrative avec `titre` + `valeur_ajoutee`\n   - Sortir JSON strict : `{chain_id, etapes: [{position, doc_code, term_id, term_fr_text, role_dans_chaine, justification_choix}]}`\n3. **Consolider** : valider `term_id` existe, `strate_etape` cohérente, INSERT chain_etapes.\n4. **Référence de style** : pointer les agents vers les chaînes déjà rédigées (C7, C8, C9 après avril 2026, puis toutes les 16 après la session 22).\n\n### Workflow édition\n\n- **Changer un terme pivot** : UPDATE `term_id` + resynchroniser `term_fr_text` + réécrire `role_dans_chaine` si la connexion narrative change.\n- **Réordonner** : UPDATE `position`. Attention à la liaison narrative (1→2, 2→3...) qui dépend de l'ordre.\n- **Ajouter une étape** : shift des positions suivantes, puis INSERT avec le term_id canonique.\n- **Supprimer une étape** : vérifier qu'aucune `role_dans_chaine` suivante ne fait référence explicite à ce terme.\n\n### Articulation avec le corpus\n\n| Table amont/aval | Rôle | Obligatoire |\n|---|---|---|\n| `terms` | Terme pivot de chaque étape (`chain_etapes.term_id`) | Oui |\n| `documents` | Strates traversées (`chains_causales.docs_traverses`) | Oui |\n| `jenni_sources` | Étayage scientifique dans `role_dans_chaine` (via référence textuelle) | Recommandé |\n| `concept_cards` | Concept(s) renforcés par la chaîne (via `card_chain_links`) | Optionnel |\n| `fiches` | Certaines fiches transversales invoquent des chaînes | Optionnel |\n| `prompts.contexte_sci` | Les chaînes peuvent être citées comme argumentaire | Optionnel |\n\n### Requêtes utiles\n\n```sql\n-- Inventaire des chaînes\nSELECT id, titre, docs_traverses FROM chains_causales ORDER BY CAST(substr(id,2) AS INTEGER);\n\n-- Chaîne détaillée\nSELECT position, strate_etape, term_fr_text, role_dans_chaine\nFROM chain_etapes WHERE chain_id='C1' ORDER BY position;\n\n-- Audit : étapes sans term_id (bug)\nSELECT chain_id, position, term_fr_text FROM chain_etapes WHERE term_id IS NULL;\n\n-- Audit : placeholders résiduels\nSELECT chain_id, position, term_fr_text FROM chain_etapes\nWHERE term_fr_text LIKE '[%' OR role_dans_chaine LIKE '%[%]%';\n\n-- Audit : term_fr_text désynchronisé de terms.fr\nSELECT ce.chain_id, ce.position, ce.term_fr_text, t.fr\nFROM chain_etapes ce JOIN terms t ON t.id=ce.term_id\nWHERE ce.term_fr_text != t.fr;\n```\n\n### Historique et sessions de référence\n\n- **2026-03-20** : création initiale C1-C9 avec placeholders `[XX]` (jamais rédigé).\n- **2026-04-11 Session 22** :\n  - `audit_reports #32` — rédaction C1-C6 (43 étapes, 6 agents parallèles)\n  - `audit_reports #33` — création C10-C16 (7 chaînes, 56 étapes)\n  - `audit_reports #34` — harmonisation C7-C9 + retrait 13 préfixes parasites\n- **État actuel (2026-06)** : 42 chaînes, 280 étapes, aucun placeholder, toutes les étapes liées à un `term_id`. (Le détail historique ci-dessus décrit la création initiale C1-C16 ; le corpus a grandi depuis — la DB fait foi, pas ce paragraphe.)\n\n### Scripts consommateurs\n\n- `tools/admin/check_integrity.py` (audit placeholders + FK term_id)\n- `tools/admin/audit_opus.py` (inventaire des chaînes)\n- `tools/docs/gen_web.py` + `gen_dashboard.py` (rendu cartographie onglet \"Chaînes\")\n- `tools/docs/gen_concept_cards.py` (liens `card_chain_links`)\n- `tools/docs/gen_explorer.py` (exploration via interface web)\n\n\n### Audit\n\nPour l'audit régulier des chaînes (étapes nourries, étapes orphelines, nouvelles chaînes implicites), voir BQ `audit_corpus` (#156) §C1-C3.\n", "type": "reference", "crit": false}]}, "concept-cards": {"nom": "Cartes de concept", "entries": [{"id": 153, "titre": "LiFoFer — position pédagogique du corpus sur le repiquage (pas une règle universelle)", "contenu": "**Préambule** : il n'y a pas de règle universelle sur la réactivation/repiquage en LiFoFer. Chaque praticien adapte selon son échelle, son matériel et ses contraintes. La position ci-dessous est celle **retenue pour le corpus** (cohérence pédagogique), elle n'arbitre pas les pratiques.\n\n---\n\n### Variantes mondiales reconnues — le corpus n'arbitre pas\n\nLa fermentation appliquée à l'agroécologie a des traditions locales multiples, chacune avec ses ratios, ses substrats, ses cycles d'activation et de réactivation. Quelques exemples reconnus :\n\n- **LiFoFer** (Terre & Humanisme, France) — litière forestière + son + petit-lait + mélasse\n- **MM (Microorganismos de Montaña)** (Costa Rica, Amérique centrale/Sud) — humus de forêt + son + mélasse, activation liquide ciblée 5-9 j (champignons/bactéries selon usage feuille ou sol)\n- **Super Magro** (D. Pinheiro Machado, Brésil ; large diffusion en Afrique) — biofertilisant multi-éléments, fumier frais + cocktail minéral (Zn, Mn, B, Co, Cu, Mg, Ca…) fermenté ~30 j\n- **KNF / Korean Natural Farming** (Cho Han-Kyu, Corée) — IMO, FPJ, FFJ, OHN, LAB collectés de niches précises\n- **JADAM** (Cho Youngsang, Corée) — version simplifiée et low-cost du KNF\n- **Bokashi** (Japon, EM-Kyusei) — son + EM commercial, fermentation rapide\n\nAucune de ces pratiques n'est universellement supérieure ; chaque culture a optimisé pour son climat, ses ressources locales, son échelle. **Le corpus retient T&H comme référence pédagogique** parce que :\n1. Documentation accessible en français, datée et reproductible\n2. Pratique JMJ sur 4 ans validée\n3. Ratios cohérents avec les principes physiologiques généraux de la lacto-fermentation\n\nPour les autres traditions (MM, Super Magro, KNF…), le corpus renvoie aux sources de chaque école sans prétendre arbitrer les divergences.\n\n**Variante française — fermentation lactique de plantes** : en parallèle de l'activation liquide LiFoFer, certains praticiens français fermentent des plantes (ortie, consoude, prêle, fougère, achillée…) selon le **même principe lactique anaérobie**. C'est une variante des **purins classiques** mais avec un mécanisme bien différent :\n- **Purins classiques** = putréfaction anaérobie (pH neutre/alcalin, odeurs ammoniacales, dégradation par bactéries protéolytiques)\n- **Fermentation lactique de plantes** = acidification rapide < pH 4.5, conservation longue (mois/années), peu d'odeurs, biomasse LAB intégrée\n\nCette variante combine les bénéfices de la LiFoFer (inoculum LAB stable) avec les principes actifs des plantes (silice, alcaloïdes, dérivés salicylés…). Cohérente avec le reste de la pratique, elle reste une adaptation locale parmi d'autres.\n\n### Les pratiques dépendent de l'usage ciblé\n\nLa recette, la dilution, la fréquence d'application et le choix de repiquer ou non dépendent directement de **l'usage final** :\n\n- **Application foliaire** (pulvérisation sur feuilles) — biostimulation + défense. Dilution typique 1:100 à 1:500. Nécessite une biomasse microbienne vivante → activation récente (< 7 j après production).\n- **Destruction de couvert** (terminer un engrais vert) — la fermentation lactique acidifie et lyse les tissus végétaux, restitue C/N plus rapidement qu'un simple roulage. Doses plus concentrées (1:10 à 1:50).\n- **Litière animaux** (poulaillers, étables, porcheries) — approche type Bokashi : inoculation de la litière qui fermente sur place, réduit odeurs (NH₃, H₂S), valorise fumier. Application directe ou dilution 1:100.\n- **Biostimulants** (catégorie réglementaire UE 2019/1009 — terme propre, vs « phytothérapie » réservé au soin médical *par* les plantes, vs « phytosanitaire » confisqué par le langage réglementaire pour les pesticides) — renforcement des défenses naturelles, compétition avec pathogènes, ISR/SAR. Fermentations de plantes acides (ortie, consoude, prêle) en complément. Dilution 1:50 à 1:200.\n- **Amendement de sol** — application au sol avant travail ou semis, plus tolérant sur la fraîcheur biologique.\n\n**Conséquence sur le repiquage** : plus l'usage exige une richesse microbienne fongique (foliaire défense, biostimulants), plus la doctrine « litière fraîche à chaque batch » est importante. Pour un usage amendement de sol ou litière animaux, un repiquage modéré est moins critique car l'écosystème sol/litière réensemence ensuite.\n\n---\n\n\n---\n\n## Pourquoi pas de réactivation / repiquage en série (LiFoFer, bokashi, KNF, MM)\n\nPosition corpus : une LiFoFer se refait toujours **à partir de litière forestière fraîche** pour la phase solide. Le repiquage de la phase liquide est tolérable à la rigueur (gros exploitants).\n\n### Argument principal — appauvrissement progressif\n\nCertains guides (notamment *Recettes-Lifofer-solides-liquides-et-reactivations*, 2023) proposent de prélever une partie d'une mère pour amorcer la suivante, et de réitérer 5-6 fois. Cette pratique **dégrade** progressivement le produit pour deux raisons :\n\n**1. Sélection des rapides au détriment de la diversité**\nLa valeur d'une LiFoFer est dans l'**inoculum massif et diversifié** apporté par la litière fraîche : milliers d'espèces de bactéries, levures, champignons, archées en coexistence. En repiquant depuis une mère, on ne récupère que la fraction végétative active (majoritairement LAB — *Lactobacillus*, *Leuconostoc*, *Pediococcus*) qui a dominé la fermentation. Chaque repiquage resserre le cortège sur les souches les plus compétitives en conditions anaérobies acides.\n\n**2. Les spores ne se multiplient pas — argument décisif**\nPendant la fermentation lactique anaérobie, les spores (champignons, actinomycètes, bactéries sporulantes comme *Bacillus* ou *Clostridium*) restent en état **dormant**. Elles ne se multiplient pas dans le milieu acide/anaérobie. Au repiquage, on transfère donc surtout la biomasse LAB active, peu de spores. Après 5-6 repiquages, le pool de spores est mécaniquement **appauvri** par dilution (chaque mère contient 1/Nᵏ des spores initiales, où N est le facteur de dilution et k le nombre de repiquages).\n\nRésultat : une mère de 6ᵉ génération a perdu l'essentiel de son **patrimoine fongique** (mycélium, spores actinomycètes) même si elle reste vigoureuse en activité LAB.\n\n### Nuance : gros exploitants\n\nLa doctrine « litière fraîche à chaque batch » s'applique strictement à l'échelle artisanale (60-220 L). Pour de **gros exploitants** qui produisent en fûts 220 L de mère puis en IBC 1000 L, le coût logistique de refaire à zéro à chaque cycle peut justifier un repiquage limité — en gardant à l'esprit la perte de diversité.\n\n**Phase liquide activée** : tolérable à la rigueur. La liquide a déjà perdu une part de la biodiversité solide (sélection durant la phase d'activation), et certains usages (foliaire, fertirrigation) ne nécessitent pas la richesse fongique complète.\n\n**Phase solide (mère)** : refus catégorique du repiquage en série — c'est là que le patrimoine fongique compte le plus.\n\n### Doctrine opérationnelle\n\n- Échelle artisanale : **toujours repartir d'une litière forestière fraîche** à chaque batch de mère.\n- Échelle industrielle (IBC 1000 L) : repiquage liquide acceptable, repiquage solide à éviter.\n- Sur 4 ans de pratique JMJ (60-220 L) : litière fraîche = résultats reproductibles et constants.\n\n### Ce qu'on peut réutiliser sans repiquage en série\n\n- La **mère solide** : un même batch peut servir plusieurs activations liquides (prélever 5% à chaque fois).\n- La **liquide activée** : peut s'appliquer pendant 1-2 semaines après production (au-delà, qualité décroît).\n\n### Références\n\n- Terre & Humanisme, *Guide LiFoFer* (valeurs retenues — cf. lifofer_recettes en DB)\n- *Recettes-Lifofer-solides-liquides-et-reactivations.pdf* (2023) : proposition de repiquage 5-6 fois — **position corpus : non pour la solide, à la rigueur pour la liquide chez les gros exploitants**.\n\n\n### Note éditoriale — réglementation PNPP\n\nLa réglementation française PNPP (Préparations Naturelles Peu Préoccupantes, Code rural art. L253-1, liste positive ANSES) et le règlement UE 2019/1009 (biostimulants) encadrent strictement la commercialisation de ce type de préparation. Les recettes LiFoFer/MM/Bokashi en tant que tels ne figurent pas dans la liste positive ANSES.\n\n**Position éditoriale du corpus** (responsabilité assumée par JMJ) : les recettes sont publiées à des **fins pédagogiques** pour usage personnel à la ferme, sans aucune visée commerciale. Le corpus n'est pas un avis juridique et chaque praticien reste responsable de la conformité de son usage selon son contexte (autoconsommation vs vente, ferme vs jardin, plantes traitées, etc.). Ces recettes sont par ailleurs **largement diffusées** dans la sphère agroécologique francophone (livres T&H grand public, chaînes YouTube, MOOC paysans, formations Maraîchage Sol Vivant…) — le corpus en propose une compilation pédagogique cohérente, sans diffuser d'information non publique. Enfin, le corpus **ne vend rien et ne promet rien** — aucun produit n'est commercialisé, aucune allégation sanitaire (efficacité contre maladie/ravageur, rendement garanti, etc.) n'est faite. Le corpus reste hors du périmètre opérationnel de la réglementation PNPP, qui cible la commercialisation et la communication promotionnelle de préparations à usage phytosanitaire.\n\n\n## Contexte\n\nDoctrine 2026-04-23. Argument décisif : spores ne se multiplient pas en anaérobiose lactique. Nuance gros exploitants IBC 1000L : liquide tolérable, solide non.\n", "type": "doctrine", "crit": false}, {"id": 151, "titre": "pedago_links — table générique entité ↦ concept_card (passerelle pédagogique)", "contenu": "## pedago_links — table générique de liens « entité ↦ concept_card »\n\n**Mécanisme** : table normalisée, FK vers `concept_cards`, qui permet de\nproposer pédagogiquement à l'utilisateur, à côté de toute entité du corpus\n(fiche, doc de strate, règle C/N, terme, matière), les concept cards\nles plus pertinentes pour aller plus loin.\n\n### Schéma\n\n```sql\nCREATE TABLE pedago_links (\n    id          INTEGER PRIMARY KEY AUTOINCREMENT,\n    entity_type TEXT NOT NULL CHECK(entity_type IN ('fiche', 'doc', 'regle', 'terme', 'matiere')),\n    entity_id   INTEGER NOT NULL,\n    card_id     INTEGER NOT NULL REFERENCES concept_cards(id) ON DELETE CASCADE,\n    role        TEXT NOT NULL DEFAULT 'reference' CHECK(role IN ('primaire', 'reference', 'passerelle')),\n    ordre       INTEGER NOT NULL DEFAULT 0,\n    motif       TEXT,\n    created_at  TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    UNIQUE(entity_type, entity_id, card_id)\n);\nCREATE INDEX idx_pedago_links_entity ON pedago_links(entity_type, entity_id);\nCREATE INDEX idx_pedago_links_card   ON pedago_links(card_id);\n```\n\n**entity_id** :\n- pour `fiche` → `fiches.id`\n- pour `doc`   → `documents.ROWID` (car PK = `code` TEXT, on stocke le ROWID INTEGER stable)\n- pour `regle` → `refs.legacy_id` (cn_regle ; même convention que mo_calc)\n- pour `terme` → `terms.id`\n- pour `matiere` → `refs.id`\n\n### Pourquoi une table et pas un JSON dans la colonne data\n\n- **FK = updates propagés** : si une card est désactivée/renommée, la jointure\n  active reste cohérente (on filtre `status='active'`). Un JSON figé pointerait\n  vers un ID qui n'existe plus.\n- **Vues inverses** : `SELECT entity_type, entity_id FROM pedago_links WHERE card_id=N`\n  donne instantanément « qui pointe vers cette card », utile pour l'audit.\n- **Évolution** : ajouter un nouvel entity_type est une simple modif du CHECK,\n  rien à migrer dans 50 colonnes JSON.\n\n### Workflow d'alimentation\n\n```\n1. tools/admin/pedago_links_suggest.py --entity fiche|doc\n   → audit_reports/pedago_links_proposed_<entity>_<date>.{md,json}\n   Score Overlap pondéré IDF + bonus titre :\n     - 70% recall(card_title, fiche_title)\n     - 30% recall(card_title, fiche_full)\n   Tokenizer : split sur '/' '-', stem singulier/pluriel, seuil 3 chars\n   (acronymes CEP/NPK/AMG indispensables).\n\n2. (Validation JMJ — édition manuelle du JSON si besoin)\n\n3. tools/admin/pedago_links_apply.py --json <rapport.json> --entity-type fiche|doc\n   → INSERT en bloc, role='primaire' pour top1 si score >= --primary-min,\n     role='reference' pour suivants si score >= --reference-min,\n     max --max-per-entity liens par entité.\n   --dry-run pour preview, --replace pour repartir de zéro.\n\n4. python3 tools/regen_all.py --db sol_vivant.db\n   → cahier.html, index.html (docs strates), pages outils via build_comprendre_data\n     affichent automatiquement le bloc « Pour aller plus loin — Concept Cards (N) »\n     juste avant Sources, sous chaque entité.\n```\n\n### Rendu côté front\n\nBloc `SvCollapse title='Pour aller plus loin — Concept Cards (N)' icon='🧭'`\ncontenant une liste verticale de liens vers `concept_cards.html#card-N` avec :\n- badge **#N** colorié selon `role` (info pour primaire, gris pour reference)\n- titre de la card\n\nPrésent actuellement dans :\n- **cahier.html** (sous chaque fiche déployée, via `gen_cahier.py`)\n- **index.html** (sous chaque doc strate, via `gen_web.py`)\n- **mo_calculateur.html** (sous chaque règle C/N via `cards_pedago` dans\n  `refs.cn_regle.data` — pré-existant, pattern complémentaire à pedago_links)\n- pages outils via `build_comprendre_data` (sections `fiche` enrichies)\n\n### Cas d'usage futurs\n\n- **Étendre** à `entity_type='regle'` (déjà fait dans cards_pedago via JSON,\n  à migrer vers pedago_links pour homogénéité)\n- **Étendre** à `entity_type='terme'` (un mot-clé ↦ cards qui le détaillent)\n- **Étendre** à `entity_type='matiere'` (matière MO ↦ cards minéralisation/immo)\n- **Audit hub** : `SELECT card_id, COUNT(*) FROM pedago_links GROUP BY card_id`\n  → cards qui sont les nœuds pédagogiques majeurs du corpus\n- **Cards orphelines** : `SELECT id FROM concept_cards WHERE id NOT IN\n  (SELECT card_id FROM pedago_links)` → cards jamais référencées comme\n  passerelle pédagogique, candidates à archivage ou enrichissement\n\n### Premier passage (2026-04-23)\n\n- 85 liens fiches (23 primaires + 62 références sur 34 fiches `integre*`)\n- 26 liens docs (8 primaires + 18 références sur 18 docs)\n- TOTAL : 111 liens\n- Cards-hubs émergentes : #55 Cycle eau (8), #68 M-genes (7),\n  #69 Mémoire transgénérationnelle (7), #31 Cycle N (5), #53 Cycle P (5)\n\n### Règle absolue\n\nToujours **passer par `pedago_links_suggest.py` puis `apply.py`** plutôt que\nd'éditer les liens à la main : le scoring est tracé via `motif`, et la\nreproductibilité (ré-exécuter sur un corpus enrichi) est garantie. Les\nexclusions manuelles s'éditent dans le JSON proposé avant `apply`.\n\n\n## Contexte\n\nDoctrine ajoutée 2026-04-23 lors de la généralisation du pattern « cards pédagogiques liées » apparu sur le calculateur MO (cards_pedago dans refs.cn_regle.data) puis étendu aux fiches et docs.\n", "type": "doctrine", "crit": false}, {"id": 106, "titre": "Concept cards — filtre de rigueur (« une affirmation bancale ne passe pas »)", "contenu": "## Concept cards — système de filtre de rigueur\n\n> **« Une affirmation bancale ne passe pas dans le corpus. »** (règle absolue JMJ)\n\nLes `concept_cards` sont l''**outil de filtre** qui garantit la qualité scientifique du corpus *Le Sol Vivant cet Holobionte*. Toute hypothèse captée — qu''elle vienne d''une note de vulgarisation, d''une intuition de lecture, d''un audit ou d''une fiche en construction — doit passer la confrontation aux dimensions conceptuelles et aux tests terrain avant d''être intégrée.\n\n### Position dans le workflow\n\n```\nCaptation (notes, lectures, intuitions)\n   ↓\nHypothèse formulée\n   ↓\n┌─────────────────────────────────────────────┐\n│ FILTRE concept_cards :                      │\n│   - Création/affinement de la carte         │\n│   - Positionnement dimension                │\n│   - Confrontation autres dimensions         │\n│   - Confrontation concept_card_tests        │\n│   - Cohérence corpus                        │\n└─────────────────────────────────────────────┘\n   ↓                            ↓\n✗ bancale                    ✓ solide\n   ↓                            ↓\narchive (mémoire de rejet)   active\n                                ↓\n                         Alimentation possible :\n                          - terms (nouveau terme canonique)\n                          - fiches (zoom proactif)\n                          - validations (confirmation/comblement)\n                          - prompts.contexte_sci/.enrichissement\n```\n\n### Architecture (tables existantes)\n\n#### `concept_dimensions` (12 axes)\n\n| ID | Dimension | Description |\n|---|---|---|\n| 1 | Cadre — Eau | Eau facteur limitant, modes d''application |\n| 2 | Cadre — Redox | Gradients redox, microzones, redox ladder |\n| 3 | Cadre — Économique | Coûts réels, énergie, filières |\n| 4 | Cadre — Socio-économique | Travail, filières, risques |\n| 5 | Cadre — Évolutif | Temporalité, évolution anaérobie→aérobie |\n| 6 | Types de sols | Comportements différenciés par texture |\n| 7 | Histoire | Histoire des sols : désastres et réussites |\n| 9 | Symptôme — MO/Hydrique | Stress MO, redox, stratégies adaptatives |\n| 10 | Symptôme — Structure | Compaction, asphyxie, diagnostic |\n| 11 | Pratique | ACS, diagnostic terrain, interventions |\n| 12 | Cycle | Cycles biogéochimiques (N, P, C, S...) |\n| 13 | Continuum | Continuum sol-plante-humain, résistome |\n\n#### `concept_cards`\n\n```sql\nCREATE TABLE concept_cards (\n    id           INTEGER PRIMARY KEY,\n    dimension_id INTEGER REFERENCES concept_dimensions(id),\n    title        TEXT,\n    description  TEXT,\n    scope_type   TEXT,\n    scope_ref    TEXT,\n    status       TEXT DEFAULT ''archive'',  -- active | archive\n    docs_codes   TEXT,    -- JSON [doc_code, ...]\n    sections     TEXT,    -- JSON [section, ...]\n    adapted      INTEGER, -- 0=archive brut, 1=adapté cartographie v2\n    source       TEXT,\n    category     TEXT,\n    notes        TEXT,\n    created_at   TEXT\n);\n```\n\n#### `concept_card_tests`\n\n```sql\nCREATE TABLE concept_card_tests (\n    card_id   INTEGER REFERENCES concept_cards(id),\n    test_id   INTEGER REFERENCES terrain_tests(id),\n    relevance REAL,\n    usage     TEXT,\n    PRIMARY KEY (card_id, test_id)\n);\n```\n\n→ Liens **carte ↔ test terrain** pour validation empirique. C''est l''ancrage qui empêche l''abstraction pure.\n\n### Cycle de vie\n\n```\n[création]\n  - Nouvelle hypothèse à tester (souvent issue d''une note vulga ou d''une lecture)\n  - Création d''une carte avec dimension, scope, description\n  - statut = ''archive'' par défaut\n   ↓\n[confrontation]\n  - Recherche de tests terrain pertinents → ajout dans concept_card_tests\n  - Vérification cohérence avec autres cartes de la même dimension\n  - Vérification cohérence avec corpus existant (docs_codes, sections)\n   ↓\n[verdict]\n  - ✓ Solide → status = ''active'' + adapted = 1 (cartographie v2) → utilisable\n  - ✗ Bancale → reste en archive (mémoire de rejet)\n   ↓\n[exploitation aval]\n  - Cartes ''active'' alimentent : terms, fiches, validations, prompts\n```\n\n### État actuel (2026-04-10)\n\n| Statut | Cartes | Notes |\n|---|---|---|\n| `active` | 4 | Toutes en dimension Cadre — Eau |\n| `archive` | 48 | Hypothèses non passées ou non encore confrontées |\n| Adaptées cartographie v2 | 4 | Sur 52 (8%) |\n\n**Observation** : le système concept_cards a été mis en place mais s''est mis en sommeil. Lourde réserve de matière à reprendre, mais ce n''est **pas urgent** — décision reportée à une phase ultérieure. Tant que la table existe et reste cohérente avec ce document, on peut la rebrancher quand on voudra.\n\n### Règles d''usage (à respecter)\n\n1. **Toute pépite captée dans une note volante** (BQ #102) doit créer ou affiner une concept_card avant d''être intégrée au corpus. Pas de raccourci.\n\n2. **Toute fiche nouvelle** doit s''appuyer sur au moins une concept_card cohérente. Si aucune carte existante ne couvre le sujet → en créer une et la confronter avant de produire la fiche.\n\n3. **Une carte en `archive` n''est pas ressuscitée à la légère** : elle représente une affirmation qui n''a pas passé le filtre. Pour la passer en `active`, il faut une **nouvelle preuve** ou un nouveau test terrain qui change la donne.\n\n4. **Les concept_card_tests** sont obligatoires : une carte sans aucun test terrain associé est considérée comme une **hypothèse abstraite non vérifiée** — elle ne peut pas alimenter le corpus tant qu''elle n''est pas reliée à au moins un test.\n\n5. **Si Claude utilise les concept_cards dans une analyse**, il doit le mentionner explicitement dans ses recommandations (« basé sur la carte #X dimension Y, status active, tests Z »). Pas d''affirmation orpheline sans ancrage.\n\n### Lien avec les notes volantes (BQ #102)\n\nLa règle des pépites de BQ #102 (« ne pas écarter la vulgarisation trop vite ») est complétée par cette règle des concept_cards :\n\n> **Trouver une pépite ne suffit pas. La pépite doit passer le filtre concept_card avant d''entrer dans le corpus.**\n\nC''est ce double processus (largeur de captation × rigueur de filtrage) qui garantit que le corpus s''enrichit sans se polluer.\n\n---\n\n## Navigation et utilisation (ajout session 2026-04-11)\n\n### Les 5 rôles des concept_cards\n\nLe système concept_cards n'est pas seulement un filtre de rigueur — il est un **artefact multi-rôle** :\n\n| Rôle | Description | Utilisateur principal |\n|---|---|---|\n| **1. Filtre de rigueur** | Gate en amont des fiches/validations/termes. Bloque les affirmations bancales. | Claude (production) |\n| **2. Navigation interne** | Cartes reliées par `concept_card_links` et `concept_card_tests`. Permet la traversée sémantique du corpus. | Claude (consultation) |\n| **3. Diagnostic terrain** | Cartes symptômes (#33-#42), profils sols (#11-#16), tests terrain (`terrain_tests`). Entrée par observation de terrain. | Agronomes, praticiens |\n| **4. Pédagogique** | Cards structurées en arbre de décision, conditions numérotées, cas documentés. Consommables par utilisateurs finaux. | Étudiants, formateurs |\n| **5. Audit / stress-test** | Éprouver le corpus : confronter chaque affirmation aux cartes, détecter les faiblesses et contradictions. | Claude (audit), JMJ |\n\n### Tables impliquées\n\n| Table | Rôle | Lignes |\n|---|---|---|\n| `concept_dimensions` | 12 axes de pensée | 12 |\n| `concept_cards` | Cartes proprement dites | 56 (post-migration v2) |\n| `concept_card_tests` | Liaison cartes ↔ tests terrain | 33 |\n| `concept_card_links` | Réseau inter-cartes (types: completes, contradicts, prerequisite, derives_from, related_to, supersedes, example_of) | 32 (amorçage) |\n| `terrain_tests` | 20 tests de terrain (VESS, infiltration, bocal, etc.) | 20 |\n\n### Répartition post-migration v2 (2026-04-11)\n\n| Dim | Nom | Cartes |\n|---|---|---|\n| 1 | Cadre — Eau | 1 |\n| 2 | Cadre — Redox | 1 |\n| 3 | Cadre — Économique | 1 |\n| 4 | Cadre — Socio-économique | 1 |\n| 5 | Cadre — Évolutif | 5 |\n| 6 | Types de sols | 7 |\n| 7 | Histoire | 1 |\n| 9 | Symptôme — MO/Hydrique | 5 |\n| 10 | Symptôme — Structure | 10 |\n| 11 | Pratique | 8 |\n| 12 | Cycle | 6 |\n| 13 | Continuum | 6 |\n\n### Migration v1 → v2 (session 2026-04-11)\n\n**Contexte** : 48 des 52 cartes initiales étaient en `status='archive'` avec source `legacy_v1_to_review` ou `base_obsolete_v1`. Seules 4 cartes (dim Cadre—Eau, source `analyse_fiches`) étaient `active`. La dim 1 (Cadre—Eau) servait de fourre-tout : 12 de ses 13 cartes appartenaient à d'autres dimensions.\n\n**Actions réalisées** :\n1. Correction dimension de 12 cartes mal placées (dim 1 → dim correcte)\n2. Activation massive des 48 cartes archive → active (adapted=1)\n3. Réécriture de 3 cartes touchées par la session (#11 sableux, #14 calcaire, #38 faim d'azote)\n4. Création de 4 nouvelles cartes (#60-#63)\n5. Tissage initial de 32 `concept_card_links`\n\n**Résultat** : 56 cartes actives, 0 archive, réseau amorcé.\n\n**Post-migration archive = rejet.** Dorénavant, une carte en `archive` signifie explicitement \"hypothèse rejetée\" (mémoire de rejet, pas legacy en attente).\n\n### Règles d'accès pour Claude (claude_rules)\n\n- `audit_cards_first` : AVANT toute création de terme/carte/fiche/validation, Claude DOIT lancer un audit `SELECT ... FROM concept_cards WHERE ...` sur les keywords du domaine concerné\n- `bq_access` : AVANT toute décision structurelle, Claude DOIT lancer `bq_query.py --search \"<keyword>\"`\n\n### Backlog outillage (identifié session 2026-04-11, non implémenté)\n\n- `bq_query.py --cards` / `--card <id>` / `--dim <nom>` : sous-commandes exploration cartes\n- `session_start.py` : ligne cartes dans le dashboard (total, par dim, orphelines)\n- `check_integrity.py --cards` : heuristique de détection de contradictions entre cartes\n- `gen_concept_cards.py` : rendering HTML/web des cartes comme outil pédagogique interactif\n\n- BQ `audit_corpus` (#156) — cards comme outil d'audit (rôle 5 opérationnalisé)\n\n## Contexte\n\nfiltre de rigueur scientifique\n", "type": "reference", "crit": true}, {"id": 112, "titre": "Concept cards — contradictions explicites uniquement (pas d'heuristique texte)", "contenu": "## Concept cards — contradictions explicites uniquement\n\n**Règle** : les contradictions entre concept cards doivent être **tissées\nexplicitement** via `concept_card_links.link_type='contradicts'`. Pas de\ndétection par heuristique texte (trop de faux positifs — cf session\n2026-04-12 où 10 faux positifs `surface/incorpor` ont été détectés dans la\ndimension Pratique alors que c'était précisément son objet).\n\n### Source de vérité\n\n```sql\nSELECT ccl.from_id, ccl.to_id, c1.title, c2.title, ccl.notes\nFROM concept_card_links ccl\nJOIN concept_cards c1 ON c1.id = ccl.from_id\nJOIN concept_cards c2 ON c2.id = ccl.to_id\nWHERE ccl.link_type = 'contradicts'\n  AND c1.status = 'active' AND c2.status = 'active';\n```\n\n### Cycle de vie d'une contradiction\n\n```\n[détection]\n  - Claude ou JMJ identifie une opposition de fond entre deux cartes actives\n    (pas un simple antonyme de vocabulaire — un désaccord doctrinal)\n   ↓\n[tissage]\n  - INSERT dans concept_card_links avec link_type='contradicts'\n  - notes = justification brève de l'opposition\n   ↓\n[arbitrage]\n  - Relecture des deux cartes + corpus + tests terrain\n  - Trois issues possibles :\n    (a) une carte est affinée/reformulée → le conflit disparaît\n    (b) une carte passe en archive → l'autre survit\n    (c) les deux restent avec un link_type='completes' + note pour expliquer\n        le contexte où chacune s'applique (fausse opposition contextuelle)\n   ↓\n[résolution]\n  - Le lien 'contradicts' est supprimé (a et b) ou remplacé par 'completes' (c)\n  - check_integrity retombe à 0 sur ce check\n```\n\n### Pourquoi pas d'heuristique texte\n\nL'heuristique testée (co-occurrence d'antonymes dans les descriptions) a\nproduit 10/10 faux positifs sur `surface`/`incorpor` dans la dim Pratique.\nRaisons :\n- la dimension Pratique traite précisément du débat surface vs incorporation\n- les cartes citent les deux termes pour distinguer les contextes, pas pour\n  s'opposer\n- le texte ne dit pas qui pose la thèse et qui l'antithèse\n\nUne contradiction réelle demande une analyse sémantique que seule la lecture\n(Claude + JMJ) peut produire. Le texte libre n'est pas une source de vérité\npour les contradictions — le tissage explicite l'est.\n\n### État au 2026-04-12\n\n- 0 lien `contradicts` en DB → check vert\n- 4 `link_type` actuellement utilisés dans `concept_card_links` : related_to\n  (101), completes (23), prerequisite (3), derives_from (2)\n- Les autres types mentionnés dans le schéma (`contradicts`, `supersedes`,\n  `example_of`) sont disponibles à l'usage\n\n\n### Voir aussi\n\n- BQ `audit_corpus` (#156) §K3 — passe d'audit dédiée aux contradictions actives\n", "type": "regle", "crit": true}, {"id": 162, "titre": "Cards — cards_liees (vitrine) & dette de tissage inter-card", "contenu": "## Deux clarifications sur le système de cards (Conseil cards 2026-06-12)\n\n### 1. `doctrine_chantiers.cards_liees` = vitrine narrative, PAS index de couverture\n\n`cards_liees` (liste JSON par axe du fil directeur) est une **vitrine curée à la\nmain** : 2-11 cards emblématiques par axe, les pièces narratives qui illustrent\nl'axe. Elle n'a **jamais eu vocation à couvrir les 182 cards**.\n\n→ **Ne jamais calculer un « % de couverture cards→axes » depuis `cards_liees`** :\nce serait un faux KPI (un audit a mesuré « 27% » avant de comprendre l'artefact).\nLe **vrai tissu de couverture** vit dans `concept_card_links` (graphe inter-card)\net `card_chain_links` (ancrage aux chaînes). Compléter `cards_liees` exhaustivement\n**dupliquerait** le graphe et créerait deux sources de vérité divergentes.\n\nUn axe « mince » en `cards_liees` n'est donc pas un trou : vérifier d'abord si les\ncards pertinentes existent déjà et sont reliées via `concept_card_links`\n(`audit_cards_first`).\n\n### 2. Dette de tissage — tisser À LA CRÉATION, pas après\n\n**Cause récurrente** : chaque salve de production de cards les câble aux **chaînes**\n(`card_chain_links`) mais oublie de les relier aux **autres cards**\n(`concept_card_links`). Résultat : des cards réelles mais **invisibles à la\nnavigation card-à-card**, accumulées lot par lot.\n\n**Règle** : toute nouvelle card est tissée au graphe inter-card **dès sa création**\n— viser **≥ `config.audit.tissage_inter_card_min`** (défaut **3**) liens\n`concept_card_links` *pertinents*. Choisir les liens par **pertinence réelle**\n(co-membres de chaînes = bons candidats), **jamais pour vider un compteur**\n(tisser des liens forcés appauvrit le graphe — anti-pattern).\n\n**Filet** : `check_integrity` flague en continu (à chaque `session_start`) les\ncards **chaîne-câblées mais inter-card faibles** (`check_cards_weakly_woven`,\ndegré < seuil). C'est le détecteur précis de la dette ; la check « Cartes actives\nisolées (0 lien) » ne couvre que le pire cas.\n\nSeuil ajustable : `UPDATE config SET valeur='N' WHERE categorie='audit' AND\ncle='tissage_inter_card_min'`.\n", "type": "doctrine", "crit": false}]}}, "pipeline": {"docs": {"nom": "Pipeline docs strate", "entries": [{"id": 2, "titre": "18 documents — état de production", "contenu": "Requête de démarrage :\n```sql\nSELECT d.code, d.titre, d.strate,\n       jdv.version, CASE jdv.is_frozen WHEN 1 THEN '🔒' ELSE '✏️' END as etat,\n       jds.statut_redaction, jds.priorite\nFROM documents d\nLEFT JOIN jenni_doc_versions jdv ON jdv.doc_code=d.code\nLEFT JOIN jenni_doc_specs jds ON jds.doc_code=d.code\nORDER BY jds.priorite;\n```\n\n## Contexte\n\nÉtat d'avancement global des documents\n\n## Commande\n\n```\nSELECT d.code, d.titre, d.strate,\n       jdv.version, CASE jdv.is_frozen WHEN 1 THEN 'Frozen' ELSE 'Editable' END as etat,\n       jds.statut_redaction, jds.priorite\nFROM documents d\nLEFT JOIN jenni_doc_versions jdv ON jdv.doc_code=d.code\nLEFT JOIN jenni_doc_specs jds ON jds.doc_code=d.code\nORDER BY jds.priorite;\n```\n", "type": "commande", "crit": false}, {"id": 4, "titre": "Ordre de rédaction des 18 documents", "contenu": "Phase 1 — Fondations Sol (tout le corpus y renvoie) : F1 > F2 > S0 > S1 > S2 > S3 > S4\nPhase 2 — Vivant : V1 > V2 > V3\nPhase 3 — Pratiques : P1 > P2 > P3 > P4 > P5\nPhase 4 — Humain (EN DERNIER) : H3 > H2 > H1\n\nH1 est toujours le dernier document — synthèse de tout le corpus.\n\n## Contexte\n\nPlanification de la rédaction\n", "type": "reference", "crit": false}, {"id": 43, "titre": "Commande de génération", "contenu": "python3 export_jenni_doc.py --db sol_vivant.db --doc S2\n\nOu toute une strate :\nfor doc in S0 S1 S2 S3 S4; do python3 export_jenni_doc.py --db sol_vivant.db --doc $doc; done\n\nOu tous les documents :\npython3 export_jenni_doc.py --db sol_vivant.db --all\n\nLe fichier produit (prompts_jenni_S2.txt) contient tous les prompts séparés par `---`. Copier-coller un par un.\n", "type": "commande", "crit": false}, {"id": 148, "titre": "Documents de strate — définition et taxonomie", "contenu": "## Documents de strate — définition et taxonomie\n\n### Définition canonique\n\n> **Un document de strate est une partie structurante du corpus, rédigée autour d'un axe thématique précis, couvrant un périmètre défini par sa place dans la carte F/S/V/P/H.**\n\nLes 18 documents composent l'ossature éditoriale du corpus. Chaque document est unique, fixé dès la conception du projet, et couvre un angle qui ne se recoupe que partiellement avec les autres. À la différence des fiches (zoom d'un point précis), un document de strate est une **synthèse organisée** qui couvre son sujet en profondeur sur plusieurs chapitres et sections.\n\n### Les 18 documents du corpus\n\n| Strate | Code | Titre | Position plan |\n|---|---|---|---|\n| F (Fondements) | F1 | Le Temps Long | P1 |\n| F (Fondements) | F2 | L'Économie du Vivant | P2 |\n| S (Sol) | S0 | L'Eau dans le Sol Vivant | P5 |\n| S (Sol) | S1 | Architecture du Sol | P6 |\n| S (Sol) | S2 | Le Microbiome du Sol | P7 |\n| S (Sol) | S3 | Le Microbiome Fongique et Mycorhizien | P8 |\n| S (Sol) | S4 | Le Carbone et les Grands Cycles | P9 |\n| V (Vivant) | V1 | La Faune du Sol | P10 |\n| V (Vivant) | V2 | L'Holobionte Plante-Microbiome | P11 |\n| V (Vivant) | V3 | Les Fermentations Microbiennes | P12 |\n| P (Pratiques) | P1 | Diagnostic du Sol Vivant | P13 |\n| P (Pratiques) | P2 | Agriculture de Conservation | P14 |\n| P (Pratiques) | P3 | Biostimulants et Fermentations Appliquées | P15 |\n| P (Pratiques) | P4 | Agroforesterie et Systèmes Pérennes | P16 |\n| P (Pratiques) | P5 | La Transition | P17 |\n| H (Humain) | H1 | Sol, Alimentation et Santé Humaine | P19 |\n| H (Humain) | H2 | Le Microbiome Intestinal | P18 |\n| H (Humain) | H3 | La Résistance Antimicrobienne | P20 |\n\n### Ce qu'un document EST\n\n- Une synthèse structurée en chapitres et sections sur un axe thématique précis\n- Un texte long (15-40 k mots rédigés) construit pour servir de socle éditorial\n- Un élément fixe de l'ossature du corpus (les 18 docs sont définis, pas créés à la demande)\n- Un cadre nourri par les fiches transversales et zooms intégrés au fil du temps\n\n### Ce qu'un document N'EST PAS\n\n- Une fiche (zoom court d'un point précis) — voir BQ `fiche_definition`\n- Une validation d'affirmation ou de chaîne — voir BQ validations\n- Un document créé à la demande — les 18 docs sont fixés dès la conception\n\n### Tables du modèle\n\n- **`documents`** : métadonnées (code, titre, strate, statut, mots_cible_min/max, doc_maitre, note)\n- **`prompts`** : sections du plan (une ligne par section avec type `intro`/`section`/`conclusion`), champs `chapitre`, `section`, `titre_h1`, `titre_h2`, `titre_h3`, `contexte_sci`, `instructions`, `enrichissement`, `style`, `tableau`, `ordre`, `statut`\n- **`doc_contenus`** : contenu rédigé INTÉGRÉ (blob markdown du retour Jenni, une ligne par doc avec `contenu_integre`, `refs` JSON, versionné). **Source canonique du texte final.**\n- **`jenni_doc_specs`** : métadonnées amont du prompt de document (titre_jenni, angle_entree, public, priorite, style global)\n- **`source_usages`** : FK vers `jenni_sources` quand le doc cite des refs déjà en DB\n\n### Vues utiles\n\n- `v_prompts_actifs` — prompts de sections en cours\n- `v_prompts_incomplets` — sections sans contexte_sci ou instructions\n- `v_avancement` — état du cycle de production par doc\n- `v_sante` — dashboard santé globale du corpus\n\n### Champs et tables dépréciés (**ne pas utiliser**)\n\n- `jenni_doc_versions` : **legacy** — versions historiques prompts/ébauches. Non lue par la carto (`gen_web.py`). Conservée pour archive uniquement.\n- `prompt_contenus` : legacy remplacé par `prompts.enrichissement`. Ne plus écrire.\n\n### Cycle de vie (`documents.statut`)\n\n```\na_faire          → prompts pas encore rédigés pour toutes les sections\nen_cours         → prompts rédigés en DB, pas encore exportés à Jenni\npret_a_rediger   → prompts complets, export possible, envoi Jenni\nenvoye           → .docx généré et remis à Jenni\nrecu             → .docx retour Jenni récupéré dans docx/\nintegre          → contenu Jenni intégré (blob markdown dans `doc_contenus`, version ≥ 1)\ncloture          → doc considéré finalisé éditorialement (JMJ validation finale)\n```\n\n### Lien avec le reste du corpus\n\n- Les **fiches** intégrées enrichissent les `prompts.contexte_sci`/`enrichissement` des sections pertinentes via la propagation (phase 4 des fiches, étape --propagate).\n- Les **termes canoniques** du thésaurus sont automatiquement injectés dans chaque prompt selon `terms.doc_code`.\n- Les **chaînes causales** qui traversent un document peuvent être citées dans les amorces de section.\n- Les **concept cards** pertinentes au doc sont référencées dans `enrichissement`.\n\n### Principe éditorial\n\nLe document est écrit **une seule fois dans sa version finale** (le prompt envoyé à Jenni doit déjà être le brouillon mûr, pas un squelette). La stratégie cercle vertueux F → S → V → P → H garantit que chaque strate rédigée enrichit la DB pour les suivantes (voir BQ `ordre_de_redaction_des_18_documents`).\n\n### BQ complémentaires\n\n- `ordre_de_redaction_des_18_documents` — ordre et stratégie de production des docs (cercle vertueux F → S → V → P → H)\n- `commande_de_generation` — commandes de génération / régénération\n- `regles_de_redaction_des_documents_jenni_reference` (BQ #146) — règles unifiées de rédaction pour tout document Jenni\n- `bq_clean_discipline` (BQ #120) — discipline BQ-clean sur les prompts\n", "type": "reference", "crit": false}]}, "fiches": {"nom": "Pipeline fiches", "entries": [{"id": 69, "titre": "Fiches — définition et taxonomie", "contenu": "## Fiches — définition et taxonomie\n\n### Définition canonique\n\n**Une fiche est un document à part entière au service du corpus, qui exerce simultanément deux fonctions :**\n\n1. **Zoom** — approfondissement ciblé sur une partie clef du corpus (un mécanisme, un concept, une controverse, une pratique).\n2. **Service au corpus** — son contenu vient répondre à un besoin précis identifié dans le corpus :\n   - Combler une **lacune** documentée (sujet absent, paradigme manquant)\n   - **Valider** une affirmation existante avec sources et données récentes\n   - **Contredire** ou nuancer un consensus daté\n   - **Articuler** plusieurs strates autour d'un mécanisme transversal\n   - **Arbitrer** une controverse scientifique active\n\nChaque fiche doit être briefée comme un cas particulier — il n'y a pas de fiche standard. Le besoin précis qu'elle vient servir est documenté dans `fiches.notes` au moment de sa création (cf. BQ `wf_fiche_production`).\n\n### Sous-types (`fiches.type`)\n\n| Type | Usage | Structure |\n|---|---|---|\n| `transversale` | Articule plusieurs strates autour d'un mécanisme, d'une controverse ou d'une cascade | Title + Intro + 6-7 H1 body + Résumé + Références (auto Jenni) |\n| `zoom` | Approfondissement ciblé sur un point précis (ex : Kirkby/AMG, Drilosphère) | Même structure, généralement 5-6 H1 body |\n| `technique` | Protocole DIY, méthode de mesure, préparation biologique | Charte dédiée 5 H2 immuables — voir BQ `charte_fiches_techniques_diy` |\n\n### Origine de la rédaction — fiche Jenni vs fiche Claude\n\nAxe **orthogonal** aux sous-types : selon la nature du sujet et des sources disponibles, une fiche relève de l'un de **deux régimes de rédaction**.\n\n| Régime | Sujet | Sources admises | Rédacteur |\n|---|---|---|---|\n| **Fiche Jenni** | Concept / mécanisme **scientifique** (ce que dit la science) | **Académiques en open access uniquement** (comité de lecture, DOI) | Jenni — cycle graine → retour → intégration |\n| **Fiche Claude** | Sujet **non (encore) couvert par la science académique** mais **officiellement reconnu** | Organismes officiels de confiance : think tanks experts (ex. **The Shift Project**), agences, institutions | Claude **en direct** (sur demande explicite de JMJ), **jamais Jenni** |\n\n- **Fiche Jenni** (cas standard) : on extrait ce que la science établit d'un mécanisme — *les principes de la lactofermentation*, pas *« LiFoFer »*. La graine envoyée à Jenni n'embarque **que des sources académiques en open access** ; jamais de littérature grise comme source citable.\n- **Fiche Claude** : pour ce que la science n'a pas (encore) formalisé mais qui est porté par des sources **officiellement reconnues et de confiance**. Le matériau est audité puis intégré au corpus, et Claude rédige la synthèse en direct. Les pratiques praticiennes (KNF, JADAM, LiFoFer…) en sont un autre cas — cf. `pratiques_typees_hors_jenni`.\n- **Pseudoscience strictement interdite** dans les deux régimes, quelle que soit la popularité ou la diffusion du sujet (cf. BQ `pseudo`).\n\n**Critère opérationnel** : la question a-t-elle une réponse dans la littérature scientifique ?\n- Oui — c'est un **mécanisme générique** (*combien de sucre pour réussir une lactofermentation dans les règles de l'art ?*) → **Jenni**.\n- Non — elle ne porte que sur une **recette / protocole typé** (*combien de sucre dans la LiFoFer ?*, non établi scientifiquement) → **Claude**, qui décortique le mécanisme générique sous-jacent et cite la préparation comme simple instance.\n\n**Règle de cloisonnement** : une source non académique (think tank, organisme officiel, manuel praticien) peut **fonder une fiche Claude** mais ne doit **jamais** figurer comme source citable dans une **graine Jenni** — Jenni travaille exclusivement en open access académique.\n\n**Tag en base** : le champ **`fiches.origine`** (`jenni` | `claude`, défaut `jenni`) matérialise ce régime. Il permet de cibler un audit ou un export « fiches Jenni » (ex. *quelles fiches renvoyer à Jenni ?*) **sans embarquer les fiches Claude**, qui y produiraient du bruit et des effets indésirables — et réciproquement pour un traitement propre aux fiches Claude.\n\nExemple : #41 `transition-robuste-france-shift-pref` (fragilité systémique fossile + transition robuste) est une fiche Claude d'après le Shift Project — pas de cycle Jenni, donc pas de docx de retour (le docx d'archive est rendu depuis le rédigé pour l'alignement de l'audit).\n\n### Cycle de vie — modèle fiche/graine (refonte 2026-05-30)\n\nLe statut de la **fiche** (corpus-facing) est **séparé** de celui de la **graine**\n(pipeline Jenni). Principe : *le corpus n'a pas à savoir qu'une fiche repart en\nrun Jenni*.\n\n**`fiches.statut`** — 3 valeurs seulement :\n```\njenni     → pas encore intégrée (en cycle, quel que soit l'état de sa graine)\nintegree  → intégrée (contenu_integre dispo) ; reste integree même si une nouvelle\n            graine repart en run Jenni\narchive   → obsolète\n```\n\n**`graines.statut`** — pipeline interne, versionné (1 ligne / cycle) :\n```\na_rediger → graine à (re)rédiger\nredigee   → graine rédigée, docx prêt à envoyer\nenvoyee   → docx uploadé à Jenni\nrecue     → retour Jenni reçu\nrecreee   → graine régénérée post-intégration (temps-2), prête pour un cycle\na_jour    → graine alignée sur l'intégration courante\n```\n\n- **Cahier** : `integree` → l'intégration ; `jenni` → la graine courante.\n- **Intégration validée** → `fiches.statut='integree'` + création auto de la graine suivante.\n- Design complet : `jmj/rapports/design_separation_fiche_graine.md`.\n\n### Tables du modèle\n\n- **`fiches`** — métadonnées (slug, titre, type, **`origine`** = `jenni`|`claude`, **`is_diy`** = `0`|`1`, strates, docs_cibles, **`statut` = `jenni`|`integree`|`archive`**, version) + `notes` = brief éditorial + propagation des intégrations passées\n  - **`is_diy`** : axe **orthogonal** au type et à l'origine. Marque les fiches du **domaine praticien DIY** (KNF, JADAM, LiFoFer, EM, bokashi, Jeevamrit, natural farming, fermentations/préparations à la ferme) — quel que soit le type (`technique`/`zoom`/`transversale`) ou l'origine. Une fiche DIY **peut** être traitée par Jenni tant que l'angle reste académique (description du mécanisme, pas la recette). Le flag permet d'inclure/exclure ces sujets dans les audits, exports et listes de production **sans s'appuyer sur le type** (qui ne les regroupe pas).\n- **`graines`** — pipeline Jenni : une ligne par cycle de graine d'une fiche (`fiche_id`, `version`, **`statut`** = a_rediger/redigee/envoyee/recue/recreee/a_jour, `date_export`, `date_retour`, `priorite_envoi`)\n- **`fiche_sections`** — sections de la graine courante (`ordre`, `type`, `titre`, `contexte_sci` = graine synthétique de Claude). L'intégré moderne est dans `fiche_retour_sections`\n- **`fiche_contenus`** — une ligne par fiche (UNIQUE) : `contenu_integre` (markdown intégré), `refs` (JSON cache d'affichage des refs), `notes_claude`\n- **`source_usages`** — source de vérité pour les liens fiche ↔ jenni_sources\n\n### Champs dépréciés (ne pas utiliser)\n\n- `fiches.prompt_jenni`, `fiches.sources_dois`, `fiches.notes_editoriales_h2` : supprimés en 2026-04\n- `fiche_section_h2_notes` : table dépréciée (workflow granulaire H2 remplacé par `fiche_sections.type='body_h2'`)\n- `fiche_contenus.contenu_brut`, `fiche_contenus.version` : supprimés en 2026-04\n\n### Workflow en 3 phases\n\n```\nPhase 1 — Production (BQ wf_fiche_production)\n   Identifier le besoin → brief éditorial → graines synthétiques → docx léger → envoi Jenni\n\nPhase 2 — Co-rédaction Jenni (hors champ Claude)\n   JMJ pilote section par section dans le chat Jenni → docx retour enrichi (×5-10)\n\nPhase 3 — Intégration consciente (BQ wf_fiche_integration) — moment crucial\n   Contrôles techniques + analyse intégrative + apply + intégration refs + audit croisé + propagation\n```\n\n### Anti-patterns (relégués ailleurs)\n\n- Pas d'agents Task pour rédiger : BQ `pas_agent_redacteur` #136\n- Pas de méta-vocab dans le brief Jenni : BQ `redaction_documents_jenni` #146\n- Pas de sujets interdits : BQ `sujets_interdits_corpus` #154\n- Pas de batch INSERT thésaurus depuis le retour : BQ `wf_fiche_integration` #147\n\n### Voir aussi\n\n- BQ `wf_fiche_production` (#130) — comment produire une fiche\n- BQ `wf_fiche_integration` (#147) — comment intégrer le retour Jenni\n- BQ `redaction_documents_jenni` (#146) — règles de rédaction transversales\n- BQ `charte_fiches_techniques_diy` (#121) — structure spécifique fiches techniques\n", "type": "reference", "crit": false}, {"id": 163, "titre": "Workflow propre — plan détaillé + graine dense axée corpus (anti-bricolage Jenni)", "contenu": "## Workflow propre — produire un plan détaillé + graine dense, AXÉ corpus\n\nBut : ne plus **bricoler avec Jenni** pour obtenir un plan détaillé aligné sur les\naxes du corpus. Le plan + la graine sont construits **en amont, depuis le corpus**,\nsi bien que Jenni n'a qu'à **enrichir** (×5-10), pas à corriger la structure.\nIssu du Conseil 2026-06-13 (verdict : *pas de machinerie — discipline + densité +\nchapeau*). Complète `wf_fiche_production` (#130, fait foi sur le pipeline).\n\n### Deux cas, à NE PAS confondre\n\n1. **Fiche neuve OU à refaire complètement** → produire une **GRAINE** (plan plat +\n   puces denses, ci-dessous) → docx graine → Jenni enrichit.\n2. **Fiche déjà intégrée** dont on veut le docx (relecture, ré-envoi) → **regénérer\n   le docx COMPLET depuis la BASE** (`gen_fiche_docx.py` mode reprise, lit\n   `contenu`), **JAMAIS l'archive** : l'archive (docx retour Jenni) est **périmée**\n   car les corrections faites en base à l'intégration n'y sont pas. L'archive ne\n   sert qu'à l'historique.\n\n### Le déficit réel (diagnostic DB, pas le plan)\n\nLe plan n'est presque jamais le problème (médiane **6 sections** plates, 9 % à ≤4).\nLe vrai déficit = **densité de graine** : médiane **675 ch/section** vs cible\n**1000-1200** (modèle #37). Effondrement temporel mesuré : avril 1133 → **mai 399**\n(lot de 152 fiches) → juin 758. **C'est la GRAINE qui s'étiole, pas le plan.**\n\n### Étape A — Dériver le plan (PLAT, du sujet, jamais d'un gabarit)\n\n- Le plan se **dérive du corpus**, pas d'un moule (`wf_fiche_production` : « chaque\n  section = un besoin réel »). Cible **6-8 sections** plates (type `section`),\n  numérotées dans le titre, **zéro H2** (Jenni narrativise en H2 au retour, c'est\n  son travail — pas le nôtre).\n- **Census = MIROIR, pas MOULE** : regarder comment 2-3 BONNES fiches `integree`\n  du même thème ont découpé leur plan, pour **repérer les angles oubliés** — jamais\n  pour coller des titres. ⚠ **EXCLURE la vague #109-154** (30 fiches `zoom` au\n  gabarit cloné « articulation doctrines régénératives » — l'anti-pattern à NE PAS\n  rééditer).\n\n### Étape B — Le CHAPEAU : axes obligatoires par thème (check de couverture)\n\nAvant de figer le plan, vérifier que les **grands axes du fil directeur** propres au\nthème sont couverts (sinon on « passe à côté »). C'est un **CHECK**, pas un template\n(les titres restent dérivés du sujet) :\n\n| Thème de la fiche | Axes obligatoires à couvrir (sinon trou) |\n|---|---|\n| **Minéral / oligo-élément** | #11 abondance minérale = pathogène (équilibre, pas dose) · #7 la demande biologique gouverne · **#10 continuum sol→plante→intestin — « du grain à l'humain », NE JAMAIS s'arrêter à la plante** · #6 statut contextuel (carence ici / toxique là) |\n| **Pratique / intrant (DIY)** | clé-de-voûte (la pratique sert le vivant) · #20 EROI / autonomie / low-tech · #13 le microbe pas bénéfique par nature · **angle MÉCANISME, pas recette** (`pratiques_typees_hors_jenni`) |\n| **Microbien (PGPR/CMA…)** | #13 aucun microbe bénéfique par nature (contexte) · #6 statut variable · #14 désarmer le parasite désarme la symbiose · #18 WWW réseau réel vs surinterprété |\n| **Mécanisme (priming, sidérophores…)** | #7 primat du vivant · #9 fertilité = mémoire étagée · la cascade causale qui le situe |\n| **Sol / structure** | #12 anoxie = puits, microsites redox · clé-de-voûte (structure biogène) · #17 nécromasse / MAOM |\n\n(Source des axes : `doctrine_chantiers` type ≠ chantier.)\n\n### Étape C — Écrire la graine en PUCES DENSES (le format-cible JMJ)\n\nPar section, **~1000-1200 ch**, **3-5 puces** mécanistiques. Forme (exemple JMJ) :\n\n```\n->N - <Titre de section dérivé du sujet>\n  → <mécanisme + CHIFFRE/ordre de grandeur + terme canonique>\n  → <mécanisme + chiffre + terme>\n  → <le maillon qui relie au chapeau / à la chaîne causale>\n```\n\n- **Télégraphique** : flèches, fragments nominaux, **zéro verbe de bilan** (« X\n  s'affirme comme… » = rédaction déguisée → Jenni reformate au lieu d'enrichir).\n- **Chiffres = ordre de grandeur**, jamais une valeur finale sourcée : exprimer\n  par `~`, « de l'ordre de » ou une plage. **JAMAIS de marqueur `[à sourcer]` /\n  `[à compléter]`** dans la graine — viole #146 règle 1 (« le document = lui-même,\n  pas de placeholder ») : le docx part tel quel à Jenni, un crochet éditorial s'y\n  retrouverait (corrigé 2026-06-16, audit #146 ; #146 fait foi sur le format).\n  Sinon Jenni **recopie nos chiffres** sans source neuve = faux-riche, pire qu'une\n  graine maigre. Sources autoritaires → dans `fiches.notes` (brief), **jamais dans\n  le docx**.\n- **PAS de gabarit** « Mécanismes : / Termes : » (`#146.6`) — les termes canoniques\n  sont **dans** les puces.\n\n### Étape D — Générer + scanner + envoyer\n\n`PYTHONPATH=tools python3 tools/jenni/gen_fiche_docx.py --db sol_vivant.db --fiche-id <N>`\npuis scan méta-vocab (hook `check_forbidden_jenni`) + `audit_graines.py` (densité).\nOptionnel : une ligne en chapeau du docx « structure à un seul niveau de titre,\npas de sous-sections » (cible la dérive H2 de Jenni au retour ; à tester).\n\n### Anti-patterns (refusés par le Conseil)\n\n- **Census-engine / mapping-axes en table / gabarit de puces imposé** : machinerie\n  qui **réinstitutionnaliserait le gabarit cloné**. Le census reste un geste manuel\n  d'inspiration ; le chapeau une checklist mentale.\n- **Graine maigre** (< 5 k total, sections < 600 ch) ou **trop rédigée** (> 12 k,\n  prose finie) : les deux privent Jenni de son apport.\n- **Reprendre l'archive** pour une fiche intégrée (cas 2) : toujours la base.\n", "type": "workflow", "crit": true}, {"id": 130, "titre": "Production d'une fiche — de l'identification à l'envoi Jenni", "contenu": "## Production d'une fiche — du besoin au docx prompt\n\nWorkflow en 5 étapes pour produire une fiche, depuis l'identification du besoin corpus jusqu'au docx envoyable à Jenni. Chaque fiche est un cas particulier — pas de standardisation rigide.\n\n### Principe directeur\n\n**Le docx prompt envoyé à Jenni est une graine synthétique, pas une rédaction finie.** Jenni enrichit ×5 à ×10 le volume initial avec sources académiques, données récentes et structuration approfondie. Si Claude rédige déjà tout, Jenni n'a qu'à reformater — l'apport scientifique de la co-rédaction est perdu.\n\nVolume cible : **~8-10 k chars** de graine (`contexte_sci`) + brief éditorial, **plafond < 12 k** (au-delà, Claude rédige trop et prive Jenni de son apport). Modèle : #37 ≈ 9,6 k.\n\n---\n\n### Étape 0 — Identifier le besoin précis du corpus\n\n**Avant toute création**, formuler explicitement la fonction que la fiche doit servir :\n\n- **Lacune** : un sujet absent du corpus que les chaînes causales ou cards exposent comme manquant (ex : voie polyphénols absente alors que C1 immunité la suppose)\n- **Validation** : une affirmation à confronter à la littérature récente (ex : Soil Continuum Model qui invalide le paradigme classique d'humification)\n- **Contradiction / nuance** : un consensus à arbitrer (ex : controverse Simard vs Karst sur les CMN)\n- **Articulation** : une connexion transversale entre strates jamais formalisée (ex : cascade phosphore minéral → os humain)\n- **Zoom controversé** : un sujet où le corpus a une position éditoriale à expliciter (ex : LiFoFer évaluation empirique)\n\nAudit obligatoire avant création (BQ `pas_agent_redacteur` #136 — règle audit) :\n\n```sql\nSELECT id, title, description FROM concept_cards WHERE lower(title) LIKE '%<kw>%' OR lower(description) LIKE '%<kw>%';\nSELECT id, slug, titre FROM fiches WHERE lower(slug) LIKE '%<kw>%' OR lower(titre) LIKE '%<kw>%';\n-- + bq_query.py --search \"<kw>\"\n```\n\nSi une fiche existante couvre déjà le sujet → enrichir cette fiche, ne pas en créer une nouvelle.\n\n---\n\n### Étape 1 — Création DB et brief éditorial\n\n```sql\n-- 1. La fiche (corpus-facing) — statut 'jenni' tant qu'elle n'est pas intégrée\nINSERT INTO fiches (slug, titre, type, origine, strates, docs_cibles, statut, created_at, updated_at, version, notes)\nVALUES ('<slug-kebab>', '<titre complet>', '<transversale|zoom|technique>', 'jenni',\n        '[\"F\",\"S\",\"V\",...]', '[\"F2\",\"P5\",\"S4\",...]', 'jenni',\n        datetime('now'), datetime('now'), 1, '<brief éditorial — voir ci-dessous>');\n\n-- 2. Sa première graine (pipeline Jenni interne) — statut 'a_rediger'\nINSERT INTO graines (fiche_id, version, statut, created_at, updated_at)\nVALUES ((SELECT id FROM fiches WHERE slug='<slug-kebab>'), 1, 'a_rediger',\n        datetime('now'), datetime('now'));\n```\n\n**Le brief éditorial** dans `fiches.notes` est la pièce centrale qui guide Jenni. Format type :\n\n```\nBesoin corpus : <lacune | validation | contradiction | articulation | zoom> — <formulation en 1 phrase>\n\nSources autoritaires à mobiliser :\n- <Auteur, année, titre court ou DOI> — <pourquoi cette source>\n- <…>\n\nDonnées chiffrées attendues :\n- <ordres de grandeur recherchés (ex : potentiels stockage en tCO2e/ha/an)>\n- <seuils, plages, indicateurs>\n\nParadigmes à confronter :\n- <position 1> vs <position 2> (ex : Simard CMN-réseau vs Karst critique)\n- <synthèse attendue>\n\nArticulation avec corpus :\n- Cards concernées : #N <titre court>, #M <titre court>\n- Chaînes traversées : C<x> <titre>, C<y> <titre>\n- Fiches voisines à articuler : #<x>, #<y>\n- Ne pas redonder avec : #<z> (qui couvre déjà <angle>)\n\nDoctrine éditoriale :\n- <position du corpus sur le sujet, ton attendu>\n- <précautions : terme controversé, pseudoscience à éviter cf. BQ #154>\n```\n\nPlus le brief est précis, plus le retour Jenni est utilisable. Un brief vague produit un retour générique.\n\n---\n\n### Étape 2 — Plan structurel et graines synthétiques\n\n**Création consciente du plan — le plan se dérive du corpus, pas d'un gabarit.**\nSymétrique amont de l'intégration consciente : avant d'écrire une graine, recenser les\n**points majeurs du corpus** sur le thème et laisser la matière dicter la structure.\nChaque section = un besoin réel du corpus, pas une case d'un moule (« les fiches sont la\nnourriture que réclame le corpus »). C'est du **jugement à chaque fiche, pas un script**.\n\nAvant d'arrêter le plan, interroger le corpus :\n- les **concept cards** à nourrir / articuler et les **cycles** qui portent le mécanisme ;\n- les **chaînes causales** traversées (et leurs maillons faibles) ;\n- les **termes canoniques** déjà présents (vocabulaire que Jenni doit mobiliser) ;\n- les **fiches voisines** qui délimitent le périmètre (ne pas redonder).\n\nLe **nombre de sections tombe de l'analyse** (souvent 6-7 H1 pour une transversale riche,\nmoins si le thème est étroit) — jamais un compte décrété d'avance. **Anti-pattern proscrit** :\nle gabarit cloné — mêmes H1 génériques recopiés quel que soit le sujet, « Doctrine\nrégénérative » en clôture réflexe, H1 vides avec la graine reléguée en H2.\n\n**Structure PLATE — squelette type** (détail : règle dédiée plus bas, 2026-05-30) :\n\n```\n[intro]      Introduction                                   (pas de numéro)\n[section]    1. <Titre section 1>                           (H1, numéro 1)\n[section]    2. <Titre section 2>                           (H1, numéro 2)\n…\n[section]    N. <dernière section — dictée par le thème, pas figée>   (H1)\n[conclusion] Résumé                                          (pas de numéro)\n```\n\nNumérotation **portée dans le titre DB** (`fiche_sections.titre`), pas par le script. Cette règle garantit la robustesse du matching à l'intégration (Jenni peut changer le niveau Word, le numéro reste). Modèles de plan conscient (dérivé du corpus, structure plate) : #37 agroforesterie, #251 autonomie en intrants.\n\n**Graines synthétiques** dans `fiche_sections.contexte_sci`, **~1000-1200 chars/section** (150-200 mots ; cf. modèle #37) :\n\n> **Cible relevée 2026-06-10** : l'ancienne cible « ~600 ch/section » était **périmée** — elle contredisait le modèle canonique #37 (~1200/section) et la médiane réelle du corpus (~9,6 k de graine). Plancher d'alerte : une graine < ~5 k total ou des sections < 400 ch = trop maigre (cf. `audit_graines.py`).\n\n```\nINSERT INTO fiche_sections (fiche_id, type, ordre, titre, contexte_sci)\nVALUES (?, 'section', ?, ?, ?);\n```\n\nCe que la graine pose en ~1000-1200 chars, en **langage mécanistique** (la graine s'adresse à\nune IA : notation dense cause→effet, termes bruts — **pas de prose rédigée**, la prose\nest le travail de Jenni) :\n- **L'angle** de la section\n- **Les 2-3 mécanismes / concepts / données clefs** que la section doit traiter\n- **Les termes canoniques** du thésaurus à mobiliser (orthographe exacte `terms.fr`)\n- **Les `(Auteur, année)` de nos sources existantes**, inline (cf. « Références\n  systématiques » plus bas) — Jenni n'ajoute que les manquantes\n- **Le périmètre** : ce qui est dans la section vs ce qui n'y est pas\n\nCe que la graine ne fait pas :\n- Pas de prose rédigée, pas de paragraphes développés\n- Pas de citations **inventées** (uniquement nos sources vérifiées en base)\n- Pas de \"Jenni rédige cette section…\" ou autre métaphrase\n- Pas de placeholders `[à compléter]`\n\nRéférence concrète : la fiche #37 `agroforesterie-temperee-fonctions-sol` est le modèle canonique du format graine.\n\n---\n\n### Étape 3 — Génération du docx prompt\n\n```bash\nPYTHONPATH=tools python3 tools/jenni/gen_fiche_docx.py --db sol_vivant.db --fiche-id <N>\n# → recherches/fiches/<NN>_fiche_<slug>_<date>.docx (préfixé par priorité d'envoi)\n```\n\nLe script :\n- Lit `fiche_sections.contexte_sci` (pas `contenu` — qui ne sera rempli qu'au retour Jenni). **En mode graine (`is_graine` : fiche `jenni`, ou graine courante `recreee`), forcer `contexte_sci` même si `contenu` legacy est rempli** — sinon le rédigé v_précédent pollue la nouvelle graine (bug identifié 2026-05-28).\n- Hiérarchie Word native : Title (court sans accent ≤ 5 mots) + H1/H2/H3 max\n- Bloc « Références » (selon l'état de la fiche et de sa graine courante) :\n  - fiche `jenni`, graine pure (`a_rediger` / `redigee`) : **bloc émis depuis `source_usages`** dès qu'on a amorcé la fiche avec nos sources existantes (refs systématiques, cf. 2026-05-28b) ; sans `source_usages`, pas de bloc — Jenni apportera la biblio.\n  - graine `recreee` (refaite après l'intégration v_précédente) : **bloc émis depuis `source_usages`** (refs déjà associées à la fiche intégrée) — Jenni n'a pas à les reretrouver, le travail biblio précédent est conservé.\n  - reprise structurée d'une fiche `integree` (graine non `recreee`) : bloc émis depuis `fiche_contenus.refs` (cache du retour Jenni).\n- Pas de méta-vocab (vérification regex obligatoire avant commit — cf. BQ `redaction_documents_jenni` #146 §4). **Cela inclut explicitement** :\n  - tout **lien interne au corpus** : `fiche #N`, `fiche ###`, `card #N`, `chaîne CN`, références à d'autres fiches/cards/chaînes par leur ID ;\n  - les codes-doc strate : `S0-S4`, `V1-V3`, `P1-P5`, `F1-F2`, `H1-H3` ;\n  - les codes internes propres aux cascades : `E0-E5` (échelles spatiales), `T0-T5` (échelles temporelles), `N0-N5` (cascade biophysique), `€0-€5` (cascade coûts) ;\n  - les termes méta : `corpus`, `strate`, `thésaurus`, `sol_vivant`.\n\n  **Jenni est un agent académique open access** : un identifiant ou code propre au corpus n'a aucun sens pour elle. Renommer en termes explicites scientifiques (« E0 » → « échelle parcelle », « card #54 » → « le cycle du carbone via la pompe microbienne », etc.) ou éviter dans les graines.\n\n**Mise à jour du statut** : à la génération, le script fait passer la graine `a_rediger` → `redigee` (« docx prêt », cf. étape 5) — plus besoin de le faire à la main. `redigee` → `envoyee` reste manuel (upload JMJ).\n\nVolume attendu : **~8-10 k chars** de graine (≈ 8 sections × ~1000-1200 ch) + en-tête + brief, **plafond < 12 k**.\n\n---\n\n### Étape 4 — Vérification post-génération\n\nScan obligatoire avant commit :\n\n```python\nimport re\nfrom docx import Document\nd = Document('recherches/fiches/<NN>_fiche_<slug>_<date>.docx')\ntxt = '\\n'.join(p.text for p in d.paragraphs)\nFORBIDDEN = [\n    r'\\bcard #\\d+\\b', r'\\bfiche #\\d+\\b', r'\\bcha[iî]ne C\\d+\\b',\n    r'\\bcorpus\\b', r'\\bstrate\\b', r'\\bth[eé]saurus\\b',\n    r'\\b[SV][0-4]\\b(?![a-zA-Z])', r'\\b[PF][1-5]\\b(?![a-zA-Z])', r'\\bH[1-3]\\b(?![a-zA-Z])',\n]\nviolations = [p for p in FORBIDDEN if re.search(p, txt, re.IGNORECASE)]\nassert not violations, f\"Méta-vocab détecté : {violations}\"\n```\n\nZéro violation obligatoire avant commit. Cf. BQ `redaction_documents_jenni` #146 §4 pour la liste complète des regex.\n\n---\n\n### Étape 5 — Commit et envoi Jenni\n\n```bash\ngit add sol_vivant.db recherches/fiches/<NN>_fiche_<slug>_<date>.docx\ngit commit -m \"fiche #<N> <titre court> — graine + brief envoi Jenni\"\ngit push origin <branche>\n```\n\n**Statut** : la fiche reste `jenni` ; sa graine passe `a_rediger` → `redigee` (docx prêt) → `envoyee` (upload Jenni effectif). JMJ prend le docx en main, l'uploade dans le projet Jenni concerné, pilote le cycle de co-rédaction (typiquement 5-10 itérations) et récupère le docx retour enrichi (graine `recue`).\n\n---\n\n### Réindexation par priorité d'envoi\n\nLes docx dans `recherches/fiches/` sont **préfixés numériquement par ordre de priorité d'envoi à Jenni**, pas par ID. Format `NN_fiche_<slug>_<date>.docx`. La priorité reflète :\n\n1. Méta-cadres structurants (cascades transversales)\n2. Chaînes causales nouvelles haute priorité\n3. Zooms biogéochimiques / pratiques\n4. Fiches contextuelles (controverses, économie)\n5. Brouillons précédents\n\nVoir `recherches/fiches/INDEX.md` pour la liste actualisée.\n\n---\n\n### Anti-patterns confirmés\n\n- **Pas de brouillon Claude trop dense** (≥ 12 k chars) — la graine doit être ~1000-1200 ch/section (consistante, pas une rédaction finie). Un Claude qui écrit déjà toute la fiche prive Jenni de son apport scientifique.\n- **Pas de graine trop maigre** (« peau de chagrin ») : sous ~5 k total ou des sections < 400 ch, Jenni renvoie une fiche squelettique. Dérive typique des **lots tardifs** — `audit_graines.py` la flague avant envoi.\n- **Pas de fiche sans brief éditorial précis** (`fiches.notes` vide ou générique). Sans brief, Jenni produit un retour générique.\n- **Pas d'agent Task pour rédiger le brouillon** (BQ `pas_agent_redacteur` #136 — règle absolue).\n- **Pas de méta-vocab dans le docx** (codes doc, \"corpus\", \"strate\", \"card #N\"…) — cf. BQ #146 §4.\n- **Pas de bloc « Références »** pré-posé — Jenni l'ajoute automatiquement.\n- **Pas d'agent à demander à Jenni de citer** — c'est intrinsèque à son fonctionnement.\n\n### Règle dure — graines = science pure, renvois dans `fiches.notes` (2026-05-24)\n\n`fiche_sections.contexte_sci` (la graine envoyée à Jenni) ne contient **AUCUN\nrenvoi interne** : ni `fiche #N`, ni `card #N`, ni `cf. fiche <sujet>`, ni\n`corpus`, `chaîne C\\d`, codes docs. Les articulations (« voir aussi fiche #N »,\n« Card #N ») vivent dans `fiches.notes` (le brief), **jamais dans la graine**.\n\nAnti-pattern récurrent corrigé 2026-05-24 : 15 graines `a_faire` polluées par\ndes renvois d'articulation fuités dans `contexte_sci`. Les docx\n`recherches/fiches/` sont des **outputs** — corriger la **base** puis régénérer\n(`gen_fiche_docx.py` → `fiche_<id>.docx`, nommage canonique).\n\nContrôle pré-envoi : `check_forbidden_jenni.py` au vert obligatoire (0 méta-vocab\nréel ; faux positifs scientifiques — histones, générations, régions — filtrés).\n\n### Règle — codes de cadre interne (cascade/niveaux) : interdits PARTOUT dans les fiches (2026-05-25, durcie)\n\nLes codes de cadre interne au corpus — `cascade N0-N5`, `E0-E5`, `T0-T5`,\n`€0-€5`, « premier/Nème niveau », « hiérarchie diagnostique », titres « N0 eau »,\ninline « (N2 :…) », « (N5) » — ne sont **pas sourçables** (openaccess). Quand\nJenni traite une section construite sur ces codes, elle répond « Non soutenu »\n→ la section **et ses références** sont perdues.\n\n**Durcissement 2026-05-25 — codes interdits PARTOUT dans le contenu Jenni-facing\n(intro, titre, slug ET sections), pas seulement hors-intro.** Raison vécue\n(#107) : même présentés seulement dans l'**intro et le titre** comme grille de\nlecture, **Jenni propage les codes dans toutes les sections** pendant la\nrédaction, puis sa revue les rejette → fiche bloquée. Le **slug** lui-même\n(`cascade-biophysique-n0-n5`) génère le titre du docx → propagation. L'ancienne\ntolérance intro/titre est **supprimée**.\n\n**Critère exact (clarification JMJ 2026-05-25) — Jenni-facing vs rédaction\nClaude.** La règle « zéro code interne » s'applique au contenu qui passe la\n**validation académique de Jenni** : graines de fiches (`fiche_sections.contexte_sci`),\ntitre, slug — tout ce qui part dans le docx Jenni. En revanche, le contenu\n**rédigé par Claude/JMJ qui ne passe PAS par Jenni** — `concept_cards`, framework\ndiagnostic interne, doctrine — est **validé implicitement par le renforcement de\nfiches diverses** et **autorise les codes internes** (cascade N0-N5, E/T/€…).\nExemple : les cards cascade #77 (biophysique), #78 (temporelle), #79 (coûts\ncachés), #80 (conséquences) **gardent leurs codes** (outil de diagnostic assumé,\naffiché dans le Cahier), alors que les fiches homologues (#107, #58, #80, #57)\nsont décodées car envoyées à Jenni. Frontière = « est-ce que Jenni doit le\nsourcer ? » → oui : pas de code ; non (Claude-authored) : code autorisé.\n\n- **Concept conservé, codes retirés** : on garde le concept de cascade et les\n  niveaux **nommés** (eau, structure, biologie, chimie, racine, plante saine ;\n  ou parcelle→biosphère, instantané→géologique…), on retire les labels N/E/T/€.\n  La science (méthodes, seuils, auteurs) reste à 100 %.\n- **Slug / titre** : décodés (ex. `cascade-biophysique-n0-n5` →\n  `cascade-biophysique-eau-plante-saine`).\n- **Graines de sections** : sujet académique autonome, jamais « le niveau N0 ».\n- **Articulations vers une cascade** (autres fiches) : dans `fiches.notes`,\n  jamais dans la graine.\n\n**Garde-fou — à durcir (recommandation 2026-05-25)** :\n`check_forbidden_jenni.py::scan_cascade()` ne scanne aujourd'hui que les graines\nde sections et ne capture que les **plages** (`N0-N5`). À étendre : scanner\nintro + titre + slug, et capter les codes **isolés** (`N0/N1/N4/N5`, `€0-€5`).\nAttention faux positifs (« casse-gueule ») : **N2/N3 = formes d'azote**\n(diazote, nitrate), E3 = ligase, T2 = diabète, T3/T4 = thyroïde, F1-F2 =\ngénérations — filtrage par contexte obligatoire.\n\nCas correctifs : #107 (codes intro+titre+slug propagés par Jenni), #79 (doublon\nbiophysique archivé), #57 (graine recréée code-free). Cascades #57/58/80/107\nrefondues par JMJ. Graines `recreee` = graines synthétisées propres.\n\n### Voir aussi\n\n- BQ `fiche_definition` (#69) — ce qu'est une fiche\n- BQ `wf_fiche_integration` (#147) — comment intégrer le retour Jenni (moment crucial)\n- BQ `redaction_documents_jenni` (#146) — règles de rédaction transversales\n- BQ `charte_fiches_techniques_diy` (#121) — structure spécifique fiches techniques\n- BQ `contraintes_rendu_docx` (#122) — contraintes Word pour Jenni\n- BQ `pas_agent_redacteur` (#136) — règle absolue rédaction\n- BQ `sujets_interdits_corpus` (#154) — biodynamie/Steiner exclus\n\n\n---\n\n### Pattern récurrent (5 cas observés au 2026-05-05) — sections mises en H2 par Jenni dans le docx retour\n\n**Constat opérationnel** : Jenni met systématiquement certaines sections du plan H1 en niveau **H2** dans le docx retour (souvent les sections 4, 5 ou 6, parfois plusieurs). Cas observés :\n- fiche #12 `diagnostic-seve-ph-ec` : section 1 en H2\n- fiche #14 `rhodopseudomonas-palustris` : section 4 en H2\n- fiche #34 `agri-conservation-mediterraneen-tropical` : section 4 en H2\n- fiche #70 `exces-carbone-fermentescible` : pattern observé\n- fiche #90 `glycoproteines-fongiques-glomaline-grsp` : sections 2, 3, 6 en H2\n\n**Conséquence technique** : le parser `parse_docx` extrait uniquement les sections `level=1` dans son retour `sections`, mais la fonction `step_match` du pipeline `integrate_fiche.py` matche par **numéro dans le titre** (cf. règle \"Numérotation portée dans le titre DB\" plus haut) — donc les sections pa
