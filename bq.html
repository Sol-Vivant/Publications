tées | Étapes vs sections : maillons effectivement étayés | Chaînes + sections | Modéré |\n| **C2** | Nouvelles chaînes | Détection chaînes implicites depuis sections | Sections + cards | Modéré |\n| **K1** | Cascade N0-N5 | Couverture cascade biophysique / coûts cachés / autres méta-cascades | Cascades + sections | Modéré |\n| **K2** | Mapping cards | Mapping concept_cards ↔ sections (cards orphelines, sections sans card) | Cards + sections | Modéré |\n| **B1** | Couverture refs | Couverture refs par section (via tags db_meta) | Sections + sources | Modéré |\n\nPour chaque fiche intégrée, l'audit ajoute un **mini-pipeline « phase 4bis »** (BQ `wf_fiche_integration` #147) :\n- Cards à renforcer (K2 ciblé)\n- Fiches en cours impactées (alerte JMJ)\n- Prompts docs cibles (F3)\n\n### Anti-timeout — règles opérationnelles\n\nCf. BQ `wf_analyse` #140 §recette anti-timeout. Spécifique au corpus :\n\n1. **Index sections condensé** : pour les passes K1/K2 qui croisent cards × sections, passer un index `{section_key, doc_code, titre, contexte_sci, enrichissement, mots-clés extraits}` (~50 k chars) au lieu des sections complètes.\n2. **Cards condensées** : pour les passes qui croisent fiches × cards, passer un index `{id, dimension_id, status, title, description (300 chars max), notes (last 500 chars)}` (~30 k chars pour 56 cards).\n3. **Split par strate ou par dimension** pour S1/K2 : éclater par strate F/S/V/P/H ou par dimension de cards.\n4. **Écriture progressive obligatoire** : `Écrire tmp/audit_corpus/responses/<cid>.json après chaque sous-batch traité`.\n5. **Limite dure** : 80 k chars utiles par agent → au-delà, split obligatoire.\n\n### Scripts dédiés\n\n| Script | Rôle | Pattern |\n|---|---|---|\n| `tools/admin/audit_fiches.py` | Audit fiches `integre*` (axes F1-F2) | Direct |\n| `tools/admin/audit_anglicismes.py` | Axe F4 (anglicismes fiches en cours + contenu) | Direct |\n| `tools/admin/check_integrity.py` | Sanity check FK chaînes/cards | Direct |\n| `tools/admin/check_forbidden_jenni.py` | Méta-vocab dans contenus destinés à Jenni | Direct |\n| `tools/admin/analyse_fiches.py` | Extraction consciente par fiche (formules, chiffres, cards, candidats) | `agent_runner` |\n| `tools/batch/analyse_corpus.py --type sections|chaines|cascade|biblio` | Passes S1/S2/C1/C2/K1/K2/B1 | `agent_runner` parallèle |\n\n### Cadence et déclencheurs\n\n- **Cadence régulière** : audit complet toutes les **3-5 sessions**, ou systématiquement avant un consolidé éditorial majeur (publication, revue de corpus).\n- **Déclencheurs immédiats** :\n  - Après une intégration de fiche → mini-audit phase 4bis (cf. BQ `wf_fiche_integration`)\n  - Après création/refonte d'une chaîne → passes C1 + C2 + K2\n  - Après une revue JMJ qui touche aux paradigmes → relecture des cards de la dimension concernée + axe K4\n  - Avant un envoi Jenni d'une fiche dont le sujet a déjà des cards `archive` → axe K4 obligatoire (sinon risque d'envoyer un sujet déjà rejeté)\n\n### Sortie consolidée\n\nRapport unique `jmj/rapports/audit/audit_corpus_<date>.md` avec une section par axe + section synthétique « actions priorisées ». Format aligné sur `audit_thesaurus_<date>.md`.\n\n```\n# Audit corpus — <date>\n## C1. Chaînes — étapes nourries (N chaînes complètes / N total)\n## C2. Chaînes — étapes à enrichir (top 10 par priorité)\n## C3. Chaînes — nouvelles chaînes implicites (N propositions)\n## K1. Cards — santé de la collection (par dimension)\n## K2. Cards — renforcements omis post-fiche (N alertes)\n## K3. Cards — contradictions actives (N à arbitrer)\n## K4. Cards — alertes éditoriales (fiches vs archives)\n## F1. Fiches — intégrité contenu (N en dette technique)\n## F2. Fiches — articulation manquante (N propositions)\n## F3. Fiches — propagation prompts docs cibles (N omises)\n## F4. Fiches — anglicismes résiduels (N occurrences)\n## Synthèse — actions priorisées (top 10)\n```\n\n### Règles d'arbitrage\n\n1. **Cards comme dernière instance** (BQ `concept_cards_filtre_de_rigueur_une_affirmation_ba`) : si l'audit produit une alerte éditoriale (axe K4), l'agent propose une note d'arbitrage mais **ne modifie ni la fiche ni la card** sans validation JMJ explicite. Une affirmation bancale n'est pas corrigée à l'aveugle.\n2. **Pas de fusion automatique de chaînes** — toute fusion ou suppression d'une chaîne passe par JMJ. Les axes C2/C3 produisent des **propositions**, pas des actions.\n3. **Pas de tissage automatique de `concept_card_links.contradicts`** (BQ `concept_cards_contradictions_explicites_uniquement`) — analyse sémantique humaine requise. Les contradictions détectées par l'audit sont signalées comme alertes K3 avec justification, JMJ tisse explicitement.\n4. **Audit log systématique** : chaque modification (UPDATE notes card, INSERT link, UPDATE chaîne) trace dans `audit_log`.\n5. **Phase 4bis obligatoire post-intégration** (BQ `wf_fiche_integration`) : un audit corpus ne remplace pas la phase 4bis qui doit être faite à chaque intégration de fiche, et qui produit elle-même un audit croisé fiche.\n\n### Anti-patterns confirmés\n\n- **Pas d'agent Task pour rédiger les rôles de chaînes ou les notes de cards** (BQ `pas_agent_redacteur`). L'agent extrait, classe, propose ; l'agent+JMJ rédige.\n- **Pas d'heuristique texte pour les contradictions de cards** (BQ `concept_cards_contradictions_explicites_uniquement`) — uniquement liens explicites `contradicts`.\n- **Pas d'audit en bloc des 50 fiches dans un seul agent** — split par lot ou par strate (BQ `strategie_agents` §recette anti-timeout).\n- **Pas de batch INSERT de cards depuis le retour Jenni** — les cards sont créées par l'agent/JMJ après filtre conscient, jamais par Jenni.\n- **Pas d'oubli de la phase 4bis** d'une intégration récente — un audit corpus régulier détecte les omissions (axe K2, F3).\n\n### Voir aussi\n\n- BQ `audit_thesaurus` — pendant côté thésaurus\n- BQ `audit_integrite_db` — sanity check DB technique\n- BQ `concept_cards_filtre_de_rigueur_une_affirmation_ba` — cards filtre + outil d'audit (rôle 5)\n- BQ `cards_contradictions` — règle contradictions explicites uniquement\n- BQ `chaines_doctrine` — concept, structure, workflow chaînes\n- BQ `wf_analyse` — pattern agent_runner unifié\n- BQ `strategie_agents` — anti-timeout, écriture progressive\n- BQ `wf_fiche_integration` — phase 4bis post-intégration fiche\n- BQ `pedago_links` — passerelles pédagogiques entité ↔ card\n- BQ `pas_agent_redacteur` — règle absolue rédaction\n", "type": "workflow", "crit": false}, {"id": "wf_audit_factuel", "titre": "Audit factuel (gâche 3) — workflow canonique de vérification des sources", "contenu": "## Audit factuel (gâche 3) — workflow canonique\n\nOpérationnalisation de la **gâche 3** de la BQ `audit_conscient` (architecture\nhybride l'orchestrateur + l'API d'audit). Pipeline en 3 étapes pour vérifier les sources d'une\nfiche : existence **et** contenu. Doctrine : l'API d'audit signale (plausibilité, sans\ninternet) → outils live vérifient → JMJ arbitre. **Jamais d'apply auto.**\n\n### Le principe central\n\nLa gâche 3 ne vaut que par l'**indépendance externe** du vérificateur. l'API d'audit n'a\npas accès internet → il juge sur plausibilité (connaissances monde). Les outils live\n(Semantic Scholar, Crossref) vérifient l'existence. Chaque étape **augmente la\nconfiance** mais aucun verdict n'est auto-appliqué : `ALERTE_VERITE` → **promotion arbitrage JMJ**.\n\n## Les 3 étapes\n\n### Étape 1 — l'API d'audit signale (plausibilité)\n\n`tools/admin/audit_factuel_deepseek.py --prepare/--run/--consolidate`\n\n- **Garde-pilot** : l'API d'audit reçoit le **texte brut** de la fiche + une consigne de\n  rôle (« vérificateur factuel »). Aucune interprétation du corpus injectée — sinon\n  souveraineté (cf. `audit_conscient`).\n- Sortie : pour chaque affirmation vérifiable → `[VRAI]/[FAUX]/[DÉBAT]/[À VÉRIFIER]`.\n- Les `[FAUX]/[DÉBAT]/[À VÉRIFIER]` = **ALERTE_VERITE** → étapes suivantes.\n- Limite : l'API d'audit n'a pas internet → l'existence des sources est jugée sur\n  plausibilité, pas vérifiée. D'où les étapes 2-3.\n\n### Étape 2 — Semantic Scholar vérifie l'existence (live)\n\n`tools/veille/semantic_scholar.py` (recherche paper par DOI / sujet+auteur+année)\n\n- **API gratuite, pas de clé requise**. Client canonique : `tools/veille/semantic_scholar.py`.\n- Récupère abstract brut + métadonnées (DOI, auteurs, année, `citationCount`, `influentialCitationCount`).\n- Pour chaque citation flaggée : `[CONFIRMÉ]` / `[ANNÉE ERRONÉE]` / `[INTROUVABLE]`.\n- **Piège — rappel faible** : la recherche par sujet seul rate les auteurs obscurs\n  (6/12 ratés sur le cas #84). → Toujours faire l'étape 3 (passe approfondie).\n- **Réflexe `semantic_scholar_mirror_local_reflexe`** (RULES.md) : toute acquisition S2 → INSERT `refs` ou `sources` dans la même session.\n\n### Étape 3 — Arbitrage Crossref (résout INCONNUABLE & faux positifs)\n\n`tools/admin/audit_factuel_arbitrage.py`\n\n- Pour les `[INTROUVABLE]` : Crossref (`api.crossref.org/works`, `query.author` +\n  `query.bibliographic`).\n- **Piège CRITIQUE — faux positifs du match par nom seul** : un nom commun (Xu, Wang,\n  Gupta) matche un papier hors-sujet (ex : « Xu 2025 » → papier CRISPR au lieu de\n  nitrate/NO). → **Vérifier la pertinence titre-vs-sujet** avant de déclarer\n  CONFIRMÉ/ANNÉE ERRONÉE. Le script doit filtrer par similarité titre↔sujet ; à défaut,\n  jugement manuel obligatoire.\n- Noms rares (Pratap, Britti, Olanrewaju) : un match de nom est plus crédible, mais le\n  sujet doit quand même coller.\n\n## Doctrinal\n\n- **Garde-pilot** (étape 1) : texte brut + consigne de rôle, jamais d'interprétation.\n- **Coût de confiance** : l'API d'audit = 2 couches LLM (GLM pilote + l'API d'audit exécutant) →\n  confiance plus faible → `ALERTE_VERITE` → **promotion arbitrage JMJ**, zéro apply auto.\n- **Semantic Scholar/Crossref/Zotero = découverte/vérification, jamais oracle** : ils proposent, JMJ arbitre.\n- **Indépendance externe** : ne JAMAIS fine-tuner l'API d'audit sur le corpus (contaminerait\n  la gâche 3 — cf. `audit_conscient`).\n\n## Cas d'école — fiche #84 « Trophobiose Chaboussou → AMR »\n\nTest complet sur 12 citations signalées par l'API d'audit (anachroniques 2025/2026 + valeurs\nsuspectes) :\n\n| Étape | Résultat |\n|---|---|\n| 1. l'API d'audit | 12 signalées `[À VÉRIFIER]` (plausibilité, ~10 dates futuristes) |\n| 2. Semantic Scholar sujet | 3 CONFIRMÉ, 3 ANNÉE ERRONÉE, 6 INCONNUABLE (rappel faible) |\n| 3. Arbitrage Crossref+auteur | 4 CONFIRMÉ, 5 ANNÉE ERRONÉE (dont **Pu 2007 cité 2025** !), 1 INCERTAIN, 2 SUSPECT |\n\nLeçons du cas :\n- l'API d'audit a flaggé à tort des sources réelles (Song/Britti/Lyu/Pratap 2026 existent) —\n  la plausibilité sans internet surestime le risque sur les dates récentes. D'où l'étape 2-3.\n- 5 erreurs d'année (Pu : 18 ans d'erreur !) → problème de citation, pas\n  d'hallucination. 2 suspects (Xu, Harrelson) → non confirmés malgré recherche approfondie.\n\n## Inventaire des scripts\n\n| Script | Étape | Rôle |\n|---|---|---|\n| `audit_factuel_deepseek.py` | 1 | `--prepare`/`--run`/`--consolidate` · garde-pilot · `<modèle configuré>` |\n| `semantic_scholar.py` | 2 | vérif existence paper (client S2, gratuit) — `tools/veille/` |\n| `audit_factuel_arbitrage.py` | 3 | Crossref fallback · ⚠ pertinence titre-vs-sujet à fiabiliser |\n\n⚠ Scripts supprimés 2026-07 (ScholarAI abandonné) : `audit_factuel_scholarai.py`, `audit_factuel_pdf.py`. Le flux PDF full-text (ancienne étape 4) n'est plus outillé — arbitrage sur abstract + métadonnées.\n\nClés : `DEEPSEEK_API_KEY` (`.env` gitignored). Semantic Scholar = gratuit, pas de clé.\nParamètres en table `config` (`api.deepseek_*`), règle #5.\n\n## Limites & pistes\n\n- **Étape 3 à fiabiliser** : ajouter un filtrage similarité titre↔sujet\n  (`SequenceMatcher`) pour bloquer les faux positifs des noms communs.\n- **Échelle** : étapes 1-3 sont automatisables sur `--statut integre` (toutes fiches).\n- **Étape 4 deep-content** (PDF full-text) — non outillée depuis la suppression de ScholarAI. Workarounds manuels : Zotero desktop « Trouver le texte intégral », récup manuelle + `pdftotext`, Unpaywall (`api.unpaywall.org/v2/{doi}`). À réserver aux alertes à enjeu.\n", "type": "workflow", "crit": false}, {"id": "agent_runner_garde_fous", "titre": "Agent runner — garde-fous pré-vol, en vol, post-vol", "contenu": "## Agent runner — garde-fous pré-vol, en vol, post-vol\n\nTout script suivant le pattern `agent_runner` (`--prepare` → batches JSON →\nagents Task → `--consolidate`) doit valider **13 checks** répartis sur 3\nphases. Les omissions répétées (session 2026-04 à 05) ont coûté ~250 k\ntokens en rate-limit, 7 agents lancés sur fiches hors-périmètre, et une\ncorruption de rédigé partagée par 10 fiches.\n\n**Source** : `jmj/rapports/audit/audit_gestion_agents_plan_2026-05-28.md`.\n\n### Pré-vol (avant `--prepare` ou avant tout lancement)\n\n**Idéalement matérialisés dans `tools/lib/agent_guards.py` appelé en début\nde `cmd_prepare` de chaque audit.**\n\n1. **WORK_DIR persistant** : assert WORK_DIR ∈ `audit_runs/<script>/`\n   (jamais `tmp/`). Refus + message si `tmp/` détecté. `tmp/` est purgé\n   entre sessions par `session_start.py` ; un run de plusieurs heures y\n   est volatilisé.\n\n2. **Filtre origine actif** : si la cible est un audit (extraction sur\n   fiches), assert que la requête `cmd_prepare` contient\n   `origine='jenni'`, ou commentaire explicite « volontairement l'agent\n   inclus ». Les fiches l'agent (#41, #95-104, futures DIY) ne doivent\n   jamais être traitées par les agents d'audit (cf. BQ\n   `pratiques_typees_hors_jenni`).\n\n3. **Reprenabilité activée** : assert que la requête skippe les items\n   déjà couverts (`NOT EXISTS analyse_agent` ou équivalent par script).\n   Une reprise non filtrée ré-extrait tout et écrase des résultats valides.\n\n4. **Modèle de format non vide** : si le prompt référence une entité\n   « modèle » (ex. fiche #24 pour `analyse_agent`), assert qu'elle existe\n   et a du contenu. Un modèle vide → JSON malformé en cascade.\n\n5. **Intégrité données source** :\n   - Pour les fiches : md5 distinct de `fiche_retour_sections.contenu`.\n     Alerte si N fiches partagent un md5 (indicateur de corruption type\n     #95-104).\n   - Ordres uniques par `(fiche_id, ordre)`. Alerte si doublon (indicateur\n     de versions multiples non consolidées type #83/#84).\n\n6. **Plafond concurrence** : assert que les batches sont chunkés en lots\n   ≤ N (config `agent_runner.max_concurrent`, défaut 5). Au-delà, le\n   rate-limit API du modèle frappe.\n\n### En vol (pendant le run)\n\n7. **Status board minimal** : un fichier `state.json` mis à jour à chaque\n   écriture de réponse, ou un script `audit_agent_run.py --status` qui\n   agrège l'état en temps réel (cids attendus / en attente / en cours /\n   réussis / échoués). Sans cette visibilité, le diagnostic d'un échec\n   partiel demande du forensic.\n\n8. **Détection précoce des échecs rate-limit** : si une réponse contient\n   « session limit » ou est anormalement courte (< seuil tokens/sections),\n   la marquer `failed` et la mettre en file de relance plutôt que de la\n   traiter comme réussie. Un agent rate-limité écrit souvent une réponse\n   tronquée parseable mais vide de fond.\n\n9. **Plafond dur** : compteur de pids/agents lancés sur la fenêtre\n   courante ; refus si > plafond. Garde-fou même si l'orchestration\n   amont dérape.\n\n### Post-vol (après `--consolidate`)\n\n10. **Validation par cid** : pour chaque cid attendu, vérifier réponse\n    présente + JSON parsable + structure conforme (clés ordre, 5\n    catégories, listes). Tout cid absent ou non conforme bloque le\n    consolidate avec rapport.\n\n11. **Auto-validation refs** : cards `status='active'`, fiches\n    `integree`, termes vérifiés absents — déjà fait par\n    les agents (à conserver et codifier dans les prompts via\n    `AGENT_INSTRUCTIONS.md`). C'est ce qui a évité les contaminations DB\n    malgré F8 (confusion id) et F6 (corruption rédigé) en 2026-04-05.\n\n12. **Invalidation idempotente** : si le filtre amont change (ex. ajout\n    `origine='jenni'`), un `--clean-orphans` supprime les réponses\n    désormais hors-périmètre (cleanup auto). Sans ça, le consolidate\n    propage les vieilles réponses non couvertes par le nouveau périmètre.\n\n13. **Métadonnées du run** : `state.json` finalisé avec timings, tokens\n    estimés (depuis `usage` si dispo), taux de réussite, items\n    rate-limited. Permet le bilan rétroactif et le tuning des plafonds.\n\n### Pattern doctrinal salvateur (à conserver)\n\nLa **validation rigoureuse intégrée aux prompts** (cards actives, fiches\nintégrées, termes vérifiés absents) a évité des contaminations en DB\nmalgré les frictions observées. À codifier dans\n`AGENT_INSTRUCTIONS.md` partagé entre tous les scripts d'audit.\n\n### Articulation\n\n- **`strategie_agents`** (#132) — quand utiliser `agent_runner` vs\n  agents Task directs vs lecture inline. Ce module définit le **comment\n  les sécuriser**.\n- **`pratiques_typees_hors_jenni`** — règle origine='jenni' pour les\n  agents d'audit (check 2 ci-dessus).\n- **AGENTS.md règle absolue #4** — workflow 3 phases obligatoire\n  (`--prepare` → Task → `--consolidate`), pas d'API externe.\n", "type": "doctrine", "crit": false}, {"id": "veille_services_externes", "titre": "Veille hebdomadaire des services externes — doctrine", "contenu": "## Veille hebdomadaire des services externes — doctrine\n\nLe projet dépend de **4 API externes** dont les changements (modèles, endpoints,\nrate limits, breaking changes) peuvent casser silencieusement les pipelines.\nCette veille détecte les changements avant qu'ils ne provoquent des erreurs en\nproduction.\n\n### Périmètre\n\n| Service | Rôle | Risque si changement |\n|---|---|---|\n| **l'API d'audit** | Rédaction fiches, classification thésaurus, relecture | Modèle retiré → `call_deepseek` échoue ; pricing → coût |\n| **GLM / Z.AI** | Orchestration, codage, supervision | Provider config → opencode casse |\n| **Semantic Scholar** | Veille papiers, validation citations | Rate limit → 429 massif ; endpoint → `semantic_scholar.py` casse |\n| **Zotero** | Bibliographie (push/pull/export) | API version → `push_zotero_web.py` / `pull_zotero.py` cassent |\n\n### Rituel hebdomadaire\n\n```bash\npython3 tools/veille/veille_services.py --db sol_vivant.db\n```\n\nLe script :\n1. Health check des 4 services (status HTTP + latence)\n2. Collecte métadonnées (modèles l'API d'audit, rate limit S2, version API Zotero)\n3. Diff avec snapshot précédent (`jmj/veille/snapshot_services.json`)\n4. Rapport MD (`jmj/rapports/veille/services_<date>.md`)\n\n**Sortie** : exit code 0 si tout OK, 1 si un service down. Les changements\ndétectés (modèles ajoutés/retirés, rate limit modifié) sont signalés dans le\nrapport.\n\n### Quand lancer\n\n- **Idéalement** : en début de session chaque semaine (rappel dans RULES.md)\n- **En cas d'erreur** : un pipeline casse → lancer la veille pour diagnostiquer\n- **Avant un chantier majeur** : production fiche, intégration batch\n\n### Actions selon les changements détectés\n\n| Changement | Action |\n|---|---|\n| Modèle l'API d'audit retiré | `UPDATE config SET value=... WHERE category='api' AND key='deepseek_model'` |\n| Modèle l'API d'audit ajouté | Évaluer (benchmark) puis optionnellement migrer |\n| Rate limit S2 changé | Ajuster `semantic_scholar.py` (throttle) ou obtenir clé dédiée |\n| API version Zotero changée | Vérifier `push_zotero_web.py` / `pull_zotero.py` compatibilité |\n| Service down | Retry + investigate (status page officielle) |\n\n### Snapshot\n\nLe snapshot JSON (`jmj/veille/snapshot_services.json`) est écrasé à chaque run.\nPour conserver l'historique, le rapport MD daté n'est PAS écrasé. Garder au\nmoins 4 semaines de rapports pour observer les tendances.\n", "type": "workflow", "crit": false}, {"id": "wf_revue_scripts_bq", "titre": "Revue consciente scripts + BQ — cahier des charges canonique (pipelines G/H/I)", "contenu": "## Revue consciente Scripts + BQ — cahier des charges canonique\n\nSource de vérité du dispositif de revue périodique du codebase (`tools/**/*.py`)\net de la doctrine (`tools/bq/*.md`) par une **équipe d'agents V2** (couche 1\nraisonnement). Décidée session 2026-07-09 (JMJ), met en œuvre les angles morts\ncatalogués en `wf_agents_library` § V2.\n\n**BQ gouvernante** : `wf_agents_library` (bibliothèque d'agents) +\n`strategie_agents` (patterns d'usage). Cette BQ l'applique au périmètre\nspécifique **revue BQ + scripts**.\n\n**Pipelines associés** (skill `compose`) : `[G] pipeline-revue-bq`,\n`[H] pipeline-revue-scripts`, `[I] pipeline-cablage-bq-scripts`.\n\n## Périmètre\n\n| Cible | Volume | Source |\n|---|---|---|\n| Scripts Python | 140 fichiers (`tools/admin/` 65, `lib/` 37, `docs/` 19, `jenni/` 14, `veille/` 3, `batch/` 1, racine 1) | `scripts_inventory.py` |\n| BQ actives | 92 entrées (31 critiques, 5 avec `ordre=0`) | `bq_inventory.py` |\n| Câblages | BQ↔BQ, BQ↔scripts, BQ↔RULES, BQ↔agents, scripts↔MANIFEST | Croisement |\n\n## Équipe d'agents mobilisée\n\n**Couche 1 — 8 agents V2 créés pour ce dispositif** (cf. `.opencode/agents/`) :\n\n| Agent | Famille | Cible |\n|---|---|---|\n| `audit-bq-frontmatter` | AUDIT | YAML conforme (slug/titre/type/is_critique/ordre/domaine_primaire) |\n| `audit-bq-obsolescence` | AUDIT | références tables droppées, scripts supprimés, slash disparus |\n| `audit-bq-coherence` | AUDIT | doublons sémantiques, recoupements, fusions/splits possibles |\n| `weaver-bq` | WEAVE | cross-refs BQ↔BQ↔scripts↔RULES↔agents manquantes |\n| `audit-scripts-conventions` | AUDIT | `--db` présent, docstring, lib.config vs hardcodage, audit_log |\n| `audit-scripts-dette` | AUDIT | TODO/FIXME, code mort, Jenni legacy, refs obsoletes |\n| `audit-scripts-orphans` | AUDIT | scripts invisibles (MANIFEST/README/AGENTS/BQ/skills) |\n| `weaver-scripts-bq` | WEAVE | doctrine script↔BQ (BQ gouvernante manquante ?) |\n\n**Réutilisés** : `consolidator-manifest`, `consolidator-triage`,\n`conseil-contradicteur`, `conseil-judge`, `detector-gaps`.\n\n**Couche 3 — fan-out** : `agent_runner.py` (`--prepare` → N agents couche 1 →\n`--consolidate`). Obligatoire pour 92 BQ et 140 scripts (règle\n`agent_runner_reflexe` : N>5).\n\n## Pipelines (skill `compose`)\n\n### [G] `pipeline-revue-bq` — Revue BQ\n\n```\naudit-bq-frontmatter (92 BQ batch)\n  → audit-bq-coherence (clusters)\n  → audit-bq-obsolescence (refs mortes)\n  → weaver-bq (cross-refs manquantes)\n  → consolidator-triage\n  → [Conseil sur fusions/splits/contradictions]\n  → [Apply JMJ sur vert]\n```\n\n### [H] `pipeline-revue-scripts` — Revue Scripts\n\n```\naudit-scripts-conventions (140 batch + ruff)\n  → audit-scripts-dette (+ vulture)\n  → audit-scripts-orphans\n  → weaver-scripts-bq\n  → consolidator-triage\n  → [Conseil sur archivages non évidents]\n  → [Apply JMJ sur vert]\n```\n\n### [I] `pipeline-cablage-bq-scripts` — Bouclage doctrinal\n\n```\nweaver-bq + weaver-scripts-bq (parallèles)\n  → detector-gaps\n  → consolidator-manifest\n  → [Conseil sur nouveaux artefacts]\n  → [Nouvelles BQ : rédaction subagent sous supervision (paradigme agent pilote 2026-07-13) — cf. BQ `pas_agent_redacteur`]\n```\n\n## Outils locaux nécessaires\n\n| Outil | Rôle | Install |\n|---|---|---|\n| `ruff` | Linter Python (déterministe, alimente `audit-scripts-conventions` et `-dette`) | `pip install --user --break-system-packages ruff` (PEP 668 sur ce système) |\n| `vulture` | Code mort (confiance ≥60%) | `pip install --user --break-system-packages vulture` |\n\n**Scripts du pipeline revue** (gouvernés par cette BQ) :\n`tools/admin/audit_bq_deepseek.py` (audit BQ via API d'audit) ·\n`tools/admin/audit_bq_verify.py` (vérification conformité BQ) ·\n`tools/admin/audit_bq_legacy_ids.py` (cohérence legacy_id) ·\n`tools/admin/audit_revue_bq_scripts.py` (runner A/B + max_tokens via\n`config.agent_library`).\n\n**Non requis** : `node`/`npm` (Babel servi in-browser), `gh` (remote local_proxy),\n`pyzotero`/`openai`/`python-dotenv` (l'existant custom est canonique).\n\n## Livrables\n\n1. `audit_runs/revue_bq_scripts/manifeste_bq.md` — annotable `approve: true/false`\n2. `audit_runs/revue_bq_scripts/manifeste_scripts.md` — idem pour scripts\n3. `audit_runs/revue_bq_scripts/matrice_bq_scripts.{md,json}` — carte bidirectionnelle\n4. Quick wins apply au fil de l'eau (frontmatter BQ, `ruff --fix`, docstrings, archivages évidents)\n5. Décisions éditoriales Conseil (fusions/splits/nouvelles BQ)\n\n## Points d'arbitrage JMJ (où l'agent s'arrête TOUJOURS)\n\n- Fusion / split / suppression de BQ → Conseil + validation explicite\n- Archivage de script dans `tools/_archive/` (irréversible côté inventaire)\n- Modification de RULES.md / AGENTS.md / MANIFEST.md (snapshots canoniques)\n- Création / édition d'agent `.md` (rappel : pas de générateur Jinja2 tant que <15 agents)\n- Verdict Conseil MAJEUR/CRITIQUE → présentation JMJ avant apply\n\n## Phasage\n\n| Phase | Livrables | Statut |\n|---|---|---|\n| **P0 — Setup** | install ruff+vulture, 8 agents V2, routing config, MAJ skill compose, cette BQ | ✅ 2026-07-09 |\n| **P1 — Pipelines [G]+[H]** | 92 BQ + 140 scripts audités, quick wins apply, manifestes consolidés | à suivre |\n| **P2 — Pipeline [I]** | matrice BQ↔script, nouvelles BQ identifiées | à suivre |\n| **P3 — Clôture** | Conseil sur litiges, apply final, regen, `session_end.py` | à suivre |\n\n## Récurrence\n\n- **Déclencheur** : post-migration majeure (Jenni 2026-07, etc.) ou\n  récurrence trimestrielle.\n- **Indicateur de rouille** : > 5 nouvelles BQ/scripts depuis dernière revue,\n  ou signalement `audit-bq-obsolescence` récurrent.\n\n## Anti-patterns\n\n- ❌ Lancer les 140 audits en subagents un-à-un (règle `agent_runner_reflexe`).\n- ❌ Apply mécanique sans `consolidator-triage` puis Conseil sur éditoriaux.\n- ❌ Agents rédigeant du contenu BQ sans supervision (règle `pas_agent_redacteur`) — sur instruction explicite + review JMJ uniquement (paradigme agent pilote 2026-07-13).\n- ❌ Éditer RULES.md / AGENTS.md / MANIFEST.md à la main.\n- ❌ Toucher à la topologie git (`git reset`, `checkout`, force push).\n- ❌ Créer le générateur Jinja2 — on est à 29 agents, mais la doctrine dit\n  \"seulement si maintenance manuelle douloureuse\". Tant que c'est tenable, rester manuel.\n- ❌ Pseudo-correction sans vérifier l'existence (règle `source_verite_data_avant_absence`).\n\n## Baseline mesurée au setup (P0, 2026-07-09)\n\n- BQ : 92 actives / 31 critiques / **5 avec `ordre=0`** (pas_agent_redacteur,\n  lifofer_no_repiquage, pedago_links, pas_modif_fr_canonique, ui_blocs_2_lignes)\n- Scripts : 140 / tous avec description docstring\n- `ruff check tools/ --select E,F` : **2597 erreurs** (2070 line-too-long,\n  180 f-string-missing-placeholders, 105 unused-import, 72 multiple-statements-on-one-line-colon, …) — 308 auto-fixables\n- `vulture tools/ --min-confidence 80` : code mort détecté (imports inutilisés,\n  variables, code unreachable après `return`)\n\n## Références croisées\n\n- **BQ gouvernante** : `wf_agents_library` (bibliothèque + routing paramétrique),\n  `strategie_agents` (patterns d'usage)\n- **BQ connexes** : `agent_runner_garde_fous` (fan-out), `conseil_modele`\n  (Conseil V3), `audit_conscient` (philosophie d'audit), `regeneration_pipeline_regen_all_py_gen_py`\n  (régénération outputs)\n- **RULES.md** : `agent_runner_reflexe`, `pas_agent_redacteur`, `routing_modeles_agents`,\n  `thinking_profiling`, `agent_library_parametrique`\n- **Agents** : `.opencode/agents/{audit-bq-*,weaver-bq,audit-scripts-*,weaver-scripts-bq}.md`\n- **Skill** : `.opencode/skills/compose/SKILL.md` (catalogue pipelines G/H/I)\n", "type": "workflow", "crit": true}]}, "archivage": {"nom": "Archivage post-intégration", "entries": [{"id": 125, "titre": "Structure `recherches/` — rangement canonique", "contenu": "## Structure des dossiers de travail `recherches/`\n\n**Source unique** pour tout ce qui est \"document de travail en cours ou\nhistorique\" lié au corpus. Publications/recherches n'existe plus (éliminé\nle 2026-04-14 pour cause de doublon).\n\n### Biblio PDF JMJ : `jmj/pdf/`\n\nBiblio PDF personnelle de JMJ (poussée sur le repo). Contient les publications académiques, rapports et ressources de référence en PDF que JMJ a rassemblés. Exemples : Shift Project PREF, Kirkby et al. 2016, rapports Triple Performance (Arvalis), guides techniques (Maraîchage Sol Vivant, bilan humique AMG), etc.\n\nUtilisation par l'agent : **lecture directe via l'outil Read** (fonction PDF native, avec `pages` pour PDF > 10 pages). Extraire les valeurs chiffrées, paramètres, tableaux pour enrichir `ref_*` tables + `sources`. Ne jamais copier-coller le contenu dans des fichiers — extraction ciblée et ancrage en DB (comme pour `refs (kind=esclave_energ)` depuis `jmj/pdf/PREF_Shift-Project_Transition-robuste_14-avril-2026.pdf`).\n\n### Arborescence canonique\n\n```\njmj/\n└── pdf/                 # Biblio PDF JMJ (§ dédié ci-dessus ; reste de jmj/ dans `paths_structure`)\n\nrecherches/\n├── fiches/              # Prompts docx fiches en cours (graine redigee / envoyee)\n├── thesaurus/           # Enrichissement thesaurus (Jenni) :\n│                         #   - thesaurus___strate_*.docx (retours Jenni avec nouveaux termes)\n│                         #   - thesaurus_incomplets_strate_*.docx (listes à compléter)\n│                         #   - enrich_thesaurus_<axe>_<strate>_YYYY-MM-DD.docx (lots export par gen enrich_thesaurus.py)\n└── archives/\n    ├── fiches/          # Fiches traitées (statut integree ou archive)\n    ├── thesaurus/       # Thesaurus traités (à venir)\n    └── prompts_validation/  # Anciens prompts validation archivés\n```\n\n### Règle de rangement\n\n| Ce qu'on produit | Où le ranger |\n|---|---|\n| Prompt docx d'une fiche technique/transversale | `recherches/fiches/` |\n| Retour Jenni thesaurus strate X | `recherches/thesaurus/thesaurus___strate_X.docx` |\n| Docx d'une strate à compléter | `recherches/thesaurus/thesaurus_incomplets_strate_X_<date>.docx` |\n| Audit / sources orphelines / termes candidats / rapport de session | `jmj/rapports/audit/` |\n| Une fois traité (fiche intégrée, thesaurus digéré) | `recherches/archives/<catégorie>/` |\n\n### Scripts conformes\n\n- `integrate_fiche.py` (subagent rédacteur sous supervision GLM) → `recherches/fiches/fiche_<slug>.md` (chaîne canonique MD natif, paradigme agent pilote 2026-07-13 ; ~~`gen_fiche_docx.py`~~ et ~~`prod_fiche_hybride.py`~~ supprimés)\n- `export_thesaurus_incomplets.py` → `recherches/thesaurus/`\n- `export_validation.py` / `export_mismatches_inrae.py` / `export_termes_candidats.py` / `audit_sources_orphelines.py` → `jmj/rapports/audit/`\n- `gen_prompt_completion.py` / `gen_prompt_enrichissement.py` → **dépréciés** (workflow `completion/` abandonné, cf. note ci-dessous)\n\n### Anti-pattern à éviter\n\n- ❌ Créer un `Publications/recherches/` bis (doublonnage historique)\n- ❌ Mettre des audits ou rapports dans `recherches/thesaurus/` (fourre-tout)\n- ❌ Scripts avec chemins hardcodés dans `Publications/` pour du travail\n  intermédiaire (`Publications/` = outputs publiables uniquement)\n\n### Note 2026-04-14 — `completion/` déprécié\n\nLe dossier `recherches/completion/` a été supprimé : les termes incomplets\ndu thésaurus repassent désormais dans le workflow initial (docx d'import).\nWorkflow unique :\n- Listes d'incomplets générées en docx dans `recherches/thesaurus/thesaurus_incomplets_strate_X_<date>.docx`\n- Retours Jenni dans `recherches/thesaurus/thesaurus___strate_X.docx`\n- Réimport via `import_termes.py --replace`\n\nLes anciens `complete_*.txt` sont archivés dans\n`recherches/archives/completion/`. Le script `gen_prompt_completion.py`\nest marqué déprécié.\n\n---\n\n### Rapports et audits : voir BQ `paths_structure`\n\nLes **rapports de session** et **rapports d'audit** ne sont PAS dans\n`recherches/` mais dans `jmj/rapports/` (session / audit) — voir BQ `paths_structure` pour la structure complete et les paths config. Le dossier\n`recherches/audits/` a ete supprime en avril 2026 (migration vers\n`jmj/rapports/audit/`).\n\n---\n\n### Préfixe de priorité sur les fichiers docx fiches (2026-04-23)\n\n**Convention** : les docx de `recherches/fiches/` portent un préfixe\nnumérique à 2 chiffres qui reflète leur **priorité de lecture/traitement**\n(ordre dans lequel Jenni ou le lecteur doit les prendre). Pattern :\n\n```\nNN_fiche_<slug>_<YYYY-MM-DD>.docx\n```\n\nExemples :\n```\n01_fiche_cascade-temporelle-t0-t5_2026-04-22.docx\n06_fiche_drilosphere-maom-bioreacteur-carbone_2026-04-22.docx\n07_fiche_carences-minerales-silencieuses_2026-04-22.docx\n07_fiche_lombriciens-ecologie-pilotage_2026-04-23.docx  ← même niveau 07 accepté\n```\n\n### Règle : niveau d'index partagé autorisé\n\n**Quand une nouvelle fiche est aussi prioritaire qu'une fiche existante, elle\npeut porter le même préfixe.** Plusieurs fiches au même niveau d'index\ncoexistent sans conflit — le système de fichiers les classe simplement\ndans l'ordre alphabétique du slug, ce qui est acceptable (deux fiches\nco-prioritaires sont lues l'une après l'autre, l'ordre entre elles\nn'a pas d'importance éditoriale).\n\nConséquences :\n- **Pas de décalage forcé** de toutes les fiches suivantes quand une\n  fiche prioritaire s'insère (évite les renommages en cascade).\n- **Pas de numéro isolé** (ex. `19_`) pour une fiche qui est en réalité\n  co-prioritaire avec un niveau antérieur — le `19_` suggère « après\n  les 18 précédentes » alors que la fiche est prioritaire.\n- Le préfixe reste un **indicateur de priorité**, pas un identifiant\n  unique. L'identifiant unique d'une fiche c'est son `slug` (+ `id` DB).\n\n### Anti-pattern à éviter\n\n- ❌ Créer un préfixe tout neuf (ex. `19_`) juste pour éviter un doublon\n  de préfixe, si la fiche mérite éditorialement le niveau 07.\n- ❌ Renuméroter toutes les fiches suivantes (`07` → `08`, `08` → `09`…)\n  pour insérer une nouvelle fiche en `07` — les docx archivés garderaient\n  leurs anciens noms, les historiques git ne matchent plus.\n- ❌ Considérer le préfixe comme un identifiant : deux fiches `07_` ≠\n  collision — elles partagent un *niveau de priorité*, pas une identité.\n", "type": "reference", "crit": false}]}, "bq": {"nom": "BQ elle-même", "entries": [{"id": 57, "titre": "Architecture DB — tables, vues, colonnes clés", "contenu": "**Comptages à jour** (générés dynamiquement par `session_start.py`) :\n```sql\nSELECT\n  (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name != 'sqlite_sequence') as tables,\n  (SELECT COUNT(*) FROM sqlite_master WHERE type='view') as vues;\n```\n\nNe pas mettre de chiffres en dur ici — utiliser la requête ci-dessus ou `session_start.py`.\n\n**Noyau documentaire** : documents, prompts, prompt_contenus, doc_contenus, jenni_doc_specs, jenni_doc_versions, sources\n**Thésaurus** : terms, term_relations\n**Chaînes** : chains_causales, chain_etapes, card_chain_links\n**Cascade / cartes** : cascade_prerequis, cascade_level_links, concept_cards, concept_card_links, concept_card_tests, concept_dimensions, terrain_tests, diagnostic_rules, diagnostic_rule_terms\n**Config** : config, db_meta, audit_log\n**Fiches** : fiches, fiche_retour_sections, fiche_articulations, source_usages (+ vue `v_fiche_refs` cache refs à la volée depuis 2026-07-05 ; + `fiche_section_h2_notes`, `fiche_sections`, `graines`, `fiche_contenus` dépréciées/supprimées — grand ménage 2026-07)\n**Validations** : validations, validation_sections, validation_contenus\n\n### (fusionné depuis #58 : Tables actives vs legacy)\n\n**Tables actives (utilisées quotidiennement) :**\ndocuments, prompts, terms, term_relations, jenni_doc_specs, jenni_doc_versions, chains_causales, chain_etapes, db_meta, audit_log, config, fiches, fiche_retour_sections, source_usages, concept_cards, validations\n\n**Tables de référence (calculateurs, données scientifiques) :**\nrefs (unifiee 2026-04, kind=matiere|texture|esclave_energ|shift_chantier|cn_regle) + ref_cn_incorporation, ref_kirkby, ref_analyses, ref_links (structures specifiques)\n\n**Tables web (templates, pages) :**\nhtml_templates, web_pages\n\n**Tables cascade & diagnostic :**\ncascade_prerequis, cascade_level_links, concept_cards, concept_card_links, concept_card_tests, terrain_tests, diagnostic_rules, diagnostic_rule_terms\n\n**Tables legacy (présentes) :**\nprompt_contenus (remplacé par prompts.enrichissement, encore présent)\n\n**Tables DROPPÉES (ne plus référencer)** : doc_cross_refs (2026-05-06), term_connections, jenni_section_specs, requetes_utiles (→ catalogue SQL filesystem `tools/sql/`), ref_melanges_predefinies, scripts (→ `scripts_inventory.py`), bq_entries/domaines_techniques/domaine_bq (→ `tools/bq/*.md`), maintenance_sessions/audit_reports (→ filesystem `jmj/rapports/`), sources, **fiche_sections** (2026-07-04, grand ménage — l'API d'audit produit en MD natif), **graines** (2026-07-04, grand ménage — cycle Jenni obsolète), fiche_section_h2_notes (→ fiche_sections.type='body_h2', puis supprimée avec fiche_sections).\n\nCompter les tables :\n```sql\nSELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name != 'sqlite_sequence';\n```\n\n### (fusionné depuis #82 : Colonnes clés par table — aide-mémoire)\n\nColonnes les plus utilisées (évite les PRAGMA table_info à répétition) :\n\n**terms** : id, section_key, strate, fr, en, definition, syn_fr, syn_en, inrae, doc_code, statut, type, flag_pratique_typee\n**prompts** : id, doc_code, type (intro/section/conclusion), chapitre, section, titre_h1, titre_h2, contexte_sci, instructions, enrichissement, style, tableau, ordre\n**documents** : code, titre, strate, mots_cible_min, mots_cible_max, statut, doc_maitre, note\n**config** : categorie, cle, valeur\n**concept_cards** : id, title, description, category, docs_codes (JSON), status\n**refs** (migration 2026-04) : id, ref_kind, code, label, description, source, source_id, data JSON, ordre, is_active, legacy_id. Helper `tools/lib/refs.py::load_refs(con, kind)` deplie data + alias compat\n    **refs (kind=matiere)** : 110 rows. Colonnes specifiques (cn_min/max, k1_min/max, NPK, densite, cout, synonymes, source) dans le champ `data` JSON, deplies a la racine par `load_refs(con, 'matiere')`\n**ref_cn_incorporation** : id, cn_seuil_min, cn_seuil_max, niveau, titre, contenu, conditions (JSON), cas_etude (JSON), redox (JSON), timeline\n**html_templates** : id, slug, page_slug, type (page_css/page_js/head), contenu\n**BQ (filesystem Session D)** : `tools/bq/<slug>.md` frontmatter YAML + body MD. Voir BQ `bq_architecture_domaines`. Catalogue 14 domaines : `tools/bq/_domaines.yaml`\n**chains_causales** : id, titre, docs_traverses, valeur_ajoutee (argument lecteur, propre), notes (provenance éditoriale : [xref]/[Distinction…], non affichée), created_at\n**chain_etapes** : id, chain_id, position, term_id, term_fr_text, strate_etape, role_dans_chaine (mécanisme lecteur, propre), notes (renvois [voir fiche #N…], non affichés)\n\n### Conventions de liaison entre tables (Conseil liens, 2026-06-10)\n\nLe schéma est **~95 % normalisé** : **toute relation N-N passe par une table de jointure** (FK déclarées) — `card_chain_links`, `concept_card_links`, `concept_card_tests`, `cascade_level_links`, `chain_etapes`, `fiche_articulations`, `pedago_links`, `source_usages`, `term_relations`, `diagnostic_rule_terms`. **C'est le pattern par défaut pour tout nouveau lien.**\n\n**Exceptions assumées — ne PAS « normaliser » par zèle (décision Conseil + contradicteur) :**\n\n- **`doctrine_chantiers` (registre du fil)** lie ses axes par des **listes d'ids en JSON** : `cards_liees`, `fiches_contributrices`, `chains_liees`, `terms_lies`. Choix délibéré : petit registre éditorial (~24 lignes), listes **comptées** (`len(json.loads(...))` dans `audit_center`), **jamais jointes** → une table de jointure n'apporterait aucune requête réelle. Garde-fou : `check_integrity.check_doctrine_chantiers_json_orphans` (les ids doivent exister ; `terms_lies` = ids `terms`, **pas des noms** — chaos nettoyé le 2026-06-10).\n- **`concept_cards.source`** = **provenance-texte** (`fiche_30_2026-05-02`, `fiches #25 #11 #4`, `corpus_v1`, `session_…`), **pas un lien relationnel**. La provenance card→fiche y est dérivable (parsing → 41 fiches, 78 cards) mais **aucun code ne la requête** → **pas de table `card_fiche_links`** tant qu'un consommateur réel n'émerge pas (YAGNI ; sinon on créerait une 2ᵉ source de vérité du même lien).\n- **`chain_etapes.term_fr_text`** = **cache dérivé** du nom, à côté du vrai FK `term_id`. Régénérable ; une désync = cache périmé (`term_fr_text` ≠ `terms.fr`), pas une erreur de lien.\n- **`terms.doc_code`** peut être **multi-codes** (`H3/S2`, `S0/V1/P2`) = terme partagé par plusieurs docs. Surcharge sémantique assumée (non scindée : 204 lignes, coût/risque > bénéfice à ce jour).\n\n**FK enforcement** : `PRAGMA foreign_keys = 0` (non persisté par SQLite ; choix workflow mono-user — l'enforcement runtime imposerait l'ordre insert/delete à tous les scripts). Filet équivalent : `check_integrity.check_foreign_keys_pragma` (`PRAGMA foreign_key_check` périodique) + les checks d'orphelins ciblés. `foreign_key_check` = **0 violation** (2026-06-10).\n\n**Règle** : un schéma clair = **documenté et justifié**, pas migré pour la pureté. Chaque exception ci-dessus a son garde-fou dans `check_integrity`.\n", "type": "reference", "crit": true}, {"id": 1, "titre": "Carte du projet — vue d'ensemble (à lire en premier)", "contenu": "## Carte du projet — Le Sol Vivant cet Holobionte\n\n**Lire en premier.** Cette entrée donne la vue d'ensemble. Toutes les BQ sont ensuite des références détaillées.\n\n### Le projet en 4 lignes\n\nCorpus scientifique structuré en **18 documents** cibles (la synthèse finale visée, cf. `ordre_de_redaction_des_18_documents`) sur l'agriculture régénératrice et la biologie des sols, écrit par Jean-Michel Juzan. La production éditoriale courante passe par les **fiches** (zoom/service) qui alimentent ces documents. opencode édite la DB et les scripts ; Jenni AI rédige. Biblio interne dans la table `sources` (~10 500 refs — le dashboard fait foi), alimentée par intégration consciente des rapports de sources fournis par JMJ. DB unique `sol_vivant.db` = source de vérité. `origin/main` = production.\n\n### Les 3 acteurs\n\n| Acteur | Rôle | Interface |\n|---|---|---|\n| **opencode** (moi) | Édite la DB, les scripts, audit corpus, intégration retours Jenni, veille | Terminal + sol_vivant.db |\n| **Jenni AI** | Rédige à partir de prompts, produit des .docx | Web, piloté par .txt prompts |\n| **JMJ** (auteur) | Donne des rapports de sources à intégrer, valide les actions de l'agent | Session + .md |\n\n### Pipeline global\n\n```\n    ┌─────────────────────────────────────────────────────────────┐\n    │          CORPUS = 18 documents rédigés par Jenni            │\n    └──────────────────────────▲──────────────────────────────────┘\n                               │ passe finale Jenni\n                               │\n          ┌────────────────────┴────────────────────┐\n          │   PROMPTS clôturés (prompts.statut=cloture)  │\n          │     contexte_sci + instructions + enrichissement       │\n          └────────────────────▲────────────────────┘\n                               │\n       ┌───────────────────────┼───────────────────────┐\n       │                       │                       │\n  ┌────┴─────┐           ┌─────┴─────┐           ┌─────┴──────┐\n   │ THÉSAURUS │           │  FICHES   │           │VALIDATIONS│\n   │ N termes  │           │ N fiches  │           │ (en pause)│\n   └────▲─────┘           └─────▲─────┘           └─────▲──────┘\n       │                       │                       │\n       │ enrich_thesaurus       │ fiches zoom           │ combler dette\n       │                       │ (transversale/        │ (audit révèle)\n       │                       │  technique/zoom)      │\n       │                       │                       │\n  ┌────┴───────────────────────┴───────────────────────┴────┐\n  │              AUDIT du corpus / notes volantes           │\n  │    analyse_corpus · check_integrity                     │\n  └─────────────────────────────────────────────────────────┘\n```\n\n**Note** : les `concept_cards` (**N actives**, dashboard fait foi) agissent en **filtre de rigueur** entre captation et intégration : toute nouvelle affirmation doit d'abord passer par une carte (cf. `concept_cards_filtre_de_rigueur_une_affirmation_ba`).\n\n### Les 5 scripts à connaître (chaque session)\n\n| Commande | Rôle |\n|---|---|\n| `python3 tools/admin/session_start.py --db sol_vivant.db` | Démarre la session (état git, backup DB, dashboard, règles actives) |\n| `python3 tools/admin/bq_query.py --list` / `--domaine <slug>` / `--search <kw>` | Consulter cette BQ (filesystem `tools/bq/`) |\n| `python3 tools/admin/check_integrity.py --db sol_vivant.db` | Valider l'état DB (FK, orphelins, doublons) |\n| `python3 tools/regen_all.py --db sol_vivant.db` | Régénérer tous les outputs (HTML, README, workflows) depuis la DB |\n| `python3 tools/veille/weekly_scan.py --db sol_vivant.db` | Veille PubMed hebdomadaire (9 thèmes, 28 requêtes) |\n\n### Les 4 règles absolues\n\n1. **`main` est la production** — `origin/main` = source de vérité. On travaille sur `main` (CLI local) ou sur une branche au choix de JMJ. `session_end.py` pousse la branche courante ; l'agent ne force pas la topologie (cf. `git_toujours_travailler_sur_main`).\n2. **La DB est source de vérité** — fichiers générés = vues (cf. #73). Ne jamais modifier un fichier de sortie ; toujours modifier la source puis `regen_all.py`\n3. **Le .docx Jenni ne rentre jamais tel quel en DB** — tout passe par analyse agent + scripts d'import contrôlés\n4. **Pas de codes docs / méta-vocab dans les prompts** — S2, V1, \"strate\", \"corpus\", \"thésaurus\" interdits dans `prompts.contexte_sci/.instructions/.enrichissement` (cf. #120)\n\n### Infrastructure transverse\n\n**Table `config` (N clés — dashboard fait foi)** — paramètres centralisés par catégorie/clé. Toute valeur partagée entre scripts va là, pas en dur.\n- `config.corpus.*` : nom, auteur, version du projet\n- `config.veille.hot_topics` : 9 thèmes PubMed de la veille\n- `config.web.icon_library` : bibliothèque d'icônes unifiée\n- `config.cahier.onglets`, `config.cahier.chapitres`, `config.cahier.tab_descriptions` : structure du Cahier de Science\n- `config.jenni.*` : templates de prompts Jenni\n- `.opencode/RULES.md` : règles l'agent affichées au démarrage\n\nLecture Python : `from config import get, get_json, get_int, get_float` (dans `tools/lib/config.py`).\n\n**Table `audit_log` (9000+ entrées)** — trace horodatée de toutes les opérations significatives en DB. Colonnes : `ts, operation, table_name, record_ref, detail`. Opérations les plus courantes : `GENERATE` (régénération page), `UPDATE` (modification), `INSERT` (ajout), `IMPORT` (import docx), `MERGE`, `SYNC`.\n\nUtile pour :\n- Reconstituer l'historique d'une fiche ou d'un terme\n- Debugger « qui a modifié quoi quand »\n- Produire les rapports de session\n\n**Écriture systématique** : tout script qui modifie la DB doit écrire dans audit_log :\n```python\ncon.execute(\"INSERT INTO audit_log (operation, table_name, record_ref, detail) VALUES (?, ?, ?, ?)\",\n            ('UPDATE', 'terms', f'term #{tid}', 'Correction definition corrompue'))\n```\n\n**Table `sources` (~10 500 refs — dashboard fait foi)** — biblio interne du projet. Chaque source a `doi, auteurs, annee, titre_complet, journal, resume_court, pertinence, tags, url`. Alimentée par **intégration consciente** (un rapport de source à la fois — cf. workflow `wf_source_integration`). Jamais de batch-insert aveugle.\n\n**Table `source_usages` (~18 700 liens)** — relie une source à une entité (fiche / document / terme / card / prompt) avec contexte et citation brute. Permet de reconstituer « où est cette source citée ? ».\n\n### BQ — où chercher quoi\n\nLa BQ est en **filesystem** (`tools/bq/<slug>.md`, frontmatter YAML + corps markdown), organisée en **14 domaines** répartis en 4 catégories (pipeline, corpus, web, technique). Consultation **au fil de l'eau**, jamais en bloc :\n\n| Commande | Usage |\n|---|---|\n| `bq_query.py --list` | Inventaire des 14 domaines + compteurs |\n| `bq_query.py --domaine <slug>` | Charger un domaine entier (ex. `fiches`, `web`, `thesaurus`, `session`) |\n| `bq_query.py --search <kw>` | Recherche full-text (réflexe par défaut avant toute action — cf. `carte_du_projet_vue_d_ensemble_a_lire_en_premier`) |\n\nCatalogue des domaines : `tools/bq/_domaines.yaml`. Architecture : `bq_architecture_domaines`.\n", "type": "info", "crit": false}, {"id": 73, "titre": "DB = source de vérité — données en DB, fichiers = vues", "contenu": "**Règle** : `sol_vivant.db` est la source de vérité **pour les données** (corpus, audit_log, config, refs). Les **scripts** Python sont versionnés par git dans `tools/` (Session B). Les fichiers HTML/MD/TXT générés depuis la DB sont des **vues**.\n\n**Ne jamais modifier directement :**\n- ~~`Publications/prompts/prompts_jenni_*.txt` → générés par `export_jenni_doc.py`~~ **(obsolète 2026-07 — Jenni supprimée, script archivé)**\n- `Publications/web/*.html` → générés par `gen_mo_calc.py`, `gen_web.py`, `gen_triangle_textures.py` depuis les tables `ref_*`, `html_templates`\n- `Publications/workflows/*.md` → générés par `gen_workflows.py`\n- `tools/**/README.md` → générés par `gen_readme.py`\n\n**Toujours corriger la source :**\n- Contenu des prompts → modifier dans table `prompts` (les scripts d'export Jenni sont obsolètes)\n- CSS/JS des calculateurs → modifier dans table `html_templates`\n- Données de référence → modifier dans les tables `ref_*`\n- Puis regénérer le fichier avec le script approprié\n\n**Workflow correct :**\n1. Modifier la DB (tables, templates, config)\n2. Regénérer les fichiers (`python3 tools/docs/gen_*.py --db sol_vivant.db`)\n3. (Plus de sync — les scripts sont versionnes par git directement)\n4. `git add` + `git commit` + `git push`\n\n### (fusionné depuis #79 : Données = DB, code = logique uniquement)\n\n**Règle** : toute donnée paramétrable va dans la DB, jamais en dur dans le code Python ou JS.\n\n**Où stocker quoi :**\n| Type de donnée | Table DB |\n|---|---|\n| Paramètres API (modèle, tokens, prix) | `config` |\n| Données de référence (C/N, matières, textures) | `ref_*` |\n| CSS/JS des pages web | `html_templates` |\n| Contenu des prompts Jenni | `prompts` |\n| Termes canoniques | `terms` |\n| Mélanges prédéfinis | `refs` (kind=matiere, categorie=Mélange) |\n\n**Exceptions tolérées** : constantes physiques universelles, noms de colonnes SQL, noms de fichiers de sortie.\n\n**Code = filesystem, donnees = DB :**\n    Les **scripts Python** sont versionnes par git dans `tools/` (table `scripts` supprimée Session B). Lire un script = `Read tools/<folder>/<nom>.py`. Inventaire programmatique = `tools/lib/scripts_inventory.py::list_scripts()`. Les **templates HTML** restent en DB (`html_templates.contenu`). Les **donnees** restent en DB (terms, refs, fiches, etc.).\n\n| Pour lire... | Faire | Ne pas faire |\n|---|---|---|\n    | Un script | `Read tools/<folder>/<nom>.py` ou `from scripts_inventory import list_scripts` |\n| Un template React | `SELECT contenu FROM html_templates WHERE id = N` | `Read` sur le HTML généré |\n| Une config | `SELECT valeur FROM config WHERE cle = 'xxx'` | Lire AGENTS.md |\n| Des données | `SELECT ... FROM refs / terms / ...` (helper `tools/lib/refs.py`) | Lire un export JSON/CSV |\n\n**Historique** : polygones GEPPA hardcodés dans gen_triangle_textures.py, nombre de cartes \"35\" en dur (sessions 31/03, 01/04). Lecture fichier gen_triangle_textures.py dépassant 10K tokens (session 04/04).\n", "type": "contrainte", "crit": true}, {"id": 59, "titre": "Requêtes utiles — pilotage, thésaurus, diagnostic", "contenu": "## Requêtes utiles — pilotage, thésaurus, diagnostic\n\nLes requêtes de référence sont stockées dans **`tools/sql/<categorie>/<nom>.sql`** (Session E 2026-05-06, table `requetes_utiles` droppée). Voir BQ `requetes_utiles_catalogue_sql` pour le format complet.\n\n```bash\n# Trouver une requête par nom\ncat tools/sql/sante/etat_production.sql\n\n# Requêtes de démarrage de session\ngrep -l \"usage_type: session\" tools/sql/**/*.sql\n\n# Requêtes de diagnostic\ngrep -l \"usage_type: diagnostic\" tools/sql/**/*.sql\n\n# Requêtes d'un domaine\nls tools/sql/thesaurus/\n```\n\n**Exécution** — le binaire `sqlite3` CLI peut être absent (session web : cf. `environnement_pas_de_binaire_sqlite3`). Passer par Python :\n```python\nfrom pathlib import Path\nimport sqlite3\nsql = Path('tools/sql/thesaurus/termes_sans_definition.sql').read_text()\nconn = sqlite3.connect('sol_vivant.db')\nfor r in conn.execute(sql).fetchall():\n    print(r)\n```\n\nCatégories : sante, documents, thesaurus, chaines, bq, crossrefs, maintenance, biblio, cascade, pilotage, config.\nTypes : session (15), pilotage (14), diagnostic (9), export (2), maintenance (1).\n\n### Requêtes thesaurus\n\nLes requêtes thésaurus sont dans `tools/sql/thesaurus/` :\n```bash\nls tools/sql/thesaurus/\n# doublons_termes.sql, densite_termes_par_doc.sql, termes_partages.sql,\n# termes_sans_definition.sql, termes_document.sql, thesaurus_complet_compact.sql\n```\n\n### Requêtes diagnostic rapide — copier-coller\n\nRequêtes courantes à copier-coller au démarrage ou pendant le travail :\n\n```sql\n-- État du corpus\nSELECT strate, COUNT(*) FROM documents GROUP BY strate;\n\n-- Termes par doc\nSELECT doc_code, COUNT(*) FROM terms GROUP BY doc_code ORDER BY doc_code;\n\n-- Prompts incomplets (pas d'enrichissement)\nSELECT doc_code, titre_h2 FROM prompts WHERE enrichissement IS NULL OR enrichissement = '';\n\n-- Dernières opérations\nSELECT ts, operation, table_name, substr(detail,1,80) FROM audit_log ORDER BY ts DESC LIMIT 10;\n\n-- Config API\nSELECT cle, valeur FROM config WHERE categorie = 'api';\n\n-- BQ critiques par domaine (filesystem Session D)\n-- python3 tools/admin/bq_query.py --critical-only\n\n-- Inventaire scripts (filesystem Session B)\n-- python3 -c \"from tools.lib.scripts_inventory import list_scripts; ...\"\n```\n", "type": "commande", "crit": false}, {"id": 139, "titre": "Refactor term_relations - source unique BT/NT/RT (2026-04-20)", "contenu": "## Refactoring term_relations — source de vérité unique pour BT/NT/RT\n\n**Depuis le 2026-04-20** : les colonnes `terms.bt`, `terms.nt`, `terms.rt` ont été **supprimées**. La table `term_relations` est la SEULE source de vérité pour les relations entre termes.\n\n### Schéma actuel\n\n```sql\nCREATE TABLE term_relations (\n    id              INTEGER PRIMARY KEY AUTOINCREMENT,\n    from_term_id    INTEGER NOT NULL REFERENCES terms(id) ON DELETE CASCADE,\n    to_term_text    TEXT NOT NULL,          -- libellé brut (Jenni/docx)\n    to_term_id      INTEGER REFERENCES terms(id),  -- FK si résolu, NULL si orphelin\n    rel_type        TEXT NOT NULL CHECK(rel_type IN ('BT','NT','RT'))\n);\nCREATE INDEX idx_term_relations_to ON term_relations(to_term_id);\n```\n\n### Vues\n\n**`v_term_relations`** — joint source et cible, expose `display_text` (COALESCE to_fr, to_term_text) et `is_orphan` :\n```sql\nSELECT ... FROM v_term_relations WHERE from_id = ? AND rel_type = 'RT'\n```\n\n**`v_terms_full`** — expose `terms` avec `bt`/`nt`/`rt` agrégés automatiquement depuis `v_term_relations` (GROUP_CONCAT avec ` · ` comme séparateur). Remplace les anciennes colonnes `terms.bt`/`terms.rt`. Les scripts lecteurs doivent faire `SELECT ... FROM v_terms_full` au lieu de `FROM terms` quand ils ont besoin de bt/rt.\n\n### Module partagé\n\n**`tools/lib/term_rels.py`** — helpers pour les scripts écrivains :\n- `norm(s)` : normalisation matching (apostrophes, accents, casse, sing/plur)\n- `build_fr_index(con)` : construit le dict `{norm(fr|en|syn) → term_id}`\n- `write_relations(con, from_id, rel_type, raw_text, index=None)` : delete existantes + split + insert avec `to_term_id` résolu automatiquement\n- `get_relations(con, from_id, rel_type)` / `get_relations_text(...)` : lecture formatée\n\n### Scripts patchés (2026-04-20)\n\n**Lecteurs** (maintenant `SELECT ... FROM v_terms_full`) :\n- `tools/batch/analyse_corpus.py`\n- `tools/docs/gen_web.py`\n\n**Écrivains** (retire `bt/rt` des INSERT/UPDATE sur terms, écrit via `term_rels.write_relations`) :\n- `tools/integration/import_termes.py`\n- `tools/integration/enrich_thesaurus.py`\n- `tools/integration/resolve_import_conflicts.py`\n- `tools/admin/dedupe_thesaurus.py` (met aussi à jour `to_term_id` quand il migre `to_term_text`)\n\n### Migration effectuée\n\n**Phase 0 — Synchronisation** : toutes les relations des anciennes colonnes `terms.bt`/`terms.rt` qui n'étaient pas dans `term_relations` y ont été ajoutées :\n- BT : 437 → 852 (+415)\n- RT : 3488 → 5927 (+2439)\n- NT : 14 (inchangé)\n\n**Phase 1 — Migration FK** : `to_term_id` résolu via `norm()` pour 4296 relations ; 2497 restent orphelines (texte cible hors thésaurus, à arbitrer via agents Task ou décisions éditoriales).\n\n**Phase 2 — Vues** : v_term_relations + v_terms_full créées.\n\n**Phase 3 — Scripts patchés** : 8 scripts mis à jour.\n\n**Phase 4 — Drop colonnes** : `terms.bt`, `terms.nt`, `terms.rt` supprimées (ALTER TABLE DROP COLUMN — SQLite ≥ 3.35).\n\n### Bénéfices\n\n- **Orphelins explicites** : `SELECT * FROM v_term_relations WHERE is_orphan = 1` liste directement les 2497 relations dont la cible n'est pas dans le thésaurus\n- **Plus de redondance** : une seule source de vérité, la vue reconstruit le texte à la volée\n- **FK suivie automatiquement** : si on renomme un terme, les relations vers lui n'ont plus à être réécrites (le `to_term_id` reste valide)\n- **Audit de cohérence simplifié** : une requête SQL simple (plus besoin de parser les champs texte)\n\n### Comportement orphelins\n\nQuand une relation pointe vers un texte qui ne matche aucun terme (`to_term_id IS NULL`) :\n- `v_term_relations.display_text` = `to_term_text` (le texte brut)\n- `is_orphan = 1`\n- `v_terms_full.rt` inclura ce texte brut dans la concaténation\n\nQuand l'orphelin deviendra résolu (un nouveau terme est créé ou un syn est ajouté qui matche), il suffit de ré-exécuter une passe de résolution :\n```python\nfrom lib.term_rels import build_fr_index\nidx = build_fr_index(con)\nfor r in con.execute(\"SELECT id, to_term_text FROM term_relations WHERE to_term_id IS NULL\"):\n    tid = idx.get(norm(r[1]))\n    if tid:\n        con.execute(\"UPDATE term_relations SET to_term_id=? WHERE id=?\", (tid, r[0]))\n```\n\n**Script dédié** : `tools/admin/resolve_term_relations.py` automatise cette résolution (3 passes par cause d'orphelin — voir docstring), en complément des hooks post-import de `term_rels.py`.\n\nVoir commit de référence : `llm/refactor-term-relations`.\n\n### Alerte post-import `detect_cross_syn_fr()` (session 2026-04-21)\n\n**Problème** : le format strict de Jenni protège le `fr` canonique (règle absolue AGENTS.md). Conséquence perverse : si on envoie à Jenni un terme mal formaté (ex : `'BRF (Bois Raméal Fragmenté)'`), elle garde le `fr` tel quel et met la version propre (`'Bois Raméal Fragmenté'`) en `syn_fr`. Si ce libellé existe déjà comme `fr` canonique d'un terme séparé → **deux entrées désignent le même concept sans détection automatique**.\n\n**Diagnostic** : scan rétroactif = 50 collisions syn↔fr dans le thésaurus courant.\n\n**Solution** (commit `084a043`) :\n\n- `tools/lib/term_rels.py::detect_cross_syn_fr(con, term_ids=None)` — scanne les `syn_fr`/`syn_en` de `term_ids` (ou tout le thésaurus si None) et retourne la liste des collisions avec un `fr` canonique existant. Format de retour :\n  ```python\n  [{'from_id': ..., 'from_fr': ..., 'syn_text': ..., 'syn_field': 'syn_fr'|'syn_en',\n    'collides_with_id': ..., 'collides_with_fr': ...}]\n  ```\n- Hook post-commit ajouté dans les 2 scripts qui écrivent dans `syn_fr`/`syn_en` :\n  - `tools/integration/import_termes.py`\n  - `tools/integration/enrich_thesaurus.py`\n- Le hook affiche les collisions (⚠) et écrit un WARN dans `audit_log` (operation='WARN', table='terms').\n\n**Règle stricte** : aucune modification automatique des termes. L'alerte **surface** pour arbitrage JMJ — jamais d'action silencieuse sur le thésaurus.\n\n**Arbitrage par paire détectée** :\n1. Même concept → fusion (via `dedupe_thesaurus.py` ou manuel)\n2. Concepts distincts mais syn mal attribué → retirer le syn fautif (ne pas modifier le fr canonique)\n3. Hiérarchie réelle → poser BT/NT explicite, retirer le syn\n\n**Historique** : cette doctrine avait été implémentée la veille (2026-04-20) et perdue dans un rollback. Documentée ici pour survivre aux prochains rollbacks.\n", "type": "technique", "crit": true}, {"id": 65, "titre": "requetes_utiles — catalogue SQL", "contenu": "41 requêtes SQL de référence organisées par catégorie dans **`tools/sql/<categorie>/<nom>.sql`** (Session E 2026-05-06, table `requetes_utiles` droppée).\n\n**11 catégories** : sante, documents, thesaurus, chaines, bq, crossrefs, maintenance, biblio, cascade, pilotage, config\n\n**Types d'usage** (en commentaire d'en-tête de chaque .sql) :\n- `session` (15) — démarrage, contexte rapide\n- `pilotage` (14) — suivi production, décisions\n- `diagnostic` (9) — recherche de problèmes\n- `export` (2) — contexte LLM/biblio\n- `maintenance` (1) — logging\n\n**Format des fichiers** :\n\n```sql\n-- nom: <nom>\n-- categorie: <categorie>\n-- usage_type: <usage_type>\n-- parametres: <parametres ou aucun>\n-- description: <description>\n\n<sql_text>\n```\n\n**Consultation** :\n\n```bash\n# Liste les requêtes par catégorie\nls tools/sql/\n\n# Liste les requêtes d'une catégorie\nls tools/sql/thesaurus/\n\n# Voir une requête\ncat tools/sql/sante/etat_production.sql\n\n# Lancer une requête\nsqlite3 sol_vivant.db < tools/sql/sante/etat_production.sql\n```\n\n**Exécution depuis Python** :\n\n```python\nfrom pathlib import Path\nimport sqlite3\n\nsql = (Path('tools/sql/thesaurus') / 'doublons_termes.sql').read_text()\nconn = sqlite3.connect('sol_vivant.db')\nfor r in conn.execute(sql).fetchall():\n    print(r)\n```\n\n**Recherche full-text** (par grep, plus de SQL meta nécessaire) :\n\n```bash\ngrep -lR \"fiches.statut\" tools/sql/\ngrep -lR \"ORDER BY\" tools/sql/maintenance/\n```\n\n### Explorer la DB en interface web (absorbé depuis `explorer_db_interface_web_locale`)\n\n```bash\npython3 tools/admin/explorer.py [--db sol_vivant.db] [--port 8765]\n```\n\nInterface web locale (lecture seule) : tables et vues groupées par domaine, recherche, pagination, détail textes longs, modules BQ avec rendu Markdown.\n\n**Historique** :\n- avant 2026-05-06 : table `requetes_utiles` (41 rows, schéma { categorie, nom, description, sql_text, parametres, usage_type, updated_at }). Catalogue passif (aucun script Python ne le lisait).\n- **Session E 2026-05-06** : migration vers `tools/sql/<categorie>/<nom>.sql` (en-tête commenté + body SQL natif). Drop table. Coloration syntaxique IDE + diff git natif.\n", "type": "instruction", "crit": false}, {"id": 103, "titre": "Modèle conceptuel — production du corpus (référence absolue)", "contenu": "## Modèle conceptuel — production du corpus\n\n**Document de référence absolu.** Toute future session agent doit lire cette entrée en priorité avant d'agir sur les fiches, validations, prompts ou production du corpus.\n\n### Objectif final\n\nProduire les **18 documents scientifiques** du corpus *Le Sol Vivant cet Holobionte*, rédigés en passe finale par Jenni.\n\n### Étape pivot — la « clôture » des prompts\n\nPour qu'un document soit prêt pour la passe finale Jenni, **tous ses prompts doivent être clôturés**. Un prompt est clôturé quand :\n1. `contexte_sci` est rempli (ce que la science dit déjà)\n2. `instructions` sont claires (ce que Jenni doit produire)\n3. **Aucune dette de contenu ne reste** : pas de chaîne causale non validée, pas de concept à étayer, pas de lacune connue\n\n### Les outils pour amener un prompt à la clôture\n\n| Outil | Action conceptuelle | Sortie Jenni intègre… | Table source |\n|---|---|---|---|\n| **Thésaurus** | Définir un terme canonique | `prompts.instructions` (vocabulaire utilisable par Jenni) | `terms` |\n| **Concept card** ⚠ | **Filtrer la rigueur** d'une hypothèse avant intégration corpus | (gate, bloque les affirmations bancales) | `concept_cards` |\n| **Fiche** | *Zoomer* sur un point précis (proactif) | `prompts.contexte_sci` / `.enrichissement` des docs cibles | `fiches` |\n| **Validation** | *Vérifier* une affirmation, *étayer* un concept, *combler* une lacune (réactif) | `prompts.contexte_sci` / `.enrichissement` des docs cibles | `validations` |\n| **Enrichissement thésaurus** | Cas particulier : enrichir massivement le thésaurus à partir d'une liste | thésaurus | `terms` (ajouts) |\n\n**Distinction Fiche vs Validation** :\n- **Fiche** = élargir le savoir, sujet intéressant en soi (proactif)\n- **Validation** = combler une dette identifiée par audit ou par manque détecté (réactif)\n\nLes deux contribuent au **même but** : nourrir les prompts pour les amener à clôture.\n\n### Concept cards — le filtre de rigueur (règle absolue)\n\n> **Une affirmation bancale ne passe pas dans le corpus.**\n\nLe système `concept_cards` est l'**outil de filtre** qui s'intercale entre la **captation** d'une hypothèse (note volante, vulgarisation, intuition de lecture) et son **intégration** au corpus (fiche, validation, prompt). Sans ce filtre, le corpus se laisse polluer par des affirmations séduisantes mais non vérifiées.\n\n**Workflow** :\n```\nNote vulga / hypothèse / intuition\n   ↓\nCréation/affinement d'une concept_card\n   (positionnement dans une dimension conceptuelle parmi les 12)\n   ↓\nConfrontation rigoureuse :\n  - Cohérence avec les autres dimensions\n  - Compatibilité avec les concept_card_tests (validation empirique terrain)\n  - Cohérence avec le corpus existant\n   ↓\n✗ Affirmation bancale → REJET (la carte reste en archive ou est supprimée)\n✓ Affirmation solide → la carte passe en active → l'hypothèse peut alimenter\n                       une fiche, une validation, un prompt, ou un terme\n```\n\n**Plusieurs concepts du corpus actuel ont été identifiés ainsi** : note de vulgarisation captée → pépite extraite → concept_card créée → confrontation → validation → intégration.\n\n**Rôle dans le modèle** :\n- **Amont** des fiches/validations : avant de créer une fiche pour zoomer sur un point, vérifier qu'il y a au moins une concept_card cohérente qui le supporte\n- **Filtre des notes volantes** : avant d'intégrer une pépite de note (BQ `workflow_traitement_des_notes_volantes_jmj_notes_t`), tester via concept_card si l'affirmation tient la route\n- **Mémoire de rejet** : les cartes en `archive` représentent l'historique des hypothèses non passées — éviter de les ressusciter sans raison nouvelle\n\n**Tables impliquées** :\n- `concept_dimensions` (12) : axes de pensée transversaux (Cadre Eau/Redox/Économique/Évolutif, Types de sols, Histoire, Symptômes, Pratique, Cycle, Continuum)\n- `concept_cards` : les cartes proprement dites (statut `active` | `archive`)\n- `concept_card_tests` : liaisons vers `terrain_tests` pour validation empirique\n\n**Voir BQ dédiée** : `concept_cards_filtre_de_rigueur_une_affirmation_ba`.\n\n### Cycle de vie d'une validation\n\n> **Fiches** : depuis la suppression du modèle Jenni (2026-07), les fiches sont\n> produites en **MD natif** par les subagents rédacteurs (paradigme agent\n> pilote 2026-07-13, sous supervision GLM+JMJ). `fiches.statut` =\n> **`integree` | `archive`** (statut `jenni` résiduel pour les anciennes\n> fiches non migrées). ~~`graines.statut`~~ (table droppée 2026-07) — le\n> cycle Jenni `a_rediger/redigee/envoyee/recue/recreee` est obsolète. Le cycle\n> ci-dessous reste celui des **validations** (legacy docx).\n\n```\na_faire   → créée en DB avec objet + docs cibles\nen_cours  → l'agent prépare/affine le prompt Jenni\nenvoye    → fichier .txt généré et copié dans Jenni\nrecu      → .docx Jenni récupéré (stocké docx/ ou docx/)\nintegre   → contenu intégré dans prompts.contexte_sci/.enrichissement des docs cibles\n            + termes extraits vers `terms`\n            + contenu brut/intégré stocké dans fiche_retour_sections / validation_contenus\n            + cache refs via la vue v_fiche_refs (régénérée à la volée depuis source_usages)\narchive   → terminé, sort de la vue active\n```\n\n### Cycle de vie d'un prompt\n\n```\na_completer → des fiches/validations en cours pointent vers lui (objet ouvert)\ncloture     → toutes les dépendances integre, prêt pour passe finale Jenni\n```\n\n⚠ **Statut figé, pas calculé automatiquement.** `prompts.statut` n'est mis à jour par **aucune vue ni trigger** (vérifié 2026-06-14 : les vues `v_avancement`/`v_prompt_final`/`v_terms_full` lisent `documents.statut`/`terms.statut`, jamais `prompts.statut` ; zéro trigger en DB). Les 192 prompts sont à `a_completer` depuis leur création. La transition vers `cloture` est **conceptuelle** — un prompt devient « clôturable » quand toutes les fiches/validations ouvertes (`statut` ∉ {`integre`, `archive`}) qui le référencent via `docs_cibles`/`prompts_cibles` sont soldées — mais elle doit être **actée à la main** et n'est pas encore outillée (aucun prompt n'est passé `cloture` à ce jour).\n\n### Cycle de vie d'un document de strate\n\n```\na_rediger        → certains prompts en a_completer\npret_a_rediger   → tous les prompts en cloture\nen_redaction     → envoyé à Jenni passe finale\nredige           → .docx final reçu et intégré\n```\n\n### Tables et leur rôle\n\n| Table | Rôle | Statuts |\n|---|---|---|\n| `documents` (18) | Docs cibles du corpus | a_rediger / pret_a_rediger / en_redaction / redige |\n| `prompts` (~191) | Prompts par section | a_completer / cloture |\n| `terms` | Thésaurus canonique | (présent ou manquant, pas de cycle) |\n| `fiches` | **Zooms** sur un point précis (sous-types `zoom`, `technique`) | integree / archive (depuis suppression Jenni 2026-07) |\n| `validations` | **Vérifications + comblements** (modes `validation`, `renforcement`, `comblement`) | a_faire / en_cours / envoye / recu / integre / archive |\n| `chains_causales` (C1-C9) | Chaînes scientifiques du corpus | objet potentiellement référencé par une validation |\n| Rapports d'audit (`jmj/rapports/audit/*.md`) | Audits qui révèlent des lacunes | source possible de validations |\n\n### Workflow de production complet\n\n```\n1. AUDIT du corpus (analyse_corpus.py, agents)\n   ↓\n2. Identification des manques :\n   - termes manquants → enrichissement thésaurus (`export_thesaurus_incomplets.py --single-txt`)\n   - sujets transversaux non couverts → nouvelles fiches\n   - chaînes/concepts/lacunes → nouvelles validations\n   ↓\n 3. Production des prompts Jenni\n    - subagent rédacteur (Task sous supervision GLM)  → fiche_<slug>.md  (chaîne canonique MD natif ; paradigme agent pilote 2026-07-13 ; remplace prod_fiche_hybride.py + gen_fiche_docx.py supprimés)\n    - export_validation.py       → prompts_validation_*.txt\n    ↓\n4. Cycle Jenni (envoye → recu) — legacy docx validations\n   ↓\n5. Intégration l'agent :\n   - termes → terms\n   - contenu fiches → fiche_retour_sections + prompts.contexte_sci/.enr (cache refs via v_fiche_refs)\n   - contenu validations → validation_contenus + prompts.contexte_sci/.enr\n   ↓\n6. Clôture des prompts (transition `a_completer → cloture` actée à la main — pas de vue/trigger automatique ; non outillée à ce jour)\n   ↓\n7. Doc en pret_a_rediger\n   ↓\n8. Passe finale Jenni → doc rédigé\n```\n\n### Règles de séparation (pour éviter la dérive)\n\n1. **Une fiche n'est pas une validation**. Tables séparées, sémantiques distinctes.\n2. **Un prompt de strate ne contient jamais de méta-commentaire l'agent**. Tout méta va dans `notes` ou `audit_reports`, jamais dans `contexte_sci/.instructions/.enrichissement`.\n3. **Les DOIs ne sont pas stockés** comme métadonnée d'une fiche/validation. `sources` est la source bibliographique unique. Cf. BQ `workflow_traitement_des_notes_volantes_jmj_notes_t`.\n4. **Tout retour Jenni intégré** va dans le bon champ : `fiche_retour_sections` pour les fiches (avec cache refs exposé via la vue `v_fiche_refs`), `validation_contenus` pour les validations, et `prompts.contexte_sci/.enrichissement` pour les docs cibles. **Jamais** dans le champ `instructions` qui sert à la prochaine demande Jenni.\n5. **Les statuts sont la vérité** : on ne marque pas `exporte` ou `produit` sans cycle de vie cohérent. Le statut reflète l'état réel à tout moment.\n6. **Charte de rédaction transversale** (`check_forbidden_jenni.py` + `.opencode/RULES.md` + BQ `listes_de_termes_triees_alphabetiquement_regle_abs` — ex-#146 archivé 2026-07) s'applique à TOUT prompt destiné à un LLM externe : pas de codes docs, pas de méta-vocabulaire, citations format `[N]`, blocs de 10 max pour l'enrichissement.\n7. **Charte fiches techniques** s'applique en plus aux fiches `type='technique'` : structure standardisée 8 sous-blocs (Contexte sci / Protocole / Ingrédients / Équipement / Procédure / Indicateurs qualité / Précautions & Stockage / Applications & Dosages).\n\n### État cible (idéal)\n\n- 100% des `terms` définis\n- 100% des `fiches` valides en `integre` ou `archive`\n- 100% des `validations` valides en `integre` ou `archive`\n- 100% des `prompts` en `cloture`\n- 100% des `documents` en `pret_a_rediger` puis `redige`\n\n### ⚠ Etat actuel (avril 2026)\n\n`validation_sections` et `validation_contenus` existent en DB avec des donnees historiques (86 et 17 rows respectivement) mais **aucun script actif ne les alimente**. La logique des validations est en pause (cf. BQ `validations_workflow_et_structure_table_dediee`). Les BQ qui decrivent leur workflow sont conservees comme reference, mais la logique des validations est en pause (cf. BQ `validations_workflow_et_structure_table_dediee`) : `import_validation.py` a été supprimé, `export_validation.py` existe mais n'alimente plus les tables.\n\n## Contexte\n\ndocument de référence absolu\n", "type": "reference", "crit": true}, {"id": 72, "titre": "Structure dépôt et conventions de nommage", "contenu": "**Arborescence du dépôt :**\n```\nTools/                          ← racine git\n├── sol_vivant.db               ← source de vérité données (corpus, audit_log, config, refs)\n├── AGENTS.md                   ← guide projet (maintenu à la main, snapshot de la doctrine BQ)\n├── tools/                      ← scripts Python (+ tools/bq/ = BQ filesystem)\n├── recherches/                 ← cycle Jenni actif (fiches, thesaurus, sources, veille)\n├── Publications/\n│   ├── img/                    ← images (OG, favicons, logos)\n│   ├── web/                    ← pages HTML publiques (noms fixes)\n│   ├── workflows/              ← workflows horodatés\n│   ├── jenni_ebauches/         ← ébauches Jenni publiées\n│   ├── svg/                    ← illustrations vectorielles\n│   ├── prompts/                ← exports Jenni horodatés (créé à la demande, via pub_output)\n│   └── sol-vivant-web.zip      ← archive autonome (gen_archive.py)\n└── jmj/                        ← documents de travail auteur + rapports/archives\n```\n\n**Conventions de nommage :**\n- Pages web : noms fixes (index.html, mo_calculateur.html, triangle_textures.html) — trackées par git, versionnées\n- Images OG : dans Publications/img/ (miroir du dépôt GitHub Pages)\n- URL OG : `https://sol-vivant.github.io/Publications/img/<nom>.png`\n- Favicon : `href=\"../img/<nom>.png\"` (chemin relatif depuis web/)\n- Scripts : `--db` optionnel (défaut `sol_vivant.db` à la racine)\n- Pas d'horodatage sur les HTML web (une seule version, git fait le versioning)\n\n### Workflow dev : design avant code (absorbé depuis `workflow_design_avant_code_commits_frequents`)\n\n1. **Comprendre** → 2. **Concevoir** (sur papier) → 3. **Implémenter** (DB → script → template) → 4. **Tester** → 5. **Commit** (un par étape logique)\n- Commiter tous les 2-3 items (checkpoint). Un fichier cassé par Edit partiel se restaure avec `git checkout -- fichier` si le commit précédent est propre.\n- Anti-pattern : coder immédiatement → corrections multiples → doublons → bugs d'encoding.\n\n## Voir aussi\n\n- `paths_structure` — structure complète des paths et arborescence projet (cette BQ couvre les conventions de nommage)\n", "type": "reference", "crit": false}, {"id": "pas_agent_redacteur", "titre": "Agents — read-only par défaut, rédaction sur instruction", "contenu": "## Agents — read-only par défaut, rédaction sur instruction\n\n### Paradigme d'orchestration\n\nLe système repose sur **trois piliers** :\n\n1. **L'orchestrateur** (agent primaire, configuré via la table `config`)\n   décide comment traiter chaque chantier, mobilise les ressources adaptées,\n   et arbitre la qualité via la doctrine.\n2. **La base SQLite** `sol_vivant.db` est le **centre de vérité unique**.\n   Tout contenu y vit ; les insertions passent par le Conseil d'audit\n   (cf. BQ `conseil_modele`).\n3. **La doctrine** (BQ actives + RULES.md + AGENTS.md) est un **guide souple**,\n   à maintenir propre. Les sessions sont **libres au démarrage**,\n   contextuelles au chantier — un chantier peut engendrer des processus\n   multi-strates (recherche, audit, rédaction, révision, renforcement,\n   peer-review…).\n\n**Ressources mobilisables** par l'orchestrateur selon le besoin :\n- **Bibliothèque d'agents spécialisés** (cf. BQ `wf_agents_library`)\n- **API de veille** (cf. BQ `api_externes`)\n- **Scripts** : intégration, audit, régénération, veille\n\n**Aucun dogme de workflow** : pas de procédure figée. L'orchestrateur choisit\nla composition pertinente (directe / subagent / mixte) selon le chantier.\nLa doctrine garantit la qualité (Conseil d'audit, anti-patterns, règles de\nrédaction), pas la procédure.\n\n### Permission par défaut\n\nLes subagents sont **read-only sur la DB par défaut** (`edit: deny`, `bash`\nrestreint à `sqlite3` + scripts whitelistés). Toute écriture — particulièrement\nla **rédaction éditoriale** (définitions, synonymes, contenus de fiches,\ndescriptions concept_cards, contenus BQ, doctrine) — ne se fait que sur\n**instruction explicite** de JMJ ou de l'orchestrateur.\n\n### Routing (à titre indicatif)\n\n- **Orchestrateur** : orchestration, doctrine technique, intégration consciente,\n  choix de composition du pipeline par chantier. Rédige la doctrine technique\n  et structurelle. Peut rédiger directement du contenu éditorial scientifique\n  sur instruction JMJ.\n- **Subagents** : mobilisés selon le chantier — classification, extraction,\n  audit, parsing/formatage, tissage, vérification, délibération Conseil, et\n  **rédaction éditoriale possible sur instruction** (manifeste MD → review JMJ\n  → INSERT via scripts canoniques).\n- **JMJ** : arbitre les priorités et arbitrages éditoriaux ; tranche en dernier\n  ressort. Review manifestes produits par subagents avant INSERT DB.\n\n### Anti-pattern « batch automatisé pour la rédaction »\n\nLe batch automatisé massif pour la rédaction éditoriale (refonte de fiches,\nextraction-condensation en lot) **ne donne pas la qualité requise** — que\nl'exécutant soit un agent ou un script. Causes structurelles : hétérogénéité\ndu contenu source, pas de jugement éditorial scriptable, méta-vocab résiduel\nà nettoyer, articulations transverses contextuelles.\n\n**Règle** : réserver le batch automatisé aux opérations déterministes\n(parsing structuré, dédup, normalisation FK, audit régex). La rédaction\néditoriale se fait **fiche par fiche avec supervision**, en composant\nlibrement le pipeline selon le chantier.\n\n### Références\n\n- BQ `wf_agents_library` — bibliothèque d'agents + routing paramétrique\n- BQ `api_externes` — API de veille (Semantic Scholar, Crossref, BnF, OpenLibrary, Zotero)\n- BQ `conseil_modele` — dispositif Conseil (obligatoire avant INSERT éditorial)\n- Table `config` — paramétrage modèles et
