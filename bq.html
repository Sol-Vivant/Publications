<script id="bq-data" type="application/json">{"technique": {"analyse": {"nom": "Analyse corpus", "entries": [{"id": 102, "titre": "Workflow — traitement des notes volantes (jmj/notes*.txt)", "contenu": "## Workflow — traitement des notes volantes\n\n**Fichiers concernés** : `jmj/notes*.txt`, `jmj/transcriptions/*.txt` et tout matériel brut que JMJ capture \"au pied levé\" (posts LinkedIn, abstracts, fragments de lecture).\n\n### Contexte\n\nLes notes volantes sont des captures rapides d'informations scientifiques croisées au gré des recherches de JMJ. **Elles ne sont pas sourcées de manière académique** — l'objectif de JMJ est la collecte rapide d'informations, pas leur traçabilité bibliographique. Les sources académiques viendront plus tard, **apportées par Jenni** lors de la rédaction des fiches/documents.\n\n### Règle sur les DOIs dans les notes\n\nLes DOIs qui apparaissent parfois dans les notes sont **accessoires et optionnels** :\n\n- ✅ **Utilisables** comme porte d'entrée pour une recherche web de clarification conceptuelle si l'agent en a besoin pour comprendre un mécanisme cité\n- ❌ **Ne pas stocker systématiquement** dans une colonne dédiée des fiches ou ailleurs\n- ❌ **Ne pas chercher à extraire tous les DOIs** d'une note pour les tracer\n- ✅ **Bibliographie de référence = `sources`**, alimentée via le pipeline Jenni → analyse .docx → attribution\n\n### Pipeline d'intégration\n\n**Étape 1 — Analyse**\nL'agent lit la note, identifie les concepts scientifiques, mécanismes, taxa, molécules.\n\n**Étape 2 — Tri**\nClasser chaque note (ou segment) en :\n- 🟢 **Retenue** : apporte un mécanisme, un taxon, un concept, une hypothèse ou une donnée pertinente\n- 🟡 **Enrichissement** : complète une fiche/section existante plutôt qu'une nouveauté\n- 🔴 **Écartée** : doublon, fragment trop court sans contexte, ou vraiment sans aucun apport (rare)\n\n⚠ **Règle des pépites — ne pas confondre niveau de vulgarisation et absence d'intérêt**\n\nJMJ prend volontairement des notes de **vulgarisation** parce qu'il y a parfois des **pépites dans des hypothèses** apparemment basiques. Plusieurs concepts du corpus actuel ont été identifiés ainsi (zoom apparemment trivial qui masque une hypothèse féconde).\n\n**Le critère d'écartement n'est PAS** :\n- ❌ « niveau cours de lycée »\n- ❌ « vulgarisation grand public »\n- ❌ « pas de DOI »\n- ❌ « format LinkedIn »\n\n**Le bon critère d'écartement est** :\n- ✅ Aucune hypothèse, aucun mécanisme, aucune connexion conceptuelle, aucune donnée chiffrée nouvelle\n- ✅ Strict recopiage d'une définition académique standard sans angle particulier\n- ✅ Doublon littéral d'une note précédente\n\n**Avant d'écarter une note dite \"vulgarisation\", chercher activement** :\n- Une hypothèse formulée même implicitement\n- Un mécanisme expliqué d'un angle inhabituel\n- Une donnée chiffrée inattendue\n- Une connexion entre deux domaines (ex: gut-brain × sol)\n- Un terme/concept émergent absent du thésaurus\n\nSi **rien** de tout cela → écarter. Sinon → la note mérite d'être lue avec soin et probablement intégrée comme zoom ou enrichissement.\n\n**Étape 3 — Regroupement (clustering)**\nRapprocher les notes qui traitent d'un même thème cohérent. Une note peut nourrir plusieurs clusters si elle contient plusieurs mécanismes distincts.\n\n**Étape 4 — Synthèse**\nPour chaque cluster retenu, décider :\n- **Nouvelle fiche** si le sujet n'est pas couvert par une fiche existante\n- **Enrichissement d'une fiche existante** si scope aligné\n- **Enrichissement de `prompts.enrichissement`** d'une section si le contenu relève d'un seul document de strate\n\n**Étape 5 — Proposition utilisateur**\nPrésenter à JMJ le clustering + la proposition d'action avant toute écriture DB. JMJ valide/ajuste. Pas d'écriture sans validation.\n\n**Étape 6 — Écriture DB**\nAprès validation :\n- Créer/enrichir les fiches dans `fiches` + `fiche_retour_sections`\n- Extraire les termes candidats → lot enrichissement thésaurus (`export_thesaurus_incomplets.py --single-txt`, subagent rédacteur sous instruction)\n- Éventuellement UPDATE `prompts.enrichissement` pour les sections ciblées\n\n### Ce qu'on NE fait PAS\n\n- ❌ Pas d'extraction automatique de DOIs depuis les notes (intégration consciente dans `sources` uniquement)\n- ❌ Pas d'écriture directe en DB avant validation JMJ sur le plan\n- ❌ Pas de création d'entrées terms avec définitions forgées depuis les notes — les définitions viennent de Jenni\n- ❌ Pas d'intégration de notes \"trop basiques\" (niveau cours de lycée) au corpus scientifique, même si les termes sont canoniques\n\n### Où archiver les notes déjà traitées\n\nAprès intégration complète et validation, déplacer la note vers `jmj/archives/notes_traitees/` avec un préfixe date et référence aux fiches créées, afin de tracer l'origine sans polluer le répertoire `jmj/` actif.\n\n## Contexte\n\ntraitement notes volantes JMJ\n", "type": "regle", "crit": false}, {"id": 132, "titre": "Stratégie agents Task — quand, comment, résilience", "contenu": "## Stratégie — quand et comment utiliser des agents Task\n\nTrois patterns d'usage des **agents** dans le corpus Sol Vivant. Chaque pattern\na son domaine, ses pièges, ses règles de résilience.\n\n### 1. Pattern `agent_runner` — prepare → batches → Task → consolidate\n\n**Quand :** tâche LLM répétitive sur N items indépendants (attribution sources\nsur 100 refs, analyse_fiches sur 50 fiches, validation RIS sur 200 entrées).\nGain : parallélisation massive + reprise sur échec partiel (batches isolés).\n\n**Comment :** utiliser `tools/lib/agent_runner.py`\n- Phase 1 : script `--prepare` écrit les batches JSON dans\n  `audit_runs/<script>/batches/` (**WORK_DIR persistant obligatoire**,\n  jamais `tmp/<script>/` — purgé entre sessions par `session_start.py`)\n- Phase 2 : **l'agent Code lance les agents Task** lisant les batches, écrivant\n  dans `audit_runs/<script>/responses/`\n- Phase 3 : script `--consolidate` recharge les responses et produit l'artefact\n\n**Exemples existants :** `analyse_corpus.py`, `analyse_fiches.py`,\n`audit_focus.py` (tous via `lib/agent_runner.py`).\n\n**Pièges :**\n- L'agent s'exécute dans la session courante via opencode + GLM 5.2 (zai-coding-plan/glm-5.2). Ne pas appeler d'API externe Anthropic — l'unique modèle est GLM 5.2.\n- Batches trop gros → timeout. Viser < 60 s d'exécution agent par batch.\n- State.json partagé — ne pas re-préparer sans purger (cf. docstring).\n- **Plafond `max_concurrent ≤ 5`** — au-delà, le rate-limit API du modèle frappe.\n  Valeur centralisée dans `config` (catégorie `agent_runner`, clé\n  `max_concurrent`, défaut 5). Pas de valeur en dur dans les scripts.\n- **WORK_DIR permanent obligatoire** — `audit_runs/<script>/` (versionné\n  hors git via `.gitignore` ciblé). Toute écriture dans `tmp/` est\n  volatilisée entre sessions et oblige à relancer un run de plusieurs\n  heures.\n- Avant tout lancement : **13 garde-fous** (6 pré-vol + 3 en vol + 4\n  post-vol) — cf. BQ `agent_runner_garde_fous`. Implémentés dans\n  `tools/lib/agent_guards.py` et câblés via `assert_pre_flight` dans\n   `analyse_fiches`, `analyse_corpus`, `audit_focus`.\n\n### 2. Pattern agents Task in-session (exploration/extraction)\n\n**Quand :** recherche ouverte dans le code (`Explore`), extraction structurée\nd'un long document, résumé d'un corpus — tâches où je n'ai pas besoin du\nrésultat immédiat en contexte ou quand ça va saturer mon contexte.\n\n**Comment :** `Agent(subagent_type='Explore'|'general-purpose', prompt=...,\nrun_in_background=True)` si je peux continuer d'autres tâches pendant.\n\n**Pièges observés 2026-04-18 :**\n- **Timeout stream idle** après ~130 s. Un agent qui démarre gros plante\n  avant d'écrire son résultat. Leçon : **écriture progressive obligatoire**\n  dans le prompt (« écris tes trouvailles au fil de l'extraction dans\n  /tmp/<file>, ne pas attendre la fin »).\n- **Pas de reprise automatique.** Si l'agent plante, tout son travail est\n  perdu sauf si le prompt l'a forcé à écrire en streaming.\n- **Limite de taille des prompts.** Plus de 1000 lignes d'instructions →\n  l'agent rate la consigne. Viser < 500 lignes.\n\n**Recette anti-timeout :**\n```\n- Briefer l'agent avec un plan en N étapes (N ≤ 6)\n- Exiger une écriture partielle (append) à la fin de CHAQUE étape\n- Demander un résumé final ≤ 300 mots (pas de restitution complète)\n- run_in_background=True quand les tâches ne sont pas bloquantes\n```\n\n### 3. Pattern lecture directe (tool use inline)\n\n**Quand :** analyse qui nécessite d'intégrer le contenu dans mon contexte\npour rédaction, synthèse, articulation avec le reste du corpus. Un agent\nTask me ferait perdre cette capacité (son résultat ne serait qu'un résumé).\n\n**Exemples :** lire un chapitre PDF, rédiger une fiche transversale à partir\nde plusieurs sources, croiser des BQ pour produire un plan.\n\n**Règle :** si je dois produire ensuite un artefact cohérent qui croise ce\nque je lis avec d'autres informations → lecture directe + Write pour\nsauvegarder au fur et à mesure (pour récupération si la session plante).\n\n### Arbitrage — quel pattern ?\n\n| Situation | Pattern |\n|---|---|\n| 50 items LLM indépendants — **transformation mécanique** (attribution sources, parsing, dédup, normalisation FK, regex) | 1 — agent_runner |\n| 50 items — **audit/jugement ouvert** (cohérence, gaps, conseil) | **2 — agent DB-direct** (PAS batch, cf. §Batch vs agent) |\n| Extraction structurée d'un long doc (>50 p), résultat en artefact | 2 — Task in-session (avec writes progressifs) |\n| Exploration ouverte du code, recherche ouverte | 2 — Task Explore |\n| Rédaction qui nécessite intégration contextuelle | 3 — lecture directe |\n| Tâche parallélisable où je peux faire autre chose | 2 — Task en background |\n| Artefact unique long (fiche, synthèse) | 3 — lecture + Write progressif |\n\n### Batch vs agent DB-direct — la distinction canonique\n\n**Règle (`batch_mecanique_agent_jugement`, RULES.md)** : le choix batch vs agent\nDB-direct n'est pas une question de volume, c'est une question de **nature de la\ntâche**.\n\n| Critère | Batch (`agent_runner.py`) | Agent DB-direct |\n|---|---|---|\n| **Nature** | Transformation mécanique | Jugement / exploration |\n| **Question posée** | « combien ? transformer » | « pourquoi ? cohérent ? manquant ? » |\n| **Vue** | Item isolé, sans contexte global | Corpus dans son ensemble (multi-SELECT, croisement) |\n| **Exemples** | Attribution sources sur 100 refs, parsing docx, dédup `norm()`, normalisation FK, audit régex, application de règles déterministes | Audit cohérence narrative, détection de gaps, conseil éditorial, audit factuel, arbitrage de tensions, tissage cross-références |\n| **Ce qu'il rate** | — | Recoupements transverses, tensions entre fiches/cards/chaînes, doublons sémantiques, contradictions |\n\n**Pourquoi le batch échoue sur l'audit ouvert** : chaque item est traité dans un\ncontexte frais et isolé. L'agent batch ne « voit » pas que la fiche #45 contredit\nla card #12, ni que le terme ajouté sur la fiche #67 est un doublon latent du\nterme #234. Ces recoupements exigent un agent qui a accès à l'ensemble du corpus\net peut croiser. Le batch est merveilleux pour appliquer une règle déterministe\nsur N items ; il est structurellement aveugle aux tensions transverses.\n\n**Le corpus est le centre de vérité** (`corpus_centre_verite`, RULES.md) : le\njugement s'exerce contre le contenu réel du corpus (`SELECT`), pas contre des\nreprésentations ou mémoires. L'agent DB-direct est l'outil canonique du jugement\nparce qu'il lit le corpus ; le batch ne lit que des items préparés.\n\n### Principes transverses\n\n1. **Sauvegarder tôt, sauvegarder souvent.** Tout travail long doit laisser\n   une trace persistante (fichier `/tmp/<work>.md`, ou commit git) au plus\n   tard à mi-parcours. Le timeout API du modèle peut survenir à tout moment.\n\n2. **Ne pas déléguer la compréhension.** Un agent Task ne doit pas recevoir\n   de prompt du type « analyse X puis fais Y » — je dois faire la synthèse\n   moi-même. L'agent extrait, classe, compte. Moi je conclus.\n\n3. **Pas de chaîne d'agents profonde.** Un agent ne devrait pas lancer un\n   autre agent (risque de timeout cascade). Je suis le chef d'orchestre.\n\n4. **Contexte vs parallélisme.** Chaque agent Task a un contexte frais —\n   brief complet dans le prompt, pas de référence à « ce qu'on a dit tout à\n   l'heure ». C'est une feature, pas un bug.\n\n5. **Post-mortem après crash.** Quand un agent plante (timeout, erreur) :\n   - Vérifier ce qui a été écrit sur /tmp/\n   - Raccourcir le périmètre si nécessaire\n   - Relancer avec writes plus fréquents\n\n### Anti-pattern : agents un-a-un au lieu d'agent_runner (incident 2026-04-20)\n\nSession 2026-04-20 : lancement de 27 agents Task individuels pour analyse\nde fiches, au lieu d utiliser `tools/lib/agent_runner.py`. Consequences :\n\n- 27 messages separes, chaque agent pollue le contexte avec son prompt\n  (resume puis resultat) alors que le pattern agent_runner garde les\n  responses hors contexte (`responses/<cid>.json`).\n- Pas de reprise possible si un agent plante a mi-parcours.\n- Parallelisation artisanale (4 a la fois) au lieu de parallele massif\n  dans un seul message.\n- Trois formats de JSON differents produits par les agents (strict, wrap\n  `{sections: ...}`, liste), forcant un normalisateur cote consolidation\n  qui aurait ete evite par un prompt centralise.\n\nCorrection : creation de `tools/admin/analyse_fiches.py` (prepare +\nconsolidate) pour basculer les fiches restantes sur le bon pattern.\n\n**Declencheur mental** : des que j'identifie une tache avec > 5 items LLM\nindependants, avant de lancer le premier agent, penser 'agent_runner'.\nCf. agent_runner_reflexe (affichee a chaque session_start).\n", "type": "doctrine", "crit": false}, {"id": 140, "titre": "Workflows d analyse — pattern unifie agent_runner", "contenu": "## Workflows d'analyse — pattern unifie agent_runner\n\nToute tache d'analyse repetitive sur N items (fiches, sources, sections,\ndocs, termes) suit le **meme pattern en 3 phases**. Centralisation de\ntoutes les recettes et composants reutilisables.\n\n### Principe\n\n```\n[donnees DB] -> --prepare -> batches/<cid>.json\n               |                  |\n               |          agents Task paralleles (l'agent Code, un seul message)\n               |                  |\n               |                  v\n               |           responses/<cid>.json\n               |                  |\n               -> --consolidate -> [DB enrichie / artefact final]\n```\n\n**Ne JAMAIS** lancer les agents un par un via plusieurs messages successifs\n(cf. anti-pattern BQ `strategie_agents` section finale).\n\n### Scripts partages\n\n| Module | Role |\n|--------|------|\n| `tools/lib/agent_runner.py` | `prepare_batches()` + `load_responses()` |\n| `tools/lib/repair_json.py` | Robustesse parsing JSON d'agents |\n\n### Exemples en production\n\n| Script | Domaine | Format entree | Format sortie |\n|--------|---------|---------------|---------------|\n| `tools/batch/analyse_corpus.py` | Audit modulaire corpus (T1-T2, S1-S2, C1-C2, K1-K2, B1) | 1 batch par passe | JSON rapport par passe |\n| `tools/admin/analyse_fiches.py` | Extraction consciente fiches (formules, chiffres, cards, termes candidats) | 1 batch par fiche | JSON par section `{<ordre>: {chiffres_cles, formules, termes_candidats, cards_liees, fiches_liees}}` |\n| `tools/admin/audit_focus.py` | Orchestrateur multi-cible (`--target chaines/cards/fiches/thesaurus`) — entrypoint `--prepare`/`--consolidate` pour audits focalisés | 1 batch par cible | JSON par item |\n\n### Recette prompt type pour extraction\n\nLe prompt d'un agent d'analyse DOIT contenir :\n\n1. **Cible explicite** (fiche_id, source_id, ou autre)\n2. **Doctrine rappelee** : \"extraction uniquement, zero redaction\"\n   (reference AGENTS.md / BQ `pas_agent_redacteur`)\n3. **Format de sortie strict** (JSON avec schema documente) — toujours le\n   MEME format pour que `--consolidate` puisse parser sans normaliseur.\n4. **Commandes SQL pretes a copier-coller** pour l'exploration\n5. **Un modele reference en DB** (\"la fiche #23 a son analyse_agent, consulte-la\")\n6. **Regles concretes** : motifs concrets pas generiques, verifier absence\n   thesaurus avant proposer candidat, etc.\n7. **Output attendu exact** : chemin fichier + resume max 5 lignes\n\n### Anti-patterns frequents\n\n- **Wrapper JSON** : l'agent produit `{\"fiche_id\": X, \"sections\": [...]}`\n  au lieu du schema strict `{\"<ordre>\": {...}}`. Prevention : exemple\n  literal dans le prompt + instruction \"PAS DE WRAPPER\".\n- **Liste au lieu de dict** : l'agent produit `[{ordre:0,...}, ...]`.\n  Prevention : instruction \"cles = ordre (str)\".\n- **Redaction subreptice** : motifs des cards_liees deviennent des resumes\n  rediges. Prevention : \"motif = ce que la section APPORTE, verbe au\n  present indicatif, ≤ 15 mots\".\n- **Cards 'archive' melangees avec 'active'** : rappeler `status='active' UNIQUEMENT`.\n\n### Declencheurs mentaux (pour moi, l'agent)\n\n- \"J'ai N fiches / sources / termes a traiter\" avec N > 5\n  → reflexe agent_runner\n- \"Je vais lancer un Agent() pour chaque item\"\n  → STOP, utilise agent_runner (prepare + parallel + consolidate)\n- \"Chaque agent doit retourner du JSON structure\"\n  → agent_runner garde responses hors du contexte principal\n\n### Stockage des resultats d'analyse\n\n| Artefact | Destination |\n|----------|-------------|\n| Extraction par fiche/section | `fiche_retour_sections.analyse_agent` (JSON) |\n| Extraction par source | `source_usages.contexte` ou `source_usages.citation_brute` |\n| Rapports d'audit corpus | `jmj/rapports/audit_data/<theme>_<date>.md` |\n| Rapport de session | `jmj/rapports/session/rapport_YYYY-MM-DD.md` |\n\n### Voir aussi\n\n- BQ `strategie_agents` \"Strategie agents Task — quand/comment/resilience\" (doctrine generale)\n- BQ `pas_agent_redacteur` \"Agents read-only par defaut, redaction sur demande explicite\" (doctrine routing)\n- `agent_runner_reflexe` (affichee a chaque session_start)\n\n### Recette anti-timeout `analyse_corpus.py` (session 2026-04-21)\n\nConstat : run complet (9 passes) sur le corpus entier avec `max_ctx_analyse_corpus=55000` :\n\n| Passe | Contexte brut | Contexte livré agent | Résultat |\n|---|---|---|---|\n| T1 | thes + secs = 532 k chars | 110 k (truncate) | **stream idle timeout** × 2, même avec progressive writes |\n| K1 | cascade + secs | 88 k | OK mais 22 min |\n| S1 / C1 | secs / chains | 56-74 k | **timeout** 1er tour, OK après relance progressive |\n| T2, S2, C2, K2, B1 | variable | 55-110 k | OK 1er tour mais **corpus amputé** |\n\n**Cause racine** : `truncate(text, max_chars=55000)` coupe au milieu du payload. Avec `max_ctx_analyse_corpus=55000` :\n- Thésaurus complet = ~450 k chars (def + syn + BT/RT) → agents voient **12 %**\n- Sections complètes (18 docs) = 81 k chars → agents voient 12 docs sur 18 (6 docs absents : P3 P4 P5 S0 S1 S2)\n\n**Patch appliqué** (T1 uniquement, session 2026-04-21) :\n\n1. **Index thésaurus condensé** : au lieu de passer le thésaurus complet avec définitions/BT/RT, construire un index `id + [strate] + fr / syn_en` (70 k chars pour 1071 termes). Suffit pour vérifier présence/absence d'un terme.\n2. **Sections complètes** : appeler `extract_sections(con)` en direct pour avoir les 18 docs entiers (81 k chars).\n3. **Split par groupes de docs** : T1 éclaté en T1a (F+H, 5 docs, 90 k) / T1b (P, 5 docs, 92 k) / T1c (S, 5 docs, 98 k) / T1d (V, 3 docs, 85 k). Chaque sous-batch sous la limite de timeout (≈ 5-7 min agent).\n4. **Fusion responses T1a-d → T1_completude.json** avant `--consolidate`.\n\n**Généralisation recommandée** (non encore appliquée au script, à faire) :\n- Passer `max_ctx_analyse_corpus` à 90 000 pour éviter la troncature des sections (81 k suffisent).\n- Pour T1/T2/B1 qui consomment le thésaurus : basculer sur un mode `index` (id+fr+syn_en) avec définitions disponibles via un second helper si l'agent veut creuser. Économise 90 % du contexte thésaurus sans perte de capacité de détection.\n- Pour T1 : ajouter un flag `--split-by-strate` qui produit 4 batches au lieu d'1 (F+H / P / S / V). Sortie : 4 responses à fusionner dans le consolidate.\n- Pour S1 / S2 / K1 qui utilisent beaucoup les sections : même pattern de split par strate en cas de timeout (pas obligatoire, selon volume DB).\n\n**Écriture progressive pour ces passes** : dans le prompt agent, exiger `Écrire tmp/analyse_corpus/responses/<cid>.json après chaque doc traité` avec JSON partiel cumulatif. Garantit un résultat partiel même si timeout à mi-parcours. Pattern appliqué avec succès sur C1 (2 min → 9 min 17 min) et T1a-d.\n\n**Règle** : dès qu'un batch dépasse 80 k chars utiles **ET** fait de l'analyse cross-section (pas juste extraction d'un item), prévoir le split ou l'écriture progressive. 80 k chars utiles ≈ limite où un agent tient en 5-10 min.\n", "type": "workflow", "crit": false}, {"id": "wf_solde_audit", "titre": "Solder un audit corpus — traitement conscient des actions priorisées", "contenu": "## Solder un audit corpus — en conscience, pas un `--apply` mécanique\n\n> **Quand consulter** : après un audit (`audit_conscient` / `audit_corpus`) qui\n> produit un rapport d'**actions priorisées** (« top 12 »…). Ce workflow régit\n> leur **traitement**, pas leur production.\n\n> **Principe cardinal** (parallèle de `wf_fiche_integration` : « l'intégration\n> n'est pas un `--apply` ») : **solder un audit est un travail EN CONSCIENCE,\n> jamais un automatisme.** Chaque action est ré-examinée en DB, tranchée par le\n> contenu, réversible et documentée. Le rapport d'audit est une **hypothèse de\n> travail**, pas un ordre d'exécution — il se trompe (cf. étape 2).\n\n### Étape 0 — Re-vérifier l'état réel (le rapport peut être périmé)\n\nAvant toute action, **requêter la DB** : certaines actions sont **déjà faites**\n(sessions précédentes), d'autres ont changé. Ne jamais agir sur la seule foi du\nrapport. Documenter « #X déjà fait (vérifié) » est un résultat valide.\n\n### Étape 1 — Trier les actions par NATURE (détermine QUI tranche)\n\n| nature | qui tranche | exemples |\n|---|---|---|\n| **Technique / structurelle** | l'agent, par le contenu | re-tags `strate_etape`, ré-affectation `doc_code`, fusion de doublons **nets**, liens cascade (`cascade_prerequis.card_ids` + `cascade_level_links` cohérents), nettoyage intégrité (self-loops) |\n| **Éditoriale scientifique** | JMJ + l'agent **en direct** (`pas_agent_redacteur`) | création de chaîne / card, harmonisation d'une contradiction, réorganisation de prose. Toujours **propose → JMJ valide → applique** |\n| **Éditoriale thésaurus** | **cycle Jenni** uniquement | reformuler `syn_fr`, désambiguïser un `fr`, compléter des termes → liste `recherches/thesaurus/` ; **jamais** d'écriture directe (gardes `def-jenni-ok`) |\n\n### Étape 2 — LEÇON CLEF : vérifier AVANT de fusionner\n\n**Un rapport d'audit surestime systématiquement les doublons.** Avant toute\nfusion (termes *ou* cards), **examiner le contenu de chaque paire**\n(`audit_cards_first`) pour distinguer vrai doublon et **faux positif** :\nconcepts distincts, **homonymes**, **hub de navigation** vs contenu, **parcours**\nvs **cadre théorique**.\n\n- *Session 2026-06-06* : action 11 (termes) → **3 faux positifs sur 7**\n  (k2 minéralisation-humus vs k2 cinétique-enzymatique = homonymes ; battance\n  *processus* vs croûte *résultat* ; bien-être animal vs bientraitance).\n  Action 12b (cards) → **3/3 faux positifs** (#31 *hub* vs #52 *contenu* ; #152\n  *origine du consortium* vs #153 *KNF/JADAM* ; #54 *parcours du C* vs #98\n  *paradigme SCM*).\n- → **Ne jamais exécuter une fusion qui appauvrirait le corpus.** Le bon service\n  de l'audit est, souvent, de **ne pas fusionner** et de le justifier.\n\n### Étape 3 — Les garde-fous priment, même quand JMJ délègue\n\n« Règle les arbitrages » / « tu tranches » ne lève **aucun** garde-fou :\n\n- champ éditorial thésaurus (`definition`/`syn_*`/`fr`/`en`) → **Jenni**\n  (`guard-term-definitions`), jamais en dur ; le `fr` canonique ne bouge pas (#138) ;\n- `DELETE` / `MERGE` / opération structurelle → sentinel `# bq-ok` **après** BQ\n  consultée (`guard-bq-search`) ; les `UPDATE` purement structurels (`doc_code`,\n  `strate`, `statut`) passent sans sentinel ;\n- une **chaîne causale affirme** un mécanisme : ne pas en créer une sur un\n  mécanisme **contesté** → préférer une **card de controverse** ; en cas de doute\n  scientifique, recourir à l'**arbitrage Jenni** (ci-dessous).\n\n### Recours — arbitrage Jenni « en ligne » (trancher une controverse scientifique)\n\nQuand une action bute sur une **question scientifique contestée** (mécanisme\ndébattu, valeurs divergentes entre sources) qu'on ne peut trancher **ni par le\ncontenu du corpus ni par jugement** : demander un **arbitrage à Jenni**, sans\nattendre un cycle docx complet.\n\n- **Format « en ligne »** : l'agent rédige un **prompt d'arbitrage autonome**\n  (directement dans le chat, **hors workflow docx**) ; JMJ le colle à Jenni et\n  ramène la réponse aussitôt après — boucle courte, pas de fichier intermédiaire.\n- **Pure question scientifique** : **aucun méta-vocab corpus** (pas de codes docs,\n  `chaîne`, `card`, `corpus`, `strate`) — le prompt tient debout seul, comme un\n  docx Jenni (`bq_clean_discipline`).\n- **Demander** : un **verdict tranché**, la distinction *démontré / plausible /\n  surinterprété*, les **biais méthodologiques** relevés, et des **sources évaluées\n  par les pairs** (DOIs, priorité récente) ; exiger une **réponse synthétique**,\n  pas une dissertation (Jenni enrichit ×5-10 par défaut).\n- **Au retour** : analyser, puis **décider** — chaîne **nuancée**, **card de\n  controverse**, ou **abandon** ; reprendre telle quelle la **formulation prudente**\n  proposée par Jenni, et router les **sources clés** vers la biblio (volet B1).\n- *Ex. 2026-06-06* : CMN « réseau d'alerte » inter-plantes → verdict Jenni\n  « **plausible mais non démontré** » (Karst 2023, Robinson 2023) → enrichissement\n  de la card #132 + formulation prudente, **aucune chaîne créée**. L'arbitrage a\n  ainsi **confirmé** la position du corpus tout en l'étayant.\n\n### Volet thésaurus — termes manquants / problématiques : rassembler pour Jenni, jamais créer en dur\n\nUn audit signale des termes à traiter : **manquants** (lacunes mobilisées par le\ncorpus), **problématiques** (`statut a_revoir`, `approx`, `syn_fr` ambigu),\n**incomplets** (def < 50 c / sans EN / sans `inrae`), **homonymes**, **doublons**.\n\n> **Règle absolue** : l'agent ne **crée** ni ne **complète** un terme en dur — tout\n> passe par le **cycle Jenni** (`guard-term-definitions` / `def-jenni-ok`, #138).\n> Le solde produit une **liste à définir**, pas des `INSERT terms`.\n\nRecette (session 2026-06-06) :\n\n1. **Base auto** — `export_thesaurus_incomplets.py --single-txt` → maintient la\n   liste plate §0 (critère def<50c / sans EN / sans inrae) dans le **fichier unique**\n   `recherches/thesaurus/termes_a_definir.txt` ; l'outil signale aussi les\n   **near-dups** à arbitrer avant envoi.\n2. **Compléter** ce que l'outil ne capte pas (def présente mais à revoir) : les\n   `statut='a_revoir'` + `'approx'`, les cas pointés par l'audit (syn ambigu),\n   et les **lacunes** — termes absents mais mobilisés (ex. guildes nématodes\n   bactérivores/fongivores/omnivores).\n3. **Nettoyer** : tri alpha (#115), dédup `norm()`, **écarter** les doublons déjà\n   fusionnés dans la session **et** les variantes lexicales d'un terme existant\n   (« voie Wood-Ljungdahl » vs « voie de Wood-Ljungdahl ») — sinon Jenni **recrée\n   un doublon** à l'import.\n4. **Note d'arbitrage SÉPARÉE** (near-dups ambigus, homonymes à désambiguïser type\n   k2) → **`jmj/rapports/audit/`**, **JAMAIS** `recherches/thesaurus/` : les renvois\n   `#N` y déclenchent le scan méta-vocab (`check_forbidden_jenni`, hook pre-commit).\n   La liste envoyée à Jenni reste **plate et propre** — des libellés `fr` seuls.\n5. **Retour Jenni** — `import_termes.py --replace` + **analyse consciente**\n   (`wf_source_integration`, BQ `thesaurus_workflow`) : ré-attribution strate/`doc_code`\n   par la **provenance** (terme → fiche source), jamais devinée ; `fr` canonique\n   stable (#138), l'acronyme va en `syn_fr`/`syn_en`.\n\n> **Créer un terme manquant = ajouter son libellé à la liste Jenni**, pas un\n> `INSERT terms`. Définition, synonymes, anglais, relations BT/RT viennent de\n> Jenni — la rédaction éditoriale du thésaurus n'est jamais de la mémoire l'agent.\n\n### Étape 4 — Exécution : par action, traçable, réversible\n\n- **Un commit par action** (message = action + raisonnement + réversibilité).\n- Après édition DB : **regen ciblé** (le bon `gen_*`, pas `regen_all` si une seule\n  page est concernée) → **WAL checkpoint** avant `git add sol_vivant.db` →\n  `check_integrity` (0 criticité attendu).\n- Tracer dans **`audit_log`** (`detail` = action + arbitrage retenu).\n\n### Étape 5 — Solder ≠ tout faire en une session\n\nLes actions de **création** (cards manquantes, refonte de prose, nouvelles\nchaînes) sont des chantiers d'autorat dédiés, lourds. Solder = **traiter ce qui\nest tranchable proprement**, **router** le reste (liste Jenni, sessions JMJ en\ndirect) et **documenter l'état final** : X/N actions soldées, ce qui reste, et\n**pourquoi** (nature éditoriale, garde-fou, controverse non levée).\n\n---\n\n**Anti-pattern principal** : enchaîner les actions du rapport en `--apply`\nmécaniques sans ré-examen DB ni tri par nature — produit des fusions destructrices\n(faux positifs), des écritures éditoriales hors Jenni, et des chaînes qui affirment\ndes mécanismes non soutenus. Le rapport propose ; la conscience dispose.\n", "type": "workflow", "crit": false}, {"id": "wf_agents_library", "titre": "Bibliothèque d'agents spécialisés — charte, architecture, catalogue", "contenu": "## Bibliothèque d'agents spécialisés — charte canonique\n\nSource de vérité pour la **bibliothèque d'agents** du Sol Vivant. Définit les\nconventions, l'architecture 3 couches, le catalogue des agents standards, le\nrouting modèle, le profilage thinking, et le modèle de composition.\n\n**Historique** : décision JMJ 2026-07-08 après audit Conseil (3 lentilles +\ncontradicteur + anti-marteau). Pivote depuis une logique « agents ad-hoc par\nchantier » vers une « bibliothèque d'agents atomiques combinables ».\n\n**Référence doctrinale gouvernante** : BQ `strategie_agents` (patterns d'usage,\ngarde-fous) reste active — cette BQ l'étend, ne la remplace pas.\n\n## Vision\n\nUne **bibliothèque d'agents atomiques** (1 compétence standard = 1 agent),\ncombinables en **pipelines à façon**. L'agent primaire (l'orchestrateur) reste le chef\nd'orchestre (doctrine `strategie_agents` : « Je suis le chef d'orchestre »).\n\nTrois couches articulées :\n\n| Couche | Rôle | Permissions bash | Moteurs |\n|---|---|---|---|\n| **1 — Raisonnement pur** | La bibliothèque principale. read-only DB + lecture. Aucun moteur dans le raisonnement. | `sqlite3 *`, `bq_query.py *`, `check_integrity.py *` | l'API d'audit factuel (par défaut) |\n| **2 — Validation/moteur ciblés** | Temps réel. Bash limité à UN script moteur précis. | `<script_moteur> *` (ex: `semantic_scholar.py *`) | l'API d'audit factuel |\n| **3 — Patterns batch** | Fan-out massif. `agent_runner.py` : `--prepare` → N agents couche 1 → `--consolidate`. | géré par le script `--run` | l'API d'audit factuel (cache KV) |\n\n**Le skill `composer`** (couche orchestration) documente des pipelines nommés\n(catalogue), mais l'**exécution reste manuelle** par l'agent primaire. Pas\nd'orchestrateur automatique (respecte `strategie_agents` : « pas de chaîne\nd'agents profonde »).\n\n## Taxonomie — 8 familles de besoins fondamentaux\n\nRéflexion par **verbe métier récurrent** (pas par problème ponctuel) :\n\n| Famille | Verbe | Question type | Couche |\n|---|---|---|---|\n| **AUDIT** | Vérifier conformité/existant | « Cette fiche respecte-t-elle le format ? » | 1 |\n| **WEAVE** | Tisser/croiser des liens | « Cette card devrait-elle être liée ? » | 1 |\n| **DETECT** | Trouver du neuf/des trous | « Quels concepts émergents manquent ? » | 1 |\n| **CLASSIFY** | Catégoriser/étiqueter | « Quel statut pour ce terme ? » | 1 |\n| **EXTRACT** | Pull de données structurées | « Quelles citations dans ce texte ? » | 1 |\n| **VALIDATE** | Cross-check externe | « Ce paper existe-t-il sur S2 ? » | 2 |\n| **CONSOLIDATE** | Agréger des résultats batch | « Trier ce manifeste en quick wins » | 1 |\n| **DELIBERATE** | Délibération multi-lentilles | « Cette proposition tient-elle au Conseil ? » | 1 |\n\n(+ famille transverse **SCRIBE** couverte par `session-scribe` : briefing/recap)\n\n## Convention canonique d'un agent\n\nDérivée des 7 agents existants (weaver-cards/chains/thesaurus, audit-coherence/\nmd-format/section-numbering, session-scribe). Tout nouvel agent DOIT respecter :\n\n### Frontmatter\n\n```yaml\n---\ndescription: \"<rôle court — verbe + cible + périmètre read-only>\"\nmode: subagent\nmodel: <depuis config agent_library (voir § Routing)>\ntemperature: 0.1\npermission:\n  edit: deny\n  task: deny\n  webfetch: deny\n  bash:\n    \"*\": deny\n    \"sqlite3 *\": allow              # couche 1\n    \"python3 tools/admin/bq_query.py *\": allow\n    # + patterns spécifiques (couche 2 si agent moteur)\nadditional:\n  reasoningEffort: <high|max>        # si thinking (pass-through, voir § Profilage)\n---\n```\n\n### Corps\n\nStructure obligatoire :\n1. **Rôle** (1 paragraphe)\n2. **Contexte — schéma** (tables/colonnes pertinentes, pièges FK)\n3. **Conventions** (références à RULES.md : `audit_cards_first`, `pas_modif_fr_canonique`, etc.)\n4. **Tâches types** (A/B/C/D — l'agent primaire choisit la tâche dans le prompt)\n5. **Format de retour JSON strict** (schéma documented)\n6. **Règles absolues** (jamais rédacteur, JMJ tranche, vérifier l'existant)\n\n### Verdict standardisé\n\nTous les agents d'audit/weave/detect retournent un verdict :\n`OK | MINEUR | MAJEUR | CRITIQUE`\n\n### Doctrine transverse\n\n- **`pas_agent_redacteur`** : aucun agent ne rédige de contenu éditorial (définitions, descriptions, fiches). Ils proposent des structures (liens, catégories, splits, classifications). JMJ arbitre.\n- **Read-only strict** : `edit/task/webfetch: deny`. La couche 2 a bash ciblé mais jamais `edit`.\n- **Format JSON strict** : retour structuré, parsable, jamais de prose libre pour les verdicts.\n- **Propositions = hypothèses** : c'est toujours JMJ qui tranche en apply.\n\n## Routing modèle — paramétrable en DB\n\n**Décision 2026-07-08** : l'API d'audit factuel pour tous les subagents de la\nbibliothèque, l'orchestrateur pour le codage/orchestration.\n\n| Type de tâche | Modèle | Raison |\n|---|---|---|\n| Subagents de raisonnement (audit, weave, classify, detect, consolidate, deliberate) | **l'API d'audit factuel** | Rich World Knowledge, plausibilité scientifique (doc l'API annonce) |\n| Codage Python (`tools/`), refactoring, debug, codebase takeover, orchestration (skill composer, agent primaire) | **l'orchestrateur** (plan Max) | Long-horizon engineering, déjà payé dans le plan Max |\n\n**Justification recherche** (audit 2026-07-08, doc officielle + Artificial\nAnalysis) : les deux sont excellents en coding, mais leur spécialisation\ndiffère. l'orchestrateur = long-horizon engineering (codebase takeover, refactoring\nmulti-fichiers, adherence aux engineering standards). l'API d'audit factuel = Rich\nWorld Knowledge + agentic SOTA (expertise domaine, plausibilité, raisonnement\nSTEM). Répartition nette, sans zone grise identifiée.\n\n### Paramétrage (règle #5 — aucun hardcodage)\n\nLe routing vit dans la **table `config` catégorie `agent_library`** :\n\n| Clé | Exemple | Description |\n|---|---|---|\n| `_default_model` | `<modèle configuré>` | Modèle défaut subagents |\n| `_default_effort` | `high` | reasoning_effort défaut |\n| `_default_thinking` | `enabled` | thinking défaut (ON chez l'API) |\n| `<agent>_model` | `<modèle configuré>` | Override par agent |\n| `<agent>_effort` | `max` | Override effort |\n| `<agent>_thinking` | `disabled` | Override thinking (best-effort, voir § Profilage) |\n| `<agent>_max_tokens` | `8000` | Budget tokens (rappelé dans le corps, non frontmatter) |\n| `<agent>_temperature` | `0.1` | Override température |\n| `<agent>_enabled` | `true` | Activer/désactiver l'agent |\n\n**Les `.md` restent manuels** (P1 simplifié) mais **citent la config** dans leur\nfrontmatter via un commentaire. Le générateur `gen_agents.py` (Jinja2) est\n**optionnel P3**, déclenché seulement si la maintenance manuelle devient\ndouloureuse après 8+ agents (évite l'over-engineering pour projet mono-utilisateur).\n\n**A/B test** : avant de figer le routing définitif, tester l'orchestrateur vs l'API d'audit\nV4 Pro sur 3 agents pilotes (P2). Le routing \"Pro pour tous\" est réversible via\nun simple `UPDATE config` (aucune édition de `.md`).\n\n## Profilage thinking — par agent\n\n**Problème** : le thinking mode génère du `reasoning_content` facturé, qui peut\nsaturer `max_tokens` → réponse finale vide/tronquée → « run pour rien »\n(incident 07-07 : `max_tokens=2000` insuffisant en thinking → fix 8000).\n\n### ⚠ Réalité technique (test 2026-07-08) — asymétrie subagent vs script\n\nLe pass-through opencode `additional.thinking: {type: disabled}` vers le\nprovider l'API d'audit **n'est pas fiable**. Les subagents opencode tournent en\n**thinking ON effectif** (défaut V4).\n\n| Canal | Thinking-off possible ? | Test |\n|---|---|---|\n| Subagent opencode (`.md` + `additional.thinking`) | ❌ **Non fiable** | config résolue OK mais payload API non transmis correctement |\n| Script Python via `deepseek_client.call_deepseek(thinking='disabled')` | ✅ **Fiable** | `reasoning_content` vide confirmé (test direct 2026-07-08) |\n\n**Conséquence** : la désactivation du thinking pour économie budget ne marche\n**que via les scripts batch** (couche 3), pas via les subagents (couches 1-2).\n\n### Stratégie ajustée\n\n| Canal d'exécution | Thinking | max_tokens | Usage |\n|---|---|---|---|\n| **Subagents opencode** (couches 1-2, raisonnement) | **ON effectif** (défaut V4) | Ajusté pour absorber le CoT | audit-factuel, conseil, weave, detect, consolidate |\n| **Scripts batch** (couche 3, tâches mécaniques) | **OFF possible** via `deepseek_client(thinking='disabled')` | 1500-2000 (pas de CoT) | classifier, extractor, audit-format, validator |\n\n### max_tokens par agent (subagents, thinking ON effectif)\n\n| Agent | max_tokens | Justification |\n|---|---|---|\n| `classifier-term-statut` | 3000 | Catégorisation + CoT |\n| `extractor-citations` | 5000 | Parsing + CoT |\n| `audit-md-format`, `audit-section-numbering` | 4000 | Parsing MD + CoT |\n| `validator-s2`, `validator-crossref` | 2000 | Lecture métadonnées + CoT court |\n| `scholar-searcher` | 3000 | Recherche + CoT court |\n| `audit-coherence`, `detector-gaps` | 4000 | Croisement structuré |\n| `consolidator-*` | 6000 | Agrégation + jugement |\n| `weaver-*` | 6000 | Proposition de liens |\n| `detector-emergences` | 10000 | Largeur connaissances critique |\n| `audit-factuel` | 12000 | Plausibilité scientifique profonde |\n| `conseil-judge` | 16000 | Délibération 3-lentilles |\n| `conseil-contradicteur` | 12000 | Contre-pied systématique |\n\n### Workaround pour thinking-off effectif (tâches mécaniques)\n\nPour les **batches massifs** (N > 5 items) de classification/extraction/audit-format :\nutiliser un script Python via `agent_runner.py` + `deepseek_client.py` avec\n`thinking='disabled'`. Helper : `tools/lib/agent_thinking.py`.\n\n```python\nfrom deepseek_client import call_deepseek\nres = call_deepseek(conn, messages, thinking='disabled', max_tokens=1500)\n# res['reasoning'] == '' (vide, thinking off)\n```\n\n**Économie** : sur tâche mécanique, thinking-off = ~2 tokens completion vs ~100\navec thinking ON (test direct : ×50 économie sur output). Rentable pour les\nbatches de centaines d'items.\n\n**Réflexe** `thinking_profiling` (RULES.md) : pour N>5 items mécaniques, script\nbatch (thinking-off possible) plutôt que subagent (thinking-on forcé).\n\n## Catalogue des agents standards\n\nLégende : ✅ existant · 🆕 candidat · ⭐ prioritaire V1 (réutilisé dans ≥3 pipelines)\n\n### V1 — 12 agents prioritaires (couche 1 + composer)\n\n| # | Agent | Famille | Statut | Moteur |\n|---|---|---|---|---|\n| 1 | `audit-factuel` | AUDIT | 🆕 ⭐ | l'API d'audit factuel (thinking max) |\n| 2 | `classifier-term-statut` | CLASSIFY | 🆕 ⭐ | l'API d'audit factuel (thinking off) |\n| 3 | `detector-emergences` | DETECT | 🆕 ⭐ | l'API d'audit factuel (thinking max) |\n| 4 | `detector-gaps` | DETECT | 🆕 ⭐ | l'API d'audit factuel |\n| 5 | `consolidator-manifest` | CONSOLIDATE | 🆕 ⭐ | l'API d'audit factuel |\n| 6 | `consolidator-triage` | CONSOLIDATE | 🆕 ⭐ | l'API d'audit factuel |\n| 7 | `conseil-judge` | DELIBERATE | 🆕 ⭐ | l'API d'audit factuel (thinking max) |\n| 8 | `conseil-contradicteur` | DELIBERATE | 🆕 ⭐ | l'API d'audit factuel (thinking max) |\n| 9 | `weaver-fiches` | WEAVE | 🆕 ⭐ | l'API d'audit factuel |\n| 10 | `extractor-citations` | EXTRACT | 🆕 ⭐ | l'API d'audit factuel (thinking off) |\n| 11 | `validator-s2` | VALIDATE (couche 2) | 🆕 ⭐ | l'API d'audit factuel + S2 |\n| 12 | `composer` | orchestration (skill) | 🆕 ⭐ | l'orchestrateur (agent primaire) |\n\n### Existants (déjà en place, routing migré en config 2026-07-09 P0-3)\n\n| Agent | Famille | Couche | Routing (`config.agent_library`) |\n|---|---|---|---|\n| ✅ `weaver-cards` | WEAVE | 1 | `<modèle configuré>` |\n| ✅ `weaver-chains` | WEAVE | 1 | `<modèle configuré>` |\n| ✅ `weaver-thesaurus` | WEAVE | 1 | `<modèle configuré>` |\n| ✅ `audit-coherence` | AUDIT | 1 | `<modèle configuré>` |\n| ✅ `audit-md-format` | AUDIT | 1 | `<modèle configuré>` (thinking ON effectif, défaut V4) |\n| ✅ `audit-section-numbering` | AUDIT | 1 | `<modèle configuré>` (thinking ON effectif, défaut V4) |\n| ✅ `session-scribe` | SCRIBE | 1 | `zai-coding-plan/glm-5.2` (switch 2026-07-09, paperasse structurelle) |\n\n> **Routing paramétrique** : toutes les valeurs ci-dessus sont en `config.agent_library.<agent>_model` (règle `agent_library_parametrique`). Pour changer globalement : `UPDATE config SET valeur=... WHERE categorie='agent_library' AND cle LIKE '%_model'`. Pour un agent : `UPDATE config SET valeur=... WHERE cle='<agent>_model'`. Les `.md` restent manuels mais citent ce routing.\n\n### V2 — agents candidats (catalogués, non prioritaires)\n\nÀ créer selon besoin observé. Inclut les **angles morts** identifiés lors de\nl'audit Conseil 2026-07-08 (BQ, Scripts, Audit_log, Web, RULES).\n\n**Cible BQ** (`tools/bq/*.md`) :\n- `audit-bq-coherence` — doublons sémantiques entre BQ (ex: `conseil_modele`/`generatif`/`overview`)\n- `audit-bq-frontmatter` — YAML conforme (slug, domaine_primaire, is_critique, ordre)\n- `audit-bq-obsolescence` — références tables/colonnes droppées, scripts supprimés\n- `weaver-bq` — cross-references BQ↔BQ, BQ↔scripts, BQ↔RULES.md manquantes\n\n**Cible Scripts** (`tools/**/*.py`) :\n- `audit-scripts-conventions` — `--db` présent, `lib.config.get` vs hardcodage, `audit_log` alimenté\n- `audit-scripts-orphans` — scripts non référencés (MANIFEST, README, BQ)\n- `audit-scripts-dette` — TODO/FIXME/dépréciés\n- `weaver-scripts-bq` — chaque script a-t-il une BQ de doctrine ?\n\n**Cible Audit_log / RULES / Web** :\n- `audit-audit-log-trace` — toute écriture DB est-elle loggée ? (récurrence 07-07)\n- `audit-rules-bq-sync` — règle RULES.md sans BQ, ou BQ critique non remontée\n- `audit-web-coherence` — liens cassés, ancres `#card-N`, og_image (Publications/web)\n\n**Compléments familles existantes** :\n- `weaver-sources` — réconciliation refs ↔ sources (matching DOI)\n- `weaver-inrae` — alignement INRAE (préférence, pas autorité)\n- `weaver-cascade` — cascade = chaîne hiérarchique de cards\n- `detector-contradictions` — contradictions explicites entre cards/fiches\n- `classifier-card-category` — mecanisme/cadre/pratique/symptome/cycle\n- `classifier-fiche-version` — v0→v6, propose upgrade\n- `classifier-source-type` — peer-review/preprint/gris\n- `extractor-concepts` — concepts-clés d'un texte (pour tissage)\n- `extractor-metadata` — métadonnées d'une référence (depuis DOI/texte)\n- `validator-crossref` — arbitrage Crossref (avec filtre similarité titre↔sujet)\n- `validator-citation-format` — conformité APA stricte\n- `validator-inrae` — alignement INRAE (couplé à weaver-inrae)\n- `consolidator-dedup` — dédoublonnage de propositions\n- `conseil-anti-marteau` — détection biais confirmation\n- `conseil-synthese` — synthèse délibération → verdict\n- `scholar-searcher` (couche 2) — recherche S2 par sujet, veille\n- `zotero-sync` (couche 2) — pull/push Zotero\n- `validator-crossref` (couche 2) — arbitrage Crossref\n\n**Total catalogue** : 19 existants+V1 + ~29 V2 = **~48 agents standards**.\n\n## Modèle de composition — pipelines à façon\n\nL'agent primaire (l'orchestrateur) orchestre en enchaînant des `task` calls. Le skill\n`composer` documente des pipelines nommés (catalogue), mais **n'exécute pas\nautomatiquement** (respect de `strategie_agents` : « Je suis le chef\nd'orchestre »).\n\nExemples de pipelines (deviennent skills `compose-*` ou entrées BQ\n`wf_compose_*`) :\n\n```\n[A] Audit complet fiche\n  audit-md-format → audit-section-numbering → audit-coherence\n  → audit-factuel → audit-doctrine → conseil-judge\n\n[B] Enrichissement terme\n  classifier-term-statut → validator-s2 → weaver-thesaurus\n  → weaver-inrae → consolidator-manifest → [apply JMJ]\n\n[C] Tissage nouvelle card\n  weaver-cards → weaver-chains → weaver-fiches\n  → detector-gaps → conseil-contradicteur\n\n[D] Production fiche (subagent rédacteur, read-only DB)\n  extractor-citations → validator-s2 → validator-crossref\n  → classifier-source-type → consolidator-triage\n\n[E] Veille émergences (exploite largeur connaissances)\n  detector-emergences → classifier-term-statut\n  → weaver-thesaurus → conseil-judge\n\n[F] Audit factuel full-corpus (gâche 3)\n  [fan-out couche 3] audit-factuel × N fiches → validator-s2\n  → validator-crossref → [fan-in] consolidator-triage → conseil-judge\n```\n\n## Articulation avec l'existant\n\n- **`agent_runner.py`** reste pour le **fan-out massif** (N items × 1 agent). Avec le plan Max GLM, `max_concurrent` peut passer de 5 à 15-20 (à recalibrer en config catégorie `agent_runner`).\n- **Skills existants** (`audit`, `integrate-fiche`, etc.) restent la **doctrine par chantier** — les agents sont les **briques**, les skills sont les **modes d'emploi**.\n- **`strategie_agents`** reste la BQ gouvernante des patterns d'usage (agent_runner, Task in-session, lecture directe). Cette BQ l'étend avec la bibliothèque d'agents standards.\n- **`session-scribe`** (briefing/recap) reste l'agent SCRIBE transverse, hors périmètre bibliothèque V1.\n\n## Plan d'implémentation\n\n| Phase | Livrables | Statut |\n|---|---|---|\n| **Pré-P1** | 3 tests read-only : provider l'API d'audit ✅, pass-through thinking ⚠ (best-effort), permissions bash ✅ | ✅ Validé 2026-07-08 |\n| **P0** | Cette BQ + 3 entrées RULES.md (`agent_library_parametrique`, `routing_modeles_agents`, `thinking_profiling`) | ✅ Cette session |\n| **P1** | Table `config` catégorie `agent_library` (routing seul, `.md` manuels) | à suivre |\n| **P2** | 3 agents pilotes manuels : `audit-factuel`, `classifier-term-statut`, `detector-emergences` + test A/B l'orchestrateur vs l'API d'audit factuel | à suivre |\n| **P3 (optionnel)** | Générateur `gen_agents.py` (Jinja2) — seulement si maintenance manuelle douloureuse après 8+ agents | conditionnel |\n| **P4** | Skill `composer` = catalogue de pipelines documentés | à suivre |\n| **P5** | 9 autres ⭐ V1 + 4 agents couche 2 (validator-crossref, zotero-sync, scholar-searcher) | à suivre |\n\n## Anti-patterns confirmés\n\n- ❌ **Hardcoder le modèle** dans le frontmatter `.md` sans config DB (règle #5). Le routing vit en `config`.\n- ❌ **Agent rédacteur** : tout agent rédigeant du contenu éditorial (définition, description, fiche) viole `pas_agent_redacteur`.\n- ❌ **Chaîne d'agents profonde** : un agent qui en invoque un autre qui en invoque un autre (timeout cascade, doctrine `strategie_agents`).\n- ❌ **Orchestrateur automatique** : le skill `composer` documente mais n'exécute pas (l'agent primaire reste chef d'orchestre).\n- ❌ **Générateur Jinja2 prématuré** : avant 8+ agents manuels, la maintenance manuelle est moins coûteuse qu'un générateur à maintenir.\n- ❌ **Permissions bash sans `*` final** : `\"grep\"` seul bloque les args, il faut `\"grep *\"` (doc opencode permissions).\n- ❌ **Thinking ON pour tâche mécanique** : gaspillage budget. Profiler par agent (best-effort sur la désactivation).\n- ❌ **`max_tokens` trop petit en thinking mode** : la réponse finale est tronquée → « run pour rien ». Calibrer par agent (output attendu × 3).\n- ❌ **Catalogue figé** : la bibliothèque évolue. Les angles morts (BQ/Scripts/Audit_log/Web) étaient absents du V1 initial — audit régulier du catalogue.\n\n## Références croisées\n\n- **BQ gouvernante** : `strategie_agents` (patterns d'usage agents Task, garde-fous)\n- **BQ connexes** : `doctrine_deepseek_api` (API l'API d'audit), `audit_conscient` (gâche 3), `conseil_modele` (Conseil V3), `pas_agent_redacteur` (rôle agents), `agent_runner_garde_fous` (fan-out massif)\n- **RULES.md** : `agent_library_parametrique`, `routing_modeles_agents`, `thinking_profiling` (ajoutées P0)\n- **Agents existants** : `.opencode/agents/*.md` (weaver-cards/chains/thesaurus, audit-coherence/md-format/section-numbering, session-scribe)\n- **Skills** : `.opencode/skills/*/SKILL.md` (doctrine par chantier — les skills sont les modes d'emploi, les agents sont les briques)\n- **Doc externe** : [opencode agents](https://opencode.ai/docs/agents/), [opencode permissions](https://opencode.ai/docs/permissions/), doc API d'audit, doc orchestrateur\n", "type": "workflow", "crit": true}, {"id": "audit_conscient", "titre": "Audit conscient vs audit scripté — doctrine et priorité", "contenu": "## Audit conscient vs audit scripté\n\nLe corpus est éprouvé par **deux familles d'audit**, de natures et de\npriorités différentes. Les confondre conduit à se rassurer à tort.\n\n### Audit conscient — PRIORITAIRE\n\nJugement éditorial sur la **doctrine** : *ce que le corpus affirme tient-il\ndebout ?* Requiert lecture, croisements et arbitrage. C'est la valeur réelle\n(cohérence narrative et scientifique). Deux chantiers :\n\n- **`audit_corpus`** — chaînes causales, concept cards, fiches\n- **`audit_thesaurus`** — ossature lexicale\n\nCadence : toutes les 3-5 sessions, ou avant un consolidé éditorial majeur.\n\n### Audit scripté — SANTÉ\n\nAssertions automatiques et mécaniques : monitoring de la **santé technique**.\nTournent à chaque `session_start` (dashboard ÉTAT DES AUDITS, status\n`ok`/`degraded`/`failed`) :\n\n- `check_integrity` (FK, doublons, schéma) · `check_forbidden_jenni`\n  (méta-vocab) · `audit_anglicismes` · `audit_fiches` ·\n  `audit_sources_orphelines` · `enrich_thesaurus_audit`\n\nInstrumental, jamais une fin en soi.\n\n### Pourquoi cette hiérarchie\n\nL'audit scripté garde la maison propre (intégrité, méta-vocab, anglicismes),\nmais ne dit **rien** de la justesse scientifique ni de la cohérence\ndoctrinale. Un corpus peut être « vert » sur tous les audits scriptés et\nporter des contradictions de fond, des chaînes mal étayées, des cards\norphelines, des intros copiées-collées hors-sujet. **Seul l'audit conscient\nles révèle.** → la priorité va au conscient ; le scripté est l'hygiène de\nfond qui tourne en tâche de fond.\n\n### Conduite de l'audit conscient — méta puis fin\n\nL'audit conscient combine la **couverture** des agents et le **jugement** de\nl'agent. Quatre temps :\n\n1. **Méta-analyse (agents)** — `analyse_corpus.py --prepare` → agents Task en\n   parallèle (pattern `agent_runner`, BQ `strategie_agents`) → `responses/` →\n   `--consolidate`. Donne une couverture large, chiffrée, passe par passe.\n2. **Supervision (agent)** — **juger** chaque réponse d'agent (exhaustivité,\n   justesse, hors-sujet), **affiner / relancer** les passes faibles. Ne\n   jamais consolider aveuglément : une réponse d'agent est une proposition,\n   pas une vérité.\n3. **Analyse fine en direct (agent)** — approfondir, en chargeant le corpus,\n   les points saillants révélés par la méta (en particulier les\n   **convergences inter-passes** : un même défaut pointé par 3 passes\n   indépendantes est un vrai problème). C'est là que se fait l'arbitrage\n   doctrinal. Pour un arbitrage de fond (création/refonte de cards, chaînes,\n   cascades, design DB), l'instruire par le **Conseil** — 3 lentilles + double\n   contradicteur → verdict vérifié pour JMJ, cf. BQ `conseil_modele`.\n4. **Rapport** — `jmj/rapports/audit/audit_corpus_<date>.md` : synthèse par\n   axe + section « actions priorisées (top 10) ».\n\n## Architecture hybride de l'audit conscient (l'orchestrateur + l'API d'audit factuel)\n\nL'audit conscient pré-intégration (`wf_fiche_integration`) exploite la synergie\ncontre-intuitive de deux modèles : l'orchestrateur pour la cartographie interne, l'API d'audit\nV4 Pro pour la vérification factuelle externe.\n\n### Le principe contre-intuitif à graver\n\nLes connaissances étendues de l'API d'audit ne servent PAS à trouver des ponts dans\nl'audit — elles servent à empêcher une erreur factuelle de traverser.\n\nL'audit n'est pas un acte créatif, c'est un acte de filtrage. On filtre d'abord sur ce\nqu'on connaît (le câblage interne), puis sur ce qu'on ne connaît pas encore (la vérité\nscientifique externe).\n\n### Les 3 Gâches séquentielles (Fail-Fast Pipeline)\n\nUn audit ne passe pas d'un modèle à l'autre « pour varier ». Il passe par des gâches\nséquentielles parce qu'il est idiot de vérifier la justesse scientifique d'une fiche\ndont les liens internes sont cassés.\n\n#### GÂCHE 1 — Audit Structurel (l'orchestrateur, effort maximal)\n\nObjectif : Le câblage est-il valide ?\n\n- Les ref_links pointent vers des tables ref_* existantes ?\n- Les `[CARD #N]` / `[FICHE #N]` existent-ils dans le contexte ?\n- Le link_type est-il cohérent avec la sémantique de la fiche ?\n- La terminologie introduite crée-t-elle un synonyme non déclaré dans le thésaurus ?\n\n**Pourquoi l'orchestrateur ?** Il est le seul à pouvoir tenir la topologie complète du\ngraphe (toutes les tables, tous les liens) dans son contexte. l'API d'audit n'a pas été\noptimisé pour le traçage de dépendances cross-fichiers à cette échelle.\n\nSortie : `OK_STRUCTUREL` ou `ANOMALIE_CABLAGE` (listage précis des liens morts ou\nincohérents). Si `ANOMALIE_CABLAGE` → **STOP**. On ne passe pas à la gâche 2.\n\n#### GÂCHE 2 — Audit Doctrinal (l'orchestrateur, effort élevé)\n\nObjectif : La friction est-elle préservée ?\n\n- Cette fiche dissout-elle une tension productive (leçon M0) ?\n- Le niveau de granularité est-il cohérent (pas de contenu rédigé,\n  `pas_agent_redacteur`) ?\n- Le positionnement dans `doctrine_chantiers` est-il cohérent avec les axes\n  existants ?\n\n**Pourquoi l'orchestrateur ?** La garde-friction nécessite de connaître l'historique des\ntensions du corpus. l'API d'audit n'a pas cette mémoire. Lui injecter le contexte doctrinal\npour ce check créerait un risque souverain de filtrage.\n\nSortie : `OK_DOCTRINAL` ou `FRICTION_DISSOUTE` (citation de la tension menacée) ou\n`GRANULARITE_INCOHERENTE`. Si friction dissoute → **STOP**.\n\n#### GÂCHE 3 — Audit Factuel (l'API d'audit factuel, mode thinking)\n\nObjectif : Les affirmations sont-elles vraies dans le monde réel ?\n\n- Les affirmations scientifiques sont-elles correctes ?\n- Les sources citées existent-elles et disent-elles ce qu'on prétend ?\n- Y a-t-il une contradiction avec un fait établi hors du corpus ?\n\n**Pourquoi l'API d'audit ?** C'est le seul à avoir les connaissances monde nécessaires.\nLe mode thinking active un chain-of-thought rigoureux, parfait pour la vérification\nplutôt que la génération.\n\nSortie : `OK_FACTUEL` ou `ALERTE_VERITE` (détail de la contradiction ou de\nl'absence de source). Si `ALERTE_VERITE` → **PROMU VERS JENNI** (on ne tranche pas la\nvérité ici).\n\n### Garde-pilot : la règle anti-souveraineté absolue\n\nLe chairman (l'orchestrateur) ne transmet **JAMAIS** son interprétation de la fiche à l'API d'audit.\nIl transmet le **TEXTE BRUT** de la fiche candidate + la consigne de rôle.\n\n**Ce qui est interdit :**\n\n> « Cette fiche parle du recyclage du carbone, vérifie si les affirmations sur le cycle\n> du carbone sont justes. »\n\n**Ce qui est obligatoire :**\n\n> « Voici le texte brut de la fiche candidate. Vérifie la justesse factuelle de chaque\n> affirmation scientifique. »\n\nSi l'orchestrateur reformule, il filtre. S'il filtre, il est souverain. Si l'API d'audit juge sur\nun texte filtré, l'audit factuel est invalide.\n\n### Coût de confiance\n\n| Gâche | Modèle | Couches LLM | Confiance |\n|-------|--------|-------------|-----------|\n| 1 & 2 | l'orchestrateur | 1 couche entre le fait et le verdict | Élevée |\n| 3 | l'API d'audit | 2 couches (GLM pilote + l'API d'audit exécutant) | Plus faible |\n\nLa confiance sur la sortie de la Gâche 3 est intrinsèquement plus faible que sur\nles Gâches 1 et 2. Ce n'est pas un défaut — c'est un **diagnostic**. C'est pourquoi la\nsortie `ALERTE_VERITE` ne déclenche pas un rejet, mais une promotion vers Jenni\n(juge externe humain) pour trancher la couche de confiance manquante.\n\n### Anti-patterns de l'audit hybride\n\n1. **Inverser les gâches** — faire le factuel (l'API d'audit) avant le structurel (GLM) :\n   gaspillage de tokens et risque de corriger un texte qu'il faudra détruire.\n2. **Injecter le contexte GLM dans le prompt l'API d'audit** — ramène le risque souverain et\n   consomme inutilement le contexte de l'API d'audit.\n3. **Utiliser l'API d'audit pour l'audit structurel** — il n'a pas la carte du graphe en tête,\n   il va inventer des liens ou rater des dépendances cross-fichiers.\n4. **Faire confiance à l'alerte l'API d'audit sans passer par Jenni** — cela reviendrait à\n   mettre la vérité dans le Conseil, ce qui est un anti-pattern fondamental.\n\n### Voir aussi\n\n- BQ `conseil_modele` — le dispositif de délibération (3 juges : fécondité,\n  justesse, vérité)\n- BQ `wf_fiche_integration` — workflow d'intégration (étape 3 : Conseil d'audit)\n- BQ `wf_audit_factuel` — opérationnalise la **gâche 3** (vérification factuelle\n  l'API d'audit) définie dans cette BQ\n\n### Leçons opérationnelles (2026-05-26)\n\n- **Pérenniser les réponses d'agents.** Le work-dir `agent_runner` vit sous\n  `audit_runs/` (versionné), jamais `tmp/` (gitignoré = perte garantie au\n  reset, même sur filesystem persistant — `tmp/` n'est pas commité). `responses/` + `state.json` trackés ;\n  `batches/`, `prompts/` et sorties de consolidation (`resultats_v4.json`,\n  `rapport_analyse_v4.md`) régénérables → ignorés. Cf. `audit_runs/README.md`.\n- **Committer au fil de l'eau.** Un audit LLM complet consomme beaucoup de\n  tokens (méta-analyse 9 passes ≈ 1,5 M tokens). Committer **et pousser**\n  après chaque étape (responses, fix, rapport) pour ne rien perdre si la\n  session déborde sa limite avant la clôture `session_end.py`.\n- **Lancer sur une session vierge.** L'audit conscient complet (9 passes de\n  méta-analyse + supervision + analyse fine en direct) consomme une session\n  entière. Le démarrer en **début de session dédiée**, jamais sur une session\n  déjà entamée à 50 % par un autre chantier (fiches, intégrations) : le risque\n  est de déborder la limite avant la clôture (constat 2026-05-25/26).\n- **Se méfier d'un audit scripté faussé.** La passe T1 (complétude) est passée\n  d'un score 0,27 à 0,91 après correction d'une **troncature de l'index\n  thésaurus** : l'outil de mesure était cassé, pas le corpus. Toujours lire le\n  rapport JSON (`jmj/rapports/audit_data/json/<script>_latest.json`), pas seulement le\n  score agrégé (cf. doctrine anti-rassurisme, `.opencode/RULES.md`).\n\n## Faux positifs d'audit récurrents (absorbé depuis `faux_positifs_audit_recurrents`)\n\nL'agent LLM est lui-même faillible — détecter ces erreurs avant d'agir :\n\n1. **« Mentions problématiques dans prompts »** → SQLite LIKE est case-insensitive. Vérifier en Python avec match exact.\n2. **Tables supprimées** → `term_connections` remplacée ; `prompt_contenus` existe toujours (seule `contenu_integre` droppée).\n3. **Cross-refs `doc_source/doc_cible`** → descripteurs longs, pas un bug. Colonnes normalisées : `doc_code_source`/`doc_code_cible`.\n4. **« Doublons » surestimés** → avant fusion, EXAMINER chaque paire (`audit_cards_first`). Faux positifs types : homonymes, card-hub vs card-contenu, parcours vs cadre théorique, axes d'opposition distincts. Constat 2026-06-06 : 3/7 termes et 3/3 cards étaient des faux positifs.\n5. **« Termes/sources manquants » — piètre de l'acronyme anglais** → chercher uniquement l'acronyme anglais manque le canonical français. Constat 2026-06-29 : 10/10 termes déclarés « manquants » existaient (PGPR #4507, CUE #34, MAOM #33, POC #66, mother tree #3576, priming effect #35, ratio F/B #50, JMS #559, GRSP/glomaline #53, ACC déaminase #94). Contre-mesure : recherche multi-champ obligatoire (`fr`/`en`/`syn_fr`/`syn_en`/`definition`) + garde-fou `verify_absence_claims` (`agent_guards.py` check 14).\n\n**Règle** : ne pas agir sur un signalement sans vérification indépendante — même si c'est l'agent qui a signalé.\n", "type": "doctrine", "crit": false}, {"id": 155, "titre": "Audit du thésaurus — doctrine et workflow", "contenu": "## Audit du thésaurus — doctrine et workflow\n\nL'audit du thésaurus est un **chantier conscient** qui s'appuie sur un ensemble fini d'objectifs et de contrôles, exécutés à intervalles réguliers ou avant un cycle d'envoi Jenni majeur. Le thésaurus étant l'ossature lexicale du corpus (BQ `thesaurus_workflow` §H), une dérive lexicale ou des relations cassées se propagent dans tous les prompts produits. Cet audit n'est pas un simple `check_integrity` : il requiert lecture, croisements et arbitrage éditorial.\n\n### Objectifs canoniques\n\n| Axe | Objectif | Sortie attendue |\n|---|---|---|\n| **A. Nouveaux termes candidats** | Extraire les concepts mobilisés dans les fiches intégrées récentes / les retours Jenni mais absents du thésaurus | Liste triée par strate, prête pour un cycle d'enrichissement (workflow BQ `thesaurus_workflow` #116) |\n| **B. Termes incomplets** | Identifier les termes en DB sans définition (ou DEF < 150 c) ou sans BT — et les classer par priorité. **L'absence de synonyme n'est PAS un critère d'incomplétude** (voir règle d'arbitrage 5) | Liste docx « bloc de 10 » à passer par Jenni via `export_thesaurus_incomplets.py` |\n| **C. Relations cassées** | Vérifier la cohérence des BT/NT/RT : orphelines, doublons latents, polysémie, casses incohérentes | Rapport markdown d'arbitrages éditoriaux (à valider JMJ) |\n| **D. Doublons latents** | Détecter les `fr` qui sont des synonymes d'un autre terme, les variantes orthographiques, les acronymes qui collisionnent (`MO` vs `Mo`) | Liste de fusions candidates avec scoring qualité |\n| **E. Méta-vocab dans définitions** | Analyser les `terms.definition` à la recherche de fuites (`corpus`, `strate`, `card #N`, codes doc) | 0 toléré — UPDATE direct |\n| **F. Pseudoscience** | Vigilance BQ `sujets_interdits_corpus` #154 : termes biodynamie/Steiner non flaggés, relations valorisantes | Suppression ou flag (cf. incident 2026-04-23) |\n| **G. Anglicismes en strate FR** | Détecter `terms.fr` qui sont des termes anglais déguisés (140 cas constatés 2026-04-14) — nuisent au cycle Jenni | Audit + correction au cas par cas (taxons exclus) |\n| **H. Couverture par strate** | S'assurer que chaque strate F/S/V/P/H a une couverture lexicale équilibrée vs les sections de prompts | Rapport quantitatif (n termes par strate, ratio terms/section) |\n\n### Matching d'existence — 4 axes minimum (RÈGLE, fix 2026-06-03)\n\nLa détection « candidat absent » (row A) — et **tout agent/audit qui propose des termes**\n(audit corpus, audit thésaurus, audit scripté) — **doit croiser le candidat (fr ET en) contre\n`fr / en / syn_fr / syn_en` existants**, en `norm()` (casse, accents, apostrophes, pluriels),\n**pas `lower(fr)` seul**. Sinon un terme déjà présent sous un autre libellé (acronyme,\nsynonyme, singulier/pluriel) ressort comme « faux neuf » → doublon.\n\n- **Gap corrigé** : `export_termes_candidats.py::thesaurus_contains()` était fr-only (exact +\n  fuzzy 8 chars) → **29/100 doublons latents** ont passé au lot 1 du 2026-06-03\n  (cf. `jmj/rapports/audit_data/analyse_termes_thesaurus_2026-06-03.md`). Réécrit en 4-axes (index\n  `norm()` de fr/en/syn_fr/syn_en).\n- **5ᵉ axe à l'import** : `import_termes.py` vérifie en plus **syn-candidat ↔ fr-existant**\n  (doublons croisés — 6 cas attrapés au lot 1) ; ces cas restent « arbitrage JMJ ».\n\n### Cards comme outil d'audit du thésaurus\n\nLes **concept cards** (BQ `concept_cards_filtre_de_rigueur_une_affirmation_ba` #106 — rôle 5 « audit / stress-test ») servent de filtre amont : un terme candidat issu d'une fiche doit être confronté aux cards de la dimension correspondante avant d'être proposé pour enrichissement. Si aucune card existante ne contient le concept ou si une card en `archive` (mémoire de rejet) le contredit, le candidat est mis en attente jusqu'à arbitrage.\n\n```sql\n-- Cards 'active' qui mentionnent un concept (recherche large)\nSELECT id, title, dimension_id, status FROM concept_cards\nWHERE status='active' AND (lower(title) LIKE '%<concept>%' OR lower(description) LIKE '%<concept>%');\n\n-- Cards 'archive' qui rejettent un concept proche (mémoire de rejet)\nSELECT id, title, notes FROM concept_cards\nWHERE status='archive' AND lower(description) LIKE '%<concept>%';\n```\n\n### Pipeline d'audit en 5 passes (pattern `agent_runner`)\n\nL'audit thésaurus est éclaté en passes modulaires alignées avec `tools/batch/analyse_corpus.py` (BQ `wf_analyse` #140), pour permettre la parallélisation et la reprise après timeout.\n\n| Passe | Code | Objectifs | Contexte agent | Risque timeout |\n|---|---|---|---|---|\n| **T1** | Complétude | Termes vs sections : termes incomplets (B), nouveaux candidats (A), couverture (H) | Sections complètes (~81 k) + index thésaurus condensé (~70 k) | **Élevé** — split obligatoire par strate |\n| **T2** | Doublons | Doublons latents (D), relations (C), pseudoscience (F) | Thésaurus complet par strate + relations | Modéré |\n| **B1** | Biblio | Couverture refs par terme (sources / source_usages) | Thésaurus + biblio | Modéré |\n| **A1** | Anglicismes | Anglicismes en strate FR (G) — `audit_anglicismes.py` | Thésaurus FR seul | Faible |\n| **M1** | Méta-vocab | Leaks méta-vocab dans définitions (E) — scan regex inline | Thésaurus.definition seul | Très faible (scan local) |\n\n### Anti-timeout — règles opérationnelles\n\nCf. BQ `wf_analyse` #140 §recette anti-timeout. Spécifique au thésaurus :\n\n1. **Index condensé** : ne JAMAIS passer le thésaurus complet (def + BT + RT = ~450 k chars). Construire un index `id + [strate] + fr / syn_en / type` (~70 k chars pour 1071 termes). Définitions à la demande seulement, via second helper.\n2. **Split par strate** pour T1 : éclater en T1a (F+H) / T1b (P) / T1c (S) / T1d (V). 4 batches → fusion responses → consolidate.\n3. **Écriture progressive obligatoire** dans tous les prompts agent : `Écrire tmp/audit_thesaurus/responses/<cid>.json après chaque sous-batch traité`. Garantit un résultat partiel même si timeout à mi-parcours.\n4. **Limite dure** : 80 k chars utiles par agent → au-delà, split obligatoire.\n\n### Scripts dédiés\n\n| Script | Rôle | Pattern |\n|---|---|---|\n| `tools/admin/audit_thesaurus.py` | **Rapport consolidé A→H** (passes directes ; réutilise `audit_thesaurus`/`find_pairs`/`scan_thesaurus`) | Direct |\n| `tools/admin/check_integrity.py` | Sanity check rapide (FK, doublons schema) | Direct (pas d'agent) |\n| `tools/admin/audit_anglicismes.py` | Passe A1 (anglicismes en strate FR) | Direct |\n| `tools/admin/check_forbidden_jenni.py` | Passe M1 (méta-vocab dans définitions + tout contenu Jenni) | Direct |\n| `tools/admin/audit_sources_orphelines.py` | Sources sans DOI/URL (B1 partiel) | Direct |\n| `tools/batch/analyse_corpus.py --type thesaurus` | Passes T1 + T2 (passes lourdes) | `agent_runner` parallèle |\n| `tools/integration/export_thesaurus_incomplets.py` | Sortie axes B (incomplets) → docx Jenni | Direct |\n| `tools/admin/dedupe_thesaurus.py` | Axe D (déduplication) | Direct + scoring |\n\n### Cadence et déclencheurs\n\n- **Cadence régulière** : audit complet toutes les **3-5 sessions**, ou systématiquement avant une consolidation thésaurus (envoi de listes Jenni > 50 termes).\n- **Déclencheurs immédiats** :\n  - Après un import massif (lot de termes Jenni > 30 entrées) → re-passe T2 + axes C/D\n  - Après une fusion ou suppression de termes → re-passe relations (C)\n  - Après une fiche intégrée → extraire termes mobilisés, comparer aux candidats (A)\n  - Après une session Jenni qui a touché à des relations BT/RT → axe C\n- **Avant tout commit `--apply`** d'un import thésaurus : passes M1 (méta-vocab) + F (pseudoscience) obligatoires.\n\n### Sortie consolidée\n\nRapport unique `jmj/rapports/audit/audit_thesaurus_<date>.md` avec une section par axe (A→H) + section synthétique « actions priorisées ». Format aligné sur `audit_corpus_<date>.md` (BQ `audit_corpus`). **Généré par `tools/admin/audit_thesaurus.py --db sol_vivant.db`** (passes directes ; les passes lourdes T1/T2 et l'extraction de candidats A restent déléguées à `analyse_corpus.py` / `export_termes_candidats.py`).\n\n```\n# Audit thésaurus — <date>\n## A. Nouveaux termes candidats (N)\n## B. Termes incomplets (N) — par priorité\n## C. Relations cassées (N orphelines, N doublons, N polysémie)\n## D. Doublons latents (N candidats fusion)\n## E. Méta-vocab leaks (N occurrences) — UPDATE direct\n## F. Pseudoscience (N occurrences flag/suppression)\n## G. Anglicismes en strate FR (N termes à corriger)\n## H. Couverture par strate (tableau quantitatif)\n## Synthèse — actions priorisées (top 10)\n```\n\n### Règles d'arbitrage\n\n1. **Pas d'INSERT direct** des termes candidats issus d'extractions (cf. BQ `thesaurus_workflow` anti-pattern). Les axes A et B alimentent le **cycle thésaurus** (`export_thesaurus_incomplets.py --single-txt`), subagent rédacteur sous instruction produit les définitions, retour via `import_termes.py --md`.\n2. **Pas de modification automatique de `terms.fr`** (BQ `pas_modif_fr_canonique` — ex-§H.4 de #146). Toute correction casse/ponctuation sur `fr` passe par validation JMJ explicite.\n3. **Cards confrontées avant proposition** (BQ `concept_cards_filtre_de_rigueur_une_affirmation_ba` + `audit_cards_first`) : un nouveau terme candidat doit avoir au moins une card `active` qui le justifie ou le contextualise. Sans card, c'est une affirmation orpheline.\n4. **Audit log systématique** : chaque action correctrice (UPDATE, DELETE, INSERT) trace dans `audit_log` avec `operation`, `table_name`, `record_ref`, `detail`.\n5. **L'absence de synonyme n'est PAS une incomplétude** (décision 2026-06-01). Beaucoup de termes canoniques — taxons (`Aeschynomene`, `Gluconobacter`), composés chimiques précis (`brushite`, `acétate de calcium`), enzymes nommées (`calpaïne`) — n'ont **légitimement aucun synonyme**. Jenni répond alors `SYN_FR: -` / `SYN_EN: -` (réponse valide, cf. BQ `charte_jenni_regles_operationnelles_enrichissement` §3). Conséquences **codées** : (a) `thesaurus_completion.audit_thesaurus(axis='all')` ne combine que **BT + DEF** — l'axe `syn` est exclu du déclencheur (mais reste interrogeable explicitement pour une passe synonymes dédiée) ; (b) l'indicateur `check_integrity.check_terms_syn_en` (« Termes EN sans syn_en ») a été **retiré**. Sans ces garde-fous, chaque import de termes sans synonyme gonflait un faux signal d'audit et renvoyait ces termes en boucle à Jenni via `export_thesaurus_incomplets`.\n\n### Anti-patterns confirmés\n\n- **Pas d'agent Task pour rédiger les définitions** des termes candidats (BQ `pas_agent_redacteur`). Extraction → liste → Jenni rédige.\n- **Pas de scan régex « tout-en-un »** sur le thésaurus complet — séparer les axes (A/B/C/D/E/F/G/H) pour traçabilité et reprise partielle.\n- **Pas de re-passe complète après chaque correction mineure** — batch les corrections puis re-audit ciblé.\n- **Pas d'oubli des orphelines BT/RT** après import — re-résolution périodique obligatoire (gain 5-10 % par passe, BQ `thesaurus_workflow` §H.2).\n\n### Voir aussi\n\n- BQ `audit_corpus` — pendant côté corpus (chaînes, cards, fiches)\n- BQ `wf_analyse` — pattern agent_runner unifié\n- BQ `strategie_agents` — anti-timeout, écriture progressive\n- BQ `thesaurus_workflow` — workflow import/export complet\n- BQ `thesaurus_workflow` §H — doctrine import legacy docx (ex-§H de #146, archivé 2026-07)\n- BQ `concept_cards_filtre_de_rigueur_une_affirmation_ba` — cards comme filtre + outil d'audit\n- BQ `sujets_interdits_corpus` — biodynamie/Steiner exclus\n- BQ `pas_agent_redacteur` — règle absolue rédaction\n- BQ `audit_integrite_db` — sanity check DB technique\n", "type": "workflow", "crit": false}, {"id": 156, "titre": "Audit du corpus — chaînes causales, concept cards, fiches", "contenu": "## Audit du corpus — chaînes causales, concept cards, fiches\n\nL'audit du corpus est le **chantier conscient** qui éprouve la cohérence narrative et scientifique des artefacts éditoriaux : chaînes causales, concept cards, fiches. Distinct de l'audit thésaurus (BQ `audit_thesaurus`) qui éprouve l'ossature lexicale, et de l'audit d'intégrité (BQ `audit_integrite_db`) qui éprouve les FK et schémas, cet audit éprouve la **doctrine** : ce que le corpus affirme tient-il debout ?\n\n### Objectifs canoniques\n\n| Axe | Objectif | Sortie attendue |\n|---|---|---|\n| **C1. Chaînes causales — étapes nourries** | Vérifier que chaque étape (`chain_etapes`) a son `term_id`, son `role_dans_chaine` rédigé, sans placeholder résiduel `[XX]` | Rapport par chaîne (Cn → étapes complètes vs trous) |\n| **C2. Chaînes causales — étapes orphelines / à enrichir** | Identifier les étapes peu nourries par le corpus (fiches/cards qui ne renvoient pas à la chaîne), proposer enrichissement | Liste des étapes à étoffer + cards/fiches candidates |\n| **C3. Chaînes causales — nouvelles chaînes implicites** | Détecter les enchaînements causaux mentionnés dans plusieurs fiches sans qu'une chaîne formalisée les capture | Propositions de nouvelles chaînes Cn+1, Cn+2, … |\n| **K1. Concept cards — santé de la collection** | Inventaire actives vs archives, cohérence dimension, links manquants, cards orphelines (sans terrain_test, sans link, sans pedago_link) | Tableau santé par dimension |\n| **K2. Concept cards — confronter aux fiches récentes** | Pour chaque fiche `integre*` récente, vérifier que les cards de score ≥ 5 ont reçu `[Apport fiche #N]` dans `notes` (cf. BQ `wf_fiche_integration` phase 4bis) | Liste des renforcements omis |\n| **K3. Concept cards — contradictions doctrinales** | Vérifier explicitement les `concept_card_links.link_type='contradicts'` (BQ `cards_contradictions` #112) — pas d'heuristique texte | Rapport des contradictions actives à arbitrer |\n| **K4. Cards comme filtre amont** | Vérifier qu'aucune fiche `integre*` ne porte une affirmation contredite par une card `archive` (mémoire de rejet) | Alertes éditoriales pour relecture JMJ |\n| **F1. Fiches — intégrité contenu** | `fiche_retour_sections` non vide pour les `integre*`, `refs` cache cohérent avec `source_usages` | Liste des fiches avec dette technique |\n| **F2. Fiches — articulation entre fiches** | Détecter les fiches qui se recouvrent sans articulation explicite dans `fiches.notes` (`[Articulation fiche #N]`) | Propositions de cross-références |\n| **F3. Fiches — propagation vers prompts docs cibles** | Pour chaque fiche `integre*`, vérifier que `prompts.contexte_sci` ou `.enrichissement` des `docs_cibles` mentionne le sujet | Liste des propagations omises |\n| **F4. Fiches — anglicismes résiduels** | Scan `audit_anglicismes.py` sur fiches en cours + contenu intégré | 0 anglicisme non glosé |\n\n### Concept cards comme outil d'audit (rôle 5 — BQ `concept_cards_filtre_de_rigueur_une_affirmation_ba`)\n\nLes concept cards sont **un instrument d'audit double** :\n\n1. **Filtre amont** (production) : `audit_cards_first` — avant toute création de fiche, terme, validation, l'agent lance `SELECT FROM concept_cards WHERE …` sur les keywords du domaine. Si une card `active` couvre le sujet → enrichir cette voie. Si une card `archive` rejette une affirmation proche → renoncer ou justifier la rupture.\n\n2. **Stress-test aval** (audit) : confronter chaque artefact éditorial du corpus aux cards correspondantes. Cette confrontation produit :\n   - Des **alertes éditoriales** (axe K4) quand une affirmation dans une fiche entre en tension avec une card de la même dimension.\n   - Des **propositions de renforcement** (axe K2) quand une fiche apporte de la matière à une card existante (synthèse 3-5 lignes dans `concept_cards.notes`).\n   - Des **propositions de nouvelles cards** quand une fiche mobilise un mécanisme/concept récurrent que le réseau actuel ne capture pas.\n   - Des **liens `concept_card_links`** à tisser explicitement (`completes`, `contradicts`, `prerequisite`, `derives_from`, `related_to`, `supersedes`, `example_of`).\n\nL'audit doit produire un récap des cards-hubs (cards les plus citées via `pedago_links`, BQ `pedago_links`) et des cards-orphelines (jamais référencées) pour décision : enrichir, articuler, ou archiver.\n\n### Chaînes causales comme outil d'audit\n\nLes chaînes (BQ `chaines_doctrine` #144) sont **les démonstrations transverses** du corpus. L'audit éprouve :\n\n- Chaque chaîne a-t-elle ses étapes complètement rédigées (pas de placeholder, term_id obligatoire) ?\n- Les fiches récemment intégrées **nourrissent-elles** des étapes existantes (mention « voir fiche #N » dans `chain_etapes.role_dans_chaine`) ?\n- Y a-t-il des **chaînes implicites** dans le corpus que la collection actuelle ne formalise pas (axe C3) ?\n- Les cards de chaque dimension sont-elles connectées à au moins une chaîne via `card_chain_links` ?\n\n```sql\n-- Audit étapes incomplètes — VRAIS placeholders de dette uniquement.\n-- ATTENTION : les renvois éditoriaux « [voir fiche #N … pour développement] »\n-- dans role_dans_chaine sont LÉGITIMES (annotations de croisement, ~126 étapes),\n-- PAS des placeholders → exclus, sinon faux positif massif (constat 2026-05-26).\nSELECT chain_id, position, term_fr_text FROM chain_etapes\nWHERE term_id IS NULL\n   OR term_fr_text LIKE '[%'\n   OR (role_dans_chaine LIKE '%[%]%' AND role_dans_chaine NOT LIKE '%[voir %');\n\n-- Audit term_fr_text désynchronisé de terms.fr\nSELECT ce.chain_id, ce.position, ce.term_fr_text, t.fr\nFROM chain_etapes ce JOIN terms t ON t.id=ce.term_id\nWHERE ce.term_fr_text != t.fr;\n\n-- Cards d'une dimension sans aucune chain_etapes liée\nSELECT cc.id, cc.title FROM concept_cards cc\nLEFT JOIN card_chain_links ccl ON ccl.card_id=cc.id\nWHERE cc.status='active' AND cc.dimension_id=<N> AND ccl.card_id IS NULL;\n```\n\n### Pipeline d'audit en 7 passes (pattern `agent_runner`)\n\nL'audit corpus est éclaté en passes modulaires alignées avec `tools/batch/analyse_corpus.py` (BQ `wf_analyse` #140).\n\n| Passe | Code | Objectifs | Contexte agent | Risque timeout |\n|---|---|---|---|---|\n| **S1** | Sections/contradictions | Cohérence inter-sections (contradictions de fond entre fiches) | Sections + fiches `integre*` | **Élevé** — split par strate |\n| **S2** | Source unique | Concept défini une seule fois (pas de doublon thésaurus/section) | Sections + thésaurus condensé | Modéré |\n| **C1** | Chaînes documen
