les multiples, chacune avec ses ratios, ses substrats, ses cycles d'activation et de réactivation. Quelques exemples reconnus :\n\n- **LiFoFer** (Terre & Humanisme, France) — litière forestière + son + petit-lait + mélasse\n- **MM (Microorganismos de Montaña)** (Costa Rica, Amérique centrale/Sud) — humus de forêt + son + mélasse, activation liquide ciblée 5-9 j (champignons/bactéries selon usage feuille ou sol)\n- **Super Magro** (D. Pinheiro Machado, Brésil ; large diffusion en Afrique) — biofertilisant multi-éléments, fumier frais + cocktail minéral (Zn, Mn, B, Co, Cu, Mg, Ca…) fermenté ~30 j\n- **KNF / Korean Natural Farming** (Cho Han-Kyu, Corée) — IMO, FPJ, FFJ, OHN, LAB collectés de niches précises\n- **JADAM** (Cho Youngsang, Corée) — version simplifiée et low-cost du KNF\n- **Bokashi** (Japon, EM-Kyusei) — son + EM commercial, fermentation rapide\n\nAucune de ces pratiques n'est universellement supérieure ; chaque culture a optimisé pour son climat, ses ressources locales, son échelle. **Le corpus retient T&H comme référence pédagogique** parce que :\n1. Documentation accessible en français, datée et reproductible\n2. Pratique JMJ sur 4 ans validée\n3. Ratios cohérents avec les principes physiologiques généraux de la lacto-fermentation\n\nPour les autres traditions (MM, Super Magro, KNF…), le corpus renvoie aux sources de chaque école sans prétendre arbitrer les divergences.\n\n**Variante française — fermentation lactique de plantes** : en parallèle de l'activation liquide LiFoFer, certains praticiens français fermentent des plantes (ortie, consoude, prêle, fougère, achillée…) selon le **même principe lactique anaérobie**. C'est une variante des **purins classiques** mais avec un mécanisme bien différent :\n- **Purins classiques** = putréfaction anaérobie (pH neutre/alcalin, odeurs ammoniacales, dégradation par bactéries protéolytiques)\n- **Fermentation lactique de plantes** = acidification rapide < pH 4.5, conservation longue (mois/années), peu d'odeurs, biomasse LAB intégrée\n\nCette variante combine les bénéfices de la LiFoFer (inoculum LAB stable) avec les principes actifs des plantes (silice, alcaloïdes, dérivés salicylés…). Cohérente avec le reste de la pratique, elle reste une adaptation locale parmi d'autres.\n\n### Les pratiques dépendent de l'usage ciblé\n\nLa recette, la dilution, la fréquence d'application et le choix de repiquer ou non dépendent directement de **l'usage final** :\n\n- **Application foliaire** (pulvérisation sur feuilles) — biostimulation + défense. Dilution typique 1:100 à 1:500. Nécessite une biomasse microbienne vivante → activation récente (< 7 j après production).\n- **Destruction de couvert** (terminer un engrais vert) — la fermentation lactique acidifie et lyse les tissus végétaux, restitue C/N plus rapidement qu'un simple roulage. Doses plus concentrées (1:10 à 1:50).\n- **Litière animaux** (poulaillers, étables, porcheries) — approche type Bokashi : inoculation de la litière qui fermente sur place, réduit odeurs (NH₃, H₂S), valorise fumier. Application directe ou dilution 1:100.\n- **Biostimulants** (catégorie réglementaire UE 2019/1009 — terme propre, vs « phytothérapie » réservé au soin médical *par* les plantes, vs « phytosanitaire » confisqué par le langage réglementaire pour les pesticides) — renforcement des défenses naturelles, compétition avec pathogènes, ISR/SAR. Fermentations de plantes acides (ortie, consoude, prêle) en complément. Dilution 1:50 à 1:200.\n- **Amendement de sol** — application au sol avant travail ou semis, plus tolérant sur la fraîcheur biologique.\n\n**Conséquence sur le repiquage** : plus l'usage exige une richesse microbienne fongique (foliaire défense, biostimulants), plus la doctrine « litière fraîche à chaque batch » est importante. Pour un usage amendement de sol ou litière animaux, un repiquage modéré est moins critique car l'écosystème sol/litière réensemence ensuite.\n\n---\n\n---\n\n## Pourquoi pas de réactivation / repiquage en série (LiFoFer, bokashi, KNF, MM)\n\nPosition corpus : une LiFoFer se refait toujours **à partir de litière forestière fraîche** pour la phase solide. Le repiquage de la phase liquide est tolérable à la rigueur (gros exploitants).\n\n### Argument principal — appauvrissement progressif\n\nCertains guides (notamment *Recettes-Lifofer-solides-liquides-et-reactivations*, 2023) proposent de prélever une partie d'une mère pour amorcer la suivante, et de réitérer 5-6 fois. Cette pratique **dégrade** progressivement le produit pour deux raisons :\n\n**1. Sélection des rapides au détriment de la diversité**\nLa valeur d'une LiFoFer est dans l'**inoculum massif et diversifié** apporté par la litière fraîche : milliers d'espèces de bactéries, levures, champignons, archées en coexistence. En repiquant depuis une mère, on ne récupère que la fraction végétative active (majoritairement LAB — *Lactobacillus*, *Leuconostoc*, *Pediococcus*) qui a dominé la fermentation. Chaque repiquage resserre le cortège sur les souches les plus compétitives en conditions anaérobies acides.\n\n**2. Les spores ne se multiplient pas — argument décisif**\nPendant la fermentation lactique anaérobie, les spores (champignons, actinomycètes, bactéries sporulantes comme *Bacillus* ou *Clostridium*) restent en état **dormant**. Elles ne se multiplient pas dans le milieu acide/anaérobie. Au repiquage, on transfère donc surtout la biomasse LAB active, peu de spores. Après 5-6 repiquages, le pool de spores est mécaniquement **appauvri** par dilution (chaque mère contient 1/Nᵏ des spores initiales, où N est le facteur de dilution et k le nombre de repiquages).\n\nRésultat : une mère de 6ᵉ génération a perdu l'essentiel de son **patrimoine fongique** (mycélium, spores actinomycètes) même si elle reste vigoureuse en activité LAB.\n\n### Nuance : gros exploitants\n\nLa doctrine « litière fraîche à chaque batch » s'applique strictement à l'échelle artisanale (60-220 L). Pour de **gros exploitants** qui produisent en fûts 220 L de mère puis en IBC 1000 L, le coût logistique de refaire à zéro à chaque cycle peut justifier un repiquage limité — en gardant à l'esprit la perte de diversité.\n\n**Phase liquide activée** : tolérable à la rigueur. La liquide a déjà perdu une part de la biodiversité solide (sélection durant la phase d'activation), et certains usages (foliaire, fertirrigation) ne nécessitent pas la richesse fongique complète.\n\n**Phase solide (mère)** : refus catégorique du repiquage en série — c'est là que le patrimoine fongique compte le plus.\n\n### Doctrine opérationnelle\n\n- Échelle artisanale : **toujours repartir d'une litière forestière fraîche** à chaque batch de mère.\n- Échelle industrielle (IBC 1000 L) : repiquage liquide acceptable, repiquage solide à éviter.\n- Sur 4 ans de pratique JMJ (60-220 L) : litière fraîche = résultats reproductibles et constants.\n\n### Ce qu'on peut réutiliser sans repiquage en série\n\n- La **mère solide** : un même batch peut servir plusieurs activations liquides (prélever 5% à chaque fois).\n- La **liquide activée** : peut s'appliquer pendant 1-2 semaines après production (au-delà, qualité décroît).\n\n### Références\n\n- Terre & Humanisme, *Guide LiFoFer* (valeurs retenues — cf. lifofer_recettes en DB)\n- *Recettes-Lifofer-solides-liquides-et-reactivations.pdf* (2023) : proposition de repiquage 5-6 fois — **position corpus : non pour la solide, à la rigueur pour la liquide chez les gros exploitants**.\n\n### Note éditoriale — réglementation PNPP\n\nLa réglementation française PNPP (Préparations Naturelles Peu Préoccupantes, Code rural art. L253-1, liste positive ANSES) et le règlement UE 2019/1009 (biostimulants) encadrent strictement la commercialisation de ce type de préparation. Les recettes LiFoFer/MM/Bokashi en tant que tels ne figurent pas dans la liste positive ANSES.\n\n**Position éditoriale du corpus** (responsabilité assumée par JMJ) : les recettes sont publiées à des **fins pédagogiques** pour usage personnel à la ferme, sans aucune visée commerciale. Le corpus n'est pas un avis juridique et chaque praticien reste responsable de la conformité de son usage selon son contexte (autoconsommation vs vente, ferme vs jardin, plantes traitées, etc.). Ces recettes sont par ailleurs **largement diffusées** dans la sphère agroécologique francophone (livres T&H grand public, chaînes YouTube, MOOC paysans, formations Maraîchage Sol Vivant…) — le corpus en propose une compilation pédagogique cohérente, sans diffuser d'information non publique. Enfin, le corpus **ne vend rien et ne promet rien** — aucun produit n'est commercialisé, aucune allégation sanitaire (efficacité contre maladie/ravageur, rendement garanti, etc.) n'est faite. Le corpus reste hors du périmètre opérationnel de la réglementation PNPP, qui cible la commercialisation et la communication promotionnelle de préparations à usage phytosanitaire.\n\n## Contexte\n\nDoctrine 2026-04-23. Argument décisif : spores ne se multiplient pas en anaérobiose lactique. Nuance gros exploitants IBC 1000L : liquide tolérable, solide non.\n", "type": "doctrine", "crit": false}, {"id": 151, "titre": "pedago_links — table générique entité ↦ concept_card (passerelle pédagogique)", "contenu": "## pedago_links — table générique de liens « entité ↦ concept_card »\n\n**Mécanisme** : table normalisée, FK vers `concept_cards`, qui permet de\nproposer pédagogiquement à l'utilisateur, à côté de toute entité du corpus\n(fiche, doc de strate, règle C/N, terme, matière), les concept cards\nles plus pertinentes pour aller plus loin.\n\n### Schéma\n\n```sql\nCREATE TABLE pedago_links (\n    id          INTEGER PRIMARY KEY AUTOINCREMENT,\n    entity_type TEXT NOT NULL CHECK(entity_type IN ('fiche', 'doc', 'regle', 'terme', 'matiere')),\n    entity_id   INTEGER NOT NULL,\n    card_id     INTEGER NOT NULL REFERENCES concept_cards(id) ON DELETE CASCADE,\n    role        TEXT NOT NULL DEFAULT 'reference' CHECK(role IN ('primaire', 'reference', 'passerelle')),\n    ordre       INTEGER NOT NULL DEFAULT 0,\n    motif       TEXT,\n    created_at  TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    UNIQUE(entity_type, entity_id, card_id)\n);\nCREATE INDEX idx_pedago_links_entity ON pedago_links(entity_type, entity_id);\nCREATE INDEX idx_pedago_links_card   ON pedago_links(card_id);\n```\n\n**entity_id** :\n- pour `fiche` → `fiches.id`\n- pour `doc`   → `documents.ROWID` (car PK = `code` TEXT, on stocke le ROWID INTEGER stable)\n- pour `regle` → `refs.legacy_id` (cn_regle ; même convention que mo_calc)\n- pour `terme` → `terms.id`\n- pour `matiere` → `refs.id`\n\n### Pourquoi une table et pas un JSON dans la colonne data\n\n- **FK = updates propagés** : si une card est désactivée/renommée, la jointure\n  active reste cohérente (on filtre `status='active'`). Un JSON figé pointerait\n  vers un ID qui n'existe plus.\n- **Vues inverses** : `SELECT entity_type, entity_id FROM pedago_links WHERE card_id=N`\n  donne instantanément « qui pointe vers cette card », utile pour l'audit.\n- **Évolution** : ajouter un nouvel entity_type est une simple modif du CHECK,\n  rien à migrer dans 50 colonnes JSON.\n\n### Workflow d'alimentation\n\n```\n1. tools/admin/pedago_links_suggest.py --entity fiche|doc\n   → jmj/rapports/audit_data/pedago_links_proposed_<entity>_<date>.{md,json}\n   Score Overlap pondéré IDF + bonus titre :\n     - 70% recall(card_title, fiche_title)\n     - 30% recall(card_title, fiche_full)\n   Tokenizer : split sur '/' '-', stem singulier/pluriel, seuil 3 chars\n   (acronymes CEP/NPK/AMG indispensables).\n\n2. (Validation JMJ — édition manuelle du JSON si besoin)\n\n3. tools/admin/pedago_links_apply.py --json <rapport.json> --entity-type fiche|doc\n   → INSERT en bloc, role='primaire' pour top1 si score >= --primary-min,\n     role='reference' pour suivants si score >= --reference-min,\n     max --max-per-entity liens par entité.\n   --dry-run pour preview, --replace pour repartir de zéro.\n\n4. python3 tools/regen_all.py --db sol_vivant.db\n   → cahier.html, index.html (docs strates), pages outils via build_comprendre_data\n     affichent automatiquement le bloc « Pour aller plus loin — Concept Cards (N) »\n     juste avant Sources, sous chaque entité.\n```\n\n### Rendu côté front\n\nBloc `SvCollapse title='Pour aller plus loin — Concept Cards (N)' icon='🧭'`\ncontenant une liste verticale de liens vers `concept_cards.html#card-N` avec :\n- badge **#N** colorié selon `role` (info pour primaire, gris pour reference)\n- titre de la card\n\nPrésent actuellement dans :\n- **cahier.html** (sous chaque fiche déployée, via `gen_cahier.py`)\n- **index.html** (sous chaque doc strate, via `gen_web.py`)\n- **mo_calculateur.html** (sous chaque règle C/N via `cards_pedago` dans\n  `refs.cn_regle.data` — pré-existant, pattern complémentaire à pedago_links)\n- pages outils via `build_comprendre_data` (sections `fiche` enrichies)\n\n### Cas d'usage futurs\n\n- **Étendre** à `entity_type='regle'` (déjà fait dans cards_pedago via JSON,\n  à migrer vers pedago_links pour homogénéité)\n- **Étendre** à `entity_type='terme'` (un mot-clé ↦ cards qui le détaillent)\n- **Étendre** à `entity_type='matiere'` (matière MO ↦ cards minéralisation/immo)\n- **Audit hub** : `SELECT card_id, COUNT(*) FROM pedago_links GROUP BY card_id`\n  → cards qui sont les nœuds pédagogiques majeurs du corpus\n- **Cards orphelines** : `SELECT id FROM concept_cards WHERE id NOT IN\n  (SELECT card_id FROM pedago_links)` → cards jamais référencées comme\n  passerelle pédagogique, candidates à archivage ou enrichissement\n\n### État (dashboard fait foi)\n\n- **702 liens** au total : 676 sur fiches + 26 sur docs de strate\n- Premier passage 2026-04-23 : 111 liens (85 fiches + 26 docs). Le corpus s'est densifié depuis — `pedago_links_suggest.py` ré-exécuté sur corpus enrichi (les chiffres bougent à chaque passe ; le dashboard fait foi).\n- Hubs pédagogiques et cards orphelines : voir les requêtes d'audit ci-dessous (« Cas d'usage futurs »).\n\n### Règle absolue\n\nToujours **passer par `pedago_links_suggest.py` puis `pedago_links_apply.py`** plutôt que\nd'éditer les liens à la main : le scoring est tracé via `motif`, et la\nreproductibilité (ré-exécuter sur un corpus enrichi) est garantie. Les\nexclusions manuelles s'éditent dans le JSON proposé avant `pedago_links_apply`.\n\n## Contexte\n\nDoctrine ajoutée 2026-04-23 lors de la généralisation du pattern « cards pédagogiques liées » apparu sur le calculateur MO (cards_pedago dans refs.cn_regle.data) puis étendu aux fiches et docs.\n", "type": "doctrine", "crit": false}]}}, "pipeline": {"docs": {"nom": "Pipeline docs strate", "entries": [{"id": 148, "titre": "Documents de strate — définition et taxonomie", "contenu": "## Documents de strate — définition et taxonomie\n\n### Définition canonique\n\n> **Un document de strate est une partie structurante du corpus, rédigée autour d'un axe thématique précis, couvrant un périmètre défini par sa place dans la carte F/S/V/P/H.**\n\nLes 18 documents composent l'ossature éditoriale du corpus. Chaque document est unique, fixé dès la conception du projet, et couvre un angle qui ne se recoupe que partiellement avec les autres. À la différence des fiches (zoom d'un point précis), un document de strate est une **synthèse organisée** qui couvre son sujet en profondeur sur plusieurs chapitres et sections.\n\n### Les 18 documents du corpus\n\n| Strate | Code | Titre | Position plan |\n|---|---|---|---|\n| F (Fondements) | F1 | Le Temps Long | P1 |\n| F (Fondements) | F2 | L'Économie du Vivant | P2 |\n| S (Sol) | S0 | L'Eau dans le Sol Vivant | P5 |\n| S (Sol) | S1 | Architecture du Sol | P6 |\n| S (Sol) | S2 | Le Microbiome du Sol | P7 |\n| S (Sol) | S3 | Le Microbiome Fongique et Mycorhizien | P8 |\n| S (Sol) | S4 | Le Carbone et les Grands Cycles | P9 |\n| V (Vivant) | V1 | La Faune du Sol | P10 |\n| V (Vivant) | V2 | L'Holobionte Plante-Microbiome | P11 |\n| V (Vivant) | V3 | Les Fermentations Microbiennes | P12 |\n| P (Pratiques) | P1 | Diagnostic du Sol Vivant | P13 |\n| P (Pratiques) | P2 | Agriculture de Conservation | P14 |\n| P (Pratiques) | P3 | Biostimulants et Fermentations Appliquées | P15 |\n| P (Pratiques) | P4 | Agroforesterie et Systèmes Pérennes | P16 |\n| P (Pratiques) | P5 | La Transition | P17 |\n| H (Humain) | H1 | Sol, Alimentation et Santé Humaine | P19 |\n| H (Humain) | H2 | Le Microbiome Intestinal | P18 |\n| H (Humain) | H3 | La Résistance Antimicrobienne | P20 |\n\n### Ce qu'un document EST\n\n- Une synthèse structurée en chapitres et sections sur un axe thématique précis\n- Un texte long (15-40 k mots rédigés) construit pour servir de socle éditorial\n- Un élément fixe de l'ossature du corpus (les 18 docs sont définis, pas créés à la demande)\n- Un cadre nourri par les fiches transversales et zooms intégrés au fil du temps\n\n### Ce qu'un document N'EST PAS\n\n- Une fiche (zoom court d'un point précis) — voir BQ `fiche_definition`\n- Une validation d'affirmation ou de chaîne — voir BQ validations\n- Un document créé à la demande — les 18 docs sont fixés dès la conception\n\n### Tables du modèle\n\n- **`documents`** : métadonnées (code, titre, strate, statut, mots_cible_min/max, doc_maitre, note)\n- **`prompts`** : sections du plan (une ligne par section avec type `intro`/`section`/`conclusion`), champs `chapitre`, `section`, `titre_h1`, `titre_h2`, `titre_h3`, `contexte_sci`, `instructions`, `enrichissement`, `style`, `tableau`, `ordre`, `statut`\n- **`doc_contenus`** *(table anticipée, non implémentée en 2026-06)* : contenu rédigé INTÉGRÉ des docs de strate (blob markdown, `contenu_integre`, `refs` JSON, versionné). À créer quand le premier doc de strate sera intégré — ils sont actuellement tous `a_rediger`. `pedago_links_suggest.py --entity doc` la gère défensivement (`try/except sqlite3.OperationalError`).\n- **`jenni_doc_specs`** : métadonnées amont du prompt de document (titre_jenni, angle_entree, public, priorite, style global)\n- **`source_usages`** : FK vers `sources` quand le doc cite des refs déjà en DB\n\n### Vues utiles\n\n- `v_prompts_actifs` — prompts de sections en cours\n- `v_prompts_incomplets` — sections sans contexte_sci ou instructions\n- `v_avancement` — état du cycle de production par doc\n- `v_sante` — dashboard santé globale du corpus\n\n", "type": "reference", "crit": false}]}, "fiches": {"nom": "Pipeline fiches", "entries": [{"id": 69, "titre": "Fiches — définition et taxonomie", "contenu": "## Fiches — définition et taxonomie\n\n### Définition canonique\n\n**Une fiche est un document à part entière au service du corpus, qui exerce\nsimultanément deux fonctions :**\n\n1. **Zoom** — approfondissement ciblé sur une partie clef du corpus (un\n   mécanisme, un concept, une controverse, une pratique).\n2. **Service au corpus** — son contenu vient répondre à un besoin précis\n   identifié dans le corpus :\n   - Combler une **lacune** documentée (sujet absent, paradigme manquant)\n   - **Valider** une affirmation existante avec sources et données récentes\n   - **Contredire** ou nuancer un consensus daté\n   - **Articuler** plusieurs strates autour d'un mécanisme transversal\n   - **Arbitrer** une controverse scientifique active\n\nChaque fiche doit être briefée comme un cas particulier — il n'y a pas de\nfiche standard. Le besoin précis qu'elle vient servir est documenté dans\n`fiches.notes` au moment de sa création.\n\n### Sous-types (`fiches.type`)\n\n| Type | Usage | Structure |\n|---|---|---|\n| `transversale` | Articule plusieurs strates autour d'un mécanisme, d'une controverse ou d'une cascade | Title + Intro + 6-7 H1 body + Résumé + Références (auto) |\n| `zoom` | Approfondissement ciblé sur un point précis (ex : Kirkby/AMG, Drilosphère) | Même structure, généralement 5-6 H1 body |\n| `technique` | Protocole DIY, méthode de mesure, préparation biologique | Charte dédiée 5 H2 immuables — voir BQ `charte_fiches_techniques_diy` |\n| `pedagogique` | Fiche de vulgarisation / orientation méta (cluster #254-263) | Pas de bibliographie APA propre par construction — ses sources vivent dans les cards et fiches d'appui |\n\n### Origine de la rédaction — fiche académique vs fiche agent\n\nAxe **orthogonal** aux sous-types : selon la nature du sujet et des sources\ndisponibles, une fiche relève de l'un de **deux régimes de rédaction**.\n\n| Régime | Sujet | Sources admises | Rédacteur |\n|---|---|---|---|\n| **Fiche académique** | Concept / mécanisme **scientifique** (ce que dit la science) | **Académiques en open access uniquement** (comité de lecture, DOI) | **Subagent rédacteur** (sous supervision GLM, recherche Semantic Scholar + plan + rédaction MD) → Conseil d'audit + apply par GLM |\n| **Fiche agent** | Sujet **non (encore) couvert par la science académique** mais **officiellement reconnu** | Organismes officiels de confiance : think tanks experts (ex. **The Shift Project**), agences, institutions | **Subagent rédacteur** (sous supervision GLM), ou GLM en direct sur instruction explicite de JMJ |\n\n- **Fiche académique** (cas standard, ex-régime « Jenni ») : on extrait ce que\n  la science établit d'un mécanisme — *les principes de la lactofermentation*,\n  pas *« LiFoFer »*. Un subagent (general ou spécialisé) effectue la recherche\n  via `tools/veille/semantic_scholar.py`, rédige en MD natif (manifeste),\n  puis GLM intègre avec Conseil d'audit.\n- **Fiche agent** : pour ce que la science n'a pas (encore) formalisé mais\n  qui est porté par des sources **officiellement reconnues et de confiance**.\n  Le matériau est audité puis intégré au corpus, et un subagent (ou GLM en\n  direct) rédige la synthèse. Les pratiques praticiennes (KNF, JADAM,\n  LiFoFer…) en sont un autre cas — cf. `pratiques_typees_hors_jenni`.\n- **Pseudoscience strictement interdite** dans les deux régimes, quelle que\n  soit la popularité ou la diffusion du sujet (cf. BQ `sujets_interdits_corpus`).\n\n**Critère opérationnel** : la question a-t-elle une réponse dans la\nlittérature scientifique ?\n- Oui — c'est un **mécanisme générique** (*combien de sucre pour réussir une\n  lactofermentation dans les règles de l'art ?*) → **fiche académique**\n  (recherche académique obligatoire).\n- Non — elle ne porte que sur une **recette / protocole typé** (*combien de\n  sucre dans la LiFoFer ?*, non établi scientifiquement) → **fiche agent**,\n  qui décortique le mécanisme générique sous-jacent et cite la préparation\n  comme simple instance.\n\n**Règle de cloisonnement** : une source non académique (think tank,\norganisme officiel, manuel praticien) peut **fonder une fiche agent** mais\nne doit **jamais** figurer comme source citable dans une **fiche académique**\n— les sources académiques proviennent exclusivement de Semantic Scholar\n(open access académique).\n\n> **Paradigme « agent pilote » (2026-07-13)** : la voie de production\n> l'API d'audit Session A est **abandonnée**. Les subagents (l'orchestrateur +\n> Task) sont la seule voie active de rédaction éditoriale, sous supervision\n> JMJ. Cf. BQ `pas_agent_redacteur` (routing des modèles). Le format de\n> handoff canonique entre subagent rédacteur et intégration DB est le\n> **manifeste MD** (ex. `jmj/rapports/manifeste_<slug>.md`).\n\n### Cycle de vie\n\n**`fiches.statut`** — 3 valeurs seulement (DEFAULT `'jenni'`) :\n\n```\njenni     → pas encore intégrée (à produire par subagent sous supervision)\nintegree  → intégrée (rendu disponible dans fiche_retour_sections)\narchive   → obsolète\n```\n\n- **Cahier** : `integree` → l'intégration ; `jenni` → à produire.\n- **Intégration validée** → `fiches.statut='integree'`.\n\n### Tables du modèle\n\n- **`fiches`** — métadonnées (slug, titre, type, **`is_diy`** = `0` | `1`,\n  strates, docs_cibles, **`statut` = `jenni` | `integree` | `archive`**\n  (DEFAULT `'jenni'`), `priorite_envoi`, `notes` = brief éditorial).\n  - **`is_diy`** : axe **orthogonal** au type. Marque les fiches du domaine\n  praticien DIY (KNF, JADAM, LiFoFer, EM, bokashi, Jeevamrit, natural\n  farming, fermentations/préparations à la ferme) — quel que soit le type.\n  Une fiche DIY **peut** être traitée par subagent tant que l'angle reste\n  académique. Le flag permet d'inclure/exclure ces sujets dans audits/exports.\n- **`fiche_retour_sections`** — texte du **contenu intégré**, par section\n  (`section` + `sous_section`, `titre`, `contenu`, `analyse_agent`). Source\n  unique du texte intégré (depuis la refonte 2026-06-08 qui a supprimé\n  l'ex-blob `fiche_contenus.contenu_integre`). `niveau` est dérivé de\n  `(section, sous_section)` quand un numéro est présent.\n- **`v_fiche_refs`** (vue, depuis 2026-07-05) — cache dérivé `refs` (JSON)\n  régénéré à la volée depuis `source_usages` + `sources` (une ligne par\n  fiche). Remplace l'ancienne table physique `fiche_contenus` (DROP same date).\n- **`source_usages`** — source de vérité pour les liens fiche ↔ sources\n  (`source_id`, `entity_type='fiche'`, `entity_id`, `contexte` = titre de\n  section où la ref apparaît, `citation_brute`).\n- **`fiche_articulations`** — liens N-N fiche ↔ fiche (`from_id`, `to_id`,\n  `pivot`, `direction`).\n\n", "type": "reference", "crit": false}, {"id": "wf_fiche_validation", "titre": "Question de validation — arbitrage scientifique ciblé", "contenu": "## Question de validation — arbitrage scientifique ciblé\n\n**Une question de validation n'est PAS une fiche à proprement parler** —\nc'est la **réponse à une demande de validation ou d'arbitrage scientifique**\nconfrontant une affirmation, une prédiction ou une hypothèse du corpus à la\nlittérature académique récente. Sur le plan **conceptuel**, c'est un objet\ndistinct d'une fiche pédagogique (qui documente un mécanisme pour le corpus).\n\nSur le plan **workflow technique**, la question de validation emprunte le\npipeline de production canonique (tables `fiches` + `source_usages`, subagent\nrédacteur sous supervision GLM) — mais avec un `type='zoom'`, un slug préfixé\n`validation-<sujet>`, un path de sortie distinct (`recherches/questions/`) et\nun naming distinct (`validation_<sujet>_<date>.md`). Voir section « Path et\nnaming » ci-dessous.\n\n### Principe directeur\n\n> **Une fiche de validation est un zoom réduit à l'extrême, qui pose à\n> l'API d'audit (via Semantic Scholar) un point précis demandant arbitrage\n> scientifique. l'API d'audit rédige ce point si elle trouve des sources\n> académiques en open access.**\n\nSymétrique de la fiche pédagogique classique qui **documente** un mécanisme\npour le corpus, la fiche de validation **interroge** la littérature pour\nvalider, nuancer ou infirmer une affirmation déjà présente (ou une hypothèse\némergente d'un Conseil).\n\n### Déclenchement — quand créer une fiche de validation\n\nDéclencher une fiche de validation quand :\n\n- Une **card pivot** ou une **prédiction testable** du corpus est audacieuse\n  et non encore sourcée (`source_usages` vide ou faible).\n- Un **Conseil multi-agents** a émis une hypothèse féconde mais non établie\n  (intersection inédite, prédiction transversale, pont entre deux champs).\n- Une **affirmation d'une fiche intégrée** doit être confrontée à la\n  littérature récente (cf. gâche 3 `audit_conscient` — vérification\n  indépendante externe).\n- Un **arbitrage doctrinal** doit être tranché par juge externe (Semantic\n  Scholar en mode \"juge de vérité\" — BQ `conseil_overview`).\n\n**Ne pas créer** de fiche de validation quand :\n\n- L'affirmation est déjà sourcée par plusieurs `sources` pertinentes →\n  utiliser `integrate_validation_refs.py` ou un audit ciblé, pas une production\n  l'API d'audit dédiée.\n- La question est triviale ou relève d'une simple lecture de PDF →\n  réponse directe agent + JMJ.\n- Le sujet est **non couvert par la science académique** → fiche agent\n  (règle `fiche_definition` § \"Origine de la rédaction\").\n\n### Différences avec une fiche zoom pédagogique\n\n| Dimension | Fiche zoom pédagogique | **Question de validation** |\n|---|---|---|\n| Concept | **Fiche** (document du corpus) | **Question** (demande d'arbitrage externe) |\n| Fonction corpus | Documenter un mécanisme | **Confronter une hypothèse à la littérature** |\n| Volume cible | 8-10k chars | **3-5k chars** |\n| Plan H1 body | 5-6 | **2-3** |\n| Rédaction | Dense mécanistique | **Dense + interrogative sur la question d'arbitrage** |\n| Style | Synthétique pédagogique | **Honnête sur les zones d'incertitude** |\n| l'API d'audit produit | Documentation + sources | **Verdict (confirmé / nuancé / infirmé) + sources** |\n| Critère de succès | Volume ×5-10, sources cohérentes | **Sources pertinentes sur l'intersection précise** |\n| **Path de préparation** | `recherches/fiches/fiche_<NNN>.md` | **`recherches/questions/validation_<sujet>_<date>.md`** |\n| **Slug** | `<sujet>` libre | **`validation-<sujet>`** (préfixe obligatoire) |\n| **Statut après intégration** | `fiches.statut='integree'` | **`fiches.statut='integree'`** (inchangé — workflow commun) |\n\n### Brief éditorial canonique (`fiches.notes`)\n\nLe brief est crucial : c'est lui qui cadre l'API d'audit. Format type :\n\n```\nBesoin corpus : validation d'hypothèse (intersection inédite)\n  — <formulation en 1 phrase de l'affirmation à valider>\n\nSources autoritaires à mobiliser :\n- <Auteur, année> — <notre source déjà mirror local qui pose une prémisse>\n- <Auteur, année> — <autre prémisse>\n- (les sources déjà dans source_usages seront injectées par l'API d'audit via GATHER\n  — ne pas les redonner dans le brief)\n\nDonnées chiffrées attendues :\n- <seuils, plages, indicateurs précis sur l'intersection>\n\nParadigmes à confronter :\n- <position corpus / hypothèse> vs <état de l'art literature>\n\nQuestion d'arbitrage (INTERNE — jamais dans le MD produit) :\n- <la question précise à laquelle l'API d'audit doit répondre>\n\nArticulation corpus (INTERNE — l'API d'audit le lit en DB lui-même) :\n- Cards concernées : #N, #M\n- Chaînes traversées : C<x>\n- Hypothèse testée : <prédiction card #N §X>\n\nAnti-effet d'ancrage : NE PAS révéler la prédiction dans le MD produit.\nPrésenter l'intersection comme une question ouverte, pas comme une affirmation\nà confirmer.\n```\n\n### Plan réduit canonique\n\nStructure PLATE avec **2-3 H1 body**\nau lieu de 5-6 pour un zoom pédagogique :\n\n```\n[intro]      Introduction                              (~400-500 chars)\n[section]    1. <Première signature ou prémisse>       (~800-1000 chars)\n[section]    2. <Seconde signature ou prémisse>        (~800-1000 chars)\n[section]    3. <Hypothèse d'intersection / question>  (~800-1000 chars)\n[conclusion] Résumé                                    (~300-400 chars)\n```\n\nSoit **3-5k chars total** pour le MD produit. Plafond strict 5k — au-delà,\nce n'est plus une validation ciblée, c'est une fiche pédagogique classique.\n\n### MD produit — ce qu'il pose\n\nCe que le MD d'une fiche de validation pose en ~800-1000 chars/section :\n\n- **La signature ou prémisse** (mécanisme établi, source déjà mirror local)\n- **Citations inline `(Auteur, année)`** des sources déjà en `source_usages`\n  — l'API d'audit les retrouvera via GATHER\n- **Les zones d'incertitude ou les limites** de la prémisse (modèle unique,\n  conditions expérimentales étroites, etc.)\n- **La question ouverte** (formulée honnêtement, sans révéler la prédiction\n  à confirmer)\n\nCe que le MD ne fait pas (anti-effet d'ancrage) :\n\n- Pas de métaphrase « l'API d'audit, confirme que X »\n- Pas de révélation de la prédiction à valider (sinon l'API d'audit hallucine une\n  confirmation par effet d'ancrage)\n- Pas de `[N]` numérique — **APA inline `(Auteur, année)` uniquement** pour\n  les sources fournies ; l'API d'audit ajoutera les siennes au format qu'elle veut\n- Pas de liste de 776 termes canoniques (bruit pour une question ciblée)\n- Pas de bibliographie fournie dans le MD — le bloc Références est\n  auto-généré par l'API d'audit depuis `source_usages`\n\n### Production subagent + intégration\n\n```\nPhase 1 — Production (cette BQ) — subagent rédacteur sous supervision GLM\n  Identifier l'hypothèse à valider → brief éditorial → subagent (general ou spécialisé)\n  → MD dans recherches/questions/\n\nPhase 2 — Intégration consciente (BQ wf_fiche_integration)\n  Parser MD + audit factuel (étapes 2-3 de wf_audit_factuel) pour anti-hallucination\n  + integrate_fiche.py --md + integrate_fiche_refs.py + Conseil d'audit\n```\n\n**Spécificité de l'intégration d'une fiche de validation** : le verdict de\nl'API d'audit (confirme / nuance / infirme) doit être confronté aux `source_usages`\nau retour. Si l'API d'audit affirme l'intersection sans DOI vérifiable → probabilité\nd'hallucination forte, auditer via `audit_factuel_arbitrage.py` (Semantic Scholar).\n\nSelon le verdict l'API d'audit, **UPDATE l'entité source** de la prédiction (card,\nfiche, chaîne) pour refléter le statut :\n\n- Verdict « confirmé » + sources vérifiées → prédiction établie\n- Verdict « à nuancer » → reformuler en hypothèse prudente\n- Verdict « infirmé » ou absence d'études → rétrograder ou supprimer la\n  prédiction\n\n### Statut DB et tables\n\nLa question de validation vit dans les **mêmes tables** que la fiche\nacadémique classique — pas de table dédiée. C'est la convention de slug +\npath + naming qui la distingue :\n\n- `fiches` (`type='zoom'`, `statut='jenni'` → `'integree'`, **slug\n  obligatoirement préfixé `validation-<sujet>`**)\n- `source_usages` (`entity_type='fiche'`, `entity_id=<id>`)\n\n### Path et naming canoniques\n\n**Pourquoi un path et un naming distincts de la fiche pédagogique** : la\nquestion de validation n'est pas un livrable du corpus — c'est un artefact\nde dialogue avec l'orchestrateur. La séparer dans `recherches/questions/` et\nla nommer `validation_<sujet>_<date>.md` (pas `fiche_<NNN>.md`) matérialise\ncette distinction conceptuelle.\n\n| Étape | Path | Naming |\n|---|---|---|\n| **Préparation (prompt)** | `recherches/questions/` | `validation_<sujet>_<YYYY-MM-JJ>.md` |\n| **Production subagent** | `jmj/rapports/` | `validation_<sujet>_hybride_<ts>.md` |\n| **Archivage post-intégration** | `recherches/questions/archives/` | idem, déplacé via `git mv` |\n\n**Production** — l'orchestrateur GLM délègue à un subagent rédacteur (Task\nsous supervision) pour produire le MD de la question de validation :\n\n```bash\n# L'orchestrateur lance un subagent rédacteur qui produit le MD\n# puis l'intègre via integrate_fiche.py\npython3 tools/integration/integrate_fiche.py \\\n    --db sol_vivant.db \\\n    --fiche-id <N> \\\n    --md <chemin-md>\n```\n\nNe pas générer dans `recherches/fiches/` pour une question de validation —\nce path est réservé aux fiches pédagogiques du corpus.\n\n### Anti-patterns\n\n- ❌ **Générer dans `recherches/fiches/fiche_<NNN>.md`** — path réservé aux\n  fiches pédagogiques. Une question de validation va dans\n  `recherches/questions/validation_<sujet>_<date>.md`.\n- ❌ **Slug sans préfixe `validation-`** — la convention `validation-<sujet>`\n  permet de distinguer les questions des fiches pédagogiques dans les audits\n  et exports.\n- ❌ **Utiliser `export_validation.py`** (.txt + 776 termes canoniques) — script\n  obsolète (archivé). Utiliser la voie subagent rédacteur (paradigme agent pilote).\n- ❌ **Citations `[N]` dans le MD** — le subagent ne peut pas associer au bloc\n  Références auto-généré. APA inline `(Auteur, année)` uniquement.\n- ❌ **Volume > 5k chars** — ce n'est plus une validation ciblée, c'est une\n  fiche pédagogique classique.\n- ❌ **Révéler la prédiction à valider dans le MD** — effet d'ancrage,\n  l'API d'audit hallucine une confirmation.\n- ❌ **Créer une entrée `validations`** pour un nouvel envoi — table legacy.\n- ❌ **Demander à l'API d'audit \"est-ce que X existe ?\"** — question orientée.\n  Formuler comme état de l'art ouvert + question sur l'intersection.\n\n### Cas canonique — `validation-haney-h3k4me3-priming`\n\n> ⚠ **Note** — Fiche #276 (slug `validation-haney-h3k4me3-pont-sol-plante`)\n> historique : générée AVANT la correction de cette BQ (2026-06-28), elle a\n> été écrite dans `recherches/fiches/fiche_276.docx` au lieu de\n> `recherches/questions/validation_haney_h3k4me3_<date>.docx`. Conserver comme\n> artefact, mais **ne pas reproduire**. Les prochaines questions de validation\n> doivent suivre la convention ci-dessus.\n\n**Hypothèse à valider** : le test Haney (proxy d'activité biologique du sol)\npourrait corréler avec le niveau de H3K4me3 foliaire sur *PR-1* (marqueur\nd'amorçage immunitaire végétal). Intersection inédite à notre connaissance\n(5 passes Semantic Scholar : prémisses solides séparément, aucune étude quantitative\nreliant les deux).\n\n**Plan retenu** (3 H1 body) :\n\n1. Le test Haney comme signature d'activité biologique du sol\n2. H3K4me3 sur PR-1 comme signature moléculaire de l'amorçage immunitaire\n3. Hypothèse d'un pont sol-plante et questions pour la littérature\n\n**7 sources** mirror local dans `sources` (Haney 2018, Maciel 2025,\nRamírez 2013, Cañizares 2025, López Sánchez 2021, Du 2025, Kaya 2026, Flors\n2024) avec `source_usages` vers la fiche. Bloc Références auto-généré par\nle subagent rédacteur.\n\n**Anti-effet d'ancrage** : la §3 présente l'intersection comme une question\nouverte (existe-t-il des études ?), pas comme une affirmation à confirmer.\n\n### Voir aussi\n\n- `wf_fiche_production` — workflow parent (fiches pédagogiques classiques, **OBSOLÈTE** `is_active: false`)\n- `fiche_definition` — taxonomie des fiches (transversale, zoom, technique, pedagogique)\n- Règles de rédaction transversales : `.opencode/RULES.md` + `check_forbidden_jenni.py` + BQ `listes_de_termes_triees_alphabetiquement_regle_abs` (doctrine Jenni d'origine archivée)\n- `doctrine_deepseek_api` — intégration API l'API d'audit (V4 pro, thinking)\n- `wf_audit_factuel` — vérification anti-hallucination au retour (Semantic Scholar)\n\n### Historique\n\n- **2026-06-28** : BQ créée suite à friction opérationnelle sur la validation\n  Haney × H3K4me3. L'agent avait utilisé le workflow `validations` legacy\n  (`export_validation.py` → .txt + 776 termes canoniques + citations [N]) au\n  lieu du workflow fiche canonique (`gen_fiche_docx.py` → .docx + citations\n  APA + bloc Références auto). Recadrage JMJ : « Ce document n'est ni plus ni\n  moins une fiche + graine simplifiée à l'extrême concernant un ou des points\n  précis demandant un arbitrage scientifique ». D'où cette BQ dédiée pour\n  cadrer le sous-cas `zoom` court pour arbitrage.\n- **2026-07-04** : refonte migration MD natif (Jenni/graines/docx supprimés,\n  l'API d'audit + Semantic Scholar + MD natif).\n", "type": "workflow", "crit": true}, {"id": "wf_fiche_regen_biblio", "titre": "Régénérer la bibliographie d'une fiche — refs_json PARTIEL/ORPHELIN → OK", "contenu": "## Régénérer la bibliographie d'une fiche — `refs_json` PARTIEL/ORPHELIN → OK\n\n> **Quand consulter cette BQ** — une fiche intégrée apparaît en\n> `refs_json` PARTIEL ou ORPHELIN à l'audit (`audit_fiches.py`), c'est-à-dire\n> que ses citations inline `(Auteur, année)` ne sont pas suffisamment résolues\n> dans le cache refs (seuil ≥ 85 %). Objectif : faire passer la fiche au vert\n> sans toucher au fond éditorial.\n>\n> Mots-clés de déclenchement : *refs_json, regen biblio, citations orphelines,\n> PARTIEL, ORPHELIN, résolution cites, sweep sources, source_usages, fiche au\n> vert, audit_fiches*.\n\n### Règle d'or\n\n**On ne crée jamais une fausse référence pour résoudre un cite.** Un cite\nintrouvable dans toute base (Crossref + Semantic Scholar + Google Scholar)\nest probablement une **hallucination du LLM rédacteur** de la fiche — on le\nlaisse orphelin et on le signale à JMJ. Créer une source approximative pour\n« faire passer le compteur » entérinerait une erreur bibliographique et\npolluerait la table `sources` durablement.\n\nCorollaire : **on ne touche pas au contenu éditorial** de la fiche (le texte\nrédigé par l'API d'audit et validé par JMJ). La régénération biblio agit sur\n`sources`, `source_usages`, et — dans le seul cas d'une **cohérence\nbibliographique** (early view → publié, faute de frappe année) — sur le cite\ninline lui-même via un UPDATE ciblé de `sections`.\n\n### Outils canoniques (session 2026-07-12)\n\nDeux scripts dédiés encapsulent la procédure — **ne pas bricoler à la main** :\n\n- **`tools/admin/diag_refs.py --fiche-id N`** : diagnostic avec **classification\n  des orphelins en 4 types** (`SOURCE_MANQUANTE`, `SOURCE_PROCHE` par co-auteur\n  ou titre corporate, `META_VIDE`, `CITE_MAL_FORMAT`). Affiche le **taux de\n  résolution réel** (distinct du verdict axe audit). Sweep large par tous les\n  co-auteurs, pas seulement le premier — détecte les cas type #4387 (Park &\n  DuPonte câblée mais le cite extrait \"cho\" car le texte cite \"Cho Han Kyu —\n  Park et DuPonte\").\n- **`tools/admin/migrate_refs.py --spec spec.json --apply`** : migration\n  transactionnelle (sources + câblages + réécritures cites) avec **3 garde-fous\n  par construction** : (1) câblage **détaché** de la création (tenté que la\n  source soit nouvelle ou existante), (2) vérif existence source par DOI ou\n  (auteurs+annee+titre), (3) **test d'extraction post-réécriture** — après un\n  UPDATE de cite, simule l'extraction et ABORT si le nouveau cite ne produit pas\n  un `(surname, year)` qui matche le cache.\n\n### Métrique (comprendre ce qu'on optimise)\n\nL'axe `refs_json` de `audit_fiches.py` mesure, pour chaque fiche :\n\n1. **Citations inline** extraites du texte reconstruit (vue\n   `fiche_retour_sections`) par `extract_inline_cites` — regex sur les blocs\n   `(… \\d{4}…)` → liste de `(surname_norm, year)`.\n2. **Cache refs** reconstruit à la volée par la vue `v_fiche_refs` depuis\n   `source_usages` + `sources` câblées à la fiche → index de `(surname, year)`\n   par `_extract_surname` (premier auteur APA normalisé).\n3. **Couverture** = cites résolus / cites total. Seuil configurable\n   (`config.audit.min_pct_refs_resolues`, défaut 85 %).\n\n**Conséquence cruciale** : pour qu'un cite `(Smith, 2008)` résolve, il faut\nqu'au moins une source câblée à la fiche ait **`auteurs` rempli** (premier\nauteur de surname normalisé = `smith`) ET **`annee` = 2008**. Une source\ncâblée mais avec `auteurs=''` ou `annee=NULL` ne résout RIEN (cf. piège\n§ Métadonnées vides).\n\n### Pipeline en 6 étapes\n\n#### Étape 0 — Pré-diagnostic avec classification (`diag_refs.py`)\n\n**Avant toute action** : lancer `diag_refs.py --fiche-id N`. Le script classe\nchaque orphelin en 4 types, ce qui détermine l'action :\n\n| Type | Cause | Action |\n|---|---|---|\n| `SOURCE_MANQUANTE` | Aucune source en DB matche | Étape 5 (créer) |\n| `SOURCE_PROCHE` | Source existante matchant par **co-auteur** ou **titre corporate** | **Réécrire le cite** (pas créer !) — le texte cite mal le désignateur |\n| `META_VIDE` | Source câblée à la fiche mais `auteurs`/`annee` vides | Étape 4 (enrichir) |\n| `CITE_MAL_FORMAT` | Acronyme en position auteur (BSP, KNF), citation secondaire, bug parsing | **Réécrire le cite** en prose ou APA propre |\n\n**Leçon fondatrice (cas #96, session 2026-07-12)** : un orphelin n'est pas\ntoujours une source manquante. La source #4387 (Park & DuPonte 2008) était\ncâblée à #96, mais le cite inline \"(Cho Han Kyu — Park et DuPonte 2008)\"\nextrayait `cho` au lieu de `park` → orphelin apparent. Le sweep par co-auteur\nde `diag_refs.py` détecte ce cas (SOURCE_PROCHE) → la bonne action est\n**réécrire le cite**, pas créer une nouvelle source.\n\nLe script affiche aussi le **taux de résolution réel** (ex : `16/19 (84%)`),\ndistinct du verdict axe `audit_fiches` (OK/KO) et du % affiché par\n`audit_meta.py` (% de l'axe, pas taux). Ne jamais confondre ces 3 métriques.\n\n#### Étape 1 — Diagnostic (`audit_fiches.py`)\n\n```bash\npython3 tools/admin/audit_fiches.py --db sol_vivant.db --fiche-id <N>\n```\n\nLit le rapport `jmj/rapports/audit/audit_fiches_<date>.md` : colonne\n`cit. résolues` (ex : `27/53 (51%)`) et verdict `refs` (PARTIEL/ORPHELIN/OK).\n\nGap vers 85 % = `ceil(n_cites × 0.85) − n_resolus`. C'est le nombre minimum de\ncites à résoudre.\n\n#### Étape 2 — Extraction précise des orphelins\n\n`audit_fiches.py` donne le total mais pas la liste détaillée. Reproduire la\nlogique en réutilisant ses fonctions (ne pas réinventer) :\n\n```python\nimport sys; sys.path.insert(0, 'tools/admin'); sys.path.insert(0, 'tools/lib')\nfrom audit_fiches import extract_inline_cites, build_ref_index\n# contenu = concaténer fiche_retour_sections(titre+contenu) ordonné\n# idx = build_ref_index(refs_json depuis v_fiche_refs WHERE fiche_id=N)\n# orphelins = [(sn,y) for sn,y in cites if (sn,y) not in idx and (sn,'') not in idx]\n```\n\nPour chaque orphelin, extraire le **contexte scientifique** (phrase autour du\ncite) — c'est la base de l'identification : le second auteur est souvent nommé\ndans le cite (`(Smith & Read, 2008)`, `(Kirk & Farrell, 1987)`), ce qui lève\nl'ambiguïté quand plusieurs papers partagent un surname.\n\n#### Étape 3 — Levier 1 : sweep des sources existantes (gain facile, 0 création)\n\nPour chaque orphelin `(surname, year)`, chercher une source **DÉJÀ en DB**\n(dont l'auteur normalisé matche et l'année correspond) mais **non câblée** à\ncette fiche. Si trouvée : simple `INSERT INTO source_usages` (câblage).\n\nC'est le premier levier, rentable et sans risque (0 création). Confirmé sur\n13 fiches lors de la session 2026-07-11 (#269 9%→26%, #275 33%→47%, etc.).\n\n#### Étape 4 — Levier 1bis : enrichissement des métadonnées vides\n\n**Piège récurrent** : une source peut être câblée à la fiche ET ne rien\nrésoudre parce que ses métadonnées sont vides. Cas fondateur : `#10857`\n(Vandenkoornhuyse 2015) créée par le batch transverse avec `auteurs=''` et\n`annee=NULL` — câblée à #138 mais invisible pour l'index de résolution.\n\nRequête de détection :\n\n```sql\nSELECT s.id, s.doi, s.auteurs, s.annee, s.titre_court\nFROM source_usages su JOIN sources s ON s.id=su.source_id\nWHERE su.entity_type='fiche' AND su.entity_id=<N>\n  AND (s.auteurs IS NULL OR s.auteurs='' OR s.annee IS NULL);\n```\n\nEnrichir (`UPDATE sources SET auteurs=?, annee=?, …`) avant tout autre geste.\nC'est probablement un défaut hérité du batch transverse — à surveiller sur les\nfiches récalcitrantes.\n\n#### Étape 5 — Levier 2 : création des sources manquantes\n\nPour les orphelins non couverts par les leviers 1/1bis, identifier puis créer\nla source. **Identification en 3 passes, de la plus sûre à la moins sûre :**\n\n1. **Classiques incontestables** (mes connaissances) — pour les piliers du\n   domaine (Smith & Read *Mycorrhizal Symbiosis*, Kirk & Farrell lignine,\n   Shoun & Tanimoto dénitrification fongique, etc.). Toujours **confirmer le\n   DOI via Crossref** avant création (un DOI approximatif pollue la base).\n2. **Semantic Scholar** — agent `validator-s2` (bash ciblé\n   `tools/veille/semantic_scholar.py`). Bon pour la recherche par\n   titre/bibliographic. **Limite** : le bulk search matche title+abstract,\n   JAMAIS les auteurs → inutilisable pour les noms communs (See = « voir »,\n   Baldrian = valériane en allemand) ou les papiers pré-2005 (couverture\n   faible).\n3. **Crossref** — agent `validator-crossref` (`api.crossref.org` via curl).\n   Meilleur pour la recherche par auteur (`query.author=Nom` + filtre année).\n   À utiliser en arbitrage des INTROUVABLES S2.\n\n**Garde-fou TITRE VÉRIFIÉ** (session 2026-07-12) : **jamais de source créée\navec un titre approximatif**. Pour une source sans DOI (livre, rapport, fiche\ntechnique type CTAHR BIO-9), le titre doit être confirmé par :\n- **`pdftotext` (poppler-utils)** sur le PDF source : `curl -sL <url-pdf> -o /tmp/x.pdf && pdftotext -f 1 -l 1 -layout /tmp/x.pdf - | head` — un PDF n'est JAMAIS une impasse binaire.\n- ou Crossref/S2 si DOI disponible ;\n- ou titre fourni explicitement par JMJ.\nCas fondateur : Park & DuPonte 2008 — titre supposé \"Indigenous Microorganisms\n(IMO) in Agriculture\" → titre réel \"How to Cultivate Indigenous Microorganisms\"\n(vérifié via pdftotext). Toujours **enrichir** (`UPDATE`) une source existante\nmal titrée plutôt qu'en créer une doublon.\n\n**Création en DB** : préférer `migrate_refs.py --spec spec.json --apply`\n(transactionnel, garde-fous intégrés : vérif existence, câblage détaché, test\nextraction). Manuel uniquement pour cas one-shot.\n\n```python\n# INSERT INTO sources (doi, auteurs, annee, titre_court, titre_complet,\n#   journal, volume, issue, pages, editeur, type, source_docx, created_at, updated_at)\n# INSERT OR IGNORE INTO source_usages (source_id,'fiche',<N>, contexte, citation_brute)\n# INSERT INTO audit_log ('INSERT','sources', ...)\n```\n\nIndex unique `sources` sur `doi` (vérifier existence avant INSERT).\nIndex unique `source_usages` sur `(source_id, entity_type, entity_id, contexte)`.\n\n`source_docx` sert d'origine tracée : `regen_glm_<fiche> <date>` (convention\nsession 2026-07).\n\n#### Étape 6 — Réécriture ciblée d'un cite (exception, pas règle)\n\nUn cite peut nécessiter une correction de **cohérence bibliographique pure**\n(uniquement) :\n\n- **Early view vs publié** : `(See et al., 2021)` alors que la ref publiée est\n  2022 → `UPDATE sections SET contenu=REPLACE(contenu, '(See et al., 2021)',\n  '(See et al., 2022)')`. Légitime (la source définitive est 2022).\n- **Faute de frappe d'année** ou formatage casse (`(Smith et Read, 2008)` →\n  cohérent avec le cache).\n\n**Jamais** de réécriture qui change le sens ou l'attribution — ça relèverait\nde l'édition de fond (règle `pas_agent_redacteur`).\n\n#### Étape 7 — Validation\n\n```bash\npython3 tools/admin/audit_fiches.py --db sol_vivant.db --fiche-id <N>\n# cible : refs OK, cit. résolues ≥ 85%\n```\n\nPuis relancer l'audit **sur le corpus complet** (sans `--fiche-id`) pour\nrafraîchir le compteur global `fiches_axe_refs_json` — un audit ciblé produit\nun rapport partiel qui trompe `audit_meta.py` (l'agrégat ne voit que la fiche\naudité).\n\n### Pièges documentés\n\n1. **Métadonnées vides** (§ étape 4) : source câblée ≠ source résolvante.\n   Toujours vérifier `auteurs`/`annee` non NULL.\n2. **Hallucinations du LLM rédacteur** : 5 cites sur #138 (Chenu 2001,\n   Gougherty 2019, Patra 2015, Ujimatsu 2021, Baldrian & López-Mondéjar 2023)\n   se sont révélés introuvables sur S2 + Crossref + connaissances — probables\n   refs fabriquées par l'API d'audit. **Ne pas créer de fausse source pour les\n   résoudre.** Les laisser orphelins et signaler à JMJ.\n3. **Noms communs en S2** : See, Baldrian (valériane), Frac (sans ogonek),\n   Patra (ultra-commun indien). Toujours router vers Crossref\n   (`query.author=` + filtre thématique + filtre année).\n4. **Ordre des auteurs APA** : `_extract_surname` prend le **premier** auteur\n   de la source. Pour que `(Smith & Read, 2008)` résolve, Smith doit être\n   premier dans le champ `auteurs` (pas Read). Conserver l'ordre APA\n   canonique (premier auteur = auteur principal).\n5. **Early view / année publiée** : un cite peut être antérieur d'un an à la\n   date de publication définitive (preprint, version acceptée). Vérifier\n   l'année de la source avant de conclure à un orphanisme — et corriger le\n   cite plutôt que la source (la source porte l'année de publication\n   définitive).\n 6. **Score `audit_meta` trompeur après audit ciblé** : `audit_meta.py` lit le\n    dernier rapport JSON. Un `audit_fiches.py --fiche-id N` produisait un\n    rapport d'1 fiche → `audit_meta` croyait `refs_json` OK pour tout le corpus.\n    **Fix 2026-07-12** : `audit_fiches.py --fiche-id N` sans `--output` écrit\n    désormais dans `audit_fiches_<date>_fiche<N>.md` (n'écrase plus le global).\n    Mais `audit_meta.py` lit le **dernier JSON** par mtime — en cas de doute,\n    relancer l'audit corpus complet (`audit_fiches.py` sans `--fiche-id`) pour\n    rafraîchir le compteur `fiches_axe_refs_json`. Préférer `diag_refs.py` pour\n    le diagnostic ciblé (n'écrit pas de rapport global, calcule le taux réel).\n 7. **Cache de `bq_inventory`** : créer une BQ n'invalide pas automatiquement\n    les vues ; `regen_all.py` rafraîchit. Mais l'inventaire filesystem\n    (`bq_inventory.py`) se invalide par mtime — effet immédiat.\n 8. **Réécriture de cite = test d'extraction obligatoire** : reformuler un cite\n    inline peut produire un surname inattendu (ex : \"(Park et DuPonte, 2008)\"\n    comme premier mot → extraction \"park et duponte\" au lieu de \"park\"). Toujours\n    valider via `migrate_refs.py` (test d'extraction intégré, ABORT si mismatch)\n    ou `diag_refs.py` post-réécriture. Ne jamais réécrire à la main sans re-diag.\n  9. **Verdict axe ≠ taux résolution** : `audit_fiches` affiche \"refs OK/KO\"\n     (binaire, seuil 85%) et `audit_meta` affiche \"fiches_axe_refs_json: N\"\n     (compte de fiches KO). Ni l'un ni l'autre n'est le **taux de résolution**\n     (ex : 48/53 = 91%). `diag_refs.py` affiche ce taux réel. Ne pas confondre\n     les 3 métriques — un \"0%\" sur l'axe audit peut être une fiche à 84% (proche\n     du seuil), pas une fiche vide.\n 10. **Bug initiales MAJUSCULES en tête d'auteur** (fix 2026-07-12) : le format\n     « Initiales(≥2 maj) Nom » (ex : « AJ Vinten », « LKJ Hauru », « CD Thomson »)\n     était mal indexé par `_extract_surname` — il retournait « aj » au lieu de\n     « vinten ». **66 sources / 9790 affectées** (lot #10752-#10781 notamment).\n     Symptôme : une source **câblée** à une fiche apparaît comme orpheline (le\n     cite extrait « vinten » ne matche pas le cache (« aj », 2002)). diag_refs\n     classe alors à tort `SOURCE_MANQUANTE` au lieu de `SOURCE_PROCHE`. **Fix** :\n     `_extract_surname` détecte désormais les groupes d'initiales tout-MAJ ASCII\n     (2+ mots, 1er mot `.isupper()`) et prend le mot suivant. Un mot seul\n     tout-MAJ reste un acronyme corporatif (JADAM). Cas fondateur : #10889\n     (Vinten 2002) câblée à #108 mais orpheline apparente → #108 passé au vert\n     (76 % → 93 %) **sans aucune écriture DB**, juste par le fix algo.\n 11. **Bug article anglais « The X »** (fix 2026-07-12) : les corporatifs\n     anglais type « The Shift Project » étaient indexés en « the » au lieu de\n     « shift » (article défini non filtré par `_PARTICULES`). Symptôme : source\n     câblée + cite correctement formaté « (Shift Project, 2026) » → orphelin\n     apparent. **Fix** : `_PARTICULES` inclut désormais les articles anglais\n     `the`, `an` (filtre dans `_extract_surname` ET `extract_inline_cites`).\n     Cas fondateur : sources #1667/#1669 (The Shift Project 2026) câblées à #41\n     mais orphelines apparentes → #41 passé au vert (0 % → 100 %) **sans aucune\n     écriture DB**, juste par le fix algo. **Leçon** : avant toute\n     création/câblage, si diag_refs classe `SOURCE_MANQUANTE` pour un\n     corporatif, vérifier que ce n'est pas un faux négatif du matching\n     (article/initiales en tête du champ `auteurs`).\n  12. **Fallback `(sn, '')` supprimé** (fix 2026-07-12 ter) : `check_refs_resolution`\n     avait une disjonction `or (sn, '') in idx` qui faisait qu'une source\n     META_VIDE (`annee=NULL`) résolvait **TOUTES** les citations de cet auteur,\n     quelle que soit l'année → faux OK. Une source `('schroeder', '')` matchait\n     `('schroeder', 2023)` ET `('schroeder', 2024)`. Symptôme : fiche à 100 %\n     alors que le cache contient des sources incomplètes. **Fix** : matching\n     strict `(surname, year)` uniquement — une META_VIDE est une dette de\n     sourçage à enrichir (workflow diag_refs → migrate_refs), pas un joker\n     année-wildcard. Cas fondateur : #195 (100 % → 85 % PARTIEL, 2 sources\n     Schroeder #10561/#10562 `annee=NULL` résolvaient 15 cites à tort). Impact :\n     **1 flip** (#195 OK→PARTIEL), 46 fiches stables (0 collatéral). **Leçon** :\n     une source sans année n'est pas une source « toutes années » — l'enrichir.\n\n### Stratégie de priorisation des fiches\n\n- **Cibler les fiches proches du seuil** (gap petit = ROI maximal). #275\n  (gap 15) → OK en 2 passes ; #270 (gap 60) → 29 % après 3 passes. Les fiches\n  à <20 % sont des chantiers longs.\n- **Batch transverse épuisé** : les classiques communs à 3-4 fiches (Lal 2004,\n  Hinsinger 2001, Schmidt 2011…) ont déjà été câblés en session 2026-07-11.\n  Le rendement marginal des ×2 est faible. La suite exige le workflow\n  fiche-par-fiche (~12-30 sources par fiche selon la densité).\n- **Sweep d'abord, création ensuite** : le sweep (gain facile, 0 création)\n  précède toujours la création (lourde, risquée).\n\n### BQ connexes\n\n- `wf_fiche_integration` — pipeline complet d'intégration d'une fiche MD\n  (dont étape refs via `integrate_fiche_refs.py`). La regen biblio intervient\n  **a posteriori** quand l'intégration initiale a laissé la fiche PARTIEL.\n- `integration_reponse_sourcage_refs` — pendant de l'intégration fiche pour\n  les réponses de sourçage (cible = une `validation`).\n- `wf_source_integration` — intégration d'une source unique (rapport JMJ).\n- `architecture_db_tables_vues_colonnes_cles` — schéma de `sources`,\n  `source_usages`, `v_fiche_refs`.\n- `pas_agent_redacteur` — la regen biblio agit sur la bibliographie, pas sur\n  le contenu éditorial.\n\n### Validations (promotion BQ)\n\n**9 fiches au vert** avec cette méthode (7 par création/câblage/sweep + 2 par fix algo) :\n- **#271** (session 2026-07-11) — 1re fiche au vert, workflow rodé.\n- **#275** matiere-humifiee (session 2026-07-11 (4)) — PARTIEL 47 % → OK 86 %\n  en 2 passes (12 sources science du sol).\n- **#138** diversite-fongique-dual-role (session 2026-07-11 (5)) — PARTIEL\n  51 % → OK 91 % (17 sources créées + 1 enrichie + 1 cite réécrit). A révélé\n  les pièges #1 (métadonnées vides #10857) et #2 (5 hallucinations).\n- **#258, #104, #97, #103** (session 2026-07-12, cluster low-hanging fruit) —\n  4 fiches au vert (sweep Bosch + JADAM corporatif + Van 't Westeinde +\n  Stoyanova). Révèle les pièges #8 (réécriture \"Park et DuPonte\" → extraction\n  \"park et duponte\") et #9 (verdict axe 0% ≠ taux 84%).\n- **#108 faim-d-azote-apres-apport-carbone** (session 2026-07-12, fix algo) —\n  PARTIEL 76 % → OK 93 % **sans aucune écriture DB**, juste par le fix du\n  piège #10 (bug initiales MAJ sur #10889 Vinten). Nouvelle catégorie de\n  résolution : le fix algorithmique global.\n- **#41 transition-robuste-france-shift-pref** (session 2026-07-12, fix algo) —\n  ORPHELIN 0 % → OK 100 % **sans aucune écriture DB**, juste par le fix du\n  piège #11 (bug article \"The\" sur #1667/#1669 The Shift Project). Confirme\n  qu'un `SOURCE_MANQUANTE` apparent peut être un faux négatif du matching.\n\n**Cas d'étude #96 (PARTIEL 84 %, non résolu)** : fiche avec **cites\nstructurellement mal formatés** — citation secondaire \"Blanco 2012 cité dans\nFelix 2015\" (génère 2 orphelins artefactuels), mot commun \"France\" (pays en\nposition auteur). Nécessite une **réécriture éditoriale profonde** (reformuler\nen prose hors bloc parenthèse APA), hors périmètre biblio strict. Documenté\ncomme limite du workflow : certaines fiches exigent une intervention\nrédactionnelle, pas un simple câblage.\n\nCompteur global session 2026-07-12 (4 sessions cumulées) : **205/229 fiches OK\n`refs_json` (90 %)**. La 4ᵉ session a **supprimé le fallback `(sn, '')`**\n(piège #12) : #195 bascule honnêtement OK→PARTIEL (100 % artificiel → 85 %\nréel, 2 sources Schroeder META_VIDE). 0 dégât collatéral (46 fiches stables).\n4 tests ajoutés (19 au total). Gap résiduel : ~24 fiches non-OK dont 7 ABSENT\n(cluster pédagogique #256-263 sans citation inline — autre chantier), #195\nPARTIEL (à enrichir META_VIDE #10561/#10562) et 16 ORPHELIN/PARTIEL.\n", "type": "workflow", "crit": true}, {"id": 121, "titre": "Charte fiches techniques DIY — structure spécifique", "contenu": "## Charte fiches techniques DIY — structure spécifique\n\nCharte spécifique aux fiches `type='technique'` — protocoles DIY, préparations biologiques, méthodes de mesure à la ferme. Source initiale : `docx/charte_de_travail___fiches_techniques.docx` rédigée par Jenni en 2026-04.\n\n**S'applique à** : `chelation-aminoacide-diy`, `knf-jadam-preparations`, `ipmo-jakoba-natural-farming`, `rhodopseudomonas-palustris`, `diagnostic-seve-ph-ec` et toute nouvelle fiche technique à venir.\n\n### Structure générale (héritée des fiches transversales)\n\nIdentique aux fiches transversales pour l'ossature :\n\n```\n[Title court sans accent ≤ 5 mots]\n\n[H1] Introduction\n[H1] 1. [Titre section 1]  (avec 5 H2 — voir détail ci-dessous)\n[H1] 2. [Titre section 2]  (avec 5 H2)\n...\n[H1] Résumé\n[H1] Termes canoniques en fin (Jenni §1.C)\n[H1] Références\n```\n\n### Spécificité : 5 sous-blocs H2 immuables par section numérotée\n\nChaque section body H1 numérotée contient **5 H2 au même niveau** (structure plate, pas de H3 pour éviter les ambiguïtés d'interprétation Word) :\n\n```\n[H1] 1. Préparation du LiFoFer\n  [H2] Contexte scientifique\n  [H2] Protocole\n  [H2] Indicateurs de qualité\n  [H2] Précautions & Stockage\n  [H2] Applications & Dosages\n\n[H1] 2. [Autre préparation]\n  [H2] Contexte scientifique\n  [H2] Protocole\n  [H2] Indicateurs de qualité\n  [H2] Précautions & Stockage\n  [H2] Applications & Dosages\n```\n\n### Détail des 5 H2\n\n#### H2 — Contexte scientifique\n\nPourquoi ce protocole fonctionne. Mécanismes biologiques, chimiques, écologiques mobilisés. Références scientifiques. **Rédigé par l'agent + enrichi par Jenni**.\n\n#### H2 — Protocole\n\nStructure à sous-paragraphes en **préfixe gras** (pas de H3) :\n\n```\n**Ingrédients —** liste des matériels et matières consommables avec quantités précises, sources d'approvisionnement, alternatives de substitution.\n\n**Équipement nécessaire —** ustensiles, capacités volumiques, conditions (obscurité, température, aération). Inclure les EPI (gants, lunettes, masque filtrant si applicable).\n\n**Procédure —** suite d'étapes chronologiques numérotées ou en listes, avec durées, températures, signes sensoriels à vérifier à chaque étape (changement de couleur, odeur attendue, consistance).\n```\n\n**Règle doctrine** : la rédaction du Protocole est du **volet pratique** confié à JMJ (qui teste, ajuste, documente) et à Jenni (qui recherche sources praticiens : Carandang, Cho Han-kyu, Tao Orion, Gil Carandang, Higa EM-1, retours aquaculture asiatique, etc.). L'agent rédige **uniquement le Contexte scientifique** et la partie théorique — pas d'invention de protocole par l'agent seul.\n\n#### H2 — Indicateurs de qualité\n\nComment savoir que la préparation est réussie. Paramètres mesurables (pH, couleur, odeur, température, densité), valeurs de référence, signaux de dérive (mouillage, odeurs putrides, changement de teinte anormale), durée de maturation typique.\n\n#### H2 — Précautions & Stockage\n\nRisques chimiques et biologiques, incompatibilités, conditions de stockage (température, lumière, durée de conservation), signes d'altération justifiant le rejet, gestion des résidus et déchets.\n\n#### H2 — Applications & Dosages\n\nCultures ou contextes où la préparation est utile, doses recommandées (par litre, par hectare, par plant), fréquences d'application, modalités (trempage de semences, pulvérisation foliaire, incorporation sol, dilution irrigation), compatibilités / incompatibilités avec d'autres pratiques concurrentes.\n\n### Document amorce, pas template vide\n\nLe docx produit est un document de travail **amorce/partiellement rédigé**, pas un template avec `[à compléter]`. Les sous-blocs H2 contiennent une description éditoriale concise (5-15 lignes) qui pose le cadre de ce qui est attendu, plutôt qu'un placeholder vide.\n\n### Recommandations protocoles DIY (sources Jenni)\n\nLes sources praticiennes reconnues que Jenni mobilise pour les protocoles :\n\n- **Carandang, Gil** — Natural Farming Philippines, IMO, FAA, FPJ, FFJ\n- **Cho Han-kyu** — Korean Natural Farming (KNF), IMO1-4, JADAM\n- **Tao Orion** — permaculture thérapeutique, intégrations\n- **Higa, Teruo** — Effective Microorganisms (EM-1)\n- **Aquaculture asiatique** — usage combinés en riziculture-pisciculture\n\n**Règle** : les doses et protocoles issus de ces sources sont contextuels. Toute adaptation locale doit être testée en pilote avant généralisation.\n\n### Gestion des termes canoniques\n\nComme pour les fiches transversales :\n- Termes canoniques **intégrés dans les phrases** (orthographe exacte `terms.fr`).\n- Pas de liste séparée en fin de document.\n- Première mention avec EN entre parenthèses : `« micro-organismes efficaces (Effective Microorganisms, EM) »`.\n\n### Contraintes de rendu\n\nIdentiques aux fiches transversales — voir BQ `contraintes_rendu_docx` (Title ≤ 5 mots sans accent, H1-H3 max, pas d'ASCII, structure plate, zéro méta-vocab).\n\n### Principe du cadrage éditorial\n\nLes 5 H2 sont **immuables** pour garantir la cohérence inter-fiches techniques : un lecteur qui ouvre plusieurs fiches techniques retrouve toujours la même architecture et sait où chercher chaque type d'information. Cette standardisation vaut contrainte : si une fiche technique n'a rien à dire dans un H2 (ex : pas de Précautions spécifiques à documenter pour une préparation particulièrement bénigne), le H2 est conservé avec une mention concise, pas supprimé.\n\n### BQ complémentaires\n\n- `fiche_definition` — définition, taxonomie, cycle de vie des fiches\n- `wf_fiche_integration` — intégration consciente du retour Jenni\n- Règles de rédaction transversales (doctrine Jenni d'origine archivée) : `check_forbidden_jenni.py` + BQ `listes_de_termes_triees_alphabetiquement_regle_abs` + `.opencode/RULES.md`\n- `comment_jenni_comprend_les_instructions_modele_men` — synthèse transverse du modèle mental Jenni (chartes sources opérationnelles)\n", "type": "reference", "crit": false}, {"id": 147, "titre": "Intégration consciente d'une fiche MD — workflow canonique", "contenu": "## Intégration consciente d'une fiche MD — workflow canonique\n\n### Principe directeur\n\n**L'intégration d'une fiche MD produite par l'API d'audit est le moment crucial où l'agent mobilise toutes ses capacités d'analyse intégrative.** Ce n'est pas un lancement de script suivi d'un commit. C'est l'analyse consciente d'un document scientifique enrichi à co-rédiger avec le reste du corpus existant.\n\nJMJ a co-rédigé avec Jenni mais n'a plus le bandwidth pour relier transversalement, contrôler la cohérence inter-pièces, repérer les évolutions de paradigme et les manques exposés. **C'est la responsabilité de l'agent à l'intégration.**\n\nUne intégration sans analyse intégrative produit du contenu juxtaposé sans cohérence — exactement le piège du corpus mal géré.\n\n**Le câblage automatique est aveugle au neuf (institué 2026-06-13, demande JMJ).** Le pipeline `integrate_fiche.py` ne fait que *valider un câblage préétabli* : il matche le retour contre les cards et axes **qui existent déjà** (scoring de recouvrement) et propage vers eux. Par construction, il **ne peut pas détecter ce qui est nouveau** — un concept absent du corpus, un renversement de cadre, une tension avec un axe établi n'ont aucun score d'overlap avec l'existant. La détection du neuf exige une **lecture analytique, pas un score** : c'est pourquoi l'étape 3 n'est pas « l'agent lit avec attention » (mou, sautable) mais un **Conseil d'audit du retour** formel — le dispositif complet de `conseil_modele`. Cas fondateur : fiche #264 (microsite refuge évolutif) — l'apply mécanique a tissé 4 axes existants sans voir que le retour Jenni introduisait le concept **« Microbial Village »** (0 card / 0 terme au corpus, sourcé Wilpiszeski 2019) ni le renversement *anoxie-relique → anoxie-norme* (en tension avec les axes #12/#179). Le câblage était vert ; l'intégration consciente, non faite.\n\n### Règle d'or\n\n**Aucun document (MD ou docx) ne rentre tel quel en DB.** Toute intégration passe par le pipeline `integrate_fiche.py` + analyse intégrative consciente + intégration des refs biblio + audit croisé documenté + propagation aux autres pièces du corpus.\n\n### Pipeline complet en 7 étapes\n\n```bash\n# Étape 1-3 : dry-run + contrôles (mode MD natif — flag --md)\npython3 tools/integration/integrate_fiche.py --db sol_vivant.db --fiche-id <N> --md <chemin-md>\n# Étapes 4-7 : analyse + apply + intégration refs + audit + archivage\npython3 tools/integration/integrate_fiche.py --db sol_vivant.db --fiche-id <N> --md <chemin-md> --apply\npython3 tools/integration/integrate_fiche_refs.py --fiche-id <N> --md <chemin-md> --apply\n# (audit croisé manuel — voir étape 6)\n```\n\n---\n\n### Étape 1 — Parse + match + diff (script auto)\n\nParseur MD (`tools/lib/parse_jenni_md.py`) qui extrait :\n\n- **Sections** par niveaux (`#` Title, `##` H1, `###` H2) — alignement avec\n  le plan DB via numérotation dans le titre (cf. §Numérotation normalisée ci-dessous)\n- **Refs biblio** (bloc `## Références` final, format APA)\n- **Citations inline** APA `(Auteur, année)`\n- **Formules chimiques Unicode** (NH₃, CO₂, Fe²⁺) — Unicode direct en MD\n- **Tags résiduels** `[Fiche zoom...]`, `(nd)` autoréférences → supprimés au parse\n\nDiff vs version précédente : première intégration → note neutre. Réintégration → comparaison textuelle, refs ajoutées/retirées signalées, passages disparus flaggés.\n\n---\n\n### Étape 2 — Contrôles techniques pré-apply (BQ §E)\n\n**Avant tout apply, vérification consciente** par scan regex sur le contenu parsé :\n\n| Contrôle | Pattern | Tolérance |\n|---|---|---|\n| Parens vides OMML | `\\(\\s*\\)` | **0** (sinon formule perdue) |\n| Dummy-citations Google Docs | `dummy[- ]citation` | 0 |\n| Citations `n.d.` non résolues | `\\(.*?n\\.d\\.\\)` | 0 |\n| Méta-vocab | `card #N`, `chaîne CN`, `corpus`, `strate`, codes doc, `thésaurus` | 0 |\n| Anglicismes non consacrés | `turnover`, `hotspot`, `pool/pools`, `mix`, `cry-for-help` (sans glose), `feedback` (sans glose) | 0 ou glose bilingue acceptable |\n| Sujets interdits | `biodynam*`, `Steiner`, `anthroposoph*` | 0 (BQ `sujets_interdits_corpus`) |\n| **Biblio finale absente** | pas de bloc `## Références` (`parsed.refs_biblio` vide) | **0** — non-bypassable (voir garde-fou ci-dessous) |\n\n**Garde-fou biblio finale (posé 2026-07-11, `integrate_fiche.py` step_gate)** : une fiche non pédagogique sans bloc `## Références` déclenche une violation **CRITIQUE non-bypassable** (`--partial` impuissant, au rang de la pseudoscience). Exception : `type='pedagogique'` (sans biblio par design, cf. § dédié). Ce garde-fou mécanique empêche la récurrence de l'incident 2026-07 : 18 fiches MD avaient été marquées `integre` sans biblio → 608 cites inline orphelines → base en vrac. C'est un **filet de sécurité** ; le vrai contrôle reste l'intégration consciente (étape 3) — l'agent qui orchestre ne doit pas bâcler en posant un placeholder biblio qu'il oublie ensuite.\n\nSi parens vides résiduelles → restaurer les acronymes/formules avant apply (UPDATE post-apply autorisé).\n\nSi anglicisme avec glose bilingue (« Plant-Soil Feedback (rétroaction plante-sol) ») → acceptable, terme technique consacré.\n\n---\n\n### Étape 3 — Conseil d'audit du retour (l'analyse intégrative — le cœur de l'intégration)\n\n**C'est le travail principal de l'agent au retour Jenni, et il prend la forme d'un Conseil (institué 2026-06-13).** Le câblage (étapes 1-2-4) valide l'existant ; ce Conseil **lit le retour pour en extraire le NEUF** que le câblage ne peut pas voir. Il se tient **avant l'apply** (ou juste après le temps-1 fidèle, jamais après la propagation).\n\n**Dispositif — le modèle complet `conseil_modele`, pas une version incarnée raccourcie :**\n- **Round 1** (agents Task parallèles, `model='<modèle configuré>'`) — 3 lentilles choisies pour l'objet + **contradicteur** + **anti-marteau**. Chaque siège lit le dossier, **VÉRIFIE en DB**, rend findings + angle mort + préoccupation n°1.\n- **Round 2** (mêmes sièges, après PV du chairman) — échange confronté : concèdent/maintiennent preuve DB à l'appui, nomment l'angle mort collectif et la vraie convergence.\n- **Synthèse** (chairman = agent) → **contradicteur de la synthèse + anti-marteau** (deux critiques indépendantes : justesse / nécessité) → le chairman **re-vérifie en DB** les dires des contradicteurs (faux positifs LLM, BQ `conseil_modele`) → **verdict + arbitrages à JMJ**. *N'écrire en DB qu'après l'arbitrage de JMJ.*\n\n**Mandat spécifique du Conseil d'audit d'intégration — trouver ce qui est nouveau :**\n- **Concepts / cadres neufs** : le retour nomme-t-il un objet absent du corpus (vérifier : 0 card / 0 terme / 0 axe) qui mérite une card ou un terme ? (ex. #264 « Microbial Village »)\n- **Renversements / déplacements de paradigme** : le retour pousse-t-il un cadre jusqu'à mettre un axe du fil directeur en tension ? (ex. #264 *anoxie relique → norme* vs #12/#179)\n- **Tensions / contradictions** avec cards, chaînes, autres fiches.\n- **Termes candidats de fond** (distincts des artefacts de parsing).\n\nLes sous-questions A-D ci-dessous sont la grille que le Conseil instruit :\n\n#### A. Cohérence vs corpus existant\n\n- Quelles **affirmations valident** des contenus existants (cards, chaînes, autres fiches) ?\n- Quelles **affirmations contredisent** des contenus existants ?\n- Quelles **données chiffrées** mises à jour faut-il propager ailleurs ?\n- Quelles **citations partagées** créent des liens trans-fiches ?\n- Quels **mécanismes décrits dans les réponses aux questions de sourçage**\n  (validations `statut=integre`) recoupent la fiche ? → croisement obligatoire,\n  volet H de l'audit croisé. La prose-réponse est désormais en DB\n  (`validation_contenus.contenu_brut`, captée par `integrate_validation_refs`\n  depuis 2026-06-02) — la requêter. ⚠ Exception : les sourçages intégrés **avant**\n  le correctif (ex. faune #15) n'ont pas de prose en DB → leur matière reste dans\n  `docx/archives/QS-*.docx` (+ brief `validation_sections`).\n\n#### B. Évolutions de paradigme\n\n- La fiche introduit-elle un **nouveau paradigme** qui doit faire bouger d'autres pièces du corpus ?\n  Exemple : Soil Continuum Model invalide l'humification classique → impacte cards #54, #98 et fiche #11\n- Quels **arbitrages éditoriaux** sont rendus possibles par cette intégration ?\n\n#### C. Manques nouveaux exposés\n\n- Par contraste, quels **termes thésaurus** apparaissent absents et nécessaires ?\n- Quelles **fiches voisines** deviennent prioritaires à créer ou à réviser ?\n- Quelles **chaînes causales** sont à enrichir (maillons faibles, étapes manquantes) ?\n- Quelles **controverses scientifiques** sont à formaliser explicitement ?\n\n#### D. Impact opérationnel\n\n- Quelles cards demandent un renforcement (via `pedago_links` carte→fiche, ou `description`\n  si la fiche apporte un cadre génératif absent — **pas** `concept_cards.notes`, non rendu : cf. étape 7.1) ?\n- Quelles fiches en cours doivent être briefées-à-jour avant envoi Jenni ?\n- Quels prompts de docs cibles doivent être enrichis (`prompts.contexte_sci/.enrichissement`) ?\n\nCe travail produit le **rapport audit croisé** (étape 6).\n\n---\n\n### Étape 4 — Apply (script auto au green-light)\n\n```\n✓ INSERT fiche_retour_sections (plan parsé, par section)\n✓ DELETE source_usages anciens pour la fiche\n✓ INSERT N source_usages (refs déjà en DB)\n✓ UPDATE fiches : statut=integree, updated_at\n✓ RENFORCE auto cards score≥8 (scoring step_cards — voir note)\n✓ audit_log (operation=INTEGRATE)\n✓ COMMIT\n```\n\n> **Note 2026-07-05** : l'ancien UPSERT `fiche_contenus` (refs JSON cache +\n> `notes_agent`) est supprimé — la table est droppée et remplacée par la vue\n> `v_fiche_refs` qui régénère le cache à la volée depuis `source_usages` +\n> `sources`. Le `notes_agent` (228 rows historiques) a été droppé sans\n> migration : l'info est redondante avec `audit_log` (recap tracé étape 6).\n\n> **Versioning (modèle fiches 2026-05-25)** : le **contenu intégré n'est PAS\n> versionné** : `fiche_retour_sections` porte le **dernier\n> état seulement**, réécrit à chaque (ré)intégration. L'état qui **fait foi** est\n> `fiches.statut='integree'` + le contenu courant.\n>\n\n> **Renfort auto des cards — à reprendre consciemment (étape 7)** : le script applique un\n> `RENFORCE` automatique aux cards de score ≥ 8 (`step_cards`). Ce scoring est **grossier\n> sur les transversales** (bruit de kw_hits sur le titre, et il **rate les pivots réels**)\n> → il pose des tags `[Apport fiche #N]` **vides** à nettoyer. ⚠ Ces tags vont dans\n> `concept_cards.notes`, **champ non rendu au lecteur** (cf. étape 7.1) : ils ne valent que comme\n> généalogie. Le **vrai renforcement rendu** passe par `pedago_links` (+ `description` si cadre\n> neuf) à l'étape 7 ; les tags vides hors-sujet sont retirés.\n\n---\n\n### Étape 5 — Intégration refs biblio (étape obligatoire — pas optionnelle)\n\nLe script principal note « N nouvelles refs à intégrer séparément ». **Cette étape ne doit pas rester pendante** — elle doit être faite immédiatement après l'apply via :\n\n```bash\npython3 tools/integration/integrate_fiche_refs.py --fiche-id <N> --md <chemin-md> --apply\n```\n\nLe script :\n- Parse le MD pour extraire toutes les refs biblio (~20-100/fiche)\n- Dedup par DOI normalisé + titre (80 premiers chars lowercase) vs `sources`\n- INSERT les nouvelles refs avec métadonnées minimales (doi, auteurs, année, titre, url, journal, source_docx)\n- Crée les `source_usages` pour TOUTES les refs (citées inline ou présentes en biblio)\n- Audit log\n\nMétadonnées minimales cohérentes avec l'état actuel de `sources` (78% DOI, 86% URL, 5% résumé). Résumés et tags enrichissables plus tard via BQ `wf_source_integration` #129 si la source devient centrale.\n\n`source_usages` est la **source de vérité** pour les liens fiche ↔ ref. Depuis 2026-07-05, le cache d'affichage est la vue `v_fiche_refs` (régénérée à la volée depuis `source_usages` + `sources` — l'ancienne table physique `fiche_contenus.refs` est droppée).\n\n---\n\n### Étape 6 — Audit croisé (rapport documenté)\n\nProduction obligatoire de `jmj/rapports/audit_data/audit_croise_fiche<N>_<date>.md` avec 8 volets :\n\n```\nA. Cards concernées (avec scores overlap, role : pivot / supports / contextualizes)\nB. Chaînes causales traversées (étapes nourries, étapes à enrichir)\nC. Termes thésaurus mobilisés (par strate) + termes candidats (vrais nouveaux vs artefacts parsing) — les vrais nouveaux sont **versés au fichier unique** (`recherches/thesaurus/termes_a_definir.txt`, cf. Étape 7.4)\nD. Autres fiches en recouvrement (redondance / articulation / contradiction)\nE. Contradictions potentielles (vérification manuelle l'agent + JMJ)\nF. Bibliographie (refs liées vs nouvelles, % de matching)\nG. Actions recommandées par priorité (UPDATE cards, alertes fiches en cours, propositions thésaurus, propagation prompts)\nH. Croisement avec les réponses aux questions de sourçage (mécanismes décrits)\n```\n\n**Volet H — ne pas perdre la matière des sourçages (demande JMJ 2026-06-02).**\nLes réponses Jenni aux questions de sourçage (validations) décrivent des\n**mécanismes** riches qui, dans le pipeline actuel, ne sont **pas captés en DB** —\n`integrate_validation_refs` n'extrait que les refs (`source_usages`), pas la prose.\nCette matière ne survit que dans `docx/archives/QS-*.docx` (+ le brief\n`validation_sections.contexte_sci`). L'audit croisé doit donc, pour chaque fiche :\n(1) recenser les sourçages intégrés (`validations.statut=integre`) dont le sujet\nrecoupe la fiche ; (2) **croiser explicitement** les mécanismes décrits (lien réel,\npas forcé — sinon le noter) ; (3) signaler les **croisements à venir** : les\nsourçages `en_cours` que la fiche viendra nourrir une fois intégrés (ex. fiche iode\n↔ #16 *eau du sol* pour le lessivage, ↔ #17 *microbiote intestinal* pour le bout\nsanté du continuum). Depuis 2026-06-02, `integrate_validation_refs` **capte la\nprose-réponse** dans `validation_contenus.contenu_brut` (requêtable) — le volet H\nse nourrit donc directement de la DB (`SELECT contenu_brut FROM validation_contenus\n… WHERE validation_id IN (…)`), plus besoin de re-parser le docx archivé.\n\nMod
